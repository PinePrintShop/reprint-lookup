<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Price-O-Matic mockup v3 — Pine Central</title>
<style>
:root{--bg:#F2F2EE;--surface:#fff;--line:#E6E6E0;--line2:#D4D4CC;--text:#141412;--muted:#80807A;--soft:#F7F7F4;--yellow:#E8E832;--ydk:#C9C92A;--ytint:#FBFBDC;--green:#1e6b45;--amb:#a96b12;
  --sans:Helvetica,Arial,sans-serif;--mono:'Courier New',monospace;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
body{padding:16px 28px 40px;max-width:1560px;margin:0 auto}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.mk-note{font-size:12px;color:var(--muted);margin-bottom:12px}.mk-note b{color:var(--text)}
.top{background:var(--text);border-radius:var(--r);padding:10px 12px 10px 22px;display:flex;align-items:center;gap:22px}
.brand{font-weight:900;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--yellow);white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1}
.tab{background:none;border:none;color:#aaa;font-size:14px;padding:9px 14px;border-radius:8px}
.tab.on{color:var(--text);background:var(--yellow);font-weight:700}
.ghost{background:none;border:1px solid #4a4a44;color:#ddd;border-radius:8px;padding:9px 14px;font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:22px;margin-top:20px;align-items:start}
.panel{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);padding:22px 26px}
.panel+.panel{margin-top:18px}
.sec{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec .n{width:24px;height:24px;border-radius:50%;background:var(--text);color:var(--yellow);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sec h2{font-size:16px;font-weight:700}
.sec .hint{margin-left:auto;font-size:13px;color:var(--muted)}
.sublbl{font-size:12px;color:var(--muted);margin:16px 0 8px}
/* the buttons */
.bts{display:flex;gap:8px;flex-wrap:wrap}
.b{min-width:52px;height:44px;padding:0 16px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;font-size:15px;font-weight:600;color:var(--text);transition:background .1s,border-color .1s}
.b:hover{border-color:var(--text)}
.b.on{background:var(--yellow);border-color:var(--ydk);box-shadow:inset 0 0 0 1px var(--ydk)}
.b.sm{height:36px;font-size:13px;padding:0 12px;min-width:0}
.b.dash{border-style:dashed;color:var(--muted)}
.b.dash:hover{color:var(--text)}
.b small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
/* garment */
.find{display:flex;align-items:center;gap:8px}
.find input{flex:1;min-width:0;height:48px;border:1px solid var(--line2);border-radius:8px;padding:0 14px;font-size:17px;background:var(--soft);outline:none}
.find input:focus{border-color:var(--text);background:#fff}
.find select{height:48px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff;font-size:14px}
.find .go{height:48px;padding:0 22px;border:none;border-radius:8px;background:var(--text);color:#fff;font-weight:700}
.gcard{margin-top:14px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:8px;background:var(--soft)}
.gcard .sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);flex-shrink:0}
.gcard .nm{font-size:16px;font-weight:700}.gcard .sub{font-size:13px;color:var(--muted);margin-top:3px}
.gcard .cost{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.gcard .cost input{width:84px;height:40px;border:1px solid var(--line2);border-radius:8px;font:700 17px var(--mono);text-align:right;padding:0 10px;color:var(--text)}
/* qty */
.qrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qrow input{width:120px;height:44px;border:1px solid var(--line2);border-radius:8px;font:700 20px var(--mono);text-align:center;outline:none}
.qrow input:focus{border-color:var(--text)}
.minnote{font-size:13px;color:var(--muted);margin-left:6px}.minnote.bad{color:#b33;font-weight:700}
/* prints */
.print{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;margin-top:14px}
.print:first-of-type{margin-top:0}
.ph{display:flex;align-items:center;gap:12px}
.ph .t{font-size:17px;font-weight:700}
.ph .p{margin-left:auto;font:700 17px var(--mono)}.ph .p.na{color:var(--amb);font:700 13px var(--sans)}
.ph .x{border:none;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0 2px}
.grid2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 18px;align-items:center;margin-top:14px}
.grid2 .k{font-size:12px;color:var(--muted);width:70px}
.adv{font-size:13px;color:var(--muted);border:none;background:none;text-decoration:underline;text-underline-offset:3px;margin-top:12px}
.note{margin-top:12px;padding:10px 12px;border-radius:8px;background:#fff7e6;color:var(--amb);font-size:13px;font-weight:700}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.addrow .lead{font-size:13px;color:var(--muted);margin-right:4px}
select.inl{height:40px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff;font-size:14px}
/* rail */
.rail{position:sticky;top:16px}
.price .lbl{font-size:13px;color:var(--muted)}
.pp{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.pp input{width:230px;border:none;font:700 50px var(--mono);letter-spacing:-1px;background:none;outline:none;color:var(--text)}
.pp .tot{text-align:right;font-size:13px;color:var(--muted)}.pp .tot b{display:block;font:700 18px var(--mono);color:var(--text)}
.brk{width:100%;border-collapse:collapse;margin-top:16px;font:15px var(--mono)}
.brk td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;color:var(--muted)}
.brk td:first-child{text-align:left;color:var(--text);cursor:pointer}
.brk tr.hl td{background:var(--ytint);color:var(--text);font-weight:700}
.brk tr.below td{text-decoration:line-through;opacity:.5}
.na-msg{color:var(--amb);font-weight:700;font-size:16px;padding:18px 0}
.addq{margin-top:18px;width:100%;height:54px;background:var(--yellow);border:1px solid var(--ydk);border-radius:var(--r);font-weight:900;font-size:16px;letter-spacing:.5px}
.addq:disabled{opacity:.4;cursor:default}
.quote h3{display:flex;justify-content:space-between;font-size:16px;margin-bottom:6px}.quote h3 span{font-size:13px;color:var(--muted);font-weight:400}
.ql{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.ql .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ql .s{font-size:13px;color:var(--muted)}.ql a{color:var(--muted)}
.ql .m{grid-row:1/3;grid-column:2;text-align:right;font:700 15px var(--mono);align-self:center}.ql .m small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.qt{display:flex;justify-content:space-between;padding:14px 0 4px;border-top:2px solid var(--text);font-weight:700;font-size:15px}.qt span:last-child{font:700 20px var(--mono)}
.pdf{margin-top:14px;width:100%;height:48px;background:var(--text);color:#fff;border:none;border-radius:var(--r);font-weight:700;font-size:15px}
.empty{color:var(--muted);font-size:14px;padding:4px 0 2px}
@media(max-width:1180px){.wrap{grid-template-columns:minmax(0,1fr) 380px}body{padding:14px 16px}}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.rail{position:static}.tabs{display:none}.gcard{flex-wrap:wrap}.gcard .cost{margin-left:0}}
</style>
</head>
<body>
<div class="mk-note"><b>Mockup v3</b> — buttons back, calmer look, room to breathe. Real v93 pricing; garment search is faked (try <b>3001</b>, <b>5000</b>, <b>PC54</b>, <b>112</b> cap). Apparel only.</div>
<div class="top">
  <div class="brand">Price-O-Matic</div>
  <div class="tabs"><button class="tab on">Apparel</button><button class="tab">Bandanas</button><button class="tab">Import bandanas</button><button class="tab">Flatstock</button><button class="tab">Patches</button></div>
  <button class="ghost" onclick="if(confirm('Start a new quote?'))location.reload()">New quote</button>
</div>
<div class="wrap">
  <div>
    <div class="panel">
      <div class="sec"><span class="n">1</span><h2>Garment</h2></div>
      <div class="find"><input id="gs" placeholder="Style # or name — 3001, Gildan 5000, PC54…" onkeydown="if(event.key==='Enter')lookup()"><select><option>All vendors</option><option>S&amp;S</option><option>SanMar</option><option>AS Colour</option></select><button class="go" onclick="lookup()">Find</button></div>
      <div id="gbox"></div>
    </div>
    <div class="panel">
      <div class="sec"><span class="n">2</span><h2>Quantity</h2></div>
      <div class="qrow" id="qrow"></div>
    </div>
    <div class="panel">
      <div class="sec"><span class="n">3</span><h2>Prints</h2><span class="hint" id="phint"></span></div>
      <div id="prints"></div>
    </div>
  </div>
  <div class="rail">
    <div class="panel price" id="price"></div>
    <div class="panel quote" id="quote"></div>
  </div>
</div>

/* MATH (ported from POM 9000 sheet, math verified against spreadsheet in v1 tests) */
function computedOverhead(){const o=RATES.overhead;const h=(o.facilityEquipmentPayroll/o.operatingHoursPerMonth)*(1+o.profitabilityGoal);return{singlePressHourCost:(((1-o.utilization)*h)+h)/o.numberOfPresses};}
function supacolorDtfQtyTier(qty,isGang,sheets){const n=isGang?sheets:qty;if(n<10)return 1;if(n<50)return 2;if(n<100)return 3;return 4;}
function supacolorQtyTier(qty,isGang,sheets){const n=isGang?sheets:qty;if(n<20)return 1;if(n<50)return 2;if(n<100)return 3;if(n<200)return 4;if(n<300)return 5;if(n<500)return 6;if(n<1000)return 7;if(n<2500)return 8;if(n<5000)return 9;return 10;}
function supacolorTransferCost(recipe,size,qty,imprintsPerGang){const isGang=size.includes('GANG');const sheets=qty/(imprintsPerGang||1);if(recipe==='SupaDTF'){const dsi=RATES.supacolorDtfSizes.indexOf(size);if(dsi<0)return null;const dt=supacolorDtfQtyTier(qty,isGang,sheets);const dp=RATES.supacolorDtf[dt-1][dsi];return dp==='NA'?null:dp;}const m=RATES.supacolor[recipe];if(!m)return null;const si=RATES.supacolorSizes.indexOf(size);if(si<0)return null;const tier=supacolorQtyTier(qty,isGang,sheets);const p=m[tier-1][si];return p==='NA'?null:p;}
function decopressQtyTier(qty){if(qty<50)return 1;if(qty<100)return 2;if(qty<200)return 3;if(qty<300)return 4;if(qty<500)return 5;if(qty<1000)return 6;if(qty<2500)return 7;if(qty<5000)return 8;return 9;}
function decopressTransferCost(mat,size,qty){const m=RATES.decopress[mat];if(!m)return null;const si=RATES.decopressSizes.indexOf(size);if(si<0)return null;const v=m[decopressQtyTier(qty)-1][si];return (typeof v==='number')?v:null;}
function embroideryQtyBand(qty){if(qty<50)return'25-49';if(qty<75)return'50-74';if(qty<100)return'75-99';if(qty<150)return'100-149';if(qty<300)return'150-299';if(qty<500)return'300-499';return'500+';}
function embroideryPrice(qty,band){return(RATES.embroidery[embroideryQtyBand(qty)]&&RATES.embroidery[embroideryQtyBand(qty)][band])||0;}
// v31: per-imprint underbase. Adds 1 screen for both pricing and min-qty when on.
function effectiveScreens(imp){
  if(!imp||imp.type!=='Screenprint')return Number(imp&&imp.screens)||0;
  return (Number(imp.screens)||0) + (imp.underbase?1:0);
}
function totalSetups(s){
  // v41: each effective screen (Screenprint colors + underbase) AND each Supa location
  // contributes 1 toward the total setup count. The min-qty formula then runs on this total.
  // Deco / Emb / Tag don't yet contribute (they use different rules — extend here if Pine
  // wants them in the formula later).
  return (s.impressions||[]).reduce((sum,imp)=>{
    if(!imp||!imp.type)return sum;
    if(imp.type==='Screenprint')return sum+effectiveScreens(imp);
    if(imp.type==='Supacolor')  return sum+1; // one Supa imp = one location = one setup
    return sum;
  },0);
}
function apparelMinQty(s){
  // 25 + 10 * (totalSetups - 1). When no Screen/Supa imps in the quote, no min applies (returns 0).
  const t=totalSetups(s);
  if(t<=0)return 0;
  return 25 + 10*(t-1);
}
function priceScreenprint(imp,qty){const o=RATES.overhead;const{singlePressHourCost}=computedOverhead();const s=effectiveScreens(imp);const ic=Number(imp.inkChanges)||0;const pt=imp.printType||'Tees / Totes';const fi=Math.min(qty,Math.max(0,Number(imp.fleeceImpressions)||0));const setup=(o.setupTakedownMinPerScreen/60)*s;let iph;if(pt==='Combined')iph=((fi/qty)*RATES.impressionsPerHour['Fleece'])+(((qty-fi)/qty)*RATES.impressionsPerHour['Tees / Totes']);else iph=RATES.impressionsPerHour[pt]||RATES.impressionsPerHour['Tees / Totes'];const run=qty/iph;const printP=(run+setup)*singlePressHourCost;const inkF=(o.inkChangeFee*ic)/qty;return(printP/qty)+inkF;}
function priceSupacolor(imp,qty){const t=supacolorTransferCost(imp.supRecipe||'Wearable',imp.supSize||'4 X 4',qty,Number(imp.supImprintsPerGang)||1);if(t==null)return null;const g=Number(imp.supImprintsPerGang)||1;const pp=(t/g)+(RATES.supacolorInboundShipping/qty)+(0.25*(g-1));return RATES.supacolorPressFee+(pp*(1+RATES.supacolorMarkup));}
function priceDecopress(imp,qty){const t=decopressTransferCost(imp.decoMaterial||'Sim Woven / Twill',imp.decoSize||'2.5 X 2.5',qty);if(t==null)return null;const pp=t+(RATES.decopressInboundShipping/qty);const fee=(imp.decoApplication==='Embroidery')?3.75:4.25;return fee+(pp*(1+RATES.decopressMarkup));}
function priceEmbroidery(imp,qty){return embroideryPrice(qty,imp.embStitchBand||'Up to 5,000');}
function priceSizeTag(imp,qty,is1C){const sheets=Math.max(10,Math.ceil(qty/12));const tier=supacolorQtyTier(sheets,true,sheets);const m=RATES.supacolor[is1C?'1C Wearable':'Wearable'];const sp=m[tier-1][10];if(sp==='NA'||typeof sp!=='number')return null;return(sp/12)+RATES.sizeTagCutPressFee;}
function impressionPrice(imp,qty){if(!imp||!imp.type||qty<1)return 0;switch(imp.type){case'Screenprint':return priceScreenprint(imp,qty);case'Supacolor':return priceSupacolor(imp,qty);case'Decopress':return priceDecopress(imp,qty);case'Embroidery':return priceEmbroidery(imp,qty);case'Size Tags 1C':return priceSizeTag(imp,qty,true);default:return 0;}}
function garmentPricing(s){const c=Number(s.garmentCost)||0;const fl=s.fleece?0.50:0;const sh=!s.shipping?0:(s.fleece?1.50:0.65);const as=s.asColourLow?c*0.06:0;return(c*1.10)+fl+sh+as;}
function computeApparelAt(qty,s){const imps=s.impressions.map(i=>impressionPrice(i,qty));if(imps.some(p=>p==null||!isFinite(p)))return null;/* v93: an NA transfer used to price at $0 */const impSum=imps.reduce((a,b)=>a+b,0);const garment=garmentPricing(s);const subtotal=garment+impSum;const grossedUp=subtotal/0.97;const pricePerPiece=Math.round(grossedUp/0.05)*0.05;return{impPrices:imps,garmentPrice:garment,subtotal,pricePerPiece,lineTotal:pricePerPiece*qty};}

    if(im.type==='Screenprint'){
      h+='<button class="adv" onclick="S.open['+i+']=!S.open['+i+'];render()">'+(S.open[i]?'Hide extras':'Ink changes, fleece or mixed run…')+'</button>';
      if(S.open[i]) h+='<div class="grid2"><span class="k">Ink changes</span><div class="bts">'+[0,1,2,3].map(n=>B(n?String(n):'None',im.inkChanges===n,"set("+i+",'inkChanges',"+n+")",'sm')).join('')+'</div><span class="k">Printed on</span><div class="bts">'+[['Tees / Totes','Tees & totes'],['Fleece','Fleece'],['Combined','Mixed run']].map(([v,l])=>B(l,im.printType===v,"set("+i+",'printType','"+v+"')",'sm')).join('')+'</div></div>';
    }
    if(p==null) h+='<div class="note">'+lbl(im)+' isn\'t offered at '+Q()+' pcs — pick another size or quantity.</div>';
    h+='</div>';
  });
  if(S.impressions.length<4){ const used=S.impressions.map(x=>x.loc); h+='<div class="addrow"><span class="lead">Add a print</span>'+['Back','Left chest','Left sleeve','Size tag'].filter(l=>used.indexOf(l)<0).map(l=>B('+ '+l,false,"add('"+l+"')",'sm dash')).join('')+B('+ Other',false,"add('Other')",'sm dash')+'</div>'; }
  $('prints').innerHTML=h;
  $('phint').textContent=S.impressions.length===1?'Most quotes: one front print, 1–3 colors':'';
}
function set(i,f,v){ if(f==='loc'&&!v)return; S.impressions[i][f]=v; if(f==='loc'&&v==='Size tag')S.impressions[i].type='Size Tags 1C'; if(f==='type'&&S.impressions[i].loc==='Size tag'&&v!=='Size Tags 1C')S.impressions[i].loc='Front'; render(); }
function add(l){ S.impressions.push(imp({loc:l,type:l==='Size tag'?'Size Tags 1C':(S.g&&S.g.cat==='cap'?'Embroidery':'Screenprint')})); render(); }
function del(i){ S.impressions.splice(i,1); render(); }
function renderPrice(){
  const q=Q(), c=computeApparelAt(q,S), mq=apparelMinQty(S);
  let h='';
  if(!c){ const bad=S.impressions.find(i=>impressionPrice(i,q)==null); h='<div class="lbl">Price per piece</div><div class="na-msg">'+(bad?lbl(bad)+' isn\'t offered at '+q+' pcs':'No price')+'</div>'; }
  else{
    const u=c.pricePerPiece+S.delta;
    h='<div class="lbl">Price per piece'+(S.qty?'':' · preview at 48 pcs')+(S.garmentCost?'':' · no garment yet')+'</div><div class="pp"><input id="bp" value="'+money(u)+'" title="Type a price to adjust"><div class="tot">'+q+' pcs<b>'+money(u*q)+'</b></div></div>';
    if(S.delta) h+='<div style="font-size:13px;color:var(--muted)">Adjusted '+(S.delta>0?'+':'')+S.delta.toFixed(2)+'/pc · <a href="#" onclick="S.delta=0;render();return false">reset</a></div>';
    const bs=[...new Set([q,r25(q*1.5),r25(q*2),r25(q*3)])].filter(x=>x>0);
    h+='<table class="brk">'+bs.map(b=>{const cb=computeApparelAt(b,S);return '<tr class="'+(b===q?'hl':'')+(mq&&b<mq?' below':'')+'"><td onclick="setQty('+b+')">'+b+' pcs</td>'+(cb?'<td>'+money(cb.pricePerPiece+S.delta)+'</td><td>'+money((cb.pricePerPiece+S.delta)*b)+'</td>':'<td colspan="2">not offered</td>')+'</tr>';}).join('')+'</table>';
  }
  h+='<button class="addq" onclick="addQ()"'+(c&&S.qty?'':' disabled')+'>'+(S.qty?'Add to quote':'Pick a quantity to add')+'</button>';
  $('price').innerHTML=h; const bp=$('bp'); if(bp) bp.onchange=e=>{const v=Number(String(e.target.value).replace(/[^0-9.]/g,''));if(v>0){S.delta=v-c.pricePerPiece;render();}};
}
function addQ(){ const c=computeApparelAt(S.qty,S); if(!c) return; const g=S.g&&!S.g.err?S.g:null;
  S.cart.push({name:g?g.name:'Garment '+money(S.garmentCost),sum:S.impressions.map(lbl).join(' · '),qty:S.qty,unit:c.pricePerPiece+S.delta}); S.delta=0; render(); }
function renderQuote(){
  let h='<h3>Quote <span>'+(S.cart.length?S.cart.length+' line'+(S.cart.length>1?'s':''):'')+'</span></h3>';
  if(!S.cart.length) h+='<div class="empty">Each line you add lands here. One PDF for the whole quote.</div>';
  S.cart.forEach((l,i)=>{ h+='<div class="ql"><div class="n">'+l.name+'</div><div class="m">'+money(l.unit*l.qty)+'<small>'+l.qty+' × '+money(l.unit)+'</small></div><div class="s">'+l.sum+' · <a href="#" onclick="S.cart.splice('+i+',1);render();return false">remove</a></div></div>'; });
  if(S.cart.length){ const t=S.cart.reduce((a,l)=>a+l.unit*l.qty,0); h+='<div class="qt"><span>Total</span><span>'+money(t)+'</span></div><button class="pdf" onclick="alert(\'Mockup: the real app builds the PDF here.\')">Quote PDF</button>'; }
  $('quote').innerHTML=h;
}
function render(){ renderG(); renderQ(); renderPrints(); renderPrice(); renderQuote(); }
render();
</script>
