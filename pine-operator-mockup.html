<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operator Flow Mockup</title>
<style>
/* ============================================================
   PINE OPERATOR — flow mockup (sample data, saves nothing)
   One screen per press: Now (current job + one big next-step button)
   on the left, Up next on the right. Crew in the header, set once per shift.
   Plan: notes/operator-app.md
   ============================================================ */
:root{
  --bg:#F2F2EE; --surface:#fff; --soft:#F8F8F5; --border:#E5E5E0; --border-dk:#D0D0CA;
  --text:#0D0D0B; --muted:#888880; --muted-lt:#BBBBB5; --ink:#0A0A08; --ink2:#1A1A16;
  --yellow:#E8E832; --green:#1e6b45; --green-lt:#e8f5ee; --red:#c0392b; --red-bg:#fdf2f2;
  --amb:#b7791f; --amb-bg:#fffbeb; --amb-bd:#fde68a;
  --sans:Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}

/* header */
.hd{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff;flex-shrink:0}
.press{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:.02em;text-transform:uppercase}
.press b{background:var(--yellow);color:var(--ink);border-radius:6px;padding:3px 8px;font-size:14px}
.press button{color:#aaa;font-size:12px;font-weight:700;border:1px solid #444;border-radius:14px;padding:3px 9px}
.crew{display:flex;align-items:center;gap:6px;margin-left:12px;flex-wrap:wrap}
.cp{font-size:12px;font-weight:700;border-radius:14px;padding:4px 10px;background:#222;color:var(--yellow);border:1px solid #444}
.cp.qc{background:#fff;color:var(--ink);border-color:#fff}
.crew .chg{color:#aaa;font-size:12px;font-weight:700;text-decoration:underline}
.hd .sp{flex:1}
.mock{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--yellow);border-radius:12px;padding:3px 8px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:#bbb}
.sync i{width:8px;height:8px;border-radius:50%;background:#3ccf7a;display:inline-block}
.clock{font-size:14px;font-weight:700;color:#ddd;font-variant-numeric:tabular-nums}

/* body: Now | Up next */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px 16px}
.now{background:var(--surface);border:1px solid var(--border);border-radius:12px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;min-height:0}
.nowhd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.nowhd .lbl{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.nowhd .imp{font-size:24px;font-weight:800}
.nowhd .cust{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase}
.nowhd .ord{margin-left:auto;font-size:28px;font-weight:800}
.nowbody{display:grid;grid-template-columns:minmax(0,1fr) 250px;min-height:0}
.mockimg{background:#2a2a26;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.mockimg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.mockimg .tap{position:absolute;bottom:10px;right:10px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border-radius:12px;padding:4px 9px}
.facts{padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden;border-left:1px solid var(--border)}
.fact{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid var(--border);padding-bottom:6px}
.fact span{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.fact b{text-align:right}
.inks{display:flex;gap:4px;flex-wrap:wrap}
.ink{width:22px;height:22px;border-radius:50%;border:1px solid var(--border-dk)}
.note{font-size:12px;background:var(--amb-bg);border:1px solid var(--amb-bd);border-radius:6px;padding:7px 8px}
.note b{display:block;font-size:10px;letter-spacing:.06em;color:var(--amb);text-transform:uppercase}
.heads{font-size:12px;border-radius:6px;padding:7px 8px;background:var(--soft);border:1px solid var(--border)}
.heads.miss{background:var(--red-bg);border-color:#f5c6c6;color:var(--red);font-weight:700}

/* stepper + action */
.act{border-top:1px solid var(--border);padding:12px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--soft)}
.steps{display:flex;gap:4px;grid-column:1/-1}
.step{flex:1;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 4px;border-radius:6px;background:var(--border);color:var(--muted)}
.step.done{background:var(--green-lt);color:var(--green)}
.step.on{background:var(--ink);color:var(--yellow)}
.timer{min-width:200px}
.timer .t{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.timer .tl{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.btns{display:flex;gap:10px;justify-content:flex-end}
.big{background:var(--yellow);color:var(--ink);font-weight:800;font-size:22px;border-radius:10px;padding:20px 26px;min-width:300px;box-shadow:inset 0 0 0 2px var(--ink)}
.big:active{transform:translateY(1px)}
.sec{background:#fff;font-weight:800;font-size:16px;border-radius:10px;padding:20px 18px;border:2px solid var(--border-dk)}
.sec.red{border-color:var(--red);color:var(--red)}
.sum{display:flex;gap:10px}
.sum div{background:var(--ink);color:#fff;border-radius:8px;padding:8px 14px}
.sum small{display:block;font-size:10px;color:#aaa;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.sum b{font-size:22px;color:var(--yellow)}

/* up next */
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.sidehd{display:flex;align-items:baseline;gap:8px}
.sidehd h3{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.sidehd span{font-size:12px;color:var(--muted)}
.queue{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.q{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:left}
.q img{width:52px;height:52px;object-fit:cover;border-radius:6px;background:var(--soft)}
.q .a{font-weight:800;font-size:14px}
.q .b{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .c{text-align:right;font-size:12px;font-weight:800}
.q .c small{display:block;color:var(--muted);font-weight:700}
.q.next{border:2px solid var(--ink)}
.q.next .tagnext{font-size:9px;font-weight:800;letter-spacing:.08em;background:var(--yellow);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}
.q.more{justify-content:center;display:flex;font-weight:800;font-size:13px;color:var(--muted)}
.donebox{margin-top:auto;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.donebox small{display:block;color:#aaa;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.donebox b{font-size:20px;color:var(--yellow)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,10,8,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.card{background:#fff;border-radius:14px;padding:22px;max-width:640px;width:100%}
.card h2{font-size:22px;margin-bottom:6px}
.card p{color:var(--muted);margin-bottom:14px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:2px solid var(--border-dk);border-radius:22px;padding:11px 18px;font-weight:700;font-size:16px;background:#fff}
.chip.on{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
.chip.qc.on{background:var(--yellow);color:var(--ink)}
.role{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:6px 0}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.presses{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.presses button{border:2px solid var(--border-dk);border-radius:12px;padding:18px 12px;font-weight:800;font-size:17px;background:#fff;text-align:left}
.presses button small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.presses button.on{border-color:var(--ink);background:var(--ink);color:var(--yellow)}

/* run mode */
.run{position:fixed;inset:0;background:var(--ink);z-index:40;display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:#fff}
.runhd{display:flex;align-items:center;gap:12px;padding:12px 16px}
.runhd .imp{font-size:22px;font-weight:800}
.runhd .st{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:12px;padding:4px 10px;background:#3ccf7a;color:var(--ink)}
.runhd .st.p{background:var(--amb);color:#fff}
.runhd .x{margin-left:auto;color:#888;font-size:22px}
.runimg{display:flex;align-items:center;justify-content:center;min-height:0;padding:0 16px}
.runimg img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:6px}
.runbar{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--ink2)}
.runbar .t{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--yellow)}
.runbar .tl{font-size:11px;color:#aaa;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.runbar .sp{flex:1}
.rb{font-weight:800;font-size:20px;border-radius:10px;padding:20px 26px;min-width:190px}
.rb.end{background:var(--yellow);color:var(--ink)}
.rb.pause{background:#2b2b26;color:#fff;border:2px solid #555}
.reasons{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.reasons button{background:#2b2b26;color:#fff;border:2px solid #555;border-radius:22px;padding:12px 16px;font-weight:700}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;opacity:0;transition:opacity .2s;z-index:99;pointer-events:none}
.toast.show{opacity:1}
/* portrait iPad: mockup on top, facts as a strip, Up next as a 2-column grid of 4 */
@media (max-width:1000px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .nowbody{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .facts{border-left:none;border-top:1px solid var(--border);flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 14px}
  .fact{border:none;padding:0;gap:6px;align-items:center}
  .facts .heads,.facts .note{flex:1 1 100%;padding:5px 8px}
  .queue{display:grid;grid-template-columns:1fr 1fr}
  .side{gap:8px}
  .big{min-width:0;flex:1}
}
</style>
</head>
<body>
<div class="hd">
  <span class="press" id="pressName"></span>
  <span class="crew" id="crew"></span>
  <span class="sp"></span>
  <span class="mock">Mockup · sample data</span>
  <span class="sync"><i></i>Saved</span>
  <span class="clock" id="clock"></span>
</div>
<div class="main">
  <section class="now" id="now"></section>
  <aside class="side" id="side"></aside>
</div>
<div class="run hidden" id="run"></div>
<div class="ov hidden" id="ov"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- sample data ---------- */
var PRESSES=[{id:'p1',name:'ROQ NEXT',sub:'Press 1',heads:true},{id:'p2',name:'ROQ YOU',sub:'Press 2',heads:true},{id:'ht',name:'HEAT PRESS',sub:'Heat transfer',heads:false},{id:'em',name:'TAJIMA',sub:'Embroidery',heads:false},{id:'fs',name:'FLATSTOCK',sub:'Flatstock',heads:true}];
var PEOPLE=['Alex','Sam','Jo','Chris','Pat','Riley','Morgan'];
var IMG=['samples/proof-90001-A-large.png','samples/proof-90002-A-large.png','samples/proof-90002-B-large.png','samples/proof-90003-A-large.png','samples/proof-90003-B-large.png','samples/proof-90003-C-large.png','samples/proof-90005-A-large.png'];
var INKS={'White':'#fff','Black':'#111','Red 186':'#c8102e','Navy':'#1f2a44','Gold':'#d4a017','Grey':'#8a8d8f','Royal':'#2a4bb5'};
var JOBS=[
 {id:'j1',imp:'90001-A',ord:'90001',cust:'Sample Co A',time:'8:00',qty:144,scr:3,loc:'Front',inks:['White','Red 186','Navy'],heads:true,note:'Customer approved the darker red.'},
 {id:'j2',imp:'90002-A',ord:'90002',cust:'Sample Co B',time:'9:30',qty:72,scr:2,loc:'Front',inks:['Black','Gold'],heads:false},
 {id:'j3',imp:'90002-B',ord:'90002',cust:'Sample Co B',time:'10:15',qty:72,scr:1,loc:'Back',inks:['Black'],heads:true},
 {id:'j4',imp:'90003-A',ord:'90003',cust:'Sample Co C',time:'11:00',qty:300,scr:4,loc:'Front',inks:['White','Royal','Gold','Black'],heads:true},
 {id:'j5',imp:'90003-B',ord:'90003',cust:'Sample Co C',time:'1:00',qty:300,scr:1,loc:'Sleeve',inks:['White'],heads:false},
 {id:'j6',imp:'90003-C',ord:'90003',cust:'Sample Co C',time:'1:45',qty:120,scr:2,loc:'Front',inks:['Grey','Black'],heads:true},
 {id:'j7',imp:'90005-A',ord:'90005',cust:'Sample Co E',time:'2:30',qty:48,scr:2,loc:'Front',inks:['Navy','White'],heads:true},
 {id:'j8',imp:'90003-D',ord:'90003',cust:'Sample Co C',time:'3:15',qty:26,scr:1,loc:'Front',inks:['White'],heads:false}];
JOBS.forEach(function(j,i){ j.img=IMG[i%IMG.length]; });
var REASONS=['Ink change','Screen issue','Registration','Misprint','Waiting on garments','Break','Other'];

/* ---------- state (kept on this iPad, so a refresh/sleep never loses it) ---------- */
var S=load()||{press:null, crew:null, cur:'j1', phase:'idle', t0:null, acc:0, setupMs:0, runMs:0, done:{}, pieces:0, reason:''};
function save(){ try{ localStorage.setItem('opmock',JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem('opmock')||'null'); }catch(e){ return null; } }
function $(id){ return document.getElementById(id); }
function job(id){ return JOBS.filter(function(j){return j.id===id;})[0]; }
function press(){ return PRESSES.filter(function(p){return p.id===S.press;})[0]; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2400); }
function elapsed(){ return S.acc+(S.t0?Date.now()-S.t0:0); }
function fmt(ms){ var s=Math.floor(ms/1000); return Math.floor(s/3600)+':'+('0'+Math.floor(s%3600/60)).slice(-2)+':'+('0'+s%60).slice(-2); }
function queue(){ return JOBS.filter(function(j){ return !S.done[j.id] && j.id!==S.cur; }); }
function nextJob(){ return queue()[0]; }

/* phases: idle → setup → review → (fix → setup) → approved → run ⇄ paused → done */
var STEPS=[['Setup',['setup','review','fix']],['Approve',['approved']],['Run',['run','paused']],['Done',['done']]];
function stepper(){ var idx=-1; STEPS.forEach(function(s,i){ if(s[1].indexOf(S.phase)>=0) idx=i; });
  return '<div class="steps">'+STEPS.map(function(s,i){ return '<div class="step'+(i<idx||S.phase==='done'?' done':i===idx?' on':'')+'">'+(i<idx||S.phase==='done'?'✓ ':'')+s[0]+'</div>'; }).join('')+'</div>'; }

/* ---------- render ---------- */
function render(){
  if(!S.press){ pickPress(); return; }
  if(!S.crew){ pickCrew(); return; }
  var p=press(); $('pressName').innerHTML='<b>'+esc(p.sub.replace('Press ','P'))+'</b>'+esc(p.name)+' <button onclick="pickPress()">switch</button>';
  $('crew').innerHTML=S.crew.ops.map(function(n){return '<span class="cp">'+esc(n)+'</span>';}).join('')+(S.crew.qc?'<span class="cp qc">QC · '+esc(S.crew.qc)+'</span>':'')+'<button class="chg" onclick="pickCrew()">Change</button>';
  renderNow(); renderSide(); renderRun();
}
function renderNow(){
  var j=job(S.cur), p=press();
  if(!j){ $('now').innerHTML='<div style="padding:40px;text-align:center;font-size:20px;font-weight:800">All done for today 🎉</div>'; return; }
  var headsInfo=!p.heads?'':j.heads?'<div class="heads">⚙ Head settings saved · '+j.scr+' screens</div>':'<div class="heads miss">⚙ No head settings yet — you\'ll set them at Start Setup</div>';
  var tl={idle:'Ready',setup:'Setup time',review:'Setup time',fix:'Fix time',approved:'Setup time',run:'Run time',paused:'Paused at',done:'Run time'}[S.phase];
  var tval=S.phase==='done'?S.runMs:S.phase==='approved'||S.phase==='review'?S.setupMs:elapsed();
  var b='';
  if(S.phase==='idle') b='<button class="big" onclick="startSetup()">⚙ Start setup</button>';
  if(S.phase==='setup') b='<button class="big" onclick="go(\'review\')">✓ Setup done</button>';
  if(S.phase==='review') b='<button class="sec red" onclick="go(\'fix\')">✗ Fix needed</button><button class="big" onclick="approve()">✓ Approved — start run ▸</button>';
  if(S.phase==='fix') b='<button class="big" onclick="go(\'setup\')">↻ Fixed — back to setup</button>';
  if(S.phase==='paused'||S.phase==='run') b='<button class="big" onclick="openRun()">▶ Back to run screen</button>';
  if(S.phase==='done'){ var n=nextJob(); b='<div class="sum"><div><small>Setup</small><b>'+fmt(S.setupMs)+'</b></div><div><small>Run</small><b>'+fmt(S.runMs)+'</b></div><div><small>Pieces</small><b>'+j.qty+'</b></div></div>'
      +(n?'<button class="big" onclick="startNext()">Next: '+esc(n.imp)+' — start setup ▸</button>':'<button class="big" onclick="startNext()">Finish for today ✓</button>'); }
  $('now').innerHTML='<div class="nowhd"><div><div class="lbl">Now · '+esc(j.time)+'</div><div class="imp">'+esc(j.imp)+'</div></div><div class="cust">'+esc(j.cust)+'</div><div class="ord">'+esc(j.ord)+'</div></div>'
    +'<div class="nowbody"><div class="mockimg"><img src="'+j.img+'" alt="mockup"><span class="tap">tap to zoom</span></div>'
    +'<div class="facts"><div class="fact"><span>Pieces</span><b>'+j.qty+'</b></div><div class="fact"><span>Screens</span><b>'+j.scr+'</b></div><div class="fact"><span>Location</span><b>'+esc(j.loc)+'</b></div>'
    +'<div class="fact"><span>Inks</span><b class="inks">'+j.inks.map(function(k){return '<i class="ink" title="'+esc(k)+'" style="background:'+INKS[k]+'"></i>';}).join('')+'</b></div>'
    +headsInfo+(j.note?'<div class="note"><b>Note</b>'+esc(j.note)+'</div>':'')+'</div></div>'
    +'<div class="act">'+stepper()+'<div class="timer"><div class="t" id="tmain">'+fmt(tval)+'</div><div class="tl">'+tl+'</div></div><div class="btns">'+b+'</div></div>';
}
function renderSide(){
  var q=queue(), doneN=Object.keys(S.done).length, pcs=0; Object.keys(S.done).forEach(function(id){ pcs+=job(id).qty; });
  var lim=innerWidth<1000?4:6, shown=q.slice(0,lim);
  $('side').innerHTML='<div class="sidehd"><h3>Up next</h3><span>'+q.length+' job'+(q.length!==1?'s':'')+'</span></div><div class="queue">'
    +shown.map(function(j,i){ return '<button class="q'+(i===0?' next':'')+'" onclick="pickJob(\''+j.id+'\')"><img src="'+j.img+'" alt=""><span><span class="a">'+esc(j.imp)+(i===0?'<span class="tagnext">NEXT</span>':'')+'</span><br><span class="b">'+esc(j.cust)+' · '+j.scr+'C · '+esc(j.loc)+'</span></span><span class="c">'+j.qty+'<small>'+esc(j.time)+'</small></span></button>'; }).join('')
    +(q.length>lim?'<button class="q more" onclick="allJobs()">+ '+(q.length-lim)+' more</button>':'')+'</div>'
    +'<div class="donebox"><div><small>Done today</small><b>'+doneN+' job'+(doneN!==1?'s':'')+'</b></div><div style="text-align:right"><small>Pieces</small><b>'+pcs+'</b></div></div>';
}
/* ---------- actions ---------- */
function go(ph){
  if(S.phase==='setup'&&ph==='review'){ S.setupMs+=elapsed(); S.acc=0; S.t0=null; }
  if(S.phase==='fix'&&ph==='setup'){ S.acc=0; }
  S.phase=ph; if(ph==='setup'||ph==='fix'){ S.t0=Date.now(); S.acc=ph==='setup'?0:0; }
  save(); render();
}
function startSetup(){ var j=job(S.cur);
  if(press().heads && !j.heads){ modal('<h2>Set the heads for '+esc(j.imp)+'?</h2><p>No head settings are saved for this job yet. Setting them now (while you set up) means End Run never interrupts you.</p>'
    +'<div class="row"><button class="sec" onclick="closeOv();go(\'setup\')">Skip for now</button><button class="big" onclick="closeOv();j_heads();go(\'setup\')">⚙ Set heads</button></div>'); return; }
  go('setup'); }
function j_heads(){ job(S.cur).heads=true; toast('Press Setup would open here (head cards) — marked as saved for the mockup'); }
function approve(){ S.phase='run'; S.acc=0; S.t0=Date.now(); save(); render(); openRun(); }
function startNext(){ if(S.cur) S.done[S.cur]=1; var n=nextJob(); S.cur=n?n.id:null; S.phase='idle'; S.acc=0; S.t0=null; S.setupMs=0; S.runMs=0; save(); render(); }
function pickJob(id){
  var live=['setup','review','fix','approved','run','paused'].indexOf(S.phase)>=0;
  if(live){ modal('<h2>'+esc(job(S.cur).imp)+' is in progress</h2><p>Finish or pause it before switching, so its setup and run time aren\'t lost.</p><div class="row"><button class="big" onclick="closeOv()">OK</button></div>'); return; }
  if(S.phase==='done') S.done[S.cur]=1;
  S.cur=id; S.phase='idle'; S.acc=0; S.t0=null; S.setupMs=0; S.runMs=0; save(); render(); toast(job(id).imp+' is now up'); }
function allJobs(){ modal('<h2>Today on '+esc(press().name)+'</h2>'+queue().map(function(j){ return '<button class="q" style="width:100%;margin-bottom:6px" onclick="closeOv();pickJob(\''+j.id+'\')"><img src="'+j.img+'"><span><span class="a">'+esc(j.imp)+'</span><br><span class="b">'+esc(j.cust)+'</span></span><span class="c">'+j.qty+'<small>'+esc(j.time)+'</small></span></button>'; }).join('')+'<div class="row"><button class="sec" onclick="closeOv()">Close</button></div>'); }

/* run screen */
function openRun(){ $('run').classList.remove('hidden'); renderRun(); }
function renderRun(){ var r=$('run'); if(r.classList.contains('hidden')) return; var j=job(S.cur);
  var paused=S.phase==='paused';
  r.innerHTML='<div class="runhd"><span class="imp">'+esc(j.imp)+'</span><span>'+esc(j.cust)+' · '+j.qty+' pcs</span><span class="st'+(paused?' p':'')+'">'+(paused?'Paused · '+esc(S.reason):'Running')+'</span><button class="x" onclick="$(\'run\').classList.add(\'hidden\');render()" title="Back to the press screen (the run keeps going)">✕</button></div>'
    +'<div class="runimg"><img src="'+j.img+'" alt="mockup"></div>'
    +'<div class="runbar" id="runbar"><div><div class="t" id="trun">'+fmt(elapsed())+'</div><div class="tl">'+(paused?'Paused at':'Run time')+'</div></div><span class="sp"></span>'
    +(paused?'<button class="rb pause" onclick="resume()">▶ Resume</button>':'<button class="rb pause" onclick="pause()">⏸ Pause</button>')
    +'<button class="rb end" onclick="endRun()">✓ End run</button></div>'; }
function pause(){ var bar=$('runbar'); bar.innerHTML='<div class="reasons">'+REASONS.map(function(x){ return '<button onclick="doPause(\''+x+'\')">'+x+'</button>'; }).join('')+'</div><button class="rb pause" onclick="renderRun()">Cancel</button>'; }
function doPause(r){ S.acc=elapsed(); S.t0=null; S.phase='paused'; S.reason=r; save(); renderRun(); render(); }
function resume(){ S.t0=Date.now(); S.phase='run'; S.reason=''; save(); renderRun(); render(); }
function endRun(){ if(S.phase!=='run'&&S.phase!=='paused') return; S.runMs=elapsed(); S.t0=null; S.acc=0; S.phase='done'; save(); $('run').classList.add('hidden'); render(); toast('✓ Run complete — '+fmt(S.runMs)); }

/* first launch: which press is this iPad? then crew (once per shift) */
function pickPress(){ modal('<h2>Which press is this iPad on?</h2><p>Asked once. After this the iPad opens straight to its press.</p><div class="presses">'
  +PRESSES.map(function(p){ return '<button class="'+(S.press===p.id?'on':'')+'" onclick="S.press=\''+p.id+'\';save();closeOv();render()">'+esc(p.name)+'<small>'+esc(p.sub)+'</small></button>'; }).join('')+'</div>'); }
function pickCrew(){ var c=S.crew||{ops:[],qc:''};
  window._crew={ops:c.ops.slice(), qc:c.qc};
  modal('<h2>Who\'s on '+esc(press().name)+' this shift?</h2><p>Set once per shift — it stays through refreshes and sleep.</p><div class="role">Press ops</div><div class="chips" id="cops"></div><div class="role">Quality control</div><div class="chips" id="cqc"></div><div class="row"><button class="big" onclick="saveCrew()">Start shift ▸</button></div>'); paintCrew(); }
function paintCrew(){ var c=window._crew;
  $('cops').innerHTML=PEOPLE.map(function(n){ return '<button class="chip'+(c.ops.indexOf(n)>=0?' on':'')+'" onclick="togOp(\''+n+'\')">'+n+'</button>'; }).join('');
  $('cqc').innerHTML=PEOPLE.map(function(n){ return '<button class="chip qc'+(c.qc===n?' on':'')+'" onclick="window._crew.qc=(window._crew.qc===\''+n+'\'?\'\':\''+n+'\');paintCrew()">'+n+'</button>'; }).join(''); }
function togOp(n){ var o=window._crew.ops, i=o.indexOf(n); if(i>=0) o.splice(i,1); else o.push(n); paintCrew(); }
function saveCrew(){ if(!window._crew.ops.length){ toast('Pick at least one press op'); return; } S.crew=window._crew; save(); closeOv(); render(); }
function modal(h){ $('ov').innerHTML='<div class="card">'+h+'</div>'; $('ov').classList.remove('hidden'); }
function closeOv(){ $('ov').classList.add('hidden'); }

setInterval(function(){ var d=new Date(); $('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  var t=$('tmain'); if(t && ['setup','fix','run'].indexOf(S.phase)>=0) t.textContent=fmt(elapsed()); var tr=$('trun'); if(tr && S.phase==='run') tr.textContent=fmt(elapsed()); },1000);
window.addEventListener('resize',function(){ if(S.press&&S.crew) renderSide(); });
render();
</script>
</body>
</html>
