<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damage Log v6 — Pine Central</title>
<link rel="stylesheet" href="pine-design-v1.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
.top{background:var(--sb-bg);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.top h1{font-family:var(--cond);font-size:18px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.top h1 span{color:var(--yellow)}
.ver{font-family:var(--cond);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--yellow);border:1px solid #333;border-radius:3px;padding:2px 6px}
.top .sp{flex:1}
.tbtn{background:transparent;border:1px solid #444;color:#ddd;border-radius:var(--radius);font:700 11px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:7px 11px;cursor:pointer}
.tbtn:hover{border-color:#fff;color:#fff}
.tbtn.on{background:var(--amb-bg);border-color:var(--amb-bd);color:var(--amb)}
.tok{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--bg-soft);border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:12px}
.tok input{flex:1;min-width:220px;padding:7px 9px;border:1px solid var(--border-dk);border-radius:var(--radius);font:13px var(--mono)}
.bar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.tabs{display:flex;gap:4px}
.tab,.chip{background:var(--bg);border:1px solid var(--border-dk);color:var(--muted);border-radius:16px;font:700 11px var(--cond);letter-spacing:.05em;text-transform:uppercase;padding:7px 12px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--sb-bg);border-color:var(--sb-bg);color:var(--yellow)}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.chip b{font-weight:900;margin-left:4px}
.bar select,.bar input[type=search]{padding:7px 9px;border:1px solid var(--border-dk);border-radius:var(--radius);font:13px var(--sans);background:var(--surface)}
.bar input[type=search]{min-width:180px;flex:1;max-width:320px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
.msg{padding:40px 16px;text-align:center;color:var(--muted)}
.msg b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.msg.err b{color:var(--red)}
/* order cards */
.ord{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden}
.ord-h{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.ord-h:hover{background:var(--bg-soft)}
.onum{font:900 22px var(--cond);letter-spacing:-.01em;min-width:70px}
.ocust{flex:1;min-width:140px}
.ocust b{display:block;font-size:14px}
.ocust small{color:var(--muted);font-size:12px}
.money{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.m{text-align:right}
.m small{display:block;font:700 9px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.m span{font:700 15px var(--sans);font-variant-numeric:tabular-nums}
.m.ref span{font-size:18px}
.m.zero span{color:var(--muted-lt)}
.tags{display:flex;gap:5px;flex-wrap:wrap;width:100%}
.tag{font:700 10px var(--cond);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--border-dk);color:var(--muted);background:var(--bg)}
.tag.g{background:var(--green-lt);border-color:#b8dfcc;color:var(--green-dk)}
.tag.a{background:var(--amb-bg);border-color:var(--amb-bd);color:var(--amb)}
.tag.r{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.ord-b{border-top:1px solid var(--border);padding:14px;background:var(--bg-soft)}
.warn{background:var(--amb-bg);border:1px solid var(--amb-bd);color:#7a5200;border-radius:var(--radius);padding:9px 12px;margin-bottom:10px;font-size:13px}
.warn.r{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{background:var(--surface);border:1px solid var(--border-dk);border-radius:var(--radius);color:var(--text);font:700 11px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:9px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--text)}
.btn.p{background:var(--sb-bg);border-color:var(--sb-bg);color:var(--yellow)}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.li{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px}
.li-h{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.li-h b{font-size:14px}
.li-h small{color:var(--muted);font-size:12px;flex:1}
.li-h .lr{font:700 14px var(--sans);font-variant-numeric:tabular-nums}
.szt{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.szt th,.szt td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--border)}
.szt th{font:700 10px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.szt td:first-child,.szt th:first-child{text-align:left;font:700 10px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:90px}
.szt tr.short td{color:var(--red);font-weight:700}
.szt tr.dmg td{color:var(--amb)}
.scroll{overflow-x:auto}
.iss{padding:8px 12px;border-top:1px dashed var(--border);display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12px}
.iss .who{color:var(--muted)}
.iss .rsn{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.iss .res{text-align:right;white-space:nowrap}
.iss .res b{display:block;font-size:13px}
.iss a{color:var(--blu);font-size:11px}
.tot{display:flex;justify-content:flex-end;gap:18px;padding:10px 4px 0;flex-wrap:wrap}
/* trends */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.tile small{display:block;font:700 10px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tile b{font:900 26px var(--sans);font-variant-numeric:tabular-nums}
.tile i{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.card h3{font:900 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.card p.sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.hb{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;gap:6px 10px;align-items:center;font-size:12px}
.hb .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .trk{height:14px;position:relative}
.hb .fill{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:0 4px 4px 0;min-width:2px}
.hb .val{font-variant-numeric:tabular-nums;color:var(--text);text-align:right;white-space:nowrap}
.hb .row{display:contents}
.hb .row:hover .fill{background:var(--green-dk)}
.cols{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--border-dk);padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.col .cf{width:100%;max-width:38px;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
.col:hover .cf{background:var(--green-dk)}
.col .cv{font-size:10px;color:var(--text);font-variant-numeric:tabular-nums;margin-bottom:3px;white-space:nowrap}
.colx{display:flex;gap:2px;margin-top:4px}
.colx span{flex:1;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap}
.tt{position:fixed;pointer-events:none;background:var(--sb-bg);color:#fff;font-size:12px;padding:6px 9px;border-radius:4px;z-index:50;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--sb-bg);color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;z-index:60}
.toast.err{background:var(--red)}
@media (max-width:640px){.money{width:100%;justify-content:flex-start}.m{text-align:left}.li-h small{flex-basis:100%;order:3}.li-h b{flex:1}}
</style>
</head>
<body>
<header class="top">
  <h1>Damage <span>Log</span></h1><span class="ver" id="ver"></span>
  <span class="sp"></span>
  <button class="tbtn" id="practiceBtn" type="button" title="Practice: nothing is saved to Airtable">Practice off</button>
  <button class="tbtn" id="tokBtn" type="button" aria-label="Airtable token">&#9881;</button>
</header>
<div class="tok" id="tokPanel" hidden>
  <span>Airtable token:</span><input id="tokIn" type="password" placeholder="pat…" autocomplete="off">
  <button class="btn p" id="tokSave" type="button">Save</button>
</div>
<div class="bar">
  <div class="tabs"><button class="tab on" data-tab="orders" type="button">Orders</button><button class="tab" data-tab="trends" type="button">Trends</button></div>
  <select id="range" aria-label="Date range">
    <option value="30">Last 30 days</option><option value="90" selected>Last 90 days</option>
    <option value="180">Last 6 months</option><option value="365">Last 12 months</option>
  </select>
  <span id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  <input type="search" id="q" placeholder="Order # or customer" aria-label="Search orders">
</div>
<main class="wrap" id="main"><div class="msg"><b>Loading damage log…</b></div></main>
<div class="tt" id="tt" hidden></div>

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function txt(v){if(v==null)return '';if(Array.isArray(v))return v.map(txt).filter(Boolean).join(', ');if(typeof v==='object')return v.name||v.id||'';return String(v);}
function num(v){if(Array.isArray(v))return v.reduce(function(s,x){return s+num(x);},0);var n=Number(v);return isFinite(n)?n:0;}
function ids(v){return Array.isArray(v)?v.map(function(x){return typeof x==='string'?x:(x&&x.id);}).filter(Boolean):[];}
function money(n){return '$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fdate(v){if(!v)return '';var d=new Date(String(v).length===10?v+'T12:00:00':v);return isNaN(d)?String(v):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function token(){try{return localStorage.getItem('pine_at_key')||'';}catch(e){return '';}}
function toast(m,err){var t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function atUrl(tbl,id){return 'https://airtable.com/'+BASE+'/'+tbl+'/'+id;}

async function atList(tbl,fields,formula){
  var out=[],offset=null;
  do{
    var p=new URLSearchParams();
    fields.forEach(function(f){if(f)p.append('fields[]',f);});
    p.set('returnFieldsByFieldId','true');
    if(formula)p.set('filterByFormula',formula);
    if(offset)p.set('offset',offset);
    var r=await fetch('https://api.airtable.com/v0/'+BASE+'/'+tbl+'?'+p,{headers:{Authorization:'Bearer '+token()}});
    var j=await r.json();
    if(!r.ok)throw new Error((j.error&&(j.error.message||j.error.type))||('Airtable '+r.status));
    out=out.concat(j.records||[]);offset=j.offset;
  }while(offset);
  return out;
}
async function atById(tbl,fields,idList){
  var out=[];
  for(var i=0;i<idList.length;i+=40){
    var chunk=idList.slice(i,i+40);
    out=out.concat(await atList(tbl,fields,'OR('+chunk.map(function(id){return "RECORD_ID()='"+id+"'";}).join(',')+')'));
  }
  return out;
}
function vals(o){return Object.keys(o).map(function(k){return o[k];});}

async function load(){
  if(!token()){$('main').innerHTML='<div class="msg err"><b>Airtable token needed</b>Tap the gear at the top right and paste your token.</div>';$('tokPanel').hidden=false;return;}
  $('main').innerHTML='<div class="msg"><b>Loading damage log…</b>Issues from the '+esc($('range').selectedOptions[0].text.toLowerCase())+'.</div>';
  try{
    var iFields=vals(I).concat(vals(RP));
    var iss=await atList(T_ISS,iFields,"IS_AFTER({"+I.created+"}, DATEADD(TODAY(), -"+state.range+", 'days'))");
    var ordIds={},lineIds={};
    iss.forEach(function(r){ids(r.fields[I.order]).forEach(function(x){ordIds[x]=1;});ids(r.fields[I.line]).forEach(function(x){lineIds[x]=1;});});
    var liFields=[L.ref,L.order,L.total,L.totalFinal,L.price,L.type,L.desc,L.brand,L.style,L.garment,L.color,L.nick,L.prodDesc,L.xSent,L.xSentTot,L.xRec,L.wow]
      .concat(vals(L.ord),vals(L.ext),vals(L.fin));
    // Issues missing Affected Order: find their order through the line item.
    var li1=await atById(T_LI,liFields,Object.keys(lineIds));
    li1.forEach(function(r){state.lines[r.id]=r;ids(r.fields[L.order]).forEach(function(x){ordIds[x]=1;});});
    var ords=await atById(T_ORD,vals(O),Object.keys(ordIds));
    state.orders={};ords.forEach(function(r){state.orders[r.id]=r;});
    // Every line item on those orders (the packing slip lists all of them).
    var need=[];ords.forEach(function(o){ids(o.fields[O.lines]).forEach(function(x){if(!state.lines[x])need.push(x);});});
    (await atById(T_LI,liFields,need)).forEach(function(r){state.lines[r.id]=r;});
    state.issues=iss.map(function(r){
      var f=r.fields,oid=ids(f[I.order])[0];
      if(!oid){var ln=state.lines[ids(f[I.line])[0]];oid=ln&&ids(ln.fields[L.order])[0];}
      var sizes={};Object.keys(RP).forEach(function(k){var n=num(f[RP[k]]);if(n)sizes[k]=n;});
      return {id:r.id,f:f,orderId:oid||'',lineId:ids(f[I.line])[0]||'',sizes:sizes,
        refund:num(f[I.refund]),reprint:num(f[I.reprint]),bandana:num(f[I.bandana]),pcs:num(f[I.dmgTotal]),
        res:txt(f[I.res]),changed:!!txt(f[I.changeRes]),status:txt(f[I.status]),created:f[I.created]||'',
        reasons:[].concat(f[I.rPrint]||[],f[I.rOther]||[]).map(txt).filter(Boolean),legacy:(f[I.rLegacy]||[]).map(txt),
        acct:txt(f[I.acct]),cat:txt(f[I.category])||txt(f[I.catAuto]),who:txt(f[I.originator]),garment:txt(f[I.garment]),
        approved:f[I.approved]===true,reprintTrue:num(f[I.reprintTrue]),refundLine:num(f[I.refundLine]),costSug:txt(f[I.costSug]),sug:txt(f[I.sug]),override:(f[I.override]===0||f[I.override])?num(f[I.override]):null};
    });
    // v3: every line where QC recorded extras sent in this range (for the wow cost tile)
    try{state.wowLines=await atList(T_LI,[L.xSentTot,L.wow],"AND({"+L.xRec+"}, IS_AFTER(CREATED_TIME(), DATEADD(TODAY(), -"+state.range+", 'days')))");}catch(e){state.wowLines=[];}
    markDupes();
    render();
  }catch(e){
    $('main').innerHTML='<div class="msg err"><b>Couldn’t load from Airtable</b>'+esc(e.message)+'</div>';
  }
}
// Same line item + identical damaged sizes = possible double-log.
function markDupes(){
  var seen={};
  state.issues.forEach(function(x){
    var k=x.lineId+'|'+SIZES.map(function(s){return x.sizes[s]||0;}).join(',');
    if(!x.pcs)return;
    (seen[k]=seen[k]||[]).push(x);
  });
  Object.keys(seen).forEach(function(k){if(seen[k].length>1)seen[k].forEach(function(x){x.dupe=true;});});
}

// ---- per-order model ----
function lineModel(lr){
  var f=lr.fields,rows={ord:{},ext:{},fin:{},dmg:{},shipped:{}},has=[];
  SIZES.forEach(function(s){
    var o=num(f[L.ord[s]]),e=L.ext[s]?num(f[L.ext[s]]):0,fi=L.fin[s]?num(f[L.fin[s]]):o;
    if(!o&&!e&&!(L.fin[s]&&num(f[L.fin[s]])))return;
    has.push(s);rows.ord[s]=o;rows.ext[s]=e;rows.fin[s]=fi;rows.dmg[s]=Math.max(0,o+e-fi);
    rows.shipped[s]=Math.max(0,fi); // v2: extras ship to the customer, so shipped can exceed ordered
  });
  // v3: when QC recorded which extras went in the box, ship ordered-or-less plus only those.
  var xRec=f[L.xRec]===true,xSent={};
  String(txt(f[L.xSent])||'').split(',').forEach(function(p){var m=/^\s*([A-Z0-9]+)\s*:\s*(\d+)/.exec(p);if(m)xSent[m[1]]=+m[2];});
  if(xRec)has.forEach(function(s){rows.shipped[s]=Math.max(0,Math.min(rows.fin[s],rows.ord[s]))+(xSent[s]||0);});
  var name=[txt(f[L.brand]),txt(f[L.style]),txt(f[L.garment])].filter(Boolean).join(' ');
  var color=txt(f[L.color]);
  if(!name)name=txt(f[L.nick])||txt(f[L.prodDesc])||txt(f[L.ref]);
  return {id:lr.id,ref:txt(f[L.ref]),name:name,color:color,desc:txt(f[L.desc]),type:txt(f[L.type]),sizes:has,rows:rows,
    total:num(f[L.total]),totalFinal:num(f[L.totalFinal]),price:num(f[L.price]),
    xRec:xRec,xSent:xSent,xSentTot:num(f[L.xSentTot]),wow:num(f[L.wow])};
}
function orderModel(oid){
  var o=state.orders[oid],f=o?o.fields:{};
  var iss=state.issues.filter(function(x){return x.orderId===oid;});
  var lineIds=o?ids(f[O.lines]):[];
  iss.forEach(function(x){if(x.lineId&&lineIds.indexOf(x.lineId)<0)lineIds.push(x.lineId);});
  var lines=lineIds.map(function(id){return state.lines[id];}).filter(Boolean).map(lineModel);
  var sum=function(k){return iss.reduce(function(s,x){return s+x[k];},0);};
  var r2=function(n){return Math.round(n*100)/100;};
  return {id:oid,num:txt(f[O.num])||txt(iss[0]&&iss[0].f[I.orderNum]),cust:txt(f[O.cust])||txt(iss[0]&&iss[0].f[I.customer]),f:f,issues:iss,lines:lines,
    refund:r2(sum('refund')),reprint:r2(sum('reprint')),bandana:r2(sum('bandana')),pcs:sum('pcs'),
    reprintWould:r2((function(){var seen={},t=0;iss.forEach(function(x){if(x.lineId&&!seen[x.lineId]&&x.reprintTrue){seen[x.lineId]=1;t+=x.reprintTrue;}});return t;})()),  // v6
    open:iss.filter(function(x){return !x.approved&&x.status!=='Resolved'&&x.status!=='Completed';}).length,  // v3: same as the interface's Awaiting Review tab
    dupes:iss.filter(function(x){return x.dupe;}).length,
    differ:iss.filter(function(x){return x.costSug&&x.sug&&x.costSug!==x.sug;}).length,
    negative:lines.some(function(l){return l.totalFinal<0;}),
    refundIssued:f[O.refundIssued]===true,
    refundPending:iss.filter(function(x){return x.refund>0&&!x.approved;}).reduce(function(a,x){return a+x.refund;},0),  // v4
    refundSent:iss.filter(function(x){return x.refund>0&&x.approved;}).reduce(function(a,x){return a+x.refund;},0),
    last:iss.reduce(function(m,x){return x.created>m?x.created:m;},'')};
}
function allOrders(){
  var byId={};state.issues.forEach(function(x){byId[x.orderId]=1;});
  return Object.keys(byId).map(orderModel).sort(function(a,b){return a.last<b.last?1:-1;});
}
var FILTERS=[
  ['refund','Refund needs approval',function(o){return o.refundPending>0;}],
  ['review','Awaiting review',function(o){return o.open>0;}],
  ['flags','Check these',function(o){return o.dupes>0||o.negative;}],
  ['differ','Rules differ',function(o){return o.differ>0;}],
  ['all','All',function(){return true;}]
];

function render(){
  var list=allOrders();
  $('chips').innerHTML=state.tab==='orders'?FILTERS.map(function(F){
    var n=list.filter(F[2]).length;
    return '<button type="button" class="chip'+(state.filter===F[0]?' on':'')+'" data-f="'+F[0]+'">'+F[1]+'<b>'+n+'</b></button>';
  }).join(''):'';
  $('q').hidden=state.tab!=='orders';
  if(state.tab==='trends'){renderTrends();return;}
  var F=FILTERS.filter(function(x){return x[0]===state.filter;})[0];
  var q=state.q.trim().toLowerCase();
  var shown=list.filter(F[2]).filter(function(o){return !q||String(o.num).indexOf(q)>-1||o.cust.toLowerCase().indexOf(q)>-1;});
  if(!shown.length){$('main').innerHTML='<div class="msg"><b>Nothing here</b>'+(state.filter==='refund'?'No refunds waiting for approval — everything has been sent to the bookkeeper.':'Try another filter or a longer date range.')+'</div>';return;}
  $('main').innerHTML=shown.map(orderCard).join('');
}
function orderCard(o){
  var tags=[];
  if(o.refundPending>0)tags.push('<span class="tag a">Refund needs approval · '+money(o.refundPending)+'</span>');
  if(o.refundIssued)tags.push('<span class="tag g">&#10003; Refund issued</span>');
  else if(o.refundSent>0)tags.push('<span class="tag g">Sent to bookkeeper</span>');
  if(o.open)tags.push('<span class="tag a">'+o.open+' awaiting review</span>');
  if(o.dupes)tags.push('<span class="tag r">Possible duplicate</span>');
  if(o.negative)tags.push('<span class="tag r">Negative qty</span>');
  if(o.differ)tags.push('<span class="tag a">Cost rule differs</span>');
  tags.push('<span class="tag">'+o.issues.length+' issue'+(o.issues.length!==1?'s':'')+' · '+o.pcs+' pcs</span>');
  var m=function(cls,l,v){return '<div class="m '+cls+(v?'':' zero')+'"><small>'+l+'</small><span>'+money(v)+'</span></div>';};
  var isOpen=!!state.open[o.id];
  return '<section class="ord" id="o-'+o.id+'">'
    +'<div class="ord-h" data-open="'+o.id+'" role="button" tabindex="0" aria-expanded="'+isOpen+'">'
    +'<div class="onum">'+esc(o.num||'?')+'</div>'
    +'<div class="ocust"><b>'+esc(o.cust||'Unknown customer')+'</b><small>Last issue '+esc(fdate(o.last))+'</small></div>'
    +'<div class="money">'+m('ref','Refund',o.refund)+m('','Reprint would cost',o.reprintWould)+m('','Bandanas',o.bandana)+'</div>'
    +'<div class="tags">'+tags.join('')+'</div></div>'
    +(isOpen?'<div class="ord-b">'+orderBody(o)+'</div>':'')
    +'</section>';
}
function orderBody(o){
  var h='';
  if(o.dupes)h+='<div class="warn r"><b>Possible duplicate:</b> '+o.dupes+' issues log the same sizes on the same line item. Check before refunding — the refund may be counted twice.</div>';
  if(o.open)h+='<div class="warn"><b>'+o.open+' issue'+(o.open>1?'s':'')+' still awaiting review.</b> The total may change once they’re decided.</div>';
  if(o.negative)h+='<div class="warn r"><b>Negative quantity:</b> more damages are logged than were ordered + extras on a line. Usually a double-log or typo.</div>';
  var qbo=txt(o.f[O.qbo]);
  h+='<div class="acts">'
    +(o.refund>0?'<button class="btn" type="button" data-copy="'+o.id+'">Copy refund for QuickBooks</button>':'')
    +(o.refund>0?(o.refundIssued?'<button class="btn" type="button" data-issued="'+o.id+'" data-v="0">Undo refund issued</button>':'<button class="btn g" type="button" data-issued="'+o.id+'" data-v="1">&#10003; Mark refund issued</button>'):'')
    +(qbo?'<a class="btn" href="'+esc(qbo)+'" target="_blank" rel="noopener">QuickBooks invoice</a>':'')
    +'<a class="btn" href="'+atUrl(T_ORD,o.id)+'" target="_blank" rel="noopener">Order in Airtable</a>'
    +'</div>';
  o.lines.forEach(function(l){
    var li=o.issues.filter(function(x){return x.lineId===l.id;});
    if(!li.length)return; // internal view: only lines with issues (the slip shows all)
    var lr=li.reduce(function(s,x){return s+x.refund;},0);
    var short=Math.max(0,l.total-l.totalFinal);
    var cx=li[0];  // v5: line-level cost check (same on every issue of the line)
    var cost=(short&&cx&&cx.reprintTrue)?'<div class="warn" style="margin:0;border-radius:0;border-width:0 0 1px;background:'+(cx.costSug===cx.sug?'var(--bg-soft)':'var(--amb-bg)')+'">'
      +'<b>Cost check:</b> refund '+money(cx.refundLine)+' vs reprint '+money(cx.reprintTrue)+' ('+short+' short)'
      +' · today suggests <b>'+esc(cx.sug)+'</b> · cost says <b>'+esc(cx.costSug)+'</b>'+(cx.costSug!==cx.sug?' ⚠':'')+'</div>':'';
    h+='<div class="li"><div class="li-h"><b>'+esc(l.name)+(l.color?' — '+esc(l.color):'')+'</b><small>'+esc(l.ref)+(l.price?' · '+money(l.price)+'/pc':'')+(short?' · <b style="color:var(--red)">'+short+' short</b>':'')+'</small>'
      +(lr?'<span class="lr">Refund '+money(lr)+'</span>':'')+'</div>'
      +cost+'<div class="scroll"><table class="szt"><tr><th></th>'+l.sizes.map(function(s){return '<th>'+s+'</th>';}).join('')+'<th>Total</th></tr>'
      +szRow('Ordered',l,'ord')+szRow('+ Extras',l,'ext')+szRow('Damaged',l,'dmg','dmg')+szRow('Final',l,'fin')+(l.xRec?szRow('Shipped',l,'shipped'):'')
      +'</table></div>'
      +li.map(issueRow).join('')+'</div>';
  });
  h+='<div class="tot"><div class="m ref"><small>Order refund</small><span>'+money(o.refund)+'</span></div><div class="m"><small>Reprint would cost</small><span>'+money(o.reprintWould)+'</span></div><div class="m"><small>Bandanas from stock</small><span>'+money(o.bandana)+'</span></div></div>';
  return h;
}
function szRow(label,l,k,cls){
  var t=0,cells=l.sizes.map(function(s){var v=l.rows[k][s]||0;t+=v;return '<td>'+(v||(k==='ord'?0:'·'))+'</td>';}).join('');
  if(k==='fin'&&t<l.total)cls='short';
  return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+label+'</td>'+cells+'<td><b>'+t+'</b></td></tr>';
}
function refundMath(x){  // v3: say which rule produced the refund
  var line=x.lineId&&state.lines[x.lineId]?lineModel(state.lines[x.lineId]):null,p=line?line.price:0;
  if(!x.refund)return '';
  if(x.override!=null)return 'Override: '+x.override+' × '+money(p);
  if(x.cat==='Customer Initiated'&&String(x.created)>='2026-09-28')return 'Customer-reported: '+x.pcs+' damaged × '+money(p);
  if(line){var sh=Math.max(0,line.total-line.totalFinal);return 'Short after extras: '+sh+' on line × '+money(p)+(Math.abs(sh*p-x.refund)>0.01?' (this issue’s share)':'');}
  return '';
}
function issueRow(x){
  var amt=x.refund?money(x.refund)+' refund':x.reprint?money(x.reprint)+' reprint':x.bandana?money(x.bandana)+' bandanas':'$0';
  var sz=SIZES.filter(function(s){return x.sizes[s];}).map(function(s){return x.sizes[s]+' '+s;}).join(', ');
  var rs=(x.reasons.length?x.reasons:x.legacy);
  return '<div class="iss"><div><b>'+esc(fdate(x.created))+'</b> <span class="who">· '+esc([x.who,x.cat,x.acct].filter(Boolean).join(' · '))+'</span><br>'
    +(sz?esc(sz):'<i style="color:var(--muted)">No sizes entered</i>')
    +'<div class="rsn">'+rs.map(function(r){return '<span class="tag">'+esc(r)+'</span>';}).join('')
    +(x.dupe?'<span class="tag r">Duplicate?</span>':'')+(!x.approved&&x.status!=='Resolved'&&x.status!=='Completed'?'<span class="tag a">Awaiting review</span>':(x.approved?'<span class="tag g">Approved</span>':(x.status?'<span class="tag">'+esc(x.status)+'</span>':'')))+'</div></div>'
    +'<div class="res"><b>'+esc(x.res||'—')+(x.changed?' *':'')+'</b>'+esc(amt)+(refundMath(x)?'<br><small style="color:var(--muted)">'+esc(refundMath(x))+'</small>':'')+'<br><a href="'+atUrl(T_ISS,x.id)+'" target="_blank" rel="noopener">Open issue</a></div></div>';
}

// ---- QuickBooks copy ----
function qbText(o){
  var lines=['Order '+o.num+' — '+o.cust,'Damage refund'];
  o.lines.forEach(function(l){
    var lr=o.issues.filter(function(x){return x.lineId===l.id;}).reduce(function(s,x){return s+x.refund;},0);
    if(!lr)return;
    var short=Math.max(0,l.total-l.totalFinal);
    lines.push('  '+l.name+(l.color?' '+l.color:'')+': '+short+' short × '+money(l.price)+' = '+money(lr));
  });
  lines.push('Total refund: '+money(o.refund));
  return lines.join('\n');
}
async function copyQb(oid){

async function setIssued(oid,v){
  var o=orderModel(oid);

  if(PRACTICE){toast('Practice: not saved');if(state.orders[oid])state.orders[oid].fields[O.refundIssued]=!!v;render();return;}
  try{
    var body={fields:{}};body.fields[O.refundIssued]=!!v;
    var r=await fetch('https://api.airtable.com/v0/'+BASE+'/'+T_ORD+'/'+oid,{method:'PATCH',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify(body)});

}

// ---- Trends ----
function renderTrends(){
  var iss=state.issues;
  if(!iss.length){$('main').innerHTML='<div class="msg"><b>No issues in this range</b></div>';return;}
  var sum=function(k,a){return (a||iss).reduce(function(s,x){return s+x[k];},0);};
  var ords={};iss.forEach(function(x){ords[x.orderId]=1;});
  var h='<div class="tiles">'
    +tile('Damaged pieces',sum('pcs').toLocaleString(),plural(iss.length,'issue')+' on '+plural(Object.keys(ords).length,'order'))
    +tile('Refunds',money(sum('refund')),plural(iss.filter(function(x){return x.refund>0;}).length,'issue'))
    +tile('Reprint cost',money(sum('reprint')),plural(iss.filter(function(x){return x.reprint>0;}).length,'issue'))
    +tile('Bandanas from stock',money(sum('bandana')),plural(iss.filter(function(x){return x.bandana>0;}).length,'issue'))
    +(function(){var w=0,n=0,rec=0;(state.wowLines||[]).forEach(function(r){var lf=r.fields;rec++;w+=num(lf[L.wow]);n+=num(lf[L.xSentTot]);});
      return tile('Wow cost (extras sent)',money(w),rec?plural(n,'extra')+' sent on '+plural(rec,'recorded line'):'Starts with Catching v143');})()
    +'</div><div class="grid2">';
  // pieces by reason (an issue with 2 reasons counts toward both)
  var byR={};iss.forEach(function(x){var rs=x.reasons.length?x.reasons:(x.legacy.length?x.legacy:['No reason']);rs.forEach(function(r){byR[r]=(byR[r]||0)+x.pcs;});});
  h+=card('Damaged pieces by reason','An issue with two reasons counts toward both.',hbars(byR,function(v){return v.toLocaleString()+' pcs';}));
  var byA={};iss.forEach(function(x){var k=x.acct||'Not set';byA[k]=(byA[k]||0)+x.pcs;});
  h+=card('Damaged pieces by accountability','Print Team vs everything else (mill flaws, grease, wrinkles…).',hbars(byA,function(v){return v.toLocaleString()+' pcs';}));
  var byM={};iss.forEach(function(x){var k=String(x.created).slice(0,7);if(k)byM[k]=(byM[k]||0)+x.refund+x.reprint+x.bandana;});
  h+=card('Damage cost by month','Refunds + reprint cost + bandanas from stock.',cols(byM,money));

  h+=card('Damaged pieces by garment','Top 8 garments in this range.',hbars(byG,function(v){return v.toLocaleString()+' pcs';},8));

function plural(n,w){return n+' '+w+(n===1?'':'s');}
function tile(l,v,sub){return '<div class="tile"><small>'+l+'</small><b>'+v+'</b><i>'+esc(sub)+'</i></div>';}
function card(t,sub,body){return '<section class="card"><h3>'+t+'</h3><p class="sub">'+sub+'</p>'+body+'</section>';}
function hbars(obj,fmt,top){
  var e=Object.keys(obj).map(function(k){return [k,obj[k]];}).sort(function(a,b){return b[1]-a[1];});
  if(top&&e.length>top){var rest=e.slice(top).reduce(function(s,x){return s+x[1];},0);e=e.slice(0,top);if(rest)e.push(['Other',rest]);}
  var max=Math.max.apply(null,e.map(function(x){return x[1];}).concat([1]));
  return '<div class="hb">'+e.map(function(x){
    return '<div class="row" data-tip="'+esc(x[0]+': '+fmt(x[1]))+'"><span class="lab">'+esc(x[0])+'</span><span class="trk"><span class="fill" style="width:'+(x[1]/max*100)+'%"></span></span><span class="val">'+fmt(x[1])+'</span></div>';
  }).join('')+'</div>';
}
function cols(obj,fmt){
  var keys=Object.keys(obj).sort(),max=Math.max.apply(null,keys.map(function(k){return obj[k];}).concat([1]));
  var lab=function(k){var d=new Date(k+'-15');return d.toLocaleDateString('en-US',{month:'short'})+(keys.length>6?'':' '+String(d.getFullYear()).slice(2));};
  var peak=keys.reduce(function(m,k){return obj[k]>obj[m]?k:m;},keys[0]);
  return '<div class="cols">'+keys.map(function(k){
    return '<div class="col" data-tip="'+esc(lab(k)+': '+fmt(obj[k]))+'">'+(k===peak||k===keys[keys.length-1]?'<span class="cv">'+fmt(obj[k])+'</span>':'')+'<span class="cf" style="height:'+(obj[k]/max*100)+'%"></span></div>';
  }).join('')+'</div><div class="colx">'+keys.map(function(k){return '<span>'+lab(k)+'</span>';}).join('')+'</div>';
}

});
$('q').addEventListener('input',function(){state.q=this.value;render();});
$('range').addEventListener('change',function(){state.range=Number(this.value);load();});
$('tokBtn').onclick=function(){$('tokPanel').hidden=!$('tokPanel').hidden;$('tokIn').value=token();};
$('tokSave').onclick=function(){try{localStorage.setItem('pine_at_key',$('tokIn').value.trim());}catch(e){}$('tokPanel').hidden=true;load();};
function syncPractice(){$('practiceBtn').textContent=PRACTICE?'Practice on':'Practice off';$('practiceBtn').classList.toggle('on',PRACTICE);}
$('practiceBtn').onclick=function(){PRACTICE=!PRACTICE;syncPractice();toast(PRACTICE?'Practice on — nothing will be saved':'Practice off — changes save to Airtable');};
$('ver').textContent=APP_VER;syncPractice();
load();
</script>
</body>
