<!DOCTYPE html>
<!-- Reconnect v2 (2026-10-15): renamed from Sales Targets (Stephen: "more about it being an outreach helper with historical
     order history but make it sound better"). Same app and rules; the bar reads RECONNECT with a one-line purpose, and the
     permanent link is reconnect.html (sales-targets.html still forwards here). Settings and marks carry over.
     Sales Targets v1 (2026-10-15): new office app. Which past customers should sales call for the coming quarter
     (Q1 2027 by default), from the order history in Airtable. Read-only: it never writes to Airtable, so there is no
     practice mode. No customer data lives in this file; everything loads at runtime with the Airtable token saved on
     this computer (pine_at_key). Contact names, emails and phones are not loaded (they live in Pipedrive).
     Rules (plain language, constants in RULES below):
       - Ordered in Q1 before: ordered in the same quarter last year and/or the year before.
       - Due for a reorder: 2+ orders, the usual gap between them puts the next one between ~4 months ago and the end of
         the target quarter.
       - Gone quiet: $1,500+ lifetime or 2+ orders, nothing in the last 9 months (but something in the last 3 years).
     Score 0-100 = past spend (up to 30) + number of orders (up to 15) + same-quarter history (up to 35)
                   + due for a reorder (15) + ordered in the last 18 months (5).
     "Contacted" / "Skip" marks are kept in this browser only (localStorage), never in Airtable. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reconnect v2 — Pine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap">
<link rel="stylesheet" href="pine-style-v2.css">
<style>
/* The Pine page kit (pine-style-v2.css) does the bar, filter row, page head, list cards and the two-pane split. App bits below. */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%;background:var(--p-cream-lt)}
body{font-size:15px}
.wrap{padding:0 24px 120px}
.wrap.is-split{padding:0 24px}
@media (min-width:701px){ .p-filters{padding-left:24px;padding-right:24px} }
.p-filters .p-select{width:auto;min-width:150px}
.p-filters-end{flex-wrap:wrap}
.p-tab.zero{border-color:var(--p-line-strong);color:var(--p-ink-3)}
.msg{padding:40px 16px;text-align:center;color:var(--p-ink-2)}
.msg b{display:block;color:var(--p-black);font-size:18px;margin-bottom:6px}
.msg.err b{color:var(--p-alert)}
.bar-prog{height:8px;max-width:360px;margin:14px auto 0;background:var(--p-white);border:1px solid var(--p-line);border-radius:999px;overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--p-black);width:0;transition:width .2s}
/* summary tiles: one big number (targets), plain facts beside it */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:var(--p-s4) 0 0}
.tile{background:var(--p-white);border:1px solid var(--p-line);border-radius:var(--p-r-lg);padding:12px 14px;min-width:0}
.tile .p-label{display:block;margin-bottom:6px}
.tile b{font:800 22px/1.1 var(--p-sans);font-variant-numeric:tabular-nums}
.tile i{display:block;font-style:normal;color:var(--p-ink-2);font-size:13px;margin-top:4px}
.tile.p-stat{border:0;background:var(--p-black);color:var(--p-white)}
.tile.p-stat .p-big{font-size:34px}
.tile.p-stat i{color:rgba(255,255,255,.75)}
/* cards */
.p-lc-head.is-tap:hover{background:#FBF7EF}
.p-lc-id .score{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:2px solid var(--p-black);font:800 17px/1 var(--p-sans);font-variant-numeric:tabular-nums;background:var(--p-white)}
.p-lc.is-marked .p-lc-title{color:var(--p-ink-3)}
.p-lc-nums .p-num b{font-size:16px}
.p-num.is-wide b{white-space:nowrap}
.p-lc-chev{font-size:16px}
.why{font-size:15px;line-height:1.45}
.why b{font-weight:800}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--p-ink-2)}
.facts b{color:var(--p-black)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts .p-hint{font-size:13px}
/* month strip: which months they order in (count of years), target quarter outlined in yellow */
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;max-width:640px}
.mo{border:1.5px solid var(--p-line-strong);border-radius:6px;background:var(--p-white);text-align:center;padding:4px 0 5px;min-width:0}
.mo span{display:block;font:700 12px/1.2 var(--p-sans);color:var(--p-ink-2)}
.mo b{display:block;font:800 15px/1.2 var(--p-sans);font-variant-numeric:tabular-nums;color:var(--p-ink-3)}
.mo.n1{background:var(--p-cream);border-color:var(--p-cream-dk)}
.mo.n1 b{color:var(--p-black)}
.mo.n2{background:var(--p-black);border-color:var(--p-black)}
.mo.n2 span{color:rgba(255,255,255,.8)}.mo.n2 b{color:var(--p-yellow)}
.mo.tq{box-shadow:0 0 0 3px var(--p-yellow)}
.legend{font-size:13px;color:var(--p-ink-2);margin-top:6px}
.score-line{font-size:13px;color:var(--p-ink-2)}
/* order history */
.scroll{overflow-x:auto;background:var(--p-white);border:1px solid var(--p-line);border-radius:var(--p-r-lg)}
.oh{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.oh th,.oh td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--p-line);vertical-align:top}
.oh tr:last-child td{border-bottom:0}
.oh th{font:700 12px var(--p-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--p-ink-2);white-space:nowrap;background:var(--p-cream-lt)}
.oh td.r,.oh th.r{text-align:right}
.oh td.nw{white-space:nowrap}
.oh tr.inq td{background:var(--p-yellow-lt)}
.oh tr.zero td{color:var(--p-ink-3)}
.oh .ref{display:block;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oh a{color:var(--p-black);font-weight:700;text-underline-offset:3px;display:inline-flex;align-items:center;min-height:32px;white-space:nowrap}
.oh .p-id{font-size:13px;padding:4px 6px}
.sec-h{font:700 12px var(--p-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--p-ink-2);margin-bottom:6px}
.p-menu .p-input{font-size:15px}
.p-menu p{font-size:14px;color:var(--p-ink-2)}
.p-toast{z-index:120}
/* the detail pane in the two-pane view */
.p-split-detail .p-lc-head{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"id main act" "nums nums nums" "tags tags tags"}
.p-split-detail .p-lc-nums{justify-content:flex-start}
.p-split-detail .p-num{text-align:left}
.p-split-detail .p-lc-title{font-size:20px}
@media (max-width:700px){
  .p-filters .p-search{flex-basis:100%;max-width:none}
  .p-filters-end{flex:1;margin-left:0}.p-filters-end .p-select{flex:1 1 140px;min-width:0}
  .p-chips{margin:0 -16px;padding:0 16px 2px}
  .wrap{padding:0 12px 120px}
  .tiles{grid-template-columns:1fr 1fr}.tile b{font-size:18px}.tile.p-stat .p-big{font-size:28px}
  .p-head-end{margin-left:0;width:100%}.p-head-end .p-btn{flex:1}
  .mo span{font-size:12px}.mo b{font-size:13px}
  .months{gap:2px}
}
</style>
</head>
<body class="p-app">
<header class="p-bar">
  <span class="p-mark"><span class="p-logo" aria-hidden="true"></span></span>
  <span class="p-bar-app">Reconnect</span><span class="p-bar-ver" id="ver">v2</span>
  <div class="p-bar-sp">
    <button class="p-barbtn" id="refreshBtn" type="button" title="Reload orders from Airtable and check for a new version">&#8635; <span class="p-barbtn-word">Refresh</span></button>
    <button class="p-barbtn p-barbtn-icon" id="gearBtn" type="button" aria-label="Settings" aria-expanded="false" title="Settings">&#9881;</button>
  </div>
  <div class="p-menu" id="gear" role="dialog" aria-label="Settings" hidden>
    <div class="p-menu-row"><div class="p-menu-label">Airtable token</div>
      <div class="p-menu-line"><input id="tokIn" class="p-input" type="password" placeholder="pat…" autocomplete="off" aria-label="Airtable token"><button class="p-btn p-btn-dark" id="tokSave" type="button">Save</button></div>
      <p id="tokHint"></p></div>
    <div class="p-menu-row"><div class="p-menu-label">Read-only</div><p>This app only reads orders. It never changes Airtable.</p></div>
    <div class="p-menu-row"><div class="p-menu-label">Contacted / Skip marks</div>
      <div class="p-menu-line"><p id="markHint"></p><button class="p-btn" id="clearMarks" type="button">Clear</button></div></div>
  </div>
</header>
<div class="p-filters">
  <input type="search" id="q" class="p-input p-search" placeholder="Search customer" aria-label="Search customers">
  <div class="p-filters-end">
    <select id="rep" class="p-select" aria-label="Sales rep"><option value="">All reps</option></select>
    <select id="minSpend" class="p-select" aria-label="Lifetime spend at least">
      <option value="0">Any spend</option><option value="500">$500+ lifetime</option><option value="1000">$1,000+ lifetime</option>
      <option value="2500">$2,500+ lifetime</option><option value="5000">$5,000+ lifetime</option><option value="10000">$10,000+ lifetime</option>
    </select>
    <select id="sort" class="p-select" aria-label="Sort">
      <option value="score">Sort: score</option><option value="spend">Sort: lifetime spend</option><option value="last">Sort: last order (oldest first)</option><option value="name">Sort: name</option>
    </select>
    <select id="qtr" class="p-select" aria-label="Target quarter"></select>
  </div>
  <div class="p-chips" id="chips" role="tablist" aria-label="Why they're a target"></div>
</div>
<main class="wrap" id="main"><div class="msg"><b>Loading order history…</b></div></main>
<script>
// Sales Targets v1 — read-only. Loads Orders (selected fields only) and groups them by customer.
var BASE='appJkaLk8DykjsgHR', T_ORD='tbl8Tf0AeS9gnHOOS';
var F={ // Orders fields (returnFieldsByFieldId). No contact names / emails / phones, no rep emails.
  cust:'fldjj1X0WYQOuqHYQ',      // Customer (link to Customers = company)
  custName:'fldoRraeYHsgfeWhj',  // [TEXT] Customer Name
  ref:'fldHarZYpYjQrJoof',       // Order Reference
  num:'fld4S3B5yJANKlE7l',       // Invoice / Order Number
  status:'fldhS4z28CdGmS1j5',    // Order Status
  rep:'fldSPnWlnzz48ZZDD',       // Sales Person (name only)
  paid:'fld5RAeEEGMltdES0',      // Payment Received Date
  created:'fldXUjQHSeRaW5per',   // Creation Date
  subtotal:'fldrtRZ4mHLKRAEff',  // Subtotal (no tax)
  source:'fldE1muKiijQchB0h',    // Order Source (Repeat, Google, Referral…)
  ptypes:'fld9yTE8jCe4BVJKt',    // Line Item Product Type Lookup
  qty:'fldWQYE3o2IZjZXSU'        // Total Quantity Rollup
};
// The targeting rules in one place (open questions for Stephen: these thresholds).
var RULES={
  mergeDays:14,          // orders within 14 days of each other count as one buy (split orders) for the reorder rhythm
  dueMinGap:45,          // a "usual gap" shorter than this is just an active customer, not a reorder signal
  dueMaxGap:540,         // longer than ~18 months is not a rhythm
  dueLookbackDays:120,   // a reorder that was due up to 4 months ago (and hasn't come) still counts as due
  dueGaps:5,             // rhythm = median of the last 5 gaps
  quietDays:270,         // gone quiet = nothing for 9+ months …
  quietMaxDays:1095,     // … but ordered in the last 3 years
  quietMinSpend:1500,    // and spent $1,500+ …
  quietMinOrders:2,      // … or ordered 2+ times
  recentDays:548         // +5 score if they ordered in the last 18 months
};
var DONE_STATUS={'Completed':1,'Shipped':1,'Partially Completed':1,'Caught - Awaiting Ship':1};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTH=['January','February','March','April','May','June','July','August','September','October','November','December'];

var state={orders:[],custs:[],q:'',reason:'all',rep:'',minSpend:0,sort:'score',qtr:'',open:{},loading:false,loaded:false};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function txt(v){if(v==null)return '';if(Array.isArray(v))return v.map(txt).filter(Boolean).join(', ');if(typeof v==='object')return v.name||'';return String(v);}
function num(v){if(Array.isArray(v))return v.reduce(function(s,x){return s+num(x);},0);var n=Number(v);return isFinite(n)?n:0;}
function money(n){return '$'+Math.round(n).toLocaleString('en-US');}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
function token(){return store('pine_at_key')||'';}
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function parseDay(v){ // 'YYYY-MM-DD' = local day; a dateTime = the local day it falls on
  if(!v)return null;var s=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  var d=new Date(s);return isNaN(d)?null:dayStart(d);
}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function days(a,b){return Math.round((b-a)/864e5);}
function fdate(d){return d?MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear():'';}
function fmon(d){return d?MON[d.getMonth()]+' '+d.getFullYear():'';}
function isoDay(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function atUrl(id){return 'https://airtable.com/'+BASE+'/'+T_ORD+'/'+id;}
var toastT;function toast(m,err){var t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.className='p-toast'+(err?' is-alert':'');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},err?5000:2800);}

// ---------- the target quarter: the next 4 calendar quarters that start after today ----------
var TODAY=dayStart(new Date());
function quarters(){
  var out=[],y=TODAY.getFullYear(),q=Math.floor(TODAY.getMonth()/3)+1;
  for(var i=0;i<4;i++){q++;if(q>4){q=1;y++;}
    var m0=(q-1)*3;out.push({key:y+'Q'+q,y:y,q:q,m0:m0,start:new Date(y,m0,1),end:new Date(y,m0+3,0),label:'Q'+q+' '+y,
      short:'Q'+q,span:MON[m0]+'–'+MON[m0+2]});}
  return out;
}
var QTRS=quarters();
function curQ(){return QTRS.filter(function(x){return x.key===state.qtr;})[0]||QTRS[0];}

// ---------- Airtable: GET only ----------
async function atPage(formula,offset){
  var p=new URLSearchParams();
  Object.keys(F).forEach(function(k){p.append('fields[]',F[k]);});
  p.set('returnFieldsByFieldId','true');p.set('pageSize','100');
  if(formula)p.set('filterByFormula',formula);
  if(offset)p.set('offset',offset);
  for(var tries=0;;tries++){
    var r=await fetch('https://api.airtable.com/v0/'+BASE+'/'+T_ORD+'?'+p,{headers:{Authorization:'Bearer '+token()}});
    if(r.status===429&&tries<4){await new Promise(function(res){setTimeout(res,1500*(tries+1));});continue;}  // rate limit: wait and retry
    var j=await r.json().catch(function(){return {};});
    if(!r.ok)throw new Error((j.error&&(j.error.message||j.error.type))||('Airtable '+r.status));
    return j;
  }
}
// Three streams by the year the order was created, read side by side (≈3 requests a second, under Airtable's 5).
var STREAMS=['YEAR(CREATED_TIME())<2022','AND(YEAR(CREATED_TIME())>=2022,YEAR(CREATED_TIME())<2025)','YEAR(CREATED_TIME())>=2025'];
async function loadAll(onProgress){
  var all=[];
  await Promise.all(STREAMS.map(async function(f){
    var offset=null;
    do{var j=await atPage(f,offset);all=all.concat(j.records||[]);offset=j.offset;onProgress(all.length);}while(offset);
  }));
  return all;
}
var LOAD_ID=0;
async function load(){
  if(!token()){state.loaded=false;$('main').innerHTML='<div class="msg"><b>Add your Airtable token</b>Open ⚙ and paste the token. It is saved on this computer only.</div>';showMenu(true);return;}
  var my=++LOAD_ID;state.loading=true;
  $('main').classList.remove('is-split');
  $('main').innerHTML='<div class="msg"><b>Loading order history…</b><span id="progTxt">Starting</span><div class="bar-prog"><i id="progBar"></i></div></div>';
  try{
    var recs=await loadAll(function(n){if(my!==LOAD_ID)return;var t=$('progTxt'),b=$('progBar');if(t)t.textContent=n.toLocaleString('en-US')+' orders read';if(b)b.style.width=Math.min(96,n/90)+'%';});
    if(my!==LOAD_ID)return;
    state.orders=recs.map(toOrder).filter(Boolean);
    state.loaded=true;state.loading=false;
    fillReps();build();render();
  }catch(e){
    if(my!==LOAD_ID)return;state.loading=false;
    $('main').innerHTML='<div class="msg err"><b>Couldn’t load orders</b>'+esc(e.message||e)+'. Check the token in ⚙, then Refresh.</div>';
  }
}
function toOrder(r){
  var c=r.fields||{},st=txt(c[F.status]);
  if(st==='Cancelled / Voided')return null;
  var paid=parseDay(c[F.paid]),created=parseDay(c[F.created]||r.createdTime);
  var name=String(txt(c[F.custName])||'').trim();
  var link=Array.isArray(c[F.cust])&&c[F.cust].length?(typeof c[F.cust][0]==='string'?c[F.cust][0]:c[F.cust][0].id):'';
  if(!name&&!link)return null;
  var pt=c[F.ptypes];pt=Array.isArray(pt)?pt.map(txt):(pt?[txt(pt)]:[]);
  var uniq=[];pt.forEach(function(x){if(x&&uniq.indexOf(x)<0)uniq.push(x);});
  return {id:r.id,cust:link,name:name,ref:txt(c[F.ref]),num:c[F.num]!=null?String(txt(c[F.num])):'',status:st,rep:txt(c[F.rep]),
    date:paid||created,paid:!!paid,subtotal:num(c[F.subtotal]),source:txt(c[F.source]),ptypes:uniq,qty:num(c[F.qty])};
}

// ---------- grouping + targeting ----------
function normName(s){return String(s||'').toLowerCase().replace(/[^a-z0-9& ]+/g,' ').replace(/\b(inc|llc|co|the|ltd|corp)\b/g,' ').replace(/\s+/g,' ').trim();}
function groupCustomers(orders){
  // 1) by the Customer record id; 2) records whose names normalize the same are merged (duplicate customer records)
  var byKey={},byName={};
  orders.forEach(function(o){
    var nk=normName(o.name),k=o.cust||('n:'+nk);
    if(!byKey[k])byKey[k]={key:k,orders:[]};
    byKey[k].orders.push(o);
  });
  Object.keys(byKey).forEach(function(k){
    var g=byKey[k],nm=normName(g.orders[0].name)||k;
    if(byName[nm]){byName[nm].orders=byName[nm].orders.concat(g.orders);byName[nm].ids.push(k);}
    else byName[nm]={key:k,ids:[k],orders:g.orders.slice()};
  });
  return Object.keys(byName).map(function(k){return byName[k];});
}
function median(a){var s=a.slice().sort(function(x,y){return x-y;}),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function scoreCustomer(g,Q){
  var all=g.orders.slice().sort(function(a,b){return a.date-b.date;});
  var os=all.filter(function(o){return o.subtotal>0&&o.date;});
  if(!os.length)return null;
  var latest=all[all.length-1];
  var withRep=all.filter(function(o){return o.rep;});
  var c={key:g.key,name:latest.name||os[os.length-1].name,rep:withRep.length?withRep[withRep.length-1].rep:'',orders:all,counted:os};
  c.spend=os.reduce(function(s,o){return s+o.subtotal;},0);
  c.n=os.length;
  c.last=os[os.length-1].date;
  c.lastAmt=os.filter(function(o){return +o.date===+c.last;}).reduce(function(s,o){return s+o.subtotal;},0);
  c.first=os[0].date;c.firstSource=os[0].source||'';
  c.daysSince=days(c.last,TODAY);
  c.open=all.some(function(o){return !DONE_STATUS[o.status]&&o.status&&days(o.date,TODAY)<=180;});
  // months of the year they order in: count of distinct years per month
  var mset={};os.forEach(function(o){mset[o.date.getMonth()+'-'+o.date.getFullYear()]=1;});
  c.months=new Array(12).fill(0);Object.keys(mset).forEach(function(k){c.months[+k.split('-')[0]]++;});
  var ranked=c.months.map(function(n,i){return [n,i];}).filter(function(x){return x[0]>0;}).sort(function(a,b){return b[0]-a[0]||a[1]-b[1];});
  c.usual=ranked.length?ranked.slice(0,3).sort(function(a,b){return a[1]-b[1];}).map(function(x){return MON[x[1]];}):[];
  // buys: orders within RULES.mergeDays of the previous buy are the same buy
  var buys=[];os.forEach(function(o){if(buys.length&&days(buys[buys.length-1],o.date)<=RULES.mergeDays)return;buys.push(o.date);});
  c.buys=buys.length;
  // 1) same quarter in each past year
  var qy={};os.forEach(function(o){var d=o.date;if(d.getMonth()>=Q.m0&&d.getMonth()<Q.m0+3&&d<Q.start){(qy[d.getFullYear()]=qy[d.getFullYear()]||[]).push(o);}});
  c.qYears=Object.keys(qy).map(Number).sort();
  c.qRecent=c.qYears.filter(function(y){return y>=Q.y-2&&y<=Q.y-1;});
  c.qOlder=c.qYears.filter(function(y){return y<Q.y-2;});
  c.qByYear={};c.qYears.forEach(function(y){var l=qy[y];c.qByYear[y]={amt:l.reduce(function(s,o){return s+o.subtotal;},0),first:l[0].date,n:l.length};});
  c.qLastYear=c.qByYear[Q.y-1]?c.qByYear[Q.y-1].amt:0;
  c.qTwoYears=c.qByYear[Q.y-2]?c.qByYear[Q.y-2].amt:0;
  // 2) reorder rhythm
  c.gap=null;c.next=null;c.due=false;
  if(buys.length>=2){
    var gaps=[];for(var i=Math.max(1,buys.length-RULES.dueGaps);i<buys.length;i++)gaps.push(days(buys[i-1],buys[i]));
    var gp=median(gaps);
    if(gp>=RULES.dueMinGap&&gp<=RULES.dueMaxGap){
      c.gap=gp;c.next=addDays(buys[buys.length-1],Math.round(gp));
      c.due=c.next>=addDays(TODAY,-RULES.dueLookbackDays)&&c.next<=Q.end;
    }
  }
  // 3) gone quiet
  c.quiet=(c.spend>=RULES.quietMinSpend||c.buys>=RULES.quietMinOrders)&&c.daysSince>=RULES.quietDays&&c.daysSince<=RULES.quietMaxDays;
  c.reasons=[];if(c.qRecent.length)c.reasons.push('season');if(c.due)c.reasons.push('due');if(c.quiet)c.reasons.push('quiet');
  // score 0–100, every part shown in the detail
  c.pts={spend:Math.round(30*Math.sqrt(Math.min(c.spend,20000)/20000)),orders:Math.min(15,3*c.buys),
    season:15*c.qRecent.length+(c.qOlder.length?5:0),due:c.due?15:0,recent:c.daysSince<=RULES.recentDays?5:0};
  c.score=c.pts.spend+c.pts.orders+c.pts.season+c.pts.due+c.pts.recent;
  c.why=whyNow(c,Q);
  return c;
}
function gapWords(g){var m=g/30.4;if(m>=10.5&&m<=13.5)return 'about once a year';if(m<1.6)return 'about every '+Math.round(g/7)+' weeks';return 'about every '+Math.round(m)+' months';}
function whyNow(c,Q){
  var s=[];
  if(c.qRecent.length){
    var parts=c.qRecent.map(function(y){return fmon(c.qByYear[y].first);}),amts=c.qRecent.map(function(y){return c.qByYear[y].amt;});
    var same=amts.length===2&&Math.abs(amts[0]-amts[1])<=Math.max(50,amts[0]*.03);
    s.push('Ordered in '+parts.join(' and ')+' ('+(same?money(amts[0])+' each':amts.map(money).join(' and '))+')'
      +(c.qOlder.length?'; also '+Q.short+' '+c.qOlder.join(', '):'')+'.');
  }
  if(c.due)s.push('Orders '+gapWords(c.gap)+'; next one '+(c.next<TODAY?'was due around ':'due around ')+fmon(c.next)+'.');
  if(c.daysSince>=RULES.quietDays)s.push('Nothing since '+MONTH[c.last.getMonth()]+(c.last.getFullYear()!==TODAY.getFullYear()?' '+c.last.getFullYear():'')+'.');
  else if(!c.due)s.push('Last order '+fdate(c.last)+' ('+money(c.lastAmt)+').');
  return s.join(' ');
}
function build(){
  var Q=curQ();
  state.custs=groupCustomers(state.orders).map(function(g){return scoreCustomer(g,Q);}).filter(function(c){return c&&c.reasons.length;});
}

// ---------- per-computer marks (never Airtable) ----------
var MARKS={};try{MARKS=JSON.parse(store('pine_sales_marks')||'{}')||{};}catch(e){MARKS={};}
function saveMarks(){store('pine_sales_marks',JSON.stringify(MARKS));}
function mark(k){return MARKS[k]||null;}

// ---------- filtering + render ----------
var REASONS=[['all','All targets'],['season','Ordered in Q before'],['due','Due for a reorder'],['quiet','Gone quiet'],['marked','Contacted / skipped']];
function reasonLabel(r,Q){return r==='season'?'Ordered in '+Q.short+' before':r==='due'?'Due for a reorder':r==='quiet'?'Gone quiet':r;}
function baseList(){ // rep + min spend + search (the chips count within this)
  var q=state.q.trim().toLowerCase();
  return state.custs.filter(function(c){
    return (!state.rep||(state.rep==='__none'?!c.rep:c.rep===state.rep))&&c.spend>=state.minSpend&&(!q||c.name.toLowerCase().indexOf(q)>-1);
  });
}
function reasonFilter(r){
  if(r==='marked')return function(c){return !!mark(c.key);};
  if(r==='all')return function(c){var m=mark(c.key);return !m||m.t!=='skip';};
  return function(c){var m=mark(c.key);return c.reasons.indexOf(r)>-1&&(!m||m.t!=='skip');};
}
function sorted(list){
  var by={score:function(a,b){return b.score-a.score||b.spend-a.spend;},spend:function(a,b){return b.spend-a.spend;},
    last:function(a,b){return a.last-b.last;},name:function(a,b){return a.name.localeCompare(b.name);}}[state.sort];
  return list.slice().sort(function(a,b){var ma=mark(a.key)?1:0,mb=mark(b.key)?1:0;return state.reason==='marked'?by(a,b):(ma-mb||by(a,b));});  // contacted ones sink
}
function shownList(){return sorted(baseList().filter(reasonFilter(state.reason)));}
function render(){
  if(!state.loaded)return;
  var Q=curQ(),base=baseList();
  $('chips').innerHTML=REASONS.map(function(R){
    var n=base.filter(reasonFilter(R[0])).length,lab=R[0]==='season'?reasonLabel('season',Q):R[1];
    return '<button type="button" class="p-tab'+(state.reason===R[0]?' is-on':'')+(n?'':' zero')+'" data-reason="'+R[0]+'" role="tab" aria-selected="'+(state.reason===R[0])+'">'+esc(lab)+' <span class="p-count">'+n+'</span></button>';
  }).join('');
  var shown=shownList();state.shown=shown;
  var ly=Q.y-1,ly2=Q.y-2;
  var sum=function(f){return shown.reduce(function(s,c){return s+f(c);},0);};
  var tiles='<div class="tiles">'
    +'<div class="tile p-stat"><span class="p-label">Worth a call · '+esc(Q.label)+'</span><span class="p-big">'+shown.length.toLocaleString('en-US')+'</span><i>'+esc(state.rep==='__none'?'No rep on file':state.rep||'All reps')+(state.minSpend?' · '+money(state.minSpend)+'+ lifetime':'')+'</i></div>'
    +'<div class="tile"><span class="p-label">Their '+Q.short+' '+ly+' sales</span><b>'+money(sum(function(c){return c.qLastYear;}))+'</b><i>'+shown.filter(function(c){return c.qLastYear>0;}).length+' of them ordered then</i></div>'
    +'<div class="tile"><span class="p-label">Their '+Q.short+' '+ly2+' sales</span><b>'+money(sum(function(c){return c.qTwoYears;}))+'</b><i>'+shown.filter(function(c){return c.qTwoYears>0;}).length+' of them ordered then</i></div>'
    +'<div class="tile"><span class="p-label">Lifetime spend</span><b>'+money(sum(function(c){return c.spend;}))+'</b><i>'+sum(function(c){return c.n;}).toLocaleString('en-US')+' orders</i></div>'
    +'</div>';
  var head='<div class="p-head"><span class="p-section">Who to call</span><span class="p-head-sum"><b>'+shown.length+'</b> '+(shown.length===1?'customer':'customers')+' · '+esc(Q.span+' '+Q.y)+' · best first</span>'
    +'<div class="p-head-end"><button class="p-btn p-btn-main" type="button" id="copyBtn"'+(shown.length?'':' disabled')+'>Copy list ('+shown.length+')</button></div></div>';
  var empty='<div class="msg"><b>Nobody here</b>'+(state.q.trim()?'No target matches “'+esc(state.q.trim())+'”.':state.reason==='marked'?'Nothing marked contacted or skipped on this computer yet.':'Try All reps, a lower spend or another chip.')+'</div>';
  if(isWide()){renderSplit(tiles,head,shown,empty);return;}
  $('main').classList.remove('is-split');
  $('main').innerHTML=tiles+head+(shown.length?shown.slice(0,state.limit||200).map(function(c){return card(c,'',false);}).join('')+more(shown):empty);
}
function more(shown){var lim=state.limit||200;return shown.length>lim?'<div class="msg"><button class="p-btn" type="button" data-more="1">Show '+Math.min(200,shown.length-lim)+' more ('+(shown.length-lim)+' left)</button></div>':'';}
var WIDE=window.matchMedia?matchMedia('(min-width:1400px)'):null;
function isWide(){return !!(WIDE&&WIDE.matches);}
function renderSplit(tiles,head,shown,empty){
  var ls=$('splitList'),ds=$('splitDetail'),keepL=ls?ls.scrollTop:0,keepD=ds?ds.scrollTop:0,keepId=ds?ds.getAttribute('data-id'):'';
  var pick=shown.filter(function(c){return state.open[c.key];})[0]||shown[0];
  state.pickKey=pick?pick.key:'';
  var m=$('main');m.classList.add('is-split');
  m.innerHTML=tiles+'<div class="p-split" id="split"><div class="p-split-list" id="splitList">'+head
    +(shown.length?shown.slice(0,state.limit||200).map(function(c){return card(c,'list',pick&&c.key===pick.key);}).join('')+more(shown):empty)+'</div>'
    +'<div class="p-split-detail" id="splitDetail" data-id="'+esc(pick?pick.key:'')+'" aria-live="polite">'
    +(pick?card(pick,'detail',true):'<div class="p-split-empty">Pick a customer on the left</div>')+'</div></div>';
  setSplitTop();
  $('splitList').scrollTop=keepL;
  $('splitDetail').scrollTop=(pick&&keepId===pick.key)?keepD:0;
}
function setSplitTop(){var s=$('split');if(!s)return;document.documentElement.style.setProperty('--p-split-top',Math.round(s.getBoundingClientRect().top+window.scrollY)+'px');}
function card(c,mode,picked){
  var Q=curQ(),mk=mark(c.key),open=mode==='detail'||(mode===''&&state.open[c.key]);
  var tags=c.reasons.map(function(r){return '<span class="p-tag">'+esc(reasonLabel(r,Q))+'</span>';}).join('')
    +(c.open?'<span class="p-tag p-tag-soft">Order in progress</span>':'')
    +(mk?'<span class="p-tag '+(mk.t==='skip'?'p-tag-soft':'p-tag-done')+'">'+(mk.t==='skip'?'Skipped':'&#10003; Contacted')+' '+esc(fdate(new Date(mk.at)))+'</span>':'');
  var nums='<div class="p-lc-nums">'
    +'<span class="p-num"><small>Lifetime</small><b>'+money(c.spend)+'</b></span>'
    +'<span class="p-num"><small>Orders</small><b>'+c.n+'</b></span>'
    +'<span class="p-num is-wide"><small>Last order</small><b>'+esc(fmon(c.last))+' · '+money(c.lastAmt)+'</b></span></div>';
  var sub=(c.rep?esc(c.rep):'No rep')+(c.usual.length?' · usually '+c.usual.join(', '):'');
  var tap=mode!=='detail';
  var head='<div class="p-lc-head'+(tap?' is-tap':'')+'"'+(tap?' data-open="'+esc(c.key)+'" role="button" tabindex="0" aria-expanded="'+(!!open)+'"':'')+'>'
    +'<div class="p-lc-id"><span class="score" title="Score out of 100">'+c.score+'</span></div>'
    +'<div class="p-lc-main"><span class="p-lc-title">'+esc(c.name)+'</span><span class="p-lc-sub">'+sub+'</span></div>'
    +nums
    +(mode===''?'<div class="p-lc-act"><span class="p-lc-chev" aria-hidden="true">'+(open?'&#9650;':'&#9660;')+'</span></div>':'<div class="p-lc-act"></div>')
    +'<div class="p-lc-tags">'+tags+'</div></div>';
  var cls='p-lc'+(open||picked?' is-open':'')+(mk?' is-marked':'');
  return '<section class="'+cls+'" id="c-'+esc(c.key)+'">'+head+(open?body(c,Q):'')+'</section>';
}
function refRest(o,c){  // Order Reference is "1234-Customer": show only what the name and number don't already say
  var r=String(o.ref||'').replace(/^\d+\s*-\s*/,'').trim();return (!r||normName(r)===normName(o.name)||normName(r)===normName(c.name))?'':r;}
function body(c,Q){
  var mk=mark(c.key);
  var months='<div><div class="sec-h">Months they order in</div><div class="months">'+c.months.map(function(n,i){
      var tq=i>=Q.m0&&i<Q.m0+3;
      return '<div class="mo'+(n>=2?' n2':n===1?' n1':'')+(tq?' tq':'')+'" title="'+MONTH[i]+': ordered in '+n+' '+(n===1?'year':'years')+'"><span>'+MON[i][0]+'</span><b>'+(n||'·')+'</b></div>';
    }).join('')+'</div><div class="legend">Number = how many years they ordered that month. Yellow outline = '+esc(Q.span)+'.</div></div>';
  var facts='<div class="facts"><span>Customer since <b>'+esc(fmon(c.first))+'</b></span>'
    +(c.firstSource?'<span>First order came via <b>'+esc(c.firstSource)+'</b></span>':'')
    +(c.gap?'<span>Orders <b>'+gapWords(c.gap)+'</b></span>':'')
    +'<span>'+esc(Q.short)+' '+(Q.y-1)+': <b>'+money(c.qLastYear)+'</b></span><span>'+esc(Q.short)+' '+(Q.y-2)+': <b>'+money(c.qTwoYears)+'</b></span></div>';
  var p=c.pts;
  var score='<div class="score-line">Score '+c.score+' = spend '+p.spend+' + orders '+p.orders+' + '+esc(Q.short)+' history '+p.season+' + due '+p.due+' + recent '+p.recent+'</div>';
  var acts='<div class="acts">'
    +(mk?'<button class="p-btn" type="button" data-unmark="'+esc(c.key)+'">Clear mark</button>'
        :'<button class="p-btn p-btn-dark" type="button" data-mark="'+esc(c.key)+'" data-t="contact">&#10003; Mark contacted</button><button class="p-btn" type="button" data-mark="'+esc(c.key)+'" data-t="skip">Skip</button>')
    +'<span class="p-hint">Marks stay on this computer only.</span></div>';
  var rows=c.orders.slice().sort(function(a,b){return b.date-a.date;}).map(function(o){
    var inq=o.date&&o.date.getMonth()>=Q.m0&&o.date.getMonth()<Q.m0+3;
    return '<tr class="'+(inq?'inq':'')+(o.subtotal>0?'':' zero')+'"><td class="nw">'+esc(fdate(o.date))+(o.paid?'':' <span class="p-hint">(created)</span>')+'</td>'
      +'<td>'+(o.num?'<span class="p-id">'+esc(o.num)+'</span> ':'')+(refRest(o,c)?'<span class="ref" title="'+esc(o.ref)+'">'+esc(refRest(o,c))+'</span>':'')+'</td>'
      +'<td class="r nw">'+(o.subtotal>0?money(o.subtotal):'$0 <span class="p-hint">(not counted)</span>')+'</td>'
      +'<td>'+esc(o.ptypes.join(', '))+'</td><td class="r">'+(o.qty?o.qty.toLocaleString('en-US'):'')+'</td>'
      +'<td>'+esc(o.status)+(o.rep?' · '+esc(o.rep):'')+'</td>'
      +'<td><a href="'+atUrl(o.id)+'" target="_blank" rel="noopener" aria-label="Open order in Airtable">Airtable &#8599;</a></td></tr>';
  }).join('');
  var table='<div><div class="sec-h">Order history · '+c.orders.length+' '+(c.orders.length===1?'order':'orders')+' (yellow = '+esc(Q.span)+')</div><div class="scroll"><table class="oh"><thead><tr><th>Paid</th><th>Order</th><th class="r">Subtotal</th><th>Products</th><th class="r">Qty</th><th>Status · rep</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  return '<div class="p-lc-body"><div class="p-note why"><b>Why now:</b> '+esc(c.why)+'</div>'+facts+months+score+acts+table+'</div>';
}

// ---------- copy list (TSV for a spreadsheet) ----------
function tsv(){
  var Q=curQ(),cols=['Customer','Rep','Score','Why','Why now','Lifetime spend','Orders','Last order','Last order amount','Usual months',Q.short+' '+(Q.y-1),Q.short+' '+(Q.y-2),'Mark (this computer)'];
  var clean=function(v){return String(v==null?'':v).replace(/[\t\r\n]+/g,' ');};
  return [cols.join('\t')].concat((state.shown||[]).map(function(c){var mk=mark(c.key);
    return [c.name,c.rep,c.score,c.reasons.map(function(r){return reasonLabel(r,Q);}).join(', '),c.why,Math.round(c.spend),c.n,isoDay(c.last),Math.round(c.lastAmt),c.usual.join(' '),Math.round(c.qLastYear),Math.round(c.qTwoYears),mk?(mk.t==='skip'?'Skipped':'Contacted')+' '+isoDay(new Date(mk.at)):''].map(clean).join('\t');
  })).join('\n');
}
function copyList(){
  var t=tsv(),n=(state.shown||[]).length;
  var done=function(){toast('Copied '+n+' customers — paste into a spreadsheet');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallbackCopy(t)?done():toast('Couldn’t copy — try again',true);});}
  else{fallbackCopy(t)?done():toast('Couldn’t copy — try again',true);}
}
function fallbackCopy(t){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();var ok=document.execCommand('copy');a.remove();return ok;}catch(e){return false;}}

// ---------- controls ----------
function fillReps(){
  var cnt={};state.orders.forEach(function(o){if(o.rep)cnt[o.rep]=(cnt[o.rep]||0)+1;});
  var reps=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
  if(state.rep&&state.rep!=='__none'&&reps.indexOf(state.rep)<0)reps.push(state.rep);
  $('rep').innerHTML='<option value="">All reps</option>'+reps.map(function(r){return '<option value="'+esc(r)+'">'+esc(r)+'</option>';}).join('')
    +'<option value="__none">No rep on file</option>';  // older orders (before the Sales Person field was used) have no rep
  $('rep').value=state.rep;
}
$('qtr').innerHTML=QTRS.map(function(Q){return '<option value="'+Q.key+'">Target: '+Q.label+' ('+Q.span+')</option>';}).join('');
state.qtr=QTRS[0].key;
state.rep=store('pine_sales_rep')||'';
state.minSpend=+(store('pine_sales_min')||0)||0;$('minSpend').value=String(state.minSpend);if($('minSpend').value!==String(state.minSpend)){state.minSpend=0;$('minSpend').value='0';}
$('q').addEventListener('input',function(){state.q=this.value;state.limit=0;render();});
$('rep').addEventListener('change',function(){state.rep=this.value;store('pine_sales_rep',this.value||null);state.limit=0;render();});
$('minSpend').addEventListener('change',function(){state.minSpend=+this.value||0;store('pine_sales_min',String(state.minSpend));state.limit=0;render();});
$('sort').addEventListener('change',function(){state.sort=this.value;render();});
$('qtr').addEventListener('change',function(){state.qtr=this.value;if(state.loaded){build();render();}});
$('refreshBtn').onclick=function(){if(window.PineUpdate&&PineUpdate.check)PineUpdate.check();load();};
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-reason],[data-open],[data-mark],[data-unmark],[data-more],#copyBtn');
  if(!t)return;
  if(t.id==='copyBtn'){copyList();return;}
  if(t.dataset.reason){state.reason=t.dataset.reason;state.limit=0;render();return;}
  if(t.dataset.more){state.limit=(state.limit||200)+200;render();return;}
  if(t.dataset.mark){MARKS[t.dataset.mark]={t:t.dataset.t,at:Date.now()};saveMarks();paintMarkHint();render();toast(t.dataset.t==='skip'?'Skipped (this computer only)':'Marked contacted (this computer only)');return;}
  if(t.dataset.unmark){delete MARKS[t.dataset.unmark];saveMarks();paintMarkHint();render();return;}
  if(t.dataset.open){openCard(t.dataset.open);}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.open){e.preventDefault();e.target.click();}});
function openCard(k){
  if(isWide()){state.open={};state.open[k]=true;render();return;}
  var was=!!state.open[k],el=$('c-'+k),top=el?el.getBoundingClientRect().top:null;
  state.open={};if(!was)state.open[k]=true;
  render();
  var now=$('c-'+k);
  if(now&&top!=null){var d=now.getBoundingClientRect().top-top;if(d)window.scrollBy(0,d);}
  if(now&&now.getBoundingClientRect().top<0)now.scrollIntoView();
}
if(WIDE){var onWide=function(){if(state.loaded)render();};if(WIDE.addEventListener)WIDE.addEventListener('change',onWide);else if(WIDE.addListener)WIDE.addListener(onWide);}
window.addEventListener('resize',function(){if(isWide())setSplitTop();});
document.addEventListener('keydown',function(e){  // ↑/↓ move between customers in the two-pane view
  if((e.key!=='ArrowDown'&&e.key!=='ArrowUp')||!isWide()||!state.shown||!state.shown.length)return;
  var a=document.activeElement;
  if(a&&(/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)||a.closest('#splitDetail,#gear')))return;
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  var keys=state.shown.slice(0,state.limit||200).map(function(c){return c.key;}),i=keys.indexOf(state.pickKey),n=i+(e.key==='ArrowDown'?1:-1);
  if(n<0||n>=keys.length)return;
  e.preventDefault();state.open={};state.open[keys[n]]=true;render();
  var c=$('c-'+keys[n]);if(c)c.scrollIntoView({block:'nearest'});
});
// ⚙ menu: token + what the marks are
function paintMarkHint(){var n=Object.keys(MARKS).length;$('markHint').textContent=n?n+' marked on this computer':'None on this computer';$('clearMarks').disabled=!n;}
function showMenu(on){
  $('gear').hidden=!on;$('gearBtn').setAttribute('aria-expanded',on);
  if(on){$('tokIn').value='';$('tokHint').textContent=token()?'Saved on this computer. Paste a new one to change it.':'Not set. Needed to read orders.';paintMarkHint();}
}
$('gearBtn').onclick=function(){showMenu($('gear').hidden);};
document.addEventListener('pointerdown',function(e){if(!$('gear').hidden&&!e.target.closest('#gear,#gearBtn')&&token())showMenu(false);});

$('tokIn').addEventListener('keydown',function(e){if(e.key==='Enter')$('tokSave').click();});
$('tokSave').onclick=function(){var v=$('tokIn').value.trim();if(!v){toast('Paste the token first',true);return;}store('pine_at_key',v);showMenu(false);load();};
$('clearMarks').onclick=function(){if(!confirm('Clear all Contacted / Skip marks on this computer?'))return;MARKS={};saveMarks();paintMarkHint();render();};
// self-update: busy while the ⚙ menu is open or a search is typed (nothing here is ever unsaved in Airtable)
window.pineBusy=function(){try{return !$('gear').hidden||!!state.q.trim()||state.loading;}catch(e){return true;}};
// for tests: the computed targets (no writes, no network)
window.__sales={state:state,RULES:RULES,build:build,curQ:curQ};
load();
