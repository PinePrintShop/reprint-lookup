/* =====================================================================
   Create order v3 (Oct 13):

     Pine address (quotes cut). Another rep's own emails never reach this page: the worker (v20) filters by
     &inbox=<rep's addresses> and reads the rep's private mail with their own key (PIPEDRIVE_KEY_HELLO for Patrick).
     Reps without an inbox set here get no emails. Emails are shown as conversations; the reader uses the
     newest conversation the customer actually replied in.
   Create order v2 (Oct 13):
   - Emails: the order's rep's thread first (Patrick = hello@, Chris = sales@), other inboxes folded below (worker v19 sends to/cc).
   - "Read email & fill": worker v19 /ai/order-from-email reads the rep's emails with Claude and returns a DRAFT
     (lines: style, color, sizes; prints: location, type, colors, inks, print notes, repeat of a past imprint).
     The draft is shown first; Apply fills the form. Nothing is saved until Create order.
   - Print notes per print -> Imprints "Print Notes" (fldNuEzGIYI8FWqXu). Notes per line -> added under the print rows in Proofing Notes.
   Create order v1. Fills the Awaiting Proof order Pipedrive made:
   creates its Imprints, then its Line Items. ?practice=1 fakes every write.
   Safe writes only (see notes/create-order.md, Oct 12 automation check):
   - Imprint ID is NOT written: an automation copies it from "Imprint ID Generator",
     which needs Linked Orders set in the same create call.
   - Order Status is never written (status changes email the customer).
   - Line items get both order links (Order Reference is what automations read).
   - Never set Ready for 2nd Eyes, Ordered, Received; "UPDATE:" is kept out of Proofing Notes.
   ===================================================================== */
const BASE='appJkaLk8DykjsgHR', T_ORD='tbl8Tf0AeS9gnHOOS', T_GAR='tblukWGm0CIelookM', T_IMP='tbln9oAGvz2PNBZLV', T_LI='tblJx5UlwO7oMSk5H';

function saveTok(){ TOKEN=$('tok').value.trim(); try{ localStorage.setItem('pine_at_key',TOKEN); }catch(e){} $('tokBox').style.display='none'; loadAwaiting(); }
async function at(table,params){
  if(!TOKEN){ $('tokBox').style.display='block'; throw new Error('Add your Airtable token above'); }
  const r=await fetch(`https://api.airtable.com/v0/${BASE}/${table}?returnFieldsByFieldId=true&${params}`,{headers:{Authorization:'Bearer '+TOKEN}});
  if(!r.ok) throw new Error('Airtable '+r.status+(r.status===401?' — check the token':'')); return r.json();
}
async function atAll(table,params,max){ let out=[],off=''; do{ const d=await at(table,params+(off?'&offset='+off:'')); out=out.concat(d.records||[]); off=d.offset||''; }while(off&&out.length<max); return out; }
const byIds=ids=>encodeURIComponent('OR('+ids.map(x=>`RECORD_ID()='${x}'`).join(',')+')');
// The only writes on this page. Practice mode fakes them.
let FAKE=1;
async function atWrite(method,table,records){
  if(PRACTICE){ await new Promise(r=>setTimeout(r,120)); return {records:records.map(x=>({id:x.id||('recPRACTICE'+String(FAKE++).padStart(6,'0')),fields:x.fields}))}; }
  const r=await fetch(`https://api.airtable.com/v0/${BASE}/${table}`,{method,headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({records,typecast:true,returnFieldsByFieldId:true})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('Airtable '+r.status+': '+((j.error&&(j.error.message||j.error.type))||'write failed'));
  return j;

const ckey=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

function autoPT(l){ if(!isApparel(l)||l.ptManual) return; const ts=l.prints.map(id=>P(id).type); if(ts.length&&ts.every(t=>t==='Embroidery')) l.ptype='Embroidered Apparel'; else if(ts.some(t=>t!=='Embroidery')) l.ptype='Printed Apparel'; }
function detach(lid,pidv){ if(S.made&&S.made.newId[pidv]&&!S.lines.some(x=>x.id!==lid&&x.prints.includes(pidv))) return toast('Already created in Airtable — fix it in Line Item Review');
  const l=Ln(lid); l.prints=l.prints.filter(x=>x!==pidv); delete l.inks[pidv]; if(!S.lines.some(x=>x.prints.includes(pidv))) S.prints=S.prints.filter(p=>p.id!==pidv); autoPT(l); render(); }
function setInk(lid,pidv,v){ const l=Ln(lid), p=P(pidv); if(!v.trim()||v.trim()===p.inks) delete l.inks[pidv]; else l.inks[pidv]=v.trim(); render(); }
function setNick(pidv,v){ P(pidv).nick=v.trim(); render(); }
function setPNotes(pidv,v){ P(pidv).pnotes=v.trim(); render(); }
function addLine(kind){ const last=S.lines[S.lines.length-1], l=blankLine();
  if(last&&(kind==='prints'||kind==='copy')){ l.prints=[...last.prints]; l.ptype=last.ptype; }
  if(last&&kind==='copy'){ l.g=last.g; l.colors=last.colors; l.inks=Object.assign({},last.inks); }
  S.lines.push(l); render(); focusSoon(l.g?'paste_'+l.id:'gq_'+l.id); }
function rmLine(lid){ const l=Ln(lid); if(S.made&&S.made.lines.some(x=>x.l===l)) return toast('Already created in Airtable — fix it in Line Item Review'); S.lines=S.lines.filter(x=>x!==l); l.prints.forEach(x=>{ if(!S.lines.some(y=>y.prints.includes(x))) S.prints=S.prints.filter(p=>p.id!==x); }); render(); }

/* ---------- POM price: the Price-O-Matic itself, loaded hidden (same as quotes) ---------- */
let ENG=null;
function engReady(){ try{ const w=$('pomEngine').contentWindow; if(w&&typeof w.computeApparelAt==='function'){ ENG=w; render(); } }catch(e){} }
const fleeceOf=l=>!!(l.g&&(l.g.fleece||/hood|crew|fleece|sweat|zip/i.test(l.g.name)));
function pomImp(p,fleece,l){
  const b={loc:p.loc||'Front',printType:fleece?'Fleece':'Tees / Totes',inkChanges:0,fleeceImpressions:0,supSize:'4 X 4',supRecipe:'Wearable',supImprintsPerGang:1,decoSize:'2.5 X 2.5',decoMaterial:'Sim Woven / Twill',decoApplication:'Heat Press',embStitchBand:'Up to 5,000'};
  if(isSP(p)) return Object.assign(b,{type:'Screenprint',screens:p.colors||1,underbase:!!p.ub,inkChanges:inkChanges(p)});
  if(/^Supacolor - /.test(p.type)) return Object.assign(b,{type:'Supacolor',supRecipe:p.type.replace('Supacolor - ','')});
  if(p.type==='Embroidery') return Object.assign(b,{type:'Embroidery'});
  if(/Application$/.test(p.type)) return Object.assign(b,{type:'Embroidery',embStitchBand:p.type});
  return null; }
function pom(l){
  if(!isApparel(l)) return {why:'type the price'}; if(!ENG) return {why:'loading POM rates…'};
  const q=qty(l); if(!q) return {why:'add sizes'}; if(!l.g) return {why:'pick the garment'}; if(!l.g.cost) return {why:'garment has no cost in Airtable'};
  if(!l.prints.length) return {why:'add a print'};
  const fl=fleeceOf(l), list=l.prints.map(id=>pomImp(P(id),fl,l));
  if(list.some(x=>!x)) return {why:'a print here isn\'t priced by the POM — type the price'};
  // Same math as the POM's computeApparelAt, except each print is priced at the pieces it prints across the
  // whole order (a front shared by a 100 and a 20 prints 120), like Airtable's autoprice.
  const st={shipping:false,asColourLow:false,garmentCost:l.g.cost,fleece:fl,impressions:list};
  try{ if(typeof ENG.impressionPrice==='function'&&typeof ENG.garmentPricing==='function'){
      const imps=list.map((x,k)=>ENG.impressionPrice(x,printQty(P(l.prints[k]))||q)); if(imps.some(v=>v==null||!isFinite(v))) return {why:'no POM price at this qty'};
      const pp=Math.round(((ENG.garmentPricing(st)+imps.reduce((a,b)=>a+b,0))/0.97)/0.05)*0.05; return {pp:Math.round(pp*100)/100,shared:l.prints.some(x=>printQty(P(x))>q)}; }
    const c=ENG.computeApparelAt(q,st); return c&&c.pricePerPiece?{pp:Math.round(c.pricePerPiece*100)/100}:{why:'no POM price at this qty'}; }catch(e){ return {why:'POM error: '+e.message}; } }
const printQty=p=>linesWith(p).reduce((a,l)=>a+qty(l),0);
const price=l=>l.price!=null?l.price:(pom(l).pp??null);

/* ---------- checks ---------- */
function lineNeed(l){ if(isApparel(l)&&!l.g) return 'pick the garment'; if(!qty(l)) return isApparel(l)?'add sizes':'add the qty'; if(!l.prints.length&&isApparel(l)) return 'add a print'; if(price(l)==null) return 'add a price'; return ''; }
function printNeed(p){ return !p.nick.trim()?'needs a nickname':!p.loc?'needs a location':!p.type?'needs a type':isSP(p)&&!p.colors?'how many colors?':''; }
function checks(){ const c=[], bad=S.lines.filter(lineNeed), pb=S.prints.filter(printNeed);
  c.push([S.lines.length>0&&!bad.length,!S.lines.length?'Add a line':bad.length?`Line ${S.lines.indexOf(bad[0])+1}: ${lineNeed(bad[0])}`:`${S.lines.length} line item${S.lines.length>1?'s':''} ready`]);
  c.push([!pb.length&&(S.prints.length>0||S.lines.every(l=>!isApparel(l))),pb.length?`${pid(pb[0])}: ${printNeed(pb[0])}`:S.prints.length?`${S.prints.length} imprint${S.prints.length>1?'s':''} with nicknames`:'Add the prints']);
  if(S.existing.length+S.prints.length>26) c.push([false,'More than 26 imprints on one order']);
  return c; }
function proofNotes(l){ if(l.notes!=null) return l.notes;
  return l.prints.map(id=>{ const p=P(id), ink=(l.inks[id]??p.inks)||''; return `${pid(p)} ${p.loc} · ${p.nick}${isSP(p)?` · ${p.colors}c${p.ub?' + UB':''}`:` · ${p.type}`}${ink?' · inks: '+ink:''}${p.prev?' · repeat of '+p.prev.id:''}`; })
    .concat(l.extra&&l.extra.trim()?['Notes: '+l.extra.trim()]:[]).join('\n').replace(/UPDATE:/gi,'Update -'); }

/* ---------- create ---------- */
async function create(){
  if(S.busy||S.done) return; const c=checks(); if(!c.every(x=>x[0])) return toast('Finish the checklist first');
  S.busy=true; S.err=''; render();
  // A retry after a failure keeps what was already created (S.made) and only adds the rest, so nothing doubles.
  const made=S.made=S.made||{imps:[],lines:[],newId:{}}, newId=made.newId;
  try{
    // 1. Imprints one at a time, in order, so the ID automation hands out A, B, C… in the order shown here.
    for(const p of S.prints){ if(newId[p.id]) continue;
      const f={[IP.order]:[S.o.id],[IP.type]:p.type,[IP.loc]:p.loc,[IP.nick]:p.nick}; if(p.pnotes) f[IP.pnotes]=p.pnotes.replace(/UPDATE:/gi,'Update -');
      if(isSP(p)){ f[IP.screens]=screens(p); f[IP.inkChanges]=inkChanges(p); }
      if(p.prev){ f[IP.repeat]=true; f[IP.prev]=[p.prev.rid]; if(p.prev.inkIds&&p.prev.inkIds.length) f[IP.inks]=p.prev.inkIds; }
      const r=await atWrite('POST',T_IMP,[{fields:f}]); newId[p.id]=r.records[0].id; made.imps.push({p,rid:r.records[0].id});
    }
    // 2. Line items, 10 per call. Both order links: automations read Order Reference.
    const todo=S.lines.filter(l=>!made.lines.some(x=>x.l===l));
    const recs=todo.map(l=>{ const f={[LF.ref]:[S.o.id],[LF.orders]:[S.o.id],[LF.ptype]:l.ptype,[LF.price]:price(l),[LF.imprints]:l.prints.map(x=>newId[x])};
      if(l.g) f[LF.garment]=[l.g.id]; const n=proofNotes(l); if(n) f[LF.proof]=n; if(l.womens) f[LF.womens]=true; if(l.youth) f[LF.youth]=true;
      Object.entries(l.sizes).forEach(([z,v])=>{ if(SZF[z]&&v) f[SZF[z]]=v; }); return {fields:f}; });
    for(let i=0;i<recs.length;i+=10){ const r=await atWrite('POST',T_LI,recs.slice(i,i+10)); r.records.forEach((x,k)=>made.lines.push({l:todo[i+k],rid:x.id})); }
    S.done=made; S.tEnd=Date.now(); S.busy=false; render(); toast(PRACTICE?'Practice: nothing was saved':'Order '+S.o.num+' created');
    if(!PRACTICE) setTimeout(readBackIds,4000);
  }catch(e){ S.busy=false; S.err=`Stopped: ${e.message}. Already in Airtable: ${made.imps.length} imprint${made.imps.length===1?'':'s'}, ${made.lines.length} line item${made.lines.length===1?'':'s'}. Fix the problem and press Finish creating — it only adds what's missing.`; render(); }
}
async function readBackIds(){ try{ const ids=S.done.imps.map(x=>x.rid); if(!ids.length) return; const d=await at(T_IMP,`${flds([IP.id])}&filterByFormula=${byIds(ids)}`); S.done.ids={}; (d.records||[]).forEach(r=>S.done.ids[r.id]=r.fields[IP.id]||''); render(); }catch(e){} }

let pendingFocus=null; function focusSoon(id){ pendingFocus=id; setTimeout(()=>{ const e=$(id); if(e) e.focus(); pendingFocus=null; },0); }

const errHtml=()=>S.err?`<div class="err">${esc(S.err)}</div>`:'';

function vDraft(){ const d=S.draft;

function vEdit(){ let h=`<div class="panel${S.done?' locked':''}">${orderHead()}${S.done?`<div class="donebar">${PRACTICE?'Practice run finished — nothing was saved.':'Created in Airtable.'} Changes from here go in <a href="pine-line-item-review.html?order=${S.o.num}">Line Item Review</a>.</div>`:''}${vMail()}`;

  if(ap&&l.g){ const zs=APP_SIZES.concat(Object.keys(l.sizes).filter(z=>!APP_SIZES.includes(z)));
    h+=`<span class="k">Sizes</span><div class="szrow"><div class="szs">${zs.map(z=>`<label>${z}<input id="sz_${l.id}_${z}" inputmode="numeric" value="${l.sizes[z]||''}" onchange="setSz('${l.id}','${z}',this.value)"></label>`).join('')}</div>
      <div class="paste"><small>Paste or type from the email</small><input id="paste_${l.id}" placeholder="6 S, 6 M, 15 XL, 5 2XL" onkeydown="if(event.key==='Enter'){pasteSz('${l.id}',this.value);this.value=''}" onpaste="setTimeout(()=>{pasteSz('${l.id}',this.value);this.value=''},0)" onchange="if(this.value){pasteSz('${l.id}',this.value);this.value=''}"></div>
      ${l.last&&Object.keys(l.last.sizes).length?`<div class="hint" style="width:100%">Last time (${l.last.order}): ${esc(szText(l.last.sizes))} <button class="link" onclick="sameAsLast('${l.id}')">use same sizes</button></div>`:''}
      <div class="bts" style="width:100%"><button class="b${l.womens?' on':''}" onclick="Ln('${l.id}').womens=!Ln('${l.id}').womens;render()">Women's</button><button class="b${l.youth?' on':''}" onclick="Ln('${l.id}').youth=!Ln('${l.id}').youth;render()">Youth</button></div></div>`; }
  if(!ap) h+=`<span class="k">Qty</span><div class="bts"><input class="t" id="oq_${l.id}" style="width:110px" inputmode="numeric" value="${q||''}" placeholder="qty" onchange="osfaQty('${l.id}',this.value)"><span class="hint">no garment needed · price typed above</span></div>`;
  h+=`<span class="k">Prints</span><div><div class="prints">${l.prints.map(id=>{ const p=P(id), ink=l.inks[id]??p.inks, img=p.prev&&p.prev.thumb;
      return `<span class="prc">${img?`<img src="${esc(img)}" alt="">`:`<span class="noimg">${p.prev?'repeat':'new'}</span>`}<span class="tx"><b><span class="idtag">${letterOf(p)}</span> <input style="width:150px;height:22px;font-weight:700;font-size:13px" value="${esc(p.nick)}" placeholder="nickname" aria-label="Imprint nickname" onchange="setNick('${id}',this.value)"></b><span>${esc(p.loc)} · ${isSP(p)?screens(p)+' scr · '+esc(p.type):esc(p.type)}${p.prev?' · repeat of '+esc(p.prev.id):''}${linesWith(p).length>1?' · on '+linesWith(p).length+' lines':''}</span>${isSP(p)?`<span>inks: <input value="${esc(ink)}" placeholder="ink colors" aria-label="Ink colors on this garment" onchange="setInk('${l.id}','${id}',this.value)"></span>`:''}<span>print notes: <input class="pn" value="${esc(p.pnotes||'')}" placeholder="size, placement, press notes" aria-label="Print notes for this imprint" onchange="setPNotes('${id}',this.value)"></span></span><button class="x" onclick="detach('${l.id}','${id}')" aria-label="Remove print">✕</button></span>`; }).join('')}
    <button class="b${l.prints.length?'':' on'}" onclick="openAdd('${l.id}')">＋ Print</button></div></div>`;
  h+=`<span class="k">Notes</span><div><input class="t" id="ln_${l.id}" style="width:100%" value="${esc(l.extra||'')}" placeholder="For the proofer: placement, tags, &quot;same as last year&quot;…" onchange="Ln('${l.id}').extra=this.value;render()">${l.aiNote&&!l.g?`<div class="hint" style="margin-top:4px">Email said: ${esc(l.aiNote)} — pick the garment above.</div>`:''}</div>`;
  if(S.add===l.id) h+=vAdd(l);
  return h+`</div></div>`; }
function vAdd(l){ const others=S.prints.filter(p=>!l.prints.includes(p.id)), art=S.pastImps;
  let h=`<div class="addp"><div class="tabs">${others.length?`<button class="b${S.tab==='order'?' on':''}" onclick="setTab('order')">On this order (${others.length})</button>`:''}${art.length?`<button class="b${S.tab==='past'?' on':''}" onclick="setTab('past')">${esc(S.o.name)} past art (${art.length})</button>`:''}<button class="b${S.tab==='new'?' on':''}" onclick="setTab('new')">＋ New art</button><button class="link" style="margin-left:auto" onclick="S.add=null;render()">close</button></div>`;
  if(S.tab==='order') h+=`<div class="bts">${others.map(p=>`<button class="prc" onclick="attach('${l.id}','${p.id}')">${p.prev&&p.prev.thumb?`<img src="${esc(p.prev.thumb)}" alt="">`:`<span class="noimg">${p.prev?'repeat':'new'}</span>`}<span class="tx"><b><span class="idtag">${letterOf(p)}</span> ${esc(p.nick)}</b><span>${esc(p.loc)}</span></span></button>`).join('')}</div><div class="hint" style="margin-top:6px">Same imprint ID, no new screens.</div>`;
  if(S.tab==='past'){ const q=S.artQ.trim().toLowerCase(), hits=art.filter(a=>!q||[a.id,a.nick,a.loc,a.type,a.inks].join(' ').toLowerCase().includes(q)).slice(0,60);
    h+=`<input class="t" id="artq" style="width:100%;margin-bottom:8px" placeholder="Search name, location, ink or order #" value="${esc(S.artQ)}" oninput="S.artQ=this.value;render()" autocomplete="off"><div class="artg">${hits.map(a=>`<button class="art" onclick="attachPast('${l.id}','${a.rid}')">${a.thumb?`<img src="${esc(a.thumb)}" loading="lazy" alt="">`:'<span class="noimg">no proof</span>'}<b>${esc(a.id)}</b> ${esc(a.nick)}<br><span class="hint">${esc(a.loc)} · ${esc(a.type)}${a.screens?' · '+a.screens+' scr':''} · ${esc(a.created)}</span></button>`).join('')||'<span class="hint">No match</span>'}</div><div class="hint" style="margin-top:6px">Makes a new imprint on this order, marked Repeat and linked to the old one.</div>`; }
  if(S.tab==='new'){ const n=S.np, sp=isSPType(n.type)||n.fam==='Screen print';
    h+=`<div class="npf"><span class="k">Nickname</span><input class="t" id="npnick" value="${esc(n.nick)}" placeholder="e.g. Damn Proud" oninput="S.np.nick=this.value" onkeydown="if(event.key==='Enter')saveNew('${l.id}')">
     <span class="k">Location</span><div class="bts">${LOCS.map(x=>`<button class="b${n.loc===x?' on':''}" onclick="S.np.loc='${x}';render()">${x}</button>`).join('')}</div>
     <span class="k">Method</span><div class="bts">${Object.keys(FAM).map(f=>`<button class="b${n.fam===f?' on':''}" onclick="setFam('${f}')">${f}</button>`).join('')}</div>
     ${n.fam&&FAM[n.fam].length>1?`<span class="k">Type</span><div class="bts">${FAM[n.fam].map(t=>`<button class="b${n.type===t?' on':''}" onclick="setNpType('${t}')">${t.replace('Supacolor - ','')}</button>`).join('')}</div>`:''}
     ${sp?`<span class="k">Colors</span><div class="bts">${[1,2,3,4,5,6,7,8].map(c=>`<button class="b${n.colors===c?' on':''}" onclick="S.np.colors=${c};render()">${c}</button>`).join('')}<button class="b${n.ub?' on':''}" onclick="S.np.ub=!S.np.ub;render()">+ Underbase</button><span class="hint">${n.colors?(n.colors+(n.ub?1:0))+' screens':''}</span></div>
     <span class="k">Inks</span><input class="t" value="${esc(n.inks)}" placeholder="optional, e.g. White, PMS 7409" oninput="S.np.inks=this.value">`:''}
     <span></span><div><button class="btn y" onclick="saveNew('${l.id}')">Add ${S.o.num}-${LETTERS[S.existing.length+S.prints.length]||'?'}</button></div></div>`; }
  return h+`</div>`; }
function vRail(){ if(!S.o) return `<h3>Create order</h3><div class="hint">Pick the order. The clock up top times you, so we can compare with Airtable.</div>`;
  if(S.view==='door'||S.view==='loading') return `<h3>${esc(S.o.name)}</h3><div class="hint">${S.past.length} past orders · ${S.pastImps.length} past imprints on file.</div>`;
  const c=checks(), ok=c.every(x=>x[0]), pcs=S.lines.reduce((a,l)=>a+qty(l),0), tot=S.lines.reduce((a,l)=>a+(price(l)||0)*qty(l),0);
  let h=`<h3>Order ${S.o.num}</h3><ul class="chk">${c.map(([k,t])=>`<li class="${k?'ok':'bad'}"><i>${k?'✓':''}</i>${esc(t)}</li>`).join('')}</ul>`;
  if(S.prints.length) h+=`<div class="imps">${S.prints.map(p=>`<div><span class="idtag">${pid(p)}</span> ${esc(p.nick)} <span class="hint">${esc(p.loc)} · ${linesWith(p).length} line${linesWith(p).length===1?'':'s'}${inkChanges(p)?' · '+inkChanges(p)+' ink change'+(inkChanges(p)>1?'s':''):''}${p.pnotes?' · 📝':''}</span></div>`).join('')}</div>`;
  h+=`<div class="tots"><span>Line items</span><b>${S.lines.length}</b><span>Pieces</span><b>${pcs}</b><span>Total <span class="hint">before 2XL+ up-charges</span></span><b class="big">${money(tot)}</b></div>`;
  if(!S.done) h+=`<div style="margin-top:12px"><button class="btn k" style="width:100%" onclick="create()" ${ok&&!S.busy?'':'disabled'}>${S.busy?'Creating…':S.made?'Finish creating':PRACTICE?'Create order (practice)':'Create order'}</button></div>${S.err&&S.made?`<div class="err">${esc(S.err)}</div>`:''}`;
  if(S.done){ const d=S.done; h+=`<div class="out"><b>${PRACTICE?'Practice — nothing saved.':'Created in Airtable.'} Took ${fmtT(S.tEnd-S.t0)}.</b>\n\n${d.imps.length} imprint${d.imps.length===1?'':'s'}\n${d.imps.map(x=>`• ${esc((d.ids&&d.ids[x.rid])||pid(x.p))} · ${esc(x.p.nick)} · ${esc(x.p.loc)}${x.p.prev?' · repeat of '+esc(x.p.prev.id):''}`).join('\n')}\n\n${d.lines.length} line item${d.lines.length===1?'':'s'}\n${d.lines.map(x=>`• ${esc(x.l.g?gLabel(x.l.g)+' '+x.l.g.color:x.l.ptype)} · ${qty(x.l)} pcs · ${money(price(x.l))}`).join('\n')}</div>
    <div class="bts" style="margin-top:10px"><a class="btn y" style="display:flex;align-items:center;text-decoration:none" href="pine-line-item-review.html?order=${S.o.num}">Review ${S.o.num} →</a><button class="link" onclick="S.view='pick';S.o=null;S.t0=null;S.done=null;S.made=null;render()">next order</button></div>`; }
  return h; }
setInterval(()=>{ const e=$('clock'); if(e) e.textContent=S.t0?fmtT((S.tEnd||Date.now())-S.t0):'0:00'; },500);
if(PRACTICE) $('pracTag').style.display='';
window.addEventListener('beforeunload',e=>{ if(S.o&&!S.done&&S.lines.some(l=>l.g||l.prints.length)){ e.preventDefault(); e.returnValue=''; } });
render(); loadAwaiting();
</script>
</body>
</html>
