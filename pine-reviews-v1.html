<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Reviews">
<title>Pine Reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap">
<link rel="stylesheet" href="pine-style-v2.css">
<style>
/* Pine Reviews v1 (2026-11-13) — performance reviews (manager + anonymous peers) and quarterly check-ins.
   The page holds no data and no keys: everything comes from the pine-reviews worker for the person signed in
   (personal link #k=… + PIN). ?practice=1 runs on made-up people inside the page and never calls the worker.
   Built from pine-reviews-mockup-v10.html. Notes: notes/reviews.md */
body{margin:0}
[hidden].p-toast{display:none!important}
.wrap{padding:0 var(--p-page-x)}
.col{max-width:680px;margin:0 auto;padding:var(--p-s5) var(--p-page-x) var(--p-s6)}
.col-wide{max-width:1200px}
.p-bar-me{font:800 var(--p-fs-s)/1 var(--p-sans);color:var(--p-white);white-space:nowrap}
.p-bar-sp{position:relative}

.f-head{display:flex;align-items:center;gap:var(--p-s3);flex-wrap:wrap}
.f-who{font:900 var(--p-fs-xl)/1.1 var(--p-display);text-transform:uppercase;letter-spacing:.005em;word-spacing:.08em}
.f-sub{color:var(--p-ink-2);font-size:var(--p-fs-s)}
.stack{display:grid;gap:var(--p-s3);grid-template-columns:minmax(0,1fr)}
.st>*{min-width:0;overflow-wrap:anywhere}
.q{background:var(--p-white);border:1px solid var(--p-line);border-left:6px solid var(--p-black);border-radius:var(--p-r-lg);padding:var(--p-s5);display:grid;gap:var(--p-s4)}
.q.is-miss{border:2px solid var(--p-black);background:var(--p-yellow-lt)}
.q-top{display:flex;gap:var(--p-s4);align-items:flex-start}
.q-n{flex:none;display:grid;place-items:center;width:40px;height:40px;font:900 var(--p-fs-l)/1 var(--p-display);background:var(--p-black);color:var(--p-yellow);border-radius:4px}
.q-t{display:block;font:700 22px/1.3 var(--p-sans);flex:1;min-width:0;color:var(--p-black)}
.q-t .p-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
@media (max-width:700px){ .q{padding:var(--p-s4)} .q-t{font-size:19px} .q-n{width:34px;height:34px;font-size:var(--p-fs-m)} }
.why{display:grid;gap:6px}
.why .p-label{color:var(--p-black)}
.why textarea{min-height:72px}
.why-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-height:16px}
.why-h .p-hint{font-size:var(--p-fs-xs);white-space:nowrap}
.why.is-short .p-textarea{border-color:var(--p-black)}
.why.is-short .why-h .p-hint{color:var(--p-black);font-weight:700}
.rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rate button{min-height:64px;border:2px solid var(--p-line-strong);border-radius:var(--p-r);background:var(--p-white);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:8px 6px;color:var(--p-black);font:400 var(--p-fs-xs)/1.25 var(--p-sans);text-align:center}
.rate button b{font:900 22px/1 var(--p-display)}
.rate button:hover{border-color:var(--p-black)}
.rate button.is-on{background:var(--p-black);color:var(--p-white);border-color:var(--p-black)}
.rate button.is-on b{color:var(--p-yellow)}
.rate button:disabled{cursor:default}
.rate-pick{display:none;font-size:var(--p-fs-s);color:var(--p-ink-2)}
.lock{display:inline-flex;align-items:center;gap:6px;font:700 var(--p-fs-xs)/1.3 var(--p-sans);text-transform:uppercase;letter-spacing:.04em;color:var(--p-ink-2)}
.prog{position:sticky;top:var(--bar-h,64px);z-index:5;background:var(--p-cream-lt);padding:10px 0 8px;margin:0 0 -4px;display:flex;align-items:center;gap:10px}
.prog-bar{flex:1;height:6px;border-radius:3px;background:var(--p-cream-dk);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--p-black);transition:width .25s}
.prog span{font:700 var(--p-fs-xs)/1 var(--p-sans);color:var(--p-ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog span.is-err{color:var(--p-alert)}
.f-end{display:grid;gap:10px;margin:var(--p-s4) 0 var(--p-s6);justify-items:start}
.f-end .p-btn{min-width:240px}
.stack>.q,.f-end{scroll-margin-top:calc(var(--bar-h,64px) + 48px)}
@media (max-width:700px){
  .rate button span{display:none}
  .rate button{min-height:60px;justify-content:center}
  .rate button b{font-size:26px}
  .rate-pick{display:block}
  .col>.stack>.q{background:transparent;border:0;border-bottom:1px solid var(--p-line-strong);border-radius:0;padding:var(--p-s5) 0}
  .col>.stack>.q.is-miss{background:var(--p-yellow-lt);border:0;border-radius:var(--p-r-lg);padding:var(--p-s4) var(--p-s3)}
  .f-end{justify-items:stretch}
  .f-end .p-btn{width:100%}
}
/* sign-in */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:var(--p-s3) 0}
.pin-dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--p-black)}
.pin-dots i.on{background:var(--p-black)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto;width:100%}
.pad button{min-height:64px;border:2px solid var(--p-line-strong);border-radius:var(--p-r-lg);background:var(--p-white);font:900 26px/1 var(--p-display);color:var(--p-black);cursor:pointer}
.pad button:active,.pad button.tap{background:var(--p-black);color:var(--p-yellow)}
.pad button.ghost{visibility:hidden}
.pad button:disabled{opacity:.4}
.center{text-align:center}
.done-ck{width:96px;height:96px;border-radius:50%;background:var(--p-black);color:var(--p-yellow);display:grid;place-items:center;font:900 52px/1 var(--p-display);margin:var(--p-s6) auto var(--p-s4)}
.pick-card{display:grid;gap:4px;text-align:left;width:100%;padding:var(--p-s4);border:2px solid var(--p-black);border-radius:var(--p-r-lg);background:var(--p-white);cursor:pointer;font:400 var(--p-fs-m)/1.3 var(--p-sans);color:var(--p-black)}
.pick-card b{font:800 var(--p-fs-l)/1.2 var(--p-sans)}
.pick-card:hover{background:var(--p-cream)}
/* next steps */
.mine{display:grid;gap:var(--p-s2);margin:var(--p-s2) 0 var(--p-s4)}
.mine .f-head{margin:0}
.mt-step{gap:12px;min-height:52px;cursor:pointer;flex-wrap:wrap}
.mt-step input{width:22px;height:22px;accent-color:var(--p-black)}
.mt-step span:first-of-type{flex:1 1 55%}
/* results */
.res-top{display:grid;grid-template-columns:auto 1fr;gap:var(--p-s4);align-items:center}
.res-score{background:var(--p-black);color:var(--p-white);border-radius:var(--p-r-lg);padding:var(--p-s4) var(--p-s5);text-align:center;min-width:150px}
.res-score .p-big{color:var(--p-yellow);font-size:56px}
.res-score .p-label{color:rgba(255,255,255,.75)}
.rt{width:100%;border-collapse:collapse;background:var(--p-white);border:1px solid var(--p-line);border-radius:var(--p-r-lg);overflow:hidden}
.rt th,.rt td{padding:10px 12px;border-top:1px solid var(--p-line);text-align:left;vertical-align:middle}
.rt th{font:700 var(--p-fs-xs)/1.2 var(--p-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-2);background:var(--p-cream-lt);border-top:0}
.rt td.n{font:800 17px/1 var(--p-sans);font-variant-numeric:tabular-nums;white-space:nowrap;width:1%}
.bar5{display:inline-block;width:90px;height:10px;border-radius:5px;background:var(--p-cream);vertical-align:middle;margin-left:8px;position:relative;overflow:hidden}
.bar5 i{position:absolute;left:0;top:0;bottom:0;background:var(--p-black)}
@media (max-width:700px){ .bar5{display:none} .res-top{grid-template-columns:1fr} }
.cmt{background:var(--p-white);border:1px solid var(--p-line);border-left:4px solid var(--p-black);border-radius:var(--p-r);padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt .p-label{display:block;margin-bottom:4px;white-space:normal}
.cmt-peer{border-left-color:var(--p-cream-dk)}
.rq{gap:var(--p-s3)}
.rq-h{display:flex;align-items:center;gap:var(--p-s3);flex-wrap:wrap}
.rq-h .q-t{flex:1 1 auto;font-size:18px}
.rq-n{display:inline-flex;flex-direction:column;align-items:flex-end;min-width:64px}
.rq-n small{font:700 var(--p-fs-xs)/1.2 var(--p-sans);text-transform:uppercase;letter-spacing:.04em;color:var(--p-ink-2)}
.rq-n b{font:800 20px/1.1 var(--p-sans);font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:var(--p-fs-s)}
/* check-in meeting */
.mt{gap:var(--p-s3)}
.mt-q{font-size:18px}
.mt-a{background:var(--p-cream);border-radius:var(--p-r);padding:10px 14px;font-size:var(--p-fs-m);line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.mt-n{min-height:44px;font-size:var(--p-fs-s);background:var(--p-cream-lt)}
.mt-next{display:flex;align-items:center;gap:8px;justify-content:space-between;border-bottom:1px solid var(--p-line);padding:4px 0}
.mt-add{display:flex;gap:8px}
.mt-add .p-input{flex:1}
/* setup */
.st{display:grid;grid-template-columns:minmax(170px,1.2fr) minmax(120px,.8fr) minmax(150px,1fr) 380px;gap:var(--p-s3);align-items:center;padding:10px var(--p-s4);border-top:1px solid var(--p-line);background:var(--p-white)}
.st:first-child{border-top:0}
.st.is-h{background:var(--p-cream-lt);font:700 var(--p-fs-xs)/1.2 var(--p-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-2);padding-top:8px;padding-bottom:8px}
.st.is-off{color:var(--p-ink-3)}
.st .p-btns{justify-content:flex-start}
.st .p-btn{min-height:40px;padding:0 12px;font-size:var(--p-fs-s)}
.st-cyc{grid-template-columns:minmax(170px,1.4fr) minmax(90px,.6fr) minmax(120px,.8fr) minmax(120px,.8fr) 120px}
@media (max-width:900px){ .st,.st-cyc{grid-template-columns:1fr 1fr} .st>.p-btns{grid-column:1 / -1;justify-content:flex-start} .st.is-h{display:none} }
.as-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.as-row .p-select{width:auto;min-width:0;flex:1 1 160px}
.as-row .p-btn{white-space:normal;text-align:left;min-height:44px;height:auto;padding-top:8px;padding-bottom:8px}
.q{grid-template-columns:minmax(0,1fr)}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 4px 0 10px;border-radius:var(--p-pill);background:var(--p-cream);border:1px solid var(--p-cream-dk);font:700 var(--p-fs-s)/1.2 var(--p-sans)}
.chip button{width:28px;height:28px;border:0;background:transparent;border-radius:50%;cursor:pointer;font-size:16px;color:var(--p-ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.linkbox{font:400 var(--p-fs-xs)/1.4 var(--p-sans);color:var(--p-ink-2);word-break:break-all;background:var(--p-cream-lt);border-radius:var(--p-r);padding:8px 10px}
.p-pane-main > .stack{max-width:980px}
.loading{color:var(--p-ink-2);padding:var(--p-s5) 0}
@media print{ .p-bar,.p-pane-side,.f-end,.no-print{display:none!important} .p-panes{display:block} .p-pane-main{height:auto;overflow:visible} }
.p-bar-views:empty{display:none}
</style>
</head>
<body class="p-app">
<header class="p-bar" id="bar">
  <span class="p-mark"><span class="p-logo"></span></span>
  <span class="p-bar-app">Reviews</span>
  <span class="p-bar-ver" id="ver"></span>
  <span class="p-tag p-tag-wait" id="practiceTag" hidden>Practice</span>
  <nav class="p-bar-views" id="views" hidden></nav>
  <div class="p-bar-sp">
    <span class="p-bar-me" id="meName"></span>
    <button class="p-barbtn" data-act="refresh" id="refreshBtn" hidden aria-label="Refresh">↻ <span class="p-barbtn-word">Refresh</span></button>
    <button class="p-barbtn p-barbtn-icon" data-act="menu" id="gearBtn" hidden aria-label="Settings">⚙</button>
    <div class="p-menu" id="menu" hidden></div>
  </div>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast" class="p-toast" hidden role="status"></div>

<script src="pine-update.js" data-link="reviews.html"></script>
<script>
'use strict';
/* ======================================================================= setup */
const WORKER = 'https://pine-reviews.stephen-dab.workers.dev';
const QS = new URLSearchParams(location.search);
const PRACTICE = QS.get('practice') === '1';
const LOCALDEV = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const API = (LOCALDEV && QS.get('api')) || WORKER;   // ?api= only for local tests
const MIN_TXT = 20;

const ss = {   // sessionStorage, wrapped (private mode / blocked storage must not break the app)
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} },
};
// The personal link code arrives after "#k=". Take it, then wipe it from the address bar at once.
(function takeCode() {
  const m = location.hash.match(/[#&]k=([A-Za-z0-9_-]{20,120})/);
  if (m) { if (!PRACTICE) ss.set('rv.code', m[1]); history.replaceState(null, '', location.pathname + location.search); }
})();

const S = {
  code: PRACTICE ? null : ss.get('rv.code'),
  session: PRACTICE ? null : ss.get('rv.session'),
  stage: 'boot', msg: '', hello: null, pin: '', pin1: '', pinBusy: false,
  data: null, view: 'todo', pick: null, form: null,
  crew: null, cycleId: null, rPick: null, results: null, cPick: null, ci: null,
  admin: null, assign: { cycleId: null, items: [] },
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const firstOf = n => String(n || '').trim().split(/\s+/)[0] || '';
const okT = t => typeof t === 'string' && t.trim().length >= MIN_TXT;
const isRated = q => q.scale && q.scale !== 'None';
const f1 = n => (n == null ? '—' : Number(n).toFixed(1));
const day = d => { if (!d) return ''; const x = new Date(String(d).length <= 10 ? d + 'T12:00:00' : d); return isNaN(x) ? '' : x.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
function toast(t, isAlert) { const el = $('#toast'); el.textContent = t; el.classList.toggle('is-alert', !!isAlert); el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }

const SCALES = {
  'Expectations': ['Needs significant improvement', 'Below expectations', 'Meets expectations', 'Exceeds expectations', 'Exceptional — a role model'],
  'Skills used': ['Badly under-used or in the wrong role', 'Under-used in some clear ways', 'A good fit for the role', 'Well used and engaged', 'Thriving — ready for more'],
  'Not at all–Completely': ['Not at all', 'A little', 'Somewhat', 'Mostly', 'Completely'],
  'Poor–Great': ['Poor', 'Fair', 'OK', 'Good', 'Great'],
};
const scaleLabels = s => SCALES[String(s || '').replace(/\s*[-—–]\s*/, '–')] || ['', '', '', '', ''];
// the example box's label follows the number (Stephen: "what would get them to a four if they clicked 3")
function whyPrompt(v, self) {
  if (!v || v === 4) return 'Give one example';
  if (v <= 2) return self ? 'What would help? Give one example' : 'What would help them improve? Give one example';
  if (v === 3) return self ? 'What would make it a 4?' : 'What would get them to a 4?';
  return 'What makes it a 5? Give one example';
}

/* ======================================================================= talking to the worker */
class ApiErr extends Error { constructor(status, msg, extra) { super(msg); this.status = status; this.extra = extra || {}; } }
async function call(path, body) {
  let status, j;
  if (PRACTICE) {
    ({ status, j } = await Practice.call(path, body, S.session));
  } else {
    const h = { 'Content-Type': 'application/json' };
    if (S.session) h.Authorization = 'Bearer ' + S.session;
    let r;
    try { r = await fetch(API + path, { method: 'POST', headers: h, body: JSON.stringify(body || {}), cache: 'no-store', referrerPolicy: 'no-referrer' }); }
    catch (e) { throw new ApiErr(0, 'No connection. Check your signal and try again.'); }
    status = r.status; j = await r.json().catch(() => ({}));
  }
  if (status >= 200 && status < 300) return j;
  const err = new ApiErr(status, (j && j.error) || 'Something went wrong. Try again.', j);
  if (status === 401 && S.session && !/^\/r\/(hello|signin|pin\/set)$/.test(path)) signedOut(err.message);
  throw err;
}
function signedOut(msg) {
  S.session = null; ss.set('rv.session', null); S.data = null; S.form = null;
  startSignIn(msg || 'You were signed out. Enter your PIN again.');
}

/* ======================================================================= boot + sign-in */
async function boot() {
  $('#ver').textContent = 'v' + ((window.PineUpdate && PineUpdate.ver) || 1);
  if (PRACTICE) { $('#practiceTag').hidden = false; await Practice.init(); S.stage = 'practice'; return render(); }
  if (S.session) { try { await loadMe(); S.stage = 'app'; return render(); } catch (e) { if (e.status !== 401) { S.stage = 'msg'; S.msg = e.message; return render(); } } }
  startSignIn();
}
async function startSignIn(note) {
  S.session = null; ss.set('rv.session', null); S.pin = ''; S.pin1 = '';
  if (!S.code) { S.stage = 'nolink'; S.msg = ''; return render(); }
  S.stage = 'boot'; render();
  try {
    S.hello = await call('/r/hello', { code: S.code });
    S.stage = S.hello.needsPin ? 'pin-set' : 'pin';
    S.msg = S.hello.locked === 'hard' ? 'Locked. Ask the office to reset your PIN.'
      : S.hello.locked === 'soft' ? 'Too many tries. Try again in 15 minutes.' : (note || '');
  } catch (e) {
    if (e.status === 401) { S.code = null; ss.set('rv.code', null); S.stage = 'nolink'; S.msg = e.message; }
    else { S.stage = 'msg'; S.msg = e.message; }
  }
  render();
}
async function pinDone() {
  const n = S.hello.pinLength;
  if (S.pin.length !== n || S.pinBusy) return;
  if (S.stage === 'pin-set') { S.pin1 = S.pin; S.pin = ''; S.stage = 'pin-again'; S.msg = ''; return render(); }
  if (S.stage === 'pin-again' && S.pin !== S.pin1) { S.pin = ''; S.pin1 = ''; S.stage = 'pin-set'; S.msg = 'Those didn’t match. Try again.'; return render(); }
  S.pinBusy = true; render();
  try {
    const setting = S.stage === 'pin-again';
    const r = await call(setting ? '/r/pin/set' : '/r/signin', { code: S.code, pin: S.pin });
    S.session = r.session; if (!PRACTICE) ss.set('rv.session', r.session);
    S.pin = ''; S.pin1 = ''; S.msg = '';
    await loadMe(); S.stage = 'app';
    toast(setting ? 'PIN set' : 'Signed in');
  } catch (e) {
    S.pin = '';
    if (e.status === 423) S.msg = e.extra.locked === 'hard' ? 'Locked. Ask the office to reset your PIN.' : 'Too many tries. Try again in 15 minutes.';
    else if (e.status === 401 && e.extra.triesLeft != null) S.msg = `That PIN isn’t right. ${e.extra.triesLeft} ${e.extra.triesLeft === 1 ? 'try' : 'tries'} left before a lock.`;
    else if (e.status === 401) { S.code = null; ss.set('rv.code', null); S.stage = 'nolink'; S.msg = e.message; }
    else if (e.status === 409 && e.extra.needsPin) { S.stage = 'pin-set'; S.msg = 'Pick a PIN first.'; }
    else if (e.status === 409) { S.stage = 'pin'; S.msg = e.message; }
    else S.msg = e.message;
  } finally { S.pinBusy = false; render(); }
}
function pinKey(k, btn) {
  if (!k || S.pinBusy || !S.hello || S.hello.locked) return;
  if (btn) { btn.classList.add('tap'); setTimeout(() => btn.classList.remove('tap'), 150); }
  if (k === '⌫') S.pin = S.pin.slice(0, -1); else if (S.pin.length < S.hello.pinLength) S.pin += k;
  renderPinDots();
  if (S.pin.length === S.hello.pinLength) setTimeout(pinDone, 180);
}
async function loadMe() {
  S.data = await call('/r/me');
  const role = S.data.me.role;
  const allowed = viewsFor().map(v => v[0]);
  if (!allowed.includes(S.view)) S.view = 'todo';
  if (role !== 'Employee' && !S.data.assignments.some(a => a.status !== 'Sent') && !S.data.steps.length && S.view === 'todo' && !S._landed) S.view = 'results';
  S._landed = true;
}
async function signOut() {
  try { await call('/r/signout'); } catch (e) {}
  S.session = null; ss.set('rv.session', null); S.data = null; S.form = null; S.crew = null; S.admin = null;
  if (PRACTICE) { S.stage = 'practice'; return render(); }
  startSignIn('Signed out.');
}

/* ======================================================================= views */
function viewsFor() {
  const role = S.data?.me.role;
  const v = [['todo', 'To do']];

/* ----------------------------------------------------------------------- auto-advance (from mockup v7)

   unanswered question, or to Send. Stays put when the example is too short or when they tapped something themselves. */
let lastTapUI = 0;
document.addEventListener('pointerdown', e => { if (e.target.closest('button,textarea,input,select,a,label')) lastTapUI = Date.now(); }, true);
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && !e.shiftKey && el.matches?.('textarea[data-q]')) { e.preventDefault(); el.blur(); return; }
  if (e.key === 'Enter' && el.id === 'newstep') { e.preventDefault(); addStep(); return; }
  if (S.stage.startsWith('pin') && !el.matches?.('input,textarea')) {
    if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('⌫');

});

  if (!el.matches?.('textarea[data-q]')) return;
  scheduleSave(0);
  const at = Date.now();
  setTimeout(() => {
    if (lastTapUI > at - 200) return;
    if (document.activeElement?.matches?.('textarea,input,select')) return;
    const box = el.closest('[data-box]'); if (!box || !S.form) return;
    const miss = new Set(missingIds()); if (miss.has(box.dataset.box)) return;
    const boxes = [...document.querySelectorAll('.stack [data-box]')], i = boxes.indexOf(box);
    const next = boxes.slice(i + 1).find(b => miss.has(b.dataset.box)) || boxes.find(b => miss.has(b.dataset.box)) || document.querySelector('.f-end');
    next?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 320);
});

  }

  if (b.dataset.cpick) { if (S.ci?.dirty) await saveNotes(); S.cPick = b.dataset.cpick; S.ci = null; rCheckins(); if (innerWidth < 1100) setTimeout(() => $('#main')?.scrollIntoView({ behavior: 'smooth' }), 50); return; }
  if (b.dataset.rmstep != null) { S.ci.newSteps.splice(+b.dataset.rmstep, 1); $('#main').innerHTML = meetingHTML(); return; }
  if (b.dataset.asrm != null) { S.assign.items.splice(+b.dataset.asrm, 1); return rSetup(); }

  if (act === 'menu') { const m = $('#menu'); m.hidden = !m.hidden; if (!m.hidden) m.innerHTML = menuHTML(); return; }
  if (act === 'signout') return signOut();
  if (act === 'refresh') { if (window.PineUpdate) PineUpdate.check(); return refresh(); }
  if (act === 'retry') return startSignIn();
  if (act === 'back') { if (S.form) await flushSave(); S.pick = null; S.form = null; render(); scrollTo(0, 0); return; }
  if (act === 'send') return sendForm(b);
  if (act === 'print') return print();
  if (act === 'addstep') return addStep();
  if (act === 'finish') return finishCheckin(b);
  if (['wa', 'email', 'reset', 'opencyc', 'close'].includes(act)) return adminAction(act, b.dataset.id);
  if (act === 'mok' && S.mOk) { b.disabled = true; try { await S.mOk(); } catch (err) { toast(err.message, true); b.disabled = false; } return; }
  if (act === 'copy') { try { await navigator.clipboard.writeText(S.copyText || ''); toast('Copied.'); } catch (err) { toast('Couldn’t copy. Press and hold the text to copy it.'); } return; }
  if (act === 'qmgr') return quickAssign('Manager review');

    if (kind !== 'Check-in' && writer === about) return toast('Nobody reviews themselves.');

});

/* ======================================================================= practice mode (?practice=1)
   Made-up people, run against the same worker code (workers/pine-reviews-v1.js) inside this page with a fake
   in-memory Airtable. Nothing is sent anywhere: no worker, no Airtable. Reload = start over. */
const Practice = (() => {
  let worker, env, db, idn = 0, codes = {};
  const PEOPLE = [
    ['pat', 'Pat Quinn', 'Admin', 'Office', null], ['jor', 'Jordan Park', 'Lead', 'Press', 'pat'], ['cas', 'Casey Moore', 'Lead', 'Pre-press', 'pat'],
    ['ale', 'Alex Rivera', 'Employee', 'Press', 'jor'], ['mor', 'Morgan Kim', 'Employee', 'Press', 'jor'], ['dev', 'Devin Shaw', 'Employee', 'Press', 'jor'],
    ['sky', 'Sky Walsh', 'Employee', 'Press', 'jor'], ['jam', 'Jamie Lee', 'Employee', 'Pre-press', 'cas'],
  ];
  const RQ = [['comp', 'Job competence', 'Handles their job responsibilities competently and consistently.', 'When I work with them, they do their job well and consistently.'],
    ['rel', 'Reliability', 'On time, ready to work, and follows through on what they say.', 'I can count on them: on time, ready, and they follow through.'],
    ['qual', 'Quality & detail', 'Gets the details right and catches problems before they become reprints.', 'They get the details right and catch problems before they reach me.'],
    ['team', 'Teamwork', 'Helps out beyond their own station and hands work off cleanly.', 'They help out when I need it and hand work off cleanly.'],
    ['pos', 'Positive workplace', 'Contributes to a positive, affirming, and fun workplace.', 'They make Pine a better place to work.'],
    ['grow', 'Takes feedback & grows', 'Takes coaching well and changes because of it.', 'They are open to feedback and keep getting better.']];
  const CHECK = [['Your experience in your role', [['unclear', 'Unclear parts of the role', 'Are there any parts of your role that feel unclear, challenging, or uncomfortable?', 'None'], ['succ', 'Knows what success looks like', 'Do you feel you have a clear understanding of what success looks like in your role?', 'Not at all–Completely'], ['chal', 'Biggest challenge', 'What’s been your biggest challenge this past quarter? How have you been working through it?', 'None'], ['proud', 'Proud moment', 'Can you share a moment recently when you felt particularly proud or successful at work?', 'None'], ['growth', 'Growth', 'What does growth look like for you right now? Any skills, tools, or training that would help?', 'None']]],
    ['Your experience at Pine', [['vibe', 'Team vibe & culture', 'How would you describe the team vibe and culture over the past few months?', 'Poor–Great'], ['well', 'Doing well / could improve', 'What’s one thing we’re doing really well as a company? What’s one thing we could improve?', 'None'], ['comm', 'Communication', 'How has communication been, both on your team and across the company?', 'Poor–Great'], ['voice', 'Has a voice', 'Do you feel like you have a voice when it comes to ideas, changes, or opportunities?', 'Not at all–Completely']]],
    ['Our working together & feedback', [['lgap', 'Leadership gaps', 'Do you see any leadership gaps at the company that might be holding us back?', 'None']]]];
  const SAMPLE = ['Dials in tough multi-color jobs fast, and newer people go to them first.', 'Setup at the start of a shift runs late a couple of days a week.',
    'Always jumps in when someone falls behind on a changeover.', 'Catches registration problems before the run starts.', 'Keeps the crew loose on long runs, even on rough days.',
    'Took the feedback on setup times and fixed it within a week.', 'Could hand off the next job’s screens a little earlier.', 'Logs misprints at the end of every run without being asked.'];
  const rec = (t, fields) => { const r = { id: 'recPR' + String(++idn).padStart(12, '0'), createdTime: new Date().toISOString(), fields: { ...fields } }; db[t].push(r); return r; };
  const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
  function evalF(f, fields) {
    f = f.trim(); const or = f.match(/^OR\((.*)\)$/s);
    if (or) return split(or[1]).some(x => evalF(x, fields));
    let m = f.match(/^\{([^}]+)\}='((?:[^'\\]|\\.)*)'$/); if (m) return String(fields[m[1]] ?? '') === m[2].replace(/\\(.)/g, '$1');
    m = f.match(/^FIND\('((?:[^'\\]|\\.)*)',\{([^}]+)\}\)=1$/); if (m) return String(fields[m[2]] ?? '').indexOf(m[1].replace(/\\(.)/g, '$1')) === 0;
    return false;
  }
  function split(s) { const o = []; let d = 0, q = false, c = ''; for (const ch of s) { if (ch === "'") q = !q; if (!q && ch === '(') d++; if (!q && ch === ')') d--; if (!q && !d && ch === ',') { o.push(c); c = ''; } else c += ch; } if (c) o.push(c); return o; }
  async function fakeAirtable(url, opt = {}) {
    const u = new URL(url), table = decodeURIComponent(u.pathname.split('/')[3]);
    const ok = j => new Response(JSON.stringify(j), { status: 200 });
    if (!db[table]) return new Response('{}', { status: 404 });
    if ((opt.method || 'GET') === 'GET') { const f = u.searchParams.get('filterByFormula'); return ok({ records: db[table].filter(r => !f || evalF(f, r.fields)).map(r => structuredClone(r)) }); }
    const body = JSON.parse(opt.body);
    if (opt.method === 'POST') return ok({ records: body.records.map(r => structuredClone(rec(table, r.fields))) });
    return ok({ records: body.records.map(r => { const row = db[table].find(x => x.id === r.id); for (const [k, v] of Object.entries(r.fields)) { if (v == null) delete row.fields[k]; else row.fields[k] = v; } return structuredClone(row); }) });
  }
  async function init() {
    const realFetch = window.fetch.bind(window);
    // the worker code calls fetch() for Airtable; in practice that goes to the fake. Nothing may reach the real worker.
    window.fetch = (u, o) => { const s = String(u && u.url || u); if (s.startsWith('https://api.airtable.com/')) return fakeAirtable(s, o); if (s.includes('pine-reviews.') && s.includes('workers.dev')) return Promise.reject(new Error('practice: no worker calls')); return realFetch(u, o); };
    worker = (await import('./workers/pine-reviews-v1.js')).default;
    const kv = new Map();
    env = { REVIEWS_AIRTABLE_TOKEN: 'practice', REVIEWS_BASE_ID: 'appPRACTICE00000', PIN_PEPPER: crypto.randomUUID() + crypto.randomUUID(), DEV: '1',
      REVIEWS_KV: { async get(k) { const v = kv.get(k); return v && (!v.exp || v.exp > Date.now()) ? v.val : null; }, async put(k, val, o = {}) { kv.set(k, { val, exp: o.expirationTtl ? Date.now() + o.expirationTtl * 1000 : 0 }); }, async delete(k) { kv.delete(k); } } };
    db = { People: [], Cycles: [], Questions: [], Assignments: [], Answers: [], 'Next steps': [], 'Activity log': [] };
    const P = {};
    for (const [k, name, role, dept] of PEOPLE) P[k] = rec('People', { Name: name, Role: role, Department: dept, Active: true });
    for (const [k, , , , lead] of PEOPLE) if (lead) P[k].fields.Lead = [P[lead].id];
    for (const k of Object.keys(P)) { codes[k] = 'practice-' + k + '-' + crypto.randomUUID().replace(/-/g, ''); P[k].fields['Link hash'] = await sha(codes[k]); }
    const due = new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);
    const rev = rec('Cycles', { Name: 'Mid-year review (practice)', Type: 'Review', Status: 'Open', Due: due, 'Manager weight': 0.75, 'Min peers': 2 });
    const chk = rec('Cycles', { Name: 'Q1 check-in (practice)', Type: 'Check-in', Status: 'Open', Due: due });
    const Q = { m: {}, p: {}, c: {} };
    for (const [form, t, i] of [['Manager review', 'm', 2], ['Peer review', 'p', 3]]) {
      let n = 0;
      for (const q of RQ) Q[t][q[0]] = rec('Questions', { Key: q[0], Form: form, Order: ++n, Wording: q[i], 'Short name': q[1], Scale: 'Expectations', 'Counts in score': true, Active: true });
      if (t === 'm') Q.m.used = rec('Questions', { Key: 'used', Form: form, Order: ++n, Wording: 'This person’s skills are fully used in their current role.', 'Short name': 'Skills fully used', Scale: 'Skills used', Active: true });
      Q[t].out = rec('Questions', { Key: 'out', Form: form, Order: ++n, Wording: 'Where are they doing outstanding work?', 'Short name': 'Outstanding work', Scale: 'None', Active: true });
      Q[t].imp = rec('Questions', { Key: 'imp', Form: form, Order: ++n, Wording: 'Where is there room to improve?', 'Short name': 'Room to improve', Scale: 'None', Active: true });
    }
    let n = 0;
    for (const [sec, qs] of CHECK) for (const [k, s, w, sc] of qs) Q.c[k] = rec('Questions', { Key: k, Form: 'Check-in', Order: ++n, Section: sec, Wording: w, 'Short name': s, Scale: sc, Private: k === 'lgap', Active: true });
    const asg = (cyc, kind, w, a, status) => rec('Assignments', { Label: `${kind} ${w}→${a}`, Cycle: [cyc.id], Kind: kind, Writer: [P[w].id], About: [P[a].id], Status: status || 'Not started' });
    let s = 0;
    const fill = (a, qs, scores) => { Object.values(qs).forEach((q, i) => rec('Answers', { Label: `${a.id}:${q.id}`, Assignment: [a.id], Question: [q.id], Score: q.fields.Scale === 'None' ? null : scores[i % scores.length], Text: SAMPLE[(s++) % SAMPLE.length] })); a.fields['Sent at'] = new Date().toISOString(); };
    fill(asg(rev, 'Manager review', 'jor', 'mor', 'Sent'), Q.m, [4, 3, 4, 4, 5, 4, 4]);
    fill(asg(rev, 'Peer review', 'dev', 'mor', 'Sent'), Q.p, [4, 3, 3, 4, 4, 4]);
    fill(asg(rev, 'Peer review', 'sky', 'mor', 'Sent'), Q.p, [5, 4, 4, 4, 5, 4]);
    fill(asg(rev, 'Peer review', 'jam', 'mor', 'Sent'), Q.p, [4, 3, 4, 5, 5, 4]);
    for (const a of ['ale', 'dev', 'sky']) asg(rev, 'Manager review', 'jor', a);
    asg(rev, 'Manager review', 'pat', 'jor'); asg(rev, 'Manager review', 'pat', 'cas');
    asg(rev, 'Peer review', 'ale', 'dev'); asg(rev, 'Peer review', 'ale', 'sky'); asg(rev, 'Peer review', 'jor', 'cas');

    for (const k of ['ale', 'dev', 'sky', 'jam']) asg(chk, 'Check-in', k, k);

    rec('Next steps', { Step: 'Log misprints at the end of each run', Person: [P.mor.id] });
  }
  async function call(path, body, session) {
    const H = { 'content-type': 'application/json', origin: 'http://localhost', 'cf-connecting-ip': 'practice' };
    if (session) H.authorization = 'Bearer ' + session;
    const text = JSON.stringify(body || {});

    const res = await worker.fetch(req, env, {});
    const t = await res.text();
    return { status: res.status, j: t ? JSON.parse(t) : {} };
  }
  function start(k) { S.code = codes[k]; startSignIn(); }
  return { init, call, start };
})();
