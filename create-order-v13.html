<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Create Order v13 — Pine</title>
<style>
:root{--bg:#F2F2EE;--surface:#fff;--line:#E6E6E0;--line2:#D4D4CC;--text:#141412;--muted:#80807A;--soft:#F7F7F4;--yellow:#E8E832;--ydk:#C9C92A;--ytint:#FBFBDC;--green:#1e6b45;--gtint:#e9f4ee;--red:#b3261e;--rtint:#fdf0ee;--amb:#a96b12;--atint:#fbf1e2;
  --sans:Helvetica,Arial,sans-serif;--mono:'Courier New',monospace;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
body{padding:12px 16px 40px;max-width:1400px;margin:0 auto}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.top{background:var(--text);border-radius:var(--r);padding:10px 18px;display:flex;align-items:center;gap:14px;color:#ddd;position:sticky;top:0;z-index:20;box-shadow:0 0 0 12px var(--bg);flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:2px;color:var(--yellow)}
.crumb{color:#fff;font-weight:700}
.crumb a{color:#aaa;text-decoration:none;font-weight:400}
.prac{background:var(--yellow);color:var(--text);font-weight:700;font-size:12px;padding:6px 10px;border-radius:20px}
.top .sp{margin-left:auto;font:700 15px var(--mono);color:var(--yellow)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-top:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
h2{font-size:18px}
.hint{font-size:12px;color:var(--muted)}
.err{background:var(--rtint);border:1px solid #f2c9c4;color:var(--red);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.btn{height:44px;padding:0 16px;border:1px solid var(--line2);background:#fff;border-radius:8px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--text)}
.btn.y{background:var(--yellow);border-color:var(--ydk)}
.btn.k{background:var(--text);color:var(--yellow);border-color:var(--text)}
.btn:disabled{opacity:.4;cursor:default}
.b{height:36px;padding:0 12px;border:1px solid var(--line2);background:#fff;border-radius:8px;font-size:14px;font-weight:600}
.b:hover{border-color:var(--text)}
.b.on{background:var(--yellow);border-color:var(--ydk)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
.bts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--gtint);border-color:#bfe0cc;color:var(--green)}
.tag.need{background:var(--atint);border-color:#ecd2a6;color:var(--amb)}
.idtag{font:700 12px var(--mono);background:var(--text);color:var(--yellow);padding:3px 7px;border-radius:5px;white-space:nowrap}
input.t{height:40px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff}
/* order picker */
.olist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.oc{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:9px 12px;text-align:left}
.oc:hover{border-color:var(--text)}
.oc .num{font:700 15px var(--mono)}.oc .m{font-size:12px;color:var(--muted)}
.ohead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ohead .num{font:700 20px var(--mono)}.ohead .nm{font-size:20px;font-weight:800}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.door{border:2px solid var(--line2);border-radius:12px;padding:14px 16px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:6px}
.door:hover{border-color:var(--text)}
.door b{font-size:17px}.door span{font-size:13px;color:var(--muted)}
.door.main{border-color:var(--ydk);background:var(--ytint);cursor:default}
.past{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.po{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:#fff;text-align:left}
.po:hover{border-color:var(--text)}
.po .th{display:flex;gap:4px}
.po img,.po .noimg{width:64px;height:48px;border-radius:5px;border:1px solid var(--line);object-fit:contain;background:var(--soft)}
.po .noimg{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
.po .d b{font-family:var(--mono)}.po .d div{font-size:13px;color:var(--muted);margin-top:2px}
/* email */
.email{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;line-height:1.45;margin-top:6px;max-height:280px;overflow:auto}
.aibar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.draft{border:2px solid var(--yellow);background:#fffef0;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.draft .dl{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.aiq{border:1px solid var(--line2);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px;background:var(--soft)}.aiq ul{margin:4px 0 0 18px}
.prc input.pn{width:200px;max-width:100%}
.ocw{position:relative}.oc.done{opacity:.85}.tag.ent{display:inline-block;margin-top:4px;background:var(--soft);border:1px solid var(--line2);color:var(--muted);font-size:11px}
.lir{position:absolute;right:12px;bottom:8px;font-size:12px;font-weight:700;color:var(--text)}
.art-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.art-in label{font-size:12px;font-weight:700;color:var(--muted)}.art-in input{flex:1;min-width:220px}.art-in a{font-size:12px;font-weight:700;color:var(--text)}
.deal{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:6px}.deal a{color:var(--text)}
.email .msg.cust{border-left:3px solid var(--yellow);padding-left:8px}
.email .msg+.msg{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.email pre{white-space:pre-wrap;font:13px/1.45 var(--sans);margin-top:4px}
/* line cards */
.ln{border:1px solid var(--line2);border-radius:12px;background:#fff;margin-top:12px;overflow:hidden}
.ln.ok{border-left:5px solid #3fae6f}.ln.need{border-left:5px solid #e9b45a}
.lh{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.lh .no{font:700 13px var(--mono);color:var(--muted)}
.lh .g{font-weight:800;font-size:16px}
.lh .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.lh .qt{font:700 15px var(--mono);background:var(--text);color:var(--yellow);border-radius:6px;padding:5px 9px}
.lh .pr input{width:86px;height:36px;border:1px solid var(--line2);border-radius:6px;text-align:right;padding:0 8px;font:700 14px var(--mono)}
.lh .pr input.under{border-color:var(--red);background:var(--rtint);color:var(--red)}
.lh .pr small{display:block;font-size:10px;color:var(--muted);text-align:right;max-width:200px}
.lb{padding:12px 14px;display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;align-items:start}
.lb .k{font-size:12px;font-weight:700;color:var(--muted);padding-top:10px}
.gres{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.gres button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 10px;text-align:left;font-size:14px}
.gres button:hover{border-color:var(--text)}
.gres span{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line2);background:#fff;border-radius:20px;font-size:13px;font-weight:600}
.chip:hover{border-color:var(--text)}
.szrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.szs{display:flex;gap:4px;flex-wrap:wrap}
.szs label{display:flex;flex-direction:column;align-items:center;font:700 10px var(--mono);color:var(--muted);gap:2px}
.szs input{width:46px;height:38px;border:1px solid var(--line2);border-radius:6px;text-align:center;font:700 14px var(--mono)}
.paste{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.paste input{height:38px;border:1px dashed var(--ydk);background:var(--ytint);border-radius:6px;padding:0 10px}
.paste small{font-size:11px;color:var(--muted)}
.prc{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:5px 6px;background:#fff;font-size:13px;max-width:100%;text-align:left}
.prc img,.prc .noimg{width:46px;height:34px;border-radius:4px;border:1px solid var(--line);object-fit:contain;background:var(--soft);flex:none}
.prc .tx{display:flex;flex-direction:column;min-width:0}
.prc .tx b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prc .tx span{font-size:11px;color:var(--muted)}
.prc .x{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.prc input{width:130px;height:22px;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
.prints{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* v7: print cards on a line take the full width so the nickname and notes show whole */
.prc.pcard{display:flex;width:100%;align-items:flex-start}
.pcard .tx{flex:1;gap:3px}
.pcard .tx b{white-space:normal;display:flex;gap:6px;align-items:center}
.pcard textarea.nick{flex:1;width:auto;min-width:0;font-weight:700;font-size:14px;color:var(--text)}
.pcard .fl{display:flex;gap:6px;align-items:flex-start}
.pcard .fl>i{font-style:normal;flex:none;width:72px;padding-top:4px}
.pcard .fl input,.pcard textarea{flex:1;width:auto;min-width:0}
.pcard textarea,.ln textarea.t{border:1px solid var(--line);border-radius:4px;padding:3px 5px;font-size:12px;line-height:1.35;resize:none;overflow:hidden;min-height:24px}
.ln textarea.t{font-size:14px;padding:8px 10px;min-height:42px;width:100%}
@media (max-width:640px){.pcard img,.pcard .noimg{display:none}.pcard .fl{flex-direction:column;gap:2px}.pcard .fl>i{width:auto;padding:0}.pcard .fl input,.pcard .fl textarea{width:100%;flex:none}}
.copyto{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.copyto .b{height:34px;font-size:12px}
.mix{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;background:#fffef0;border:1px dashed var(--ydk);border-radius:8px;padding:6px 10px;font-size:13px}
.aiq .ql{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.aiq .ql li{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.aiq .ql li.done{opacity:.55}.aiq .ql li.done .qt{text-decoration:line-through}
.aiq .ql label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.aiq .ql input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:1px;accent-color:#141412}
.aiq .qa{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 28px}
.aiq .qa .btn{height:36px;font-size:13px}
.addp{border:1px solid var(--ydk);background:var(--ytint);border-radius:10px;padding:10px;margin-top:2px;grid-column:1/-1}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.artg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:340px;overflow:auto;padding:2px}
.art{border:1px solid var(--line2);border-radius:8px;background:#fff;padding:6px;text-align:left;font-size:12px}
.art:hover{border-color:var(--text)}
.art img,.art .noimg{width:100%;height:70px;display:flex;align-items:center;justify-content:center;border-radius:4px;margin-bottom:4px;object-fit:contain;background:var(--soft);color:var(--muted);font-size:11px}
.art b{font-family:var(--mono)}
.npf{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px 10px;align-items:center}
.npf .k{font-size:12px;font-weight:700;color:var(--muted)}
.more{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.locked .ln,.locked .more{pointer-events:none;opacity:.6}
.donebar{background:var(--gtint);border:1px solid #bfe0cc;color:var(--green);border-radius:8px;padding:10px 12px;margin-top:10px;font-weight:700}
/* rail */
.rail{position:sticky;top:84px}
.rail h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.chk{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chk li{display:flex;gap:8px;align-items:flex-start}
.chk li i{font-style:normal;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:none}
.chk li.ok i{background:var(--text);border-color:var(--text);color:var(--yellow)}
.chk li.bad{color:var(--amb)}
.imps{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.imps div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tots{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.tots b{font:700 15px var(--mono);text-align:right}
.tots .big{font-size:20px}
.out{margin-top:12px;background:var(--soft);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;max-height:45vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:90vw}
#tokBox{display:none}
@media (max-width:1050px){.app{grid-template-columns:minmax(0,1fr)}.rail{position:static}}
@media (max-width:640px){.doors{grid-template-columns:1fr}.lb{grid-template-columns:1fr}.lb .k{padding-top:0}.po{grid-template-columns:minmax(0,1fr)}.po .th{display:none}.oc{grid-template-columns:64px minmax(0,1fr)}.oc .rt{display:none}}
/* ---------- v8 ---------- */
.app{grid-template-columns:minmax(0,1fr) 400px}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 96px)}
.side .rail{position:static;margin:0;flex:none}
.mailbox{flex:1;min-height:180px;overflow:auto;margin:0;padding:12px 14px}
.mailbox .mh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.mailbox .mclose{display:none;margin-left:auto}
.finders{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.b.sm{height:30px;padding:0 9px;font-size:12px}
input.t.sm,select.t.sm{height:34px;font-size:13px}
select.t{height:40px;border:1px solid var(--line2);border-radius:8px;padding:0 8px;background:#fff}
.mtarget{font-size:12px;background:var(--ytint);border:1px dashed var(--ydk);border-radius:6px;padding:5px 8px;margin-top:8px}
#mbody .msg{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:13px;line-height:1.5}
#mbody .msg.cust{border-left:3px solid var(--yellow);padding-left:8px}
#mbody .mhd{margin-bottom:2px}
#mbody .s{cursor:pointer;border-radius:3px}
#mbody .s:hover{background:var(--ytint)}
#mbody .s.used{background:var(--gtint)}
#mbody mark{background:var(--yellow);color:var(--text);border-radius:2px;padding:0 1px}
#mbody mark.cur{outline:2px solid var(--text)}
.mailfab{position:fixed;right:16px;bottom:16px;z-index:55;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (min-width:1051px){.mailfab{display:none!important}}
@media (max-width:1050px){.app{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}
  .mailbox{display:none}.mailbox.open{display:block;position:fixed;inset:0;z-index:60;border-radius:0;max-height:none;padding:16px}
  .mailbox.open .mclose{display:inline}body.noscroll{overflow:hidden}}
.sec{padding-top:12px}
.sech{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.stepn{font:900 14px var(--mono);background:var(--text);color:var(--yellow);border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center}
.cards{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.icard,.lcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:#fff}
.icard.editing,.lcard.editing{border-color:var(--ydk);background:var(--ytint)}
.lcard.need{border-left:5px solid #e9b45a}.lcard.ok{border-left:5px solid #3fae6f}
.lcard .no{font:700 13px var(--mono);color:var(--muted)}
.ib{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ib b{font-size:14px}.ib span{font-size:12px;color:var(--muted)}
.warn{color:var(--amb)!important;font-weight:700}
.icard .x,.lcard .x{border:0;background:none;color:var(--muted);font-size:16px;padding:4px 6px}
.idtag.sm{font-size:10px;padding:1px 5px}
.quick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.form{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--soft)}
.form.editing{border-color:var(--ydk);background:var(--ytint)}
.fh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.fh b{font-size:16px}
.ff{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 14px;align-items:start}
.ff>.k{font-size:13px;font-weight:700;color:#55554f;padding-top:10px}
.ff>.k i{color:#b3261e;font-style:normal}
.ff input.t,.ff textarea.t{width:100%}
textarea.t{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff;resize:vertical;min-height:40px;line-height:1.35}
textarea.tg{resize:none;overflow:hidden}
.fixed{padding-top:9px;font-weight:700}
.bts.sub{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2)}
.b.num{min-width:44px;font-family:var(--mono)}
.fb{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.fb .btn{min-width:160px}
.rep{margin-top:8px}
.ticks{display:flex;flex-direction:column;gap:6px}
.tick{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:#fff;min-height:48px}
.tick i{font-style:normal;width:22px;height:22px;border:2px solid var(--line2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.tick.on{border-color:var(--ydk);background:var(--ytint)}.tick.on i{background:var(--text);border-color:var(--text);color:var(--yellow)}
.tick b{display:block;font-size:14px}.tick small{display:block;font-size:12px;color:var(--muted)}
.ovr{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}.ovr label{font-size:12px;color:var(--muted)}.ovr input{flex:1;min-width:160px}
pre.auto{white-space:pre-wrap;font:13px/1.45 var(--sans);background:#fff;border:1px dashed var(--line2);border-radius:8px;padding:8px 10px;min-height:40px}
.szs .qt{font:700 15px var(--mono);background:var(--text);color:var(--yellow);border-radius:6px;padding:8px 10px;align-self:flex-end}
.mixb{display:flex;flex-direction:column;gap:2px}.mixb small{font-size:11px;color:var(--muted)}
input.t.under{border-color:var(--red);background:var(--rtint);color:var(--red)}
@media (max-width:700px){.ff{grid-template-columns:1fr;gap:4px}.ff>.k{padding-top:8px}.fb .btn{min-width:0;flex:1}}
input,textarea,select,button,.form,.sec{scroll-margin-top:96px;scroll-margin-bottom:84px}
/* v9: emails, one sentence per line */
#mbody .msg{font-size:13.5px;line-height:1.45}
#mbody .s{display:block;padding:4px 6px;margin:2px 0;border-radius:6px}
#mbody .s.q{color:#66665f;font-size:12.5px}
#mbody .msg.shut .s{color:var(--muted)}
#mbody .more{font-weight:700;color:var(--text)}

// v11: only the sizes the garment is made in (no override: we can't print a size the maker doesn't make).

  const st={shipping:false,asColourLow:false,garmentCost:l.g.cost,fleece:fl,impressions:list};

      const imps=list.map((x,k)=>ENG.impressionPrice(x,(printQty(P(l.prints[k]))+(S.lines.includes(l)?0:q))||q)); if(imps.some(v=>v==null||!isFinite(v))) return {why:'no POM price at this qty'};
      const pp=Math.round(((ENG.garmentPricing(st)+imps.reduce((a,b)=>a+b,0))/0.97)/0.05)*0.05; return {pp:Math.round(pp*100)/100}; }
    const c=ENG.computeApparelAt(q,st); return c&&c.pricePerPiece?{pp:Math.round(c.pricePerPiece*100)/100}:{why:'no POM price at this qty'}; }catch(e){ return {why:'POM error: '+e.message}; } }
const printQty=p=>linesWith(p).reduce((a,l)=>a+qty(l),0);
const price=l=>l.price!=null?l.price:(pom(l).pp??null);

/* ---------- checks ---------- */
function lineNeed(l){ if(isApparel(l)&&!l.g) return 'pick the garment'; if(offSizes(l).length) return 'remove '+offSizes(l).join(', ')+' (not made in that size)'; if(!qty(l)) return isApparel(l)?'add sizes':'add the qty'; if(!l.prints.length&&isApparel(l)) return 'tick an imprint'; if(price(l)==null) return 'add a price'; return ''; }
function printNeed(p){ return !p.type?'needs an imprint type':!p.loc?'needs a location':!p.nick.trim()?'needs a nickname':isSP(p)&&!screens(p)?'needs a screen count':p.type==='Embroidery'&&!(p.stitch>0)?'needs a stitch count (an estimate is fine)':/^Supacolor/.test(p.type)&&!p.supSize?'needs a transfer size':''; }
function checks(){ const c=[], bad=S.lines.filter(lineNeed), pb=S.prints.filter(printNeed);
  c.push([!pb.length&&(S.prints.length>0||(S.lines.length>0&&S.lines.every(l=>!isApparel(l)))),pb.length?`${pid(pb[0])}: ${printNeed(pb[0])}`:S.prints.length?`${S.prints.length} imprint${S.prints.length>1?'s':''} ready`:'Add the imprints']);
  c.push([S.lines.length>0&&!bad.length,!S.lines.length?'Add a line item':bad.length?`Line ${S.lines.indexOf(bad[0])+1}: ${lineNeed(bad[0])}`:`${S.lines.length} line item${S.lines.length>1?'s':''} ready`]);
  const unused=S.prints.filter(p=>!linesWith(p).length); if(unused.length&&S.lines.length) c.push([false,`${unused.map(pid).join(', ')} ${unused.length>1?'aren\'t':'isn\'t'} ticked on any line item yet`]);
  if(!S.niEdit&&impDirty(S.ni)) c.push([false,'Imprint Creator has one not added yet']);
  if(!S.nlEdit&&lineDirty(S.nl)) c.push([false,'Line Item Creator has one not added yet']);
  if(S.existing.length+S.prints.length>26) c.push([false,'More than 26 imprints on one order']);
  return c; }
// What art reads: one row per ticked imprint, with the colors sales typed (per garment if changed)
function proofNotes(l){ if(l.notes!=null) return l.notes;
  return l.prints.map(id=>P(id)).filter(Boolean).map(p=>{ const ink=(l.inks[p.id]??p.inks)||'';
    return `${pid(p)} ${p.loc} · ${p.nick}${isSP(p)?` · ${screens(p)} screen${screens(p)===1?'':'s'}`:` · ${p.type}`}${p.type==='Embroidery'&&p.stitch?' · ~'+Number(p.stitch).toLocaleString()+' stitches':''}${/^Supacolor/.test(p.type)&&p.supSize?' · '+p.supSize.trim():''}${ink?' · Colors: '+ink:''}${p.prev?' · repeat of '+p.prev.id:''}`; })
    .join('\n').replace(/UPDATE:/gi,'Update -'); }

/* ---------- create ---------- */
async function create(){
  if(S.busy||S.done) return; const c=checks(); if(!c.every(x=>x[0])) return toast('Finish the checklist first');
  S.busy=true; S.err=''; render();
  // A retry after a failure keeps what was already created (S.made) and only adds the rest, so nothing doubles.
  const made=S.made=S.made||{imps:[],lines:[],newId:{}}, newId=made.newId, clean=s=>String(s||'').trim().replace(/UPDATE:/gi,'Update -');
  try{
    // 1. Imprints one at a time, in order, so the ID automation hands out A, B, C… in the order shown here.
    for(const p of S.prints){ if(newId[p.id]) continue;
      const f={[IP.order]:[S.o.id],[IP.type]:p.type,[IP.loc]:p.loc,[IP.nick]:p.nick.trim()}; if(p.pnotes.trim()) f[IP.pnotes]=clean(p.pnotes);
      if(isSP(p)){ f[IP.screens]=screens(p); f[IP.inkChanges]=inkChanges(p); }
      if(p.type==='Embroidery') f[IP.stitch]=Math.round(p.stitch);
      if(/^Supacolor/.test(p.type)&&p.supSize) f[IP.supSize]=p.supSize;
      if(p.prev){ f[IP.repeat]=true; f[IP.prev]=[p.prev.rid]; if(p.prev.inkIds&&p.prev.inkIds.length) f[IP.inks]=p.prev.inkIds; }
      const r=await atWrite('POST',T_IMP,[{fields:f}]); newId[p.id]=r.records[0].id; made.imps.push({p,rid:r.records[0].id});
    }
    // 2. Line items, 10 per call. Both order links: automations read Order Reference.
    const todo=S.lines.filter(l=>!made.lines.some(x=>x.l===l));
    const recs=todo.map(l=>{ const f={[LF.ref]:[S.o.id],[LF.orders]:[S.o.id],[LF.ptype]:l.ptype,[LF.price]:price(l),[LF.imprints]:l.prints.map(x=>newId[x])};
      if(l.g) f[LF.garment]=[l.g.id]; const n=proofNotes(l); if(n) f[LF.proof]=n; if(l.womens) f[LF.womens]=true; if(l.youth) f[LF.youth]=true;
      [['sales','sales'],['prod','prod'],['ship','ship'],['fin','fin'],['desc','desc'],['promo','promo']].forEach(([k,fk])=>{ if(String(l[k]||'').trim()) f[LF[fk]]=clean(l[k]); });
      if(l.patch&&isPatchPT(l)) f[LF.patch]=l.patch; if(l.sticker&&l.ptype==='Stickers') f[LF.sticker]=l.sticker;
      Object.entries(l.sizes).forEach(([z,v])=>{ if(SZF[z]&&v) f[SZF[z]]=v; }); return {fields:f}; });
    for(let i=0;i<recs.length;i+=10){ const r=await atWrite('POST',T_LI,recs.slice(i,i+10)); r.records.forEach((x,k)=>made.lines.push({l:todo[i+k],rid:x.id})); }
    // 3. v6: the artwork folder link on the order (only that field)
    if(S.o.art&&/^https?:\/\//i.test(S.o.art)&&!made.art){ await atWrite('PATCH',T_ORD,[{id:S.o.id,fields:{[O.art]:S.o.art}}]); made.art=true; }
    S.done=made; S.tEnd=Date.now(); S.busy=false; render(); toast(PRACTICE?'Practice: nothing was saved':'Order '+S.o.num+' created');
    if(!PRACTICE) setTimeout(readBackIds,4000);
  }catch(e){ S.busy=false; S.err=`Stopped: ${e.message}. Already in Airtable: ${made.imps.length} imprint${made.imps.length===1?'':'s'}, ${made.lines.length} line item${made.lines.length===1?'':'s'}. Fix the problem and press Finish creating — it only adds what's missing.`; render(); }
}
async function readBackIds(){ try{ const ids=S.done.imps.map(x=>x.rid); if(!ids.length) return; const d=await at(T_IMP,`${flds([IP.id])}&filterByFormula=${byIds(ids)}`); S.done.ids={}; (d.records||[]).forEach(r=>S.done.ids[r.id]=r.fields[IP.id]||''); render(); }catch(e){} }

/* ---------- render ---------- */
let pendingFocus=null; function focusSoon(id){ pendingFocus=id; setTimeout(()=>{ const e=$(id); if(e) e.focus(); pendingFocus=null; },0); }
let rendering=false;
// A field's "change" fires as you leave it, before the tap on the next field lands. Redrawing right then swaps out the field you
// tapped, so the tap is lost (and typing goes nowhere). Wait a tick: focus has moved by then, and draw() puts it back.
let deferred=false;
function render(){ if(window.event&&window.event.type==='change'){ if(!deferred){ deferred=true; setTimeout(()=>{ deferred=false; render(); },0); } return; }
  if(rendering){ setTimeout(render,0); return; } rendering=true; try{ draw(); document.querySelectorAll('textarea.tg').forEach(grow); } finally{ rendering=false; } }
function draw(){
  const ae=document.activeElement, keep=ae&&ae.id&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)?{id:ae.id,s:ae.selectionStart}:null;
  if(S.view==='edit'){ if(!S.ni) S.ni=blankImp(); if(!S.nl) S.nl=blankLine(); }
  $('main').innerHTML=S.view==='pick'?vPick():S.view==='loading'?'<div class="panel hint">Loading…</div>':S.view==='door'?vDoor():vEdit();
  $('rail').innerHTML=vRail();
  if(S.view==='edit'&&S.mailDrawn!==S.mail) renderMail(); else if(S.view!=='edit'&&S.mailDrawn){ S.mailDrawn=null; renderMail(); }
  $('mailfab').style.display=S.o&&S.view==='edit'?'':'none';
  if(keep&&!pendingFocus){ const e=$(keep.id); if(e){ e.focus(); try{ e.setSelectionRange(keep.s,keep.s); }catch(_){} } }
}

/* ---------- v8: the page = order + Imprint Creator + Line Item Creator ---------- */

    </div><div class="fb"><button class="link" onclick="clearImp()">${edit?'stop editing':'Clear form'}</button>${edit?`<button class="btn y" onclick="addImp()">Done</button>`:`<button class="btn y" onclick="addImp()">Add imprint</button>`}</div></div>`;
  return h; }
function vRepeat(){ const q=(S.repQ||'').trim().toLowerCase(), list=S.pastImps.filter(a=>!q||[a.id,a.nick,a.loc,a.type].join(' ').toLowerCase().includes(q)).slice(0,60);

const QUOTE_RE=/(?:^|\s)(?:On\s[^\n]{4,200}?wrote:|\d{1,2}\s+[A-Z][a-z]+(?:\s+\d{4})?\s+at\s+\d{1,2}:\d{2},[^\n]{2,200}?wrote:|[A-Z][a-z]{2,8},?\s+[A-Z][a-z]+\s+\d{1,2},?\s+\d{4}[^\n]{0,40}?wrote:|-{2,}\s*Original Message|From:\s[^\n]{2,200}?(?:Sent|Date):)/;

async function fixColor(gid,pick){ const l=S.nl&&S.nl.g&&S.nl.g.id===gid?S.nl:S.lines.find(x=>x.g&&x.g.id===gid); if(!l) return; const g=l.g, nu=niceColor(pick), old=g.color;
  if(!nu||nu===old) return; if(!confirm(`Change this garment's color in Airtable from "${old}" to "${nu}"?\n\nEvery order using this garment will show the new spelling.`)) return render();
  try{ await atWrite('PATCH',T_GAR,[{id:g.id,fields:{[G.color]:nu}}]); }catch(e){ return toast('Couldn\'t update: '+e.message); }
  [S.nl].concat(S.lines).forEach(x=>{ if(x&&x.g&&x.g.id===gid){ x.g.color=nu; x.g.name=x.g.name.replace(/ - .*$/,' - '+nu); } });
  (l.colors||[]).forEach(c=>{ if(c.id===gid){ c.color=nu; c.name=c.name.replace(/ - .*$/,' - '+nu); } });
  toast(PRACTICE?`Practice — would change ${old} → ${nu}`:`Fixed in Airtable: ${old} → ${nu}`); VC[gid]={stale:true}; vendorCheck(l.g); }
// the block under the garment in Line Item Creator
function vVendor(l){ const g=l.g; if(!g) return ''; const v=vcOf(g);
  if(!v||v.loading||v.stale) return `<div class="vend"><span class="hint">Checking vendors for ${esc(gLabel(g))} · ${esc(g.color)}…</span></div>`;
  if(v.none) return `<div class="vend"><span class="hint">Vendors: ${esc(v.none)}.</span></div>`;
  let h='<div class="vend">'; const st=stockCheck(l)||[], anyExact=v.list.some(x=>!x.miss&&x.exact);
  v.list.forEach(x=>{ h+=`<div class="vrow"><b>${esc(x.vendor)}</b> `;
    if(x.miss&&anyExact) h+=`<span class="hint">doesn't carry ${esc(g.color)} in ${esc(g.style)}</span>`;
    else if(x.miss) h+=`<span class="warn">has no color called ${esc(g.color)} for ${esc(g.style)}.</span> <select class="t sm" onchange="if(this.value)fixColor('${g.id}',this.value)"><option value="">Pick theirs to fix Airtable…</option>${x.colors.slice().sort((a,b)=>{ const w=String(g.color).toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean), sc=c=>w.some(t=>c.toUpperCase().includes(t))?0:1; return sc(a)-sc(b)||a.localeCompare(b); }).map(c=>`<option value="${esc(c)}">${esc(niceColor(c))}</option>`).join('')}</select>`;
    else { h+=x.exact?`<span class="okc">✓ ${esc(niceColor(x.color))}</span>`:(anyExact?`<span class="hint">calls it ${esc(niceColor(x.color))}</span>`:`<span class="warn">calls it ${esc(niceColor(x.color))}</span> <span class="hint">(Airtable: ${esc(g.color)})</span> <button class="link" onclick="fixColor('${g.id}','${esc(x.color).replace(/'/g,"\\'")}')">fix in Airtable</button>`);
      h+=` <span class="hint">· ${x.sizes.map(z=>z==='OSFA'?'one size':z).join(' ')}</span>`;
      const s=st.find(y=>y.vendor===x.vendor);
      if(x.soon) h+=` <span class="warn">· lists this color but has no stock yet (coming soon)</span>`;
      else if(!x.hasStock) h+=` <span class="hint">· no stock info</span>`;
      else if(s) h+=s.short.length?` <span class="warn">· low: ${s.short.map(y=>`${y.z==='OSFA'?'':y.z+' '}needs ${y.need}, has ${y.have}`).join(' · ')}</span>`:` <span class="okc">· in stock${s.one?' ('+esc(s.one)+' has it all)':''}</span>`;
      else h+=` <span class="hint">· ${Object.values(x.total).reduce((a,b)=>a+b,0).toLocaleString()} in stock</span>`; }
    h+=`</div>`; });
  // Airtable's size boxes vs what the vendors make
  const vs=vendorSizes(g); if(known(g)&&vs.length){ const miss=vs.filter(z=>!g.avail.includes(z)&&ALL_SZ.concat(['OSFA']).includes(z)); if(miss.length) h+=`<div class="vrow hint">Vendors also make ${miss.join(', ')} (not ticked in Airtable).</div>`; }
  return h+'</div>'; }
// short status for the line cards and the checklist
function vendorFlag(l){ const v=l.g&&vcOf(l.g); if(!v||!v.list) return ''; const ok=v.list.filter(x=>!x.miss); if(!ok.length) return 'color?'; const st=stockCheck(l)||[];
  if(st.length&&st.every(x=>x.short.length)) return 'low stock'; if(!ok.some(x=>x.exact)) return 'spelling'; if(v.list.some(x=>x.soon)) return 'coming soon'; return ''; }

setInterval(()=>{ const e=$('clock'); if(e) e.textContent=S.t0?fmtT((S.tEnd||Date.now())-S.t0):'0:00'; },500);
if(PRACTICE) $('pracTag').style.display='';
window.addEventListener('beforeunload',e=>{ if(S.o&&!S.done&&(S.lines.length||S.prints.length)){ e.preventDefault(); e.returnValue=''; } });
window.addEventListener('resize',()=>document.querySelectorAll('textarea.tg').forEach(grow));
render(); loadAwaiting();
</script>
