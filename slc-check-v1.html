<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLC Check v1</title>
<style>
:root{--bg:#F2F2EE;--line:#E5E5E0;--text:#0D0D0B;--muted:#888880;--yellow:#E8E832;--green:#1e6b45;--red:#c0392b;--amb:#b7791f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Helvetica,Arial,sans-serif;padding:12px 16px 40px;max-width:980px;margin:0 auto}
.top{background:var(--text);color:#fff;border-radius:10px;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top b{color:var(--yellow);letter-spacing:2px}
button{height:42px;padding:0 16px;border:1px solid #C9C92A;background:var(--yellow);border-radius:8px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px}
.hint{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ok{color:var(--green);font-weight:700}.zero{color:var(--amb);font-weight:700}.bad{color:var(--red);font-weight:700}
textarea{width:100%;height:200px;font:11px/1.35 'Courier New',monospace;margin-top:8px}
@media (max-width:600px){ td:nth-child(3),th:nth-child(3){display:none} }
</style>
</head>
<body>
<div class="top"><b>PINE</b>SLC check · v1<span class="hint" style="color:#bbb">Read-only. Asks SLC the same questions a few different ways.</span></div>
<div class="panel">
  <button id="go">Run all checks</button>
  <span class="hint" id="prog">Takes 1–3 minutes — SLC is slow on big styles.</span>
  <table id="t"><thead><tr><th>#</th><th>Check</th><th>Asked</th><th>Result</th></tr></thead><tbody></tbody></table>
</div>
<div class="panel">
  <b>For Claude</b> <button id="copy" style="height:32px;margin-left:8px">Copy</button>
  <textarea id="out" readonly></textarea>
</div>
<script>
/* SLC CHECK v1 — slc-test-v13 showed CC-1717: 525 parts, 0 stock, $0 on every part. An older test got real stock from the
   plain-number id 31225 (Gildan 5000B), and invoice item 00124003 = 1717 White S. So: are stock + prices filed under
   the old numeric ids? Does a part filter help? Does a different price type return prices? One line per check. */
var W='https://pine-workers.stephen-dab.workers.dev/proxy/slc';
var CHECKS=[
  {n:'1717 by new id (baseline)',      svc:'inventory', body:{operation:'getInventoryLevels', productId:'CC-1717'}},
  {n:'1717 by old number 124',          svc:'inventory', body:{operation:'getInventoryLevels', productId:'124'}},
  {n:'1717 by old number 00124',        svc:'inventory', body:{operation:'getInventoryLevels', productId:'00124'}},
  {n:'1717 two parts only (filter)',    svc:'inventory', body:{operation:'getInventoryLevels', productId:'CC-1717', partIds:['124003','124503']}},
  {n:'Gildan 5000B 31225 (worked before)', svc:'inventory', body:{operation:'getInventoryLevels', productId:'31225'}},
  {n:'1717 price · Customer',           svc:'pricing',   body:{operation:'getConfigurationAndPricing', productId:'CC-1717', priceType:'Customer'}},
  {n:'1717 price · Net',                svc:'pricing',   body:{operation:'getConfigurationAndPricing', productId:'CC-1717', priceType:'Net'}},
  {n:'1717 price · List',               svc:'pricing',   body:{operation:'getConfigurationAndPricing', productId:'CC-1717', priceType:'List'}},
  {n:'1717 price · old number 124',     svc:'pricing',   body:{operation:'getConfigurationAndPricing', productId:'124', priceType:'Customer'}},
  {n:'Gildan 5000B price 31225',        svc:'pricing',   body:{operation:'getConfigurationAndPricing', productId:'31225', priceType:'Customer'}},
  {n:'Sellable list for 1717 (new id)', svc:'productdata', body:{operation:'getProductSellable', productId:'CC-1717', isSellable:true}},
  {n:'Sellable list for 124 (old)',     svc:'productdata', body:{operation:'getProductSellable', productId:'124', isSellable:true}},
  {n:'Product data for CC-1717',        svc:'productdata', body:{operation:'getProduct', productId:'CC-1717'}}
];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function tags(doc,t){ return Array.prototype.slice.call(doc.getElementsByTagNameNS('*',t)); }
function txt(el,t){ var n=el.getElementsByTagNameNS('*',t)[0]; return n?n.textContent.trim():''; }
function fault(doc){ var f=tags(doc,'faultstring')[0]||tags(doc,'Fault')[0]; if(f) return f.textContent.trim().slice(0,160);
  var m=tags(doc,'ServiceMessage').map(function(s){ return (txt(s,'code')?txt(s,'code')+' ':'')+txt(s,'description'); }).filter(Boolean); return m.join(' / ').slice(0,160); }
function summarize(c,doc){
  if(c.svc==='inventory'){ var ps=tags(doc,'PartInventory'), units=0, inS=0, locs={};
    ps.forEach(function(p){ var q=p.getElementsByTagNameNS('*','quantityAvailable')[0], v=q?+txt(q,'value')||0:0; units+=v; if(v>0) inS++;
      tags(p,'InventoryLocation').forEach(function(l){ locs[txt(l,'inventoryLocationName')||txt(l,'inventoryLocationId')]=1; }); });
    return {cls:ps.length?(units>0?'ok':'zero'):'bad', line:ps.length+' parts · '+units.toLocaleString()+' units · '+inS+' parts in stock'+(Object.keys(locs).length?' · locations: '+Object.keys(locs).join(', '):'')}; }
  if(c.svc==='pricing'){ var parts=tags(doc,'Part'), priced=0, ps2=[];
    parts.forEach(function(p){ var pr=tags(p,'PartPrice').map(function(x){ return +txt(x,'price')||0; }), v=pr.length?Math.min.apply(null,pr):0; if(v>0){ priced++; ps2.push(v); } });
    return {cls:parts.length?(priced?'ok':'zero'):'bad', line:parts.length+' parts · '+priced+' priced'+(ps2.length?' ($'+Math.min.apply(null,ps2).toFixed(2)+'–$'+Math.max.apply(null,ps2).toFixed(2)+')':'')}; }
  if(c.body.operation==='getProductSellable'){ var ids={}; tags(doc,'productId').forEach(function(e){ ids[e.textContent.trim()]=1; }); var n=tags(doc,'partId').length;
    return {cls:n?'ok':'bad', line:n+' parts · productIds: '+Object.keys(ids).slice(0,5).join(', ')}; }
  var pp=tags(doc,'Part'); return {cls:pp.length?'ok':'bad', line:pp.length+' parts · name: '+(txt(doc,'productName')||'—')+' · first part '+(pp[0]?txt(pp[0],'partId'):'—')};
}
async function run(c){
  var t0=performance.now(), r, text='';
  try{ r=await fetch(W+'/'+c.svc,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c.body)}); text=await r.text(); }
  catch(e){ return {cls:'bad', line:'network error: '+e.message, ms:Math.round(performance.now()-t0)}; }
  var ms=Math.round(performance.now()-t0), doc=new DOMParser().parseFromString(text,'text/xml'), f=fault(doc), s;
  try{ s=summarize(c,doc); }catch(e){ s={cls:'bad', line:'could not read: '+e.message}; }
  if(f) s.line+=' · SLC says: '+f;
  if(!/^\s*</.test(text)) s={cls:'bad', line:'HTTP '+r.status+' '+text.slice(0,140)};
  s.ms=ms; s.status=r.status; s.bytes=text.length; return s;
}
function asked(b){ return Object.keys(b).filter(function(k){ return k!=='operation'; }).map(function(k){ return k+'='+(Array.isArray(b[k])?b[k].join('+'):b[k]); }).join(' '); }
$('go').onclick=async function(){
  this.disabled=true; var tb=$('t').tBodies[0]; tb.innerHTML=''; var lines=['SLC check v1 · '+new Date().toLocaleString()];
  CHECKS.forEach(function(c,i){ tb.insertAdjacentHTML('beforeend','<tr><td>'+(i+1)+'</td><td>'+esc(c.n)+'</td><td class="hint">'+esc(c.body.operation+' '+asked(c.body))+'</td><td id="r'+i+'" class="hint">waiting…</td></tr>'); });
  for(var i=0;i<CHECKS.length;i++){ $('prog').textContent='Check '+(i+1)+' of '+CHECKS.length+'…'; $('r'+i).textContent='asking SLC…';
    var s=await run(CHECKS[i]); $('r'+i).className=s.cls; $('r'+i).textContent=s.line+' · '+(s.ms/1000).toFixed(1)+'s';
    lines.push((i+1)+'. '+CHECKS[i].n+' ['+CHECKS[i].body.operation+' '+asked(CHECKS[i].body)+'] → '+s.line+' (HTTP '+(s.status||'-')+', '+(s.bytes||0)+'B, '+(s.ms/1000).toFixed(1)+'s)'); $('out').value=lines.join('\n'); }
  $('prog').textContent='Done. Copy the box below and paste it to Claude.'; this.disabled=false;
};
$('copy').onclick=function(){ var t=$('out'); t.select(); try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); } this.textContent='Copied ✓'; };
</script>
</body>
</html>
