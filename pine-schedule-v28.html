<title>Pine Schedule v28</title>
<!-- Pine Schedule v28 (2026-10-28): Stephen: "Do the 5 bugs first". Code review: "jobs that run past midnight show
     5:00p–13:00p" (and midnight showed as "12:00p"). hm() only took 12 off once, so 13:00 and up past midnight kept counting.
     It now wraps the 24-hour day: mornings stay plain ("8:30"), afternoons "p" ("5:00p"), after midnight "a" ("12:30a", "1:00a"),
     so a late run reads "5:00p–1:00a". Same everywhere hm()/hmr() is used (cards, side list, pop-ups, "Runs to …, past close").
     Minutes are rounded first so an end time never shows a fraction. No other changes; the past-close warning is v22's. -->
<!-- Pine Schedule v27 (2026-10-28): from the scheduling department — "see at the bottom it has quantity, screens and due
     date? Can we add location to that as well? Helps me out especially when I have multiple sleeve prints to sched", "some
     sort of indication if it's a hard deadline? Ideally like a little emoji ... I read symbols much faster than text", and in
     the open card the Hard Deadline "a bit louder visually ... inside a red box like the '2 workdays before due'". Cards now
     read "50 · 3 scr · Left Sleeve · due Oct 30" (wrapping to two lines), starting with ⏰ for a Hard Deadline; the card's Due line shows a red ⏰ HARD DEADLINE box. -->
<!-- Pine Schedule v26 (2026-10-24): Stephen: "Can you also have an agent look into this issue with the Scheduler app".
     Fix: saving failed with 422 "Cannot parse date value 2026-10-28T24:30:00.000Z" for Scheduled Start Time. setStart built the
     time by hand from minutes since midnight, so a job pushed past midnight (stacked after a full day) wrote hour 24+. It now
     uses Date.UTC(y, m, d, 0, min).toISOString(), which rolls over to the next day (and month/year). Times stay shop clock time
     stored as Z (08:30Z = 8:30 am, same as Operator and the Airtable calendar), so normal slots write exactly what v25 wrote. --><!-- Pine Schedule v25 (2026-10-21): Stephen: "in scheduler can we also make sure to keep jobs that share inks together...meaing
     discharge white bandana on a few banadanas get shcedulerd together".
     Inks come from Imprints ink names (fldMM5hp8kEpo3KKT, read only), normalised ("Pantone 186 C - Discharge" = "186 · DISCHARGE").
     Similarity = shared ink names + 1 for the same Imprint Type + 2 for the same white/base (e.g. Discharge White).
     Suggest: picks the press by platen first, then shared inks; between days with room (from the first day that fits, up to 2
     workdays later and never past "print N workdays before due") it prefers a day that already runs the same inks. Within a day it
     orders the suggested jobs as a greedy chain: same product first (bandana / tee / fleece), then the most shared inks. Hard
     Deadline and locked jobs keep exactly the day, press and time v24 gives them; jobs already on the calendar never move.
     % pop-up: "Ink runs" (N jobs in a row on X · saves about M min of ink changes, an estimate at 15 min per ink kept on the press)
     and a "Next time" tip when same-ink jobs aren't back to back. Day view: a small "Same ink" join between adjacent cards.
     "Group by ink" (Day view, per press, only when it helps): re-orders that day's unlocked, non-Hard-Deadline jobs after a confirm
     box that lists the new order; locked / Hard Deadline / running / finished jobs keep their slot; gaps stay. Practice fakes it.
     Fix: suggested jobs with no press yet got no changeover gap (it used the job's empty Equipment); it uses the lane now. --><!-- Pine Schedule v24 (2026-10-20): top-bar cleanup. The filter row's main button reads "Suggest" (no ✨ emoji), like the
     other apps' plain-text buttons. The bar keeps position:relative (fixed 100vh layout). No behaviour changes. -->
<!-- Pine Schedule v23 (2026-10-20): Stephen: "on the scheduling app.....can we add a pop up in the percentage to include the
     reasoning why it might be over 100% and also bring back in our impressions goals per press".
     Every machine-day % (Day view bar, Week / 3 Day header chips, 2 Week / Month cells) opens a pop-up: press time available
     (Settings), each job's booked time (setup + printing = estimate, or Allocated), the total = the %, gaps, impressions, and
     when over 100% the reasons (hours over, long setups, hooping, Allocated over the estimate, rounding, fleece, hard deadlines,
     suggested jobs, past close). Under 100% it says how much is free.
     Impressions goals are back (Day Fill v15 had 1,100 / 950): Press 1 1,400 / day, Press 2 1,200 / day = a good day (p75 of full
     days, last 120 days), pending Stephen's OK; editable in Settings (saved on this computer). Impressions = Imprints qty ("Active Impressions": pieces at that one print location), summed per press per day.
     Shown as "Planned 1,150 impressions · goal 1,400" with a small bar in Day view, the Week / 3 Day headers and 2 Week / Month cells. No new writes. -->
<!-- Pine Schedule v22 (2026-10-19): time fixes from a code review.
     Ink changes: the number of ink changes now comes straight from Imprints "Ink Changes" (fld6Tv0llCxjjyyHJ), 15 min each
     (same as Airtable's Ink Change time since 2026-10-14). v12-v21 divided Ink Change time by 25 min, so 2 changes counted as 1, 4 as 2.
     Embroidery: Airtable's Estimated Run Time already adds 18 min hooping; v9-v21 added another 18. Hooping now counts once.
     Day end: every machine shows when its last job ends; a day that runs past "Last job ends by" (Settings) is flagged.
     "Are you sure?" boxes use the Pine confirm box (pine-confirm.js). Version on screen comes from the file name only. -->
<!-- Pine Schedule v21 (2026-10-19): Airtable's "Imprint Ready?" on every card (Stephen: "can we add the already existing
     function in airtable > imprints 'Imprint Ready?' On the cards in the same place I see the due date emojis and bandanas
     emoji. It would be very helpful to see that right away!"). 👍 / 🛑 first in the emoji row next to the job ID, on
     calendar cards, the side list and the job pop-up (hover: "Imprint Ready?"). The rule stays in Airtable's formula
     (goods received + inks + screens for presses; goods + transfers/trims for heat press, patches, sewing). -->
<!-- Pine Schedule v20 (2026-10-15): Mike's notes after a few hours on real data, plus lock-in (Stephen).
     Lock in: a job (pop-up) or a whole day (button under each day) ticks Imprints "Scheduled" (Slack bots read it); Unlock in the pop-up.
     Moves keep the tick (Airtable's change bot posts the new days). Every proof on the imprint's line items shows (was only the first),
     with "N colorways". Side cards show the print Location. Machine chips filter only the calendar. Calendar cards show the customer.
     Drops start at the exact end of the job before (no gap, no rounding); an empty day starts 8:30. Job length without Allocated rounds
     up to 15 min (what placing it writes). Unscheduled pop-up: press/day/time start blank, Save keeps it in the list.
     Pop-up: start and end time, turnaround in business days from payment (same as Airtable's Turnaround Calculator).
     Pine Schedule v19 (2026-10-15): search finds scheduled jobs too (Stephen). Under the search box: All (default) / Unscheduled only
     (remembered). With search text and All, a "Scheduled" section lists matching scheduled, not-finished jobs from any date (one Airtable
     query, 300 ms after typing stops, first 50 by start) merged with what's loaded. Tap one = the calendar jumps to its day (Month → Week),
     scrolls to the card and flashes it. Those result cards don't drag (drag from the calendar). No change to writes or the default list.
     Pine Schedule v18 (2026-10-15): Ready to Order jobs show again (Stephen: "It should show up when it is ready to order"),
     tagged "Garments not ordered"; Suggest places them no sooner than 4 workdays out (order + ship) unless an arrival date is set.
     Pine Schedule v17 (2026-10-15): Pine page kit. Bar = logo · SCHEDULE · version · practice · views (Day / 3 Day / Week / 2 Week /
     Month) · ↻ Refresh · ⚙ (token, practice and a link to the shop settings live in ⚙; Settings and Refresh were big outline buttons).
     One filter row under the bar: ‹ Today › + range · machine chips (one line) · ✨ Suggest (the one yellow; Place all takes the yellow
     while a suggestion is up). Unscheduled cards use the kit list card (ID badge, name, qty + time, tags), still drag sources
     (hold-to-drag on touch, no browser image drag). Job card + settings pop-ups use the kit inputs/tags; 44px touch targets.
     Fix: the version fallback said v15. No change to scheduling, time model or Airtable writes.
     Pine Schedule v16 (2026-10-15): 2 Week view (Stephen) — two Mon–Fri rows, every job listed, drag between any days.
     Pine Schedule v15 (2026-10-14): unscheduled jobs start at 'Ordered - In Production' (Ready to Order = garments not ordered yet; Stephen).
     Imprints with no Line Items linked are left out of the list; a note at the bottom names them so they can be linked or deleted.
     Pine Schedule v14 (2026-10-14): Allocated filled from the estimate rounds up to 15 min; formula errors no longer show as "[object Object]"; jobs with no Line Items linked say so
     (no qty, proof or garments to show) and Suggest skips them; Seps file is the picture when there is no proof.
     Pine Schedule v13 (2026-10-14): Allocated Production Time is the scheduler's adjustable job length (Operator, the Board and the
     Airtable calendar End Time use it). Jobs use it when set; it's editable on the card; placing a job with none fills it from the estimate.
     Pine Schedule v12 (2026-10-14): ink changes count again, at the measured 15 min each (v9-v11 left them out).
     Pine Schedule v11 (2026-10-14): Flatstock 7683 denim (#426DA9, white text) and Finishing dusty plum (#8E6C8A) join the B colors.
     Pine Schedule v10 (2026-10-14): Suggest fills each day only to 90% of a normal full day (cushion, Stephen); editable.
     Pine Schedule v9 (2026-10-14): job times, gaps between jobs and day capacity come from 12 months of real press
     history (notes/schedule-calibration.md) instead of Airtable's Estimated Run Time formula.
     Pine Schedule v8 (2026-10-14): the board works in LANES (one per person/department): Press 1, Press 2,
     Embroidery & sewing (Tajima + Bartacker + Post-bed), Heat press (D3 + Tag + Hat). Jobs keep their exact machine.
     Pine Schedule v7 (2026-10-14): day-header load chips are the same machines in the same spots on every day
     (fixed grid; "–" when a machine has nothing, "off" when closed). Sewing machines are BT and PB.
     Pine Schedule v6 (2026-10-14): colors are direction B "Consume design" (Stephen): Press 1 7473 teal, Press 2 7563 mustard,
     Embroidery 7579 burnt orange, Heat Red 032, on Pine cream. Red now means heat press, so warnings are black "!" marks.
     Pine Schedule v5 (2026-10-14): a job card loads its own Line Items + garment names on open; the background
     Line Items load waits and retries when Airtable says "too many requests" and keeps what it got.
     Pine Schedule v4 (2026-10-14): garments come from the job's Line Items (the Imprints "Garment Type" lookup returns record IDs
     through the API, so v1-v3 showed IDs and never spotted fleece). Fleece share now weights run time like Day Fill did.
     Pine Schedule v3 (2026-10-14): Week and 3 Day show each day as one column with every machine's jobs in time order,
     like the Airtable calendar. Machine chips pick All or any mix of machines. Day view keeps a column per machine.
     Pine Schedule v2 (2026-10-14): Press 1 and Press 2 get their own colors (Stephen picked direction A in pine-colors.html).
     Pine Schedule v1 (2026-10-14): Scheduler v13 + Day Fill v15 in one app.
     Drag job cards onto a press and a day. ✨ Suggest fills the next weeks the way Day Fill did
     (due dates, hard deadlines, whole orders, press limits) and shows dashed cards you can place or skip.
     Writes Equipment + Scheduled Start Time on Imprints (shop clock time stored as Z, 08:30Z = 8:30 am,
     same as Operator and the Airtable calendar). ?practice=1 fakes every write. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap">
<link rel="stylesheet" href="pine-style-v2.css">
<style>
html,body{margin:0;height:100%}
body{background:var(--p-cream-lt)}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.p-bar{position:relative}
/* v17: page kit filter row — date nav + range · machine chips (one line) · ✨ Suggest */
.tools{flex:none}
.datenav{display:flex;align-items:center;gap:6px;flex:none}
.tools .p-chips{flex:1 1 0;order:0;width:auto;gap:4px}   /* basis 0: chips take what's left and scroll, Suggest stays on the line */
.tools .p-chips .p-tab{padding:0 12px}
.tools .p-filters-end{margin-left:0}
.range{font:900 20px/1 var(--p-display);text-transform:uppercase;letter-spacing:.005em;word-spacing:.08em;min-width:0;white-space:nowrap}
.navb{min-width:44px;padding:0 10px;font-size:22px}
.range{margin-left:6px}
.sidebtn .p-count{font:800 var(--p-fs-xs)/1 var(--p-sans);background:var(--p-black);color:var(--p-yellow);border-radius:var(--p-pill);padding:3px 7px}
.body{flex:1;display:flex;min-height:0}

/* unscheduled list */
.side{width:330px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--p-line);background:var(--p-white);min-height:0}
.side-h{padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--p-line)}
.side-h .t{display:flex;align-items:center;gap:8px;justify-content:space-between}
.side-h .p-search{max-width:none}
.side-list{flex:1;overflow:auto;padding:8px 10px 40px}
.side.drop-on{box-shadow:inset 0 0 0 3px var(--p-yellow)}
.og{margin:12px 0 6px;padding:8px 2px 0;font:700 14px/1.3 var(--p-sans);color:var(--p-ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--p-line)}
.og:first-child{border-top:0;margin-top:0;padding-top:0}
.og b{color:var(--p-black)}
/* v17: unscheduled cards = kit list card (.p-lc), narrow: picture · ID · qty + time / job / tags. Still drag sources. */
.sc{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sc + .sc{margin-top:6px}
.side .p-lc-head{grid-template-columns:48px minmax(0,1fr) auto;grid-template-areas:"img id nums" "img main nums" "tags tags tags";gap:4px 10px;padding:8px 10px;min-height:0}
.side .p-lc-nums{gap:12px}
.side .p-num b{font-size:15px}
.side .p-lc-sub{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .p-lc-tags{gap:5px}
.sc:hover{border-color:var(--p-black)}
.sc-img{grid-area:img;width:48px;height:48px;border-radius:4px;object-fit:contain;background:var(--p-cream-lt);border:1px solid var(--p-line);align-self:start}
.sc.hd{box-shadow:inset 5px 0 0 var(--p-black)}
.sc.skip{opacity:.45}
.sc .why{padding:0 10px 8px}
/* v19: All / Unscheduled only, and scheduled search results (tap to jump; not draggable) */
.scope{gap:6px}
.fhead{border-top:2px solid var(--p-black);padding-top:10px;margin-top:16px}
.fc{cursor:pointer}
.fc + .fc{margin-top:6px}
.fc:hover{border-color:var(--p-black)}
.side .fc .p-lc-head{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"id nums" "main main" "tags tags"}
.fwhen{display:block;font:800 var(--p-fs-m)/1.25 var(--p-sans);font-variant-numeric:tabular-nums}
.day .jc .l1{flex-wrap:wrap;white-space:normal}   /* v19: the start–end range is longer; let the ID wrap on Day cards instead of cutting it */
.mc{position:relative}
.jc.flash::before,.mc.flash::before{content:"";position:absolute;inset:-6px;border:4px solid var(--p-yellow);border-radius:10px;pointer-events:none;z-index:3;animation:pflash .7s ease-in-out 4}
.mc.flash::before{inset:0;border-radius:4px}
@keyframes pflash{50%{border-color:var(--p-black)}}
.p-tag.hdtag{background:var(--p-black);color:var(--p-yellow)}
.p-tag.warn{border-color:var(--p-black);color:var(--p-black)} .p-tag.warn::before{content:"!";font-weight:900;margin-right:2px}
.why{font-size:12px;color:var(--p-alert);font-weight:700}
.id{font:800 15px/1 var(--p-sans);font-variant-numeric:tabular-nums}

/* v20: customer name on calendar cards, lock mark, proofs grid, turnaround, day lock */
.jc .cn,.mc .cn{display:flex;gap:6px;align-items:center;min-width:0;font-weight:700;font-size:13px}
.cnt{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .jc .cn{font-size:14px}
.mc .cn{flex:1 1 auto;font-weight:400;color:var(--p-ink-2)}
.mgrid.two .mc{flex-wrap:wrap;row-gap:1px}
.mgrid.two .mc .cn{flex:1 0 100%;font-weight:700;color:var(--p-black)}
.lkb{flex:none;font:800 12px/1 var(--p-sans);background:var(--p-black);color:var(--p-white);border-radius:3px;padding:2px 5px;white-space:nowrap}
.lk{width:12px;height:12px;flex:none;align-self:center}
.proofs{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px}
.proofs.one{grid-template-columns:1fr}
.proofs a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--p-ink-2);font-size:12px;min-width:0}
.proofs a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proofs .proof{max-height:170px}
.proofs.one .proof{max-height:260px}
.proofs-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ta{font-variant-numeric:tabular-nums}
.daylock{margin-top:auto;width:100%;justify-content:center}
.daylocked{margin-top:auto;display:flex;gap:5px;align-items:center;justify-content:center;font:700 12px/1.2 var(--p-sans);color:var(--p-ink-2);padding:8px 0}
.mcell .daylock{font-size:13px;padding:0 8px}
.dayhead{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:10px}
.dayhead .daylock{width:auto;margin:0}.dayhead .daylocked{margin:0}
#mLock{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* calendar */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.sugbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--p-yellow-lt);border-bottom:2px solid var(--p-yellow)}
.sugbar.on{display:flex}
.sugbar .msg{flex:1;min-width:200px;font-weight:700}
.cal{flex:1;overflow:auto;padding:12px 16px 60px}
.grid{display:grid;gap:0;border:1px solid var(--p-line-strong);border-radius:10px;background:var(--p-white);min-width:min-content}
.gh{position:sticky;top:-12px;z-index:3;background:var(--p-black);color:var(--p-white);padding:9px 10px;font:700 14px/1.1 var(--p-sans);border-left:1px solid #333;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.gh.today{background:var(--p-yellow);color:var(--p-black)}
.gh .dn{font:900 15px/1 var(--p-display);text-transform:uppercase;letter-spacing:.02em}
.gh .sub{font-size:12px;opacity:.75;font-weight:700}
.gh:first-child{border-radius:9px 0 0 0;border-left:0}
.rh{position:sticky;left:-16px;z-index:2;background:var(--p-cream);border-top:1px solid var(--p-line-strong);padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rh b{font:900 14px/1.1 var(--p-display);text-transform:uppercase;letter-spacing:.02em}
.rh span{font-size:12px;color:var(--p-ink-2)}
.cell{border-top:1px solid var(--p-line-strong);border-left:1px solid var(--p-line);padding:6px;min-height:90px;display:flex;flex-direction:column;gap:5px;min-width:0;background:var(--p-white)}
.cell.off{background:repeating-linear-gradient(135deg,var(--p-cream-lt) 0 8px,var(--p-white) 8px 16px)}
.cell.past{background:var(--p-cream-lt)}
.cell.drop-on,.mcell.drop-on{box-shadow:inset 0 0 0 3px var(--p-yellow);background:var(--p-yellow-lt)}
.fill{display:flex;align-items:center;gap:6px;font:700 12px/1 var(--p-sans);color:var(--p-ink-2)}
.fill .bar{flex:1;height:7px;border-radius:4px;background:var(--p-cream);overflow:hidden;min-width:30px}
.fill .bar i{display:block;height:100%;background:var(--p-black)}
.fill.over .bar i{background:var(--p-alert)}
.fill.over{color:var(--p-alert)}
.offl{font:700 12px/1 var(--p-sans);color:var(--p-ink-3);text-transform:uppercase;letter-spacing:.06em}
.jc{position:relative;background:var(--p-cream-lt);border:1.5px solid var(--p-line-strong);border-radius:6px;padding:5px 7px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;font-size:13px;line-height:1.25}
.jc:hover{border-color:var(--p-black)}
.jc .l1{display:flex;gap:5px;align-items:baseline;white-space:nowrap;overflow:hidden}
.jc .tm{font-weight:700;color:var(--p-ink-2);font-variant-numeric:tabular-nums}
.jc .id{font-size:14px}
.jc .em{overflow:hidden;text-overflow:ellipsis}
.jc .l2{color:var(--p-ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc .l2.sub{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}   /* v27: qty · screens · location · due wraps to 2 lines */
.jc .hdm{font-size:13px}
.jc.hd{box-shadow:inset 4px 0 0 var(--p-black)}
.p-tag.p-tag-hd{background:var(--p-red,#c8102e);border-color:var(--p-red,#c8102e);color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.03em}   /* v27: Hard Deadline, loud */
.jc.done{opacity:.55}
.jc.late{border-color:var(--p-alert)}
.jc.ghost{background:var(--p-yellow-lt);border:2px dashed var(--p-black)}
.jc.ghost.late{border-color:var(--p-alert)}
.jc.saving{opacity:.6}
.jc .bigimg{display:none}
.day .jc{display:flex;gap:10px;font-size:14px;padding:8px}
.day .jc .bigimg{display:block;width:64px;height:64px;object-fit:contain;flex:none;background:var(--p-white);border:1px solid var(--p-line);border-radius:4px}
.day .jc .l2{white-space:normal}
.day .cell{min-height:200px}
.dragging{position:fixed;z-index:200;pointer-events:none;opacity:.92;transform:rotate(-1.5deg);box-shadow:0 10px 30px rgba(0,0,0,.3);width:220px}
.ph{height:4px;border-radius:2px;background:var(--p-black);margin:-2px 0}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));border:1px solid var(--p-line-strong);border-radius:10px;background:var(--p-white);overflow:hidden}
.mgrid .gh{position:sticky;top:-12px}
.mcell{border-top:1px solid var(--p-line-strong);border-left:1px solid var(--p-line);min-height:150px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcell:nth-child(5n+1){border-left:0}
.mcell.out{background:var(--p-cream-lt)}
.sc img,.jc img,.mc img{-webkit-user-drag:none;user-select:none}
.mgrid.two .mcell{min-height:240px}
.mgrid.two .mcell.past{background:var(--p-cream-lt)}
.mgrid.two .mcell:nth-child(n+11):nth-child(-n+15){border-top:3px solid var(--p-black)}
.mcell.out .mn{color:var(--p-ink-3)}
.mcell.today .mn{background:var(--p-yellow);border-radius:var(--p-pill);padding:2px 8px}

// Imprints ink names (lookup of the linked Inks' names): "Pantone 7579 - Discharge", "White - Discharge", "EZP WHT", "TBA 1".
function inkNamesOf(f){ const v=f[F.inkNm]; const a=Array.isArray(v)?v.map(first):(v==null||typeof v==='object'?[]:String(v).split(/\s*[,\n]\s*/));

function inkParse(name,jobType){

  const m=s.match(/^(.*?)\s+[-\u2013]\s+(.*)$/); if(m){ col=m[1]; typ=m[2]; }

function inkSim(a,b){

// product for speeds and gaps: bandana, tote, else tee; fleece comes in as a share of the pieces (j.heavy)
function prodOf(j){ if(/bandana/i.test(j.loc)||j.types.includes('Bandana')) return 'bandana'; if(j.heavy>=.5) return 'fleece'; if(j.types.length&&j.types.every(t=>t==='Tote Bag')) return 'tote'; return 'tee'; }
// v9: {setup, run} minutes from the calibration; machines without history use Airtable's formula (runSecs)
function jobParts(j,equip){
  equip=equip==null?j.equip:equip; if(!equip) equip=guessEquip(j);
  const lane=laneOf(equip), q=j.qty||0, man=(j.manual||0)/60;
  if(lane==='p1'||lane==='p2'||lane==='split'){
    const R=lane==='split'?{tee:CAL.rate.p1.tee+CAL.rate.p2.tee,bandana:CAL.rate.p1.bandana+CAL.rate.p2.bandana,fleece:CAL.rate.p1.fleece+CAL.rate.p2.fleece,tote:CAL.rate.p1.tote+CAL.rate.p2.tote}:CAL.rate[lane];
    const setup=CAL.setup[lane]*Math.max(1,j.screens||0)+(j.inks||0)*CAL.ink;   // v22: Ink Changes count (was Ink Change time ÷ 25 min)
    let perPc;
    if(/bandana/i.test(j.loc)||j.types.includes('Bandana')) perPc=1/R.bandana;
    else { const h=j.heavy||0, base=(j.types.length&&j.types.every(t=>t==='Tote Bag'))?R.tote:R.tee; perPc=(1-h)/base+h/R.fleece; }
    return {setup, run:q*perPc*60+man}; }
  // v22: Airtable's estimate (and runSecs) already include the 18 min hooping; show it as setup, count it once
  if(equip==='Embroidery - TAJIMA 6-Head'){ const all=runSecs(j,equip)/60, hoop=hoopsOn(j,equip)?Math.min(CAL.hoop,all):0; return {setup:hoop, run:all-hoop}; }
  // heat presses keep Airtable's formula until the measured speeds (CAL.heat, small sample) are checked with the heat press person
  return {setup:0, run:runSecs(j,equip)/60}; }
// estimate from the calibration (same numbers as Airtable's Estimated Run Time since 2026-10-14)
function estMin(j,equip){ const t=jobParts(j,equip); return Math.max(STEP, Math.ceil(t.setup+t.run)); }
// job length on the board: the scheduler's Allocated Production Time when set, else the estimate
// v20: with no Allocated yet, the estimate rounded up to 15 min (Mike) = what placing the job writes as Allocated
const ALLOC_STEP=15;   // Allocated rounds the estimate up to the next 15 min (Stephen), same grid as start times
function estStep(j,equip){ return Math.ceil(estMin(j,equip)/ALLOC_STEP)*ALLOC_STEP; }   // minutes
function jobMin(j,equip){ return j.alloc?Math.max(5,Math.ceil(j.alloc/60)):estStep(j,equip); }
function allocFor(j,equip){ return estStep(j,equip)*60; }   // seconds

/* ---------------- Airtable ---------------- */
async function atList(formula,maxPages){
  let out=[],offset=null,pages=0;
  const fields=Object.values(F).map(f=>'&fields%5B%5D='+f).join('');
  do{
    const u='https://api.airtable.com/v0/'+BASE+'/'+TBL+'?returnFieldsByFieldId=true&pageSize=100&filterByFormula='+encodeURIComponent(formula)+fields+(offset?'&offset='+encodeURIComponent(offset):'');
    const r=await fetch(u,{headers:{Authorization:'Bearer '+token()}});
    if(!r.ok){ const t=await r.text(); throw new Error('Airtable '+r.status+': '+t.slice(0,160)); }
    const d=await r.json(); out=out.concat(d.records||[]); offset=d.offset; pages++;
  }while(offset && pages<(maxPages||20));
  return out; }
// updates: [{rid, fields:{fieldId:value}}]. Practice mode fakes it.
async function patchMany(updates){
  if(!updates.length) return;
  if(PRACTICE){ await new Promise(r=>setTimeout(r,250)); return; }
  for(let i=0;i<updates.length;i+=10){
    const chunk=updates.slice(i,i+10).map(u=>({id:u.rid,fields:u.fields}));
    const r=await fetch('https://api.airtable.com/v0/'+BASE+'/'+TBL,{method:'PATCH',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify({records:chunk,typecast:true})});
    if(!r.ok){ const t=await r.text(); throw new Error('Save failed ('+r.status+'): '+t.slice(0,160)); }
  } }

function loadRange(){ // what to load: a week back, the view, and the Suggest horizon
  const t=shopToday(); const v=viewDays();
  let a=addDays(monday(t),-7), b=nextWorkday(t,CFG.horizon+5);
  if(v[0]<a) a=addDays(v[0],-1); if(v[v.length-1]>b) b=addDays(v[v.length-1],1);
  return [a,b]; }
// Garment type per job, from its Line Items (Garments' type lookup, a select, so names come through).
// Fleece share = fleece pieces / all pieces, used for run time. Loaded after the board shows; cached.
const LI_TBL='tblJx5UlwO7oMSk5H', LI_F={type:'fldQg3ejR10sADyFV',qty:'fldFfuKAcduwWQp8g',garment:'fldZbOdGIoCk3Gan2'};
const GAR_TBL='tblukWGm0CIelookM', GAR_NAME='fldT4jfh2XV9lERef';
const HEAVY={'Sweatshirt':1,'Pullover Hoodie':1,'Zip Up Hoodie':1,'Youth Fleece':1};
S.li={}; S.gar={};
// Airtable allows 5 requests a second per base (shared with every other app). On 429, wait and try again.
async function atGet(u){
  for(let tries=0;;tries++){
    const r=await fetch(u,{headers:{Authorization:'Bearer '+token()}});
    if(r.status===429 && tries<4){ await new Promise(res=>setTimeout(res,1200*(tries+1))); continue; }
    if(!r.ok) throw new Error('Airtable '+r.status);
    return r.json(); } }
// Records by id, 40 per request. onChunk gets each batch as it lands, so a later failure keeps the earlier ones.
async function atIds(table,ids,fields,onChunk){
  const out=[];
  for(let i=0;i<ids.length;i+=40){
    const f='OR('+ids.slice(i,i+40).map(id=>"RECORD_ID()='"+id+"'").join(',')+')';
    const u='https://api.airtable.com/v0/'+BASE+'/'+table+'?returnFieldsByFieldId=true&pageSize=100&filterByFormula='+encodeURIComponent(f)+fields.map(x=>'&fields%5B%5D='+x).join('');
    const recs=(await atGet(u)).records||[]; out.push(...recs); if(onChunk) onChunk(recs);
    if(i+40<ids.length) await new Promise(res=>setTimeout(res,250));   // stay well under the limit
  }
  return out; }
function keepLi(recs){ recs.forEach(r=>{ const f=r.fields||{};
  S.li[r.id]={type:first(f[LI_F.type])||'',qty:+first(f[LI_F.qty])||0,gar:Array.isArray(f[LI_F.garment])?f[LI_F.garment].map(g=>g&&g.id||g):[]}; }); }
function applyLi(j){ let q=0,h=0; const t=new Set();
  j.lis.forEach(id=>{ const li=S.li[id]; if(!li) return; if(li.type) t.add(li.type); q+=li.qty; if(HEAVY[li.type]) h+=li.qty; });
  j.types=[...t]; j.heavy=q?h/q:0; j.liQty=q; j.fleece=j.heavy>=.5; }
let liLoading=false;
async function loadLineItems(){
  if(liLoading) return; liLoading=true;
  // unscheduled jobs and the ones in view first: they matter most for run times
  const vd=new Set(viewDays());
  const order=Object.values(S.jobs).sort((a,b)=>((a.start&&!vd.has(day(a)))?1:0)-((b.start&&!vd.has(day(b)))?1:0));
  const need=[...new Set(order.flatMap(j=>j.lis))].filter(id=>!S.li[id]);
  try{ if(need.length) await atIds(LI_TBL,need,Object.values(LI_F),keepLi); }
  catch(e){ console.warn('line items (kept what loaded)',e); }
  finally{ liLoading=false; Object.values(S.jobs).forEach(applyLi); render(); } }
async function garmentNames(j){
  const miss=j.lis.filter(id=>!S.li[id]);
  if(miss.length){ try{ keepLi(await atIds(LI_TBL,miss,Object.values(LI_F))); applyLi(j); }catch(e){ console.warn('line items',e); } }
  const ids=[...new Set(j.lis.flatMap(id=>(S.li[id]||{}).gar||[]))];
  const need=ids.filter(id=>!(id in S.gar));
  if(need.length){ try{ (await atIds(GAR_TBL,need,[GAR_NAME])).forEach(r=>{ S.gar[r.id]=first((r.fields||{})[GAR_NAME])||''; }); }catch(e){ console.warn('garments',e); } }
  const names=ids.map(id=>S.gar[id]).filter(Boolean);
  return names.length?names:j.types; }
async function load(){
  if(!token()){ renderTokenBox(); return; }
  const [a,b]=loadRange();
  document.getElementById('cal').innerHTML=Object.keys(S.jobs).length?document.getElementById('cal').innerHTML:'<div class="loading">Loading the schedule…</div>';
  const statusOK='OR('+ACTIVE_STATUS.map(s=>'FIND("'+s+'",ARRAYJOIN({Order Status Lookup}))').join(',')+')';
  try{
    const [sched,uns]=await Promise.all([
      atList('AND(IS_AFTER({Scheduled Start Time},"'+addDays(a,-1)+'"),IS_BEFORE({Scheduled Start Time},"'+addDays(b,1)+'"))'),
      atList('AND({Scheduled Start Time}=BLANK(),NOT({Run Finished}),NOT({Caught}),{Imprint Type}!="Patch/Label ONLY",'+statusOK+')')
    ]);
    const jobs={}; sched.concat(uns).forEach(r=>{ jobs[r.id]=mkJob(r); });
    S.jobs=jobs; S.loaded=[a,b];
    S.ghosts=S.ghosts.filter(g=>jobs[g.rid]&&!jobs[g.rid].start);

    document.getElementById('cal').innerHTML='<div class="p-note p-note-alert" style="margin:20px">Couldn\'t load the schedule. '+esc(e.message)+' <button class="p-btn p-btn-quiet" onclick="load()">Try again</button></div>';
  } }
function refresh(){ load(); if(window.PineUpdate&&PineUpdate.check) PineUpdate.check(); }

/* ---------------- view math ---------------- */
function viewDays(){
  const a=S.anchor;
  if(S.view==='day') return [a];
  if(S.view==='3day'){ const out=[]; let d=isWeekend(a)?nextWorkday(a,1):a; while(out.length<3){ out.push(d); d=nextWorkday(d,1);} return out; }
  if(S.view==='week'){ const m=monday(a); return [0,1,2,3,4].map(i=>addDays(m,i)); }
  if(S.view==='2week'){ const m=monday(a); return [0,1,2,3,4,7,8,9,10,11].map(i=>addDays(m,i)); }
  // month: Mon-Fri weeks covering the month
  const first1=a.slice(0,8)+'01'; let d=monday(first1); const out=[];
  const mo=a.slice(5,7);
  while(true){ for(let i=0;i<5;i++) out.push(addDays(d,i)); d=addDays(d,7); if(d.slice(5,7)!==mo && d>first1) break; }
  return out; }
function nav(n){
  if(S.view==='day'){ S.anchor=nextWorkday(S.anchor,n); }
  else if(S.view==='3day'){ S.anchor=nextWorkday(S.anchor,3*n); }
  else if(S.view==='week'){ S.anchor=addDays(S.anchor,7*n); }
  else if(S.view==='2week'){ S.anchor=addDays(S.anchor,14*n); }
  else { const d=new Date(S.anchor.slice(0,8)+'15T12:00:00Z'); d.setUTCMonth(d.getUTCMonth()+n); S.anchor=d.toISOString().slice(0,10); }
  afterNav(); }
function goToday(){ S.anchor=shopToday(); if(isWeekend(S.anchor)) S.anchor=nextWorkday(S.anchor,1); afterNav(); }
function afterNav(){ const v=viewDays(); if(S.loaded && (v[0]<S.loaded[0]||v[v.length-1]>S.loaded[1])) load(); render(); }
function setView(k){ S.view=k; writeLS('pine_sched_view',k); afterNav(); }
// Machines shown. null = all. Tap a machine while All is on = only that one; tap more to add; tap again to drop.
function isSel(k){ return !S.sel || S.sel.includes(k); }
function pickMachine(k){
  if(k==='all') S.sel=null;
  else if(!S.sel) S.sel=[k];
  else if(S.sel.includes(k)){ S.sel=S.sel.filter(x=>x!==k); if(!S.sel.length) S.sel=null; }
  else S.sel=S.sel.concat(k);
  writeLS('pine_sched_machines',JSON.stringify(S.sel)); render(); }
// the machine a job belongs to for filtering: its press, else the press it would most likely go on
function jobKey(j){ const l=laneOf(j.equip); return l!=='none'?l:laneOf(guessEquip(j)); }
function jobInSel(j){ if(!S.sel) return true; const k=jobKey(j); if(S.sel.includes(k)) return true;
  return !j.equip && deptOf(j)==='screen' && S.sel.includes('p2'); }
function machineChips(){
  const used=new Set(); Object.values(S.jobs).forEach(j=>used.add(laneOf(j.equip)));
  const list=LANES.filter(p=>p.k!=='none' && (!p.opt||used.has(p.k)));
  const cnt={}; const vd=viewDays(); allPlaced().forEach(x=>{ if(vd.includes(x.day)){ const k=laneOf(x.equip); cnt[k]=(cnt[k]||0)+1; } });
  // v17: kit chips (.p-tab + .p-count), one line; a picked machine wears its lane color
  return '<button type="button" class="p-tab mchip'+(!S.sel?' is-on':'')+'" aria-pressed="'+!S.sel+'" onclick="pickMachine(\'all\')">All</button>'+
    list.map(p=>{ const on=!!(S.sel&&S.sel.includes(p.k)); return '<button type="button" class="p-tab mchip '+ckLane(p.k)+(on?' is-on':'')+'" aria-pressed="'+on+'" onclick="pickMachine(\''+p.k+'\')">'+esc(p.short)+(cnt[p.k]?' <span class="p-count">'+cnt[p.k]+'</span>':'')+'</button>'; }).join(''); }
function openDay(ds){ S.anchor=ds; setView('day'); }

function rowsFor(days){
  const inView=new Set(); allPlaced().forEach(x=>{ if(days.includes(x.day)) inView.add(laneOf(x.equip)); });
  return LANES.filter(p=>isSel(p.k) && (!p.opt||inView.has(p.k)||(S.sel&&S.sel.includes(p.k)))); }
function friOpen(p){ // Fridays: 0 = no shift, 1 = Press 1 only (plus the other departments), 2 = both presses
  if(CFG.fri===0) return false; if(CFG.fri===1) return p.k!=='p2' && p.k!=='split'; return true; }
function isOpen(p,ds){ if(isWeekend(ds)) return false; if(dow(ds)===5) return friOpen(p); return true; }
function capMin(p,ds){ return isOpen(p,ds)?Math.round(p.hours*60):0; }

// Everything on the calendar: real jobs plus suggestion ghosts, as {rid, equip, day, min, len, ghost}
function allPlaced(){
  const out=[];
  Object.values(S.jobs).forEach(j=>{ if(j.start) out.push({rid:j.rid,equip:j.equip,day:day(j),min:startMin(j),len:jobMin(j),ghost:false}); });
  S.ghosts.forEach(g=>out.push({rid:g.rid,equip:g.equip,day:g.day,min:g.min,len:jobMin(S.jobs[g.rid],g.equip),ghost:true,late:g.late}));
  return out; }
function cellItems(pk,ds,placed){
  return (placed||allPlaced()).filter(x=>x.day===ds && laneOf(x.equip)===pk).sort((a,b)=>a.min-b.min||(a.ghost-b.ghost)); }
function usedMin(items){ return items.reduce((a,x)=>a+x.len,0); }
// v22: when the machine's last job ends (start times + lengths, so gaps between jobs count), and whether that's past close
function endMin(items){ return items.reduce((a,x)=>Math.max(a,x.min+x.len),0); }
function pastClose(items){ return items.length>0 && endMin(items)>CFG.close; }
function endTip(items){ if(!items.length) return ''; const e=endMin(items); return ' · last job ends '+hm(e)+(e>CFG.close?', past close ('+hm(CFG.close)+')':''); }

/* ---------------- v23: impressions goals + "why is it this full?" pop-up ---------------- */
// Impressions = Imprints qty ("Active Impressions"): the pieces printed at that imprint's one location (the line items' qty once finished).
// A tee with a front and a back is two imprints, so summing qty = pieces × print locations (same count Day Fill used).
const IMPS_LOW=0.6;   // under 60% of the goal shows muted
function goalOf(k){ return (k==='p1'||k==='p2')?Math.max(0,+(CFG.goal||{})[k]||0):0; }
function jobImps(j){ return j?(j.qty||j.liQty||0):0; }   // the Imprints qty rollup reads 0 once a job is finished: then the line items' qty
function impsOf(items){ return items.reduce((a,x)=>a+jobImps(S.jobs[x.rid]),0); }
function whyAttr(k,ds){ return ' data-why="'+k+'|'+ds+'" role="button" tabindex="0"'; }
// Day view: "820 / 1,100 imps" with a small bar, under the time %
function impsRow(k,ds,items){ const g=goalOf(k); if(!g) return ''; const n=impsOf(items);
  return '<div class="imps'+(n<g*IMPS_LOW?' low':'')+'"'+whyAttr(k,ds)+' title="Impressions (pieces × print locations): '+n.toLocaleString()+' of the '+g.toLocaleString()+' goal · click for the breakdown"><span class="bar"><i style="width:'+Math.min(100,n/g*100)+'%"></i></span><span class="it">Planned <b>'+n.toLocaleString()+'</b> impressions · goal '+g.toLocaleString()+'</span></div>'; }
// Week / 3 Day header: one compact line per press
function impsLine(k,ds,items){ const g=goalOf(k), n=impsOf(items);
  return '<span class="iln '+ckLane(k)+(n<g*IMPS_LOW?' low':'')+'"'+whyAttr(k,ds)+' title="'+esc(LBY[k].short)+' impressions: '+n.toLocaleString()+' of the '+g.toLocaleString()+' goal · click for the breakdown"><span class="ik">'+LBY[k].pk+'</span><span class="in">'+n.toLocaleString()+' · goal '+g.toLocaleString()+'</span><span class="ibar"><i style="width:'+Math.min(100,n/g*100)+'%"></i></span></span>'; }
// Everything behind one machine-day's %: each job's booked minutes (they add up to the %), gaps, impressions and reasons.
function whyData(k,ds){
  const lane=LBY[k], items=cellItems(k,ds), cap=capMin(lane,ds), used=usedMin(items);
  const rows=items.map(x=>{ const j=S.jobs[x.rid], eq=x.equip, p=jobParts(j,eq), est=estMin(j,eq), step=estStep(j,eq);
    const fleeceX=(laneOf(eq)==='p1'||laneOf(eq)==='p2'||laneOf(eq)==='split')&&j.heavy>0?p.run-jobParts(Object.assign({},j,{heavy:0}),eq).run:0;
    return {rid:x.rid, ID:j.ID, cust:j.cust, equip:eq, start:x.min, len:x.len, ghost:x.ghost, alloc:!!j.alloc, setup:p.setup, run:p.run, est, step,
      hoop:hoopsOn(j,eq)?p.setup:0, screens:j.screens||0, inks:j.inks||0, qty:j.qty||0, heavy:j.heavy||0, fleeceX, hd:j.hd, type:j.type, loc:j.loc||'', types:j.types||[], prod:prodOf(j)}; });
  let gaps=0; for(let i=1;i<items.length;i++) gaps+=Math.max(0,items[i].min-(items[i-1].min+items[i-1].len));
  const end=endMin(items), pct=cap?Math.round(used/cap*100):null, goal=goalOf(k), imps=impsOf(items);
  const d={k, ds, lane, cap, used, pct, rows, gaps, end, start:items.length?items[0].min:null, past:pastClose(items), goal, imps, open:isOpen(lane,ds)};
  d.reasons=used>cap&&cap>0?whyReasons(d):[];
  d.drivers=whyDrivers(d); d.tip=whyTip(d,d.drivers);
  // v25: ink runs and the same-ink tip (presses only)
  const P=k==='p1'||k==='p2'||k==='split';
  d.runs=P?inkRuns(items.map(x=>S.jobs[x.rid])):[]; d.inkTip=P?inkTip(items):''; d.plan=P&&!items.some(x=>x.ghost)?groupPlan(k,ds):null;
  return d; }
// What takes the time on this machine-day, from what the app already works out. Each driver = {min, text}; biggest first.
// Over 100% the pop-up lists them all under "Why it's over 100%"; under 100% only the top 3, under "Where the time goes".
function whyDrivers(d){
  const out=[], P=d.k==='p1'||d.k==='p2'||d.k==='split', pr=d.rows.filter(x=>{ const l=laneOf(x.equip); return l==='p1'||l==='p2'||l==='split'; });
  const ids=a=>a.length<=3?' ('+a.map(x=>x.ID).join(', ')+')':'';
  // screens (setup) and ink changes
  const scr=pr.map(x=>({x,m:x.setup-x.inks*CAL.ink})).filter(o=>o.m>0), sm=scr.reduce((a,o)=>a+o.m,0), sn=pr.reduce((a,x)=>a+Math.max(1,x.screens),0);
  if(sm>=15){ const top=pr.slice().sort((a,b)=>b.screens-a.screens)[0];
    out.push({min:sm,text:'Screen setup: '+sn+' screen'+(sn===1?'':'s')+' = '+dur(sm)+(top&&top.screens>=5?' (most: '+top.ID+', '+top.screens+' screens)':'')+'.'}); }
  const ink=pr.filter(x=>x.inks>0), im=ink.reduce((a,x)=>a+x.inks*CAL.ink,0);
  if(im) out.push({min:im,text:'Ink changes: '+ink.reduce((a,x)=>a+x.inks,0)+' × '+CAL.ink+'m = '+dur(im)+ids(ink)+'.'});
  // sweatshirts / fleece against tee speed
  const fl=d.rows.filter(x=>x.fleeceX>0), fm=fl.reduce((a,x)=>a+x.fleeceX,0);
  if(fm>=5){ const pcs=Math.round(fl.reduce((a,x)=>a+x.qty*x.heavy,0)), R=CAL.rate[d.k==='p2'?'p2':'p1'];
    out.push({min:fm,text:'Sweatshirts/fleece: '+pcs.toLocaleString()+' pcs print at '+R.fleece+'/hr vs '+R.tee+'/hr on tees: +'+dur(fm)+'.'}); }
  // bandanas against tee speed
  const bd=pr.filter(x=>/bandana/i.test(x.loc)||x.types.includes('Bandana'));
  if(bd.length){ const R=CAL.rate[d.k==='p2'?'p2':'p1'], pcs=bd.reduce((a,x)=>a+x.qty,0), bm=pcs*(1/R.bandana-1/R.tee)*60, all=pr.reduce((a,x)=>a+x.qty,0);
    if(bm>=5||pcs>=all*.5) out.push({min:Math.max(0,bm),text:'Bandanas: '+pcs.toLocaleString()+' pcs'+(pcs>=all*.5?' (most of the day)':'')+' at '+R.bandana+'/hr vs '+R.tee+'/hr on tees: +'+dur(Math.max(0,bm))+'.'}); }
  // pallet (platen) changes between jobs in the day's order: product switches bandana ↔ tee ↔ fleece
  let sw=0; const kinds=new Set(); pr.forEach((x,i)=>{ kinds.add(x.prod); if(i&&x.prod!==pr[i-1].prod) sw++; });
  const turn=CAL.turn[d.k]||[10,10];
  if(P&&sw) out.push({min:sw*turn[1],text:'Pallet changes: '+sw+' ('+[...new Set(pr.map(x=>x.prod))].join(' ↔ ')+') at about '+turn[1]+'m each = '+dur(sw*turn[1])+'. Between jobs, so it pushes the end time (not in the %).',pallet:sw-(kinds.size-1)});
  // many small runs: each pays a full setup for few pieces
  const small=pr.filter(x=>x.qty>0&&x.qty<50);
  if(small.length>=3){ const m=small.reduce((a,x)=>a+x.setup,0); out.push({min:m,text:small.length+' small runs (under 50 pcs): '+dur(m)+' of setup for '+small.reduce((a,x)=>a+x.qty,0).toLocaleString()+' pcs.'}); }
  const hp=d.rows.filter(x=>x.hoop>0); if(hp.length) out.push({min:hp.reduce((a,x)=>a+x.hoop,0),text:'Embroidery hooping: '+dur(hp.reduce((a,x)=>a+x.hoop,0))+(hp.length>1?' ('+hp.length+' jobs × '+CAL.hoop+'m)':'')+'.'});

function whyReasons(d){

  const big=d.rows.slice().sort((a,b)=>b.len-a.len)[0]; if(big&&d.rows.length>1&&big.len>=d.cap*.5) r.push(big.ID+' alone is '+dur(big.len)+' ('+Math.round(big.len/d.cap*100)+'% of the day).');

// one "Next time" line, only where it's cheap to work out
function whyTip(d,dr){
  const pal=dr.find(x=>x.pallet>0);
  if(pal){ const blocks={}; d.rows.forEach((x,i)=>{ if(x.prod&&(!i||d.rows[i-1].prod!==x.prod)) blocks[x.prod]=(blocks[x.prod]||0)+1; });
    const p=Object.keys(blocks).sort((a,b)=>blocks[b]-blocks[a])[0];
    return 'Group the '+p+' jobs together to save '+pal.pallet+' pallet change'+(pal.pallet===1?'':'s')+' (about '+dur(pal.pallet*(CAL.turn[d.k]||[10,10])[1])+').'; }
  if(d.used>d.cap){ // the smallest movable job that fits on one of the next 5 workdays on this machine
    const need=d.used-d.cap, mv=d.rows.filter(x=>!x.hd&&!x.ghost&&!(S.jobs[x.rid]||{}).locked).sort((a,b)=>(a.len>=need?0:1)-(b.len>=need?0:1)||a.len-b.len);
    for(const x of mv){ let ds=d.ds; for(let i=0;i<5;i++){ ds=nextWorkday(ds,1); const cap=capMin(d.lane,ds), u=usedMin(cellItems(d.k,ds)); if(cap&&u+x.len<=cap) return 'Move '+x.ID+' ('+dur(x.len)+') to '+wd(ds)+' '+md(ds)+': '+d.lane.short+' has '+dur(cap-u)+' free.'; } } }
  return ''; }
function whyJobLine(x){

  else if(x.setup) parts='setup '+dur(x.setup)+' ('+[(x.screens>0?x.screens:1)+' screen'+(x.screens>1?'s':'')+' × '+CAL.setup[laneOf(x.equip)]+'m',x.inks?x.inks+' ink change'+(x.inks===1?'':'s')+' × '+CAL.ink+'m':''].filter(Boolean).join(' + ')+') + printing '+dur(x.run)+(x.qty?' ('+x.qty.toLocaleString()+' pcs'+(x.heavy>0?', '+(x.heavy>=.99?'fleece':Math.round(x.heavy*100)+'% fleece'):'')+')':'');
  else parts=(x.qty?x.qty.toLocaleString()+' pcs: ':'')+dur(x.run);
  const how=x.alloc?(x.len===x.est?'Allocated':'Allocated in Airtable (estimate '+dur(x.est)+')'):(x.step>x.est?'estimate '+dur(x.est)+', rounded up to 15m':'estimate');

function renderCal(){

      // the same machines in the same spots every day: Press 1 + 2 always, others when they have work this week

      // v23: impressions vs goal, one line per press

async function runSearch(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();

  if(q===S.fq && !S.fErr){ return; }
  const my=++searchSeq; S.fBusy=true; S.fErr=''; renderSide();
  const t=q.replace(/["\\]/g,'');
  const has=f=>'FIND("'+t+'",LOWER('+f+'))';
  const formula='AND(NOT({Scheduled Start Time}=BLANK()),NOT({Run Finished}),OR('+[has('{Imprint ID}'),has('{Imprint Nickname}'),has('{Customer Name Search}'),has('ARRAYJOIN({Invoice / Order Lookup})')].join(',')+'))';
  const u='https://api.airtable.com/v0/'+BASE+'/'+TBL+'?returnFieldsByFieldId=true&maxRecords=51&pageSize=51&sort%5B0%5D%5Bfield%5D='+encodeURIComponent('Scheduled Start Time')+'&sort%5B0%5D%5Bdirection%5D=asc&filterByFormula='+encodeURIComponent(formula)+Object.values(F).map(f=>'&fields%5B%5D='+f).join('');
  try{ const recs=(await atGet(u)).records||[]; if(my!==searchSeq) return;

  catch(e){ if(my!==searchSeq) return; console.warn('search',e); S.found={}; S.fq=q; S.fMore=false; S.fErr='search failed'; }

/* ---------------- moving jobs ---------------- */
// Put job rid on press pk, day ds, at position idx among that cell's jobs. Only the moved job and any job it
// would overlap get new times, so gaps the scheduler left on purpose (lunch, a late truck) stay.
function planMove(rid,pk,ds,idx,forceEquip){
  const j=S.jobs[rid]; const equip=forceEquip||(pk==='none'?j.equip:equipFor(j,pk));
  const items=cellItems(pk,ds).filter(x=>x.rid!==rid && !x.ghost).map(x=>({rid:x.rid,min:x.min,len:x.len}));
  if(idx==null||idx>items.length) idx=items.length;
  const len=jobMin(j,equip);
  const prev=items[idx-1];
  // v20 (Mike): start at the exact end of the job before it, no changeover gap and no rounding to 15 min.
  // The scheduler adds lunch or a gap by hand (pick a time in the pop-up); Allocated is already in 15-min steps.
  const t=prev?prev.min+prev.len:(items[0]&&idx===0?Math.min(DAY_START,items[0].min):DAY_START);
  return [{rid,equip,day:ds,min:t}].concat(pushLater(items,idx,t+len,ds)); }
// later jobs that would overlap move to the exact end of the one before; the first one that already fits stops it,
// so gaps the scheduler left on purpose (lunch, a late truck) stay
function pushLater(items,idx,end,ds){ const out=[];
  for(let i=idx;i<items.length;i++){ const x=items[i]; if(x.min>=end) break;
    out.push({rid:x.rid,equip:S.jobs[x.rid].equip,day:ds,min:end}); end=end+x.len; }
  return out; }
// gap after job a before job b on the same lane: loading, takedown, cleanup (measured), longer on a product change
function co(a,b){ if(!a||!b) return 0; const t=CAL.turn[laneOf(a.equip)]||[10,10]; return prodOf(a)===prodOf(b)?t[0]:t[1]; }
function coL(lane,a,b){ if(!a||!b) return 0; const t=CAL.turn[lane]||[10,10]; return prodOf(a)===prodOf(b)?t[0]:t[1]; }   // v25: by the lane the job goes on

async function applyChanges(changes,label){
  const before=changes.map(c=>{ const j=S.jobs[c.rid]; return {rid:c.rid,equip:j.equip,start:j.start,alloc:j.alloc}; });
  const ups=changes.map(c=>{ const j=S.jobs[c.rid]; const f={};
    if(c.unschedule){ j.start=null; f[F.start]=null; }
    else { if(c.equip!==j.equip){ j.equip=c.equip; f[F.equip]=c.equip; } setStart(j,c.day,c.min); f[F.start]=j.start;
      // no Allocated time yet: fill it from the estimate so Operator, the Board and the calendar show the same length
      if(!j.alloc){ j.alloc=allocFor(j,c.equip); f[F.alloc]=j.alloc; } }
    j._saving=true; return {rid:c.rid,fields:f}; });
  S.busy++; render();
  try{ await patchMany(ups); changes.forEach(c=>{ S.jobs[c.rid]._saving=false; });
    S.busy--; render();
    toast(label+(PRACTICE?' (practice, not saved)':''),'Undo',()=>undo(before));
  }catch(e){ before.forEach(b=>{ const j=S.jobs[b.rid]; j.equip=b.equip; j.start=b.start; j.alloc=b.alloc; j._saving=false; });
    S.busy--; render(); toast(e.message,null,null,true); } }
async function undo(before){
  const ups=before.map(b=>{ const j=S.jobs[b.rid]; const f={}; f[F.start]=b.start; if(j.equip!==b.equip&&b.equip) f[F.equip]=b.equip; if(j.alloc!==b.alloc) f[F.alloc]=b.alloc||null; j.equip=b.equip; j.start=b.start; j.alloc=b.alloc; return {rid:b.rid,fields:f}; });
  S.busy++; render();
  try{ await patchMany(ups); S.busy--; render(); toast('Put back'+(PRACTICE?' (practice)':'')); }
  catch(e){ S.busy--; toast(e.message,null,null,true); load(); } }
function moveLabel(rid,equip,ds,min){ const j=S.jobs[rid]; return j.ID+' → '+(PBY[equip]||PBY.none).short+', '+wd(ds)+' '+md(ds)+' '+hm(min)+(j.locked?' · still locked in':''); }
function moveJob(rid,pk,ds,idx,forceEquip){
  const j=S.jobs[rid]; const p=LBY[pk];
  if(p.k==='none'){ toast('Pick a press for '+j.ID+' first (tap the card)'); render(); return; }
  if(isWeekend(ds)){ render(); return; }
  S.ghosts=S.ghosts.filter(g=>g.rid!==rid); delete S.why[rid];
  const ch=planMove(rid,pk,ds,idx,forceEquip); const m=ch[0];
  let label=moveLabel(rid,m.equip,ds,m.min); if(ch.length>1) label+=' · '+(ch.length-1)+' after it moved later';
  if(!isOpen(p,ds)) label+=' · that lane is off that day';
  applyChanges(ch,label); }
function unschedule(rid){ const j=S.jobs[rid]; if(!j.start) return; applyChanges([{rid,unschedule:true}],j.ID+' unscheduled'); }

/* ---------------- drag and drop (mouse, pen and touch) ---------------- */
// Mouse: press and move. Touch: hold a moment, then drag (a quick swipe still scrolls).
// v16: a mouse grab on a mockup picture started the browser's own image drag and cancelled ours
document.addEventListener('dragstart',e=>{ if(e.target.closest&&e.target.closest('.jc,.sc,.mc')) e.preventDefault(); });
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.jc,.sc,.mc'); if(!el||e.button>0) return;
  if(!document.getElementById('gear').hidden) return;   // v17: a tap that closes the ⚙ menu doesn't also open or drag a card
  const d={el,rid:el.dataset.rid,ghost:el.dataset.ghost==='1',x:e.clientX,y:e.clientY,id:e.pointerId,touch:e.pointerType==='touch',on:false,ready:e.pointerType!=='touch'};
  if(d.touch) d.timer=setTimeout(()=>{ d.ready=true; startDrag(d,d.x,d.y); if(navigator.vibrate) navigator.vibrate(15); },280);
  S.drag=d; });
document.addEventListener('pointermove',e=>{
  const d=S.drag; if(!d||e.pointerId!==d.id) return;
  if(!d.on){ const far=Math.abs(e.clientX-d.x)+Math.abs(e.clientY-d.y)>6;
    if(d.touch&&!d.ready){ if(far){ clearTimeout(d.timer); S.drag=null; } return; }
    if(!far) return; startDrag(d,e.clientX,e.clientY); }
  moveGhost(d,e.clientX,e.clientY); });
document.addEventListener('touchmove',e=>{ if(S.drag&&S.drag.on) e.preventDefault(); },{passive:false});
document.addEventListener('pointerup',e=>{ const d=S.drag; if(!d||e.pointerId!==d.id) return; clearTimeout(d.timer); S.drag=null;
  if(!d.on){ openCard(d.rid,d.ghost); return; } endDrag(d,e.clientX,e.clientY); });
document.addEventListener('pointercancel',e=>{ const d=S.drag; if(!d) return; clearTimeout(d.timer); if(d.on) cleanupDrag(d); S.drag=null; });
function startDrag(d,x,y){
  d.on=true; const c=d.el.cloneNode(true); c.classList.add('dragging'); c.style.width=Math.min(260,Math.max(180,d.el.offsetWidth))+'px';
  document.body.appendChild(c); d.clone=c; d.el.style.opacity='.35'; document.body.style.cursor='grabbing';
  if(innerWidth<=1100 && d.el.classList.contains('sc')) toggleSide(false);
  moveGhost(d,x,y); }
function targetAt(x,y){
  const el=document.elementFromPoint(x,y); if(!el) return null;
  const side=el.closest('#side'); if(side) return {side:true,el:side};
  const cell=el.closest('.cell,.mcell,.dcell'); if(cell) return {el:cell,p:cell.dataset.p,d:cell.dataset.d,dcol:cell.classList.contains('dcell')};
  return null; }
function moveGhost(d,x,y){
  d.clone.style.left=(x-30)+'px'; d.clone.style.top=(y-16)+'px';
  const t=targetAt(x,y);
  document.querySelectorAll('.drop-on').forEach(n=>n.classList.remove('drop-on'));
  document.querySelectorAll('.ph').forEach(n=>n.remove());
  if(!t) return; t.el.classList.add('drop-on');
  if(t.dcol){ const cards=[...t.el.querySelectorAll('.jc')].filter(c=>c.dataset.rid!==d.rid); const at=cards.find(c=>{ const r=c.getBoundingClientRect(); return y<r.top+r.height/2; });
    const ph=document.createElement('div'); ph.className='ph'; const end=at||t.el.querySelector('.daylock,.daylocked'); if(end) t.el.insertBefore(ph,end); else t.el.appendChild(ph); }
  if(t.p){ const idx=dropIndex(t.el,y,d.rid); const cards=[...t.el.querySelectorAll('.jc')].filter(c=>c.dataset.rid!==d.rid);
    const ph=document.createElement('div'); ph.className='ph'; if(cards[idx]) t.el.insertBefore(ph,cards[idx]); else t.el.appendChild(ph); }
  // keep the calendar scrolling while dragging near its edges
  const cal=document.getElementById('cal'), r=cal.getBoundingClientRect();
  if(y>r.bottom-40) cal.scrollTop+=14; else if(y<r.top+40) cal.scrollTop-=14;
  if(x>r.right-40) cal.scrollLeft+=14; else if(x<r.left+40&&x>r.left) cal.scrollLeft-=14; }
function dropIndex(cell,y,rid){
  const cards=[...cell.querySelectorAll('.jc')].filter(c=>c.dataset.rid!==rid && c.dataset.ghost!=='1');
  for(let i=0;i<cards.length;i++){ const r=cards[i].getBoundingClientRect(); if(y<r.top+r.height/2) return i; }
  return cards.length; }
function cleanupDrag(d){ if(d.clone) d.clone.remove(); d.el.style.opacity=''; document.body.style.cursor='';
  document.querySelectorAll('.drop-on').forEach(n=>n.classList.remove('drop-on')); document.querySelectorAll('.ph').forEach(n=>n.remove()); }
function endDrag(d,x,y){
  const t=targetAt(x,y); const idx=t&&t.p?dropIndex(t.el,y,d.rid):null; cleanupDrag(d);
  if(!t){ return; }
  const j=S.jobs[d.rid]; if(!j) return;
  if(t.side){ if(d.ghost){ S.ghosts=S.ghosts.filter(g=>g.rid!==d.rid); S.skipped[d.rid]=1; render(); toast(j.ID+' left out of the suggestion'); } else unschedule(d.rid); return; }
  if(t.p){ const g=S.ghosts.find(g=>g.rid===d.rid); return moveJob(d.rid,t.p,t.d,idx,g&&laneOf(g.equip)===t.p?g.equip:null); }
  if(t.dcol){ // day column: the job keeps its machine (or the one Suggest picked); with one machine shown, it goes there
    const g=S.ghosts.find(g=>g.rid===d.rid); let pk=laneOf(g?g.equip:j.equip);
    if(pk==='none'){ if(S.sel&&S.sel.length===1) pk=S.sel[0]; else { const gl=laneOf(guessEquip(j)); pk=gl!=='none'&&isSel(gl)?gl:'none'; } }
    if(pk==='none'){ toast('Pick a press for '+j.ID+' first (tap the card)'); render(); return; }
    // position among that machine's jobs: how many of them sit above where it was dropped
    const idx2=[...t.el.querySelectorAll('.jc')].filter(c=>c.dataset.rid!==d.rid && c.dataset.ghost!=='1' && c.dataset.pk===pk && c.getBoundingClientRect().top+c.getBoundingClientRect().height/2<y).length;
    return moveJob(d.rid,pk,t.d,idx2,g&&g.equip); }
  // month cell: keep the press (or the one Suggest picked), go to the end of that day
  // v16: no press yet → same guess as the day columns (the one machine shown, or the likely press)
  const g=S.ghosts.find(g=>g.rid===d.rid); let equip=g?g.equip:j.equip; let lk=laneOf(equip);
  if(lk==='none'){ if(S.sel&&S.sel.length===1) lk=S.sel[0]; else { const ge=guessEquip(j), gl=laneOf(ge); if(gl!=='none'&&isSel(gl)){ lk=gl; equip=ge; } } }
  if(lk==='none'){ toast('Pick a press for '+j.ID+' first (tap the card)'); render(); return; }
  moveJob(d.rid,lk,t.d,null,laneOf(equip)===lk?equip:null); }

/* ---------------- suggest (Day Fill's packing, in minutes) ---------------- */
// Fills the next CFG.horizon workdays with unscheduled jobs:
//  - whole orders stay together on one day and one press when they fit
//  - hard deadlines first, then the earliest due date, then bigger orders
//  - aims to print idealBuffer workdays before the due date (at least 1), never before garments are expected
//  - Press 2 takes 4 screens or fewer (2 for bandanas); 5+ screens or 3+ prints in an order go to Press 1
//  - prefers a day that already runs the same platen (bandanas with bandanas)
function suggest(){
  if(!Object.keys(S.jobs).length) return;
  S.ghosts=[]; S.why={};
  const today=shopToday(); const startDay=nextWorkday(today,1);
  const horizon=[]; { let d=startDay; while(horizon.length<CFG.horizon){ if(!isWeekend(d)) horizon.push(d); d=nextWorkday(d,1);} }
  const placed=allPlaced();
  const use={}; placed.forEach(x=>{ const k=laneOf(x.equip)+'|'+x.day; use[k]=use[k]||{min:0,end:DAY_START,plat:{},jobs:[]}; const u=use[k]; u.min+=x.len; u.end=Math.max(u.end,x.min+x.len); u.plat[platen(S.jobs[x.rid])]=1; u.jobs.push(S.jobs[x.rid]); });
  const U=(pk,ds)=>use[pk+'|'+ds]||(use[pk+'|'+ds]={min:0,end:DAY_START,plat:{},jobs:[]});
  // v25: how well `jobs` fit with the inks already on a press-day (0 = no shared ink); the same product counts extra
  const inkFit=(jobs,others)=>{ let b=0; jobs.forEach(a=>others.forEach(o=>{ const s=inkSim(a,o); if(s.shared>0) b=Math.max(b,s.score+(prodOf(a)===prodOf(o)?3:0)); })); return b; };
    const cands=Object.values(S.jobs).filter(j=>!j.start && !j.noLines && !S.skipped[j.rid] && jobInSel(j));
  // group: order + department
  const groups={}; cands.forEach(j=>{ const k=j.order+'|'+deptOf(j); (groups[k]=groups[k]||[]).push(j); });
  const list=Object.values(groups).map(g=>{ const due=g.map(j=>j.due).filter(Boolean).sort()[0]||null;
    const arr=g.map(j=>j.allIn?null:j.arrival).filter(Boolean).sort().pop()||null;
    return {jobs:g, due, hd:g.some(j=>j.hd), dept:deptOf(g[0]), arrival:arr, size:g.reduce((a,j)=>a+jobMin(j),0)}; })
    .sort((a,b)=>(b.hd-a.hd)||((a.due||'9999').localeCompare(b.due||'9999'))||(b.size-a.size));
  list.forEach(G=>{
    const ideal=G.due?nextWorkday(G.due,-CFG.idealBuffer):null, hard=G.due?nextWorkday(G.due,-1):null;
    // garments: print the workday after they're expected; not checked in and no date yet -> 2 workdays out at the soonest
    let earliest=startDay; const notIn=G.jobs.some(j=>!j.allIn);
    if(G.arrival){ const a=nextWorkday(G.arrival,1); if(a>earliest) earliest=a; }
    else if(G.jobs.some(notOrdered)){ const a=nextWorkday(today,NOT_ORDERED_LEAD); if(a>earliest) earliest=a; }   // v18: garments still to be ordered

    }
    if(!presses.length){ G.jobs.forEach(j=>S.why[j.rid]='No press picked: drag it where it goes'); return; }
    // it fits when the press has the minutes AND the run ends by close (jobs go after the day's last job)
    const fits=(pk,ds,min)=>{ const p=LBY[pk]; const cap=capMin(p,ds); const u=U(pk,ds);
      return cap>0 && u.min+min<=cap*CFG.fill && Math.ceil((u.end+(u.last?12:0))/STEP)*STEP+min<=CFG.close+15; };   // press time fits AND the run ends by close
    const need=(jobs,pk)=>jobs.reduce((a,j)=>a+jobMin(j,equipFor(j,pk)),0);

    // v25: Hard Deadline and locked jobs keep v24's pick exactly; the others prefer a press, then a day, that runs the same inks

      for(const ds of horizon){
        if(ds<earliest) continue; if(last && ds>last) break; if(firstPick && ds>winEnd) break;
        const opts=presses.filter(pk=>fits(pk,ds,need(jobs,pk)));
        if(!opts.length) continue;
        const ink={}; if(inkPref) opts.forEach(pk=>{ ink[pk]=inkFit(jobs,U(pk,ds).jobs); });
        opts.sort((a,b)=>((U(b,ds).plat[plat]?1:0)-(U(a,ds).plat[plat]?1:0))||(inkPref?ink[b]-ink[a]:0)||(U(a,ds).min/capMin(LBY[a],ds)-U(b,ds).min/capMin(LBY[b],ds)));
        const pick={ds,pk:opts[0],ink:inkPref?ink[opts[0]]:0};
        if(!inkPref) return pick;
        if(!firstPick){ firstPick=pick;   // look up to INK_DAYS workdays further, never past the ideal day (print N workdays before due)
          winEnd=nextWorkday(ds,INK_DAYS); if(ideal) winEnd=ideal<=ds?ds:(ideal<winEnd?ideal:winEnd); }
        if(pick.ink>0 && (!best||pick.ink>best.ink)) best=pick; }
      return best||firstPick; };
    const put=(jobs,pick,late)=>{ const u=U(pick.pk,pick.ds);
      const tight=!late && ideal && pick.ds>ideal;
      jobs.slice().sort((a,b)=>LOCO(a.loc)-LOCO(b.loc)).forEach(j=>{   // back, sleeve, front, pocket — same order Scheduler used
        const eq=equipFor(j,pick.pk), len=jobMin(j,eq); const t=Math.ceil((u.end+(u.last?coL(pick.pk,u.last,j):0))/STEP)*STEP;

const INK_DAYS=2;   // v25: Suggest may pick a day up to 2 workdays after the first one with room, to join the same inks
// v25: within each press-day, order the suggested jobs as a chain (same product, then most shared inks), after the jobs already
// there (they never move). Hard Deadline / locked suggestions keep their time; if the new order would push one, or end later
// than before and past close, that day keeps Suggest's first order.
function inkPass(){
  const cells={}; S.ghosts.forEach(g=>{ const k=laneOf(g.equip)+'|'+g.day; (cells[k]=cells[k]||[]).push(g); });
  Object.keys(cells).forEach(key=>{ const [pk,ds]=key.split('|'); if(!(pk==='p1'||pk==='p2'||pk==='split')) return;
    const gs=cells[key].sort((a,b)=>a.min-b.min); if(gs.length<2) return;
    const real=cellItems(pk,ds).filter(x=>!x.ghost).sort((a,b)=>(a.min+a.len)-(b.min+b.len));
    const baseEnd=real.reduce((a,x)=>Math.max(a,x.min+x.len),DAY_START), prev=real.length?S.jobs[real[real.length-1].rid]:null;
    const rows=gs.map(g=>({g,j:S.jobs[g.rid],fixed:!!g.fixed}));
    const order=inkOrder(rows,prev); if(order.every((x,i)=>x===rows[i])) return;
    const oldEnd=gs.reduce((a,g)=>Math.max(a,g.min+jobMin(S.jobs[g.rid],g.equip)),0);
    let end=baseEnd, last=null; const t=[];
    for(const x of order){ let m=Math.ceil((end+(last?coL(pk,last,x.j):0))/STEP)*STEP;
      if(x.fixed){ if(m>x.g.min) return; m=x.g.min; }
      t.push(m); end=m+jobMin(x.j,x.g.equip); last=x.j; }
    if(end>Math.max(oldEnd,CFG.close+15)) return;
    order.forEach((x,i)=>{ x.g.min=t[i]; }); }); }

    render(); return; }
  if(!ds||isWeekend(ds)){ toast('Pick a weekday'); return; }
  if(!pk){ const ge=j.equip&&PBY[j.equip]?j.equip:guessEquip(j); if(!ge){ toast('Pick a press'); return; } pk=PBY[ge].k; }
  closeModal(); saveNotes();
  S.ghosts=S.ghosts.filter(g=>g.rid!==rid); delete S.why[rid];
  const p=PBY[pk], lk=p.lane; const curDay=day(j), curMin=startMin(j);
  if(tm===''){ if(pk===pressOf(j).k && ds===curDay) { render(); if(notes!==j.notes) toast('Notes saved'); return; }
    return moveJob(rid,lk,ds,null,p.name); }
  const min=+tm; if(pk===pressOf(j).k && ds===curDay && min===curMin){ render(); return; }
  const equip=p.name; const items=cellItems(lk,ds).filter(x=>x.rid!==rid&&!x.ghost);
  const idx=items.filter(x=>x.min<=min).length;
  // exact time picked: keep it, and only push later jobs that would overlap
  const ch=[{rid,equip,day:ds,min}].concat(pushLater(items,idx,min+jobMin(j,equip),ds));
  applyChanges(ch,moveLabel(rid,equip,ds,min)+(ch.length>1?' · '+(ch.length-1)+' after it moved later':'')); }

/* ---------------- modal, toast, settings ---------------- */
function showModal(title,body,foot){
  S.modal=true;
  document.getElementById('modalHost').innerHTML='<div class="p-scrim" onclick="if(event.target===this)closeModal()"><div class="p-modal" role="dialog" aria-modal="true" style="width:min(600px,100%)">'+
    '<div class="p-modal-h"><span class="p-h2">'+title+'</span><button class="p-modal-x" onclick="closeModal()" aria-label="Close">✕</button></div>'+
    '<div class="p-modal-b">'+body+'</div><div class="p-modal-f">'+foot+'</div></div></div>'; }
function closeModal(){ S.modal=false; S.modalRid=null; document.getElementById('modalHost').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(!document.getElementById('gear').hidden&&token()) closeGear(); else closeModal(); });
let toastT=null;
function toast(msg,btn,fn,alert){
  let t=document.getElementById('toast'); if(t) t.remove();
  t=document.createElement('div'); t.id='toast'; t.className='p-toast'+(alert?' is-alert':''); t.innerHTML='<span>'+esc(msg)+'</span>';
  if(btn){ const b=document.createElement('button'); b.className='p-btn'; b.textContent=btn; b.onclick=()=>{ t.remove(); fn(); }; t.appendChild(b); }
  document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),alert?9000:6000); }
function openSettings(){
  const fri=[['0','No Friday shift'],['1','Press 1 only'],['2','Both presses']].map(o=>'<button class="p-tab'+(String(CFG.fri)===o[0]?' is-on':'')+'" onclick="setFri('+o[0]+')">'+o[1]+'</button>').join('');
  const hrs=LANES.filter(p=>p.k!=='none'&&!p.opt).map(p=>'<label class="srow"><span>'+esc(p.short)+'</span><input class="p-input" type="number" inputmode="decimal" step="0.25" min="0" max="14" value="'+p.hours+'" data-k="'+p.k+'"></label>').join('');
  showModal('Shop settings',
    '<div class="p-label" style="margin-bottom:6px">Fridays</div><div class="p-tabs">'+fri+'</div>'+
    '<p class="p-hint">Off after this week. Turn it back on for busy season (2027: both presses).</p>'+
    '<div class="p-label" style="margin:14px 0 6px">Press time per day (setup + printing)</div><div style="display:grid;gap:6px" id="hrsBox">'+hrs+'</div>'+
    '<p class="p-hint">A full day on the floor is about 8.7 h. Of that, Press 1 averages 6.75 h of setup and printing and Press 2 6 h; the rest is loading, cleanup and breaks. 100% = a normal full day.</p>'+
    '<div class="p-label" style="margin:14px 0 6px">Impressions goal per day</div><div style="display:grid;gap:6px" id="goalBox">'+['p1','p2'].map(k=>'<label class="srow"><span>'+esc(LBY[k].short)+'</span><input class="p-input" type="number" inputmode="numeric" step="50" min="0" max="5000" value="'+goalOf(k)+'" data-k="'+k+'" aria-label="'+esc(LBY[k].short)+' impressions goal"></label>').join('')+'</div>'+
    '<p class="p-hint">Impressions = pieces × print locations. Defaults '+GOAL_DEF.p1.toLocaleString()+' / '+GOAL_DEF.p2.toLocaleString()+' = a good day (top quarter of full press days, last 120 days).</p>'+
    '<label class="srow">Suggest fills each day to<select class="p-select" id="sFill">'+[0.8,0.85,0.9,0.95,1].map(v=>'<option value="'+v+'"'+(Math.abs(v-CFG.fill)<.001?' selected':'')+'>'+Math.round(v*100)+'%</option>').join('')+'</select></label>'+
    '<label class="srow">Last job ends by<select class="p-select" id="sClose">'+[16*60,16*60+30,17*60,17*60+15,17*60+30,18*60].map(m=>'<option value="'+m+'"'+(m===CFG.close?' selected':'')+'>'+hm(m)+'</option>').join('')+'</select></label>'+
    '<div class="p-label" style="margin:14px 0 6px">Suggest</div>'+
    '<label class="srow">Print this many workdays before due<input class="p-input" type="number" inputmode="numeric" min="1" max="5" id="sBuf" value="'+CFG.idealBuffer+'"></label>'+
    '<p class="p-hint">Saved on this computer.</p>',
    '<button class="p-btn p-btn-main" onclick="saveSettings()">Save</button>'); }
function setFri(n){ CFG.fri=n; document.querySelectorAll('.p-modal .p-tabs .p-tab').forEach((b,i)=>b.classList.toggle('is-on',i===n)); }
function saveSettings(){
  document.querySelectorAll('#hrsBox input').forEach(i=>{ CFG.hours[i.dataset.k]=+i.value; LBY[i.dataset.k].hours=+i.value; });
  document.querySelectorAll('#goalBox input').forEach(i=>{ const v=Math.round(+i.value); if(v>=0&&i.value!=='') CFG.goal[i.dataset.k]=v; });   // v23
  CFG.idealBuffer=Math.max(1,+document.getElementById('sBuf').value||2); CFG.close=+document.getElementById('sClose').value||CFG.close; CFG.fill=+document.getElementById('sFill').value||0.9;
  const goalSave={}; Object.keys(CFG.goal).forEach(k=>{ if(CFG.goal[k]!==GOAL_DEF[k]) goalSave[k]=CFG.goal[k]; });
  writeLS(CFG_KEY,JSON.stringify(Object.assign({},CFG,{goal:goalSave}))); closeModal(); if(S.ghosts.length) suggest(); else render(); toast('Settings saved'); }
function toggleSide(open){ document.getElementById('side').classList.toggle('open',open); document.getElementById('scrimSide').classList.toggle('open',open); }
// v17: no token yet = the ⚙ menu opens with the token box (same as the other kit apps)
function renderTokenBox(){
  document.getElementById('cal').innerHTML='<div class="p-note" style="margin:20px;max-width:520px"><b>Airtable token needed.</b> Paste it in the &#9881; menu at the top right. It stays on this computer, like the other Pine apps.</div>';
  openGear(); const t=document.getElementById('tok'); if(t) t.focus(); }
function saveToken(){ const v=document.getElementById('tok').value.trim(); if(!v) return; writeLS('pine_at_key',v); closeGear(); load(); }
/* v17: ⚙ menu — Airtable token, practice on/off, and the shop settings pop-up */
function paintGear(){
  document.getElementById('gear').innerHTML=
    '<label class="p-menu-row"><span class="p-menu-label">Airtable token</span><span class="gear-line"><input class="p-input" id="tok" type="password" placeholder="pat…" autocomplete="off" value="'+esc(token())+'" onkeydown="if(event.key===\'Enter\')saveToken()"><button class="p-btn p-btn-dark" type="button" onclick="saveToken()">Save</button></span></label>'+
    '<div class="p-menu-row"><span class="p-menu-label">Practice</span><span class="gear-line"><span class="gear-txt">'+(PRACTICE?'<b>On.</b> Nothing is saved.':'<b>Off.</b> Changes save to Airtable.')+'</span><button class="p-btn" type="button" onclick="setPractice('+!PRACTICE+')">'+(PRACTICE?'Turn off':'Turn on')+'</button></span></div>'+
    '<div class="p-menu-row"><span class="p-menu-label">Shop</span><span class="gear-line"><span class="gear-txt">Fridays, press time, impressions goals, Suggest</span><button class="p-btn" type="button" onclick="closeGear();openSettings()">Settings</button></span></div>'; }
function openGear(){ paintGear(); document.getElementById('gear').hidden=false; document.getElementById('gearBtn').setAttribute('aria-expanded','true'); }
function closeGear(){ document.getElementById('gear').hidden=true; document.getElementById('gearBtn').setAttribute('aria-expanded','false'); }
function toggleGear(){ if(document.getElementById('gear').hidden) openGear(); else closeGear(); }
document.addEventListener('pointerdown',e=>{ if(!document.getElementById('gear').hidden && token() && !e.target.closest('#gear,#gearBtn')) closeGear(); });
async function setPractice(on){
  if(S.busy>0){ toast('Still saving the last change. One moment.'); return; }
  if(S.ghosts.length && !await PineConfirm.ask({title:(on?'Turn on':'Turn off')+' practice?', body:'The suggestion on screen will be cleared.', ok:on?'Turn on':'Turn off'})) return;
  const u=new URL(location.href); if(on) u.searchParams.set('practice','1'); else u.searchParams.delete('practice'); location.href=u.toString(); }

/* ---------------- start ---------------- */
window.pineBusy=()=>!!document.querySelector('[role=alertdialog]')||!!(S.drag&&S.drag.on)||S.modal||S.busy>0||S.ghosts.length>0||!document.getElementById('gear').hidden||!!document.getElementById('q').value.trim();   // v19: a search in progress counts
document.getElementById('practicePill').hidden=!PRACTICE;
goToday();
load();
setInterval(()=>{ if(!document.hidden && !window.pineBusy()) load(); },5*60*1000);
</script>
