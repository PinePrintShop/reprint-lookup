<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipedrive check — Pine</title>
<style>
:root{--bg:#F2F2EE;--line:#E6E6E0;--line2:#D4D4CC;--text:#141412;--muted:#80807A;--soft:#F7F7F4;--yellow:#E8E832;--ydk:#C9C92A;--red:#b3261e;--green:#1e6b45}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px Helvetica,Arial,sans-serif;padding:12px 16px 40px;max-width:900px;margin:0 auto}
.top{background:var(--text);border-radius:10px;padding:10px 18px;display:flex;gap:14px;align-items:center;color:#fff;font-weight:700}
.top b{color:var(--yellow);letter-spacing:2px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
input{height:42px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;font-size:15px;flex:1;min-width:220px}
button{height:42px;padding:0 16px;border:1px solid var(--ydk);background:var(--yellow);border-radius:8px;font-weight:700;cursor:pointer}
.hint{font-size:12px;color:var(--muted)}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.msg{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;background:var(--soft)}
.msg pre{white-space:pre-wrap;font:13px/1.45 Helvetica,Arial,sans-serif;margin-top:6px}
</style>
</head>
<body>
<div class="top"><b>PINE</b>Pipedrive check (worker v18)</div>
<div class="panel">
  <div id="tokRow" class="row" style="display:none"><input id="tok" placeholder="Airtable token (same one the other Pine apps use)"><button onclick="saveTok()">Save</button></div>
  <div class="row"><button onclick="me()">1 · Check the Pipedrive key</button><span id="meOut" class="hint">Reads only the key owner's name.</span></div>
  <div class="row"><input id="em" type="email" placeholder="Customer email, e.g. from an Airtable order"><button onclick="emails()">2 · Show their emails</button></div>
  <div class="hint" style="margin-top:6px">Read-only. Nothing in Pipedrive or Airtable changes.</div>
</div>
<div id="out"></div>
<script>
const W='https://pine-workers.stephen-dab.workers.dev/proxy/pipedrive';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=''; try{ TOKEN=localStorage.getItem('pine_at_key')||''; }catch(e){}
if(!TOKEN) $('tokRow').style.display='flex';
function saveTok(){ TOKEN=$('tok').value.trim(); try{ localStorage.setItem('pine_at_key',TOKEN); }catch(e){} $('tokRow').style.display='none'; }
async function call(path){ const r=await fetch(W+path,{headers:{Authorization:'Bearer '+TOKEN}}); let j; try{ j=await r.json(); }catch(e){ j={error:'Not JSON (HTTP '+r.status+'). Is v18 deployed?'}; } if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j; }
async function me(){ $('meOut').textContent='Checking…'; try{ const j=await call('/me'); $('meOut').innerHTML=`<span class="ok">✓ Connected as ${esc(j.user.name)}</span>`; }catch(e){ $('meOut').innerHTML=`<span class="bad">✗ ${esc(e.message)}</span>`; } }
async function emails(){ const em=$('em').value.trim(); if(!em) return; $('out').innerHTML='<div class="panel hint">Loading…</div>';
  try{ const j=await call('/emails?email='+encodeURIComponent(em));
    if(!j.person){ $('out').innerHTML=`<div class="panel"><span class="bad">No Pipedrive person with that exact email.</span></div>`; return; }
    $('out').innerHTML=`<div class="panel"><b>${esc(j.person.name)}</b> <span class="hint">Pipedrive person ${j.person.id}${j.cached?' · cached':''}</span>
      <div class="hint" style="margin-top:4px">Deals: ${j.deals.map(d=>esc(d.title)+' ('+esc(d.status)+')').join(' · ')||'none'}</div>
      ${j.mailError?`<div class="bad" style="margin-top:6px">${esc(j.mailError)}</div>`:''}
      ${j.messages.length?j.messages.map(m=>`<div class="msg"><b>${esc(m.subject||'(no subject)')}</b><div class="hint">${esc(m.from)} · ${esc(m.date)}</div><pre>${esc(m.text||m.snippet)}</pre></div>`).join(''):'<div class="hint" style="margin-top:8px">No synced emails for this person. Check email sync in Pipedrive for sales@.</div>'}</div>`;
  }catch(e){ $('out').innerHTML=`<div class="panel bad">✗ ${esc(e.message)}</div>`; } }
</script>
</body>
</html>
