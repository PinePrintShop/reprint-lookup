<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pine Purchasing Mockup</title>
<style>
/* ============================================================
   PINE PURCHASING — flow mockup (fake data, saves nothing)
   Left → right: Orders (by due date) → This order (sizes, extras,
   warehouse + arrival, split, cost) → Carts per warehouse → PO + Ordered.
   Plan: notes/purchasing-flow.md
   ============================================================ */
:root{
  --bg:#F2F2EE; --surface:#fff; --soft:#F8F8F5;
  --border:#E5E5E0; --border-dk:#D0D0CA;
  --green:#1e6b45; --green-lt:#e8f5ee; --green-dk:#144d31;
  --text:#0D0D0B; --muted:#888880; --muted-lt:#BBBBB5;
  --yellow:#E8E832;
  --red:#c0392b; --red-bg:#fdf2f2; --red-bd:#f5c6c6;
  --amb:#b7791f; --amb-bg:#fffbeb; --amb-bd:#fde68a;
  --ink:#0A0A08;
  --sans:Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.brand small{font-size:9px;color:var(--muted-lt);margin-left:6px;vertical-align:top}
.mock{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amb);background:var(--amb-bg);border:1px solid var(--amb-bd);padding:4px 9px;border-radius:20px}

.cols{flex:1;display:grid;grid-template-columns:270px minmax(0,1fr) 340px;min-height:0}
.col{overflow:auto;min-height:0}
.col h2{position:sticky;top:0;z-index:2;background:var(--bg);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 16px 8px;display:flex;align-items:center;gap:8px}
.col h2 .n{margin-left:auto;color:var(--text)}
.c-orders{border-right:1px solid var(--border)}
.c-carts{border-left:1px solid var(--border);background:#EDEDE8}
.c-carts h2{background:#EDEDE8}

/* ---- orders list ---- */
.duehdr{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 16px 4px}
.ord{display:block;width:100%;text-align:left;border:none;background:var(--surface);border-left:4px solid transparent;padding:10px 14px 10px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.ord:hover{background:var(--soft)}
.ord.on{border-left-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--border-dk)}
.ord.done{opacity:.55}
.ord .r1{display:flex;gap:6px;align-items:baseline}
.ord .num{font-weight:800}
.ord .cust{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .r2{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.ord .prog{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700}
.tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px;text-transform:uppercase;white-space:nowrap;border:1px solid var(--border)}
.tag.asap{background:var(--amb-bg);border-color:var(--amb-bd);color:var(--amb)}
.tag.hard{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.tag.ok{background:var(--green-lt);border-color:#bfe0cd;color:var(--green)}
.tag.cart{background:#fffbd6;border-color:#ecec7a;color:#6b6b00}
.tag.grey{color:var(--muted)}

/* ---- this order ---- */
.c-order{padding:0 20px 40px}
.c-order h2{padding-left:0;padding-right:0}
.ohead{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.ohead .cust{font-size:22px;font-weight:800;text-transform:uppercase}
.ohead .num{font-size:30px;font-weight:800;grid-row:span 2;align-self:center}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.facts b{color:var(--text)}
.facts .printd{color:var(--text);background:var(--yellow);padding:1px 6px;border-radius:3px;font-weight:800}
.notes{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.note{font-size:12px;background:var(--amb-bg);border:1px solid var(--amb-bd);border-radius:4px;padding:6px 8px}
.note b{color:var(--amb);text-transform:uppercase;font-size:10px;letter-spacing:.06em;margin-right:6px}

.line{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-top:12px}
.line.incart{border-color:#d9d96a}
.line.ordered{opacity:.7}
.lhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.lhead .g{font-weight:800;text-transform:uppercase}
.lhead .imp{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:2px 6px}
.lhead .st{margin-left:auto}
.flow{display:grid;grid-template-columns:auto minmax(230px,1fr) 190px;gap:0;align-items:stretch}
.stage{padding:12px 16px;border-right:1px solid var(--border)}
.stage:last-child{border-right:none}
.stage h4{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.stage h4 .k{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;font-size:9px}
table.sz{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sz th{font-size:10px;color:var(--muted);font-weight:700;padding:0 4px 4px;text-align:center}
table.sz td{padding:2px;text-align:center}
table.sz td.lbl{font-size:10px;font-weight:700;color:var(--muted);text-align:left;padding-right:6px;text-transform:uppercase}
table.sz .q{font-weight:800;font-size:15px;min-width:34px;display:inline-block}
table.sz input{width:38px;text-align:center;border:1px solid var(--border);border-radius:4px;padding:3px 0;font-size:12px}
table.sz input:not(:placeholder-shown){border-color:var(--green);color:var(--green);font-weight:700}
table.sz .xb{width:38px;height:28px;border:1px dashed var(--border-dk);border-radius:6px;background:#fff;color:var(--muted);font-weight:800;cursor:pointer}
table.sz .xb:hover{border-color:var(--green);color:var(--green)}
table.sz .xb.on{border:1px solid var(--green);background:var(--green-lt);color:var(--green)}
table.sz .xb:disabled{cursor:default}
table.sz .tot{font-weight:800;padding-left:8px}
.wh{display:flex;flex-direction:column;gap:6px}
.whopt{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:6px;padding:6px 9px;cursor:pointer;background:#fff;text-align:left;width:100%}
.whopt:hover{border-color:var(--border-dk)}
.whopt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.whopt>span:first-child{min-width:0}.whopt .nm{font-weight:700;font-size:13px;white-space:nowrap}
.whopt .tr{font-size:11px;color:var(--muted)}
.whopt .arr{margin-left:auto;font-size:11px;font-weight:800;white-space:nowrap}
.arr.ok{color:var(--green)}.arr.tight{color:var(--amb)}.arr.late{color:var(--red)}.arr.unk{color:var(--muted)}
.more{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:5px;background:#fff;width:100%}
.split{margin-top:10px;border-top:1px dashed var(--border-dk);padding-top:10px}
.split .sh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin-bottom:6px}
.linkbtn{background:none;border:none;color:var(--green);font-weight:700;font-size:12px;cursor:pointer;padding:0}
.linkbtn.red{color:var(--red)}
.cost label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:0 0 3px}
.cost input{width:74px;border:1px solid var(--border-dk);border-radius:4px;padding:6px 8px;font-size:14px;font-weight:700;text-align:right}
.cost .row{display:flex;gap:8px;margin-bottom:8px}
.cost .onfile{font-size:10px;color:var(--green);font-weight:700}
.go{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.btn{border:none;border-radius:6px;font-weight:800;padding:10px 14px;cursor:pointer;background:var(--ink);color:#fff;white-space:nowrap}
.btn.y{background:var(--yellow);color:var(--ink)}
.btn.g{background:var(--green);color:#fff}
.btn:disabled{background:var(--border);color:var(--muted-lt);cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border-dk)}
.hint{font-size:11px;color:var(--muted)}
.empty{padding:40px 16px;color:var(--muted);text-align:center}

/* ---- carts ---- */
.carts{padding:0 12px 30px;display:flex;flex-direction:column;gap:12px}
.cartc{background:#fff;border-radius:6px;border:1px solid var(--border);overflow:hidden}
.cartc .ch{background:var(--ink);color:#fff;padding:10px 12px;display:flex;align-items:baseline;gap:8px}
.cartc .ch .nm{font-weight:800;text-transform:uppercase;font-size:13px}
.cartc .ch .tr{font-size:11px;color:#bbb}
.cartc .ch .pcs{margin-left:auto;font-weight:800;color:var(--yellow)}
.citem{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px}
.citem .t{display:flex;gap:6px;align-items:baseline}
.citem .t b{font-size:12px}
.citem .t .x{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
.citem .s{color:var(--muted);margin-top:2px}
.citem .grid{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.citem .grid span{border:1px solid var(--border-dk);border-radius:4px;min-width:38px;text-align:center;padding:2px 4px;font-variant-numeric:tabular-nums}
.citem .grid span i{display:block;font-style:normal;font-size:9px;color:var(--muted);font-weight:700}
.citem .grid span b{font-size:13px}
.citem .open{display:inline-block;margin-top:6px;font-weight:800;color:var(--green);text-decoration:none;font-size:12px}
.cfoot{padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.cfoot .r{display:flex;gap:6px}
.cfoot input{flex:1;border:1px solid var(--border-dk);border-radius:6px;padding:8px;font-weight:700;min-width:0}
.done-list .cartc .ch{background:var(--green)}
.done-list .cartc .ch .pcs{color:#fff}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:20px;padding:3px;margin-left:12px}
.tab{border:none;background:none;padding:6px 14px;border-radius:16px;font-weight:800;font-size:12px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--ink);color:#fff}
.tab span:not(:empty){background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px}
.hidden{display:none!important}
.steps{margin-left:auto;display:flex;gap:6px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.steps span{padding:4px 8px}.steps b{color:var(--text)}
.invwrap{flex:1;overflow:auto;padding:16px 20px 40px}
.invtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.invtop h1{font-size:18px;text-transform:uppercase}
.invtop .sum{color:var(--muted);font-size:13px}
.invtop .sum b{color:var(--text)}
.seg{display:flex;gap:4px;margin-left:auto}
.seg button{border:1px solid var(--border-dk);background:#fff;border-radius:16px;padding:5px 12px;font-weight:700;font-size:12px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.po{background:#fff;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden}
.po.ok{border-color:#bfe0cd}.po.bad{border-color:var(--red-bd)}
.poh{display:grid;grid-template-columns:150px minmax(0,1fr) 120px 150px 170px 24px;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.poh .pon{font-weight:800;font-size:15px}
.poh .pon small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.poh .whn{font-weight:700}.poh .whn small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.poh .amt{text-align:right}.poh .amt small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}
.poh .amt b{font-size:16px;font-variant-numeric:tabular-nums}
.poh input{width:100%;border:1px solid var(--border-dk);border-radius:6px;padding:7px 8px;font-weight:800;text-align:right;font-size:15px}
.poh .chev{color:var(--muted)}
.stt{font-size:11px;font-weight:800;padding:4px 8px;border-radius:4px;text-align:center}
.stt.ok{background:var(--green-lt);color:var(--green)}.stt.bad{background:var(--red-bg);color:var(--red)}.stt.wait{background:var(--soft);color:var(--muted)}
.pol{border-top:1px solid var(--border);background:var(--soft)}
.pol table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.pol th{font-size:10px;color:var(--muted);text-transform:uppercase;text-align:left;padding:8px 14px 4px}
.pol td{padding:6px 14px;border-top:1px solid var(--border)}
.pol td.r,.pol th.r{text-align:right}
.pol tr.tot td{font-weight:800;background:#fff}
.pol .why{padding:10px 14px;font-size:12px;color:var(--red);border-top:1px solid var(--border);background:var(--red-bg)}
.thumb{width:44px;height:44px;border:1px solid var(--border-dk);border-radius:6px;overflow:hidden;background:#fff;padding:0;cursor:zoom-in;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lnotes{border-top:1px solid var(--border);padding:10px 16px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 14px;align-items:start;background:var(--soft)}
.nf label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amb);margin-bottom:3px}
.nf .sv{color:var(--green);text-transform:none;letter-spacing:0;font-weight:700;margin-left:4px}
.nf textarea{width:100%;border:1px solid var(--amb-bd);background:var(--amb-bg);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;resize:vertical}
.nf textarea:focus{outline:none;border-color:var(--amb);background:#fff}
.addnote{align-self:end;justify-self:start;font-size:12px;border:1px dashed var(--border-dk);border-radius:6px;padding:5px 8px;background:#fff;color:var(--muted)}
.issuebtn{border:1px solid var(--border-dk);background:var(--soft);color:var(--muted);font-weight:800;font-size:11px;border-radius:4px;padding:3px 8px;cursor:pointer}
.issuebtn:hover{border-color:var(--muted);color:var(--text)}
.iss-wrap{display:block!important;height:auto!important}
.pv-card:has(.iss-wrap){height:auto;width:min(680px,100%)}
.iss{padding:34px 28px 24px;max-width:640px}
.iss-r{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.iss-b{border:1px solid var(--border-dk);background:#fff;border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer}
.iss-b.on{background:var(--red);border-color:var(--red);color:#fff}
.iss textarea{width:100%;border:1px solid var(--border-dk);border-radius:6px;padding:8px;font:inherit}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border-dk);border-radius:6px;padding:6px;margin-bottom:10px;position:relative}
.who-c{background:var(--ink);color:#fff;border-radius:14px;padding:4px 6px 4px 10px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.who-c button{background:none;border:none;color:#bbb;font-size:15px;cursor:pointer;line-height:1}
.who-s{flex:1;min-width:160px;position:relative}
.who-s input{width:100%;border:none;outline:none;font:inherit;padding:4px}
.who-l{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid var(--border-dk);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.15);max-height:220px;overflow:auto;z-index:5}
.who-o{padding:8px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.who-o:hover,.who-o.hi{background:var(--soft)}
.who-o small{color:var(--muted)}.who-o.none{color:var(--muted);cursor:default}
.iss-prev{margin-top:12px;background:var(--soft);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:13px}
.iss-go{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.lp{display:inline-block;margin:3px 0 0 6px;font-size:11px;font-weight:800;border-radius:4px;padding:1px 6px}
.lp.same{background:var(--soft);color:var(--muted)}.lp.up{background:var(--red-bg);color:var(--red)}.lp.down{background:var(--green-lt);color:var(--green)}.lp.none{color:var(--muted-lt);font-weight:600;padding-left:0}
.pchg{font-size:11px;font-weight:800;border-radius:4px;padding:5px 7px;margin-top:2px}
.pchg.up{background:var(--red-bg);color:var(--red)}.pchg.down{background:var(--green-lt);color:var(--green)}
.frt{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frt label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.frt-in{display:inline-flex;align-items:center;gap:2px;font-weight:700;margin-left:auto}
.frt input{width:74px;border:1px solid var(--border-dk);border-radius:4px;padding:6px 8px;font-size:14px;font-weight:700;text-align:right}
.frt .sv{flex-basis:100%;text-align:right;font-size:10px;font-weight:700;color:var(--green)}
.frt .sv:empty{display:none}
.pv{position:fixed;inset:0;background:rgba(10,10,8,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.pv-card{background:#fff;border-radius:10px;width:min(1100px,100%);height:min(820px,100%);position:relative;overflow:hidden}
.pv-x{position:absolute;top:10px;right:12px;border:none;background:#fff;font-size:20px;cursor:pointer;z-index:2}
.pv-in{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100%}
.pv-pdf{background:#525659;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.pv-pdf img{max-width:100%;max-height:100%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.pv-side{padding:40px 20px 20px;display:flex;flex-direction:column}
.pv-k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pv-g{font-size:20px;font-weight:800;text-transform:uppercase;margin-top:4px}
.pv-color{margin-top:8px;font-size:15px}.pv-color b{background:var(--yellow);padding:1px 6px;border-radius:3px}
.pv-open{margin-top:auto;font-size:12px;color:var(--green);font-weight:700;text-decoration:none}
@media (max-width:800px){ .pv-in{grid-template-columns:1fr;grid-template-rows:60% 40%} }
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}

@media (max-width:1100px){
  .steps{display:none}
  .cols{grid-template-columns:1fr;overflow:auto}
  .col{overflow:visible}
  .c-orders,.c-carts{border:none}
  .flow{grid-template-columns:1fr}
  .stage{border-right:none;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>
<div class="top">
  <span class="brand">Pine Purchasing<small>flow mockup · v16</small></span>
  <span class="mock">🧪 Mockup — fake data, nothing saved</span>
  <span class="tabs"><button class="tab on" id="t-order" onclick="setTab('order')">Ordering</button><button class="tab" id="t-inv" onclick="setTab('inv')">Invoice check <span id="inv-badge"></span></button></span>
  <span class="steps"><span><b>1</b> Pick order</span>→<span><b>2</b> Sizes · extras</span>→<span><b>3</b> Warehouse</span>→<span><b>4</b> Cost</span>→<span><b>5</b> Cart</span>→<span><b>6</b> PO ✓</span></span>
</div>
<div class="cols">
  <div class="col c-orders"><h2>Orders <span class="n" id="o-n"></span></h2><div id="orders"></div></div>
  <div class="col c-order" id="order"></div>
  <div class="col c-carts"><h2>Carts <span class="n" id="c-n"></span></h2><div class="carts" id="carts"></div></div>
</div>
<div class="invwrap hidden" id="inv"></div>
<div class="pv hidden" id="pv" onclick="if(event.target===this)closeProof()"><div class="pv-card"><button class="pv-x" onclick="closeProof()">✕</button><div class="pv-in" id="pv-body"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- fake data (shaped like the [MGR] Apparel RFO view) ---------- */
var TODAY = new Date(2026,9,1);   // Thu Oct 1 2026, fixed so the demo reads the same every time
var SIZES = ['XS','S','M','L','XL','2XL','3XL','OSFA'];

/* the cheapest live price across vendors that carry it, vs what Airtable has on file */
function priceUp(l){ var f=onFile(l)[0], v=LIVE[l.id]||{}, up=null;
  Object.keys(v).forEach(function(k){ if(v[k][0]>f+0.004 && (!up||v[k][0]<up.c1)) up={vendor:k,c1:v[k][0]}; });
  var any=Object.keys(v).some(function(k){ return v[k][0]<=f+0.004; });

function allocQty(l){
  var st=S[l.id], w=want(l), rest=Object.assign({},w), res=[];
  st.allocs.forEach(function(a,i){ if(i===0) return; var q={}; for(var k in a.q){ var n=Math.min(+a.q[k]||0, rest[k]||0); if(n){ q[k]=n; rest[k]-=n; } } res[i]=q; });
  res[0]=rest; return res;

function arrival(w,o){

  var cls = a>=pr ? 'late' : gap<=1 ? 'tight' : 'ok';
  return {cls:cls, date:a, txt:'arrives '+fmtD(a)+(cls==='late'?' · after print day':cls==='tight'?' · tight':'')};

/* Inbound Freight -> Line Items fldi2RmXxYgckvHfd (currency). Editable even after ordering:
   freight usually shows up later on the vendor invoice. Blank clears the field. */
function saveFreight(id,inp){
  var raw=inp.value.replace(/[$,\s]/g,''); if(raw===inp.dataset.was.replace(/[$,\s]/g,'')) return;
  var v=raw===''?null:Math.round(parseFloat(raw)*100)/100;
  if(raw!=='' && !(v>=0)){ alert('Freight must be a dollar amount.'); inp.value=inp.dataset.was; return; }
  S[id].freight=v; S[id].freightSaved=true; inp.value=v==null?'':v.toFixed(2);
  console.log('PATCH Line Items/'+id, JSON.stringify({fields:{fldi2RmXxYgckvHfd:v}}));
  var sv=$('frt-sv-'+id); if(sv) sv.textContent='✓ saved';
  renderInv(); toast('Inbound freight saved (mockup — not really)');

    +'<span class="seg"><button class="'+(INV_FILTER==='need'?'on':'')+'" onclick="INV_FILTER=\'need\';renderInv()">To check ('+need+')</button><button class="'+(INV_FILTER==='all'?'on':'')+'" onclick="INV_FILTER=\'all\';renderInv()">All POs</button></span></div>'
    +'<p class="hint" style="margin-bottom:12px">POs are the order date (MMDDYY), so each row is one PO at one warehouse. Type the total from that vendor\'s invoice. Within 50¢ counts as a match. Tap a PO to see its lines.</p>';
  if(!list.length) h+='<div class="empty">Every PO matches its invoice. 🎉</div>';
  list.forEach(function(p){
    var w=whById(p.wh), t=poTotal(p), stt=poState(p), diff=(+p.inv)-t;
    var chip= stt==='wait'?'<span class="stt wait">Not checked</span>' : stt==='ok'?'<span class="stt ok">✓ Matches</span>' : '<span class="stt bad">Invoice '+(diff>0?'+':'−')+money(Math.abs(diff))+'</span>';
    var pcs=0; p.lines.forEach(function(x){pcs+=x.pcs;});
    h+='<div class="po '+stt+'"><div class="poh" onclick="if(event.target.tagName!==\'INPUT\'){OPEN_PO[\''+poKey(p)+'\']=!OPEN_PO[\''+poKey(p)+'\'];renderInv();}">'
      +'<span class="pon">'+esc(p.po)+'<small>'+fmtD(p.date)+'</small></span>'
      +'<span class="whn">'+esc(shortWh(w))+'<small>'+p.lines.length+' line'+(p.lines.length>1?'s':'')+' · '+pcs+' pcs · orders '+p.lines.map(function(x){return x.order;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(', ')+'</small></span>'
      +'<span class="amt"><small>Airtable</small><b>'+money(t)+'</b></span>'
      +'<span><input inputmode="decimal" placeholder="Vendor invoice $" value="'+esc(p.inv)+'" onchange="setInv(\''+poKey(p)+'\',this.value)"></span>'
      +chip+'<span class="chev">'+(OPEN_PO[poKey(p)]?'▾':'▸')+'</span></div>';
    if(OPEN_PO[poKey(p)]){
      h+='<div class="pol"><table><tr><th>Order</th><th>Garment</th><th>Sizes (incl. extras)</th><th class="r">Pcs</th><th class="r">Each</th><th class="r">Line</th></tr>'
        +p.lines.map(function(x){ return '<tr><td>'+x.order+' '+esc(x.cust)+'</td><td>'+esc(x.g)+'</td><td>'+qtxt(x.q)+'</td><td class="r">'+x.pcs+'</td><td class="r">'+money(x.c1)+(x.c2!==x.c1&&Object.keys(x.q).some(function(k){return /^[2-6]XL$/.test(k);})?' / 2XL+ '+money(x.c2):'')+'</td><td class="r">'+money(x.amt)+'</td></tr>'; }).join('')
        +'<tr><td colspan="5">Inbound freight</td><td class="r">'+money(poFreight(p))+'</td></tr>'
        +'<tr class="tot"><td colspan="5">Airtable total</td><td class="r">'+money(t)+'</td></tr></table>'
        +(stt==='bad'?'<div class="why">'+(p.why||('Off by '+money(Math.abs(diff))+'. Check for a price change, freight or a fee not entered, or a short ship.'))+' Fix the cost or freight on the line in the Ordering tab.</div>':'')+'</div>';
    }
    h+='</div>';
  });
  h+='<div class="invtop" style="margin-top:28px"><h1>Price changes</h1><span class="sum">What he paid vs Airtable when ordering. Increases update the garment\'s cost; decreases are only noted.</span></div>';
  if(!PRICE_LOG.length) h+='<div class="hint">None yet — they show up here when a cart is marked ordered at a different price.</div>';
  else h+='<div class="po"><div class="pol" style="border-top:none"><table><tr><th>Date</th><th>Garment</th><th>Vendor</th><th class="r">Was</th><th class="r">Paid</th><th class="r">Change</th><th>Airtable</th><th>PO · order</th></tr>'
    +PRICE_LOG.map(function(e){ return '<tr><td>'+fmtD(e.date)+'</td><td>'+esc(e.g)+'</td><td>'+esc(e.wh)+'</td><td class="r">'+money(e.old)+'</td><td class="r">'+money(e.paid)+'</td>'
      +'<td class="r" style="font-weight:800;color:var('+(e.d>0?'--red':'--green')+')">'+(e.d>0?'+':'−')+money(Math.abs(e.d))+'</td><td>'+(e.updated?'✓ cost raised':'noted only')+'</td><td>'+esc(e.po)+' · '+e.order+'</td></tr>'; }).join('')+'</table></div></div>';
  $('inv').innerHTML=h;
  if(focusPo){ /* keep the page steady after typing */ }
}
CUR=ORDERS.slice().sort(function(a,b){return a.due.localeCompare(b.due);})[0].num;
renderAll();
</script>
</body>
