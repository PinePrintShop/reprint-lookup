    var rec = findRec(impRecId);
    if (rec) rec.fields[F.inks] = inkIds.slice();
    endSave(impRecId, true);
    // v76: refresh the chip strip on the collapsed card so add/remove/reorder shows live
    refreshCardInkStrip(impRecId);
    return res;
  }).catch(function(err) {
    endSave(impRecId, false, err.message);
    throw err;
  });
}

// v76: rebuild only the swatches/tags (v95: and the numbers) of a job's card(s) in place, without
// re-rendering the card, which would tear down the open job below it. v95: a job can show twice
// (list card + right pane), so every [data-head=id] is refreshed.
function refreshCardInkStrip(impRecId) {
  var rec = findRec(impRecId);
  if (!rec) return;
  var heads = document.querySelectorAll('[data-head="' + impRecId + '"]');
  for (var i = 0; i < heads.length; i++) {
    var mode = heads[i].getAttribute('data-mode') || 'list';
    var rb = heads[i].querySelector('.ready-btn');
    if (rb) rb.outerHTML = readyBtnHtml(rec, mode === 'detail' || (mode === 'inplace' && openDetailId === impRecId));
    var tags = heads[i].querySelector('.p-lc-tags');
    if (tags) tags.innerHTML = cardTagsHtml(rec, mode);
    var nums = heads[i].querySelector('.p-lc-nums');
    if (nums) nums.innerHTML = cardNumsHtml(rec, mode);
    var lc = heads[i].closest('.p-lc');
    if (lc) lc.classList.toggle('no-ink', !inkIdsOf(rec).length);
  }
}
var refreshCardInkTypeTags = refreshCardInkStrip;   // v95: one place builds the tags row
function refreshCardsLinkingInk(inkRecId) {
  var recs = allRecs();
  for (var i = 0; i < recs.length; i++) {
    var arr = recs[i].fields[F.inks] || [];
    for (var j = 0; j < arr.length; j++) {
      var id = (typeof arr[j] === 'string') ? arr[j] : (arr[j] && arr[j].id) || '';
      if (id === inkRecId) {
        refreshCardInkStrip(recs[i].id);
        break;
      }
    }
  }
}

// PATCH a single imprint field (Print Notes, Inks Ready, Ink Type, etc.)
function patchImprintField(impRecId, fieldId, value) {
  if (!WRITES_ENABLED) {
    console.log('[v83 PREVIEW] would PATCH imprint', impRecId, fieldId, '=', JSON.stringify(value));
    endSave(impRecId, true);
    return Promise.resolve(null);
  }
  beginSave(impRecId);
  var payload = {}; payload[fieldId] = value;
  return api(TI + '/' + impRecId + '?returnFieldsByFieldId=true', {
    method: 'PATCH',
    body: JSON.stringify({ fields: payload })
  }).then(function(res) {
    var rec = findRec(impRecId);
    if (rec) rec.fields[fieldId] = value;
    endSave(impRecId, true);
    return res;
  }).catch(function(err) {
    endSave(impRecId, false, err.message);
    throw err;
  });
}

// ---------- Name parse helper ----------
// "Pantone 186 - OW" => { pantone:'186', type:'OW' }
// "EZP WHT" => { pantone:'EZP WHT', type:null }  (no Pantone prefix, no dash)
// Returns null if shape resembles "Pantone X - Y" but type isn't a valid choice.
function parseInkName(name) {
  if (!name) return { pantone:'', type:null };
  var s = String(name).trim();
  // Canonical "Pantone X - Y"
  var m = s.match(/^Pantone\s+(.+?)\s+-\s+(.+)$/i);
  if (m) {
    var pn = m[1].trim();
    var t = m[2].trim();
    // Case-insensitive match to a valid choice; return the canonical-cased value
    var canon = null;
    for (var i = 0; i < INK_TYPE_CHOICES.length; i++) {
      if (INK_TYPE_CHOICES[i].toLowerCase() === t.toLowerCase()) { canon = INK_TYPE_CHOICES[i]; break; }
    }
    if (canon === null) return null; // invalid type — reject
    return { pantone: pn, type: canon };
  }
  // Free-form (no "Pantone " prefix or no " - " divider) — treat entire string as Pantone Number
  // and leave Ink Type alone. Covers bases like "EZP WHT", "1/2 BB", "FULL BB" etc.
  return { pantone: s, type: null };
}

function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }

// v88: business days (Mon-Fri) from today (exclusive) to the print date (inclusive).
// Fri viewing a Mon print returns 1 (only Mon counts) — weekend never lulls the dept.
// 0 = prints today, -1 = past, null = no/invalid date.
function bizDaysUntil(dateKey) {
  if (!dateKey) return null;
  var target = new Date(dateKey + 'T12:00:00');
  if (isNaN(target.getTime())) return null;
  var now = new Date();
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var t = new Date(target.getFullYear(), target.getMonth(), target.getDate());
  if (t <= d) return t < d ? -1 : 0;
  var count = 0, walk = new Date(d);
  while (walk < t) {
    walk.setDate(walk.getDate() + 1);
    var dow = walk.getDay();
    if (dow !== 0 && dow !== 6) count++;
  }
  return count;
}

// v88: working-day countdown for a print-date day-group. Goal = ready by ~4 working days out (green).
// sc drives header underline + pill color: today(black) / d1(red) / d2(amber) / d3(yellow) / d4(green) / none.
function printCountdown(dateKey) {
  var wd = bizDaysUntil(dateKey);
  if (wd === null) return { wd: null, sc: 'none', label: 'No date set' };
  if (wd <= 0) return { wd: 0, sc: 'today', label: 'Prints today' };
  if (wd === 1) return { wd: 1, sc: 'd1', label: 'Prints in 1 work day' };
  if (wd === 2) return { wd: 2, sc: 'd2', label: 'Prints in 2 work days' };
  if (wd === 3) return { wd: 3, sc: 'd3', label: 'Prints in 3 work days' };
  return { wd: wd, sc: 'd4', label: 'Prints in ' + wd + ' work days' };
}

// v91: order-status gate. Ink work appears only once the order hits "Ordered - In Production"
// (per Stephen). Whitelist of production + delay statuses; everything before (art/proof/payment)
// and after (caught/shipped/completed/cancelled) is excluded — app-wide.
var INK_ACTIVE_STATUS = {
  'ordered - in production': 1,
  'pre-press': 1,
  'scheduled, screened, & inbound': 1,
  'received & staged': 1,
  'on-press': 1,
  'delayed - mis-shipment - needs order': 1,
  'delayed - mis-print': 1,
  'delayed - mis-print - needs order': 1
};
// Read the Order Status lookup (mirrors getOrderNum's both-shapes handling).
function orderStatusOf(fields) {
  var v = fields[F.orderStatus];
  if (!v) return '';
  if (v.valuesByLinkedRecordId) {
    var vals = Object.values(v.valuesByLinkedRecordId);
    if (vals.length && vals[0] && vals[0].length) return String(vals[0][0]);
  }
  if (Array.isArray(v) && v.length) return String(v[0]);
  if (typeof v === 'string') return v;
  return '';
}
function isActiveInkStatus(fields) {
  var s = orderStatusOf(fields).trim().toLowerCase();
  return !!INK_ACTIVE_STATUS[s];
}

// v88.1: true if this imprint's method is a non-ink type (embroidery, supacolor, decopress,
// patch/label application, finishing). Reliable even when Equipment/press is blank.
function isSkippedType(fields) {
  var v = fields[F.printMethod];
  var s = (typeof v === 'object' ? (v && v.name ? v.name : '') : (v || '')).toLowerCase();
  if (!s) return false;
  return SKIP_TYPE.some(function(k) { return s.indexOf(k) >= 0; });
}
function toDateKey(d) { return d.toLocaleDateString('en-CA', { timeZone: 'America/Denver' }); }
function fmtTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/Denver' })
    .replace(/\s*AM$/i, ' am').replace(/\s*PM$/i, ' pm');
}
function getOrderNum(fields) {
  var v = fields[F.orderNum];
  if (v) {
    if (v.valuesByLinkedRecordId) {
      var vals = Object.values(v.valuesByLinkedRecordId);
      if (vals.length && vals[0] && vals[0].length) return String(vals[0][0]);
    }
    if (Array.isArray(v) && v.length) return String(v[0]);
    if (typeof v === 'number' || typeof v === 'string') return String(v);
  }
  // Fall back: parse order number from imprint ID (e.g. "9733-A" -> "9733")
  var imp = fields[F.imprintId] || '';
  var m = imp.match(/^(\d+)/);
  return m ? m[1] : '';
}
function getProofs(fields) {
  // v72: returns ALL proof attachments rather than just the first.
  // Many imprints link multiple Line Items, each with its own proof image — Ink Dept
  // needs to see all colorway proofs, not just the first one.
  var raw = fields[F.proofs];
  if (!raw) return [];
  var out = [];
  if (raw.valuesByLinkedRecordId) {
    Object.values(raw.valuesByLinkedRecordId).forEach(function(arr) {
      if (Array.isArray(arr)) arr.forEach(function(a) {
        if (a && a.url) out.push(a);
      });
    });
  } else if (Array.isArray(raw)) {
    raw.forEach(function(a) { if (a && a.url) out.push(a); });
  }
  // Dedupe by URL (lookup field can duplicate the same proof across multiple LIs)
  var seen = {}; var deduped = [];
  out.forEach(function(a) { if (!seen[a.url]) { seen[a.url] = true; deduped.push(a); } });
  return deduped.map(function(att) {
    return {
      url: att.url,
      thumb: (att.thumbnails && att.thumbnails.large && att.thumbnails.large.url) || null,
      full: (att.thumbnails && att.thumbnails.full && att.thumbnails.full.url) || null,   // v96: the big proof in the open job
      filename: att.filename || '',
      isPDF: att.type === 'application/pdf'
    };
  });
}

// Back-compat wrapper — returns the first proof, or null. Used by card thumbnails.
function getProof(fields) {
  var all = getProofs(fields);
  return all.length ? all[0] : null;
}

// v78: per-card state for the inline proof switcher (left/right arrows on detail-panel thumb)
var detailProofs = {};   // detailProofs[impRecId] = array of proofs as returned by getProofs
var detailProofIdx = {}; // detailProofIdx[impRecId] = current index in the proofs array

// Cycle the inline thumbnail by +1 or -1 with wrap-around. Updates both the <img src>
// and the counter overlay.
function cycleDetailProof(impRecId, delta) {
  var proofs = detailProofs[impRecId];
  if (!proofs || proofs.length < 2) return;
  var cur = detailProofIdx[impRecId] || 0;
  var nxt = (cur + delta + proofs.length) % proofs.length;
  detailProofIdx[impRecId] = nxt;
  var p = proofs[nxt];
  var img = document.getElementById('proof-img-' + impRecId);
  if (img && p && (p.full || p.thumb)) { img.style.display = ''; img.src = p.full || p.thumb; }
  var counter = document.getElementById('proof-counter-' + impRecId);
  if (counter) counter.textContent = (nxt + 1) + ' / ' + proofs.length;
  var fn = document.getElementById('proof-fn-' + impRecId);   // v96
  if (fn && p) fn.textContent = p.filename || '';
}
function getLoc(fields) {
  var v = fields[F.loc];
  if (!v) return '';
  return typeof v === 'object' ? (v.name || '') : v;
}
function getQty(fields) {
  var v = fields[F.qty];
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  if (v.valuesByLinkedRecordId) {
    var vals = Object.values(v.valuesByLinkedRecordId);
    return vals.length && vals[0] && vals[0].length ? (vals[0][0] || 0) : 0;
  }
  if (Array.isArray(v)) return v[0] || 0;
  return 0;
}

// LOAD
function loadJobs() {
  // v95: the first load shows a loading line; a Refresh keeps the screen (and the open job) until new data is in
  if (!loadedOnce) $('root').innerHTML = '<div class="msg"><b><span class="spin"></span>Loading the ink queue\u2026</b></div>';
  else toast('Refreshing\u2026', { ms: 1500 });
  inkCache = {};   // v95: Refresh re-reads ink names/colors too (v94 kept the first ones until a reload)

  var flds = [F.imprintId, F.orderNum, F.startTime, F.loc, F.inks, F.inkNames,
    F.inkType, F.inksReady, F.isRepeat, F.prevImprint, F.printNotes,
    F.proofs, F.qty, F.customer, F.printDesc, F.press, F.screens, F.printMethod, F.orderStatus, F.lineItems
  ];
  if (F.inkNotes) flds.push(F.inkNotes); // v76: only if field ID has been configured
  flds = flds.map(function(f) { return 'fields%5B%5D=' + f; }).join('&');

  var filter = encodeURIComponent(
    "AND(IS_AFTER({fldfqtIgcEfIlIeQk},DATEADD(TODAY(),-6,'days')),IS_BEFORE({fldfqtIgcEfIlIeQk},DATEADD(TODAY()," + (DAYS_AHEAD + 1) + ",'days')))"
  );
  var sort = 'sort%5B0%5D%5Bfield%5D=fldfqtIgcEfIlIeQk&sort%5B0%5D%5Bdirection%5D=asc';

  var records = [];
  function fetchPage(cursor) {
    var url = TI + '?returnFieldsByFieldId=true&' + flds + '&filterByFormula=' + filter + '&' + sort + (cursor ? '&offset=' + cursor : '');
    api(url).then(function(data) {
      records = records.concat(data.records || []);
      if (data.offset) { fetchPage(data.offset); return; }
      // v91: gate to active order statuses (Ordered - In Production onward). Grouping, Completed,
      // and stat counts all read allJobs, so filtering here applies the gate everywhere at once.
      allJobs = records.filter(function(r) { return isActiveInkStatus(r.fields); });
      // v76: pre-load all referenced ink records so the card chip strip can render
      // with real Pantone names + colors instead of opaque IDs.
      preloadInksForJobs(allJobs).then(function() {
        // v95: after a Refresh the open job is rebuilt from the new data
        var sd = $('splitDetail'); if (sd) sd.setAttribute('data-id', '');
        var od = openDetailId ? $('detail-' + openDetailId) : null; if (od) od.innerHTML = '';
        loadedOnce = true;
        renderAll(); loadPipeline();
      });
    }).catch(function(e) {
      if (loadedOnce) toast('Could not refresh: ' + e.message, { alert: true });
      else $('root').innerHTML = '<div class="msg err"><b>Could not load the ink queue</b>' + escHtml(e.message) + '<br>Check the token in the &#9881; menu, then tap Refresh.</div>';
    });
  }
  fetchPage(null);
}

// v88: second, bounded fetch — not-ready + UNSCHEDULED ink work ("pipeline"). Lets the dept
// pull ahead when caught up. Server filter: Inks Ready FALSE and no Scheduled Start Time.
// Sorted by autoNumber DESC (newest imprints first) + maxRecords cap, so the group can never
// balloon with ancient junk regardless of total undated history. Terminal order statuses
// (Completed/Shipped/Cancelled) filtered client-side. Display-only; soft-fails silently.
var PIPELINE_MAX = 120;      // hard cap on records fetched (newest-first)
var PIPELINE_RENDER_CAP = 60; // cap on cards rendered in the group
var COMPLETED_CLEAR_DAYS = 5; // v90: ready jobs drop from "Completed" 5 days after their print date
var COMPLETED_RENDER_CAP = 80;
var RUNWAY_BENCHMARK = 4;    // v92: working-days-to-print benchmark. >4 green, =4 amber, <4 red.
function loadPipeline() {
  var flds = [F.imprintId, F.orderNum, F.loc, F.inks, F.inkNames, F.inkType, F.inksReady,
    F.isRepeat, F.prevImprint, F.printNotes, F.proofs, F.qty, F.customer, F.printDesc,
    F.press, F.screens, F.startTime, F.orderStatus, F.printMethod, F.lineItems];
  if (F.inkNotes) flds.push(F.inkNotes);
  flds = flds.map(function(f) { return 'fields%5B%5D=' + f; }).join('&');
  var filter = encodeURIComponent("AND({fld2a1CPcDMSD26PS}=FALSE(),{fldfqtIgcEfIlIeQk}=BLANK())");
  // Sort newest-first by the Imprints autoNumber so the cap keeps recent, not random, records.
  var sort = 'sort%5B0%5D%5Bfield%5D=fldroZJQgkjQYlI1O&sort%5B0%5D%5Bdirection%5D=desc';
  var url = TI + '?returnFieldsByFieldId=true&' + flds + '&filterByFormula=' + filter +
    '&' + sort + '&maxRecords=' + PIPELINE_MAX + '&pageSize=100';
  api(url).then(function(data) {
    var recs = (data.records || []).filter(function(r) {
      if (isSkippedType(r.fields)) return false;   // v88.1: drop embroidery/supacolor/etc by Imprint Type
      var locVal = getLoc(r.fields).toLowerCase();
      if (locVal === 'size tag') return false;
      var pressVal = r.fields[F.press];
      var pressStr = typeof pressVal === 'object' ? (pressVal && pressVal.name ? pressVal.name : '') : (pressVal || '');
      var pressLow = pressStr.toLowerCase();
      if (pressLow && SKIP_PRESS.some(function(s) { return pressLow.indexOf(s) >= 0; })) return false;
      // v91: whitelist active order statuses (Ordered - In Production onward) — replaces old terminal-only exclude
      if (!isActiveInkStatus(r.fields)) return false;
      return true;
    });
    pipelineJobs = recs;
    preloadInksForJobs(recs).then(function() { renderAll(); });
  }).catch(function(err) {
    console.warn('Pipeline fetch failed (group hidden)', err);
    pipelineJobs = [];
  });
}


function preloadInksForJobs(jobs) {
  var allInkIds = {};
  for (var i = 0; i < jobs.length; i++) {
    var arr = jobs[i].fields[F.inks] || [];
    for (var j = 0; j < arr.length; j++) {
      var id = (typeof arr[j] === 'string') ? arr[j] : (arr[j] && arr[j].id) || '';
      if (id && /^rec[A-Za-z0-9]{14}$/.test(id) && !inkCache[id]) allInkIds[id] = true;
    }
  }
  var ids = Object.keys(allInkIds);
  if (!ids.length) return Promise.resolve();

  // Airtable filterByFormula has a length limit; batch in chunks of 50 ink IDs.
  var batches = [];
  for (var k = 0; k < ids.length; k += 50) batches.push(ids.slice(k, k + 50));

  return Promise.all(batches.map(function(batch) {
    var filter = 'OR(' + batch.map(function(id) { return "RECORD_ID()='" + id + "'"; }).join(',') + ')';
    var url = 'tblyPBucKoDwxDisT?returnFieldsByFieldId=true&filterByFormula=' + encodeURIComponent(filter) + '&pageSize=100';
    return api(url).then(function(data) {
      (data.records || []).forEach(function(r) {
        inkCache[r.id] = r.fields;
        inkCache[r.id]._createdTime = r.createdTime;
      });
    }).catch(function(err) {
      console.warn('Ink preload batch failed', err);
    });
  }));
}

// ============================================================
// v95 LIST — one filter row (search + chips), page heads per group, kit list cards.
// Group membership is unchanged from v94: On press today (all of today's ink jobs) · upcoming
// days (not ready) · No date (pipeline, not ready) · Completed (ready, last 5 days, All only).
// ============================================================
var FILTERS = [['all', 'All'], ['noink', 'No inks'], ['repeat', 'Reorders'], ['nodate', 'No date']];

function pressStrOf(f) {
  var pv = f[F.press];
  return typeof pv === 'object' ? (pv && pv.name ? pv.name : '') : (pv || '');
}
function inkIdsOf(rec) {
  return (rec.fields[F.inks] || []).map(function(x) { return typeof x === 'string' ? x : (x && x.id) || ''; }).filter(Boolean);
}
// ink-using work: same skips as v94 (non-ink Imprint Types, non-ink presses, Size Tag location)
function isInkWork(f) {
  if (isSkippedType(f)) return false;
  var pressLow = pressStrOf(f).toLowerCase();
  if (pressLow && SKIP_PRESS.some(function(s) { return pressLow.indexOf(s) >= 0; })) return false;
  if (getLoc(f).toLowerCase() === 'size tag') return false;
  return true;
}
function passesFilter(r, filter) {
  var f = r.fields;
  if (filter === 'noink' && (f[F.inks] || []).length > 0) return false;
  if (filter === 'repeat' && !f[F.isRepeat]) return false;
  return true;
}
function passesSearch(r) {
  var q = searchQ.trim().toLowerCase();
  if (!q) return true;
  var f = r.fields;
  var hay = [f[F.customer] || '', getOrderNum(f), f[F.imprintId] || '', f[F.printDesc] || '', getLoc(f), pressStrOf(f)].join(' ').toLowerCase();
  return q.split(/\s+/).every(function(t) { return hay.indexOf(t.replace(/^#/, '')) >= 0; });
}

// The four sets the page is built from (before filter/search).
function queueSets() {
  var today = toDateKey(new Date());
  var s = { today: today, onpress: [], upcoming: [], pipeline: [], completed: [] };
  var cutoff = new Date(); cutoff.setHours(0, 0, 0, 0);
  for (var i = 0; i < allJobs.length; i++) {
    var r = allJobs[i], f = r.fields, st = f[F.startTime];
    if (!st) continue;
    var dk = toDateKey(new Date(st));
    if (f[F.inksReady]) {
      // v90 Completed: ready, ink type, printed within the last COMPLETED_CLEAR_DAYS (or future); today lives in On press
      if (isSkippedType(f)) continue;
      var pd = new Date(dk + 'T12:00:00');
      if (isNaN(pd.getTime())) continue;
      var daysPast = Math.round((cutoff.getTime() - pd.getTime()) / 86400000);
      if (dk !== today && daysPast <= COMPLETED_CLEAR_DAYS) s.completed.push(r);
    }
    if (!isInkWork(f)) continue;
    if (dk === today) { s.onpress.push(r); continue; }        // v94: ready and not ready
    if (dk > today && !f[F.inksReady]) s.upcoming.push(r);    // v88: queue = not ready only
  }
  s.pipeline = pipelineJobs.filter(function(r) { return !r.fields[F.inksReady]; });
  s.completed.sort(function(a, b) {
    var sa = a.fields[F.startTime] || '', sb = b.fields[F.startTime] || '';
    return sa < sb ? 1 : (sa > sb ? -1 : 0);   // most recent print first
  });
  return s;
}
// v95: chip counts = the jobs that still need ink under each chip (v94's All count included past and non-ink jobs)
function chipCounts(s) {
  var need = s.onpress.filter(function(r) { return !r.fields[F.inksReady]; }).concat(s.upcoming, s.pipeline);
  return {
    all: need.length,
    noink: need.filter(function(r) { return passesFilter(r, 'noink'); }).length,
    repeat: need.filter(function(r) { return passesFilter(r, 'repeat'); }).length,
    nodate: s.pipeline.length
  };
}
function renderChips(counts) {
  var el = $('chips'); if (!el) return;
  el.innerHTML = FILTERS.map(function(x) {
    var on = activeFilter === x[0], n = counts ? counts[x[0]] : '';
    return '<button type="button" class="p-tab' + (on ? ' is-on' : '') + (counts && !n ? ' zero' : '') + '" role="tab" aria-selected="' + on + '" onclick="setFilter(\'' + x[0] + '\')">' +
      x[1] + ' <span class="p-count">' + n + '</span></button>';
  }).join('');
}

function setFilter(f) {
  activeFilter = f;
  renderAll();
  if (!isWide()) window.scrollTo(0, 0);
}
var searchTimer = null;
function onSearch(v) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() { searchQ = v || ''; renderAll(); }, 120);
}

// v92: "Tightest runway" — the smallest working-days-to-print among NOT-ready scheduled ink jobs.
// Ignores the filter (global gauge). v95: shown in the first page head; >4 done (black), =4 yellow, <4 red.
function runwayHtml(counts) {
  var today = toDateKey(new Date());
  var min = null, minRec = null;
  for (var i = 0; i < allJobs.length; i++) {
    var r = allJobs[i], f = r.fields;
    if (f[F.inksReady]) continue;
    if (!isInkWork(f)) continue;
    var st = f[F.startTime];
    if (!st) continue;
    var dk = toDateKey(new Date(st));
    if (dk < today) continue;
    var wd = bizDaysUntil(dk);
    if (wd === null) continue;
    if (min === null || wd < min) { min = wd; minRec = r; }
  }
  var need = '<b>' + counts.all + '</b> need ink';
  var rw;
  if (min === null) rw = '<span class="p-tag p-tag-done">&#10003; All scheduled ink caught up</span>';
  else {
    var cls = min > RUNWAY_BENCHMARK ? 'p-tag-done' : (min === RUNWAY_BENCHMARK ? 'p-tag-wait' : 'p-tag-alert');
    var val = min === 0 ? 'Prints today' : (min + (min === 1 ? ' work day' : ' work days'));
    var tail = '';
    if (minRec) {
      var cust = minRec.fields[F.customer] || '', on = getOrderNum(minRec.fields) || '';
      var dObj = new Date(toDateKey(new Date(minRec.fields[F.startTime])) + 'T12:00:00');
      tail = ' ' + escHtml((cust ? cust + ' ' : '') + (on ? '#' + on : '') + (min === 0 ? '' : ' · ' + dObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })));
    }
    rw = 'Tightest runway <span class="p-tag ' + cls + '">' + val + '</span>' + tail;
  }
  // v97: one line (was a page head with an INK QUEUE box and two lines); the whole text is in the tooltip
  var line = need + ' · ' + rw;
  return '<div class="p-job-sum runway">' + line + '</div>';   // v101: wraps instead of being cut off
}

var WIDE = window.matchMedia ? window.matchMedia('(min-width:1100px)') : null;   // v99: two panes from 1100px (was 1400), like Screens v26 / Seps v39
function isWide() { return !!(WIDE && WIDE.matches); }

function renderAll() {
  var s = queueSets();
  var counts = chipCounts(s);
  renderChips(counts);
  var mode = isWide() ? 'list' : 'inplace';
  var filt = function(arr) { return arr.filter(function(r) { return passesFilter(r, activeFilter) && passesSearch(r); }); };
  var h = runwayHtml(counts), any = false, first = null, firstAny = null;
  // v97: the first pick is the first job that still needs ink (v96: the first card, even a ready one)
  function add(html, recs) {
    if (!html) return;
    h += html; any = true;
    if (!firstAny && recs.length) firstAny = recs[0].id;
    if (!first) for (var i = 0; i < recs.length; i++) if (!recs[i].fields[F.inksReady]) { first = recs[i].id; break; }
  }
  // v97: a search or a filter opens every day; otherwise today and the next OPEN_DAYS days with jobs start open
  dayForceOpen = !!searchQ.trim() || activeFilter !== 'all';

  if (activeFilter !== 'nodate') {
    // v94: On press today — pinned on top, ready and not ready
    var op = filt(s.onpress);
    if (op.length) {
      var nr = op.filter(function(r) { return !r.fields[F.inksReady]; }).length;
      add(groupHtml('onpress', 'On press', nr ? '<span class="p-tag p-tag-wait p-job-when" title="Prints today · ' + nr + ' need ink">' + nr + ' need ink</span>' : '<span class="p-tag p-tag-done p-job-when" title="Prints today">&#10003; Inks ready</span>',
        plural(op.length, 'imprint'), op, mode, ' is-press', nr > 0), op);
    }
    // upcoming days, each with its working-day countdown (v88)
    var up = filt(s.upcoming), byDay = {}, days = [];
    up.forEach(function(r) { var dk = toDateKey(new Date(r.fields[F.startTime])); if (!byDay[dk]) { byDay[dk] = []; days.push(dk); } byDay[dk].push(r); });
    days.sort();
    var tom = toDateKey(addDays(new Date(), 1));
    days.forEach(function(dk, di) {
      var cd = printCountdown(dk);
      // v101: the date box is always the date; ONE timing tag says when: "Tomorrow" or "in 3 work days" (shared day head)
      var lbl = new Date(dk + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      var tcls = (cd.sc === 'd1' || cd.sc === 'd2' || cd.sc === 'd3') ? 'p-tag-wait' : 'p-tag-soft';
      var cdl = dk === tom ? 'Tomorrow' : cd.wd > 0 ? 'in ' + cd.wd + '<span class="p-job-wd"> work</span> day' + (cd.wd === 1 ? '' : 's') : 'Today';
      add(groupHtml(dk, lbl, '<span class="p-tag ' + tcls + ' p-job-when" title="' + cd.label + '">' + cdl + '</span>', plural(byDay[dk].length, 'imprint'), byDay[dk], mode, '', di < OPEN_DAYS), byDay[dk]);
    });
  }
  // v88: No date (pipeline) — not ready, unscheduled; capped
  var pipe = filt(s.pipeline), extra = 0;
  if (pipe.length > PIPELINE_RENDER_CAP) { extra = pipe.length - PIPELINE_RENDER_CAP; pipe = pipe.slice(0, PIPELINE_RENDER_CAP); }
  if (pipe.length) add(groupHtml('pipeline', 'No date', '',   // v101: the title says it (one look in every width)
    plural(pipe.length, 'imprint') + (extra ? ' (+' + extra + ' more)' : ''), pipe, mode, ' is-pipe', !any), pipe);
  // v90: Completed — All view only
  if (activeFilter === 'all') {
    var done = s.completed.filter(passesSearch), dx = 0;
    if (done.length > COMPLETED_RENDER_CAP) { dx = done.length - COMPLETED_RENDER_CAP; done = done.slice(0, COMPLETED_RENDER_CAP); }
    if (done.length) add(groupHtml('completed', 'Completed', '',
      plural(done.length, 'imprint') + (dx ? ' (+' + dx + ' more)' : '') + ' · open one to reopen it', done, mode, ' is-done', !any), done);
  }
  if (!any) {
    var msg = searchQ.trim() ? 'Nothing matches “' + escHtml(searchQ.trim()) + '”' + (activeFilter !== 'all' ? ' here. Try All.' : '.')
            : (activeFilter === 'nodate') ? 'No unscheduled ink work'
            : (activeFilter === 'noink') ? 'No jobs waiting on inks'
            : (activeFilter === 'repeat') ? 'No reorders in the queue'
            : 'No ink work to prep — all caught up';
    h += '<div class="msg"><b>' + msg + '</b></div>';
  }
  paint(h, mode, first || firstAny);
}

function plural(n, w) { return '<b>' + n + '</b> ' + w + (n === 1 ? '' : 's'); }

// v95: put the list on screen. Two panes at >=1100px (v99; was 1400) (the right pane is only rebuilt when the pick changes,
// so typing, loaded recipes and scroll survive a re-render); otherwise in place, keeping the open job's DOM.
function paint(h, mode, first) {
  var root = $('root');
  if (mode === 'list') {
    root.classList.add('is-split'); root.classList.toggle('list-hidden', LIST_HIDDEN);   // v96
    var sl = $('splitList'), sd = $('splitDetail');
    if (!sl || !sd) {
      root.innerHTML = '<div class="p-split"><div class="p-split-list" id="splitList"></div><div class="p-split-detail" id="splitDetail" data-id="" aria-live="polite"></div></div>';
      sl = $('splitList'); sd = $('splitDetail');
    }
    var keep = sl.scrollTop;
    sl.innerHTML = h;
    sl.scrollTop = keep;
    if (!pickId || !findRec(pickId)) pickId = first || null;
    if (pickId) openDayOf(pickId);   // v97: the picked job's day is open
    if ((sd.getAttribute('data-id') || '') !== (pickId || '') || !sd.firstChild) showDetailPane(pickId);
    else { refreshCardInkStrip(pickId); syncDetailCls(); }
    markPicked();
    setSplitTop();
    syncListBtn();
  } else {
    root.classList.remove('is-split', 'list-hidden');
    var keepEl = openDetailId ? $('detail-' + openDetailId) : null;
    if (keepEl && !keepEl.firstChild) keepEl = null;
    if (keepEl) keepEl.parentNode.removeChild(keepEl);
    root.innerHTML = h;
    syncListBtn();
    if (openDetailId) {
      var slot = $('detail-' + openDetailId);
      if (!slot) openDetailId = null;
      else if (keepEl) slot.parentNode.replaceChild(keepEl, slot);
      else renderDetail(openDetailId, slot);
    }
  }
}

// One page-head group (a day, On press, No date, Completed) with its order lines.
// v97: defOpen = how the day starts (today + the next OPEN_DAYS days with jobs). The open job's day is always open.
var OPEN_DAYS = 3, dayForceOpen = false;
function groupHtml(key, title, tagHtml, sumHtml, recs, mode, cls, defOpen) {
  var openId = mode === 'list' ? pickId : openDetailId;
  var holdsOpen = !!openId && recs.some(function(r) { return r.id === openId; });
  var collapsed = !dayForceOpen && !holdsOpen && isDayCollapsed(key, defOpen);
  // v101: the shared day head (pine-job-v1.css): ▾ fold · date box · ONE tag · round count (full text in its tooltip)
  var h = '<section class="day p-job-dayg' + cls + (collapsed ? ' collapsed is-closed' : '') + '" id="dg-' + key + '">';
  h += '<div class="p-job-day day-h" onclick="toggleDayGroup(\'' + key + '\')"><button class="p-job-fold" type="button" aria-label="Show or hide ' + escHtml(title) + '" aria-expanded="' + (!collapsed) + '" onclick="event.stopPropagation();toggleDayGroup(\'' + key + '\')">&#9662;</button>' +
       '<span class="p-job-date">' + escHtml(title) + '</span>' + tagHtml +
       '<span class="p-job-n" title="' + String(sumHtml).replace(/<[^>]+>/g, '') + '">' + recs.length + '</span></div>';
  h += '<div class="day-b p-job-dayb">';
  var keys = [], map = {};
  recs.forEach(function(r) { var on = getOrderNum(r.fields) || 'no-order'; if (!map[on]) { map[on] = []; keys.push(on); } map[on].push(r); });
  keys.forEach(function(on) {
    var grec = map[on], customer = grec[0].fields[F.customer] || '';
    h += '<div class="ord" id="og-' + key + '-' + on + '">';
    h += '<div class="p-job-order"><b class="p-job-cust" title="' + escHtml(customer) + '">' + escHtml(customer || '—') + '</b>' +
         (on !== 'no-order' ? '<span class="p-job-ordno">#' + escHtml(on) + '</span>' : '') + '</div>';   // v101: CUSTOMER · #order
    grec.forEach(function(r) { h += cardHtml(r, mode); });
    h += '</div>';
  });
  h += '</div></section>';
  return h;
}

// v76: abbreviate "Pantone 186 - OW" → "186 OW". Bases like "EZP WHT" stay as-is.
function abbreviateInkName(fullName) {
  if (!fullName) return '';
  var s = String(fullName).trim();
  s = s.replace(/^Pantone\s+/i, '');
  s = s.replace(/\s+-\s+/g, ' ');

// Full-screen PDF modal - fetches fresh URL before loading (operator v4 pattern)
// v72: multi-proof state
var pmAllProofs = [];   // [{url, thumb, filename, isPDF}]
var pmActiveIdx = 0;

// v80: hard safety timer — hides the spinner after 3s no matter where in the chain we are.
// 3s is plenty for any normal PDF render; longer than that suggests something silently failed.
var pmSpinnerSafetyTimer = null;
function pmShowSpinner() {
  console.log('[v80] pmShowSpinner');
  document.getElementById('pmSpinner').classList.remove('hidden');
  if (pmSpinnerSafetyTimer) clearTimeout(pmSpinnerSafetyTimer);
  pmSpinnerSafetyTimer = setTimeout(function() {
    var s = document.getElementById('pmSpinner');
    if (s && !s.classList.contains('hidden')) {
      console.warn('[v80] pmSpinner force-hidden after 3s safety timeout');
      s.classList.add('hidden');
    }
  }, 3000);
}
function pmHideSpinner() {
  console.log('[v80] pmHideSpinner');
  var s = document.getElementById('pmSpinner');
  if (s) s.classList.add('hidden');
  if (pmSpinnerSafetyTimer) { clearTimeout(pmSpinnerSafetyTimer); pmSpinnerSafetyTimer = null; }
}
// v80: airbag — if canvas has been painted (non-zero pixels exist) and spinner is still up,
// kill the spinner. Called via requestAnimationFrame after render to catch races.
function pmKillSpinnerIfCanvasReady() {
  var canvas = document.getElementById('pmCanvas');
  var s = document.getElementById('pmSpinner');
  if (canvas && canvas.width > 100 && canvas.height > 100 && s && !s.classList.contains('hidden')) {
    console.warn('[v80] airbag: canvas painted but spinner still visible — forcing hide');
    pmHideSpinner();
  }
}

function openPmPdf(recId, title) {
  console.log('[v78] openPmPdf', recId, title);

  pmPdfDoc = null; pmPage = 1; pmTotal = 1;
  pmAllProofs = []; pmActiveIdx = 0;
  // v78: bump both tokens at open so any pending in-flight calls from a previous open are voided
  pmRenderToken++;
  pmProofLoadToken++;
  document.getElementById('pmProofsBar').style.display = 'none';
  document.getElementById('pmProofsList').innerHTML = '';

  // Fetch fresh signed URLs from Airtable
  var formula = "RECORD_ID()='" + recId + "'";

    .then(function(data) {

      pmAllProofs = rec && rec.fields ? getProofs(rec.fields) : [];

      if (!pmAllProofs.length) {
        pmHideSpinner();

// Render the proof selector pills (only shown if >1 proof)

// v75: proof-load token, separate from pmRenderToken. Increments on each loadPmProof
// or modal-open call so racing requests can be detected and ignored.
var pmProofLoadToken = 0;

// Load a specific proof by index — drives both initial render and proof-switching
function loadPmProof(idx) {
  if (idx < 0 || idx >= pmAllProofs.length) return;
  var myToken = ++pmProofLoadToken;
  pmActiveIdx = idx;
  pmPdfDoc = null; pmPage = 1; pmTotal = 1;
  renderPmProofsBar(); // refresh pill highlight
  pmShowSpinner();
  document.getElementById('pmCt').textContent = '';

  var p = pmAllProofs[idx];
  var freshUrl = p.url, isPDF = p.isPDF;
  console.log('[v78] loadPmProof idx=' + idx + ' isPDF=' + isPDF + ' url=' + (freshUrl || '').slice(0, 60) + '...');

  var link = document.getElementById('pmOpenLink');
  link.href = freshUrl; link.style.display = 'inline-flex';

  if (isPDF) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsLib.getDocument(freshUrl).promise.then(function(doc) {
      if (myToken !== pmProofLoadToken) return; // superseded by another switch
      console.log('[v78] PDF loaded, pages=' + doc.numPages);
      pmPdfDoc = doc; pmPage = 1; pmTotal = doc.numPages;
      document.getElementById('pmCt').textContent = '1/' + pmTotal;
      pmRenderPage();
    }).catch(function(err) {
      if (myToken !== pmProofLoadToken) return;
      console.warn('[v78] PDF load failed:', err && err.message);
      pmHideSpinner();
      var canvas = document.getElementById('pmCanvas');
      canvas.width = 500; canvas.height = 140;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0,0,500,140);
      ctx.fillStyle = '#888'; ctx.font = '700 14px Helvetica, Arial, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('PDF load error: ' + (err && err.message || 'unknown'), 250, 55);
      ctx.fillStyle = '#aaa'; ctx.font = '13px Helvetica, Arial, sans-serif';
      ctx.fillText('Use the Open button above to view in browser', 250, 85);
    });
  } else {
    // Image proof — draw to canvas
    var img = new Image();
    img.onload = function() {
      if (myToken !== pmProofLoadToken) return;
      console.log('[v78] image loaded');
      pmHideSpinner();
      var canvas = document.getElementById('pmCanvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      document.getElementById('pmCt').textContent = '';
    };
    img.onerror = function(e) {
      if (myToken !== pmProofLoadToken) return;
      console.warn('[v78] image load failed', e);
      pmHideSpinner();
    };
    img.crossOrigin = 'anonymous';
    img.src = freshUrl;
  }
}


// v73: pmRenderPage now handles render-promise rejection (e.g. when page is superseded by
// rapid prev/next clicks, or when modal is closed mid-render). Also belt-and-suspenders
// safety: hide spinner after 12s no matter what.
var pmRenderToken = 0; // increments on each render so superseded renders are ignored
function pmRenderPage() {
  if (!pmPdfDoc) { pmHideSpinner(); return; }
  var canvas = document.getElementById('pmCanvas');
  if (!canvas) return;
  var myToken = ++pmRenderToken;
  document.getElementById('pmCt').textContent = pmPage + ' / ' + pmTotal;
  pmShowSpinner();
  pmPdfDoc.getPage(pmPage).then(function(page) {
    if (myToken !== pmRenderToken) return; // superseded
    var body = document.getElementById('pmBody');
    var availWidth = Math.max((body ? body.clientWidth : 0) || 0, window.innerWidth || 800) - 32;
    var vp0 = page.getViewport({ scale: 1 });
    var scale = Math.min(availWidth / vp0.width, 2.5);
    if (scale <= 0 || !isFinite(scale)) scale = 1.5;
    var vp = page.getViewport({ scale: scale });
    canvas.width = vp.width;
    canvas.height = vp.height;
    canvas.style.cssText = 'max-width:100%;height:auto;border-radius:4px;display:block';
    console.log('[v80] starting page.render, canvas=', vp.width, 'x', vp.height);
    page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise.then(function() {
      if (myToken !== pmRenderToken) return;
      console.log('[v80] page.render done — hiding spinner');
      pmHideSpinner();
      document.getElementById('pmCt').textContent = pmPage + ' / ' + pmTotal;
      // v80 airbag: hide spinner on next paint frame too, in case the .then didn't actually apply
      requestAnimationFrame(function() { pmKillSpinnerIfCanvasReady(); });
      requestAnimationFrame(function() {
        requestAnimationFrame(function() { pmKillSpinnerIfCanvasReady(); });
      });
    }).catch(function(e) {
      if (myToken !== pmRenderToken) return;
      console.warn('[v80] Page render rejected:', e && e.message);
      pmHideSpinner();
    });
  }).catch(function(e) {
    if (myToken !== pmRenderToken) return;
    console.error('[v80] Page fetch failed:', e && e.message);
    pmHideSpinner();
  });
}

function pmPrev() { if (pmPage > 1) { pmPage--; pmRenderPage(); } }
function pmNext() { if (pmPage < pmTotal) { pmPage++; pmRenderPage(); } }
function pmClose() {
  document.getElementById('pmModal').classList.remove('open');
  pmPdfDoc = null;
  pmRenderToken++; // void any pending render so it can't hide/show spinner after close
  pmProofLoadToken++; // also void any in-flight proof-switch
  pmHideSpinner();
}
// v78: click anywhere except the toolbar (.pm-bar) or proof picker (.pm-proofs) closes.
// Canvas clicks close (Hannah's intuition: clicking the proof = "I'm done looking, dismiss").
function pmBackdropClose(e) {
  var node = e.target;
  while (node && node.id !== 'pmModal') {
    if (node.classList && (node.classList.contains('pm-bar') || node.classList.contains('pm-proofs'))) return;
    if (!node.parentNode) return; // detached node (e.g. button was re-rendered mid-click) — don't close
    node = node.parentNode;
  }
  pmClose();
}

// LOAD INK RECIPES
function loadInkRecipes(recId, inks) {
  var inkIds = inks.map(function(i) { return typeof i === 'string' ? i : i.id; }).filter(Boolean);
  var filter = 'OR(' + inkIds.map(function(id) { return "RECORD_ID()='" + id + "'"; }).join(',') + ')';

  api('tblyPBucKoDwxDisT?returnFieldsByFieldId=true' +
    '&fields%5B%5D=' + FI.name +
    '&fields%5B%5D=' + FI.pantone +
    '&fields%5B%5D=' + FI.type +
    '&fields%5B%5D=' + FI.recipe +
    '&fields%5B%5D=' + FI.inkNotes +
    '&fields%5B%5D=' + FI.lastUpdated +
    '&fields%5B%5D=' + FI.mfr +
    '&fields%5B%5D=' + FI.displayHex +
    '&filterByFormula=' + encodeURIComponent(filter)
  ).then(function(data) {

    (data.records || []).forEach(function(r) {
      byId[r.id] = r.fields;

    });
    renderInkRows(recId, inks, byId, false);

}

    h += '<button class="p-btn ink-ts-btn" type="button" id="tsbtn-' + iid + '" onclick="bumpInkUpdated(' + q + ',' + qi + ');event.stopPropagation()" title="' + escHtml(mixedTip(upd)) + '"><span class="ic">&#128197;</span><span class="w">Mixed today</span></button>';
    h += '<button class="p-btn ink-remove-btn" type="button" onclick="removeInkRow(' + q + ',\'' + rowId + '\');event.stopPropagation()" title="Take this ink off the job"><span class="ic">&#10005;</span><span class="w">Remove</span></button>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function mixedTip(upd) { return 'Mark this ink as remixed today' + (upd ? ' (last updated ' + upd + ')' : ''); }
function rcpBtnHtml(on) { return on ? '<span class="ic">&#10003;</span><span class="w">Done</span>' : '<span class="ic">&#9998;</span><span class="w">Edit</span>'; }
// v98: "Pantone 7579 - Discharge" shows as a big 7579 and a DISCHARGE tag
function inkNameShowHtml(num, type, full) {

// v96: recipe text -> readable rows. v98: the parts run on ("301 Matte 600", amount bold) and wrap, so a whole recipe
// reads in one to three lines; a "-" line (bases, then pigments) shows as a short black bar.
function recipeListHtml(recipe) {
  var lines = String(recipe || '').split('\n');
  var groups = [[]], any = false;
  // a short black bar starts the first part after a "-" line, inside that part so it never sits alone at a line end
  var bar = function() { var g = groups[groups.length - 1]; return groups.length > 1 && !g.length ? '<span class="rcp-bar" title="-" aria-label="then"></span>' : ''; };
  lines.forEach(function(raw) {
    var l = raw.trim();
    if (!l) return;
    any = true;
    if (/^[-–—_=.]+$/.test(l)) { if (groups[groups.length - 1].length) groups.push([]); return; }
    var m = l.match(/^(.*?\S)\s*[-–—:=]\s*([+]?\d[\d.,]*\s*(?:g|gr|grams?|%|oz|lbs?|kg)?)\s*$/i);
    if (m) {
      var amt = m[2].replace(/\s+/g, '');
      var unit = (amt.match(/[a-z%]+$/i) || [''])[0];
      var num = unit ? amt.slice(0, -unit.length) : amt;
      groups[groups.length - 1].push('<span class="rcp-i">' + bar() + escHtml(m[1]) + '<b>' + escHtml(num) + (unit ? '<small>' + escHtml(unit) + '</small>' : '') + '</b></span>');
    } else {
      groups[groups.length - 1].push('<span class="rcp-i rcp-t">' + bar() + escHtml(l) + '</span>');
    }
  });
  if (!any) return '<span class="rcp-empty">No recipe yet — click to add one</span>';
  // the groups run on in one line that wraps; a short black bar marks the "-" line (bases | pigments)
  return groups.filter(function(g) { return g.length; }).map(function(g) { return '<span class="rcp-g">' + g.join(' ') + '</span>'; }).join(' ');
}

  else { var list = box.querySelector('.rcp-list'); if (list) list.innerHTML = recipeListHtml(ta.value); }

}

// Previous Imprint Inheritance — per-imprint state cache
// Keyed by current imprint recId. Holds matched prev records and last-seeded values
// so dropdown changes can detect user edits before re-seeding.
var prevSeedState = {};

// Label data store — avoids passing complex data through onclick attributes
// Key is a simple integer index; openLabelByKey() retrieves by key
var labelStore = {};
var labelStoreIdx = 0;
function storeLabelData(d) {
  var k = 'lbl' + (labelStoreIdx++);
  labelStore[k] = d;
  return k;
}

// ============================================================
// PREVIOUS IMPRINT INHERITANCE PATTERN
// Mirrors seps-v16 — adapted for ink-queue fields (Inks, Print Notes, Ink Type)
// ============================================================

// Fetch one previous imprint record in full. Single-record GET, NO fields[]= filter.
// Airtable 422s on fields[]= when any listed field can't resolve on that record.
function fetchOnePrevImprint(prevRecId) {
  return api(TI + '/' + prevRecId + '?returnFieldsByFieldId=true');
}

// Helper — extract sorted signature of linked record IDs (order-independent match)
function inkIdsSig(arr) {
  if (!Array.isArray(arr)) return '';
  return arr.map(function(x) { return typeof x === 'string' ? x : (x && x.id) || ''; })
    .filter(Boolean).sort().join(',');
}

// Helper — multipleSelects sig (sorted string join)
function inkTypeSig(arr) {
  if (!Array.isArray(arr)) return '';
  return arr.slice().sort().join(',');
}

// Orchestrator: fetch all linked prevs in parallel, filter by location match,
// then seed + render dropdown if 2+ matches.
function loadPrevImprintsAndSeed(recId) {
  var rec = findRec(recId);
  if (!rec) return;
  var f = rec.fields;
  var prevLinks = f[F.prevImprint] || [];
  if (!prevLinks.length) return;

  var curLoc = getLoc(f).trim().toLowerCase();

  // Handle BOTH v0 (bare string array) and MCP ([{id,name}]) formats — per canonical grouping rule
  var prevIds = prevLinks.map(function(x) {
    return (typeof x === 'string') ? x : (x && x.id) || '';
  }).filter(Boolean);

  if (!prevIds.length) return;

  // Fetch all in parallel
  Promise.all(prevIds.map(function(pid) {
    return fetchOnePrevImprint(pid).catch(function(err) {
      console.warn('Prev imprint fetch failed for', pid, err && err.message);
      return null;
    });
  })).then(function(results) {
    var prevs = results.filter(Boolean);
    if (!prevs.length) return;

    // Filter by Location match — only keep prevs whose Location matches current
    var matched = prevs.filter(function(p) {
      var pf = p.fields || {};
      var pLoc = getLoc(pf).trim().toLowerCase();
      return pLoc && curLoc && pLoc === curLoc;
    });

    // Preserve linked-record array order as tiebreaker
    var orderMap = {};
    prevIds.forEach(function(pid, idx) { orderMap[pid] = idx; });
    matched.sort(function(a, b) { return (orderMap[a.id] || 0) - (orderMap[b.id] || 0); });

    if (!matched.length) {
      // Render amber "no location match" notice; DO NOT seed
      var notice = document.getElementById('seed-notice-' + recId);
      if (notice) {
        notice.innerHTML = '<div class="p-note">The previous run' + (prevIds.length > 1 ? 's are' : ' is') + ' for a different location, so nothing was filled in.</div>';
      }
      prevSeedState[recId] = { matched: [], chosen: null, seeded: null };
      return;
    }

    // Auto-seed from first matched prev (array order tiebreaker)
    var chosen = matched[0];
    prevSeedState[recId] = { matched: matched, chosen: chosen, seeded: null };
    applyCherryPickedSeed(recId, chosen);

    // Persist seeded values to Airtable so this card has real data, not just visual hints.
    // Without this, "Mark Ready" on a seeded card would leave Inks/Notes empty in Airtable.
    persistSeededFields(recId);

    // If 2+ matches, render dropdown + View Previous button in inks header
    renderPopulateFromDropdown(recId);
    renderViewPrevButton(recId);
  });
}

// One-shot PATCH of seeded fields onto the imprint. Called after applyCherryPickedSeed
// and after onPopulateFromChange.
function persistSeededFields(recId) {
  var rec = findRec(recId);
  var state = prevSeedState[recId];
  if (!rec || !state || !state.seeded) return;
  var payload = {};
  var s = state.seeded;
  // Re-read what was just seeded into rec.fields and decide what to write
  // Only write a field if it has a non-empty seeded value (avoid writing empty arrays / blank strings)
  var curInks = rec.fields[F.inks] || [];
  if (s.inkIdsSig && curInks.length) {
    // Normalize to bare ID array for PATCH
    var inkIds = curInks.map(function(x) { return typeof x === 'string' ? x : (x && x.id) || ''; }).filter(Boolean);
    if (inkIds.length) payload[F.inks] = inkIds;
  }
  var curNotes = rec.fields[F.printNotes] || '';
  if (s.printNotes && curNotes && curNotes.trim()) {
    payload[F.printNotes] = curNotes;
  }
  var curInkType = rec.fields[F.inkType] || [];
  if (s.inkTypeSig && curInkType.length) {
    // multipleSelects — values may be string array or [{name}] array; normalize to string array
    var typeNames = curInkType.map(function(x) { return typeof x === 'string' ? x : (x && x.name) || ''; }).filter(Boolean);
    if (typeNames.length) payload[F.inkType] = typeNames;
  }
  if (!Object.keys(payload).length) return;
  if (!WRITES_ENABLED) {
    console.log('[v83 PREVIEW] would persist seeded fields for', recId, JSON.stringify(payload));
    return;
  }
  beginSave(recId);
  api(TI + '/' + recId + '?returnFieldsByFieldId=true', {
    method: 'PATCH',
    body: JSON.stringify({ fields: payload })
  }).then(function() {
    endSave(recId, true);
  }).catch(function(err) {
    console.warn('Persist-seeded failed', err);
    endSave(recId, false, err.message);
  });
}

// Cherry-pick per-field: for each target field, take the value from `chosen` first,
// then walk the rest of `matched` in order. Seed only if current field is empty.
// Stash seeded values in prevSeedState so edit-detection works on dropdown changes.
function applyCherryPickedSeed(recId, chosen) {
  var rec = findRec(recId);
  if (!rec) return;
  var state = prevSeedState[recId];
  if (!state) return;
  var matched = state.matched;

  var f = rec.fields;
  var curInks = f[F.inks] || [];
  var curNotes = f[F.printNotes] || '';
  var curInkType = f[F.inkType] || [];

  // Per-field walk: chosen first, then others in order, take first non-empty
  function pickField(fieldKey, isArray) {
    // Start with chosen, then the rest of matched in order
    var ordered = [chosen].concat(matched.filter(function(p) { return p.id !== chosen.id; }));
    for (var i = 0; i < ordered.length; i++) {
      var v = ordered[i].fields[fieldKey];
      if (isArray) {
        if (Array.isArray(v) && v.length) return v;
      } else {
        if (typeof v === 'string' && v.trim()) return v;
      }
    }
    return isArray ? [] : '';
  }

  var seeded = { inkIdsSig: '', printNotes: '', inkTypeSig: '' };

  // --- INKS (linked record array) — seed only if current is empty
  if (!curInks.length) {
    var pickedInks = pickField(F.inks, true);
    if (pickedInks.length) {
      // Update in-memory record — this makes loadInkRecipes pick them up
      rec.fields[F.inks] = pickedInks;
      seeded.inkIdsSig = inkIdsSig(pickedInks);

      // Re-render the inks scroll area with loading, then fetch recipes
      var inksEl = document.getElementById('inks-' + recId);
      if (inksEl) {
        inksEl.innerHTML = '<div class="inks-loading"><div class="spin" style="display:inline-block;margin-right:6px"></div>Loading recipes...</div>';
      }
      syncInkButtons(recId, pickedInks.length);   // v95: header count + Print all / Copy buttons

      loadInkRecipes(recId, pickedInks);

      // v95: card tags (No inks → swatches) rebuilt from the record
      refreshCardInkStrip(recId);
    }
  } else {
    seeded.inkIdsSig = inkIdsSig(curInks);
  }

  // --- PRINT NOTES (string) — seed only if current is empty
  if (!curNotes || !curNotes.trim()) {
    var pickedNotes = pickField(F.printNotes, false);
    if (pickedNotes) {
      rec.fields[F.printNotes] = pickedNotes;
      seeded.printNotes = pickedNotes;
      // v72: update the editable textarea's value (the slot now always renders a textarea)
      var notesEdit = document.getElementById('pn-edit-' + recId);
      if (notesEdit) notesEdit.value = pickedNotes;
    }
  } else {
    seeded.printNotes = curNotes;
  }

  // --- INK TYPE (multipleSelects on Imprint) — seed only if current is empty
  if (!curInkType.length) {
    var pickedType = pickField(F.inkType, true);
    if (pickedType.length) {
      rec.fields[F.inkType] = pickedType;
      seeded.inkTypeSig = inkTypeSig(pickedType);
      // Refresh card tag row to show the new ink types
      refreshCardInkTypeTags(recId);
    }
  } else {
    seeded.inkTypeSig = inkTypeSig(curInkType);
  }

  prevSeedState[recId].seeded = seeded;
  prevSeedState[recId].chosen = chosen;
}

// Render "Populate from" dropdown in inks header — only when 2+ location-matched prevs
function renderPopulateFromDropdown(recId) {
  var state = prevSeedState[recId];
  if (!state || state.matched.length < 2) return;
  var slot = document.getElementById('populate-from-' + recId);
  if (!slot) return;

  var options = state.matched.map(function(p) {
    var pid = p.fields[F.imprintId] || p.id;
    var selected = (p.id === state.chosen.id) ? ' selected' : '';
    return '<option value="' + p.id + '"' + selected + '>' + escHtml(pid) + '</option>';
  }).join('');

  slot.innerHTML =
    '<label class="pop-from"><span class="p-label">Fill from</span>' +
      '<select class="p-select" onchange="onPopulateFromChange(\'' + recId + '\',this.value)">' +
        options +
      '</select>' +
    '</label>';
}

// Render "View Previous" button for currently-chosen prev (only for repeat imprints
// with at least one location-matched prev). Opens the chosen prev's proof in the PM modal.
function renderViewPrevButton(recId) {
  var state = prevSeedState[recId];
  if (!state || !state.chosen) return;
  var slot = document.getElementById('view-prev-' + recId);
  if (!slot) return;
  var chosenPid = state.chosen.fields[F.imprintId] || state.chosen.id;
  slot.innerHTML =
    '<button class="p-btn" type="button" onclick="openChosenPrevProof(\'' + recId + '\')" title="Open the previous run\u2019s proof">&#8617;<span class="p-job-w"> Previous run</span> ' + escHtml(chosenPid) + '</button>';
}

// Dropdown change — re-seed only fields whose current value exactly matches the last seeded
// value (unedited). Any divergence counts as a user edit; leave it alone.
function onPopulateFromChange(recId, newPrevRecId) {
  var state = prevSeedState[recId];
  if (!state) return;
  var newChosen = state.matched.find(function(p) { return p.id === newPrevRecId; });
  if (!newChosen) return;

  var rec = findRec(recId);
  if (!rec) return;
  var seeded = state.seeded || { inkIdsSig: '', printNotes: '', inkTypeSig: '' };

  // Helper: pick from ordered list with newChosen first
  function pickField(fieldKey, isArray) {
    var ordered = [newChosen].concat(state.matched.filter(function(p) { return p.id !== newChosen.id; }));
    for (var i = 0; i < ordered.length; i++) {
      var v = ordered[i].fields[fieldKey];
      if (isArray) { if (Array.isArray(v) && v.length) return v; }
      else { if (typeof v === 'string' && v.trim()) return v; }
    }
    return isArray ? [] : '';
  }

  // INKS
  var curInks = rec.fields[F.inks] || [];
  var curInksSig = inkIdsSig(curInks);
  if (curInksSig === seeded.inkIdsSig) {
    var newInks = pickField(F.inks, true);
    if (newInks.length) {
      rec.fields[F.inks] = newInks;
      seeded.inkIdsSig = inkIdsSig(newInks);
      var inksEl = document.getElementById('inks-' + recId);
      if (inksEl) {
        inksEl.innerHTML = '<div class="inks-loading"><div class="spin" style="display:inline-block;margin-right:6px"></div>Loading recipes...</div>';
      }
      syncInkButtons(recId, newInks.length);
      loadInkRecipes(recId, newInks);
      refreshCardInkStrip(recId);
    }
  }
  // else: user edited ink list; leave alone

  // PRINT NOTES
  var curNotes = rec.fields[F.printNotes] || '';
  if (curNotes === seeded.printNotes) {
    var newNotes = pickField(F.printNotes, false);
    rec.fields[F.printNotes] = newNotes;
    seeded.printNotes = newNotes;
    // v72: textarea is always present; update its value
    var notesEdit = document.getElementById('pn-edit-' + recId);
    if (notesEdit) notesEdit.value = newNotes || '';
  }
  // else: user edited notes; leave alone

  // INK TYPE
  var curType = rec.fields[F.inkType] || [];
  if (inkTypeSig(curType) === seeded.inkTypeSig) {
    var newType = pickField(F.inkType, true);
    rec.fields[F.inkType] = newType;
    seeded.inkTypeSig = inkTypeSig(newType);
    refreshCardInkTypeTags(recId);
  }

  // Commit new chosen + seeded stash
  state.chosen = newChosen;
  state.seeded = seeded;
  renderViewPrevButton(recId);

  // Persist the new seeded values to Airtable
  persistSeededFields(recId);
}

// Open chosen prev's proof in the PM modal
function openChosenPrevProof(recId) {
  var state = prevSeedState[recId];
  if (!state || !state.chosen) return;
  var chosen = state.chosen;
  var pf = chosen.fields || {};
  var prevImpId = pf[F.imprintId] || chosen.id;
  // Reuse existing openPmPdf flow by stashing the proof URL temporarily on a synthetic record.
  // openPmPdf looks up by recId in allJobs — so we need a different code path.
  // Simplest: extract proof URL directly and open it in a new tab (matches seps v16 behavior).
  var proof = getProof(pf);
  if (proof && proof.url) {
    window.open(proof.url, '_blank', 'noopener');
  } else {
    toast('No proof on the last run ' + prevImpId);
  }
}

// END PREVIOUS IMPRINT INHERITANCE PATTERN
