<!DOCTYPE html>
<!-- Ink Queue v103 (2026-10-16): on phones and iPad portrait (cards open in place), a closed card no longer shows the
     Mark ready button. It took the right third of the card, so tapping the card to open it often marked the job ready
     (Stephen: "in the ink app mobile when u open a card it marks it ready"). The button shows once the card is open;
     closed cards show the status tag (✓ Ready / N inks / No inks) only. Airtable writes: same as v102. -->
<!-- Ink Queue v102 (2026-10-16): the open job is the same box for box as Seps v42 and Screens v29 (pine-job-v2.css).
     Stephen, comparing Ink and Screens at 2000px: "very subtle but you can see the ink and screen / sep box around the
     mockup is ever so slightly different if you scan back and forth".
     - Right pane: the same header (no second line under it; its first line stays one line), body padding 12px all
       round (was 12/16/16; 8px on short laptops, now in all three), mockup : controls = 58 : 42 (was 55 : 45, 54 : 46
       on narrower panes; the controls at least 400px), 12px between them (was 16px), 45 : 55 with two columns of
       inks (was 40 : 60; the controls at least 480px).
     - The mockup footer is always there (it was only for 2+ proofs or a reorder): ‹ 1/N › (2+ proofs) · file name ·
       ↩ Previous run · Full screen, 52px, so the mockup is the same size in every app. Narrow mockups drop the button
       words. The image sits top-left (was centered).
     - The inks header row is 40px like the one-line rows in Seps and Screens. The notes use the shared box (15px text).
     Airtable reads and writes: same as v101.
     Ink Queue v101 (2026-10-15): one job workspace with Seps v41 and Screens v28 (Stephen OK'd the review, phase 0 + 1).
     - Shared look from pine-job-v1.css (new): the same 72px bar (was 64), the filter row (search · chips · Print a label,
       then Hide list), day heads (▾ fold · date · one timing tag "Tomorrow" / "in 3 work days" · count), the order line
       (CUSTOMER · #order), ~96px list cards (80x64 mockup, ID + title, location · type, screens · qty, one status tag +
       facts), the job header (ID + title + tags, customer #order · location · type · press · print date, Screens · Qty ·
       Inks, then Mark ready), the mockup frame with a footer only when needed (‹ 1/N › · file · ↩ Previous run + Fill from,
       moved from the inks toolbar · Full screen), and the notes (labels above, they grow).
     - Ink rows are one 38px line like Seps / Screens: drag · burn order # (new) · swatch · Pantone + type ·
       ✎ 🏷 📅 ✕, with the recipe on a line under it. Two columns when they don't fit (same fitInks rule).
     - The runway line wraps instead of being cut off at 1440. "Pcs" -> "Qty". "Last run" -> "Previous run".
     - The Pantone color table moved to pine-pantone-v1.js (shared, byte-identical in all three apps).
     Same Airtable reads and writes as v100. -->
<!-- Ink Queue v100 (2026-10-15): in the narrow list the day heads show the imprint count as a small number on the right
     (was "2 im…", cut off; Stephen's screenshot); full "2 imprints" in the tooltip. The day toggle no longer leaves a
     box outline after a click. Airtable writes: same as v99. -->
<!-- Ink Queue v99 (2026-10-15): the list shows all the cards, with bigger mockups (Stephen: "should it be similar to the
     seps and screens and just show all the cards...maybe bigger mockups and not the pantones since those would be when
     they open the card and maybe it can get tighter on the left side to make even more room for the mockup and pantones").
     - Two panes from 1100px wide (was 1400), like Screens v26 / Seps v39, so 1280 / 1366 laptops get the static mockup
       and the ink column. The list is 280-320px (v98: 320-360); the open job gets the width.
     - List cards: a bigger mockup (84x72, whole proof, aspect kept), ID + design, "Front · Press 1 · 144 pcs", and ONE
       status tag instead of the ink chips: No inks / N to fill / N inks / ✓ Ready, plus Note (full note in the tooltip)
       and Reorder. No Mark ready on list cards: it's in the open job's header. Below 1100px (in place) cards keep the
       chips and Mark ready, since that's the only place to act.
     - Two panes at 1100-1399: the mockup and the inks sit side by side from a 640px job (was 760).
     Same Airtable reads and writes as v98.
     Ink Queue v98 (2026-10-15): every ink in view (Stephen: "can we look at making ink queue also not scroll in the
     pantones section as well easier to scan and review").
     - Ink cards are compact: a 40px swatch, the Pantone number big with the type tag, and the recipe on one or two lines
       (bases, then pigments: "DC Base 419 · Super 75 139" / "Yellow M3G 24.94 · Orange MGD 18.20 …"). The maker and
       the Updated date moved to tooltips. A click on the name renames it (TBA slots still show the box straight away).
     - Label / Mixed today / Edit / Remove are small quiet buttons on each card. Drag the handle to reorder (same
       auto-scroll as v97).
     - Inks sit in a grid: two columns once the inks column is 620px+ (1920 and 2000 screens), one column below.
       On wide screens the inks column is 45% (v97: 36%); the mockup stays big and static.
     - One toolbar row over the inks: Inks (N) · All labels · Copy colors · + Add ink. Print notes and Ink notes are
       one line each under the inks, and grow when they have text.
     - List cards: the ink chips and Mark ready sit in one wrapping row, so chips can never run under the button
       (long names cut with …). Chip names are tidied: "7687 DIRECT-TO-FABRIC -" reads "7687 Direct-to-fabric".
     Same Airtable reads and writes as v97.
     Ink Queue v97 (2026-10-15): moving through the jobs, and a bigger mockup (Stephen on v96).
     - Open job: the white head with a small mockup above the big one is gone. One slim head: ID, design, tags like
       REORDER, then customer #order · location · press · print date; Pcs / Inks and Mark ready on the right. The ink
       chips left the head (the ink cards beside the proof show the same inks). The big proof starts higher and is bigger.
     - List: "N need ink · Tightest runway" is one line. Under each day, a slim order line (customer left, cut with …;
       the #order badge right, in a fixed column so they line up) and its imprint cards straight below. No per-order
       open/close. Cards are compact for the 380-440px list: thumbnail, ID + design, "Bandana · Press 2 · 120 pcs ·
       2 inks", ink chips wrap.
     - Days: today and the next 3 days with jobs start open, later days start closed with their count, "On press today"
       starts closed when all its inks are ready. Opening or closing a day is remembered for the session. A search or
       a filter opens every day.
     - Up/down walk every job and open a closed day on the way. After Mark ready, the next job that still needs ink
       opens (two panes as before; now in place too), even when it's in a closed day.
     - Dragging an ink near the top or bottom of the job scrolls it, faster nearer the edge (same as Seps v37).
     - No proof: the job says "No proof in Airtable" and names the line item to add it to (with a link), or says the
       imprint has no line item. PDF proofs show their large thumbnail.
     Same Airtable writes as v96. One new read: the line item name, only when an open job has no proof.
     Ink Queue v96 (2026-10-15): the mockup and the inks are the job (Stephen: "Ink is really focused on Mockups and then
     adding the correct colors and looks like that is hard to read / use right now"), and the 4x2 Rollo labels were checked.
     - Two panes (1400px+): the list is narrower (380-440px, was 560-640) and "Hide list" in the filter row gives the open job
       the whole width (remembered on this computer; up/down still move between jobs).
     - Open job: the proof is big (about 58% of the pane, as tall as the pane, stays put while the inks scroll) and loads
       Airtable's full-size image (was the 512px thumbnail). Prev / next and the count sit under the proof, not on it.
       Click the proof for full screen (it opens on the proof you were looking at).
     - Inks sit beside the proof: big swatch, big ink name, type and maker, and the recipe as a list (part on the left,
       amount on the right, numbers lined up). "Edit recipe" opens the same box as before (same save). Created dates are
       gone; the Updated date is small. Label / Mixed today are small buttons, Remove is a quiet text button.
       Print notes and Ink notes moved below the inks.
     - Labels (Stephen: "make sure that it will print correctly with a rollo printer"): still a 4x2in PDF, one label a
       page, pure black on white. Recipes are bigger (tighter lines; a "-" line is a thin rule; very long recipes go to two
       columns instead of shrinking to 5pt), long Pantone names wrap onto 2-3 big lines, long ink names wrap in the band,
       characters a PDF font can't draw are swapped (no garbage glyphs). A label now prints the recipe as it is on screen
       (v95 printed the recipe from when the ink list loaded). The preview hides the PDF toolbar; on Safari Print opens
       the PDF in a tab (Safari can't print a PDF inside the page). The label pop-up says which print settings to use.
     Same Airtable reads and writes as v95.
     Ink Queue v95 (2026-10-15): Pine style v2 + the Pine page kit, built for the desktop first.
     - Black Pine bar (logo, INK QUEUE, version, Practice pill) with Refresh (also checks for a new version) and a ⚙ menu
       that holds the Airtable token and the practice switch (the token strip and 🔑 button are gone).
     - One filter row: search (customer, order #, imprint, design) · All / No inks / Reorders / No date chips · Print a label.
     - Jobs are kit list cards (proof thumbnail + imprint ID · design + location/press · pcs/inks · Mark ready; ink swatches
       and tags on row 2). At >=1400px the queue is two panes: list left, the picked job right (each scrolls on its own,
       ↑/↓ move between jobs). Narrower, a job opens in place, one at a time.
     - Mark ready on the open job is the one yellow button; marking it moves you to the next job, with Undo.
     - Ink Notes moved from the collapsed card into the open job, next to Print Notes. Bigger swatches, 44px buttons,
       nothing under 12px, no Courier. Pop-ups use the kit pop-up. Ink swatch colors stay real ink colors.
     - Practice mode (?practice=1 or the ⚙ menu): every write is faked in one place (api()), nothing reaches Airtable.
     - Self-update (pine-update.js -> pine-ink-queue.html).
     - Fixes: "No date" jobs opened to an empty box (they weren't looked up); a failed save kept showing
       "Save failed" forever and said "click to retry" with no retry; alerts became toasts.
     Same Airtable reads and writes as v94. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Queue v103 — Pine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap">
<link rel="stylesheet" href="pine-style-v2.css">
<link rel="stylesheet" href="pine-job-v2.css">
<script src="pine-pantone-v1.js"></script>
<style>
/* v95: the Pine page kit (pine-style-v2.css) does the bar, ⚙ menu, filter row, heads, list cards, two-pane split,
   pop-ups and toast. App-only bits below. Old pine-design-v1 names point at v2 tokens for the few inline styles left. */
:root{--bg:var(--p-cream-lt);--surface:var(--p-white);--border:var(--p-line);--border-dk:var(--p-cream-dk);--text:var(--p-black);
  --muted:var(--p-ink-2);--muted-lt:var(--p-ink-3);--cond:var(--p-sans);--sans:var(--p-sans);--mono:var(--p-sans);
  --red:var(--p-alert);--yellow:var(--p-yellow);--radius:var(--p-r);--radius-lg:var(--p-r-lg);--hover:#FBF7EF}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%;background:var(--p-cream-lt)}
body{font-size:15px}
.p-num b,.ink-ts,.pm-ct,.proof-nav-counter{font-variant-numeric:tabular-nums}

/* ⚙ menu */
.p-menu .p-input{flex:1;min-width:0}
.menu-tok{display:flex;gap:var(--p-s2)}
/* filter row: full width, 24px gutters like the page */
@media (min-width:701px){ .p-filters{padding-left:24px;padding-right:24px} }
.w-short{display:none}
@media (max-width:1180px){ .p-filters .p-search{max-width:300px} }
@media (min-width:1100px) and (max-width:1279px){ .p-filters .p-search{max-width:220px} }   /* v99: Hide list shows from 1100px; the chips keep their room */
@media (max-width:900px){ #chips{flex:1 1 100%;order:3} .p-filters .p-search{max-width:none} }
.p-tab.zero{border-color:var(--p-line-strong);color:var(--p-ink-3)}

/* page */
.wrap{padding:0 24px 120px}
.wrap.is-split{padding:0 24px}
.msg{padding:48px 16px;text-align:center;color:var(--p-ink-2)}
.msg b{display:block;color:var(--p-black);font-size:18px;margin-bottom:6px}
.msg.err b{color:var(--p-alert)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--p-line-strong);border-top-color:var(--p-black);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* runway (v92 KPI) in the first page head */
.rw{font-weight:800}
.day.is-done .p-lc{background:#FCFAF6}
/* v97 order lines: customer left (cut with …), then fixed columns on the right so the #order badges line up.
   No open/close per order: its imprint cards sit straight below. */
.ord + .ord{margin-top:var(--p-s3)}

/* job card (.p-lc) */
.p-lc-head.is-tap:hover{background:var(--hover)}
.p-split-list .p-lc.is-open>.p-lc-head.is-tap:hover{background:var(--p-cream)}
.sw-dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(20,20,18,.3);flex:none}
.sw-dot.empty{background:var(--p-white);border-style:dashed}
.p-tag.sw{text-transform:none;letter-spacing:.01em;font-size:13px}
.p-lc-note{display:block;font-size:var(--p-fs-s);color:var(--p-ink-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-lc-note b{color:var(--p-black)}
/* per-card save status */
.save-pip{font:700 12px/1.2 var(--p-sans);white-space:nowrap;color:var(--p-ink-2);min-height:14px}
.save-pip.idle{visibility:hidden}
.save-pip.saved{color:var(--p-black)}
.save-pip.err{color:var(--p-alert)}
.save-pip.saving::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--p-yellow);border:1px solid var(--p-black);margin-right:5px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* v96 two panes: narrower list so the open job (mockup + inks) gets the room; "Hide list" folds it away */
.is-split.list-hidden .p-split{grid-template-columns:minmax(0,1fr)}
.is-split.list-hidden .p-split-list{display:none}

/* open job: proof + inks (container-sized, so it works in place and in the right pane) */
.p-lc-body{padding:var(--p-s4)}
.jd{container:jd / inline-size}
.jd-in{display:grid;gap:var(--p-s4)}
/* v96: side by side once there's room — the proof is the bigger half, the inks beside it */
@container jd (min-width:760px){ .jd-in{grid-template-columns:minmax(0,54fr) minmax(380px,46fr);align-items:start} }   /* v98: 54/46 (v97: 58/42) */
/* v97: on wide screens (job 1300px+) the proof takes a bit more, so the mockup is bigger; the ink cards keep 420px+ */
/* v98: 55/45 so the inks get two columns (Stephen: no scrolling through the Pantones); the mockup is still the big half */
@container jd (min-width:1300px){ .jd-in{grid-template-columns:minmax(0,55fr) minmax(420px,45fr)} }
/* v97 two panes: the open job never scrolls as a whole (Stephen: "would love for that mockup area be static").
   The pane is a fixed-height column: the slim head on top, the body fills the rest. The mockup fills the body
   height and stays put; only the inks column scrolls (many Pantones scroll in their own column). No sticky bars. */
.is-split .p-split-detail{overflow:hidden;display:flex;flex-direction:column;padding-bottom:var(--p-s4)}
.p-split-detail>.p-split-empty{flex:none}
.p-split-detail>.p-lc{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.p-split-detail>.p-lc>.p-lc-head{flex:none}
.p-split-detail .jd{flex:1 1 auto;min-height:0}   /* v102: the body, the grid and the columns are pine-job-v2.css */
/* v99: two panes start at 1100px, so the job can be 640-760px wide: keep the mockup and inks side by side there too */
.p-split-detail .proof-area{flex:1 1 auto;min-height:0}
.p-split-detail .jd-proof>.proof-miss{flex:1 1 auto}
.proof-area{position:relative;cursor:zoom-in;min-height:160px;display:grid;place-items:center;background:var(--p-white);padding:8px}
.proof-area img{width:100%;height:auto;display:block;max-height:60vh;object-fit:contain}
.proof-none{padding:40px 16px;text-align:center;color:var(--p-ink-2);font-weight:700}
/* prev / count / next and Full size sit UNDER the proof, never on it */
.jd-inks{display:flex;flex-direction:column;gap:var(--p-s2);min-width:0;container:inkcol / inline-size}
/* v98: one toolbar row over the inks: Inks (N) · All labels · Copy colors · (Paste / Fill from / Last run) · + Add ink */
.jd-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.jd-h .p-section{padding:7px 10px}
.jd-h .jd-add{margin-left:auto}
.jd-h>span:empty{display:none}
.pop-from{display:inline-flex;align-items:center;gap:8px}
.pop-from .p-select{width:auto;min-width:130px}
/* v98: notes are one line each under the inks (side by side), and grow with their text */
.jd-notes{display:grid;grid-template-columns:1fr 1fr;gap:var(--p-s2);margin-top:2px}
@container inkcol (max-width:380px){ .jd-notes{grid-template-columns:1fr} }
.jd-notes .p-field{gap:2px}
.jd-notes .p-label{font-size:12px}
.jd-notes .p-textarea{min-height:40px;height:40px;padding:8px 10px;font-size:var(--p-fs-s);line-height:1.35;resize:none;overflow-y:hidden}
/* add ink */
.add-ink{border:2px dashed var(--p-line-strong);border-radius:var(--p-r-lg);background:var(--p-white);padding:var(--p-s3);display:grid;gap:var(--p-s3)}
.add-ink:not(.open){display:none}
.add-ink-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--p-s3)}
@container inkcol (max-width:420px){ .add-ink-grid{grid-template-columns:1fr} }

.add-ink .p-field>.p-label{display:block}
.add-ink .p-textarea{min-height:72px}
.ink-search-wrap{position:relative}
.ink-ac-results{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;background:var(--p-white);border:2px solid var(--p-black);border-radius:var(--p-r);max-height:300px;overflow-y:auto;box-shadow:var(--p-shadow)}
.ink-ac-row{padding:10px 12px;min-height:44px;cursor:pointer;border-top:1px solid var(--p-line)}
.ink-ac-row:first-child{border-top:0}
.ink-ac-row:hover{background:var(--p-cream)}
.ink-ac-row-name{font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.ink-ac-row-meta{font-size:13px;color:var(--p-ink-2);margin-top:2px}
.ink-ac-none{padding:12px;font-size:14px;color:var(--p-ink-2)}
/* v98 compact ink cards: drag handle · 40px swatch · Pantone number big + type tag · recipe on 1-2 lines · small actions.
   A grid: two columns when the inks column is 620px+, one below. No inner scroll box (a drag reaches the first ink). */
/* the name: Pantone number big, then the type tag; a click shows the name box (TBA slots show it straight away) */
.ink-nm{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;min-width:0;cursor:text;border-radius:var(--p-r)}
.ink-nm:hover .nm-n{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.ink-name-edit{display:none;font:800 16px/1.2 var(--p-sans);text-transform:uppercase;letter-spacing:.01em;color:var(--p-black);border:2px solid var(--p-line-strong);border-radius:var(--p-r);background:var(--p-white);width:100%;min-height:36px;padding:4px 8px;outline:none;text-overflow:ellipsis}
.ink-row.naming .ink-name-edit{display:block}
.ink-row.naming .ink-nm{display:none}
.ink-name-edit:focus{border-color:var(--p-black);box-shadow:0 0 0 3px var(--p-yellow)}
.ink-name-edit::placeholder{text-transform:none;color:var(--p-ink-3);font-weight:700}
.ink-name-edit.invalid{border-color:var(--p-alert);background:var(--p-alert-lt)}
.ink-name-hint{font-size:12px;color:var(--p-alert);display:none}
.ink-name-hint.on{display:block}
.ink-meta{display:none}   /* v98: maker + Updated live in the tooltips (kept for the Mixed today stamp) */
.ink-ts{font-size:13px;color:var(--p-ink-2)}
/* recipe: one line per group (bases, then pigments — the shop's "-" line splits them), "part amount · part amount" */
.rcp-g{display:inline}
.rcp-bar{display:inline-block;width:2px;height:15px;background:var(--p-black);vertical-align:-2px;margin-right:8px}
.rcp-i{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top;margin-right:14px}
.rcp-i b{font-weight:800;font-variant-numeric:tabular-nums;margin-left:4px}
.rcp-i b small{font-weight:400;font-size:12px;color:var(--p-ink-2);margin-left:1px}
.rcp-t{font-weight:700}
.rcp-empty{color:var(--p-ink-3);font-weight:700;font-size:14px}
.ink-recipe{width:100%;font:400 15px/1.45 var(--p-sans);font-variant-numeric:tabular-nums;white-space:pre-wrap;border:2px solid var(--p-line-strong);border-radius:var(--p-r);padding:6px 8px;min-height:150px;resize:vertical;background:var(--p-white);color:var(--p-black);outline:none}
.ink-recipe:focus{border-color:var(--p-black);box-shadow:0 0 0 3px var(--p-yellow)}
.ink-rcp.editing .rcp-list{display:none}
.ink-rcp:not(.editing) .ink-recipe{display:none}
/* actions: small and quiet. Under the recipe in one row (words); on a wide one-column card they move up beside the
   name as small icons (each has a tooltip), so the card is only the name line and the recipe. */
/* v99: when one column of inks doesn't fit and two columns show more (set by fitInks(), two panes only), the inks get
   two columns and a little more of the job's width (60/40), the way Screens v26 / Seps v39 do it */
.jd-inks>div[id^="seed-notice-"]:empty{display:none}   /* v99: no empty gap over the inks */
/* v99: laptop heights (768-860px): slimmer paddings in two panes, so another ink fits */
/* v102: the slimmer laptop paddings moved to pine-job-v2.css, for all three apps */
/* v99: a narrow inks column (1100-1280 screens): All labels is the 🏷 icon (tooltip), so the toolbar stays one row */
@container inkcol (max-width:419px){ .jd-h .w{display:none} }
/* swatch color popover */
.chip-popover{position:fixed;z-index:150;width:250px;background:var(--p-white);border:2px solid var(--p-black);border-radius:var(--p-r-lg);box-shadow:var(--p-shadow);padding:var(--p-s3);display:grid;gap:8px}
.chip-popover .row{display:flex;gap:8px}
.chip-popover .p-input{flex:1;min-width:0}

/* pop-ups: shown with .open (the JS toggles it) */
.ovl:not(.open){display:none!important}
.p-modal-f .p-btn{font-size:var(--p-fs-s)}
.choices{display:grid;gap:var(--p-s2);margin-top:var(--p-s4)}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--p-black);border-radius:var(--p-r);background:var(--p-white);padding:12px 14px;cursor:pointer;min-height:56px;color:var(--p-black)}
.choice:hover{background:var(--p-cream)}
.choice b{display:block;font:800 16px/1.25 var(--p-sans)}
.choice small{display:block;font-size:13px;color:var(--p-ink-2);margin-top:2px}
.iec-name{font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.iec-diff{margin-top:10px;display:grid;gap:4px;font-size:14px;color:var(--p-ink-2)}
.iec-diff b{color:var(--p-black)}
/* label preview */
.lbl-modal{width:min(640px,100%)}
.label-iframe-wrap{width:100%;max-width:576px;aspect-ratio:2/1;margin:0 auto;background:#fff;border:1px solid var(--p-line);border-radius:var(--p-r);overflow:hidden;position:relative}
.label-iframe-wrap iframe{width:100%;height:100%;border:0;display:block}
.label-iframe-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--p-ink-2);font-size:var(--p-fs-s);background:#fff}
.lbl-modal .p-modal-f{align-items:center}
.lbl-modal .p-hint{margin-right:auto;flex:1 1 220px}
.lbl-modal .p-modal-f{flex-wrap:wrap}
/* library label search */
.master-modal{width:min(600px,100%);display:flex;flex-direction:column;max-height:88vh}
.master-modal .p-modal-b{padding:var(--p-s4) var(--p-s5) var(--p-s2)}
.master-results{overflow-y:auto;border-top:1px solid var(--p-line);min-height:120px}
.master-ink-row{padding:12px var(--p-s5);border-bottom:1px solid var(--p-line);cursor:pointer;min-height:56px}
.master-ink-row:hover{background:var(--p-cream)}
.master-ink-name{font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.master-ink-meta{font-size:13px;color:var(--p-ink-2);margin-top:2px}
.master-ink-recipe-preview{font-size:13px;color:var(--p-ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.master-empty,.master-loading{padding:32px 16px;text-align:center;color:var(--p-ink-2);font-size:var(--p-fs-s)}

/* full-size proof viewer (dark, full screen) */
.pm{display:none;position:fixed;inset:0;z-index:200;background:rgba(20,20,18,.94);flex-direction:column}
.pm.open{display:flex}
.pm-bar{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--p-black);flex-shrink:0;flex-wrap:wrap}
.pm-bar .p-btn{background:transparent;color:var(--p-white);border-color:rgba(255,255,255,.45);font-size:var(--p-fs-s);padding:0 14px}
.pm-bar .p-btn:hover{border-color:var(--p-white);background:rgba(255,255,255,.08)}
.pm-bar .p-btn.pm-open{background:var(--p-white);color:var(--p-black);border-color:var(--p-white)}
.pm-fn{flex:1;min-width:120px;color:rgba(255,255,255,.75);font-size:var(--p-fs-s);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-nav{display:flex;gap:6px;align-items:center}
.pm-ct{color:var(--p-white);font-size:var(--p-fs-s);min-width:48px;text-align:center}
.pm-proofs{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#24231F;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.pm-proofs::-webkit-scrollbar{display:none}
.pm-proofs-lbl{font:800 12px/1 var(--p-sans);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6);flex-shrink:0}
.pm-proof-pill{min-height:44px;padding:0 14px;border-radius:var(--p-pill);border:1.5px solid rgba(255,255,255,.4);background:transparent;color:var(--p-white);cursor:pointer;font:700 13px/1 var(--p-sans);white-space:nowrap}
.pm-proof-pill:hover{border-color:var(--p-white)}
.pm-proof-pill.on{background:var(--p-yellow);border-color:var(--p-yellow);color:var(--p-black)}
.pm-body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px;position:relative}
#pmCanvas{border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.6);max-width:100%}
.lb-spinner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lb-spinner.hidden{display:none}
.lb-spin{width:32px;height:32px;border:3px solid #444;border-top-color:var(--p-yellow);border-radius:50%;animation:sp .7s linear infinite}

/* toast sits above everything else */
.p-toast{z-index:260}
.p-toast[hidden]{display:none}

/* v99 list cards (two panes, 280-320px list): a bigger mockup on the left; ID + design, "Front · Press 1 · 144 pcs",
   then one status tag (No inks / N to fill / N inks / ✓ Ready) + Note + Reorder. No ink chips and no Mark ready here:

.proof-miss{min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px;padding:32px 28px;max-width:560px;margin:0 auto;width:100%}

@media (max-width:700px){
  .p-bar{gap:8px}
  .p-filters .p-search{flex:1 1 0}
  .p-chips{margin:0 -16px;padding:0 16px 2px}

  .proof-miss{padding:24px 16px}
  .p-lc-body{padding:var(--p-s3)}

}

.p-job-ink .ink-body{flex-wrap:wrap;row-gap:2px}
.ink-nm{display:flex;align-items:center;gap:2px 8px;min-width:0;cursor:text;border-radius:var(--p-r)}
.ink-nm .p-tag{flex:none;height:22px;padding:0 6px;font-size:12px}
.ink-nm:hover .nm-n{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.ink-row.naming .ink-name-edit{flex:1 1 100%}

.ink-side .w{display:none}

/* v102: the right pane's geometry (pane, body, mockup : controls 58 : 42, gap, footer, column gap) is all pine-job-v2.css
   now, the same as Seps v42 and Screens v29. The Ink-only rules that made it differ are gone. */

.p-lc:not(.is-open)>.p-lc-head.is-inplace .ready-btn{display:none}

<body class="p-app p-job">
<header class="p-bar">
  <span class="p-mark"><span class="p-logo" aria-hidden="true"></span></span>
  <span class="p-bar-app">Ink Queue</span><span class="p-bar-ver" id="ver">v103</span>
  <span class="p-tag p-tag-wait" id="practicePill" hidden>Practice</span>
  <div class="p-bar-sp">
    <button class="p-barbtn" id="refreshBtn" type="button" onclick="refreshNow()" title="Reload from Airtable and check for a new version">&#8635; <span class="p-barbtn-word">Refresh</span></button>
    <button class="p-barbtn p-barbtn-icon" id="menuBtn" type="button" onclick="showMenu(document.getElementById('menu').hidden)" aria-label="Settings" aria-expanded="false" title="Settings">&#9881;</button>
  </div>
  <div class="p-menu" id="menu" role="dialog" aria-label="Settings" hidden>
    <div class="p-menu-row"><span class="p-menu-label">Airtable token</span>
      <div class="menu-tok"><input type="password" id="tokenInput" class="p-input" placeholder="pat…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter'){saveToken()}"><button class="p-btn p-btn-dark" type="button" onclick="saveToken()">Save</button></div></div>
    <div class="p-menu-row"><span class="p-menu-label">Practice</span>
      <div class="p-menu-line"><span class="p-hint" id="practiceHint"></span><button class="p-btn" id="practiceBtn" type="button" onclick="togglePractice()"></button></div></div>
  </div>
</header>
<div class="p-filters" id="filters">
  <input type="search" id="q" class="p-input p-search" placeholder="Imprint ID, order #, customer, design" aria-label="Search the queue" oninput="onSearch(this.value)">
  <div class="p-chips p-chips-inline" id="chips" role="tablist" aria-label="Filter"></div>
  <div class="p-filters-end"><button class="p-btn" type="button" onclick="openMasterModal()">&#127991; <span class="w-long">Print a label</span><span class="w-short">Label</span></button><button class="p-btn p-job-listbtn" id="listBtn" type="button" hidden onclick="toggleList()" title="Give the open job the whole width"></button></div>
</div>
<main class="wrap" id="root"><div class="msg"><b><span class="spin"></span>Loading the ink queue…</b></div></main>
<div class="p-toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- Proof full-size viewer -->
<div class="pm" id="pmModal" onclick="pmBackdropClose(event)">
  <div class="pm-bar" onclick="event.stopPropagation()">
    <button class="p-btn" type="button" onclick="event.stopPropagation();pmClose()">&#10005; Close</button>
    <span class="pm-fn" id="pmFn"></span>
    <div class="pm-nav">
      <button class="p-btn" type="button" aria-label="Previous page" onclick="event.stopPropagation();pmPrev()">&#8249;</button>
      <span class="pm-ct" id="pmCt"></span>
      <button class="p-btn" type="button" aria-label="Next page" onclick="event.stopPropagation();pmNext()">&#8250;</button>
    </div>
    <a id="pmOpenLink" class="p-btn pm-open" href="#" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="display:none">&#11014; Open</a>
  </div>
  <div class="pm-proofs" id="pmProofsBar" onclick="event.stopPropagation()" style="display:none">
    <span class="pm-proofs-lbl">Proofs</span>
    <div id="pmProofsList" style="display:flex;gap:6px;flex-wrap:nowrap"></div>
  </div>
  <div class="pm-body" id="pmBody">
    <div class="lb-spinner hidden" id="pmSpinner"><div class="lb-spin"></div></div>
    <canvas id="pmCanvas"></canvas>
  </div>
</div>

<script>
// CONFIG — writes ENABLED v86 (v86: bigger header Print All; Copy/Paste colors moved to an action bar above the pantone rows)
// v88: queue simplified. Ready jobs hidden. Day headers show a working-day countdown to print
//      (green 4+ / yellow 3 / amber 2 / red 1 / black today), anchored on Scheduled Start Time.
//      Filters reduced to All / No Inks / Reorders / No Date. New "No date" pipeline group at the
//      bottom = not-ready + unscheduled work (second bounded fetch, newest-first, capped, display-only).
//      No new writes; WRITES_ENABLED untouched.
// v89: fix No Date pipeline (and dated queue) pulling in non-ink work. Unscheduled jobs have no
//      Equipment yet, so SKIP_PRESS couldn't catch embroidery/supacolor/decopress/patch-label/
//      finishing. Now also skip by Imprint Type (SKIP_TYPE) — set by art before scheduling.
//      Ink types (Discharge, No Base W/B, Bleed Blocker + W/B, EZP Base + W/B, Flatstock) are kept.
// v90: "Completed" group at the bottom (All view) — ready jobs stay reachable so the dept can tap
//      ✓ Ready to reopen one. Clears 5 days after PRINT date (no ready-timestamp field exists, so
//      print-date is the shared/no-schema proxy). Fetch window widened back 5 days to feed it.
// v91: app-wide Order Status gate. Nothing appears (dated, pipeline, or completed) until the order
//      reaches "Ordered - In Production". Whitelist of production + delay statuses; pre-production
//      (Awaiting Proof / Sent-Awaiting Payment / Ready to Order) and downstream/terminal are excluded.
//      Replaces the pipeline's old "exclude 3 terminal statuses" rule.
// v92: "Tightest runway" KPI strip at top. Shows the working-days-to-print of the NEAREST
//      unfinished (not-ready) scheduled job — the one most likely to bite. Benchmark 4:
//      >4 green, =4 amber, <4 red. Inline, display-only, ignores the active filter (global health).
// v93: token bar markup added (JS referenced #tokenBar but no element existed — page threw on
//      first load for anyone without a saved pine_at_key). Plus a 🔑 Token button in the stats bar.
// v94: "On Press Today" pinned group at the very top — ALL of today's ink jobs, ready AND not
//      ready, in the existing order-number grouping. Ready jobs were hidden from the dated queue
//      since v88 and only reachable at the bottom under Completed, so by press day the dept lost
//      sight of what was actually running. Render-only: the fetch window already covers today.
//      Today is removed from the dated loop and from Completed so nothing renders twice.
// v95: Pine style v2 + page kit (bar, ⚙ menu, one filter row with search, kit list cards, two panes at >=1400px).
//      Practice mode (?practice=1): api() fakes every PATCH/POST/DELETE in one place, nothing reaches Airtable.
//      Self-update via pine-update.js. Fixes: No-date (pipeline) jobs opened empty (lookups only searched allJobs);
//      a failed save kept the card on "Save failed" forever. Airtable reads/writes otherwise identical to v94.
var WRITES_ENABLED = true;
var PRACTICE = /[?&]practice=1/.test(location.search);   // v95
// Debounce window for text-field auto-save (ms)
var SAVE_DEBOUNCE_MS = 800;
// SHELL TICKER NOTE: "Inks Mixed Today" stat = count of Ink records (tblyPBucKoDwxDisT)
// where Last Updated (fldL5FCWezh8wXRhf) = TODAY() in Denver timezone.
// Shell fetches this via: filterByFormula=IS_SAME({fldL5FCWezh8wXRhf},TODAY(),'day')
var BASE = 'appJkaLk8DykjsgHR';
var TI = 'tbln9oAGvz2PNBZLV';
var TIN = 'tblyPBucKoDwxDisT';
var DAYS_AHEAD = 14;

// Presses that don't use ink — filter these out
var SKIP_PRESS = ['heat', 'embroid', 'tag press', 'finishing', 'sewing', 'bartacker', 'post-bed', 'd3', 'hat press', 'size tag'];
// v88.1: Imprint Types that don't use mixed screen ink. Reliable on UNSCHEDULED jobs where
// Equipment (press) is still blank, so SKIP_PRESS can't catch embroidery/supacolor/etc.
// Ink-using types (Discharge, No Base W/B, Bleed Blocker + W/B, EZP Base + W/B, Flatstock)
// contain none of these substrings, so nothing valid is dropped.
var SKIP_TYPE = ['supacolor', 'embroid', 'decopress', 'finishing', 'patch', 'label', 'woven'];

var F = {
  imprintId:   'fldDFfwFQ9B20n2kT',
  orderNum:    'fldZAIMnXPYF9LiXq',
  startTime:   'fldfqtIgcEfIlIeQk',
  loc:         'fldKQIL0rSJBSeC8S',
  inks:        'fldpNCCXTgHyDhvak',
  inkNames:    'fldMM5hp8kEpo3KKT',
  inkType:     'fldYByH4NIDKdqyNB',
  inksReady:   'fld2a1CPcDMSD26PS',
  isRepeat:    'flda9L7041ahNZT0b',
  prevImprint: 'fldAEQvMAAZX9gnhl',
  printNotes:  'fldNuEzGIYI8FWqXu',
  proofs:      'fldUOIfCd22MxevRm',
  qty:         'fldFipR4ddfqMPeAX',
  customer:    'fldeLMIAC0ABQAjYJ',
  printDesc:   'fld0jStSNsRNjjeZy',
  press:       'fldv59OGU7EkBVofo',
  screens:     'fld8rgkIj1RPO97QU',  // Screen Count — used as expected ink count on card
  inkNotes:    'fldk0Zbjyuh5NEIE8',  // v77: Ink Notes (singleLineText) on Imprints
  orderStatus: 'fldNROVFSsBwLUOYW',  // v88: Order Status lookup — client-side filter for pipeline fetch
  printMethod: 'fldjNCuaGOkWgzH2K',  // v88.1: Imprint Type (method) — skip non-ink types (embroidery/supacolor/etc)
  lineItems:   'fldsvntAy1QHEoDAg',  // v97: Line Items link (read only) — names the line item when a job has no proof
};
var TLI = 'tblJx5UlwO7oMSk5H', LI_REF = 'fldU6oLyZnxhhm2kX';   // v97: Line Items table + its name (Line Item Reference)

var FI = {
  name:        'fldojKv3gqT312q2R',
  pantone:     'fld00EdkjL43ybgVV',
  type:        'fldXMM4WvS3SGsliC',
  recipe:      'fld3M1zgk0e8stlMJ',
  inkNotes:    'fld74ueWQqqogJRsU',
  lastUpdated: 'fldL5FCWezh8wXRhf',
  mfr:         'fldQlykyAq9juCg3J',
  displayHex:  'fld5CH7FV94UnOVVl',  // v77: per-ink hex override (Inks table)
};

// Pantone color approximations (hex) for common Pantone numbers
var PANTONE_HEX = window.PANTONE_HEX || {};   // v-next: the table lives in pine-pantone-v1.js (shared, byte-identical in Seps, Screens and Ink)

// v83: normalize a singleSelect field read across API response shapes.
// v0 REST API returns singleSelects as plain strings ("EZP"); MCP tools return as
// {id, name} objects. This handles both so the same call site works either way.
function selName(v) {
  if (!v) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'object' && v.name) return v.name;
  return '';
}

// v83: detect a "blank canvas" TBA ink slot created by the seps app. Seps mints a real
// Inks record with Pantone Number = "TBA M/D" (e.g. "TBA 4/30") and links it to the
// imprint. Ink Queue eventually edits the same record in place when the operator types
// in a real Pantone. Until that happens we treat these as not-real-yet for display.
function isTbaInk(cachedFields) {
  if (!cachedFields) return false;
  var pn = cachedFields[FI.pantone];
  if (!pn || typeof pn !== 'string') return false;
  return /^\s*TBA\b/i.test(pn);
}

// v77: optional inkFields argument — when provided, an explicit Display Hex override
// on the Inks record wins over name-based lookup. Falls through to the static map otherwise.
function isValidHex(s) {
  if (!s) return false;
  return /^#?[0-9A-Fa-f]{6}$/.test(String(s).trim());
}
function normalizeHex(s) {
  var t = String(s).trim();
  return t.charAt(0) === '#' ? t : '#' + t;
}
function getPantoneHex(inkName, inkFields) {
  // v77: explicit override wins
  if (inkFields && inkFields[FI.displayHex]) {
    var override = inkFields[FI.displayHex];
    if (isValidHex(override)) return normalizeHex(override);
  }
  if (!inkName) return null;
  var hexMatch = inkName.match(/#([0-9A-Fa-f]{6})/);
  if (hexMatch) return '#' + hexMatch[1];
  var m = inkName.match(/Pantone\s+([^\-]+?)(?:\s*-|$)/i);
  if (!m) return null;
  var code = m[1].trim();
  if (PANTONE_HEX[code]) return PANTONE_HEX[code];
  var upper = code.toUpperCase();
  if (PANTONE_HEX[upper]) return PANTONE_HEX[upper];
  var numOnly = code.replace(/[\s\(].*$/, '').trim();
  if (PANTONE_HEX[numOnly]) return PANTONE_HEX[numOnly];
  return null;
}

// v95: ink type is a plain fact → cream tag (the old green/orange/purple badges weren't brand colors)
function inkTypeBadge(typeName) {
  if (!typeName) return '';
  return '<span class="p-tag p-tag-soft">' + escHtml(typeName) + '</span>';
}

// State
var pat = null, allJobs = [], pipelineJobs = [], inkCache = {}, openDetailId = null, activeFilter = "all";
var pmPdfDoc = null, pmPage = 1, pmTotal = 1;
var searchQ = '';          // v95: filter-row search (customer, order #, imprint, design)
var pickId = null;         // v95: the job shown in the right pane (two-pane view, >=1100px)
var shownIds = [];         // v95: jobs in list order, for ↑/↓
var loadedOnce = false;

function $(id) { return document.getElementById(id); }

// v95: lookups cover the dated queue AND the No-date pipeline (v94 only searched allJobs, so a
// No-date job opened to an empty box and its edits never updated the in-memory record).
function findRec(id) {
  return allJobs.find(function(r) { return r.id === id; }) ||
         pipelineJobs.find(function(r) { return r.id === id; }) || null;
}
function allRecs() { return allJobs.concat(pipelineJobs); }

window.onload = function() {
  syncPractice();
  try { pat = localStorage.getItem('pine_at_key'); } catch (e) { pat = null; }
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  renderChips();
  if (!pat) {
    $('root').innerHTML = '<div class="msg err"><b>Airtable token needed</b>Paste your token in the &#9881; menu at the top right.</div>';
    showMenu(true);
    return;
  }
  loadJobs();
};

// ---------- ⚙ menu: token + practice (v95; was a token strip + 🔑 button) ----------
function showMenu(on) {
  var m = $('menu'); if (!m) return;
  m.hidden = !on;
  $('menuBtn').setAttribute('aria-expanded', on ? 'true' : 'false');
  if (on) {
    var inp = $('tokenInput');
    var cur = ''; try { cur = localStorage.getItem('pine_at_key') || ''; } catch (e) {}
    inp.value = '';
    inp.placeholder = cur ? 'Paste a new token to replace it' : 'pat…';
    if (!cur) inp.focus();
  }
}
document.addEventListener('pointerdown', function(e) {
  var m = $('menu');

function savesPending() {
  return Object.keys(debounceTimers).length > 0 ||
    Object.keys(saveOutstanding).some(function(k) { return saveOutstanding[k] > 0; });
}

function syncPractice() {
  $('practicePill').hidden = !PRACTICE;
  $('practiceHint').textContent = PRACTICE ? 'On — nothing is saved' : 'Off — changes save to Airtable';

// ---------- toast: one at a time, optional Undo (v95; replaces alert()) ----------
var toastTimer = null;
function hideToast() { var t = $('toast'); if (t) t.hidden = true; clearTimeout(toastTimer); }
function toast(msg, opts) {
  opts = opts || {};
  var t = $('toast'); if (!t) return;
  t.innerHTML = '<span>' + escHtml(msg) + '</span>';
  if (opts.undo) {
    var b = document.createElement('button');
    b.className = 'p-btn'; b.type = 'button'; b.textContent = 'Undo';
    b.onclick = function() { hideToast(); opts.undo(); };
    t.appendChild(b);
  }
  t.classList.toggle('is-alert', !!opts.alert);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opts.ms || (opts.undo ? 6000 : (opts.alert ? 6000 : 3200)));
}

function refreshNow() {
  if (savesPending()) { toast('Still saving the last change — one moment'); return; }
  if (window.PineUpdate && PineUpdate.check) PineUpdate.check();
  if (!pat) { showMenu(true); return; }

// v95: self-update waits while someone is mid-task (a save running or queued, a pop-up or the ⚙ menu open,
// typing in a field, the add-ink form open, or — below 1100px — a job open in place).
window.pineBusy = function() {
  try {
    if (savesPending()) return true;
    if (!$('menu').hidden) return true;
    if (document.querySelector('.ovl.open,.pm.open,.add-ink.open,.chip-popover')) return true;
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'q') return true;
    if (!isWide() && openDetailId) return true;
    return false;
  } catch (e) { return true; }
};

function api(path, opts) {
  opts = opts || {};
  var method = (opts.method || 'GET').toUpperCase();
  // v95: practice — every write (PATCH/POST/DELETE) stops here. Nothing is sent; callers get back what they sent.
  if (PRACTICE && method !== 'GET') return practiceWrite(path, method, opts.body);
  return fetch('https://api.airtable.com/v0/' + BASE + '/' + path, {
    method: method,
    headers: { 'Authorization': 'Bearer ' + pat, 'Content-Type': 'application/json' },
    body: opts.body || undefined
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(j) { throw new Error(j.error ? (j.error.message || j.error.type || j.error) : 'HTTP ' + r.status); }, function() { throw new Error('HTTP ' + r.status); });
    return r.json();
  });
}

// v95: the fake answer for a practice write. Same shape as Airtable's reply, so the screen behaves as live.
function fakeRecId() {
  var c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', s = 'rec';
  for (var i = 0; i < 14; i++) s += c.charAt(Math.floor(Math.random() * c.length));
  return s;
}
var practiceNoteAt = 0;
function practiceWrite(path, method, body) {
  var parsed = {}; try { parsed = JSON.parse(body || '{}'); } catch (e) {}
  var fields = parsed.fields || {};
  var m = String(path).match(/^(tbl[A-Za-z0-9]+)(?:\/(rec[A-Za-z0-9]+))?/);
  var tbl = m ? m[1] : '', rid = (m && m[2]) || '';
  if (method === 'POST') rid = fakeRecId();
  var out = {};
  Object.keys(fields).forEach(function(k) { out[k] = fields[k]; });
  if (tbl === TIN && method !== 'DELETE') {
    // the Inks Name is a formula in Airtable; rebuild it so the swatches and labels show the new color
    var base = (rid && inkCache[rid]) ? Object.assign({}, inkCache[rid]) : {};
    Object.keys(fields).forEach(function(k) { base[k] = fields[k]; });
    var pn = base[FI.pantone], tn = selName(base[FI.type]);
    if (pn) out[FI.name] = 'Pantone ' + pn + (tn ? ' - ' + tn : '');
  }
  console.log('[practice] not sent:', method, path, JSON.stringify(fields));
  if (Date.now() - practiceNoteAt > 5000) { practiceNoteAt = Date.now(); toast('Practice — not saved'); }
  return new Promise(function(res) {
    setTimeout(function() { res(method === 'DELETE' ? { id: rid, deleted: true } : { id: rid, createdTime: new Date().toISOString(), fields: out }); }, 120);
  });
}

// ============================================================
// WRITE ENGINE v70 — debounced auto-save with per-card save pip
// ============================================================
// Valid singleSelect choices on Inks.Ink Type field (fldXMM4WvS3SGsliC)
var INK_TYPE_CHOICES = ['Discharge','Direct-to-fabric','OW','SOW','EZP','Graphics','Clr - 224.9'];

// Per-imprint save state machine. Each imprint card has its own pip.
// outstanding[recId] = count of in-flight saves; pending[recId] = true if dirty
var saveOutstanding = {};
var saveDirty = {};
var saveErr = {};
var savedFadeTimer = {};

// v95: a job can show in two places at once (list card + right pane), so the pip is every [data-pip=id].
function pipEls(impRecId) { return document.querySelectorAll('[data-pip="' + impRecId + '"]'); }
function setSavePip(impRecId, state, msg) {
  var els = pipEls(impRecId);
  var label = msg || '';
  if (!label) {
    if (state === 'dirty') label = 'Editing…';
    else if (state === 'saving') label = PRACTICE ? 'Practice…' : 'Saving…';
    else if (state === 'saved') label = PRACTICE ? 'Practice — not saved' : 'Saved ✓';
    else if (state === 'err') label = 'Not saved';
  }
  for (var i = 0; i < els.length; i++) {
    els[i].className = 'save-pip ' + state;
    els[i].textContent = (state === 'idle') ? '' : label;
  }
  // Auto-fade saved after 2s
  if (savedFadeTimer[impRecId]) { clearTimeout(savedFadeTimer[impRecId]); savedFadeTimer[impRecId] = null; }
  if (state === 'saved') {
    savedFadeTimer[impRecId] = setTimeout(function() {
      // Only fade if still in saved state (not bumped to dirty/saving since)
      var cur = pipEls(impRecId)[0];
      if (cur && cur.classList.contains('saved')) setSavePip(impRecId, 'idle');
    }, 2200);
  }
}

function markDirty(impRecId) {
  saveDirty[impRecId] = true;
  // Show "Editing…" unless we're already mid-save (don't clobber the saving indicator)
  var el = pipEls(impRecId)[0];
  if (!el || !el.classList.contains('saving')) setSavePip(impRecId, 'dirty');
}

function beginSave(impRecId) {
  // v95: a new save starts clean — v94 kept the first error forever, so every later save still said "failed"
  if (!saveOutstanding[impRecId]) saveErr[impRecId] = null;
  saveOutstanding[impRecId] = (saveOutstanding[impRecId] || 0) + 1;
  setSavePip(impRecId, 'saving');
}

function endSave(impRecId, ok, errMsg) {
  saveOutstanding[impRecId] = Math.max(0, (saveOutstanding[impRecId] || 0) - 1);
  if (!ok) { saveErr[impRecId] = errMsg || 'Save failed'; }
  // Only resolve to a final state when no more saves are in flight for this card
  if (saveOutstanding[impRecId] === 0) {
    if (saveErr[impRecId]) {
      setSavePip(impRecId, 'err', 'Not saved');
      // v95: say it out loud (v94 said "click to retry" but had no retry)
      toast('Not saved: ' + String(saveErr[impRecId]).slice(0, 80) + '. Check the connection, then try again.', { alert: true });
    } else {
      saveDirty[impRecId] = false;
      setSavePip(impRecId, 'saved');
    }
  }
}

function clearSaveErr(impRecId) {
  saveErr[impRecId] = null;
  setSavePip(impRecId, 'idle');
}

// ---------- Debounce wrapper ----------
// Keyed debouncing — pass any unique key (ink record ID + field name works fine)
var debounceTimers = {};
function debounceSave(key, fn) {
  if (debounceTimers[key]) clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(function() {
    delete debounceTimers[key];
    fn();
  }, SAVE_DEBOUNCE_MS);
}

// ---------- Ink-record write helpers (Inks table) ----------
// PATCH a single Inks row. Optionally bumps Last Updated to today (Denver) if bumpDate=true.
// impRecId is the imprint card the user is editing FROM, used only for pip routing.
function patchInkRecord(inkRecId, fields, impRecId, bumpDate) {
  if (!WRITES_ENABLED) {
    console.log('[v83 PREVIEW] would PATCH ink', inkRecId, JSON.stringify(fields));
    if (impRecId) endSave(impRecId, true);
    return Promise.resolve(null);
  }
  if (bumpDate) {
    // Denver local date in YYYY-MM-DD
    var denverYMD = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Denver' });
    fields[FI.lastUpdated] = denverYMD;
  }
  if (impRecId) beginSave(impRecId);
  return api(TIN + '/' + inkRecId + '?returnFieldsByFieldId=true', {
    method: 'PATCH',
    body: JSON.stringify({ fields: fields })
  }).then(function(res) {
    // Refresh cached fields for that ink so any reopened cards see new values
    if (res && res.fields) {
      if (!inkCache[inkRecId]) inkCache[inkRecId] = {};
      Object.keys(res.fields).forEach(function(k) { inkCache[inkRecId][k] = res.fields[k]; });
    }
    if (impRecId) endSave(impRecId, true);
    // v76: refresh the chip strip on every card that links this ink, so name/color
    // changes show up immediately without a page reload.
    refreshCardsLinkingInk(inkRecId);
    return res;
  }).catch(function(err) {
    if (impRecId) endSave(impRecId, false, err.message);
    throw err;
  });
}

// POST a new Inks row. Returns the created record.
function createInkRecord(fields, impRecId) {
  if (!WRITES_ENABLED) {
    console.log('[v83 PREVIEW] would POST ink', JSON.stringify(fields));
    var fakeId = 'recPREVIEW' + Math.random().toString(36).slice(2, 10);
    if (impRecId) endSave(impRecId, true);
    return Promise.resolve({ id: fakeId, fields: fields });
  }
  if (impRecId) beginSave(impRecId);
  return api(TIN + '?returnFieldsByFieldId=true', {
    method: 'POST',
    body: JSON.stringify({ fields: fields })
  }).then(function(res) {
    if (res && res.id && res.fields) {
      inkCache[res.id] = res.fields;
    }
    if (impRecId) endSave(impRecId, true);
    return res;
  }).catch(function(err) {
    if (impRecId) endSave(impRecId, false, err.message);
    throw err;
  });
}

// ---------- Imprint-link mutation (Imprints.Inks field) ----------
// Compute the current set of linked ink record IDs from the DOM of an open card.
// We use DOM as source of truth because user-driven row add/remove happens visually before save.
function getCurrentInkIdsFromDom(impRecId) {
  var el = document.getElementById('inks-' + impRecId);
  if (!el) return null;
  var rows = el.querySelectorAll('.ink-row');
  var ids = [];
  for (var i = 0; i < rows.length; i++) {
    var inkId = rows[i].getAttribute('data-ink-id');
    if (inkId && /^rec[A-Za-z0-9]{14}$/.test(inkId)) ids.push(inkId);

// PATCH the imprint's Inks link field to match the supplied array of ink record IDs.
function patchImprintInks(impRecId, inkIds) {
  if (!WRITES_ENABLED) {
    console.log('[v83 PREVIEW] would PATCH imprint inks', impRecId, JSON.stringify(inkIds));
    endSave(impRecId, true);
    refreshCardInkStrip(impRecId); // preview-mode UI still refreshes
    return Promise.resolve(null);
  }
  beginSave(impRecId);
  return api(TI + '/' + impRecId + '?returnFieldsByFieldId=true', {
    method: 'PATCH',
    body: JSON.stringify({ fields: { [F.inks]: inkIds } })
  }).then(function(res) {
