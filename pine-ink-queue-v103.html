// ADD INK functions
function toggleAddInk(id) {
  var body = document.getElementById('add-ink-body-' + id);
  if (!body) return;
  body.classList.toggle('open');
  var on = body.classList.contains('open');
  var btn = $('add-ink-btn-' + id); if (btn) { btn.setAttribute('aria-expanded', on ? 'true' : 'false'); btn.hidden = on; }
  if (on) { var s = $('ai-search-' + id); if (s) s.focus(); }
}

function saveNewInk(id) {
  var pantone = (document.getElementById('ai-pantone-' + id) || {}).value || '';
  var type = (document.getElementById('ai-type-' + id) || {}).value || '';
  var mfr = (document.getElementById('ai-mfr-' + id) || {}).value || '';
  var recipe = (document.getElementById('ai-recipe-' + id) || {}).value || '';
  if (!pantone) { toast('Type the Pantone number first'); var pe = $('ai-pantone-' + id); if (pe) { pe.classList.add('is-bad'); pe.focus(); } return; }
  var pe2 = $('ai-pantone-' + id); if (pe2) pe2.classList.remove('is-bad');

  // Determine whether the user picked an existing ink from the dropdown
  var fnEl = document.getElementById('ai-fullname-' + id);
  var storedKey = (fnEl && fnEl._storeKey) || '';
  var storedData = storedKey ? (labelStore[storedKey] || {}) : {};
  var existingRecId = storedData.recId || null;

  var vals = { pantone: pantone, type: type, mfr: mfr, recipe: recipe };

  // v84: if the user loaded an existing library color and then changed any of its
  // master fields (Pantone / Type / Mfr / Recipe) in the form, we no longer silently
  // discard the edit. We detect the diff and ask whether to UPDATE the master color
  // everywhere it's used, or CREATE a new color. No edit -> plain append (unchanged).
  if (existingRecId) {
    var changed = {};
    if (pantone !== (storedData.pantone || '')) changed[FI.pantone] = pantone;
    if (type    !== (storedData.type    || '')) changed[FI.type]    = type || null;  // singleSelect: plain string, null to clear
    if (mfr     !== (storedData.mfr     || '')) changed[FI.mfr]     = mfr  || null;  // singleSelect: null to clear
    if (recipe  !== (storedData.recipe  || '')) changed[FI.recipe]  = recipe;

    if (Object.keys(changed).length) {
      // Defer: ask update-vs-create. markDirty happens when a choice is made.
      showInkEditConfirm(id, existingRecId, storedData, vals, changed);
      return;
    }
    // No master-field changes -> append the existing color as-is.
    markDirty(id);
    finishAddInkToJob(id, Promise.resolve({ id: existingRecId, fields: {
      [FI.pantone]: pantone,
      [FI.type]: type ? { name: type } : null,
      [FI.mfr]: mfr ? { name: mfr } : null,
      [FI.recipe]: recipe
    }, _existing: true }), storedData, vals, false);
    return;
  }

  // Path B — brand new color (no existing record was loaded)
  markDirty(id);
  finishAddInkToJob(id, createNewInkPromise(id, vals), storedData, vals, true);
}

// v84: build the createInkRecord promise for a brand-new color from form values.
function createNewInkPromise(id, vals) {
  var newFields = { [FI.pantone]: vals.pantone };
  if (vals.type)   newFields[FI.type]   = vals.type;
  if (vals.mfr)    newFields[FI.mfr]    = vals.mfr;
  if (vals.recipe) newFields[FI.recipe] = vals.recipe;
  // Seed Last Updated to today so library timestamps are correct
  newFields[FI.lastUpdated] = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Denver' });
  return createInkRecord(newFields, id);
}

// v84: link a resolved ink record to the imprint + optimistic DOM. Extracted from
// the old saveNewInk tail so it can be reused by the append / update / create paths.
// freshUpdated=true means the color's master data was just written, so display
// today's date and re-render an already-linked inline row to show the new values.
function finishAddInkToJob(id, inkRowPromise, storedData, vals, freshUpdated) {
  var pantone = vals.pantone, type = vals.type, mfr = vals.mfr, recipe = vals.recipe;
  inkRowPromise.then(function(rec) {
    if (!rec || !rec.id) throw new Error('No record returned');
    var inkRecId = rec.id;

    // Get the current ink IDs from DOM (in case user has been working) + the new one
    var existingIds = getCurrentInkIdsFromDom(id) || [];
    if (existingIds.indexOf(inkRecId) !== -1) {
      // Already linked — don't re-add.
      console.log('Ink already linked, skipping append');
      clearAddInkForm(id);
      // If we just rewrote the master color, refresh the open detail so the inline
      // row's type badge / recipe reflect the new values.
      if (freshUpdated) {
        var detEl = document.getElementById('detail-' + id);
        if (detEl && detEl.firstChild) renderDetail(id, detEl);
      }
      setSavePip(id, 'saved');
      return;
    }
    var newIds = existingIds.concat([inkRecId]);

    // Build DOM row immediately (optimistic)
    var todayYMD = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Denver' });
    var displayCreated = (storedData && storedData.createdTime) || (rec.fields && rec.fields._createdTime) || '';
    var displayUpdated = freshUpdated
      ? ((rec.fields && rec.fields[FI.lastUpdated]) || todayYMD)
      : ((storedData && storedData.lastUpdated) || (rec.fields && rec.fields[FI.lastUpdated]) || todayYMD);
    appendInkRowToDom(id, inkRecId, {
      name: (type ? 'Pantone ' + pantone + ' - ' + type : 'Pantone ' + pantone),
      pantone: pantone, type: type, mfr: mfr, recipe: recipe,
      createdTime: displayCreated,
      lastUpdated: displayUpdated
    });

    // PATCH the imprint's Inks link field
    return patchImprintInks(id, newIds).then(function() {
      // Update header count + Print all / Copy buttons; the card's tags come from patchImprintInks
      syncInkButtons(id, newIds.length);
      var noMsg = document.getElementById('no-inks-msg-' + id);
      if (noMsg) noMsg.remove();
      clearAddInkForm(id);
      toast('Added ' + abbreviateInkName(type ? 'Pantone ' + pantone + ' - ' + type : 'Pantone ' + pantone));
    });
  }).catch(function(err) {
    console.warn('Add ink failed', err);
    toast('Could not add the ink: ' + err.message, { alert: true });
  });
}

// v84: update-vs-create confirm modal state + controller.
var pendingInkEdit = null; // { id, existingRecId, storedData, vals, changed }

var INK_EDIT_LABELS = {};
INK_EDIT_LABELS[FI.pantone] = 'Pantone';
INK_EDIT_LABELS[FI.type]    = 'Type';
INK_EDIT_LABELS[FI.mfr]     = 'Manufacturer';
INK_EDIT_LABELS[FI.recipe]  = 'Recipe';

function showInkEditConfirm(id, existingRecId, storedData, vals, changed) {
  pendingInkEdit = { id: id, existingRecId: existingRecId, storedData: storedData, vals: vals, changed: changed };
  var origByField = {};
  origByField[FI.pantone] = storedData.pantone || '';
  origByField[FI.type]    = storedData.type    || '';
  origByField[FI.mfr]     = storedData.mfr     || '';
  origByField[FI.recipe]  = storedData.recipe  || '';
  var rows = '';
  Object.keys(changed).forEach(function(fid) {
    var label = INK_EDIT_LABELS[fid] || fid;
    var oldV = origByField[fid] || '(empty)';
    var newV = changed[fid] || '(empty)';
    if (fid === FI.recipe) { oldV = oldV.split('\n')[0] || '(empty)'; newV = newV.split('\n')[0] || '(empty)'; }
    rows += '<div class="iec-diff-row">' + escHtml(label) + ': ' + escHtml(oldV) + ' \u2192 <b>' + escHtml(newV) + '</b></div>';
  });
  var nm = storedData.name || ('Pantone ' + (storedData.pantone || ''));
  var bodyEl = document.getElementById('iecBody');
  if (bodyEl) {
    bodyEl.innerHTML =
      'You changed an existing color, <span class="iec-name">' + escHtml(nm) + '</span>.' +
      '<div class="iec-diff">' + rows + '</div>';
  }
  var modal = document.getElementById('inkEditConfirm');
  if (modal) modal.classList.add('open');
}

function closeInkEditConfirm() {
  var modal = document.getElementById('inkEditConfirm');
  if (modal) modal.classList.remove('open');
  pendingInkEdit = null;
}

function inkEditConfirmChoose(choice) {
  var p = pendingInkEdit;
  var modal = document.getElementById('inkEditConfirm');
  if (modal) modal.classList.remove('open');
  pendingInkEdit = null;
  if (!p) return;

  if (choice === 'cancel') {
    // Leave the form as-is so the user can adjust; nothing written.
    return;
  }

  markDirty(p.id);

  if (choice === 'update') {
    // Write the changed master fields to the existing color (bumps Last Updated),
    // then link it to the job. Affects every imprint using this color.
    var prom = patchInkRecord(p.existingRecId, p.changed, p.id, true).then(function(res) {
      return (res && res.id) ? res : { id: p.existingRecId, fields: {} };
    });
    finishAddInkToJob(p.id, prom, p.storedData, p.vals, true);
  } else { // 'create'
    finishAddInkToJob(p.id, createNewInkPromise(p.id, p.vals), p.storedData, p.vals, true);
  }
}

// ============================================================
// v85 — COPY / PASTE COLORS BETWEEN LOCATIONS
// Front and Back are separate imprint records; inks are shared library records.
// Copy stashes the source imprint's real (non-TBA) ink IDs in order; paste links
// them onto the target imprint. If the target already has colors, ask replace vs merge.
// ============================================================
var inkClipboard = null;  // { srcId, label, inkIds:[recId,...] }
var pendingPaste = null;  // { targetId, copied:[recId,...] }

// Short human label for the source imprint, e.g. "Front (9697-A)".
function impClipLabel(rec) {
  if (!rec) return 'the other location';
  var f = rec.fields || {};
  var loc = selName(f[F.loc]) || '';
  var iid = f[F.imprintId] || '';
  if (loc && iid) return loc + ' (' + iid + ')';
  return loc || iid || 'the other location';
}

function copyInks(impRecId) {
  // Use the live DOM as source of truth (reflects any unsaved add/remove/reorder),
  // then drop TBA placeholder slots.
  var ids = (getCurrentInkIdsFromDom(impRecId) || []).filter(function(iid) {
    var c = inkCache[iid];
    return !(c && isTbaInk(c));
  });
  if (!ids.length) { toast('No colors to copy here yet'); return; }
  var rec = findRec(impRecId);
  inkClipboard = { srcId: impRecId, label: impClipLabel(rec), inkIds: ids };
  setSavePip(impRecId, 'saved', 'Copied ' + ids.length + ' color' + (ids.length > 1 ? 's' : ''));
  toast('Copied ' + ids.length + ' color' + (ids.length > 1 ? 's' : '') + ' \u2014 open the other location and tap Paste');
  refreshAllPasteButtons();
}

function updatePasteBtn(impRecId) {
  var btn = document.getElementById('paste-inks-btn-' + impRecId);
  if (!btn) return;
  if (inkClipboard && inkClipboard.inkIds.length && inkClipboard.srcId !== impRecId) {
    var n = inkClipboard.inkIds.length;
    btn.textContent = 'Paste ' + n + ' color' + (n > 1 ? 's' : '') + ' from ' + inkClipboard.label;
    btn.style.display = '';
  } else {
    btn.style.display = 'none';
  }
}

function refreshAllPasteButtons() {
  if (!Array.isArray(allJobs)) return;
  allRecs().forEach(function(r) {
    if (document.getElementById('paste-inks-btn-' + r.id)) updatePasteBtn(r.id);
  });
}

function pasteInks(targetId) {
  if (!inkClipboard || !inkClipboard.inkIds.length) return;
  if (inkClipboard.srcId === targetId) {
    toast('This is the location you copied from \u2014 open the other one to paste');
    return;
  }
  var copied = inkClipboard.inkIds.slice();
  var existingAll = getCurrentInkIdsFromDom(targetId) || [];
  var realExisting = existingAll.filter(function(iid) {
    var c = inkCache[iid];
    return !(c && isTbaInk(c));
  });
  if (!realExisting.length) {
    // Empty (or TBA-only) location — just drop the colors in, no prompt needed.
    applyPaste(targetId, copied, 'replace');
  } else {
    showPasteConfirm(targetId, copied, realExisting.length);
  }
}

function showPasteConfirm(targetId, copied, existingCount) {
  pendingPaste = { targetId: targetId, copied: copied };
  var body = document.getElementById('pccBody');
  if (body) {
    var n = copied.length;
    body.innerHTML =
      'This location already has <b>' + existingCount + '</b> color' + (existingCount > 1 ? 's' : '') + '. ' +
      'Paste <b>' + n + '</b> color' + (n > 1 ? 's' : '') + ' from <span class="iec-name">' +
      escHtml(inkClipboard ? inkClipboard.label : 'the other location') + '</span>?';
  }
  var m = document.getElementById('pasteColorsConfirm');
  if (m) m.classList.add('open');
}

function closePasteConfirm() {
  var m = document.getElementById('pasteColorsConfirm');
  if (m) m.classList.remove('open');
  pendingPaste = null;
}

function pasteConfirmChoose(mode) {
  var p = pendingPaste;
  var m = document.getElementById('pasteColorsConfirm');
  if (m) m.classList.remove('open');
  pendingPaste = null;
  if (!p || mode === 'cancel') return;

  var finalIds;
  if (mode === 'replace') {
    finalIds = p.copied.slice();
  } else { // merge — keep everything currently there, append copied not already present
    finalIds = (getCurrentInkIdsFromDom(p.targetId) || []).slice();
    p.copied.forEach(function(iid) { if (finalIds.indexOf(iid) === -1) finalIds.push(iid); });
  }
  applyPaste(p.targetId, finalIds, mode);
}

function applyPaste(targetId, finalIds, mode) {
  markDirty(targetId);
  patchImprintInks(targetId, finalIds).then(function() {
    // patchImprintInks updates the in-memory record + collapsed chip strip; re-render
    // the open detail so the ink rows reflect the new list (loadInkRecipes fetches any
    // not-yet-cached colors).
    var detEl = document.getElementById('detail-' + targetId);
    if (detEl && detEl.firstChild) renderDetail(targetId, detEl);
    setSavePip(targetId, 'saved', (mode === 'replace' ? 'Pasted colors' : 'Merged colors'));
  }).catch(function(err) {
    console.warn('Paste colors failed', err);
    toast('Could not paste the colors: ' + err.message, { alert: true });
  });
}

// Append an ink row to the imprint's inks list in DOM (optimistic UI for saveNewInk)
var inkRowSeq = 0;
function appendInkRowToDom(impRecId, inkRecId, d) {
  var el = document.getElementById('inks-' + impRecId);
  if (!el) return;
  // If currently showing "No inks yet", clear it
  var noMsg = document.getElementById('no-inks-msg-' + impRecId);
  if (noMsg) noMsg.remove();
  var cachedFields = inkCache[inkRecId] || null;
  var rowIdx = 'a' + (++inkRowSeq);   // v95: unique (v94 reused a removed row's number, so Remove could take off the wrong row)
  el.insertAdjacentHTML('beforeend', inkRowHtml(impRecId, inkRecId, rowIdx, {
    name: d.name, pantone: d.pantone, type: d.type, mfr: d.mfr, recipe: d.recipe,
    createdTime: d.createdTime, lastUpdated: d.lastUpdated, hex: getPantoneHex(d.name, cachedFields), isTba: false
  }, false));
}

// v73: shared save path for both arrow-driven and drag-and-drop reorder
function saveReorderedInks(impRecId, ids) {
  markDirty(impRecId);
  patchImprintInks(impRecId, ids).catch(function(err) {
    console.warn('Reorder save failed', err);
    toast('Could not save the new order: ' + err.message, { alert: true });
    // Reload panel to recover real state
    var detailEl = document.getElementById('detail-' + impRecId);
    if (detailEl && detailEl.firstChild) renderDetail(impRecId, detailEl);
  });
}

// v73: Drag-and-drop reorder. Drag handle on each row is the draggable element;
// drop target is the row itself. Drop position (top half vs bottom half of target row)
// determines whether the dragged ink lands above or below.
var dragState = { impRecId: null, inkRecId: null, sourceRow: null };

function onInkRowDragStart(e, impRecId, inkRecId) {
  // v74: defensive — clear any leftover .dragging class from a previous drag that didn't end cleanly
  var stale = document.querySelectorAll('.ink-row.dragging, .ink-row.drag-over-top, .ink-row.drag-over-bottom');
  for (var i = 0; i < stale.length; i++) {
    stale[i].classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
  }
  dragState.impRecId = impRecId;
  dragState.inkRecId = inkRecId;
  var row = document.getElementById('inks-' + impRecId).querySelector('.ink-row[data-ink-id="' + inkRecId + '"]');
  dragState.sourceRow = row;
  if (row) {
    row.classList.add('dragging');
    // Use the entire row as the drag image (rather than just the handle)
    try { e.dataTransfer.setDragImage(row, 20, 20); } catch(_) {}
  }
  // Set drag data — required for Firefox to fire drag events
  try { e.dataTransfer.setData('text/plain', inkRecId); } catch(_) {}
  e.dataTransfer.effectAllowed = 'move';
}

function onInkRowDragOver(e) {
  if (!dragState.inkRecId) return;
  e.preventDefault(); // allow drop
  e.dataTransfer.dropEffect = 'move';
  // Highlight insertion point — top half = drop above, bottom half = drop below
  var row = e.currentTarget;
  if (!row || row === dragState.sourceRow) return;
  // Must be a row in the same imprint's list
  var listEl = row.parentNode;
  if (!listEl || listEl.id !== 'inks-' + dragState.impRecId) return;
  var rect = row.getBoundingClientRect();
  var isTopHalf = (e.clientY - rect.top) < rect.height / 2;
  // Clear any previous markers on this row, then set the correct one
  row.classList.remove('drag-over-top', 'drag-over-bottom');
  row.classList.add(isTopHalf ? 'drag-over-top' : 'drag-over-bottom');
}

function onInkRowDragLeave(e) {
  var row = e.currentTarget;
  if (row) row.classList.remove('drag-over-top', 'drag-over-bottom');
}

function onInkRowDrop(e, impRecId, targetInkId) {
  e.preventDefault();
  if (!dragState.inkRecId || dragState.impRecId !== impRecId) { resetDragState(); return; }
  var sourceInkId = dragState.inkRecId;
  if (sourceInkId === targetInkId) { resetDragState(); return; }

  // Determine drop position from where the pointer landed on the target row
  var targetRow = e.currentTarget;
  var rect = targetRow.getBoundingClientRect();
  var isTopHalf = (e.clientY - rect.top) < rect.height / 2;
  targetRow.classList.remove('drag-over-top', 'drag-over-bottom');

  // Rebuild the ID array with source removed and inserted at target position
  var ids = getCurrentInkIdsFromDom(impRecId);
  if (!ids) { resetDragState(); return; }
  var srcIdx = ids.indexOf(sourceInkId);
  if (srcIdx === -1) { resetDragState(); return; }
  ids.splice(srcIdx, 1);
  var tgtIdx = ids.indexOf(targetInkId);
  if (tgtIdx === -1) { resetDragState(); return; }
  var insertAt = isTopHalf ? tgtIdx : tgtIdx + 1;
  ids.splice(insertAt, 0, sourceInkId);

  // Reorder DOM to match
  var listEl = document.getElementById('inks-' + impRecId);
  if (listEl && dragState.sourceRow) {
    if (isTopHalf) {
      listEl.insertBefore(dragState.sourceRow, targetRow);
    } else if (targetRow.nextSibling) {
      listEl.insertBefore(dragState.sourceRow, targetRow.nextSibling);
    } else {
      listEl.appendChild(dragState.sourceRow);
    }
  }

  saveReorderedInks(impRecId, ids);
  resetDragState();
}

// v74: clear .dragging class from ALL rows on drag end — fixes v73 bug where source row
// stayed greyed out because resetDragState() in onInkRowDrop cleared the reference before
// dragend fired.
function onInkRowDragEnd(e) {
  var allRows = document.querySelectorAll('.ink-row');
  for (var i = 0; i < allRows.length; i++) {
    allRows[i].classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
  }
  resetDragState();
}

function resetDragState() {
  dragState.impRecId = null;
  dragState.inkRecId = null;
  dragState.sourceRow = null;
}

// v97: while an ink is dragged, holding it within 90px of the top or bottom of the job scrolls it, faster nearer
// the edge — the inks column on wide screens (the only part of the open job that scrolls), the page otherwise
// (below the sticky bar). Ink Queue has no sticky bottom bar, so the window bottom is the bottom edge. Browsers
// don't scroll an inner pane during a drag on their own (Stephen, same as Seps: "if I try to scroll up it doesn't
// move the screen"). Same as Seps v37.
var dragAuto = { y: null, raf: 0 };
// the nearest scrolling box around the dragged ink (the inks column on wide screens); none = the page scrolls.
// The ink list itself never gets its own scroll box, so a drag can always reach the first ink.
function dragScroller() {
  var el = dragState.sourceRow;
  for (el = el && el.parentElement; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
    var oy = getComputedStyle(el).overflowY;
    if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 1) return el;
  }
  return null;
}
function dragAutoTick() {
  dragAuto.raf = 0;
  if (!dragState.inkRecId || dragAuto.y == null) return;
  var box = dragScroller(), top, bottom;
  if (box) { var r = box.getBoundingClientRect(); top = r.top; bottom = Math.min(r.bottom, window.innerHeight); }
  else {
    var bar = document.querySelector('.p-bar'), fl = $('filters');
    top = Math.max(0, bar ? bar.getBoundingClientRect().bottom : 0, fl && getComputedStyle(fl).position === 'sticky' ? fl.getBoundingClientRect().bottom : 0);
    bottom = window.innerHeight;
  }
  var zone = 90, step = 0;
  if (dragAuto.y < top + zone) step = -Math.ceil((top + zone - dragAuto.y) / 6);
  else if (dragAuto.y > bottom - zone) step = Math.ceil((dragAuto.y - (bottom - zone)) / 6);
  if (step) { if (box) box.scrollTop += step; else window.scrollBy(0, step); }
  dragAuto.raf = requestAnimationFrame(dragAutoTick);
}
document.addEventListener('dragover', function(e) {
  if (!dragState.inkRecId) return;
  dragAuto.y = e.clientY;
  if (!dragAuto.raf) dragAuto.raf = requestAnimationFrame(dragAutoTick);
}, true);
function dragAutoStop() { dragAuto.y = null; if (dragAuto.raf) cancelAnimationFrame(dragAuto.raf); dragAuto.raf = 0; }
document.addEventListener('dragend', dragAutoStop, true);
document.addEventListener('drop', dragAutoStop, true);


function clearAddInkForm(id) {
  var fields = ['ai-search-', 'ai-fullname-', 'ai-pantone-', 'ai-type-', 'ai-mfr-', 'ai-recipe-'];
  fields.forEach(function(f) {
    var el = document.getElementById(f + id);
    if (el) { el.value = ''; if (el._storeKey) el._storeKey = ''; }
  });
  toggleAddInk(id);
}

// Per-ink ephemeral edit state — tracks dirty status (name/recipe edit buffer)
var localEdits = {}; // localEdits[inkRecId] = { name?, recipe?, nameValid? }

// ─── Recipe textarea — debounced PATCH to Inks.Recipe ─────────────────────────
function onInkRecipeInput(impRecId, inkRecId, val) {
  if (!localEdits[inkRecId]) localEdits[inkRecId] = {};
  localEdits[inkRecId].recipe = val;
  markDirty(impRecId);
  debounceSave('recipe:' + inkRecId, function() {
    var fields = {};
    fields[FI.recipe] = val;
    patchInkRecord(inkRecId, fields, impRecId, false).then(function() {
      delete localEdits[inkRecId].recipe;
    }).catch(function(err) {
      console.warn('Recipe save failed', err);
    });
  });
}

// v72: print notes auto-save (debounced PATCH to Imprints.Print Notes)
function onPrintNotesInput(impRecId, val) {
  markDirty(impRecId);
  debounceSave('printnotes:' + impRecId, function() {
    patchImprintField(impRecId, F.printNotes, val).catch(function(err) {
      console.warn('Print notes save failed', err);
    });
  });
}

// v76: Ink Notes on the collapsed card — debounced PATCH to Imprints.Ink Notes.
// No-op if F.inkNotes field ID isn't configured (shouldn't be wired in markup, but defensive).
function onCardInkNotesInput(impRecId, val) {
  if (!F.inkNotes) return;
  markDirty(impRecId);
  debounceSave('inknotes:' + impRecId, function() {
    patchImprintField(impRecId, F.inkNotes, val).then(function() {
      refreshCardInkStrip(impRecId);   // v95: the card shows the note on its own line
    }).catch(function(err) {
      console.warn('Ink notes save failed', err);
    });
  });
}

// ─── Ink name input — parse to Pantone + Type, debounced PATCH ────────────────
function onInkNameInput(impRecId, inkRecId, val) {
  var inp = document.getElementById('name-' + impRecId + '-' + inkRecId);
  var hint = document.getElementById('namehint-' + impRecId + '-' + inkRecId);
  var parsed = parseInkName(val);
  // Visual feedback during typing — only flag invalid if user typed "Pantone X - Y" with bad Y
  if (parsed === null) {
    if (inp) inp.classList.add('invalid');
    if (hint) hint.classList.add('on');
    if (!localEdits[inkRecId]) localEdits[inkRecId] = {};
    localEdits[inkRecId].nameValid = false;
    return; // don't queue save
  }
  if (inp) inp.classList.remove('invalid');
  if (hint) hint.classList.remove('on');
  // Guard: if Pantone parsed to empty, don't queue a save (user is likely mid-edit)
  if (!parsed.pantone || !parsed.pantone.trim()) return;
  if (!localEdits[inkRecId]) localEdits[inkRecId] = {};
  localEdits[inkRecId].name = val;
  localEdits[inkRecId].nameValid = true;
  markDirty(impRecId);
  debounceSave('name:' + inkRecId, function() {
    var fields = {};
    fields[FI.pantone] = parsed.pantone;
    if (parsed.type !== null) fields[FI.type] = parsed.type;
    patchInkRecord(inkRecId, fields, impRecId, false).then(function(res) {
      // Refresh data-orig on the input so blur-revert (if any) compares against new canonical
      if (inp && res && res.fields) {
        // Rebuild canonical name from response
        var pn = res.fields[FI.pantone] || '';
        var tn = selName(res.fields[FI.type]);
        var canonical = tn ? ('Pantone ' + pn + ' - ' + tn) : ('Pantone ' + pn);
        inp.setAttribute('data-orig', canonical);
      }
      delete localEdits[inkRecId].name;
    }).catch(function(err) {
      console.warn('Name save failed', err);
    });
  });
}

// On blur, if the field is in invalid-name state, revert to last-known-good
function onInkNameBlur(impRecId, inkRecId, inp) {
  var ed = localEdits[inkRecId];
  if (ed && ed.nameValid === false) {
    var orig = inp.getAttribute('data-orig') || '';
    inp.value = orig;
    inp.classList.remove('invalid');
    var hint = document.getElementById('namehint-' + impRecId + '-' + inkRecId);
    if (hint) hint.classList.remove('on');
    delete ed.nameValid;
  }
}

// 📅 button — standalone save that bumps Last Updated to today on the master Ink record.
// Updates the on-screen "Updated" timestamp on this row immediately on success.
function bumpInkUpdated(impRecId, inkRecId) {
  var btn = document.getElementById('tsbtn-' + inkRecId);
  if (!btn) return;
  // Don't allow double-fire while a previous bump is in flight
  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('armed'); // visual feedback during save
  markDirty(impRecId);
  // Empty `fields` object; patchInkRecord with bumpDate=true will set FI.lastUpdated
  patchInkRecord(inkRecId, {}, impRecId, true).then(function(res) {
    btn.disabled = false;
    btn.classList.remove('armed');
    // Update the on-screen "Updated" date on this ink row
    var todayLabel = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', timeZone:'America/Denver' });
    var row = btn.closest('.ink-row');
    if (row) {
      // v95: find the "Updated" stamp by its word (v94 looked for the 2nd stamp, so an ink with no
      // Created date got a second "Updated"), and make the stamp line if the row had none
      var stamps = row.querySelectorAll('.ink-ts'), done = false;
      for (var i = 0; i < stamps.length; i++) {
        if (/^\s*Updated/.test(stamps[i].textContent)) { stamps[i].querySelector('span').textContent = todayLabel; done = true; }
      }
      btn.title = mixedTip(todayLabel);   // v98: the date lives in the tooltip
      if (!done) {
        var wrap = row.querySelector('.ink-timestamps');
        if (!wrap) {
          var meta = row.querySelector('.ink-meta');
          if (!meta) { meta = document.createElement('div'); meta.className = 'ink-meta'; var rc = row.querySelector('.ink-recipe'); rc.parentNode.insertBefore(meta, rc); }
          wrap = document.createElement('div'); wrap.className = 'ink-timestamps'; meta.appendChild(wrap);
        }
        var newTs = document.createElement('span');
        newTs.className = 'ink-ts';
        newTs.innerHTML = 'Updated <span>' + todayLabel + '</span>';
        wrap.appendChild(newTs);
      }
    }
  }).catch(function(err) {
    btn.disabled = false;
    btn.classList.remove('armed');
    console.warn('Bump Last Updated failed', err);
  });
}

// TOGGLE READY — immediate write, routed through save engine.
// v88: marking ready removes the card from the (not-ready) queue via re-render; counts refresh.
// v95: marking the job you have open moves you on: in two panes the next job that needs ink shows on
// the right; in place the job closes. A toast offers Undo.
function toggleReady(e, id) {
  if (e && e.stopPropagation) e.stopPropagation();
  var rec = findRec(id);
  if (!rec) return;
  var cur = rec.fields[F.inksReady] || false;
  var nxt = !cur;
  var impId = rec.fields[F.imprintId] || '';

  var wide = isWide();
  var scroller = document.scrollingElement || document.documentElement;
  var sy = scroller ? scroller.scrollTop : 0;
  var nx = null;
  if (nxt && wide && pickId === id) { nx = nextJobAfter(id); if (nx) { openDayOf(nx); pickId = nx; } }
  if (nxt && !wide && openDetailId === id) {
    nx = nextJobAfter(id);
    closeInPlace(id); openDetailId = null;
    if (nx) { openDayOf(nx); openDetailId = nx; }
  }

  // Optimistic: flip the field and re-render (ready jobs drop out of the queue)
  rec.fields[F.inksReady] = nxt;
  renderAll();
  if (!wide && nx && openDetailId === nx) {   // v97: in place, the next job opens with its head near the top
    var nc = $('card-' + nx);
    if (nc) { var nb = $('body-' + nx); if (nb) nb.hidden = false; requestAnimationFrame(function() { window.scrollBy(0, nc.getBoundingClientRect().top - 72); }); }
  } else if (!wide && scroller) requestAnimationFrame(function() { scroller.scrollTop = sy; });
  if (wide && pickId !== id) { var c = $('card-' + pickId); if (c) c.scrollIntoView({ block: 'nearest' }); }

  // Fire write (immediate). Revert + re-render on failure.
  patchImprintField(id, F.inksReady, nxt).then(function() {
    if (nxt) toast('Inks ready ✓ ' + impId, { undo: function() {
      if (isWide()) pickId = id;
      toggleReady(null, id);
    } });
  }).catch(function(err) {
    rec.fields[F.inksReady] = cur;
    renderAll();
    if (!wide && scroller) requestAnimationFrame(function() { scroller.scrollTop = sy; });
    toast('Not saved: ' + err.message, { alert: true });
  });
}

// Chip color editor (v77 Display Hex override). v95: kit look, closes on any outside tap.
var activeChipPopover = null;
function closeChipPopover() {
  if (activeChipPopover) { activeChipPopover.remove(); activeChipPopover = null; }
}
document.addEventListener('pointerdown', function(e) {
  if (activeChipPopover && !activeChipPopover.contains(e.target) && e.target !== activeChipPopover._chipEl) closeChipPopover();
});
function editChipColor(iid, chipEl) {
  closeChipPopover();
  var popover = document.createElement('div');
  popover.className = 'chip-popover';
  popover.setAttribute('role', 'dialog');
  popover.setAttribute('aria-label', 'Swatch color');
  var currentColor = chipEl.classList.contains('ink-chip-empty') ? '' : (chipEl.style.backgroundColor || '');
  var currentHex = currentColor ? rgbToHex(currentColor) : '';
  popover.innerHTML =
    '<span class="p-label">Swatch color (hex)</span>' +

    '<button class="p-btn p-btn-dark" type="button" onclick="applyChipColor(\'' + iid + '\');event.stopPropagation()">Set</button></div>' +
    '<span class="p-hint">Leave it blank to use the Pantone color.</span>';
  popover._chipEl = chipEl;
  document.body.appendChild(popover);
  // Below the swatch, kept on screen
  var rect = chipEl.getBoundingClientRect();
  var pw = popover.offsetWidth || 250, ph = popover.offsetHeight || 120;
  var left = Math.max(8, Math.min(rect.left, window.innerWidth - pw - 8));
  var top = rect.bottom + 6;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, rect.top - ph - 6);
  popover.style.left = left + 'px';
  popover.style.top = top + 'px';
  activeChipPopover = popover;
  var inp = document.getElementById('chex-' + iid);
  if (inp) {
    inp.focus();
    inp.select();
    inp.onkeydown = function(e) {
      if (e.key === 'Enter') applyChipColor(iid);

function applyChipColor(iid) {
  var inp = document.getElementById('chex-' + iid);
  if (!inp) {
    // Fallback: find input in active popover
    if (activeChipPopover) inp = activeChipPopover.querySelector('.p-input');
  }
  if (!inp) return;
  var hex = inp.value.trim();
  // Empty input = clear the override (chip falls back to Pantone map)
  var clearOverride = (hex === '' || hex === '#');
  if (!clearOverride) {
    if (!hex.startsWith('#')) hex = '#' + hex;
    if (!/^#[0-9a-fA-F]{6}$/.test(hex)) {
      inp.classList.add('is-bad');
      inp.focus();
      return;
    }
  }
  // Find chip — try by iid first, then by data stored on popover
  var chip = document.getElementById('chip-' + iid);
  if (!chip && activeChipPopover && activeChipPopover._chipEl) chip = activeChipPopover._chipEl;

  // v77: optimistic DOM update — apply or revert color immediately
  if (chip) {
    if (clearOverride) {
      // Revert chip — re-derive color from the ink's name + static map (no override)
      var cached = inkCache[iid] || {};
      var nm = cached[FI.name] || '';
      // Clear the override on a temporary copy so getPantoneHex falls back
      var staticHex = getPantoneHex(nm, {});
      if (staticHex) {
        chip.style.background = staticHex;
        chip.style.borderColor = 'rgba(0,0,0,.15)';
        chip.classList.remove('ink-chip-empty');
        chip.textContent = '';
      } else {
        chip.style.background = 'var(--bg)';
        chip.style.borderColor = 'var(--border)';
        chip.classList.add('ink-chip-empty');
        chip.textContent = '?';
      }
    } else {
      chip.style.background = hex;
      chip.style.borderColor = 'rgba(0,0,0,.15)';
      chip.classList.remove('ink-chip-empty');
      chip.textContent = '';
    }
  }
  if (activeChipPopover) { activeChipPopover.remove(); activeChipPopover = null; }

  // v77: persist to Inks.Display Hex. Routes the pip through the currently-open detail card.
  var impRecId = openDetailId || null;
  if (impRecId) markDirty(impRecId);
  var fields = {};
  fields[FI.displayHex] = clearOverride ? '' : hex;
  patchInkRecord(iid, fields, impRecId, false).catch(function(err) {
    console.warn('Display Hex save failed', err);
  });
}

function rgbToHex(rgb) {
  var m = rgb.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if (!m) return '';
  return '#' + [m[1],m[2],m[3]].map(function(n) { return ('0'+parseInt(n).toString(16)).slice(-2); }).join('');
}

// ─── PDF LABEL GENERATOR — AUTO-FIT ─────────────────────────────────────────
// jsPDF draws at 72pt/inch. 4"x2" landscape = 288pt x 144pt: one label per PDF page, the page IS the label
// (no margins, no rotation), so a Rollo set to 4x2in paper at 100% prints it 1:1. Pure black on white.
// v96 (Stephen: "make sure that it will print correctly with a rollo printer"):
//   - recipe text is bigger: tighter lines, "-" divider lines are a thin rule, and a long recipe goes to two
//     columns instead of shrinking (v95 went down to 5pt — about 1.8mm, hard to read on a 203dpi thermal print)
//   - long Pantone names ("1625 (Ward Sutton)", "TOPO off white") wrap onto 2-3 big lines instead of one small one
//   - long ink names wrap to 2 lines in the band before shrinking; nothing ever runs off the label
//   - characters the built-in PDF font can't draw (→, ≈, emoji…) are swapped, so they never print as garbage
var LBL_MIN_PT = 7;   // smallest recipe text (v95: 5)
function lblSafe(t) {
  return String(t || '')
    .replace(/[→⇒➝]/g, '->').replace(/←/g, '<-').replace(/≈/g, '~').replace(/≤/g, '<=').replace(/≥/g, '>=')
    .replace(/ /g, ' ').replace(/[−‐‑]/g, '-')
    .replace(/[^\x00-\xFF€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ]/g, '');
}
function generateLabelPdf(labels, callback) {
  var jsPDF = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDF) { toast('The label maker is still loading — try again in a moment'); return; }

  var W = 288; // 4 inches
  var H = 144; // 2 inches
  var PAD = 7; // 0.1in safe edge

  var doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [H, W] });
  doc.setProperties({ title: labels.length === 1 ? lblSafe(labels[0].name || 'Ink label') : labels.length + ' ink labels' });

  labels.forEach(function(d, idx) {
    if (idx > 0) doc.addPage([H, W], 'landscape');

    var name    = lblSafe(d.name).trim();
    var pantone = lblSafe(d.pantone).trim();
    var lines   = lblSafe(d.recipe).split('\n').map(function(l) { return l.trim(); });
    while (lines.length && !lines[lines.length - 1]) lines.pop();
    while (lines.length && !lines[0]) lines.shift();
    // collapse runs of blank lines; a "-" line is the shop's divider -> drawn as a rule
    var items = [];
    lines.forEach(function(l) {
      var kind = !l ? 'gap' : (/^[-–—_=.]+$/.test(l) ? 'rule' : 'text');
      if (kind !== 'text' && items.length && items[items.length - 1].kind !== 'text') return;
      items.push({ kind: kind, text: l });
    });
    var nText = items.filter(function(it) { return it.kind === 'text'; }).length;

    doc.setFont('helvetica', 'bold');
    function wrapWords(t, maxW) {   // greedy word wrap at the current font size (a too-long word stays whole)
      var out = [], cur = '';
      t.split(/\s+/).filter(Boolean).forEach(function(w) {
        var tryL = cur ? cur + ' ' + w : w;
        if (!cur || doc.getTextWidth(tryL) <= maxW) cur = tryL; else { out.push(cur); cur = w; }
      });
      if (cur) out.push(cur);
      return out.length ? out : [''];
    }

    // ── Black top band: the ink name (1 line, else 2) ─────────────────────
    var bandH = 28, nameLines = [name], namePt = 14, maxNameW = W - 2 * PAD;
    for (namePt = 14; namePt >= 9; namePt -= 0.5) { doc.setFontSize(namePt); if (doc.getTextWidth(name) <= maxNameW) break; }
    if (namePt < 9) {
      for (namePt = 12; namePt >= 7; namePt -= 0.5) {
        doc.setFontSize(namePt);
        nameLines = wrapWords(name, maxNameW);
        if (nameLines.length <= 2 && nameLines.every(function(l) { return doc.getTextWidth(l) <= maxNameW; })) break;
      }
      nameLines = nameLines.slice(0, 2);
      bandH = Math.max(bandH, Math.ceil(nameLines.length * namePt * 1.12 + 8));
    }
    doc.setFillColor(0, 0, 0);
    doc.rect(0, 0, W, bandH, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(namePt);
    var nlh = namePt * 1.12, ny = bandH / 2 - (nameLines.length - 1) * nlh / 2 + namePt * 0.35;
    nameLines.forEach(function(l, i) { doc.text(l, W / 2, ny + i * nlh, { align: 'center' }); });
    doc.setTextColor(0, 0, 0);

    var bodyTop = bandH + 5, bodyBot = H - 6, bodyH = bodyBot - bodyTop;

    // ── Recipe: largest size that fits, 1 column, else 2 columns ──────────
    var LH = 1.2, GAP = 0.45;
    function colHeight(arr, pt) { var t = 0; arr.forEach(function(it) { t += it.kind === 'text' ? pt * LH : pt * GAP; }); return t; }
    function colWidth(arr) { var w = 0; arr.forEach(function(it) { if (it.kind === 'text') w = Math.max(w, doc.getTextWidth(it.text)); }); return w; }
    function splitCols(arr) {
      // split near the middle, preferring a divider; never start a column with a rule/gap
      var half = Math.ceil(nText / 2), seen = 0, cut = arr.length;
      for (var i = 0; i < arr.length; i++) { if (arr[i].kind === 'text') { seen++; if (seen === half) { cut = i + 1; break; } } }
      for (var j = 0; j < arr.length; j++) if (arr[j].kind === 'rule') { var before = arr.slice(0, j).filter(function(x){return x.kind==='text';}).length; if (Math.abs(before - half) <= 1 && before > 0) { cut = j; break; } }
      var a = arr.slice(0, cut), b = arr.slice(cut);
      while (b.length && b[0].kind !== 'text') b.shift();
      while (a.length && a[a.length - 1].kind !== 'text') a.pop();
      return [a, b];
    }
    // recipe area width depends on how much the number needs; give the recipe at least 52% of the label
    var leftW = nText ? W * 0.40 : W - 2 * PAD;
    var recipeL = leftW + 6, recipeR = W - PAD, recipeW = recipeR - recipeL;
    var cols = [items], rPt = 0;
    if (nText) {
      for (var pt = 14; pt >= LBL_MIN_PT; pt -= 0.5) {
        doc.setFontSize(pt);
        if (colHeight(items, pt) <= bodyH && colWidth(items) <= recipeW) { rPt = pt; break; }
      }
      if (!rPt || rPt < 9) {
        // try two columns over a wider recipe area (the number gets a narrower column)
        var two = splitCols(items), lw2 = W * 0.30, rL2 = lw2 + 6, cw = (W - PAD - rL2 - 10) / 2, pt2 = 0;
        for (var p2 = 13; p2 >= LBL_MIN_PT; p2 -= 0.5) {
          doc.setFontSize(p2);
          if (Math.max(colHeight(two[0], p2), colHeight(two[1], p2)) <= bodyH && Math.max(colWidth(two[0]), colWidth(two[1])) <= cw) { pt2 = p2; break; }
        }
        if (pt2 >= rPt + 1.5) { cols = two; rPt = pt2; leftW = lw2; recipeL = rL2; recipeW = W - PAD - rL2; }
      }
      if (!rPt) rPt = LBL_MIN_PT;   // last resort: smallest size; lines are clipped to the label below
    }

    // ── Pantone number / name: fill the left column, wrap to up to 3 lines ─
    var maxNumW = leftW - PAD - 2, maxNumH = bodyH - 4, numLines = [pantone], numPt;
    for (numPt = 72; numPt > 10; numPt -= 1) {
      doc.setFontSize(numPt);
      numLines = wrapWords(pantone, maxNumW);   // breaks only between words, never inside "7686"
      var widest = 0; numLines.forEach(function(l) { widest = Math.max(widest, doc.getTextWidth(l)); });
      var hgt = numPt * 0.72 + (numLines.length - 1) * numPt * 1.05;   // cap height + extra lines
      if (numLines.length <= 3 && widest <= maxNumW && hgt <= maxNumH) break;
    }
    doc.setFontSize(numPt);
    var nlh2 = numPt * 1.05, blockH = numPt * 0.72 + (numLines.length - 1) * nlh2;
    var numY = bodyTop + (bodyH - blockH) / 2 + numPt * 0.72;
    var numX = PAD + maxNumW / 2;
    numLines.forEach(function(l, i) { doc.text(l, numX, numY + i * nlh2, { align: 'center' }); });

    // ── Recipe text (right-aligned columns, vertically centred) ───────────
    if (nText) {
      doc.setFontSize(rPt);
      doc.setLineWidth(0.9);
      var colGap = 10, colW = cols.length > 1 ? (recipeW - colGap) / 2 : recipeW;
      cols.forEach(function(col, ci) {
        var right = recipeL + colW * (ci + 1) + colGap * ci;
        var y = bodyTop + Math.max(0, (bodyH - colHeight(col, rPt)) / 2);
        col.forEach(function(it) {
          if (it.kind === 'text') {
            if (y + rPt * LH <= bodyBot + 0.5) doc.text(it.text, right, y + rPt * 0.9, { align: 'right' });
            y += rPt * LH;
          } else {
            if (it.kind === 'rule') doc.line(right - Math.min(colW, 60), y + rPt * GAP / 2, right, y + rPt * GAP / 2);
            y += rPt * GAP;
          }
        });
      });
    }
  });

  var pdfBlob = doc.output('blob');
  var url = URL.createObjectURL(pdfBlob);
  if (callback) callback(url);
  setTimeout(function() { URL.revokeObjectURL(url); }, 600000);   // v96: 10 min (v95: 2) so a slow print still finds it
}

// ─── MASTER PRINT MODAL ──────────────────────────────────────────────────────
var masterSearchTimer = null;
var masterSearchCache = {};

function openMasterModal() {
  var modal = document.getElementById('masterModal');
  if (modal) modal.classList.add('open');
  var inp = document.getElementById('masterSearch');
  if (inp) { inp.value = ''; inp.focus(); }
  document.getElementById('masterResults').innerHTML = '<div class="master-loading">Type to search the ink library</div>';
}

function closeMasterModal() {
  var modal = document.getElementById('masterModal');
  if (modal) modal.classList.remove('open');
}

function masterSearch(query) {
  clearTimeout(masterSearchTimer);
  var q = (query || '').trim();
  var resultsEl = document.getElementById('masterResults');
  if (!q || q.length < 2) {
    resultsEl.innerHTML = '<div class="master-loading">Type to search the ink library</div>';
    return;
  }
  if (masterSearchCache[q]) { renderMasterResults(masterSearchCache[q]); return; }
  resultsEl.innerHTML = '<div class="master-loading"><div class="spin" style="display:inline-block;margin-right:6px;width:10px;height:10px;border-width:2px"></div>Searching...</div>';
  masterSearchTimer = setTimeout(function() {
    var filter = encodeURIComponent(
      'OR(FIND(LOWER("' + q.replace(/"/g,'') + '"),LOWER({' + FI.pantone + '})),' +
      'FIND(LOWER("' + q.replace(/"/g,'') + '"),LOWER({' + FI.name + '})))'
    );
    api('tblyPBucKoDwxDisT?returnFieldsByFieldId=true' +
      '&fields%5B%5D=' + FI.name +
      '&fields%5B%5D=' + FI.pantone +
      '&fields%5B%5D=' + FI.type +
      '&fields%5B%5D=' + FI.recipe +
      '&fields%5B%5D=' + FI.inkNotes +
      '&fields%5B%5D=' + FI.lastUpdated +
      '&fields%5B%5D=' + FI.mfr +
      '&filterByFormula=' + filter +
      '&pageSize=30'
    ).then(function(data) {
      var recs = data.records || [];
      masterSearchCache[q] = recs;
      renderMasterResults(recs);
    }).catch(function(e) {
      document.getElementById('masterResults').innerHTML = '<div class="master-empty">Search failed: ' + escHtml(e.message) + '</div>';
    });
  }, 300);
}

function renderMasterResults(recs) {
  var el = document.getElementById('masterResults');
  if (!recs.length) { el.innerHTML = '<div class="master-empty">No inks found</div>'; return; }
  var h = '';
  recs.forEach(function(r) {
    var f = r.fields;
    var name = f[FI.name] || '';
    var typeName = selName(f[FI.type]);
    var mfr = selName(f[FI.mfr]);
    var recipe = f[FI.recipe] || '';
    var pantone = f[FI.pantone] || '';
    var lastUpdated = f[FI.lastUpdated] || '';
    var meta = [typeName, mfr, lastUpdated ? 'Updated ' + lastUpdated : ''].filter(Boolean).join(' · ');
    var recipeSnippet = recipe ? recipe.split('\n').slice(0,2).join(' / ') : '';
    var dataJson = { name: name, pantone: pantone, type: typeName, mfr: mfr, recipe: recipe };
    var lk = storeLabelData(dataJson);
    h += '<div class="master-ink-row" onclick="masterSelectInk(\'' + lk + '\')">';
    h += '<div class="master-ink-name">' + escHtml(name) + '</div>';
    if (meta) h += '<div class="master-ink-meta">' + escHtml(meta) + '</div>';
    if (recipeSnippet) h += '<div class="master-ink-recipe-preview">' + escHtml(recipeSnippet) + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function masterSelectInk(key) {
  closeMasterModal();
  openLabelByKey(key);
}

function openLabelByKey(key) {
  var d = labelStore[key];
  if (d) openLabelOverlay(d);
}

// Close overlays on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeChipPopover();
    if (pat) showMenu(false);
    pmClose();
    closeLabelOverlay();
    closeMasterModal();
    closeInkEditConfirm();
    closePasteConfirm();
  }
});
</script>
<!-- Label preview -->
<div class="p-scrim ovl" id="labelOverlay" onclick="if(event.target===this)closeLabelOverlay()">
  <div class="p-modal lbl-modal" role="dialog" aria-label="Ink label">
    <div class="p-modal-h"><h2 class="p-h2">Ink label</h2><button class="p-modal-x" type="button" aria-label="Close" onclick="closeLabelOverlay()">&#10005;</button></div>
    <div class="p-modal-b">
      <div class="label-iframe-wrap" id="labelIframeWrap">
        <div class="label-iframe-loading" id="labelIframeLoading">Making the label…</div>
        <iframe id="labelIframe" style="display:none" title="Label preview"></iframe>
      </div>
    </div>
    <div class="p-modal-f"><span class="p-hint">4 × 2 in Rollo label. In the print box: paper 4 × 2 in, scale 100% (Actual size), margins None.</span><button class="p-btn p-btn-quiet" type="button" onclick="closeLabelOverlay()">Close</button><button class="p-btn p-btn-main" type="button" onclick="printLabelFromIframe()">&#9113; Print</button></div>
  </div>
</div>

<!-- Print a label from the ink library -->
<div class="p-scrim ovl" id="masterModal" onclick="if(event.target===this)closeMasterModal()">
  <div class="p-modal master-modal" role="dialog" aria-label="Print a label">
    <div class="p-modal-h"><h2 class="p-h2">Print a label</h2><button class="p-modal-x" type="button" aria-label="Close" onclick="closeMasterModal()">&#10005;</button></div>
    <div class="p-modal-b"><input class="p-input" type="search" id="masterSearch" placeholder="Pantone number or ink name" autocomplete="off" oninput="masterSearch(this.value)"></div>
    <div class="master-results" id="masterResults"><div class="master-loading">Type to search the ink library</div></div>
  </div>
</div>

<!-- v84: edit-existing-ink choice -->
<div class="p-scrim ovl" id="inkEditConfirm" onclick="if(event.target===this)inkEditConfirmChoose('cancel')">
  <div class="p-modal" role="dialog" aria-label="Update this color?">
    <div class="p-modal-h"><h2 class="p-h2">Update this color?</h2><button class="p-modal-x" type="button" aria-label="Cancel" onclick="inkEditConfirmChoose('cancel')">&#10005;</button></div>
    <div class="p-modal-b"><div id="iecBody"></div>
      <div class="choices">
        <button class="choice" type="button" onclick="inkEditConfirmChoose('update')"><b>Update this color everywhere</b><small>Changes it on every job that uses it</small></button>
        <button class="choice" type="button" onclick="inkEditConfirmChoose('create')"><b>Make a new color</b><small>Leaves the original as it is</small></button>
      </div>
    </div>
    <div class="p-modal-f"><button class="p-btn p-btn-quiet" type="button" onclick="inkEditConfirmChoose('cancel')">Cancel</button></div>
  </div>
</div>

<!-- v85: paste colors — replace or add -->
<div class="p-scrim ovl" id="pasteColorsConfirm" onclick="if(event.target===this)pasteConfirmChoose('cancel')">
  <div class="p-modal" role="dialog" aria-label="Paste colors">
    <div class="p-modal-h"><h2 class="p-h2">Paste colors</h2><button class="p-modal-x" type="button" aria-label="Cancel" onclick="pasteConfirmChoose('cancel')">&#10005;</button></div>
    <div class="p-modal-b"><div id="pccBody"></div>
      <div class="choices">
        <button class="choice" type="button" onclick="pasteConfirmChoose('replace')"><b>Replace these colors</b><small>This location gets exactly the copied list</small></button>
        <button class="choice" type="button" onclick="pasteConfirmChoose('merge')"><b>Add to these colors</b><small>Keeps what's here, adds the copied ones, skips repeats</small></button>
      </div>
    </div>
    <div class="p-modal-f"><button class="p-btn p-btn-quiet" type="button" onclick="pasteConfirmChoose('cancel')">Cancel</button></div>
  </div>
</div>
