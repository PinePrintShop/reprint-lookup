function jsTxt(v){
  var a=bxFlatVals(v).map(bxName).filter(function(s){return s!=='';});
  if(!a.length)return '';
  var seen={},out=[];
  a.forEach(function(s){if(!seen[s]){seen[s]=1;out.push(s);}});
  return out.join(', ');
}
function jsDate(v){
  if(!v)return '';
  var s=String(v).split('T')[0],p=s.split('-');
  if(p.length===3)return (+p[1])+'/'+(+p[2])+'/'+p[0];
  var d=new Date(v);
  return isNaN(d.getTime())?String(v):((d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear());
}

function jsFetch(ordNum,cb){
  var token=getToken();
  var out={order:{},lines:[]};
  if(!token){cb(out);return;}
  var settled=false;
  var timer=setTimeout(function(){if(!settled)cb(out);},6000);
  function done(){settled=true;clearTimeout(timer);cb(out);}
  var po=new URLSearchParams();
  po.set('filterByFormula','{Invoice / Order Number}='+ordNum);
  Object.keys(JSO).forEach(function(k){po.append('fields[]',JSO[k]);});
  po.set('maxRecords','1');po.set('returnFieldsByFieldId','true');
  var pl=new URLSearchParams();
  pl.set('filterByFormula','{Invoice / Order Number Lookup}='+ordNum);
  Object.keys(JSL).forEach(function(k){pl.append('fields[]',JSL[k]);});
  JS_SIZES.forEach(function(z){pl.append('fields[]',z.f);});
  pl.set('returnFieldsByFieldId','true');
  var H={Authorization:'Bearer '+token};
  Promise.all([
    fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+ORDERS_TBL+'?'+po,{headers:H}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID+'?'+pl,{headers:H}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ]).then(function(res){
    if(res[0]&&res[0].records&&res[0].records.length){out.order=res[0].records[0].fields||{};out.orderId=res[0].records[0].id||'';}
    if(res[1]&&res[1].records)out.lines=res[1].records;
    done();
  }).catch(function(){done();});
}

// v56 -- pagination is now MEASURED, not assumed.
// v55 split rows with two hardcoded constants (JS_ROWS_P1=8, JS_ROWS_PN=11)
// calibrated against a short header. Both inputs are variable:
//   header height  -- 2-line customer name, multi-press assignment, and a wrapped
//                     "ASAP vs. Hard Deadline" label push it ~195px -> ~240px
//   row height     -- 3-line .js-sm cells / 2-line .js-chip garments render ~58px
//                     against ~37px for a single-line row
// On order 10533 (8 LIs, all three header growers present) the tbody needed ~401px
// against a ~367px budget, so .js-page{overflow:hidden} silently ate the last line
// item AND the whole footer -- including the "Page X of Y" cue that would have
// hinted anything was missing.
// The generated document now emits every row on page 1 and reflows on load: while a
// page's footer sits below the printable area, its last <tr> moves to the top of the
// next page (created from JS_CONT if needed). Self-correcting for any future header
// or type-size change. Do NOT reintroduce a rows-per-page constant.

// v58 -- `sizes` is the order's used-size subset, not the full JS_SIZES list.
// See jsSizeCols() for why. Order Notes gets .notes so it keeps a line clamp
// while the other text cells are free to wrap.
function jsRow(r,sizes){
  var f=r.fields||{};
  var cells=sizes.map(function(z){
    var v=f[z.f];
    return '<td class="js-sz">'+(v===undefined||v===null||v===''?'':v)+'</td>';
  }).join('');
  return '<tr>'
    +'<td><span class="js-chip">'+esc(jsTxt(f[JSL.productType]))+'</span></td>'
    +'<td><span class="js-chip lt">'+esc(jsTxt(f[JSL.garment]))+'</span></td>'
    +'<td><div class="js-sm">'+esc(jsTxt(f[JSL.imprintDesc]))+'</div></td>'
    +'<td><span class="js-chip">'+esc(jsTxt(f[JSL.imprints]))+'</span></td>'
    +'<td><div class="js-sm notes">'+esc(jsTxt(f[JSL.notes]))+'</div></td>'
    +cells
    +'<td class="js-sz b">'+esc(jsTxt(f[JSL.total]))+'</td>'
    +'<td><div class="js-sm">'+esc(jsTxt(f[JSL.extras]))+'</div></td>'
    +'<td><div class="js-sm">'+esc(jsTxt(f[JSL.nickname]))+'</div></td>'
    +'</tr>';
}

// Which size columns does this order actually use? Printing all ten always spent
// real width on nothing: on order 10500 (13 LIs) only M/L/XL/2XL/3XL carry values,
// so XS/S/4XL/5XL/OSFA burned 160px of the table's 988px while the Imprints column
// sat at 76px and sheared "10500-A, 10500-B, 10500-E" mid-line.
// Base-wide the sparse columns bear this out: 4XL is populated on 175 line items
// and 5XL on 39, against 9,172 for L. OSFA (8,645) and L are near mutually
// exclusive by product type -- bandanas/hats/totes vs. apparel -- so almost every
// order has columns to reclaim, not just the crowded ones.
// Computed once per order and used by every page, so the column set is identical
// across a multi-page sheet. Falls back to all ten when there's no size data at all.
function jsSizeCols(lines){
  var used=JS_SIZES.filter(function(z){
    for(var i=0;i<lines.length;i++){
      var v=(lines[i].fields||{})[z.f];
      if(v!==undefined&&v!==null&&v!==''&&v!==0)return true;
    }
    return false;
  });
  return used.length?used:JS_SIZES.slice();
}
function jsSizeW(z){return z.l.length>3?40:30;}

// Hand the reclaimed pixels to the text columns. Two passes so the narrow columns
// each get a modest bump before any one of them runs to its generous cap -- a
// single-pass fill gave Imprints everything and left Line Item Nickname at 60px.
function jsColW(sizes){
  var W={pt:84,gar:142,desc:116,imp:76,notes:76,total:52,extras:64,nick:60};
  var slack=0;
  JS_SIZES.forEach(function(z){if(sizes.indexOf(z)<0)slack+=jsSizeW(z);});
  [[['imp',130],['nick',90],['desc',150],['extras',80]],
   [['imp',170],['desc',190],['nick',110],['extras',100],['gar',180],['notes',110]]]
  .forEach(function(pass){
    pass.forEach(function(c){
      if(slack<=0)return;
      var room=c[1]-W[c[0]];
      if(room<=0)return;
      var give=room<slack?room:slack;
      W[c[0]]+=give;slack-=give;
    });
  });
  return W;
}

var jsOrdNum=null,jsCustomer='',jsDataCache=null;
var JS_PREVIEW_SCALE=0.479;
function jsPaint(docHtml){
  var el=document.getElementById('jsPrev');if(!el)return false;
  var ok=false;
  try{
    var d=el.contentDocument||(el.contentWindow&&el.contentWindow.document);
    if(d){d.open();d.write(docHtml);d.close();ok=true;}
  }catch(e){}
  if(!ok){try{el.srcdoc=docHtml;ok=true;}catch(e2){}}
  // Grow the iframe (and its scaled sizer) to fit every page, so the preview scrolls
  // through a multi-page sheet instead of showing only page 1.
  try{
    var doc=el.contentDocument||(el.contentWindow&&el.contentWindow.document);
    var n=(doc&&doc.querySelectorAll('.js-page').length)||1;
    el.style.height=(816*n)+'px';
    var inner=document.getElementById('jsPrevInner');
    if(inner)inner.style.height=Math.round(816*n*JS_PREVIEW_SCALE)+'px';
  }catch(e3){}
  return ok;
}
function openJobSheet(ordNum,customer){
  jsOrdNum=ordNum;jsCustomer=customer||'';jsDataCache=null;
  jsPaint('<!DOCTYPE html><html><body style="margin:0;background:#fff;font:12px Helvetica,Arial,sans-serif;color:#888880;padding:12px">Loading job sheet...<\/body><\/html>');
  document.getElementById('jsOverlay').classList.add('open');
  jsFetch(ordNum,function(data){
    if(jsOrdNum!==ordNum)return;
    jsDataCache=data;
    jsPaint(jsDoc(ordNum,jsCustomer,data,false));
  });
}
function closeJobSheet(){
  document.getElementById('jsOverlay').classList.remove('open');
  jsPaint('<!DOCTYPE html><html><body style="margin:0;background:#fff"><\/body><\/html>');
  jsOrdNum=null;jsCustomer='';jsDataCache=null;
}
function doJobSheet(){
  if(!jsOrdNum)return;
  var ordNum=jsOrdNum,customer=jsCustomer,cached=jsDataCache;
  function go(docHtml){
    closeJobSheet();
    var win;try{win=window.open('','_blank','width=1100,height=850,toolbar=0,menubar=0,location=0,status=0,scrollbars=1');}catch(e){}
    if(!win){toast('Allow pop-ups for job sheets','err');return;}
    try{win.document.write(docHtml);win.document.close();}
    catch(e){toast('Job sheet error: '+e.message,'err');try{win.close();}catch(_){}}
  }
  if(cached){go(jsDoc(ordNum,customer,cached,true));return;}
  toast('Preparing job sheet...','ok');
  jsFetch(ordNum,function(d){go(jsDoc(ordNum,customer,d,true));});
}

   One label per staging box: order number, BOX n of N, customer, print/due dates,
   press, delivery, mockup QR, what's inside (garment, color, design, sizes, qty),
   short notes, "Staged by / Date", and FULLY RECEIVED ticked when every line is in.
   Boxes come from combineIntoBoxes() on a FRESH fetch of the whole order (bxFetchLines).
   More than CB_ROWS garment rows in one box continues onto a second label.
   Counts stay tappable on screen so a packer can fix them before printing; the

var CB_ROWS=7;
var CB_SIZE_ORDER=['XS','S','M','L','XL','2XL','3XL','4XL','5XL','6XL','OSFA'];
function cbDate(v){
  if(!v||v==='—')return '';
  var t=String(Array.isArray(v)?v[0]:v).split(',')[0].trim(),m,d=null;
  if((m=/^(\d{4})-(\d{2})-(\d{2})/.exec(t)))d=new Date(+m[1],+m[2]-1,+m[3]);
  else if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t)))d=new Date(+m[3],+m[1]-1,+m[2]);
  if(!d||isNaN(d.getTime()))return t;
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function cbSizes(sz){
  var a=CB_SIZE_ORDER.filter(function(k){return sz[k]>0;});
  if(a.length===1&&a[0]==='OSFA')return 'OSFA '+sz.OSFA;
  return a.map(function(k){return k+'\u00a0'+sz[k];}).join(' · ');
}
function cbAllIn(ordNum,records){
  var prog=orderProgress[ordNum];
  if(prog&&prog.n>0)return prog.x>=prog.n&&!prog.openMisship;
  var ap=records.filter(isApparelLine);
  return ap.length>0&&ap.every(function(r){return fv(r,'received')===true;});
}

function bxCopy(o){var c={},k;for(k in o){if(Object.prototype.hasOwnProperty.call(o,k))c[k]=o[k];}return c;}
function bxName(x){return (x&&typeof x==='object')?(x.name||''):String(x==null?'':x);}
function bxFlatVals(v){
  var out=[],k;
  if(v&&typeof v==='object'&&!Array.isArray(v)&&v.valuesByLinkedRecordId){
    var o=v.valuesByLinkedRecordId;
    for(k in o){if(Object.prototype.hasOwnProperty.call(o,k))out=out.concat(o[k]);}
    return out;
  }
  if(Array.isArray(v))return v.slice();
  if(v!==undefined&&v!==null&&v!=='')return [v];
  return [];
}
function bxFindRow(rows,g,c,d){
  for(var i=0;i<rows.length;i++){if(rows[i].garment===g&&rows[i].color===c&&rows[i].design===d)return rows[i];}
  return null;
}

function getGarmentStyle(r){var v=bxFlatVals(fv(r,'garmentStyleLookup')).map(bxName).filter(Boolean);return v.length?v[0]:null;}
// v77: renamed from getGarmentName -- this label copy had the same name as the screen one and replaced it, so the
// colour dropped off every line name on screen (and search). Only the box labels use this one.
function getLabelGarmentName(r){
  // fldKhz9uZgXwfeIto is NAMED "Garment Record ID [TEXT]" but its formula is
  // "" & {Garment Type} -- coercing a link field yields the linked record's PRIMARY
  // field, i.e. Garments.Garment Name = Manufacturer + Product # + " - " + Colorway.
  // The legacy label read garmentTypeLookup (fldH6FaN4rzwzdEXj) instead, which resolves
  // to multipleRecordLinks and returns bare rec IDs over v0 REST, so it always fell
  // through to the Ref parse and printed a bare style code ("LAA-1812GD").
  var g=String(fv(r,'garmentName')||'').trim();
  if(g){
    // This label has its own COLOR column, so drop the trailing colorway when it
    // just repeats it. The job sheet keeps the full string -- it has no COLOR column.
    var c=getColorName(r);
    if(c&&c!=='\u2014'){
      var suf=' - '+c;
      if(g.length>suf.length&&g.slice(-suf.length).toLowerCase()===suf.toLowerCase())
        g=g.slice(0,-suf.length);
    }
    return g;
  }
  var ref=String(fv(r,'ref')||''),parts=ref.split('-');
  if(parts.length>=4)return parts.slice(2,-1).join('-');
  return ref;
}
function getColorName(r){
  var v=bxFlatVals(fv(r,'colorwayLookup')).map(bxName).filter(Boolean);
  if(v.length)return v[0];
  var ref=String(fv(r,'ref')||''),parts=ref.split('-');
  return parts.length>=3?parts[parts.length-1]:'\u2014';
}
function getGarmentCategory(style){
  if(!style)return 'tee';
  var s=String(style).toLowerCase();
  if(s.indexOf('bandana')>-1)return 'bandana';
  if(s.indexOf('pullover hoodie')>-1||s.indexOf('zip up hoodie')>-1||s.indexOf('sweatshirt')>-1)return 'hoodie';
  if(s.indexOf('cap')>-1||s.indexOf('hat')>-1||s.indexOf('beanie')>-1)return 'hat';
  return 'tee';
}
function getBoxSizeAndCapacity(style,qty){
  var cat=getGarmentCategory(style);
  if(cat==='bandana'){
    if(qty<=100)return{boxSize:BOX_SIZES.S,capacity:100};
    if(qty<=300)return{boxSize:BOX_SIZES.M,capacity:300};
    return{boxSize:BOX_SIZES.L,capacity:500};
  }
  if(cat==='hoodie'){
    if(style&&String(style).toLowerCase().indexOf('sweatshirt')>-1)return{boxSize:BOX_SIZES.L,capacity:24};
    return{boxSize:BOX_SIZES.L,capacity:15};
  }
  if(cat==='hat')return{boxSize:BOX_SIZES.S,capacity:50};
  if(qty<=24)return{boxSize:BOX_SIZES.S,capacity:100};
  if(qty<=50)return{boxSize:BOX_SIZES.M,capacity:100};
  return{boxSize:BOX_SIZES.L,capacity:100};
}
function getSizeQty(r,size){
  var oKey=SIZES_MAP[size],eKey=EXTRAS_MAP[size];
  return (oKey?(fv(r,oKey)||0):0)+(eKey?(fv(r,eKey)||0):0);
}
function formatBoxSizes(sizeObj){
  var active=SIZE_ORDER.filter(function(s){return sizeObj[s]>0;});
  if(active.length===1&&active[0]==='OSFA')return 'OSFA';
  return active.map(function(s){return sizeObj[s]+' - '+s;}).join(', ')||'\u2014';
}

function combineIntoBoxes(records){
  var CATEGORY_ORDER=['tee','hoodie','bandana','hat'];
  var groups={tee:[],hoodie:[],bandana:[],hat:[]};
  records.forEach(function(r){
    var style=getGarmentStyle(r),cat=getGarmentCategory(style),itemSizes={},total=0;
    SIZE_ORDER.forEach(function(sz){var q=getSizeQty(r,sz);if(q>0){itemSizes[sz]=q;total+=q;}});
    if(total>0)groups[cat].push({garment:getLabelGarmentName(r),color:getColorName(r),design:getImprintIds(r).join(' \u00b7 ')||'\u2014',style:style,cat:cat,sizes:itemSizes,total:total,r:r});
  });
  var allBoxes=[];
  CATEGORY_ORDER.forEach(function(cat){
    var items=groups[cat];if(!items.length)return;
    var catLeft=items.reduce(function(a,it){return a+it.total;},0);  // v72: size boxes by the order's total for this garment type
    items.forEach(function(item){
      var itemRemaining=bxCopy(item.sizes),itemTotal=item.total;
      while(itemTotal>0){
        var bc=getBoxSizeAndCapacity(item.style,catLeft);  // v72 (was itemTotal)
        var lastBox=allBoxes.length?allBoxes[allBoxes.length-1]:null,currentBox=null;
        if(lastBox&&lastBox.cat===cat&&lastBox.count<lastBox.capacity){currentBox=lastBox;}
        else{currentBox={rows:[],count:0,boxSize:bc.boxSize,capacity:bc.capacity,cat:cat};allBoxes.push(currentBox);}
        var space=currentBox.capacity-currentBox.count,take=Math.min(itemTotal,space);
        var rowSizes={},taken=0;
        SIZE_ORDER.forEach(function(sz){
          if(taken>=take)return;
          var available=itemRemaining[sz]||0;if(!available)return;
          var grab=Math.min(available,take-taken);
          if(grab>0){rowSizes[sz]=grab;itemRemaining[sz]-=grab;if(!itemRemaining[sz])delete itemRemaining[sz];taken+=grab;}
        });
        if(taken>0){
          var existingRow=bxFindRow(currentBox.rows,item.garment,item.color,item.design);
          if(existingRow){SIZE_ORDER.forEach(function(sz){if(rowSizes[sz])existingRow.sizes[sz]=(existingRow.sizes[sz]||0)+rowSizes[sz];});existingRow.total+=taken;}
          else{currentBox.rows.push({garment:item.garment,color:item.color,design:item.design,style:item.style,sizes:bxCopy(rowSizes),total:taken});}
          currentBox.count+=taken;itemTotal-=taken;catLeft-=taken;
        } else { break; }
      }
    });
  });
  for(var i=allBoxes.length-1;i>0;i--){
    var box=allBoxes[i],prev=allBoxes[i-1];
    if(!box.cat||box.cat!==prev.cat)continue;
    if(box.count<(MIN_BOX_QTY[box.cat]||25)){
      box.rows.forEach(function(row){
        var existing=bxFindRow(prev.rows,row.garment,row.color,row.design);
        if(existing){SIZE_ORDER.forEach(function(sz){if(row.sizes[sz])existing.sizes[sz]=(existing.sizes[sz]||0)+row.sizes[sz];});existing.total+=row.total;}
        else{prev.rows.push({garment:row.garment,color:row.color,design:row.design,style:row.style,sizes:bxCopy(row.sizes),total:row.total});}
      });
      prev.count+=box.count;allBoxes.splice(i,1);
    }
  }
  return allBoxes;
}

// v61 -- box labels are built from a FRESH fetch of every line item on the order.
// allRecords is only the last 24h of receiving plus open mis-ships, so an order whose
// lines arrived on different days used to get box labels for today's lines only.
// Same fix the Job Sheet got in v55. The window opens first (pop-up blockers only allow
// window.open inside the click), shows "Loading", then gets the labels written in.
function bxFetchLines(ordNum,cb){
  var token=getToken();
  if(!token){cb(null);return;}
  var out=[];
  function page(offset){
    var p=new URLSearchParams();
    p.set('filterByFormula','{Invoice / Order Number Lookup}='+ordNum);
    Object.keys(F).forEach(function(k){p.append('fields[]',F[k]);});
    p.set('returnFieldsByFieldId','true');p.set('pageSize','100');
    if(offset)p.set('offset',offset);
    fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID+'?'+p,{headers:{Authorization:'Bearer '+token}})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(!j){cb(out.length?out:null);return;}
      out=out.concat(j.records||[]);
      if(j.offset)page(j.offset);else cb(out);
    })
    .catch(function(){cb(out.length?out:null);});
  }
  page(null);
}

function saveBoxFeedback(d){
  var wasEdited=d.wasEdited===true;
  if(SIMULATE){toast('Practice \u2014 box feedback not saved','ok');return;}
  var token=getToken();if(!token)return;
  var f={};

  f[BF.actual]=Number(d.actualCount)||Number(d.autoCount)||0;
  f[BF.edited]=wasEdited;

  f[BF.ts]=d.ts||new Date().toISOString();
  fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+BOX_FEEDBACK_TBL,{
    method:'POST',
    headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({records:[{fields:f}]})
  }).then(function(r){

  fn.textContent=label||'Proof';

  if(!token){body.innerHTML='<div class="pm-loading">No token</div>';return;}

  fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID
    +'?fields[]='+F.proofImages
    +'&filterByFormula='+encodeURIComponent(formula)
    +'&returnFieldsByFieldId=true&pageSize=1',
    {headers:{Authorization:'Bearer '+token}})
  .then(function(res){return res.json();})
  .then(function(data){
    var rec=data.records&&data.records[0];
    if(!rec){body.innerHTML='<div class="pm-loading">Not found</div>';return;}
    var v=rec.fields&&rec.fields[F.proofImages];
    if(!v||!Array.isArray(v)||!v.length){body.innerHTML='<div class="pm-loading">No proof image</div>';return;}
    var p=v[0];
    var url=(p.thumbnails&&p.thumbnails.large&&p.thumbnails.large.url)?p.thumbnails.large.url:p.url;
    if(!url){body.innerHTML='<div class="pm-loading">No image URL</div>';return;}
    var img=new Image();
    img.style.cssText='max-width:100%;max-height:100%;object-fit:contain;border-radius:4px';
    img.onload=function(){body.innerHTML='';body.appendChild(img);};
    img.onerror=function(){body.innerHTML='<div class="pm-loading">Could not load image</div>';};
    img.src=url;
  })
  .catch(function(){body.innerHTML='<div class="pm-loading">Error loading proof</div>';});
}

var PROMO_RECV_FORMULA='AND({'+PF.productType+'}="'+PROMO_TYPE+'",{'+PF.received+'}=TRUE(),IS_AFTER({'+PF.receivedTime+'},DATEADD(NOW(),-14,"days")),NOT(FIND("cancelled",LOWER(ARRAYJOIN({'+PF.orderStatus+'})&""))))';
var EXTRA_TYPE_OR=function(){return 'OR('+Object.keys(EXTRA_TYPES).map(function(t){return '{'+PF.productType+'}="'+t+'"';}).join(',')+')';};
var PROMO_KINDS=[['patch','Patches',/\bpatch(es)?\b/i],['pin','Pins',/\b(enamel )?pins?\b/i],['label','Woven labels',/\bwoven (clip )?labels?\b/i],['drink','Drinkware',/\b(tumbler|mug|cups?|bottle|koozie|coozie|can cooler|glass(es)?|pint|flask|drinkware|stein|shaker)\b/i],
  ['bag','Bags',/\b(bags?|totes?|backpacks?|duffels?|pouch(es)?|sacks?|drawstring)\b/i],

  ['sock','Socks',/\bsocks?\b/i],
  ['match','Matches',/\bmatch(book|books|es)?\b/i],

function $id(i){return document.getElementById(i);}
function pval(r,k){var id=PF[k]||k;var f=r.fields||r.cellValuesByFieldId||{};return f[id];}
// lookups / links / selects -> plain strings (REST arrays, MCP valuesByLinkedRecordId, {name} selects)
function pflat(v){
  if(v===undefined||v===null||v==='')return [];
  if(Array.isArray(v)){var o=[];v.forEach(function(x){o=o.concat(pflat(x));});return o;}
  if(typeof v==='object'){
    if(v.valuesByLinkedRecordId){var o2=[];Object.keys(v.valuesByLinkedRecordId).forEach(function(k){o2=o2.concat(pflat(v.valuesByLinkedRecordId[k]));});return o2;}
    return v.name?[String(v.name)]:[];
  }
  return [String(v)];
}
function ptxt(r,k){return pflat(pval(r,k)).join(', ').trim();}
function pNum(r){var a=pflat(pval(r,'orderNum'));return a.length?(parseInt(a[0],10)||0):0;}
function pDesc(r){return (ptxt(r,'promoDesc')||ptxt(r,'prodDesc')).trim();}
function pTitle(r){var ty=ptxt(r,'productType');return pDesc(r)||((ty&&ty!==PROMO_TYPE?ty:'Promo')+' from '+(ptxt(r,'supplierName')||'a vendor'));}
function pKind(r){var ty=ptxt(r,'productType');if(EXTRA_TYPES[ty])return EXTRA_TYPES[ty];var t=pDesc(r)+' '+ptxt(r,'colorway');for(var i=0;i<PROMO_KINDS.length;i++){if(PROMO_KINDS[i][2].test(t))return PROMO_KINDS[i][0];}return 'other';}
function pKindName(k){for(var i=0;i<PROMO_KINDS.length;i++)if(PROMO_KINDS[i][0]===k)return PROMO_KINDS[i][1];return 'Other';}
function pImgs(r,key){var v=key?(r.fields||{})[key]:pval(r,'proofImages');return Array.isArray(v)?v.filter(function(a){return a&&(a.url||a.thumbnails);}):[];}
function attThumb(a,size){var t=a.thumbnails||{};return (t[size]&&t[size].url)||(t.large&&t.large.url)||(/^image\//.test(a.type||'')?a.url:'')||'';}
function attFull(a){var t=a.thumbnails||{};if(/^image\//.test(a.type||'')&&a.url)return a.url;return (t.full&&t.full.url)||(t.large&&t.large.url)||a.url||'';}
// dates come as YYYY-MM-DD (due) or MM/DD/YYYY (Expected Blank Arrival); anything else (e.g. "Garments Not Ordered") = none
function pDate(s){
  s=String(s||'');var m;
  if((m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s)))return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s)))return new Date(+m[3],+m[1]-1,+m[2]);
  return null;
}
function pDays(d){if(!d)return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((d.getTime()-t.getTime())/86400000);}
function pFmt(d){return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';}
function pArr(r){return pDate(ptxt(r,'arrival'));}
function pDue(r){return pDate(pflat(pval(r,'due'))[0]);}
function pRecvAt(r){var t=pval(r,'receivedTime');var d=t?new Date(t):null;return d&&!isNaN(d.getTime())?d:null;}
function pQty(r){return Number(pval(r,'qty')||0);}
function pHard(r){return /hard/i.test(ptxt(r,'deadline'));}
function pKeep(r,bucket){
  if(!isPromoType(ptxt(r,'productType')))return false;
  var st=ptxt(r,'orderStatus');if(st==='Completed'||/cancel/i.test(st))return false;
  if(bucket==='waiting')return pval(r,'ordered')===true&&pval(r,'received')!==true;
  return pval(r,'received')===true;
}
function pSort(list,bucket){
  return list.sort(function(a,b){
    if(bucket==='received'){var ta=pRecvAt(a),tb=pRecvAt(b);return (tb?tb.getTime():0)-(ta?ta.getTime():0);}
    var da=pArr(a),db=pArr(b);   // expected arrival first, then due date, then order #
    if(da&&db&&da.getTime()!==db.getTime())return da-db;
    if(da&&!db)return -1;if(db&&!da)return 1;
    var ua=pDue(a),ub=pDue(b);
    if(ua&&ub&&ua.getTime()!==ub.getTime())return ua-ub;
    if(ua&&!ub)return -1;if(ub&&!ua)return 1;
    return pNum(a)-pNum(b);
  });
}

async function promoFetch(token,params){
  var out=[],offset=null;
  do{
    var p=new URLSearchParams();
    Object.keys(params).forEach(function(k){p.set(k,params[k]);});
    Object.keys(PF).forEach(function(k){p.append('fields[]',PF[k]);});
    p.set('returnFieldsByFieldId','true');
    if(offset)p.set('offset',offset);
    var res=await fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID+'?'+p,{headers:{Authorization:'Bearer '+token}});
    if(!res.ok){var d={};try{d=await res.json();}catch(_){}var er=new Error(d.error&&d.error.message?d.error.message:'API '+res.status);er.status=res.status;throw er;}
    var j=await res.json();
    out=out.concat(j.records||[]);offset=j.offset;
  }while(offset);
  return out;
}
var promoViewMissing=false;
async function loadPromo(){
  var token=getToken(),area=$id('promoArea');
  if(!token){area.innerHTML='<div class="loading">No Airtable token on this device. Tap <b>⚙</b> → <b>Airtable token</b>.</div>';return;}
  if(promo.loading)return;
  promo.loading=true;
  if(!promo.loaded)area.innerHTML='<div class="loading"><div class="spin"></div>Loading promo…</div>';
  try{
    var w;
    try{w=await promoFetch(token,{view:PROMO_VIEW});promoViewMissing=false;}
    catch(e){
      if(e.status!==404&&e.status!==422)throw e;
      promoViewMissing=true;   // the Airtable view was renamed or removed: same rule, as a formula
      w=await promoFetch(token,{filterByFormula:PROMO_WAIT_FORMULA});
    }
    var rc=await promoFetch(token,{filterByFormula:PROMO_RECV_FORMULA});
    // v81: patches / pins / stickers / woven labels (not in the view)
    var xo=EXTRA_TYPE_OR(),st='ARRAYJOIN({'+PF.orderStatus+'})';
    var xw=await promoFetch(token,{filterByFormula:'AND({'+PF.ordered+'}=TRUE(),{'+PF.received+'}!=TRUE(),'+xo+','+st+'!="Completed",NOT(FIND("cancelled",LOWER('+st+'&""))))'});
    var xr=await promoFetch(token,{filterByFormula:'AND('+xo+',{'+PF.received+'}=TRUE(),IS_AFTER({'+PF.receivedTime+'},DATEADD(NOW(),-14,"days")),NOT(FIND("cancelled",LOWER('+st+'&""))))'});
    var seen={};w=w.concat(xw).filter(function(r){if(seen[r.id])return false;seen[r.id]=1;return true;});
    var seen2={};rc=rc.concat(xr).filter(function(r){if(seen2[r.id])return false;seen2[r.id]=1;return true;});
    promo.recs.waiting=pSort(w.filter(function(r){return pKeep(r,'waiting');}),'waiting');
    promo.recs.received=pSort(rc.filter(function(r){return pKeep(r,'received');}),'received');
    promo.loaded=true;promo.err='';
  }catch(e){promo.err=e.message||'load failed';if(promo.loaded)toast('Promo didn’t reload: '+promo.err,'err');}
  finally{promo.loading=false;}
  renderPromo();
  if(promo.openId&&$id('pvOverlay').classList.contains('open')){if(pvFind(promo.openId))pvRender();else pvClose();}
}

function setView(v,quiet){
  VIEW=v==='promo'?'promo':'garments';
  try{localStorage.setItem('pine_recv_view',VIEW);}catch(e){}
  ['garments','promo'].forEach(function(k){var b=$id('vw-'+k);if(b){b.classList.toggle('is-on',VIEW===k);b.setAttribute('aria-selected',VIEW===k?'true':'false');}});
  var g=VIEW==='garments';
  $id('garmentFilters').hidden=!g;$id('listArea').hidden=!g;
  $id('promoFilters').hidden=g;$id('promoArea').hidden=g;
  if(g){if(allRecords.length)renderAll();return;}
  if(!promo.loaded)loadPromo();else renderPromo();
  if(!quiet){var s=$id('promoSearch');if(s&&window.innerWidth>=1024)s.focus({preventScroll:true});}
}
window.addEventListener('DOMContentLoaded',function(){var v='';try{v=localStorage.getItem('pine_recv_view')||'';}catch(e){}if(v==='promo')setView('promo',true);});

function onPromoSearch(v){promo.q=String(v||'').trim().toLowerCase();renderPromo();}
function setPromoShow(v){promo.show=v==='received'?'received':'waiting';promo.kind='all';var s=$id('promoShow');if(s&&s.value!==promo.show)s.value=promo.show;renderPromo();}
function setPromoKind(k){promo.kind=k;renderPromo();}
// v80: vendor + arrival filters (Stephen: "can we make sure we can filter by promo items")
function clearPromoFilters(){promo.vendor='';promo.when='';promo.kind='all';promo.q='';var q=$id('promoSearch');if(q)q.value='';renderPromo();}
function setPromoVendor(v){promo.vendor=String(v||'');renderPromo();}
function setPromoWhen(v){promo.when=String(v||'');renderPromo();}
function pWhenOk(r){
  if(!promo.when)return true;
  if(promo.when==='shipped')return pval(r,'shipped')===true;
  var a=pArr(r);if(promo.when==='nodate')return !a;if(!a)return false;
  var d=pDays(a);if(promo.when==='late')return d<0&&pval(r,'received')!==true;
  if(promo.when==='week')return d>=0&&d<=7;
  return true;
}
function pFilt(r){return pMatch(r)&&(!promo.vendor||ptxt(r,'supplierName')===promo.vendor)&&pWhenOk(r);}
function pHay(r){
  return [pDesc(r),ptxt(r,'colorway'),ptxt(r,'imprintDesc'),ptxt(r,'customer'),ptxt(r,'supplierName'),String(pNum(r)),ptxt(r,'po'),
    pKindName(pKind(r)),ptxt(r,'productType'),ptxt(r,'ref'),ptxt(r,'tracking'),ptxt(r,'rep')].join(' · ').toLowerCase();
}
function pMatch(r){if(!promo.q)return true;var h=pHay(r);return promo.q.split(/\s+/).every(function(t){return h.indexOf(t)>=0;});}
function updatePromoCount(){var c=$id('promoCount');if(!c)return;c.hidden=!promo.loaded;c.textContent=promo.recs.waiting.length;}

function renderPromo(){
  var area=$id('promoArea');if(!area)return;
  updatePromoCount();
  var sel=$id('promoShow');
  if(sel){sel.options[0].textContent='Coming in'+(promo.loaded?' · '+promo.recs.waiting.length:'');sel.options[1].textContent='Received, last 14 days'+(promo.loaded?' · '+promo.recs.received.length:'');}
  if(!promo.loaded){
    if(promo.err)area.innerHTML='<div class="p-note p-note-alert err-box">Couldn’t load promo: '+esc(promo.err)+'. Tap Refresh to try again.</div>';
    return;
  }
  // v80: vendor menu lists the vendors in the current list (with counts)
  var vs=$id('promoVendor');
  if(vs){var vc={};promo.recs[promo.show].forEach(function(r){var v=ptxt(r,'supplierName')||'';if(v)vc[v]=(vc[v]||0)+1;});
    var names=Object.keys(vc).sort(function(a,b){return a.localeCompare(b);});
    if(promo.vendor&&!vc[promo.vendor])promo.vendor='';
    vs.innerHTML='<option value="">All vendors</option>'+names.map(function(n){return '<option value="'+esc(n)+'"'+(n===promo.vendor?' selected':'')+'>'+esc(n)+' · '+vc[n]+'</option>';}).join('');}
  var ws=$id('promoWhen');if(ws&&ws.value!==promo.when)ws.value=promo.when;
  var list=promo.recs[promo.show].filter(pFilt);
  // type chips -- only when the descriptions give at least two kinds
  var counts={},kinds=[];
  list.forEach(function(r){var k=pKind(r);if(!counts[k]){counts[k]=0;kinds.push(k);}counts[k]++;});
  var order=PROMO_KINDS.map(function(x){return x[0];}).concat(['other']);
  kinds.sort(function(a,b){return order.indexOf(a)-order.indexOf(b);});
  if(promo.kind!=='all'&&!counts[promo.kind])promo.kind='all';
  var chips=$id('promoChips');
  chips.innerHTML=kinds.length<2?'':['all'].concat(kinds).map(function(k){
    var on=promo.kind===k,n=k==='all'?list.length:counts[k];
    return '<button class="p-tab'+(on?' is-on':'')+'" type="button" role="tab" aria-selected="'+on+'" data-kind="'+k+'" onclick="setPromoKind(\''+k+'\')">'+esc(k==='all'?'All':pKindName(k))+' <span class="p-count">'+n+'</span></button>';
  }).join('');
  var shown=promo.kind==='all'?list:list.filter(function(r){return pKind(r)===promo.kind;});
  promo.shown=shown.map(function(r){return r.id;});
  var waiting=promo.show==='waiting';
  var note=promoViewMissing?'<div class="p-note p-note-wait" style="margin-bottom:12px">Couldn’t read the Airtable view “Promo Receiving Dashboard”, so this uses the same rule written out. Ask Stephen if the view was renamed.</div>':'';
  var head='<div class="pr-head"><span class="p-section">'+(waiting?'Coming in':'Received, last 14 days')+'</span><span class="p-head-sum"><b>'+shown.length+'</b> item'+(shown.length!==1?'s':'')+(waiting?' · soonest expected first':' · newest first')+'</span></div>';
  if(!shown.length){
    var other=waiting?'received':'waiting',on=promo.recs[other].filter(pMatch).length;
    if(promo.vendor||promo.when){area.innerHTML=note+head+'<div class="empty" style="flex-direction:column">Nothing matches these filters.<div class="pr-more"><button class="p-btn" type="button" onclick="clearPromoFilters()">Clear filters</button></div></div>';return;}
    var msg=promo.q?'Nothing here matches “'+esc(promo.q)+'”.':(waiting?'No promo is waiting to come in.':'Nothing received in the last 14 days.');
    var more=(promo.q&&on)?'<div class="pr-more"><button class="p-btn" type="button" onclick="setPromoShow(\''+other+'\')">'+on+' match'+(on!==1?'es':'')+' in '+(other==='received'?'Received':'Coming in')+' — show</button></div>':'';
    area.innerHTML=note+head+'<div class="empty" style="flex-direction:column">'+msg+more+'</div>';
    return;
  }
  area.innerHTML=note+head+'<div class="pr-grid" id="promoGrid">'+shown.map(promoCard).join('')+'</div>';
}
function promoTags(r,full){
  var t='',ven=ptxt(r,'supplierName');
  if(pval(r,'received')===true){var at=pRecvAt(r);t+='<span class="p-tag p-tag-done">✓ Received'+(at?' '+pFmt(at):'')+'</span>';}
  else{
    var a=pArr(r),d=pDays(a);
    if(a&&d<0)t+='<span class="p-tag p-tag-alert">Late · expected '+pFmt(a)+'</span>';
    else if(a)t+='<span class="p-tag p-tag-soft">Expected '+(d===0?'today':d===1?'tomorrow':pFmt(a))+'</span>';
    if(pval(r,'shipped')===true)t+='<span class="p-tag p-tag-soft">Vendor shipped</span>';
  }
  if(ven&&full!==false&&pDesc(r))t+='<span class="p-tag p-tag-soft">'+esc(ven)+'</span>';   // no description = the title already names the vendor
  var due=pDue(r);if(due)t+='<span class="p-tag p-tag-soft">Due '+pFmt(due)+(pHard(r)?' (hard)':'')+'</span>';
  return t;
}
function promoCard(r){

  var title=pTitle(r),num=pNum(r),cust=ptxt(r,'customer'),qty=pQty(r),id=esc(r.id);
  var ph='<div class="pc-ph'+(th?' under':'')+'">'+(th?'':'<small>No mockup in Airtable</small>')+'<b>'+esc(title)+'</b></div>';
  var img=th?'<img src="'+esc(th)+'" alt="" loading="lazy" decoding="async" onerror="var c=this.closest(\'.pc\');if(c)c.classList.add(\'no-img\');this.remove()">':'';
  return '<div class="pc'+(pval(r,'received')===true?' is-done':'')+'" id="pc-'+id+'" role="button" tabindex="0" aria-label="'+esc(num+' '+cust+': '+title)+'" onclick="pvOpen(\''+id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();pvOpen(\''+id+'\');}">'
    +'<div class="pc-img">'+ph+img+'</div>'

    +'</div></div>';

    +(cur&&cur.url?'<a href="'+esc(cur.url)+'" target="_blank" rel="noopener">Open '+esc(cur.filename||'file')+' ↗</a>':'')+'</div>':'';
  var desc=pDesc(r);

  var st=ptxt(r,'orderStatus');

  fact('Vendor',esc(ven));
  fact('PO',esc(po));
  var a=pArr(r);fact('Expected',a?esc(pFmt(a))+(!recvd&&pDays(a)<0?' <span class="p-tag p-tag-alert">Late</span>':''):'Not set');
  var due=pDue(r),dl=ptxt(r,'deadline');fact('Due',(due?esc(pFmt(due)):'—')+(dl?' · '+esc(dl):''));

  fact('Colour',esc(ptxt(r,'colorway')));

  fact('Delivery',ord&&ord.dlvMethod&&ord.dlvMethod!=='—'?esc(ord.dlvMethod):'');
  if(recvd){var at=pRecvAt(r);fact('Received',at?esc(at.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})):'Yes');}
  // v82: long links in notes become a short "riverspromo.com ↗" link instead of running off the box
  function nt(t){return esc(t).replace(/https?:\/\/[^\s<]+/g,function(u){var h=u.replace(/^https?:\/\/(www\.)?/,'').split(/[\/?#]/)[0];return '<a href="'+u+'" target="_blank" rel="noopener">'+h+' \u2197</a>';});}
  var notes=[],sn=ptxt(r,'shipNotes');
  if(sn&&/direct/i.test(sn))notes.push('<div class="p-note p-note-wait"><b>Shipping:</b> '+nt(sn)+'</div>');
  else if(sn)notes.push('<div class="p-note"><b>Shipping:</b> '+nt(sn)+'</div>');
  [['salesNotes','Sales'],['lineNotes','Line notes'],['finNotes','Finishing'],['prodNotes','Production']].forEach(function(x){var t=ptxt(r,x[0]);if(t)notes.push('<div class="p-note"><b>'+x[1]+':</b> '+nt(t)+'</div>');});
  if(ord&&ord.orderNotes)notes.push('<div class="p-note"><b>Order notes:</b> '+nt(ord.orderNotes)+'</div>');
  var lines=promo.lines[num];
  var linesHtml=lines===undefined?'<div class="p-hint">Loading the order…</div>'
    :(lines===null?'<div class="p-hint">Couldn’t load the rest of the order.</div>'
    :'<div class="pv-lines">'+lines.map(function(l){
      var f=l.fields||{},th=(pImgs(l,PL.proofImages)[0]),pt=pflat(f[PL.productType]).join(''),nm=String(f[PL.desc]||'').trim();
      if(/apparel/i.test(pt)||!nm)nm=String(f[PL.garment]||'').trim()||nm||String(f[PL.ref]||'');
      if(l.id===r.id&&pDesc(r))nm=pDesc(r);
      return '<div class="pv-line'+(l.id===r.id?' is-me':'')+'"><span class="th">'+(th?'<img src="'+esc(attThumb(th,'small'))+'" alt="" loading="lazy">':'')+'</span>'
        +'<span class="nm" title="'+esc(nm)+'">'+esc(nm||'—')+(pt?' <span class="p-hint">· '+esc(pt)+'</span>':'')+'</span>'
        +'<span class="q">'+Number(f[PL.qty]||0)+'</span>'
        +(f[PL.received]===true?'<span class="p-tag p-tag-done">✓ In</span>':'<span class="p-tag p-tag-soft">Waiting</span>')+'</div>';
    }).join('')+'</div>');
  var ext=Number(pval(r,'extras')||0);
  $id('pvBody').innerHTML='<div class="pv-grid">'
    +'<div><div class="pv-main">'+main+'</div>'+thumbs+'</div>'
    +'<div class="pv-side">'
    +'<div class="pv-desc">'+(desc?esc(desc):'<span class="p-hint" style="font-size:16px">No product description in Airtable — go by the picture.</span>')+'</div>'
    +'<div class="pv-qty"><span class="p-big">'+pQty(r)+'</span><small>pieces'+(ext>0?' + '+ext+' extras':'')+'</small></div>'
    +'<dl class="pv-facts">'+facts.join('')+'</dl>'
    +(notes.length?'<div class="pv-notes">'+notes.join('')+'</div>':'')
    +'<div><div class="p-label" style="margin-bottom:6px">Everything on order '+esc(String(num))+'</div>'+linesHtml+'</div>'
    +'</div></div>';
  var lblMain=recvd;
  $id('pvFoot').innerHTML='<span class="pv-state">'+(recvd?'✓ Received. Label the box so it can be found.':'Box matches the picture? Mark it received, then label it.')+(SIMULATE?' (Practice — nothing is saved)':'')+'</span>'
    +'<button class="p-btn'+(lblMain?' p-btn-main':'')+'" type="button" id="pvLbl" onclick="promoLabel(\''+esc(r.id)+'\')">Print box label</button>'
    +(recvd?'':'<button class="p-btn p-btn-main" type="button" id="pvRecv" onclick="promoReceive(\''+esc(r.id)+'\')">✓ Mark received</button>');
}
function pvLoadMore(id){
  var r=pvFind(id);if(!r)return;var num=pNum(r);if(!num)return;
  var token=getToken();if(!token)return;
  function again(){var cur=pvFind(promo.openId);if(cur&&pNum(cur)===num&&$id('pvOverlay').classList.contains('open')){var b=$id('pvBody'),s=b?b.scrollTop:0;pvRender();if(b)b.scrollTop=s;}}
  if(!promo.order[num])rlFetch(num,function(d){promo.order[num]=d;again();});
  if(promo.lines[num]!==undefined&&promo.lines[num]!==null)return;
  var p=new URLSearchParams();
  p.set('filterByFormula','{Invoice / Order Number Lookup}='+num);
  Object.keys(PL).forEach(function(k){p.append('fields[]',PL[k]);});
  p.set('returnFieldsByFieldId','true');p.set('pageSize','100');
  fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID+'?'+p,{headers:{Authorization:'Bearer '+token}})
  .then(function(res){return res.ok?res.json():null;})
  .then(function(j){
    if(!j){promo.lines[num]=null;again();return;}
    promo.lines[num]=(j.records||[]).filter(function(l){var f=l.fields||{};var n=pflat(f[PL.orderNum])[0];return parseInt(n,10)===num&&Number(f[PL.qty]||0)>0;})
      .sort(function(a,b){return String((a.fields||{})[PL.ref]||'').localeCompare(String((b.fields||{})[PL.ref]||''));});
    again();
  })
  .catch(function(){promo.lines[num]=null;again();});
}
document.addEventListener('keydown',function(e){
  if(!$id('pvOverlay')||!$id('pvOverlay').classList.contains('open'))return;
  if(e.key==='Escape'){e.preventDefault();pvClose();return;}
  var a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;
  if(e.key==='ArrowRight'){e.preventDefault();pvStep(1);}else if(e.key==='ArrowLeft'){e.preventDefault();pvStep(-1);}
});

// ---- receive / undo (the Line Items Received checkbox, as garments) ----
function promoMove(r,on){
  r.fields=r.fields||{};
  r.fields[F.received]=on?true:null;r.fields[F.receivedTime]=on?new Date().toISOString():null;
  promo.recs.waiting=promo.recs.waiting.filter(function(x){return x!==r;});
  promo.recs.received=promo.recs.received.filter(function(x){return x!==r;});
  if(on)promo.recs.received.unshift(r);
  else{promo.recs.waiting.push(r);pSort(promo.recs.waiting,'waiting');}
  var lines=promo.lines[pNum(r)];
  if(lines)lines.forEach(function(l){if(l.id===r.id){l.fields=l.fields||{};l.fields[PL.received]=on?true:null;}});
}
async function promoReceive(id){
  var r=pvFind(id);if(!r||pval(r,'received')===true)return;
  var token=getToken();if(!token){toast('No token','err');return;}
  if(!WRITES_ENABLED&&!SIMULATE){toast('Writes disabled','err');return;}
  var btn=$id('pvRecv');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  var num=pNum(r),label=num+' · '+(ptxt(r,'customer')||'');
  if(SIMULATE){
    promoMove(r,true);
    toast('Practice: '+label+' received (not saved)','ok');
    renderPromo();if(promo.openId===id)pvRender();
    return;
  }
  saving++;
  var prevUndo=lastReceive;
  try{
    var fields={};fields[F.received]=true;
    captureReceiveUndo(String(num));lastReceive.promo=true;addUndoLine(r,fields);
    var res=await fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID+'/'+r.id,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({fields:fields})});
    if(!res.ok){var d={};try{d=await res.json();}catch(_){}throw new Error(d.error&&d.error.message?d.error.message:'API '+res.status);}
    promoMove(r,true);
    toast('Received: '+label,'ok');
    updateUndoBtn();
    renderPromo();if(promo.openId===id)pvRender();
  }catch(e){
    lastReceive=prevUndo;updateUndoBtn();
    toast('Couldn’t save: '+e.message,'err');
    if(btn){btn.disabled=false;btn.textContent='✓ Mark received';}
  }finally{saving--;}
}
// called by undoLastReceive after the write: put undone promo lines back in Coming in
function promoUndoLocal(snap){
  var any=false;
  snap.lines.forEach(function(l){var r=pvFind(l.recId);if(!r)return;any=true;
    var on=l.prev[F.received]===true;promoMove(r,on);});
  if(any){renderPromo();if(promo.openId&&$id('pvOverlay').classList.contains('open'))pvRender();}
}

// ---- promo box label (same 4x6 look as the garment box label; no auto boxing, no box-logic logging) ----
function promoLabel(id){
  var r=pvFind(id);if(!r)return;var num=pNum(r);
  var win;
  try{win=window.open('','_blank','width=520,height=820,toolbar=0,menubar=0,location=0,status=0,scrollbars=1');}catch(e){}
  if(!win){toast('Allow pop-ups for box labels','err');return;}
  try{win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Promo label - '+num+'<\/title><\/head><body style="font:16px Arial,sans-serif;padding:30px;color:#666">Loading order '+num+'…<\/body><\/html>');}catch(e){}
  function go(info){try{win.document.open();win.document.write(promoLabelDoc(r,info||{}));win.document.close();}catch(e){toast('Label error: '+e.message,'err');}}
  if(promo.order[num])go(promo.order[num]);else rlFetch(num,function(d){promo.order[num]=d;go(d);});
}

    +'<div class="cb-c"><b>PO</b><span>'+esc(po||'—')+'</span></div>'
    +'<div class="cb-c"><b>Delivery</b><span>'+esc(info.dlvMethod&&info.dlvMethod!=='—'?info.dlvMethod:'—')+'</span></div>'
    +'</div></div>'
    +(qr?'<div class="cb-qrw"><div class="cb-qr" data-url="'+esc(qr)+'"></div><div class="cb-qrc">SCAN FOR MOCKUPS</div></div>':'')
    +'</div>'
    +'<table class="cb-t"><colgroup><col style="width:78%"><col style="width:22%"></colgroup>'
    +'<tr><th>What’s inside</th><th>Qty</th></tr>'
    +'<tr><td><span contenteditable="true">'+esc(pTitle(r))+'</span><small contenteditable="true">'+esc(ptxt(r,'ref'))+'</small></td>'
    +'<td class="q cb-q'+(String(pQty(r)).length>=4?' q4':'')+'" contenteditable="true">'+pQty(r)+'</td></tr></table>'
    +'<div class="cb-notes"><b>NOTES:</b> '+esc(notes)+'</div>'

    +'<div class="cb-foot"><span>PROMO RECEIVED</span><div class="cb-chk">'+chk+'</div></div>'

    +'<style>'+CB_CSS+'<\/style><\/head><body>'
    +'<div class="cb-bar"><span class="cb-cnt">Promo box label · tap any text to fix it</span><button onclick="window.print()">🖨 Print label</button></div>'
    +page+'<script>'+CB_SCRIPT+'<\/script><\/body><\/html>';
}

/* v73: self-update (pine-update.js). Busy = someone is mid-task, so show the "Update now" bar instead of reloading:
   counts typed but not saved, any pop-up open, a save or load running, an "All here" confirm armed,
   the token box open, or a receive from the last 5 minutes that could still be undone. */
var saving=0;
window.pineBusy=function(){
  try{
    if(saving>0||loading||promo.loading)return true;   // v79: + promo loading
    if(Object.keys(pending).some(function(id){var p=pending[id]||{};return Object.keys(p).some(function(k){return p[k]!==null&&p[k]!==undefined&&p[k]!=='';});}))return true;
    if(document.querySelector('.ms-overlay.open,.print-overlay.open,.pm.open,#adminBox:not([hidden])'))return true;
    if(document.querySelector('.ahw .p-btn-main'))return true;
    if(lastReceive&&lastReceive.at&&Date.now()-lastReceive.at<5*60*1000)return true;
    return false;
  }catch(e){return true;}
};
