<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- v84 (2026-10-28) -- no browser pop-ups left (Stephen: "Do the 5 bugs first"). In the box-label window, "✕ Remove Box" on
     the only box showed a browser alert(); it now shows a short black note at the bottom of that window ("This is the only
     box — it can't be removed."), gone after 4 seconds and never printed. Nothing else changed.
     v83 (2026-10-20) -- top bar and the band under it match the Pine standard (Seps / Screens). The filter chips share the
     search line (.p-chips-inline, as Seps) on the Garments page, so the band is one line at 1280 and 1440 (the chips used
     to drop to a second line, 124px). Promo: the search and its three menus are line 1 and the type chips have their own
     line under them (v82 put the chips beside the search and pushed the menus to a lone second line); one line at 1900px+.
     Phone bar gap 8px, as Seps. Receive buttons stay where they were. Nothing else changed.
     v82 (2026-10-19) -- Promo big view: a long web link in a note (e.g. a Rivers Promo product page) ran off the note box; links now
     show as a short "riverspromo.com ↗" link and long words wrap.
     v81 (2026-10-19) -- Promo page also shows patches (embroidered, woven, sublimated, DecoPress, leather, silicone), woven clip labels,
     pins and stickers (Stephen: "Yes to patches and stickers etc"), each with its own type chip.
     v80 (2026-10-19) -- Promo page filters: vendor menu (with counts) and arrival menu (Late / Expected this week / Vendor shipped /
     No expected date), plus Clear filters. Stephen: "can we make sure we can filter by promo items".
     v79 (2026-10-19) -- Promo page (Stephen: unlabeled boxes from overseas -- "open up the box and then we can quickly
     visualize where it goes"). Bar views Garments | Promo (remembered on this computer). Promo = a picture grid of the
     promo / patch / pin / sticker lines still coming in (Line Items whose Product Type isn't apparel), biggest thing on
     each card is the line's Proof Images mockup. Search by any words (product, colour, customer, vendor, order #, PO),
     type chips, Show: waiting / not marked ordered / received (14 days). Click a card for the big view: mockups, details,
     the order's other lines, notes, "Print box label" (a promo 4x6 label, same look as the garment one) and "Received"
     (the same Line Items Received checkbox the garments use; Undo in the bar). Promo data only loads when Promo is opened.
     Garment screens, reads and writes unchanged.
     v78 (2026-10-19) -- Receive button back at the top right of each line (Stephen preferred it there); hint under it.
     v77 (2026-10-19) -- fixes from the Receiving scan + desktop flow.
  - Staging: resolving the last open mis-ship now stages the order; Refresh stages orders that are fully in with no
    open mis-ship (same rule as after a receive) and says which; a failed progress read or stage write shows a note
    and is retried on Refresh; the receive flow waits for the stage write so Undo can't race it; a stage only joins
    Undo when it came from that receive. Practice on/off reloads from Airtable (practice edits can't drive real writes).
  - All here uses typed counts; a line whose typed counts differ goes through the normal mismatch check.
  - Resolving a mis-ship on a line not yet received keeps the line on screen. Received lines with an open mis-ship
    show in Mis-ships. "Go back" in the check puts the count boxes back as they were. Garment colour shows again in
    the line names (the box label's getGarmentName had replaced the screen one). Label windows' postMessage is checked.
  - Tabs all count orders; empty tabs are dimmed. Filter row: search · tabs · vendor + Sort at the right end.
  - Receive sits under the Counted column (Enter in a count box receives); narrower boxes. The done pop-up only opens
    when the whole order is in. Pieces count the whole order. Old box label editor moved under the gear. Kit pop-ups
    and toast. pine-confirm.js loaded. Airtable writes unchanged for normal flows.
-->
<!-- v76 (2026-10-15) -- desktop first (Receiving runs on a desktop, not the iPad).
  - At >=1400px two panes (kit .p-split, as Damage Log v21): order list with the date labels on the left, the picked
    order (prints, lines, counting table, Receive) on the right, each pane with its own scroll. First order is picked
    by default; click or ↑/↓ to move. Re-renders when the window crosses 1400px.
  - Below 1400px: v75's open-in-place cards, now full width with 24px gutters. At >=1400px the filter chips share
    the line with search.
  - Typed counts stay when you switch orders or Refresh (as v74); a list card shows "Counts typed" so they aren't
    forgotten. Same Airtable reads and writes as v75.
-->
<!-- v75 (2026-10-15) -- Pine PAGE KIT, so Receiving feels like Damage Log v20 and Purchasing v107.
  - Bar: mark · RECEIVING · version · Practice tag · Undo (only after a receive) · Refresh (.p-barbtn) · ⚙ (.p-barbtn-icon).
    The ⚙ menu (.p-menu) holds the Airtable token and the practice switch (was a sheet + a separate token strip).
  - One .p-filters row: search · vendor + sort · filter chips on one line that scrolls sideways.
  - Orders are .p-lc cards: ID badge · customer + PO · Pieces (.p-num) · All here; status tags on row 2.
    They open in place, one at a time. The three prints moved from a Print ▾ dropdown into the open card.
  - Status tags: waiting / partly in are cream facts, all in is black, a mis-ship is red. Yellow only for "prints
    soon" (PO sort) and the Receive button. Same Airtable reads and writes as v74.
-->
<!-- v74 (2026-10-15) -- Refresh keeps typed counts. Counts typed but not received yet are carried across the reload
  for lines that are still open (same record, still not received). Lines received or gone in the meantime drop
  their counts, and a toast says how many lines kept counts. Also: the line's difference pill counts blank sizes as
  "all there" (as Receive does), so typing M=8 of 10 shows -2, not -24. No Airtable changes.
-->
<!-- v73 (2026-10-15) -- Pine style v2 + self-update.
  - Loads Poppins + pine-style-v2.css (was pine-design-v1.css). Black top bar: Pine mark, RECEIVING, version,
    practice pill, then Undo / Refresh / settings. Black, white, cream, Pantone 107; red only for mis-ships,
    late shipments and errors. No Courier, nothing under 12px, 44-56px touch targets.
  - Self-update: pine-update.js (data-link receiving.html). pineBusy = counts typed, a pop-up open, a save running,
    an "All here" confirm armed, or an undo less than 5 minutes old. Refresh also checks for a new version.
  - Practice (?practice=1, or settings > Practice) shows the pill in the bar; switching it keeps the URL in step
    so an update reload stays in practice. Undo is cleared when practice turns on, so it can't write for real.
  - Flow: order header shows the order ID badge, customer and PO on two lines (no more cut-off names); the line
    detail drops the block that repeated supplier / PO / dates / totals and the View Proof button (tap the picture).
    Filters are tabs; Practice and Token live under settings; Undo only shows when there is something to undo.
  - Bugs: opening a line / flagging or resolving a mis-ship re-drew the order unfiltered (24h-received lines popped
    back into All, status word went stale); a failed receive left Undo pointing at it; a half-saved All here didn't
    offer Undo; markRecv no longer crashes if its button is gone; phone layout no longer overflows.
  - Airtable reads/writes unchanged (payloads checked against v72). -->
<title>Receiving v84</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap">
<link rel="stylesheet" href="pine-style-v2.css">
<style>
/* v73: legacy tokens remapped to Pine style v2 (the JS still uses a few of them inline) */
:root{--bg:#F7F0E4;--bg-soft:#FBF7EF;--surface:#fff;--border:#E2D2B6;--border-dk:#CDBB9B;--text:#141412;--muted:#6E6757;--muted-lt:#A79F8E;
  --green:#141412;--green-lt:#EFE2CD;--green-dk:#141412;--yellow:#FBE122;--red:#C62828;--red-bg:#FBE9E7;--red-bd:#F2C4BF;
  --amb:#4A453C;--amb-bg:#FEF6C2;--amb-bd:#FBE122;--sb-bg:#141412;--sb-border:#2B2A26;
  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;--cond:var(--sans);--mono:var(--sans);--radius:6px;--radius-lg:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--p-cream-lt);color:var(--p-black);font:400 16px/1.4 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit}
[hidden]{display:none!important}

/* ---- top bar (v75: Pine page kit .p-barbtn + .p-menu) ---- */
.p-barbtn.undo{border-color:var(--p-yellow);color:var(--p-yellow)}
.p-barbtn:disabled{opacity:.45;cursor:default}
.p-menu .menu-line{display:flex;gap:var(--p-s2);align-items:center;justify-content:space-between}
.p-menu .menu-line .p-input{flex:1;min-width:0}

/* ---- filter row (.p-filters) ---- */
.p-filters .vendor-select{width:auto;min-width:170px;max-width:240px;font-weight:700}
.p-filters .sort-btn{flex:none}
.p-chips .p-tab.alert .p-count{background:var(--p-alert);color:#fff}
.p-tab.zero{border-color:var(--p-line-strong);color:var(--p-ink-3)}   /* v77: empty tab dimmed, as Damage Log / Screens */
.list-note{margin:12px 24px 0}

/* ---- list (.p-lc order cards; date labels stay .p-section) ---- */
.list-area{padding:12px 24px 120px;display:flex;flex-direction:column;gap:8px}   /* v76: desktop app -- full width, 24px gutters */
@media (min-width:701px){ .p-filters{padding-left:24px;padding-right:24px} }
@media (max-width:700px){ .p-bar{gap:8px} }   /* v83: as Seps / Screens / Damage Log (phone bar 116px with the views row, was 120) */
/* v83: chips share the search line at every width over 600px (.p-chips-inline, as Seps); they scroll sideways if short of room.
   The garment search stays 360px at most (as v82 at >=1400px), so all five chips fit at 1440 */
@media (min-width:601px){ #garmentFilters .p-search{max-width:360px} }
/* Promo has three menus on the right (vendor, arrival, show), so its type chips only fit beside the search on very wide
   screens; below that they get their own full line under the search (v82 put them beside the search and dropped the
   menus to a second line on the right) */
@media (min-width:1900px){ #promoChips{flex:1 1 0;order:0} }
/* v76: two panes at >=1400px (kit .p-split) */
#listArea.is-split{padding:0 24px}
.p-split-list{display:flex;flex-direction:column;gap:8px}
.p-split-list .date-hdr{margin:12px 0 2px}
.p-split-list .date-hdr:first-child{margin-top:0}
.p-split-list .p-lc{flex:none}
.p-split-detail>.p-lc>.p-lc-head{background:#fff}
.p-split-detail .p-lc-body{gap:var(--p-s3)}
.date-hdr{margin:14px 0 2px}
.date-hdr:first-child{margin-top:4px}
.p-lc + .p-lc{margin-top:0}
.p-lc-head{user-select:none;-webkit-user-select:none}
.p-lc-head.is-tap:hover{background:var(--bg-soft)}
.p-lc-title{font-size:19px}
.p-lc-chev{display:inline-block;font-size:18px;transition:transform .12s}
.p-lc.is-open .p-lc-chev{transform:rotate(90deg);color:var(--p-black)}
.p-lc:not(.is-open) .p-lc-body{display:none}
.p-lc.is-open>.p-lc-head{border-bottom:0}
.p-lc-body{padding:var(--p-s3)}
.og-prints{display:flex;gap:var(--p-s2);align-items:center;flex-wrap:wrap}
.og-prints .p-label{margin-right:4px}
.ahw{display:inline-flex;align-items:center;gap:4px}
.ahw .p-btn-quiet{min-width:44px;font-size:20px;text-decoration:none}

/* ---- line items (inside the open card) ---- */
.li-wrap{background:#fff;border:1px solid var(--p-line);border-radius:var(--p-r-lg);overflow:hidden}
.li{border-top:1px solid var(--p-line)}
.li:first-child{border-top:none}
.li-row{display:flex;align-items:center;gap:16px;padding:14px 16px;cursor:pointer}
.li-row:hover{background:var(--bg-soft)}
.li-exp .li-row{background:var(--p-cream);border-bottom:1px solid var(--p-line)}
.li-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.li-ref{font-size:12px;color:var(--p-ink-3)}
.li-name{font-size:20px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.li-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.li-detail{display:none;padding:16px;background:var(--bg-soft)}
.li-exp .li-detail{display:block}
.detail-actions-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dat-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.detail-actions-top>.p-btn-main{margin-left:auto}   /* v78: Receive stays top right even with no Flag button */
.btn.match,.p-btn.match{min-width:260px}
.recv-hint{font-size:14px;color:var(--p-ink-2);margin:0 0 12px}
.detail-actions-top:empty,.dat-left:empty{display:none}

.size-wrap{overflow-x:auto;margin-bottom:6px}
.size-tbl{width:100%;border-collapse:collapse;font-size:18px;table-layout:fixed;background:#fff}
.size-tbl th{padding:8px 12px;font:700 12px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-2);background:var(--p-cream);border:1px solid var(--border);text-align:left}
.size-tbl td{padding:6px 12px;border:1px solid var(--border);vertical-align:middle}
.size-tbl tr.tot td{background:var(--p-cream-lt);font-weight:700;border-top:2px solid var(--p-black)}
.s-lbl{font-weight:800}
.s-ext{color:var(--p-ink-2)}
.ainp{width:100%;max-width:120px;min-height:56px;background:#fff;border:2px solid var(--p-line-strong);border-radius:var(--p-r);padding:8px 12px;font:700 20px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--p-black);-moz-appearance:textfield}
.ainp::placeholder{color:#B7AE9C;font-weight:400}
.ainp::-webkit-outer-spin-button,.ainp::-webkit-inner-spin-button{-webkit-appearance:none}
.ainp:focus{outline:none;border-color:var(--p-black);box-shadow:0 0 0 3px var(--p-yellow)}
.act-cell{display:flex;align-items:center;gap:10px}
.tot .act-cell{gap:12px}
/* v77: Receive sits right under the Counted column, so the hand goes boxes -> button */
.size-tbl{max-width:760px}
.size-tbl tr.recv-row td{background:var(--p-cream-lt);border-top:2px solid var(--p-black);padding:10px 12px}
.size-tbl tr.recv-row .recv-hint{margin:0}
.size-tbl tr.recv-row .p-btn{width:100%;min-width:0;white-space:normal;line-height:1.2}

.dpill{display:inline-flex;align-items:center;height:28px;padding:0 9px;border-radius:4px;border:1.5px solid var(--p-black);font:700 13px/1 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;background:#fff;color:var(--p-black)}
.dpill.ok{background:var(--p-black);color:#fff}
.dpill.sh{border-color:var(--p-alert);color:var(--p-alert)}
.dpill.ov{background:var(--p-yellow)}
.dpill.em{border-color:var(--border);color:var(--p-ink-3)}

.ms-block{border-radius:var(--p-r);padding:10px 14px;margin-bottom:12px;font-size:15px;border-left:4px solid}
.ms-block.flagged{background:var(--p-alert-lt);border-color:var(--p-alert);color:#7A1414}
.ms-block.inprog{background:var(--p-yellow-lt);border-color:var(--p-yellow)}
.ms-title{font:800 12px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.ms-note{color:var(--p-black);line-height:1.45;font-size:15px}

.err-box{margin:16px}
.loading,.empty{display:flex;align-items:center;justify-content:center;gap:10px;padding:48px 16px;color:var(--p-ink-2);font-size:16px;text-align:center}
.spin{width:18px;height:18px;border:3px solid var(--border);border-top-color:var(--p-black);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}

.jc-thumb{width:80px;height:80px;border-radius:var(--p-r);background:var(--p-cream-lt);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.jc-thumb.zoom{cursor:zoom-in}
.jc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.jc-thumb-ph{width:28px;height:28px;opacity:.25}

/* proof viewer */
.pm{display:none;position:fixed;inset:0;z-index:800;background:rgba(20,20,18,.94);flex-direction:column}
.pm.open{display:flex}
.pm-bar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--p-black);flex-shrink:0}
.pm-close{min-height:44px;padding:0 18px;border-radius:var(--p-r);border:2px solid var(--p-yellow);background:transparent;color:var(--p-yellow);cursor:pointer;font:700 16px/1 var(--sans)}
.pm-fn{font-size:15px;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
.pm-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:var(--p-r)}
.pm-loading{color:#ccc;font-size:16px}

/* toast: kit .p-toast (v77), kept above the pop-ups */
.p-toast{z-index:999;animation:tup .18s ease}
.p-toast.is-alert{padding-left:22px}
@keyframes tup{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

/* pop-ups (same look as .p-modal) */
.print-overlay,.ms-overlay{display:none;position:fixed;inset:0;background:rgba(20,20,18,.55);z-index:600;align-items:center;justify-content:center;padding:16px}
.print-overlay.open,.ms-overlay.open{display:flex}
.print-box{background:#fff;border-radius:var(--p-r-lg);padding:20px 24px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
/* v77: the three pop-ups use the kit .p-modal (head / body / foot) */
.ms-overlay .p-modal{max-height:calc(100vh - 32px)}
.ms-overlay .p-modal-h{display:block}
.p-modal.gd-box{width:min(720px,100%)}
.gd-box .p-modal-f{flex-wrap:nowrap}
.gd-box .p-modal-f .p-btn{white-space:nowrap}
.print-box{width:auto;max-width:100%}
.ms-box-hdr,.print-hdr{font:700 20px/1.2 var(--sans);color:var(--p-black);margin-bottom:4px}
.p-modal-h .ms-box-sub{margin:0}
.ms-box-sub{font-size:14px;color:var(--p-ink-2);margin-bottom:14px}
.ms-box-lbl{display:block;font:700 12px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-2);margin-bottom:6px}
.ms-box-ta{min-height:110px}
.print-footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.print-hdr{margin-bottom:12px}
.print-hdr span{font:700 12px/1 var(--sans);color:var(--p-ink-3)}
.po-prev-wrap{width:300px;height:450px;margin:0 auto 4px;border:1px solid var(--border);border-radius:var(--p-r);overflow:hidden;background:#fff}
.po-prev{width:384px;height:576px;border:0;display:block;transform:scale(.78);transform-origin:top left}
.js-box{max-width:560px}
.js-prev-wrap{width:506px;max-width:100%;height:392px;margin:0 auto 4px;border:1px solid var(--border);border-radius:var(--p-r);overflow:auto;background:#fff}
.js-prev-inner{width:506px;height:392px}
.js-prev{width:1056px;height:816px;border:0;display:block;transform:scale(.479);transform-origin:top left}
.gd-list{margin:10px 0 4px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.gd-list li{display:flex;justify-content:space-between;gap:12px;font-size:16px;padding:10px 12px;background:var(--p-cream-lt);border-radius:var(--p-r)}
.gd-list .sh{color:var(--p-alert);font-weight:800}.gd-list .ov{font-weight:800}
.gd-text{font-size:16px;line-height:1.45}
.done-steps{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.done-step{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;text-align:left;background:#fff;border:2px solid var(--p-black);border-radius:var(--p-r-lg);padding:12px 16px;cursor:pointer;color:var(--p-black)}
.done-step:hover{background:var(--p-cream-lt)}
.done-step .n{width:40px;height:40px;border-radius:50%;background:var(--p-yellow);color:var(--p-black);border:2px solid var(--p-black);display:flex;align-items:center;justify-content:center;font:900 18px/1 var(--p-display);flex-shrink:0}
.done-step b{display:block;font-size:18px}
.done-step small{display:block;font-size:14px;color:var(--p-ink-2);margin-top:2px}
.done-step .ck{margin-left:auto;font-size:22px;font-weight:800}
.done-step.done{background:var(--p-cream)}
.done-step.done .n{background:var(--p-black);color:#fff}
.done-wait{margin-top:12px;border-left:4px solid var(--p-yellow);background:var(--p-yellow-lt);border-radius:var(--p-r);padding:10px 12px}
.done-wait-h{font:800 12px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--p-ink-2);margin-bottom:6px}
.done-wait-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--p-line);font-size:15px}
.done-wait-r:first-of-type{border-top:none}

/* ---- v79: Promo page (picture grid + big view) ---- */
.pr-area{padding:16px 24px 120px}
.pr-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.pr-head .p-head-sum{font-size:15px}
.pr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pc{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--p-line);border-radius:var(--p-r-lg);overflow:hidden;cursor:pointer;padding:0;color:var(--p-black);font:inherit;box-shadow:var(--p-shadow);transition:transform .08s,box-shadow .08s}
.pc:hover{border-color:var(--p-black);box-shadow:0 2px 4px rgba(20,20,18,.08),0 10px 24px rgba(20,20,18,.14)}
.pc:active{transform:scale(.99)}
.pc.is-done{opacity:.72}
.pc-img{position:relative;aspect-ratio:4/3;background:var(--p-cream);overflow:hidden;border-bottom:1px solid var(--p-line)}
.pc-img img{width:100%;height:100%;object-fit:cover;display:block}
.pc-ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:18px;background:var(--p-cream)}
.pc-ph b{font:800 22px/1.15 var(--p-sans);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pc-ph small{font:700 12px/1.2 var(--p-sans);text-transform:uppercase;letter-spacing:.08em;color:var(--p-ink-2)}
.pc-img .pc-ph.under{z-index:0}.pc-img img{position:relative;z-index:1}
.pc-flag{position:absolute;left:10px;top:10px;z-index:2}
.pc-body{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px;flex:1}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc-qty{font:800 16px/1 var(--p-sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-qty small{font:700 12px/1 var(--p-sans);color:var(--p-ink-2);margin-left:3px}
.pc-desc{font:700 17px/1.25 var(--p-sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pc-cust{font-size:15px;color:var(--p-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .p-tags{margin-top:auto;padding-top:4px}
.pr-more{margin-top:10px}
.pc.no-img .pc-desc{display:none}   /* picture failed: the description shows big in its place */
/* big view */
.p-modal.pv-box{width:min(1240px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.pv-box .p-modal-h{display:flex;align-items:center;gap:12px}
.pv-box .p-modal-b{overflow:auto;flex:1;min-height:0}
.pv-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pv-title b{font:700 20px/1.2 var(--p-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-title span{font-size:14px;color:var(--p-ink-2)}
.pv-nav{display:flex;gap:4px}
.pv-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:24px;align-items:start}
.pv-main{background:var(--p-cream);border:1px solid var(--p-line);border-radius:var(--p-r-lg);min-height:360px;height:min(62vh,640px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pv-main img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.pv-main .pc-ph{position:static;width:100%;height:100%;padding:32px}
.pv-main .pc-ph b{font-size:30px;-webkit-line-clamp:6}
.pv-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pv-thumbs button{width:72px;height:72px;padding:0;border:2px solid var(--p-line);border-radius:var(--p-r);overflow:hidden;background:#fff;cursor:pointer}
.pv-thumbs button.is-on{border-color:var(--p-black);box-shadow:0 0 0 2px var(--p-yellow)}
.pv-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.pv-thumbs a{font-size:14px;color:var(--p-ink-2);margin-left:4px}
.pv-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.pv-desc{font:700 24px/1.25 var(--p-sans);word-break:break-word;white-space:pre-line}
.pv-qty{display:flex;align-items:baseline;gap:8px}
.pv-qty small{font:700 14px/1 var(--p-sans);color:var(--p-ink-2);text-transform:uppercase;letter-spacing:.06em}
.pv-facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:16px;margin:0}
.pv-facts dt{font:700 12px/1.9 var(--p-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-2)}
.pv-facts dd{margin:0;word-break:break-word}
.pv-notes{display:flex;flex-direction:column;gap:8px}
.pv-notes .p-note{font-size:15px;white-space:pre-line;overflow-wrap:anywhere;min-width:0}
.pv-notes .p-note a{font-weight:700;color:inherit}
.pv-lines{display:flex;flex-direction:column;border:1px solid var(--p-line);border-radius:var(--p-r-lg);overflow:hidden;background:#fff}
.pv-line{display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--p-line);font-size:15px}
.pv-line:first-child{border-top:0}
.pv-line.is-me{background:var(--p-yellow-lt)}
.pv-line .th{width:44px;height:44px;flex:none;border-radius:var(--p-r);background:var(--p-cream);overflow:hidden}
.pv-line .th img{width:100%;height:100%;object-fit:cover;display:block}
.pv-line .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-line .q{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-box .p-modal-f{align-items:center}
.pv-box .p-modal-f .pv-state{margin-right:auto;font-size:15px;color:var(--p-ink-2)}
@media (max-width:1100px){ .pv-grid{grid-template-columns:1fr} .pv-main{height:46vh;min-height:260px} }

/* ---- iPad portrait / phone ---- */
@media (max-width:600px){
  .pr-area{padding:10px 10px 120px}
  .pr-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .pc-desc{font-size:15px}
  .pc-ph b{font-size:17px}
  .pv-desc{font-size:20px}
  .pv-box .p-modal-f .pv-state{flex-basis:100%}
  .p-filters .p-search{flex-basis:100%;max-width:none}
  .p-filters-end{flex:1;margin-left:0}
  .p-filters .vendor-select{flex:1;min-width:0;max-width:none}
  .p-chips{margin:0 -16px;padding:0 16px 2px}
  .p-chips-inline{flex:1 1 100%;order:3}   /* v83: phone: chips get their own line */
  .list-area{padding:10px 10px 120px}
  .p-lc-title{font-size:17px}
  /* v75: kit gap -- on a phone the kit gives Pieces a whole row; here it sits under the ID, beside the tags */
  .p-lc-head{grid-template-areas:"id main" "nums tags" "act act"}
  .p-lc-nums{justify-content:center}
  .p-num{text-align:center}
  .p-lc-tags{align-self:center}
  .p-lc-act:empty{display:none}
  .ahw{display:flex;flex:1}
  .ahw>.p-btn{flex:1}
  .p-lc-body{padding:8px}
  .li-row{gap:12px;padding:12px}
  .jc-thumb{width:56px;height:56px}
  .li-name{font-size:17px}
  .li-detail{padding:12px}
  .detail-actions-top{flex-direction:column-reverse;align-items:stretch}
  .detail-actions-top .p-btn{width:100%}
  .btn.match,.p-btn.match{min-width:0}
  .size-tbl th,.size-tbl td{padding:6px 8px}
  .size-tbl{font-size:16px}
  .print-box{padding:16px}
  .gd-box .p-modal-f{flex-wrap:wrap}
  .size-tbl tr.recv-row{display:flex;flex-direction:column}
  .size-tbl tr.recv-row td{display:block;width:100%}
  .size-tbl tr.recv-row td:empty{display:none}
  .po-prev-wrap{transform:scale(.9);transform-origin:top center;margin-bottom:-40px}
}
/* v80: promo filter menus wrap instead of pushing the page sideways */
#promoFilters .p-filters-end{display:flex;flex-wrap:wrap;gap:8px;min-width:0;max-width:100%}
@media (max-width:760px){#promoFilters .p-filters-end{width:100%}#promoFilters .p-filters-end select{flex:1 1 140px;min-width:0;width:auto;max-width:100%}}
</style>

// Capacities unchanged -- revisit with the 'packed right?' log early next year.
// v71 -- box labels: '+ Size' adds a size that wasn't on the label (for moving sizes between boxes
// after the auto boxing pass). Grid labels get a new size cell; multi-garment rows get the size added
// to their size list, and editing that list now updates the row's Qty. Sizes left blank or 0 don't print.
// v70 -- box size on each label is a tap-to-change picker (S / M / L / Vendor Box); prints as text.
// v69 -- box labels: "+ Add box" adds another label (copy of the last one, counts editable
// so contents can be split) and renumbers every label "Box x of N". Added boxes can be removed.
// v68 -- one Receive button per line. Count the box; blank sizes mean "all there". Type a
// number only where the count is different. The button says what will happen (all match /
// N sizes off), and a difference opens the mis-ship check.
// v65 -- receiving a line always opens the print panel. Not all in yet: it shows x of n lines,
// lists the lines still waiting with a "Receive next" button, and still offers both prints.
// v64 -- combined label fills the 4x6: fewer garment rows print bigger (XL for 1-2 rows,

// v63 -- one combined 4x6 staging label per box (order info + what's inside + mockup QR,

async function loadData(){

  var btn=document.getElementById('refreshBtn');

  document.getElementById('listArea').innerHTML='<div class="loading"><div class="spin"></div>Loading orders\u2026</div>';
  try{
    var raw=await fetchAll(token);
    // v74: keep typed counts for lines that are still open after the reload
    var keptPending=pending;pending={};
    allRecords=raw.filter(function(r){
      if(!isApparelLine(r))return false;
      var isMisship=isOpenMs(r);
      if(fv(r,'received')===true&&!isMisship&&!recvWithin24h(r))return false;
      var st=getStatus(r);
      var isActiveMisship=isMisship&&fv(r,'misshipInProgress')===true;
      if(!isActiveMisship&&EXCLUDE_STATUS.indexOf(st)>=0)return false;

    });
    orderProgress={};progressFailed=false;
    try{
      var _onums=[],_seenO={};
      allRecords.forEach(function(r){var n=orderNum(r);if(n&&!_seenO[n]){_seenO[n]=1;_onums.push(n);}});
      orderProgress=await fetchOrderProgress(token,_onums);
    }catch(_pe){orderProgress={};progressFailed=true;console.warn('order progress fetch failed:',_pe&&_pe.message);}
    var keptN=0;
    allRecords.forEach(function(r){
      var old=keptPending[r.id];if(!old||fv(r,'received')===true)return;
      var vals={},any=false;
      Object.keys(old).forEach(function(k){if(old[k]!==null&&old[k]!==undefined&&old[k]!==''){vals[k]=old[k];any=true;}});
      if(any){pending[r.id]=vals;keptN++;}
    });
    renderAll();updateStats();populateVendorDropdown();
    if(keptN)toast('Kept your counts on '+keptN+' line'+(keptN>1?'s':''),'ok');
    if(progressFailed)toast('Couldn\u2019t check whole orders \u2014 orders won\u2019t be staged until Refresh works','err');
    else await stageReadyOnLoad();
  }catch(e){
    if(keptPending&&!Object.keys(pending).length)pending=keptPending;   // load failed: don't lose them either
    document.getElementById('listArea').innerHTML='<div class="p-note p-note-alert err-box">Couldn\u2019t load orders: '+esc(e.message)+'. Tap Refresh to try again.</div>';

}

// v77: a line with a mis-ship that isn't resolved yet

// v77: received in the last 24h and nothing still open on it -> only in the Received (24h) tab
function isRecentDone(r){return recvWithin24h(r)&&!isOpenMs(r);}
// v77: after a load, stage orders that are already complete (every apparel line in, no open mis-ship, still
// "Ordered - In Production") -- e.g. a mis-ship resolved in Airtable, or a stage write that failed earlier.
// Exactly the rule maybeStageOrder uses after a receive; needs the full-order read, so never runs without it.
async function stageReadyOnLoad(){
  var seen={},staged=[],failed=[];
  for(var i=0;i<allRecords.length;i++){
    var r=allRecords[i],num=orderNum(r);if(!num||seen[num])continue;
    var prog=orderProgress[num];
    if(!prog||prog.n<=0||prog.staged||prog.x<prog.n||prog.openMisship)continue;
    if(getStatus(r)!==STAGE_FROM_STATUS||!orderRecId(r))continue;
    seen[num]=1;
    var ok=await stageOrder(orderRecId(r),num,{quiet:true});
    (ok?staged:failed).push(num);
  }
  if(failed.length)toast('Couldn\u2019t stage '+failed.join(', ')+' \u2014 tap Refresh to try again','err');
  else if(staged.length)toast((SIMULATE?'Practice: would stage ':'Staged (all in): ')+staged.join(', '),'ok');

async function fetchAll(token){
  var records=[],offset=null;
  var filterFormula='AND({'+F.ordered+'}=TRUE(),OR({'+F.received+'}!=TRUE(),{'+F.misship+'}=TRUE(),IS_AFTER({'+F.receivedTime+'},DATEADD(NOW(),-24,"hours"))))';
  do{
    var p=new URLSearchParams();
    Object.values(F).forEach(function(id){p.append('fields[]',id);});
    p.set('returnFieldsByFieldId','true');
    p.set('filterByFormula',filterFormula);
    p.set('sort[0][field]',F.printDate);
    p.set('sort[0][direction]','asc');
    if(offset)p.set('offset',offset);
    var res=await fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID+'?'+p,{headers:{Authorization:'Bearer '+token}});
    if(!res.ok){var d=await res.json();throw new Error(d.error&&d.error.message?d.error.message:'API '+res.status);}
    var data=await res.json();
    records=records.concat(data.records||[]);
    offset=data.offset;
  }while(offset);
  return records;
}

// Board-membership predicate: a real garment line we count toward an order.
// Mirrors loadData's old inline filters (excludes non-apparel types, 0-qty, shipping lines, sub-MIN orders).
function isApparelLine(r){
  if(fv(r,'ordered')!==true)return false;
  if(orderNum(r)<MIN_ORDER)return false;
  var pt=fv(r,'productType');
  if(pt){var ptn=typeof pt==='object'?pt.name:String(pt);if(INCLUDE_PRODUCT_TYPES.indexOf(ptn)<0)return false;}
  var qty=Number(fv(r,'totalQty')||0);if(qty<=0)return false;
  var gn=String(fv(r,'garmentName')||'').toLowerCase();if(gn.indexOf('shipping')>=0)return false;
  return true;
}

// X/N order progress: for each order on the board, count ALL its apparel lines (n)
// and how many are received (x) — including lines that already aged off the 24h board.
// Batched OR over the order-number lookup (chunked); soft-fails to {} on error.
async function fetchOrderProgress(token,orderNums){
  var prog={};
  if(!orderNums||!orderNums.length)return prog;
  var pf=[F.ordered,F.orderNum,F.productType,F.totalQty,F.garmentName,F.received,F.misship,F.misshipResolved];
  SIZES.forEach(function(z){pf.push(F[z.ok]);});   // v77: pieces for the whole order (read only)
  var CH=50;
  for(var i=0;i<orderNums.length;i+=CH){
    var chunk=orderNums.slice(i,i+CH);
    var formula='OR('+chunk.map(function(n){return '{'+F.orderNum+'}='+n;}).join(',')+')';
    var offset=null;
    do{
      var p=new URLSearchParams();
      pf.forEach(function(id){p.append('fields[]',id);});
      p.set('returnFieldsByFieldId','true');
      p.set('filterByFormula',formula);
      if(offset)p.set('offset',offset);
      var res=await fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID+'?'+p,{headers:{Authorization:'Bearer '+token}});
      if(!res.ok)throw new Error('progress '+res.status);
      var data=await res.json();
      (data.records||[]).forEach(function(r){
        if(!isApparelLine(r))return;
        var num=orderNum(r);if(!num)return;
        if(!prog[num])prog[num]={x:0,n:0,openMisship:false,staged:false,msIds:[],pcs:0};
        prog[num].n++;
        if(fv(r,'received')===true)prog[num].x++;
        if(isOpenMs(r)){prog[num].openMisship=true;prog[num].msIds.push(r.id);}
        prog[num].pcs+=linePcs(r);
      });
      offset=data.offset;
    }while(offset);
  }
  return prog;
}

function linePcs(r){return SIZES.reduce(function(a,z){var v=Number(fv(r,z.ok)||0);return a+(v>0?v:0);},0);}
// v77: the order's pieces = every apparel line, not just the lines the current tab shows
function orderPcs(num,g){
  var p=orderProgress[num];if(p&&p.n>0&&typeof p.pcs==='number')return p.pcs;
  return allRecords.filter(function(r){return orderNum(r)===Number(num);}).reduce(function(a,r){return a+linePcs(r);},0);
}
function fv(r,key){var id=F[key];if(id===undefined)return undefined;return(r.fields&&r.fields[id]!==undefined)?r.fields[id]:((r.cellValuesByFieldId&&r.cellValuesByFieldId[id]!==undefined)?r.cellValuesByFieldId[id]:undefined);}

function orderNum(r){

function getPD(r){

function getPDStr(r){var p=getPD(r);return p?p.date:null;}
function recvWithin24h(r){

  var t=fv(r,'receivedTime');if(!t)return false;
  var dt=new Date(t);if(isNaN(dt.getTime()))return false;

function getImprintIds(r){var v=fv(r,'imprintIds');if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);if(typeof v==='string')return v.split(',').map(function(s){return s.trim();}).filter(Boolean);return[];}
function getEquipmentList(records){

    if(typeof v==='object'&&v.valuesByLinkedRecordId){Object.values(v.valuesByLinkedRecordId).forEach(function(arr){(Array.isArray(arr)?arr:[arr]).forEach(function(e){var n=typeof e==='object'?e.name:String(e);if(n&&!seen[n]){seen[n]=1;names.push(n);}});});}
    else if(Array.isArray(v)){v.forEach(function(e){var n=typeof e==='object'?e.name:String(e);if(n&&!seen[n]){seen[n]=1;names.push(n);}});}

function daysUntil(ds){
  if(!ds)return null;
  var pts=ds.split('/');
  var d=pts.length===3?new Date(parseInt(pts[2]),parseInt(pts[0])-1,parseInt(pts[1])):new Date(ds);
  if(isNaN(d.getTime()))return null;
  var t=new Date();t.setHours(0,0,0,0);
  return Math.round((d.getTime()-t.getTime())/86400000);
}

function fmtDate(ds){
  if(!ds)return '';
  var d=new Date(ds+'T12:00:00');
  if(isNaN(d.getTime()))return ds;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function groupByOrder(records){
  var map={};
  records.forEach(function(r){
    var num=orderNum(r);if(!num)return;
    if(!map[num])map[num]={num:num,customer:fv(r,'customer')||'Unknown',printDate:null,isDue:false,po:null,pos:[],records:[]};
    map[num].records.push(r);
    var pd=getPD(r);
    if(pd&&(!map[num].printDate||daysUntil(pd.date)<daysUntil(map[num].printDate))){map[num].printDate=pd.date;map[num].isDue=pd.isDue;}
    var pov=fv(r,'po');
    if(pov){var ps=String(pov).trim();if(ps){if(map[num].pos.indexOf(ps)<0)map[num].pos.push(ps);if(map[num].po===null||ps<map[num].po)map[num].po=ps;}}
  });

    }

// v77: one rule per tab, used for both the list and the tab counts (every count is a number of orders)
function tabFilter(groups,f){
  var result=groups;
  if(f==='completed'){
    // Received (24h): only lines received in the last 24h
    result=result.map(function(g){return Object.assign({},g,{records:g.records.filter(function(r){return recvWithin24h(r);})});}).filter(function(g){return g.records.length>0;});
  } else {
    // other tabs hide lines received in the last 24h -- v77: unless a mis-ship is still open on them
    result=result.map(function(g){return Object.assign({},g,{records:g.records.filter(function(r){return !isRecentDone(r);})});}).filter(function(g){return g.records.length>0;});
    if(f==='urgent')result=result.filter(function(g){var d=daysUntil(g.printDate);return d!==null&&d<=4;});
    else if(f==='misship')result=result.filter(function(g){return g.records.some(isOpenMs);});
    else if(f==='overdue')result=result.filter(function(g){return g.records.some(function(r){var d=daysUntil(fv(r,'arrival'));return fv(r,'received')!==true&&d!==null&&d<0;});});
  }
  return result;
}
function applyFilter(groups){
  var result=tabFilter(groups,currentFilter);

    result=result.map(function(g){return Object.assign({},g,{records:g.records.filter(function(r){return vendorOf(r)===vendorFilter;})});}).filter(function(g){return g.records.length>0;});
  }
  if(searchTerm){
    result=result.map(function(g){return Object.assign({},g,{records:g.records.filter(function(r){return matchSearch(r,g.num);})});}).filter(function(g){return g.records.length>0;});
  }
  return result;
}

  var cur=Number(Object.keys(openOrds)[0]),i=shownNums.indexOf(cur),n=i+(e.key==='ArrowDown'?1:-1);
  if(n<0||n>=shownNums.length)return;
  e.preventDefault();pickOrder(shownNums[n],true);
  var h=document.querySelector('#oc-'+shownNums[n]+' [data-pick]');if(h)h.focus({preventScroll:true});
});

// v76: mode '' = card that opens in place (<1400px), 'list' = left pane (head only), 'detail' = right pane (picked order)
function renderGroup(g,mode,picked){
  mode=mode||'';
  var days=daysUntil(g.printDate);
  var pfx=g.isDue?'Due':'Prints';
  var urgTag='';
  // v73: in the date view the section header already says when it prints, so the tag only shows when sorted by PO
  if(currentSort!=='po'){}
  else if(days!==null&&days<0)urgTag='<span class="p-tag p-tag-alert">Overdue</span>';
  else if(days!==null&&days===0)urgTag='<span class="p-tag p-tag-wait">'+pfx+' today</span>';
  else if(days!==null&&days<=4)urgTag='<span class="p-tag p-tag-wait">'+pfx+' in '+days+'d</span>';
  else if(days!==null&&days<=7)urgTag='<span class="p-tag">'+pfx+' in '+days+'d</span>';
  var hasMisship=g.records.some(isOpenMs);
  var prog=orderProgress[g.num];
  // v62: one plain status word instead of separate "x/n in", "n lines" and "Mis-ship" chips.
  var nL=(prog&&prog.n>0)?prog.n:g.records.length;
  var xL=(prog&&prog.n>0)?prog.x:g.records.filter(function(r){return fv(r,'received')===true;}).length;
  // v75: status is a tag on the card's second row. Facts are cream, done is black, a mis-ship is red.
  var stCls,stTxt;
  if(hasMisship){stCls='p-tag-alert';stTxt='Mis-ship';}
  else if(xL>=nL&&nL>0){stCls='p-tag-done';stTxt='\u2713 All in';}
  else if(xL>0){stCls='p-tag-soft';stTxt='Partly in \u00b7 '+xL+' of '+nL+' lines';}
  else{stCls='p-tag-soft';stTxt='Waiting \u00b7 '+nL+' line'+(nL!==1?'s':'');}
  var progTag='<span class="p-tag '+stCls+'">'+stTxt+'</span>';
  var poTxtAll='';
  if(g.pos&&g.pos.length){
    var poS=g.pos.slice().sort();
    var poTxt=poS.length<=3?poS.join(', '):(poS.slice(0,3).join(', ')+' +'+(poS.length-3));
    poTxtAll=(/^po/i.test(poTxt)?'':'PO ')+poTxt;
  }
  var totPcs=orderPcs(g.num,g);   // v77: the whole order, not just the lines this tab shows
  var unrecvN=g.records.filter(function(r){return fv(r,'received')!==true&&!(fv(r,'misship')===true&&fv(r,'misshipResolved')!==true);}).length;
  var ahBtn=unrecvN>=2?'<span class="ahw" id="ah-'+g.num+'">'+ahRestHtml(g.num)+'</span>':'';
  var isOpen=mode==='list'?!!picked:(mode==='detail'?true:!!openOrds[g.num]);
  if(mode==='list')return '<section class="p-lc'+(isOpen?' is-open':'')+'" id="oc-'+g.num+'">'
    +'<div class="p-lc-head is-tap" role="button" tabindex="0" data-pick="'+g.num+'" aria-current="'+(isOpen?'true':'false')+'" onclick="pickOrder('+g.num+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();pickOrder('+g.num+');}">'
    +'<span class="p-lc-id"><span class="p-id p-id-lg">'+g.num+'</span></span>'
    +'<span class="p-lc-main"><span class="p-lc-title">'+esc(g.customer)+'</span>'+(poTxtAll?'<span class="p-lc-sub">'+esc(poTxtAll)+'</span>':'')+'</span>'
    +'<span class="p-lc-act"><span class="p-num"><small>Pieces</small><b>'+totPcs+'</b></span></span>'
    +'<span class="p-lc-tags">'+urgTag+progTag+(countsTyped(g)?'<span class="p-tag p-tag-wait">Counts typed</span>':'')+'</span>'
    +'</div></section>';
  var headTap=mode==='detail'?'':' is-tap" role="button" tabindex="0" aria-expanded="'+isOpen+'" onclick="togOrd('+g.num+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();togOrd('+g.num+');}';
  // v75: Pine page kit list card (.p-lc). Opens in place, one order at a time. The prints moved into the open card.
  return '<section class="p-lc order-group'+(isOpen?' is-open':'')+'" id="og-'+g.num+'">'
    +'<div class="p-lc-head'+headTap+'">'
    +'<span class="p-lc-id">'+(mode==='detail'?'':'<span class="p-lc-chev" aria-hidden="true">\u25b8</span>')+'<span class="p-id p-id-lg">'+g.num+'</span></span>'
    +'<span class="p-lc-main"><span class="p-lc-title">'+esc(g.customer)+'</span>'+(poTxtAll?'<span class="p-lc-sub">'+esc(poTxtAll)+'</span>':'')+'</span>'
    +'<span class="p-lc-nums"><span class="p-num"><small>Pieces</small><b>'+totPcs+'</b></span></span>'
    +'<span class="p-lc-act">'+ahBtn+'</span>'
    +'<span class="p-lc-tags">'+urgTag+progTag+'</span>'
    +'</div>'
    +'<div class="p-lc-body">'
    +'<div class="og-prints"><span class="p-label">Print</span>'
    +'<button class="p-btn" type="button" onclick="printCombinedLabels('+g.num+')">Box labels</button>'
    +'<button class="p-btn" type="button" onclick="openJobSheet('+g.num+')">Job sheet</button>'
    +'</div>'
    +'<div class="li-wrap" id="lw-'+g.num+'">'
    +g.records.map(function(r){return renderLI(r,g);}).join('')
    +'</div>'
    +'</div>'
    +'</section>';
}

function renderLI(r,g){
  var id=r.id;
  var gname=getGarmentName(r);
  var sup=supName(r);
  var po=fv(r,'po')||'';
  var arr=fv(r,'arrival')||'';
  var isMisship=fv(r,'misship')===true;
  var isResolved=fv(r,'misshipResolved')===true;
  var isInProg=fv(r,'misshipInProgress')===true;
  var msDetails=fv(r,'misshipDetails')||'';
  var arrDays=arr?daysUntil(arr):null;
  var arrOvr=arrDays!==null&&arrDays<0;
  var activeSizes=SIZES.filter(function(s){return (fv(r,s.ok)||0)>0;});
  var pendActs=pending[id]||{};
  var isExp=openLines[id];
  var tO=activeSizes.reduce(function(s,z){return s+(fv(r,z.ok)||0);},0);
  var tE=activeSizes.reduce(function(s,z){return s+(z.ek?(fv(r,z.ek)||0):0);},0);

  var liTags='';
  if(sup)liTags+='<span class="p-tag p-tag-soft">'+esc(sup)+'</span>';
  if(po)liTags+='<span class="p-tag p-tag-soft">'+(/^po/i.test(String(po))?'':'PO ')+esc(po)+'</span>';
  var isRecv=fv(r,'received')===true;
  if(arr&&arrOvr&&!isRecv)liTags+='<span class="p-tag p-tag-alert">Late \u00b7 due '+fmtDate(arr)+'</span>';
  else if(arr)liTags+='<span class="p-tag p-tag-soft">Arrives '+fmtDate(arr)+'</span>';
  if(isMisship&&!isResolved)liTags+=isInProg?'<span class="p-tag p-tag-wait">Mis-ship \u00b7 replacement ordered</span>':'<span class="p-tag p-tag-alert">Mis-ship</span>';

  var hasPend=Object.keys(pendActs).length>0;
  var rightPill='';
  if(hasPend){
    var tExp=0,tAct=0;
    activeSizes.forEach(function(s){var o=fv(r,s.ok)||0,e=s.ek?(fv(r,s.ek)||0):0,v=s.ak?pendActs[F[s.ak]]:null;tExp+=o+e;tAct+=(v===null||v===undefined||v==='')?o+e:Number(v);});   // v74: blank = all there (as Receive treats it)
    var d=tExp-tAct;
    if(d===0)rightPill='<span class="dpill ok">Match</span>';
    else if(d>0)rightPill='<span class="dpill sh">-'+d+'</span>';
    else rightPill='<span class="dpill ov">+'+Math.abs(d)+'</span>';
  }

  var sizeRows=activeSizes.map(function(s){
    var oVal=fv(r,s.ok)||0,eVal=s.ek?(fv(r,s.ek)||0):0;
    var aStored=s.ak?pendActs[F[s.ak]]:undefined;
    var aDb=s.ak?fv(r,s.ak):undefined;
    var aVal=aStored!==undefined&&aStored!==null?aStored:(aDb!==undefined&&aDb!==null&&aDb!==''?aDb:'');
    var inp=s.ak?'<input type="number" min="0" inputmode="numeric" enterkeyhint="done" class="ainp" aria-label="'+s.l+' counted" id="ai-'+id+'-'+s.l+'" value="'+(aVal!==''&&aVal!==null?aVal:'')+'" placeholder="'+Number(oVal+eVal)+'" oninput="onInp(this,\''+id+'\',\''+s.ak+'\',\''+s.ok+'\',\''+(s.ek||'')+'\',\''+g.num+'\')"'+(isDoneLine(r)?'':' onkeydown="inpKey(event,\''+id+'\',\''+g.num+'\')"')+'>'
      :'<span class="p-hint">—</span>';
    return '<tr><td class="s-lbl">'+s.l+'</td><td class="s-ord">'+oVal+'</td><td class="s-ext">'+(eVal>0?'+'+eVal:'—')+'</td><td><div class="act-cell">'+inp+'</div></td></tr>';  // v68: no fill button; blank = all there
  }).join('');

  var tA=countedTotal(r,pendActs);   // v76: blank sizes count as "all there", as Receive treats them
  var totDelta=tA!==null?deltaHtml(tO,tE,tA):'';

  var msBlockHtml='';
  if(isMisship&&!isResolved){
    msBlockHtml=isInProg
      ?'<div class="ms-block inprog"><div class="ms-title">Replacement Ordered</div><div class="ms-note">'+esc(msDetails||'Replacement has been ordered from supplier.')+'</div></div>'
      :'<div class="ms-block flagged"><div class="ms-title">Mis-ship Flagged</div><div class="ms-note">'+esc(msDetails||'No details recorded.')+'</div></div>';
  }

  var isDone=isDoneLine(r);   // v77: any received line (a received line with an open mis-ship no longer offers Receive again)
  var resolveBtn=(isMisship&&!isResolved)?'<button class="p-btn" id="rs-'+id+'" onclick="resolveMisship(\''+id+'\',\''+g.num+'\')">Mark Resolved</button>':'';
  var flagBtn=(!isDone&&(!isMisship||isResolved))?'<button class="p-btn" onclick="openMsModal(\''+id+'\',\''+g.num+'\',\''+esc(gname).replace(/'/g,"\\'")+'\')">Flag Mis-ship</button>':'';
  var recvBtn=isDone
    ?'<button class="p-btn p-btn-lg" id="rb-'+id+'" onclick="openDone('+g.num+')">Print again</button>'
    :recvBtnHtml(id,g.num);

  var thumbUrl=getThumbUrl(r);
  var thumbHtml=thumbUrl
    ?'<div class="jc-thumb zoom" role="button" aria-label="Show proof" title="Show proof" onclick="event.stopPropagation();pmOpen(\''+id+'\',\''+esc(gname)+'\')"><img src="'+thumbUrl+'" onerror="this.style.visibility=\'hidden\'"></div>'
    :'<div class="jc-thumb"><svg class="jc-thumb-ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9l4-4 4 4 4-5 4 6"/></svg></div>';

  return '<div class="li'+(isExp?' li-exp':'')+'" id="li-'+id+'">'
    +'<div class="li-row" onclick="togLI(\''+id+'\',\''+g.num+'\')">'
    +thumbHtml
    +'<div class="li-left">'
    +'<div class="li-ref">'+esc(fv(r,'ref')||id)+'</div>'
    +'<div class="li-name">'+esc(gname)+'</div>'
    +'<div class="li-tags">'+liTags+'</div>'
    +'</div>'
    +'<div class="li-right">'+(isDone?'<span class="p-tag p-tag-done">\u2713 Received</span>':rightPill)+'<span class="p-tag p-tag-soft p-num">'+tO+' pcs</span></div>'
    +'</div>'
    +'<div class="li-detail" id="ld-'+id+'">'
    // v78: Receive back at the top right of the line (Stephen: "feels more intuitive"); Enter in a box still receives
    +'<div class="detail-actions-top">'+((flagBtn||resolveBtn)?'<div class="dat-left">'+flagBtn+resolveBtn+'</div>':'<div class="dat-left"></div>')+recvBtn+'</div>'
    +(isDone?'':'<div class="recv-hint">Count the box. Type a count only where a size is different, then <b>Receive</b> (or press Enter).</div>')
    +msBlockHtml
    +'<div class="size-wrap"><table class="size-tbl">'
    +'<thead><tr><th style="width:12%">Size</th><th style="width:22%">Ordered</th><th style="width:22%">Extras</th><th style="width:44%">Counted</th></tr></thead>'
    +'<tbody>'+(sizeRows||'<tr><td colspan="4" class="p-hint" style="padding:12px">No sizes on this line</td></tr>')
    +'<tr class="tot"><td class="s-lbl">Total</td><td class="s-ord">'+tO+'</td><td class="s-ext">'+(tE>0?'+'+tE:'—')+'</td><td><div class="act-cell"><span id="ta-'+id+'">'+(tA!==null?tA:'—')+'</span><span id="td-'+id+'">'+totDelta+'</span></div></td></tr>'
    +'</tbody></table></div>'
    +'</div>'
    +'</div>';
}

function isDoneLine(r){return fv(r,'received')===true;}
function inpKey(e,recId,ordNum){
  if(e.key!=='Enter')return;
  e.preventDefault();
  var b=document.getElementById('rb-'+recId);if(b&&b.disabled)return;
  receiveLine(recId,ordNum);
}
// v76: what Receive would save in total: typed sizes as typed, blank sizes as ordered + extras. null = nothing typed.
function countedTotal(r,acts){
  var any=false,t=0;
  SIZES.forEach(function(s){var o=fv(r,s.ok)||0;if(o<=0)return;var e=s.ek?(fv(r,s.ek)||0):0,v=s.ak?acts[F[s.ak]]:null;
    if(v===null||v===undefined||v===''){t+=o+e;}else{any=true;t+=Number(v);}});
  return any?t:null;
}
function deltaHtml(o,e,a){
  if(a===null||a===undefined||a==='')return '<span class="dpill em">—</span>';
  var exp=o+(e||0),d=exp-Number(a);
  if(d===0)return '<span class="dpill ok">Match</span>';
  if(d>0)return '<span class="dpill sh">-'+d+'</span>';
  return '<span class="dpill ov">+'+Math.abs(d)+'</span>';
}


// v75: one order open at a time (page kit rule 5)
function togOrd(num){
  if(isWide()){pickOrder(num);return;}
  var el=document.getElementById('og-'+num);if(!el)return;

  openOrds={};
  if(!was){openOrds[num]=true;el.classList.add('is-open');el.querySelector('.p-lc-head').setAttribute('aria-expanded','true');
    var top=el.getBoundingClientRect().top;if(top<120||top>window.innerHeight-80)el.scrollIntoView({block:'start',behavior:'smooth'});}
}

function matchSearch(r,oNum){
  if(!searchTerm)return true;
  var q=searchTerm;
  if((fv(r,'customer')||'').toLowerCase().indexOf(q)>=0)return true;
  if((fv(r,'po')||'').toLowerCase().indexOf(q)>=0)return true;
  if(String(oNum||'').indexOf(q)>=0)return true;
  if((getGarmentName(r)||'').toLowerCase().indexOf(q)>=0)return true;
  return false;
}

function onInp(inp,recId,ak,ok,ek,ordNum){
  if(!pending[recId])pending[recId]={};
  pending[recId][F[ak]]=inp.value===''?null:Number(inp.value);
  syncLineTotals(recId);
}
function syncLineTotals(recId){
  var r=allRecords.filter(function(x){return x.id===recId;})[0];if(!r)return;
  var activeSizes=SIZES.filter(function(s){return (fv(r,s.ok)||0)>0;});
  var tO=activeSizes.reduce(function(s,z){return s+(fv(r,z.ok)||0);},0);
  var tE=activeSizes.reduce(function(s,z){return s+(z.ek?(fv(r,z.ek)||0):0);},0);
  var acts=pending[recId]||{};
  var tA=countedTotal(r,acts);
  var taEl=document.getElementById('ta-'+recId),tdEl=document.getElementById('td-'+recId);
  if(taEl)taEl.textContent=tA===null?'\u2014':tA;
  if(tdEl)tdEl.innerHTML=tA===null?'':deltaHtml(tO,tE,tA);
  recvBtnSync(recId);
}

// Pull the order's record id off the line's single-link to Orders (handles v0 string-array + MCP object shapes).
function orderRecId(r){
  var v=fv(r,'orderLink');
  if(!v)return null;
  if(Array.isArray(v)){var x=v[0];return (typeof x==='string')?x:(x&&x.id)||null;}
  if(typeof v==='object'){if(v.linkedRecordIds&&v.linkedRecordIds[0])return v.linkedRecordIds[0];if(v.id)return v.id;}
  return (typeof v==='string')?v:null;
}

// Handoff trigger: fire after a line is received. Stage the order iff every apparel line is in,
// there's no open mis-ship, and the order isn't already on its own advanced/exception track.
function maybeStageOrder(lineRec,ordNum){
  if(!lineRec)return;
  var prog=orderProgress[ordNum];
  if(!prog||prog.n<=0)return;            // can't confirm completeness without the full-order read
  if(prog.staged)return;                 // already handled this session
  if(prog.x<prog.n)return;               // not all apparel lines received yet
  if(prog.openMisship)return;            // unresolved mis-ship -> hold, replacement still pending
  var st=getStatus(lineRec)||'';
  if(st!==STAGE_FROM_STATUS)return;     // only advance the canonical "all garments ordered, awaiting goods" state
  return stageOrder(orderRecId(lineRec),ordNum);   // v77: returned so the receive flow can wait for it
}

// Gated keystone write: Order Status -> "Received & Staged". Forward-only, idempotent per session.
// Honors SIMULATE (local only) and STATUS_WRITES_ENABLED (real PATCH); previews to console otherwise.
// v77: returns true when staged (or faked in practice). opts.quiet = no toast (the load check sums them up).
// A failed write leaves the order as it is; the next Refresh tries again (stageReadyOnLoad).
async function stageOrder(orderRecId,ordNum,opts){
  var quiet=opts&&opts.quiet;
  var prog=orderProgress[ordNum];
  if(prog&&prog.staged)return true;
  if(SIMULATE){
    if(prog)prog.staged=true;
    console.log('[SIMULATE] order '+ordNum+' complete -> would set Order Status = "'+STAGED_STATUS+'"');
    if(!quiet)toast('Practice: order '+ordNum+' staged (not saved)','ok');
    return true;
  }
  if(!STATUS_WRITES_ENABLED){
    if(prog)prog.staged=true;
    console.log('[PREVIEW status writes OFF] order '+ordNum+' ('+(orderRecId||'no recId')+') complete -> would set "'+STAGED_STATUS+'"');
    if(!quiet)toast('Order '+ordNum+' complete (stage write off)','ok');
    return true;
  }
  if(!orderRecId){console.warn('stageOrder: no order recId for '+ordNum);if(!quiet)toast('Order '+ordNum+' is all in but has no order link \u2014 stage it in Airtable','err');return false;}
  var token=getToken();if(!token)return false;
  saving++;
  try{
    var body={fields:{}};body.fields[ORDER_STATUS_FIELD]=STAGED_STATUS;
    var res=await fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+ORDERS_TBL+'/'+orderRecId,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok){var d=await res.json();throw new Error(d.error&&d.error.message?d.error.message:'API '+res.status);}
    if(prog)prog.staged=true;
    // v77: only part of Undo when the receive being undone is on this order (not after resolving a mis-ship later)
    if(lastReceive&&!lastReceive.promo&&lastReceive.label===String(ordNum))noteUndoFlip(orderRecId);   // v79: never onto a promo undo
    if(!quiet)toast('Order '+ordNum+' staged','ok');
    return true;
  }catch(e){
    if(!quiet)toast('Order '+ordNum+' is all in but couldn\u2019t be staged ('+e.message+'). Tap Refresh to try again.','err');
    return false;
  }finally{saving--;}
}

// v62: guided receiving. Before a line is received, look at what was counted:
//   nothing counted   -> ask "did everything arrive as ordered?"
//   some sizes blank  -> ask to count them or treat blanks as 0
//   counts != ordered -> show the differences, offer a pre-filled mis-ship
// v61 and earlier saved "received" with no counts and no warning.
function countCheck(recId){
  var r=allRecords.filter(function(x){return x.id===recId;})[0];
  var out={state:'ok',rows:[],blank:0,counted:0};
  if(!r)return out;
  var acts=pending[recId]||{};
  SIZES.filter(function(s){return s.ak&&(fv(r,s.ok)||0)>0;}).forEach(function(s){
    var exp=(fv(r,s.ok)||0)+(s.ek?(fv(r,s.ek)||0):0);
    var v=acts[F[s.ak]];
    if(v===undefined){var db=fv(r,s.ak);v=(db===undefined||db===null||db==='')?null:Number(db);}
    if(v===null||v===''||isNaN(v)){out.blank++;out.rows.push({l:s.l,exp:exp,got:null});return;}
    out.counted++;out.rows.push({l:s.l,exp:exp,got:Number(v)});
  });
  if(!out.counted&&out.rows.length)out.state='none';
  else if(out.blank)out.state='partial';
  else if(out.rows.some(function(x){return x.got!==x.exp;}))out.state='mismatch';
  return out;
}
function gdOpen(hdr,sub,body,buttons){
  document.getElementById('gdHdr').textContent=hdr;

}
function gdClose(){document.getElementById('gdOverlay').classList.remove('open');gdRestore=null;}
// v77: Receive fills blank boxes with "all there" before the check. "Go back" (and Flag mis-ship) put the boxes back
// as they were, so auto-filled numbers don't look like typed counts.
var gdRestore=null;
function gdBack(){
  var g=gdRestore;gdClose();
  if(!g)return;
  if(g.had)pending[g.recId]=g.before;else delete pending[g.recId];
  var r=allRecords.filter(function(x){return x.id===g.recId;})[0];if(!r)return;
  SIZES.forEach(function(s){
    if(!s.ak)return;var inp=document.getElementById('ai-'+g.recId+'-'+s.l);if(!inp)return;
    var v=(pending[g.recId]||{})[F[s.ak]];
    if(v===undefined){var db=fv(r,s.ak);v=(db===undefined||db===null||db==='')?null:db;}
    inp.value=(v===null||v===undefined)?'':v;
  });
  syncLineTotals(g.recId);
}
function gdLabel(recId){var r=allRecords.filter(function(x){return x.id===recId;})[0];return r?getGarmentName(r):'';}
function setActual(recId,sizeL,val){
  var s=SIZES.filter(function(z){return z.l===sizeL;})[0];if(!s||!s.ak)return;
  if(!pending[recId])pending[recId]={};
  pending[recId][F[s.ak]]=val;
  var inp=document.getElementById('ai-'+recId+'-'+sizeL);if(inp)inp.value=(val===null?'':val);
}
// v68: one Receive button. Blank sizes count as "all there"; typed sizes that differ are "off".
function recvOff(recId){return countCheck(recId).rows.filter(function(x){return x.got!==null&&x.got!==x.exp;}).length;}
function recvBtnText(recId){var n=recvOff(recId);return n?'Receive \u2014 '+n+' size'+(n>1?'s':'')+' off':'\u2713 Receive \u2014 all match';}
function recvBtnHtml(recId,ordNum){
  return '<button class="p-btn p-btn-main p-btn-lg match'+(recvOff(recId)?' off':'')+'" id="rb-'+recId+'" onclick="receiveLine(\''+recId+'\',\''+ordNum+'\')">'+recvBtnText(recId)+'</button>';
}
function recvBtnSync(recId){
  var b=document.getElementById('rb-'+recId);if(!b||b.disabled)return;
  b.textContent=recvBtnText(recId);b.classList.toggle('off',recvOff(recId)>0);
}
function receiveLine(recId,ordNum){
  var had=Object.prototype.hasOwnProperty.call(pending,recId),before=Object.assign({},pending[recId]||{});
  countCheck(recId).rows.forEach(function(x){
    if(x.got===null)setActual(recId,x.l,x.exp);  // blank = all there
  });
  var p=markRecv(recId,ordNum);  // guard shows the mismatch check if anything is off
  if(document.getElementById('gdOverlay').classList.contains('open'))gdRestore={recId:recId,had:had,before:before};
  return p;
}
// "Everything matches": fill every size with ordered + extras, then receive.
function guardAllMatch(recId,ordNum){
  var r=allRecords.filter(function(x){return x.id===recId;})[0];if(!r)return;
  SIZES.filter(function(s){return s.ak&&(fv(r,s.ok)||0)>0;}).forEach(function(s){
    setActual(recId,s.l,(fv(r,s.ok)||0)+(s.ek?(fv(r,s.ek)||0):0));
  });

}
function guardBlanksZero(recId,ordNum){
  countCheck(recId).rows.forEach(function(x){if(x.got===null)setActual(recId,x.l,0);});

  markRecv(recId,ordNum);
}
function guardFlag(recId,ordNum){
  var chk=countCheck(recId);
  var parts=chk.rows.filter(function(x){return x.got!==null&&x.got!==x.exp;}).map(function(x){
    return x.l+': got '+x.got+', expected '+x.exp+' ('+(x.got>x.exp?'+':'')+(x.got-x.exp)+')';
  });
  gdBack();   // v77: the line isn't received, so its boxes go back to what was typed
  openMsModal(recId,ordNum,gdLabel(recId));
  var ta=document.getElementById('msBoxTa');
  if(ta){ta.value='Count doesn\u2019t match: '+parts.join('; ')+'.';}
}
function markRecvGuarded(recId,ordNum){
  var chk=countCheck(recId);
  var q=function(v){return '\''+String(v).replace(/'/g,"\\'")+'\'';};
  var args=q(recId)+','+q(ordNum);
  var sub=gdLabel(recId)+'  \u00b7  Order #'+ordNum;
  if(chk.state==='none'){
    gdOpen('Nothing counted yet',sub,
      '<div class="gd-text">Did everything in the box arrive exactly as ordered?</div>',
      '<button class="p-btn" onclick="gdClose()">Let me count</button>'
      +'<button class="p-btn p-btn-main" onclick="guardAllMatch('+args+')">\u2713 Yes, everything matches</button>');
    return false;
  }
  if(chk.state==='partial'){
    var miss=chk.rows.filter(function(x){return x.got===null;}).map(function(x){return x.l;}).join(', ');
    gdOpen('Some sizes aren\u2019t counted',sub,
      '<div class="gd-text">No count for: <b>'+esc(miss)+'</b>. Count them, or save them as 0 (none arrived).</div>',
      '<button class="p-btn" onclick="gdClose()">Count them</button>'
      +'<button class="p-btn p-btn-main" onclick="guardBlanksZero('+args+')">None arrived \u2014 save as 0</button>');
    return false;
  }
  if(chk.state==='mismatch'){
    var li=chk.rows.filter(function(x){return x.got!==x.exp;}).map(function(x){
      var d=x.got-x.exp;
      return '<li><span>'+esc(x.l)+'</span><span>got '+x.got+' \u00b7 expected '+x.exp+'</span><span class="'+(d<0?'sh':'ov')+'">'+(d>0?'+':'')+d+'</span></li>';
    }).join('');
    gdOpen('Counts don\u2019t match the order',sub,
      '<ul class="gd-list">'+li+'</ul><div class="gd-text" style="font-size:13px;color:var(--muted)">Short or wrong garments? Flag a mis-ship so Purchasing can fix it. Extras only? Receive it.</div>',
      '<button class="p-btn p-btn-quiet" onclick="gdBack()">Go back</button>'
      +'<button class="p-btn" onclick="gdClose();markRecv('+args+',{skipGuard:true})">Receive with these counts</button>'
      +'<button class="p-btn p-btn-danger" onclick="guardFlag('+args+')">Flag mis-ship</button>');
    return false;
  }
  return true;
}

async function markRecv(recId,ordNum,opts){
  var token=getToken();if(!token){toast('No token','err');return;}
  if(!WRITES_ENABLED&&!SIMULATE){toast('Writes disabled','err');return;}
  if(!(opts&&opts.skipGuard)&&!markRecvGuarded(recId,ordNum))return;
  var btn=document.getElementById('rb-'+recId);
  if(btn){btn.disabled=true;btn.textContent='Saving\u2026';}
  if(SIMULATE){
    var rrS=allRecords.filter(function(r){return r.id===recId;})[0];
    var custS=rrS?fv(rrS,'customer')||'':'';
    if(rrS&&rrS.fields){rrS.fields[F.received]=true;rrS.fields[F.receivedTime]=new Date().toISOString();}
    delete pending[recId];
    delete openLines[recId];
    if(orderProgress[ordNum])orderProgress[ordNum].x++;
    toast('Practice: received (not saved)','ok');
    renderAll();updateStats();
    await maybeStageOrder(rrS,Number(ordNum));
    afterReceive(Number(ordNum));
    return;
  }
  saving++;
  try{
    var updates=pending[recId]||{};
    var fields=Object.assign({},updates);fields[F.received]=true;
    var prevUndo=lastReceive;   // v73: put the previous undo back if this save fails
    try{var preRec=allRecords.filter(function(x){return x.id===recId;})[0];captureReceiveUndo(String(ordNum));addUndoLine(preRec,fields);}catch(_u){}
    var res=await fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID+'/'+recId,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({fields:fields})});
    if(!res.ok){var d=await res.json();throw new Error(d.error&&d.error.message?d.error.message:'API '+res.status);}
    var recvdCustomer='';
    var rr=allRecords.filter(function(r){return r.id===recId;})[0];
    if(rr){recvdCustomer=fv(rr,'customer')||'';if(rr.fields){rr.fields[F.received]=true;rr.fields[F.receivedTime]=new Date().toISOString();}}
    delete pending[recId];
    delete openLines[recId];
    if(orderProgress[ordNum])orderProgress[ordNum].x++;
    toast('Marked received','ok');
    renderAll();updateStats();
    await maybeStageOrder(rr,Number(ordNum));   // v77: wait, so Undo can't run before the stage write lands
    updateUndoBtn();
    afterReceive(Number(ordNum));
  }catch(e){lastReceive=prevUndo;toast('Couldn\u2019t save: '+e.message,'err');if(btn){btn.disabled=false;recvBtnSync(recId);}}
  finally{saving--;}
}

// ---- "All Here" bulk receive (two-stage confirm) ----
function ahRestHtml(num){
  return '<button class="p-btn" onclick="event.stopPropagation();allHereStart('+num+')">\u2713 All here</button>';
}
// Unreceived, non-mis-ship apparel lines for this order (the lines "All Here" will receive).
function ahTargets(num){
  return allRecords.filter(function(r){
    return orderNum(r)===num && isApparelLine(r) && fv(r,'received')!==true && !(fv(r,'misship')===true&&fv(r,'misshipResolved')!==true);
  });
}
function allHereStart(num){
  var w=document.getElementById('ah-'+num);if(!w)return;
  var t=ahTargets(num),n=t.length,off=t.filter(ahIsOff).length;
  if(n<1){w.innerHTML=ahRestHtml(num);return;}
  w.innerHTML='<button class="p-btn p-btn-quiet" aria-label="Cancel" onclick="event.stopPropagation();allHereCancel('+num+')">\u2715</button>'
    +'<button class="p-btn p-btn-main" onclick="event.stopPropagation();allHereConfirm('+num+')">'+(off?(off===n?'Check counts on '+n+'?':'\u2713 Receive '+(n-off)+', check '+off+'?'):'\u2713 Receive all '+n+'?')+'</button>';
}
function allHereCancel(num){
  var w=document.getElementById('ah-'+num);if(w)w.innerHTML=ahRestHtml(num);
}
// Per-line payload = received + actual(=ordered+extra) on each active size. Blank sizes = ordered + extras; v77: typed counts are used as typed.
function ahLineFields(r){
  var f={};f[F.received]=true;
  var typed=pending[r.id]||{};
  SIZES.forEach(function(z){if(!z.ak)return;var ov=fv(r,z.ok)||0;if(ov>0){var ev=z.ek?(fv(r,z.ek)||0):0,t=typed[F[z.ak]];
    f[F[z.ak]]=(t===null||t===undefined||t===''||isNaN(Number(t)))?ov+ev:Number(t);}});
  return f;
}
// v77: a line whose typed counts differ from ordered + extras doesn't go in the All here batch;
// it gets the normal mismatch check instead (receive / flag mis-ship / go back).
function ahIsOff(r){return recvOff(r.id)>0;}
async function allHereConfirm(num){
  var token=getToken();if(!token){toast('No token','err');return;}
  if(!WRITES_ENABLED&&!SIMULATE){toast('Writes disabled','err');return;}
  var all=ahTargets(num);
  if(!all.length){toast('Nothing to receive','err');allHereCancel(num);return;}
  var off=all.filter(ahIsOff),targets=all.filter(function(r){return !ahIsOff(r);});
  function checkOff(){   // open the first line whose counts are off, with its mismatch check
    if(!off.length)return;
    var r=off[0];
    openOrds={};openOrds[num]=true;openLines[r.id]=true;renderAll();
    var el=document.getElementById('li-'+r.id);if(el)el.scrollIntoView({block:'nearest'});

  }
  if(!targets.length){allHereCancel(num);checkOff();return;}
  var w=document.getElementById('ah-'+num);if(w)w.innerHTML='<button class="p-btn" disabled>Saving\u2026</button>';
  var cust=fv(targets[0],'customer')||'';
  function finishLocal(){
    targets.forEach(function(r){
      if(r.fields){r.fields[F.received]=true;r.fields[F.receivedTime]=new Date().toISOString();}
      delete pending[r.id];delete openLines[r.id];
      if(orderProgress[num])orderProgress[num].x++;
    });
  }
  if(SIMULATE){
    finishLocal();
    toast('Practice: received '+targets.length+' line'+(targets.length>1?'s':'')+' (not saved)'+(off.length?' \u2014 check the counts on '+off.length+' more':''),'ok');
    renderAll();updateStats();
    await maybeStageOrder(targets[0],num);
    afterReceive(num);
    checkOff();
    return;
  }
  saving++;
  try{
    captureReceiveUndo(String(num));
    targets.forEach(function(r){try{addUndoLine(r,ahLineFields(r));}catch(_u){}});
    var CH=10;
    for(var i=0;i<targets.length;i+=CH){
      var batch=targets.slice(i,i+CH).map(function(r){return {id:r.id,fields:ahLineFields(r)};});
      var res=await fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({records:batch})});
      if(!res.ok){var d=await res.json();throw new Error(d.error&&d.error.message?d.error.message:'API '+res.status);}
    }
    finishLocal();
    toast('Received '+targets.length+' line'+(targets.length>1?'s':'')+(off.length?' \u2014 check the counts on '+off.length+' more':''),'ok');
    renderAll();updateStats();
    await maybeStageOrder(targets[0],num);
    updateUndoBtn();
    afterReceive(num);
    checkOff();
  }catch(e){
    toast('All here didn\u2019t save: '+e.message+' \u2014 tap Refresh to see what saved','err');
    updateUndoBtn();   // v73: if the first batch saved and a later one failed, Undo can still put the order back
    var w2=document.getElementById('ah-'+num);if(w2)w2.innerHTML=ahRestHtml(num);
  }finally{saving--;}
}

// ---- Undo last receive (single-level, reverses the most recent receive incl. status flip) ----
function captureReceiveUndo(label){lastReceive={label:label,lines:[],orderRecId:null,orderFlipped:false,at:Date.now()};}
function addUndoLine(r,payload){
  if(!lastReceive||!r)return;
  var prev={};
  Object.keys(payload).forEach(function(k){prev[k]=(r.fields&&r.fields[k]!==undefined)?r.fields[k]:null;});
  lastReceive.lines.push({recId:r.id,prev:prev});
}
function noteUndoFlip(orderRecId){if(lastReceive){lastReceive.orderRecId=orderRecId;lastReceive.orderFlipped=true;}}
function updateUndoBtn(){
  var b=document.getElementById('undoBtn');if(!b)return;
  // v73: only shown when there is something to undo
  if(lastReceive&&lastReceive.lines.length){b.hidden=false;b.disabled=false;var w=document.getElementById('undoWord');if(w)w.textContent='Undo '+lastReceive.label;b.title='Undo receive on order '+lastReceive.label;}
  else{b.hidden=true;}
}
async function undoLastReceive(){
  if(!lastReceive||!lastReceive.lines.length){toast('Nothing to undo','err');return;}
  var token=getToken();if(!token){toast('No token','err');return;}
  if(!WRITES_ENABLED){toast('Writes disabled','err');return;}
  if(SIMULATE){toast('Practice is on \u2014 turn it off to undo a real receive','err');return;}
  if(saving>0){toast('Still saving \u2014 try Undo again in a moment','err');return;}   // v77: no undo mid-save
  var snap=lastReceive;lastReceive=null;updateUndoBtn();
  function applyLocal(){
    snap.lines.forEach(function(l){
      var r=allRecords.filter(function(x){return x.id===l.recId;})[0];
      if(r&&r.fields){Object.keys(l.prev).forEach(function(k){r.fields[k]=l.prev[k];});r.fields[F.receivedTime]=null;}
    });
    var num=Number(snap.label);
    if(!snap.promo&&orderProgress[num]){orderProgress[num].x=Math.max(0,orderProgress[num].x-snap.lines.length);orderProgress[num].staged=false;}   // v79: a promo undo doesn't touch garment counts
  }
  try{
    var recs=snap.lines.map(function(l){return {id:l.recId,fields:l.prev};});
    for(var i=0;i<recs.length;i+=10){
      var batch=recs.slice(i,i+10);
      var res=await fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({records:batch})});
      if(!res.ok){var d=await res.json();throw new Error(d.error&&d.error.message?d.error.message:'API '+res.status);}
    }
    if(snap.orderFlipped&&snap.orderRecId){
      var body={fields:{}};body.fields[ORDER_STATUS_FIELD]=STAGE_FROM_STATUS;
      var r2=await fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+ORDERS_TBL+'/'+snap.orderRecId,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r2.ok){var d2=await r2.json();throw new Error(d2.error&&d2.error.message?d2.error.message:'API '+r2.status);}
    }
    applyLocal();
    promoUndoLocal(snap);   // v79: an undone promo receive goes back to Coming in
    toast('Undid receive: '+snap.label+(snap.orderFlipped?' (+ status)':''),'ok');
    renderAll();updateStats();
  }catch(e){
    toast('Undo failed: '+e.message,'err');
    lastReceive=snap;updateUndoBtn();
  }
}

    if(!res.ok){var d=await res.json();throw new Error(d.error&&d.error.message?d.error.message:'API '+res.status);}
    var rec=allRecords.filter(function(r){return r.id===recId;})[0];
    if(rec&&rec.fields){rec.fields[F.misship]=true;rec.fields[F.misshipDetails]=details;rec.fields[F.misshipInProgress]=true;}
    noteMsOpen(recId,Number(ordNum));
    closeMsModal();
    toast('Mis-ship flagged','ok');

  }catch(e){toast('Error: '+e.message,'err');if(btn){btn.disabled=false;btn.textContent='Flag Mis-ship';}}
}

// v77: a newly flagged mis-ship holds the order back from staging (as one read from Airtable does)
function noteMsOpen(recId,num){var p=orderProgress[num];if(!p)return;p.msIds=p.msIds||[];if(p.msIds.indexOf(recId)<0)p.msIds.push(recId);p.openMisship=true;}
async function resolveMisship(recId,ordNum){
  var token=getToken();if(!token){toast('No token','err');return;}
  if(!WRITES_ENABLED&&!SIMULATE){toast('Writes disabled','err');return;}
  var btn=document.getElementById('rs-'+recId);
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  if(SIMULATE){
    await afterResolve(recId,Number(ordNum),true);
    return;
  }
  saving++;
  try{
    var fields={};fields[F.misshipResolved]=true;
    var res=await fetch('https://api.airtable.com/v0/'+BASE_ID+'/'+TABLE_ID+'/'+recId,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({fields:fields})});
    if(!res.ok){var d=await res.json();throw new Error(d.error&&d.error.message?d.error.message:'API '+res.status);}
  }catch(e){toast('Error: '+e.message,'err');if(btn){btn.disabled=false;btn.textContent='Mark Resolved';}saving--;return;}
  try{await afterResolve(recId,Number(ordNum),false);}finally{saving--;}
}
// v77: after a mis-ship is resolved (saved, or faked in practice):
//  - the line keeps its place if it still needs receiving (it vanished until Refresh before);
//    a received line stays in Received (24h) while it's under a day old, else it leaves the board
//  - the order's "open mis-ship" is worked out again without this line, and if every line is in, the order stages
//    (resolving the last mis-ship never staged before)
async function afterResolve(recId,num,practice){
  var rec=allRecords.filter(function(r){return r.id===recId;})[0];
  if(rec&&rec.fields)rec.fields[F.misshipResolved]=true;
  var prog=orderProgress[num];
  if(prog){
    prog.msIds=(prog.msIds||[]).filter(function(id){return id!==recId;});
    prog.openMisship=prog.msIds.length>0;
  }
  var gone=rec&&fv(rec,'received')===true&&!recvWithin24h(rec);
  if(gone){allRecords=allRecords.filter(function(r){return r.id!==recId;});delete openLines[recId];}
  toast(practice?'Practice: resolved (not saved)':'Mis-ship resolved','ok');
  if(gone)animateOut('li-'+recId,num);
  else{refreshOrderRow(num);updateStats();}
  if(rec)await maybeStageOrder(rec,num);
  if(gone)updateStats();
  afterReceive(num);   // that was the last thing holding the order: the prints pop-up (only when all in)
}

function animateOut(elId,ordNum){
  var el=document.getElementById(elId);
  if(!el){updateStats();renderAll();return;}
  el.style.transition='opacity .2s,transform .2s';
  el.style.opacity='0';el.style.transform='translateX(10px)';
  setTimeout(function(){
    var grp=el.closest('.order-group');
    var rem=grp?grp.querySelectorAll('.li').length:0;
    if(rem<=1){
      if(grp){grp.style.transition='opacity .2s';grp.style.opacity='0';setTimeout(function(){delete openOrds[ordNum];updateStats();renderAll();},220);}
    } else {
      el.remove();updateStats();
      refreshOrderRow(ordNum);
    }
  },220);
}
