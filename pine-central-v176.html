<!DOCTYPE html>
<!-- Pine Central v176 (2026-10-17): Reprints open the permanent link reprints.html (Reprints v4). Nothing else changed.
-->
<!-- Pine Central v175 (2026-10-16): KPIs open the permanent link pine-kpi.html (KPIs v23, math matched to Airtable's
     KPI Tracker). Nothing else changed.
-->
<!-- Pine Central v174 (2026-10-15) — page kit rule 6: "Central wears the same bar".
     - The dark sidebar with the big PINE PRINT SHOP logo and the yellow nav strip are gone. Central's home has the same
       black .p-bar as every app (Pine mark, PINE CENTRAL, version, practice pill, ↻ Refresh, ⚙), with the press buttons
       and the live ticker in one slim white band under it.
     - The menu is a slim white rail (labels at 1000px+, icons only on a portrait iPad, none on a phone, where the home
       screen is the menu). Its top cell is a black Home square the same height as the bar.
     - Opening an app: Central's bar and band step aside, so the app's own black bar is the only bar. Next to the black
       Home square it reads as one bar across the screen. On a phone a Home square sits over the app's Pine mark.
     - Token, View as and Practice moved into ⚙. ?practice=1 on Central now opens every app in practice too.
     - Fixed: saving a token while Catching was open threw an error (dead Catching-queue code) and didn't reload the apps;
       Central could reload itself into a new version while someone was mid-task in an app open inside it.
     - Removed ~600 lines of dead code (old Catching queue, wins feed, ink-drip CSS). Nothing under 12px. -->
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pine Central">
<title>Pine Central v176 — Lords of Merch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap">
<link rel="stylesheet" href="pine-style-v2.css">
<style>
/* ── frame: rail | main ── */
:root{--rail:188px;--rail-open:220px}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{overflow:hidden}
.pc-main{position:fixed;top:0;right:0;bottom:0;left:var(--rail);display:flex;flex-direction:column;min-width:0;container-type:inline-size;container-name:main}
body.rail-col{--rail:64px}
@media (max-width:999px){ :root{--rail:64px} }
@media (max-width:699px){ :root,body.rail-col{--rail:0px} .pc-rail{display:none!important} }

/* ── rail ── */
.pc-rail{position:fixed;top:0;bottom:0;left:0;width:var(--rail);z-index:60;display:flex;flex-direction:column;background:var(--p-white);border-right:1px solid var(--p-line);padding-left:env(safe-area-inset-left,0px)}
.pc-home{flex:none;display:flex;align-items:center;gap:10px;height:64px;width:100%;padding:0 16px;border:0;background:var(--p-black);color:var(--p-white);cursor:pointer;font:800 var(--p-fs-s)/1 var(--p-sans);text-transform:uppercase;letter-spacing:.06em;text-align:left}
.pc-home svg{width:36px;height:28px;flex:none;fill:currentColor}
.pc-home:hover{background:#2B2A26}
.pc-home.is-on{box-shadow:inset 0 -4px 0 var(--p-yellow)}
.pc-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 0 8px;scrollbar-width:thin}
.pc-sec{padding:14px 16px 4px;white-space:nowrap}
.pc-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:var(--p-tap);padding:0 12px 0 16px;border:0;background:none;color:var(--p-black);cursor:pointer;font:700 var(--p-fs-s)/1.15 var(--p-sans);text-align:left}
.pc-item:hover{background:var(--p-cream-lt)}
.pc-item.is-on{background:var(--p-cream);box-shadow:inset 4px 0 0 var(--p-black);font-weight:800}
.pc-ic{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center}
.pc-ic svg{width:100%;height:100%;fill:currentColor}
.pc-mono{display:flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:4px;background:var(--p-black);color:var(--p-white);font:900 var(--p-fs-xs)/1 var(--p-display);letter-spacing:.02em}
.pc-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pc-count{margin-left:auto;flex:none;background:var(--p-yellow);color:var(--p-black);border:1.5px solid var(--p-black);border-radius:var(--p-pill);font:800 var(--p-fs-xs)/1 var(--p-sans);padding:3px 7px;font-variant-numeric:tabular-nums}
.pc-count[hidden]{display:none}
.pc-foot{flex:none;display:flex;align-items:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--p-line)}
.pc-who{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:var(--p-tap);padding:0 8px;border:0;border-radius:var(--p-r);background:none;cursor:pointer;color:var(--p-black);font:700 var(--p-fs-s)/1 var(--p-sans);text-align:left}
.pc-who:hover,.pc-tog:hover{background:var(--p-cream-lt)}
.pc-av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--p-black);color:var(--p-white);font:800 var(--p-fs-xs)/30px var(--p-sans);text-align:center}
.pc-tog{flex:none;width:var(--p-tap);height:var(--p-tap);border:0;border-radius:var(--p-r);background:none;cursor:pointer;color:var(--p-ink-2);font:800 18px/1 var(--p-sans)}
/* icons-only rail (collapsed on a desktop, or a portrait iPad) */
body.rail-col .pc-rail:not(.is-open) .pc-lbl,body.rail-col .pc-rail:not(.is-open) .pc-sec-t{display:none}
body.rail-col .pc-rail:not(.is-open) .pc-sec{padding:0;margin:6px 12px;border-top:1px solid var(--p-line)}
body.rail-col .pc-rail:not(.is-open) .pc-item,body.rail-col .pc-rail:not(.is-open) .pc-home{justify-content:center;padding:0}
body.rail-col .pc-rail:not(.is-open) .pc-count{position:absolute;top:2px;right:4px;padding:2px 5px}
body.rail-col .pc-rail:not(.is-open) .pc-foot{flex-direction:column;padding-left:0;padding-right:0}
body.rail-col .pc-rail:not(.is-open) .pc-who{justify-content:center;padding:0;flex:none;width:var(--p-tap)}
@media (max-width:999px){
  .pc-rail:not(.is-open) .pc-lbl,.pc-rail:not(.is-open) .pc-sec-t{display:none}
  .pc-rail:not(.is-open) .pc-sec{padding:0;margin:6px 12px;border-top:1px solid var(--p-line)}
  .pc-rail:not(.is-open) .pc-item,.pc-rail:not(.is-open) .pc-home{justify-content:center;padding:0}
  .pc-rail:not(.is-open) .pc-count{position:absolute;top:2px;right:4px;padding:2px 5px}
  .pc-rail:not(.is-open) .pc-foot{flex-direction:column;padding-left:0;padding-right:0}
  .pc-rail:not(.is-open) .pc-who{justify-content:center;padding:0;flex:none;width:var(--p-tap)}
}
/* opened over the page (icons-only rail, tapped »): labels show, nothing underneath moves */
.pc-rail.is-open{width:var(--rail-open);box-shadow:0 12px 40px rgba(20,20,18,.28)}
.pc-shade{position:fixed;inset:0;z-index:55;background:rgba(20,20,18,.25)}
.pc-shade[hidden]{display:none}

/* ── Central's bar and the band under it ── */
.pc-main > .p-bar{position:relative;flex:none}
.pc-band{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px 16px;background:var(--p-white);border-bottom:1px solid var(--p-line)}
.pc-press{display:flex;gap:6px;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.pc-press::-webkit-scrollbar{display:none}
.pc-press button{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:var(--p-tap);padding:0 13px 0 11px;border:2px solid var(--p-black);border-radius:var(--p-pill);background:var(--p-white);color:var(--p-black);cursor:pointer;font:700 var(--p-fs-s)/1 var(--p-sans);white-space:nowrap}
.pc-press button:hover{background:var(--p-cream)}
.pc-press i{width:12px;height:12px;border-radius:3px;flex:none;background:var(--c)}
.pc-tick{flex:1 1 200px;min-width:0;overflow:hidden;height:32px;display:flex;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ybar-track{display:flex;align-items:center;white-space:nowrap;animation:ticker 40s linear infinite}
.pc-tick:hover .ybar-track{animation-play-state:paused}
.ybar-item{display:inline-flex;align-items:baseline;gap:8px;padding:0 20px}
.ybar-dept{font:800 var(--p-fs-xs)/1 var(--p-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--p-black)}
.ybar-stat{font:400 var(--p-fs-s)/1 var(--p-sans);color:var(--p-ink-2)}
.ybar-d{display:none}
.ybar-loading{font:700 var(--p-fs-xs)/1 var(--p-sans);color:var(--p-ink-3);text-transform:uppercase;letter-spacing:.06em}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-33.333%)}}
@media (prefers-reduced-motion:reduce){ .ybar-track{animation:none} .pc-tick{overflow-x:auto} }
@container main (max-width:560px){ .pc-tick{flex-basis:100%} }

/* ── views ── */
.pc-content{position:relative;flex:1;min-height:0}
.view{display:none}
#view-home.on{display:block;position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pc-frame.on{display:block;position:absolute;inset:0}
.pc-frame iframe{display:block;width:100%;height:100%;border:0}
/* an app is open: its own bar is the only bar */
body.is-app .pc-main > .p-bar,body.is-app .pc-band{display:none}
/* phone: the Home square sits where the app's own Pine mark is */
.pc-fab{display:none;position:fixed;z-index:70;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);width:56px;height:64px;border:0;background:var(--p-black);color:var(--p-white);cursor:pointer;align-items:center;justify-content:center}
.pc-fab svg{width:38px;height:30px;fill:currentColor}
@media (max-width:699px){ body.is-app .pc-fab{display:flex} }

/* ── home ── */
.pc-homewrap{padding:20px 24px 40px;max-width:1440px}
.pc-greet{display:flex;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--p-line)}
.pc-greet-main{flex:1 1 320px;min-width:0}
.pc-greet .p-h1{font-size:40px}
.pc-greet-tag{margin:6px 0 4px;font-size:var(--p-fs-m);color:var(--p-ink-2)}
.pc-greet-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pc-greet-end .p-big{text-transform:uppercase}
.pc-greet-end .p-btn-quiet{min-height:var(--p-tap);padding:0 4px}
.pc-tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.pc-tiles-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pc-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;padding:18px 8px 14px;border:1px solid var(--p-line);border-radius:var(--p-r-lg);background:var(--p-white);color:var(--p-black);cursor:pointer;font:800 var(--p-fs-m)/1.1 var(--p-sans);transition:transform .1s}
.pc-tile:hover{border-color:var(--p-black);box-shadow:var(--p-shadow)}
.pc-tile:active{transform:scale(.97)}
.pc-tile svg{height:clamp(52px,9.5vh,104px);width:100%;max-width:120px;fill:currentColor}
.pc-tile .p-tag{position:absolute;top:8px;right:8px}
.pc-tile .p-tag[hidden]{display:none}
.pc-two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:0 24px}
.pc-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pc-link{display:flex;align-items:center;gap:12px;min-width:0;min-height:64px;padding:10px 14px;border:1px solid var(--p-line);border-radius:var(--p-r-lg);background:var(--p-white);color:var(--p-black);cursor:pointer;text-align:left}
.pc-link:hover{border-color:var(--p-black);box-shadow:var(--p-shadow)}
.pc-link .pc-mono{width:40px;height:40px;border-radius:6px;font-size:14px}
.pc-link b{display:block;font:800 var(--p-fs-m)/1.2 var(--p-sans)}
.pc-link small{display:block;margin-top:2px;font-size:var(--p-fs-s);line-height:1.25;color:var(--p-ink-2)}
@container main (max-width:1100px){ .pc-homewrap{padding:16px 20px 32px} .pc-greet .p-h1{font-size:32px} .pc-greet-end .p-big{font-size:32px} }
@container main (max-width:760px){ .pc-tiles{grid-template-columns:repeat(3,minmax(0,1fr))} .pc-two{grid-template-columns:minmax(0,1fr)} }
@container main (max-width:520px){
  .pc-homewrap{padding:14px 16px 32px}
  .pc-greet .p-h1{font-size:28px} .pc-greet-end{flex-direction:row;align-items:center;width:100%;justify-content:space-between} .pc-greet-end .p-big{font-size:28px}
  .pc-tiles{gap:8px} .pc-tile{padding:14px 4px 12px;font-size:var(--p-fs-s)} .pc-tile svg{height:56px}
  .pc-links{grid-template-columns:minmax(0,1fr)}
}

/* ── pop-ups ── */
.p-scrim[hidden]{display:none}
.pc-set .p-field + .p-field{margin-top:20px}
.p-modal-f{align-items:center}   /* kit: the footer's left hint sat on the top edge */
.pc-row{display:flex;gap:8px;align-items:center}
.pc-row .p-input{flex:1;min-width:0}
.pc-fact{font:700 var(--p-fs-l)/1.45 var(--p-sans);margin:0}
</style>
</head>

<script>
// ── apps ────────────────────────────────────────────────────────────
// v171: every app opens through its always-latest link (notes/ipad-links.md), so this menu never points at
// an old or deleted version again. Apps without a permanent link (Reprints, KPIs) stay on their current file.
const IFRAME_APPS = {
  operator:   "pine-operator.html",
  catching:   "pine-catching.html",
  seps:       "seps.html",
  screens:    "screens.html",
  receiving:  "receiving.html",
  reprint:    "reprints.html",   // v176: Reprints have a permanent link now (Reprints v4)
  ink:        "pine-ink-queue.html",
  purchasing: "pine-purchasing.html",
  kpi:        "pine-kpi.html",   // v175: KPIs have a permanent link now (KPIs v23 matches the Airtable KPI Tracker)
  damage:     "damage-log.html",
  lir:        "pine-line-item-review.html",
  order:      "create-order.html",
  pom:        "price-o-matic.html",
  board:      "pine-production-board.html",
  dayfill:    "pine-day-fill.html",
  schedule:   "pine-schedule.html",   // v173: Scheduler + Day Fill in one app
};
// v171 — the office apps (no drawn icon yet: they get a black monogram square)
const MORE_APPS=[
  {id:'order',  name:'Create order',     sub:'Build an order from a deal'},
  {id:'lir',    name:'Line Item Review', sub:'Proofs, comments, send to sign'},
  {id:'pom',    name:'Price-O-Matic',    sub:'Quotes'},
  {id:'damage', name:'Damage Log',       sub:'Damages, refunds, trends'},
  {id:'board',  name:'Production Board', sub:'Who is on which press'},
  {id:'schedule',name:'Schedule',        sub:'Drag jobs onto presses'},   // v173: replaces Day Fill (pine-day-fill.html still works)
];
const PROD_APPS=[{id:'seps',name:'Seps'},{id:'screens',name:'Screens'},{id:'ink',name:'Ink'},{id:'operator',name:'Operator'},{id:'catching',name:'Catching'},{id:'receiving',name:'Receiving'}];
const ADMIN_APPS=[{id:'reprint',name:'Reprints'},{id:'purchasing',name:'Purchasing'},{id:'kpi',name:'KPIs'}];
const vm={home:'Home'};
[].concat(PROD_APPS,MORE_APPS,ADMIN_APPS).forEach(a=>{ vm[a.id]=a.name; });

// v174: Central in practice (?practice=1) opens every app in practice too (the permanent links pass ?params on)
const PRACTICE=/[?&]practice=1(&|$)/.test(location.search);
function appUrl(id,hash){ return IFRAME_APPS[id]+(PRACTICE?'?practice=1':'')+(hash||''); }

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mono(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).replace('-','').toUpperCase(); }
function icon(id){ return '<svg><use href="#i-'+id+'"/></svg>'; }

function buildMenu(){
  const nav=document.getElementById('railNav'), content=document.getElementById('content');
  const item=(a,ic)=>'<button class="pc-item" id="nav-'+a.id+'" onclick="sv(\''+a.id+'\')" title="'+esc(a.name)+'" aria-label="'+esc(a.name)+'">'+ic+'<span class="pc-lbl">'+esc(a.name)+'</span>'+(a.id==='catching'?'<span class="pc-count" hidden></span>':'')+'</button>';
  const sec=t=>'<div class="pc-sec"><span class="p-label pc-sec-t">'+t+'</span></div>';
  nav.innerHTML=sec('Production')+PROD_APPS.map(a=>item(a,'<span class="pc-ic">'+icon(a.id)+'</span>')).join('')
    +sec('Sales &amp; office')+MORE_APPS.map(a=>item(a,'<span class="pc-mono">'+mono(a.name)+'</span>')).join('')
    +sec('Admin &amp; lookup')+ADMIN_APPS.map(a=>item(a,'<span class="pc-ic">'+icon(a.id)+'</span>')).join('');
  const tile=a=>'<button class="pc-tile" id="tile-'+a.id+'" onclick="sv(\''+a.id+'\')">'+icon(a.id)+'<span>'+esc(a.name)+'</span>'+(a.id==='catching'?'<span class="p-tag p-tag-wait" hidden></span>':'')+'</button>';
  document.getElementById('homeProd').innerHTML=PROD_APPS.map(tile).join('');
  document.getElementById('homeAdmin').innerHTML=ADMIN_APPS.map(tile).join('');
  document.getElementById('homeSales').innerHTML=MORE_APPS.map(a=>'<button class="pc-link" onclick="sv(\''+a.id+'\')"><span class="pc-mono">'+mono(a.name)+'</span><span><b>'+esc(a.name)+'</b><small>'+esc(a.sub)+'</small></span></button>').join('');
  [].concat(PROD_APPS,MORE_APPS,ADMIN_APPS).forEach(a=>{
    const v=document.createElement('div'); v.id='view-'+a.id; v.className='view pc-frame';
    v.innerHTML='<iframe id="iframe-'+a.id+'" title="'+esc(a.name)+'" allowfullscreen></iframe>';
    content.appendChild(v);
  });
}
buildMenu();

function sv(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.pc-item,.pc-home').forEach(e=>e.classList.remove('is-on'));
  const el=document.getElementById('view-'+v); if(el) el.classList.add('on');
  const n=document.getElementById('nav-'+v); if(n) n.classList.add('is-on');
  document.body.classList.toggle('is-app',v!=='home');
  document.title=(v==='home'?'Pine Central v'+ver():vm[v]+' · Pine Central')+' — Lords of Merch';
  if(IFRAME_APPS[v]){
    const iframe=document.getElementById('iframe-'+v);
    if(iframe && !(iframe.getAttribute('src')||'').includes(IFRAME_APPS[v].split('#')[0])) iframe.src=appUrl(v);
  }
  toggleRail(false);
}
function goMachine(machineId){
  // Operator opens straight on that press (pine-operator.html forwards the #hash). Set the src first so it loads once.
  const iframe=document.getElementById('iframe-operator');
  if(iframe) iframe.src=appUrl('operator','#machine='+machineId);
  sv('operator');
}

// ── menu: collapse (desktop) / open over the page (icons-only rail) ──
function railIconsOnly(){ return innerWidth<1000 || document.body.classList.contains('rail-col'); }
function toggleRail(force){
  const rail=document.getElementById('rail'), shade=document.getElementById('railShade'), tog=document.getElementById('railTog');
  if(force===false){ rail.classList.remove('is-open'); shade.hidden=true; paintTog(); return; }
  if(innerWidth>=1000 && !rail.classList.contains('is-open')){
    const col=!document.body.classList.contains('rail-col');
    document.body.classList.toggle('rail-col',col);
    try{ localStorage.setItem('pine_central_rail',col?'col':'open'); }catch(e){}
  } else {
    const open=!rail.classList.contains('is-open'); rail.classList.toggle('is-open',open); shade.hidden=!open;
  }
  paintTog();
}
function paintTog(){
  const rail=document.getElementById('rail'), tog=document.getElementById('railTog');
  const wide=rail.classList.contains('is-open')||!railIconsOnly();
  tog.textContent=wide?'«':'»'; tog.title=wide?'Collapse menu':'Show names'; tog.setAttribute('aria-label',tog.title);
}
try{ if(localStorage.getItem('pine_central_rail')==='col') document.body.classList.add('rail-col'); }catch(e){}
addEventListener('resize',()=>{ if(innerWidth>=1000) toggleRail(false); else paintTog(); });
paintTog();

// ── ⚙ settings: token, view as, practice ──
let atKey=null;
function savedKey(){ try{ return localStorage.getItem('pine_at_key')||''; }catch(e){ return ''; } }
function openSet(){ toggleRail(false); document.getElementById('setScrim').hidden=false; paintSet(); setTimeout(()=>{ const i=document.getElementById(savedKey()?'viewAsSelect':'sb-token-input'); if(i) i.focus(); },30); }
function closeSet(){ document.getElementById('setScrim').hidden=true; document.getElementById('sb-token-input').value=''; }
function paintSet(){
  const has=!!savedKey(), typed=!!document.getElementById('sb-token-input').value.trim();
  document.getElementById('sb-token-input').placeholder=has?'Saved ✓ · paste a new one to replace it':'Paste token';
  document.getElementById('tokHint').textContent=has?'Saved on this device. Every app opened here uses it.':'Needed for the numbers and the apps. Saved on this device only.';
  document.getElementById('tokSave').disabled=!typed;
  document.getElementById('tokClear').hidden=!has;
  document.getElementById('modeLive').classList.toggle('is-on',!PRACTICE);
  document.getElementById('modePractice').classList.toggle('is-on',PRACTICE);
}
function sbSaveToken(){
  const inp=document.getElementById('sb-token-input');
  const val=inp.value.trim();
  if(!val) return;
  atKey=val;
  localStorage.setItem('pine_at_key', val);
  inp.value=''; paintSet();
  document.getElementById('tokHint').textContent='Saved ✓ Reloading the numbers and any open apps.';
  // Kick off stats fetch now that we have a token
  if(typeof fetchStats==='function'){ _statsAt=0; fetchStats(); }
  // Reload any already-loaded iframe apps so they pick up the new token
  Object.keys(IFRAME_APPS).forEach(function(appKey){
    var iframe=document.getElementById('iframe-'+appKey);
    if(iframe && iframe.getAttribute('src')) iframe.src=appUrl(appKey);
  });
}
function sbClearToken(){
  localStorage.removeItem('pine_at_key');
  atKey=null;

const factSets=[
  // Morning (slots 0+1) — energizing, history, craft
  ["Screen printing dates back over 1,000 years — earliest stencil techniques appeared in Song Dynasty China.","Plastisol ink doesn't dry — it cures. Below 320°F it stays tacky forever.","A well-tuned ROQ press can print over 1,000 pieces per hour — nearly one shirt every three seconds.","Fort Collins' Old Town inspired Disneyland's Main Street USA — Walt Disney visited in the 1950s.","New Belgium Brewing started in a Fort Collins basement in 1991 with $140k and a bike tour of Belgian breweries.","Squeegee durometer matters — most printers favor 70-75. Too soft floods, too hard starves the screen.","The word 'bandana' comes from Hindi 'bandhani,' a tie-dye technique that entered English in the 1700s.","Screen printing emulsion is light-sensitive — UV hardens it everywhere except your design.","Fort Collins was completely dry from 1896 to 1969. The craft brewery scene made up for it.","A well-maintained screen can last thousands of impressions — it's usually the emulsion edges that fail first."],
  // Afternoon (slots 2+3) — process, shop floor, local pride
  ["Discharge printing removes dye from the fabric chemically — the result feels like nothing is there.","Colorado has 58 fourteeners — more than any other state in the continental US.","Water-based ink absorbs into the fabric; plastisol sits on top. That's why they feel different.","The first commercial screen printing business in the US opened in 1936 in Cleveland, Ohio.","A standard athletic jersey takes 11 separate print passes before it's done — most people never notice.","Fort Collins averages 300 days of sunshine a year — more than Miami.","Ink viscosity changes with temperature. A cold shop means thicker ink and more pressure needed.","The ROQ's pallet registration system can hold tolerance to under half a millimeter across a full run.","Craft beer and screen printing have a lot in common — both reward obsessive attention to small details.","Pantone has over 1,800 spot colors in its fashion system. Most screen printers work from about 50."],
  // End of shift (slot 4) — wrap-up, reflection, fun
  ["The average screen printer handles around 2,000 garments per shift — that's a lot of shirts.","Fort Collins is home to more breweries per capita than almost any city in the US.","A clean press is a fast press. Most setup time is lost to ink buildup and registration drift.","The record for most colors printed in a single screen-print run is 22. Most jobs top out at 8.","Discharge ink was developed in the 1980s — before that, printing on dark garments meant heavy plastisol only.","Squeegees were originally rubber blades used to clean glass — printers borrowed the tech in the 1940s.","Fort Collins hosts the Tour de Fat every year — one of the biggest cycling festivals in the country.","A screen's mesh count determines ink deposit: lower count = more ink, higher count = finer detail.","The smell of plastisol curing is unmistakable. Most print shop veterans say they miss it when they leave.","Colorado's Front Range has over 4 million people — most of them have worn something printed in a shop like this."]
];
function openFact(){

  document.getElementById('ff-ov').hidden=false;

function closeFact(){ document.getElementById('ff-ov').hidden=true; }

<script>
// ── LIVE STATS (v172) ─────────────────────────────────────────────
// The ticker shows the last workday's work, one small query per stat. Airtable does the filtering, so each
// query returns only that day's records (it used to page through ~11,000 burned screens and then count
// 7-day totals from the oldest 100 records). Days are Fort Collins days (America/Denver), not UTC.
// If the last weekday had no work at all (no Friday shift), it steps back to the day before (up to 3 days).
var BASE_ID_S='appJkaLk8DykjsgHR';
var T_IMP='tbln9oAGvz2PNBZLV', T_LI='tblJx5UlwO7oMSk5H', T_ORD='tbl8Tf0AeS9gnHOOS';
var F_IMPRINTS={screens:'fld8rgkIj1RPO97QU',impr:'fldKtGAIDbstJWIgb',equip:'fldv59OGU7EkBVofo',inks:'fldpNCCXTgHyDhvak',stitches:'fldae8r0SqhtJ13mM'};
var F_LI={qty:'fldFfuKAcduwWQp8g'};
var SHOP_TZ='America/Denver';

function shopDay(d){ return new Intl.DateTimeFormat('en-CA',{timeZone:SHOP_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d||new Date()); }
function dayShift(ds,n){ var d=new Date(ds+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function prevWorkday(ds){ var d=dayShift(ds,-1); while([0,6].indexOf(new Date(d+'T12:00:00Z').getUTCDay())>-1) d=dayShift(d,-1); return d; }
function dayWord(ds){
  var today=shopDay();
  if(ds===dayShift(today,-1)) return 'yesterday';
  return 'on '+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(ds+'T12:00:00Z').getUTCDay()];
}
// A lastModified / dateTime field, read as a Fort Collins date
function onDay(field,ds){ return 'DATETIME_FORMAT(SET_TIMEZONE({'+field+'},"'+SHOP_TZ+'"),"YYYY-MM-DD")="'+ds+'"'; }

function atList(table,formula,fields,maxPages){
  var token=localStorage.getItem('pine_at_key')||'';
  var base='https://api.airtable.com/v0/'+BASE_ID_S+'/'+table+'?returnFieldsByFieldId=true&pageSize=100&filterByFormula='+encodeURIComponent(formula)+
    fields.map(function(f){return '&fields%5B%5D='+f;}).join('');
  var out=[], pages=0;
  function page(offset){
    return fetch(base+(offset?'&offset='+encodeURIComponent(offset):''),{headers:{Authorization:'Bearer '+token}}).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+t.slice(0,120)); });
      return r.json();
    }).then(function(d){
      out=out.concat(d.records||[]); pages++;
      return d.offset&&pages<(maxPages||10) ? page(d.offset) : out;
    });
  }
  return page(null);
}
function sum(recs,f){ return recs.reduce(function(a,r){ var v=(r.fields||{})[f]; return a+(Array.isArray(v)?v.length:Number(v||0)); },0); }
function uniq(recs,f){ var seen={}; recs.forEach(function(r){ ((r.fields||{})[f]||[]).forEach(function(x){ seen[x.id||x]=1; }); }); return Object.keys(seen).length; }
function eqName(r){ return (((r.fields||{})[F_IMPRINTS.equip])||{}).name||''; }
function plural(n,one,many){ return n.toLocaleString()+' '+(n===1?one:(many||one+'s')); }

// One workday's numbers
function statsFor(ds){
  var q=[
    atList(T_IMP,'AND({Sep\'d},'+onDay('Sep\'d Timestamp',ds)+')',[]),
    atList(T_IMP,'AND({Inks Ready},'+onDay('Inks Ready Timestamp',ds)+')',[F_IMPRINTS.inks]),
    atList(T_IMP,'AND({Screens Burned},'+onDay('Screens Burned Timestamp',ds)+')',[F_IMPRINTS.screens]),
    atList(T_IMP,'AND({Run Finished},'+onDay('Run End Actual',ds)+')',[F_IMPRINTS.impr,F_IMPRINTS.equip,F_IMPRINTS.stitches]),
    atList(T_IMP,'AND({Caught},'+onDay('Caught At',ds)+')',[F_IMPRINTS.impr]),
    atList(T_LI,'AND({Received},'+onDay('Received Timestamp',ds)+')',[F_LI.qty]),
    atList(T_ORD,'DATETIME_FORMAT({Completed Date (Automated)},"YYYY-MM-DD")="'+ds+'"',[])
  ];
  return Promise.all(q).then(function(r){
    var ran=r[3], screen=ran.filter(function(x){return /Press [12]/.test(eqName(x));}),
        emb=ran.filter(function(x){return /embroid|tajima/i.test(eqName(x));}),
        heat=ran.filter(function(x){return /heat/i.test(eqName(x));});
    return {
      ds:ds,
      seps:r[0].length,
      inkJobs:r[1].length, inks:uniq(r[1],F_IMPRINTS.inks),   // one ink shared by two jobs counts once
      burnJobs:r[2].length, screens:sum(r[2],F_IMPRINTS.screens),
      printJobs:screen.length, printed:sum(screen,F_IMPRINTS.impr),
      embJobs:emb.length, embPieces:sum(emb,F_IMPRINTS.impr), stitches:sum(emb,F_IMPRINTS.stitches),
      heatJobs:heat.length, heatPieces:sum(heat,F_IMPRINTS.impr),
      caughtJobs:r[4].length, caught:sum(r[4],F_IMPRINTS.impr),
      recvLines:r[5].length, recvPieces:sum(r[5],F_LI.qty),
      completed:r[6].length
    };
  });
}
function anyWork(s){ return s.seps+s.inkJobs+s.burnJobs+s.printJobs+s.embJobs+s.heatJobs+s.caughtJobs+s.recvLines+s.completed>0; }

// Today: what's on the schedule. Scheduled Start Time is stored as shop clock time (08:30Z = 8:30 am),
// so its date is read without a time zone (same as Operator).
function todayStats(){
  var today=shopDay();
  return atList(T_IMP,'DATETIME_FORMAT({Scheduled Start Time},"YYYY-MM-DD")="'+today+'"',[F_IMPRINTS.impr,F_IMPRINTS.equip]).then(function(recs){
    var screen=recs.filter(function(x){return /Press [12]/.test(eqName(x));});
    return {jobs:recs.length, printJobs:screen.length, printImpr:sum(screen,F_IMPRINTS.impr)};
  });
}
// Sidebar badge: jobs finished on a press in the last 3 days that nobody has caught yet
function toCatchCount(){
  return atList(T_IMP,'AND({Run Finished},NOT({Caught}),IS_AFTER({Run End Actual},DATEADD(NOW(),-3,"days")),OR(FIND("Press 1",{Equipment}&""),FIND("Press 2",{Equipment}&"")))',[],3)
    .then(function(r){return r.length;});
}
// v174: the Catching count shows on the menu item and on the home tile (yellow = needs you)
function setBadge(id,n){
  var txt=n>99?'99+':String(n), tip=n+' job'+(n===1?'':'s')+' finished and not caught yet';
  var c=document.querySelector('#'+id+' .pc-count');
  if(c){ c.textContent=txt; c.hidden=!(n>0); c.title=tip; }
  var t=document.querySelector('#tile-'+id.replace(/^nav-/,'')+' .p-tag');
  if(t){ t.textContent=txt+' to catch'; t.hidden=!(n>0); t.title=tip; }
}

var _statsBusy=false, _statsAt=0;
async function fetchStats(){
  var token=localStorage.getItem('pine_at_key')||'';
  if(!token){renderTickerStatic();return;}
  if(_statsBusy||Date.now()-_statsAt<60000) return; _statsBusy=true; _statsAt=Date.now();   // load and token-save both call this
  try{
    var ds=prevWorkday(shopDay()), s=null;
    for(var tries=0;tries<3;tries++){ s=await statsFor(ds); if(anyWork(s)) break; ds=prevWorkday(ds); }
    var t=await todayStats().catch(function(){return null;});
    renderTicker(s,t);
    toCatchCount().then(function(n){setBadge('nav-catching',n);}).catch(function(){});
  }catch(e){
    console.error('fetchStats:',e);
    var track=document.getElementById('ybarTrack');
    if(track){
      track.innerHTML='<div class="ybar-item"><span class="ybar-dept">Stats</span><span class="ybar-d"></span><span class="ybar-stat">Couldn\'t load the numbers. They\'ll try again in 30 minutes.</span></div>';
      track.style.animationDuration='20s';
    }
  }finally{ _statsBusy=false; }
}

function renderTicker(s,t){
  var w=dayWord(s.ds), items=[];
  if(t&&t.jobs) items.push({dept:'Today',stat:plural(t.jobs,'job')+' on the schedule'+(t.printImpr?' · '+plural(t.printImpr,'impression')+' on the presses':'')});
  if(s.seps) items.push({dept:'Art',stat:plural(s.seps,'job')+' sep\'d '+w});
  if(s.inkJobs) items.push({dept:'Ink room',stat:(s.inks?plural(s.inks,'ink')+' mixed for ':'Inks mixed for ')+plural(s.inkJobs,'job')+' '+w});
  if(s.burnJobs) items.push({dept:'Screen room',stat:plural(s.screens,'screen')+' burned for '+plural(s.burnJobs,'job')+' '+w});
  if(s.printJobs) items.push({dept:'Presses',stat:plural(s.printed,'impression')+' printed on '+plural(s.printJobs,'job')+' '+w});
  if(s.embJobs) items.push({dept:'Embroidery',stat:(s.stitches?(s.stitches>=1000000?(Math.round(s.stitches/100000)/10)+' million':s.stitches.toLocaleString())+' stitches on ':'')+plural(s.embPieces,'piece')+' '+w});
  if(s.heatJobs) items.push({dept:'Heat press',stat:plural(s.heatPieces,'piece')+' pressed on '+plural(s.heatJobs,'job')+' '+w});
  if(s.caughtJobs) items.push({dept:'Catching',stat:plural(s.caughtJobs,'job')+' caught and counted '+w});
  if(s.recvLines) items.push({dept:'Receiving',stat:plural(s.recvPieces,'garment')+' checked in on '+plural(s.recvLines,'line item')+' '+w});
  if(s.completed) items.push({dept:'Shipping',stat:plural(s.completed,'order')+' completed '+w});
  if(!items.length){renderTickerStatic();return;}
  var all=[].concat(items,items,items);
  var html=all.map(function(item){return '<div class="ybar-item"><span class="ybar-dept">'+item.dept+'</span><span class="ybar-d"></span><span class="ybar-stat">'+item.stat+'</span></div>';}).join('');
  var track=document.getElementById('ybarTrack');
  if(track){track.innerHTML=html;track.style.animationDuration=Math.max(30,items.length*9)+'s';}
}

function renderTickerStatic(){
  var track=document.getElementById('ybarTrack');
  if(!track)return;
  var items=[{dept:'Lords of Merch',stat:'Fort Collins, CO'},{dept:'Pine Central',stat:'Screen printing · Embroidery · Fulfillment'},{dept:'Tip',stat:'Add your Airtable token under ⚙ to see the shop\'s numbers here'}];
  var all=[].concat(items,items,items);
  track.innerHTML=all.map(function(item){return '<div class="ybar-item"><span class="ybar-dept">'+item.dept+'</span><span class="ybar-d"></span><span class="ybar-stat">'+item.stat+'</span></div>';}).join('');
  track.style.animationDuration='30s';
}

window.addEventListener('DOMContentLoaded',function(){
  setTimeout(fetchStats,1200);
  setInterval(fetchStats,1800000);
});
</script>
<script>
function ver(){ return (window.PineUpdate&&PineUpdate.ver)||174; }
// Refresh: look for a new Central version, and reload the numbers
function refreshAll(){
  if(window.PineUpdate&&PineUpdate.check) PineUpdate.check();
  _statsAt=0; fetchStats();
}
// v174: Central is "busy" while an app open inside it is (its own pineBusy), or while ⚙ is open. An app without
// pineBusy that's on screen counts as busy, so a self-update never wipes someone's half-done work in an app.
window.pineBusy=function(){
  if(!document.getElementById('setScrim').hidden) return true;
  var busy=false;
  document.querySelectorAll('.pc-frame iframe').forEach(function(f){
    if(busy||!f.getAttribute('src')) return;
    try{
      var w=f.contentWindow;
      if(w&&typeof w.pineBusy==='function'){ if(w.pineBusy()) busy=true; }
      else if(f.parentNode.classList.contains('on')) busy=true;
    }catch(e){ if(f.parentNode.classList.contains('on')) busy=true; }
  });
  return busy;
};
</script>
