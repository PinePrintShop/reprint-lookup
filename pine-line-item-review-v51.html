<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Line Item Review v51 — Pine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap">
<link rel="stylesheet" href="pine-style-v2.css">
<link rel="stylesheet" href="pine-office-v1.css">
<style>
/* Line Item Review v19: Pine style v2 + pine-office-v1.css. Old token names kept, mapped to the four brand colors. */
:root{--bg:var(--p-cream-lt);--surface:#fff;--line:var(--p-line);--line2:var(--p-line-strong);--text:var(--p-black);--muted:var(--p-ink-3);--soft:var(--p-cream-lt);
  --yellow:var(--p-yellow);--ytint:var(--p-yellow-lt);--red:var(--p-alert);--rtint:var(--p-alert-lt);--sans:var(--p-sans);--r:12px}
*{margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-size:15px}
button{cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hint{font-size:var(--p-fs-xs);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:2px solid var(--p-black);background:#fff;border-radius:6px;font-weight:700;font-size:15px;color:var(--p-black);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--p-cream)}
.btn.y{background:var(--p-black);color:#fff}           /* a box's own save / post: black. The one yellow is the next step or Send */
.btn.y:hover{background:#2B2A26}
.btn:disabled{opacity:.38;cursor:not-allowed}
.lk{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1.5px solid var(--line2);border-radius:6px;background:#fff;font-size:14px;font-weight:700;text-decoration:none;color:var(--p-black)}
.lk:hover{border-color:var(--p-black)}
.lk.master{background:var(--p-black);border-color:var(--p-black);color:#fff}.lk.master small{font:700 12px var(--sans);margin-left:4px;color:var(--p-yellow)}
.lk.dim{color:var(--p-ink-3);font-weight:400;border-style:dashed}
.lk.last{background:var(--p-cream);border-color:var(--p-cream-dk)}
.lk.ed{color:var(--p-ink-2)}.lk.ed:hover{color:var(--p-black)}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--p-cream);border:1.5px solid var(--p-cream-dk);color:var(--p-ink-2);white-space:nowrap}
.tag.hard{background:#fff;border-color:var(--p-black);color:var(--p-black)}
.idtag{display:inline-block;font:800 15px/1 var(--sans);background:var(--p-black);color:var(--p-yellow);padding:5px 8px;border-radius:4px;white-space:nowrap;letter-spacing:.02em}
.warn{background:var(--rtint);border-left:4px solid var(--red);color:#7A1414;border-radius:6px;padding:8px 12px;font-size:14px;margin-top:10px}
.empty{padding:22px 14px;color:var(--p-ink-2);font-size:15px;text-align:center}
.spin{color:var(--p-ink-2);padding:30px;text-align:center}
/* ---- list (left pane) ---- */
.og+.og{margin-top:14px}
.oh{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;cursor:pointer;margin:0 2px 6px}
.oh .p-id{font-size:13px}
.oh .nm{font:800 14px/1.25 var(--sans);text-transform:uppercase;letter-spacing:.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oh .meta{width:100%;font-size:13px;color:var(--p-ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.oh .meta .p-tag{height:22px;padding:0 7px}
.li .cc{font-size:13px;color:var(--p-ink-2)}
.li .chev{color:var(--p-ink-3);font-size:22px;line-height:1;align-self:center}
.lhint{font-size:13px;color:var(--p-ink-2);margin:0 2px 10px}
#reps:empty,#needs:empty{display:none}
#needs{flex-wrap:wrap;overflow:visible;order:0;margin:0 0 12px}   /* v32: sits at the top of the Review list, right above the lines it filters (the filter row is full) */
/* ---- detail (right pane) ---- */
.det{min-width:0}
.back{display:none}
.lnav{display:flex;align-items:center;gap:6px;margin-top:10px}
.lnav .ar{flex:none;width:40px;height:40px;border:1.5px solid var(--line2);background:#fff;border-radius:6px;font-size:18px;font-weight:700;line-height:1;color:var(--p-black)}
.lnav .ar:disabled{opacity:.35}
.lnav .cnt{flex:none;font:700 13px var(--sans);color:var(--p-ink-2);min-width:48px;text-align:center}
.lines{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding:2px 1px 4px}
.lc{flex:none;border:1.5px solid var(--line2);background:#fff;border-radius:6px;padding:4px 10px;font-size:13px;display:flex;align-items:center;gap:6px;min-height:40px;text-align:left;white-space:nowrap;max-width:280px;color:var(--p-black)}
.lc span.t{overflow:hidden;text-overflow:ellipsis}
.lc.on{border:2px solid var(--p-black);background:var(--p-cream);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid var(--p-black)}
.d-proof{background:#fff}.d-uploaded{background:var(--p-cream-dk)}.d-review{background:var(--p-yellow)}.d-ready{background:var(--p-black)}
.archbar{margin-top:10px}
.sbar{margin-top:10px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:12px}
.dmain{min-width:0}
.box{padding:14px 16px}
.box h3{font:900 var(--p-fs-s)/1 var(--p-display);text-transform:uppercase;letter-spacing:.03em;word-spacing:.14em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.box h3>span:first-child{background:var(--p-black);color:#fff;padding:8px 12px;border-radius:2px}
.box h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;word-spacing:0;font:400 13px var(--sans);color:var(--p-ink-2)}
.h3b{margin-left:auto}
.stack>*+*{margin-top:14px}
.proofs{display:flex;gap:10px;flex-wrap:wrap}
.pf{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft);text-decoration:none;width:100%}
.pf img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;background:#fff}
.pf .fn{font-size:13px;padding:6px 8px;color:var(--p-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noproof{border:2px dashed var(--line2);border-radius:var(--r);padding:26px;text-align:center;color:var(--p-ink-2);width:100%}
.pthumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;flex:none}
.pt{flex:none;width:76px;height:58px;border:1.5px solid var(--line2);border-radius:6px;background:#fff;padding:2px;overflow:hidden}
.pt img{width:100%;height:100%;object-fit:contain}
.pt.on{border:2px solid var(--p-black);box-shadow:0 0 0 2px var(--p-yellow)}
.attach{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;font-size:15px;align-items:baseline}
.kv .k{font-size:13px;color:var(--p-ink-2)}
.sz{display:flex;gap:6px;flex-wrap:wrap}
.sz span{border:1.5px solid var(--line2);border-radius:6px;padding:4px 8px;font:700 14px var(--sans);background:#fff}
.sz span small{font:400 12px var(--sans);color:var(--p-ink-2);margin-right:4px}
.sz span.tot{background:var(--p-black);color:#fff;border-color:var(--p-black)}.sz span.tot small{color:rgba(255,255,255,.75)}
.szed{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.szed label{display:flex;flex-direction:column;font-size:12px;color:var(--p-ink-2);gap:2px}
.szed input{height:44px;border:2px solid var(--line2);border-radius:6px;padding:0 6px;font:700 15px var(--sans);text-align:center;width:100%;background:#fff}
.szed input.chg{border-color:var(--p-black);background:var(--ytint)}
.szbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.szbar .tot{font:700 15px var(--sans);margin-right:auto}
.sznote{margin-top:10px;background:var(--ytint);border-left:4px solid var(--p-yellow);border-radius:6px;padding:8px 10px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nt-grid label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--p-ink-2);font-weight:700}
.nt-grid textarea{border:2px solid var(--line2);border-radius:6px;padding:9px 10px;min-height:80px;resize:vertical;font-size:15px;color:var(--p-black);font-weight:400;outline:none;width:100%;background:#fff}
.nt-grid textarea:focus,.cbox textarea:focus,.p-off-price input:focus{border-color:var(--p-black);box-shadow:0 0 0 3px var(--p-yellow)}
.nt-grid textarea.dirty{border-color:var(--p-black);background:var(--ytint)}
.savebar{display:flex;gap:10px;align-items:center;margin-top:12px}
/* comments */
.cm{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto}
.c{background:var(--p-cream-lt);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.c.mine{background:var(--p-cream);border-color:var(--p-cream-dk)}
.c .a{font-size:13px;color:var(--p-ink-2);display:flex;gap:6px;align-items:baseline}
.c .a b{color:var(--p-black);font-size:14px}
.c .t{font-size:15px;margin-top:3px;white-space:pre-wrap;word-wrap:break-word}
.c .t .m{font-weight:700;background:#fff;border-radius:4px;padding:0 3px}
.cbox{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.cbox textarea{width:100%;min-height:72px;border:2px solid var(--line2);border-radius:6px;padding:9px 10px;font-size:15px;resize:vertical;outline:none}
.cbox.drag{outline:3px dashed var(--p-black);outline-offset:4px}
.ment{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.mch,.shotbtn{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:0 12px;min-height:36px;font-size:14px;font-weight:700;color:var(--p-black)}
.mch.on{background:var(--p-black);border-color:var(--p-black);color:var(--p-yellow)}
.shotbtn{border-style:dashed}
.pend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pend .ps{position:relative;width:92px;height:70px;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.pend .ps img{width:100%;height:100%;object-fit:cover}
.pend .ps button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:12px;line-height:24px;padding:0;cursor:pointer}
.c .shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.c .shots a{display:block;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff;max-width:220px}
.c .shots img{display:block;max-width:220px;max-height:160px;object-fit:contain}
.c .shots .miss{font-size:13px;color:var(--p-ink-2);padding:6px 8px}
.crow{display:flex;gap:10px;align-items:center}
.crow .btn{margin-left:auto}
/* pricing (the shared price block) */
.p-off-price .p-num b{font-size:18px}
.p-off-price .p-num.is-alert b{color:var(--red)}
.pin{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pin input{height:44px;width:120px;border:2px solid var(--line2);border-radius:6px;padding:0 10px;font:700 18px var(--sans);outline:none}
/* imprint edit form */
.impf{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;border:2px solid var(--p-black);background:var(--ytint);border-radius:var(--r);padding:10px 12px}
.impf+.p-off-imp,.p-off-imp+.impf{margin-top:8px}
.impf .ifh{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.impf label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--p-ink-2)}
.impf label.w{grid-column:1/-1}
.impf label.ck{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--p-black);align-self:end;height:44px}
.impf input,.impf select,.impf textarea{height:44px;border:2px solid var(--line2);border-radius:6px;padding:0 8px;font-size:15px;color:var(--p-black);font-weight:400;background:#fff;width:100%}
.impf textarea{height:auto;padding:6px 8px;resize:vertical}
.impf input[type=checkbox]{width:20px;height:20px}
.impf .ifa{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:flex-end}.impf .ifa .hint{margin-right:auto}
/* phone bottom bar (approvals) */
.abar{position:sticky;bottom:0;z-index:5;margin:12px -16px 0;background:var(--p-black);padding:6px 6px max(6px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ab{min-height:48px;border-radius:6px;border:1.5px solid rgba(255,255,255,.45);background:transparent;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.1;text-align:center;padding:0 8px}
.ab small{display:none}
.ab.on{background:#fff;color:var(--p-black);border-color:#fff}
.ab.nx{background:var(--p-yellow);color:var(--p-black);border-color:var(--p-yellow)}
.ab.next{grid-column:1/-1;min-height:40px;color:#fff}
.ab:disabled{opacity:.4}
/* send-for-signature sheet + "last time" pop-up */
.sheet{position:fixed;inset:0;background:rgba(20,20,18,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.sheet .in{background:#fff;border-radius:var(--r);width:min(980px,100%);padding:18px 20px}
.sheet h2{font-size:20px;margin-bottom:4px}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet label{display:block;font-size:13px;color:var(--p-ink-2);font-weight:700;margin:10px 0 4px}
.sheet input,.sheet textarea{width:100%;border:2px solid var(--line2);border-radius:6px;padding:9px 10px;font-size:15px}
.sheet input{height:44px}.sheet textarea{min-height:70px;resize:vertical}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;position:sticky;bottom:-18px;background:#fff;padding:10px 0 12px;border-top:1px solid var(--line)}
.sheet #sdGo{background:var(--p-yellow);color:var(--p-black)}
.sheet .chk{font-size:14px;margin-top:10px;display:grid;gap:4px}
.sheet .chk div::before{content:"✓ ";font-weight:900}
.sheet .chk div.bad::before{content:"! ";color:var(--red)}
.sheet .chk div.bad{color:#7A1414}
.thumbs{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;max-height:56vh;overflow:auto;background:var(--soft);border-radius:8px;padding:12px}
.thumbs .th{display:flex;flex-direction:column;gap:4px;text-decoration:none;font-size:13px;color:var(--p-ink-2);align-items:center}
.thumbs canvas{border:1px solid var(--line2);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.thumbs .pg{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.thumbs .pg .rm{position:absolute;top:6px;right:6px;border:0;border-radius:14px;background:var(--p-black);color:#fff;font:700 13px var(--sans);padding:6px 10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.thumbs .pg .rm:hover{background:var(--red)}
.thumbs .pg.off canvas{opacity:.25;filter:grayscale(1)}
.thumbs .pg.off .rm{background:var(--p-yellow);color:var(--p-black)}
.thumbs .pg.off::after{content:'Removed';position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font:900 18px var(--sans);color:var(--red);border:3px solid var(--red);border-radius:6px;padding:2px 10px;background:rgba(255,255,255,.85);pointer-events:none}
.thumbs .pg .lock{position:absolute;top:6px;right:6px;font-size:12px;background:var(--p-cream);border:1px solid var(--line2);border-radius:12px;padding:3px 8px;color:var(--p-ink-2)}
.pv{width:min(1240px,100%)}
.pvh{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.pvh h2{display:flex;align-items:center;gap:8px}
.pva{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.pva .btn{min-height:40px}
.pvg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px}
.pvbig{display:block;border:1px solid var(--line);border-radius:8px;background:#fff;height:min(62vh,620px)}
.pvbig img{width:100%;height:100%;object-fit:contain;display:block}
.pvp .fn{margin-top:6px}
.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-2);padding:4px 6px;border-bottom:1px solid var(--line)}
.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp td:first-child{color:var(--p-ink-2);font-size:13px;width:80px}
.cmp tr.chg td{background:var(--ytint)}.cmp tr.chg b{font-size:12px;color:var(--p-black)}
.pvd .nt{margin-top:10px;font-size:14px;background:var(--soft);border-radius:6px;padding:8px;white-space:pre-wrap}
.pvl{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pvd h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-2);margin:16px 0 6px}
.pvli{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:15px}
.pvli+.pvli{margin-top:6px}.pvli span{color:var(--p-ink-2);font-size:14px}.pvli small{width:100%;color:var(--p-black);font-size:13px;white-space:pre-wrap}
@media (max-width:900px){.sheet .row2{grid-template-columns:1fr}.thumbs canvas{max-width:42vw;height:auto}.pvg{grid-template-columns:1fr}.pvbig{height:46vh}}
/* ---- layout ---- */
/* the step bar stays under the top bar while the page scrolls (iPad); phones use the bottom bar */
@media (min-width:700px){ .abar{display:none} }
@media (min-width:700px) and (max-width:1199px){ .sbar{position:sticky;top:calc(var(--toph,64px) + 8px);z-index:4;box-shadow:0 0 0 8px var(--bg)} }
@media (max-width:699px){ .sbar{display:none} .proofs.multi .pf{width:100%} }   /* phones: the bottom bar has the steps (they showed twice) */
/* one pane below 1200px: the list, then the line (‹ All line items goes back) */
@media (max-width:1199px){
  .app.det-open .list{display:none}
  .app:not(.det-open) .det{display:none}
  .back{display:inline-flex;margin-bottom:8px}
  body.det-open #filters{display:none}
}
@media (max-width:900px){ .nt-grid{grid-template-columns:1fr} .kv{grid-template-columns:96px minmax(0,1fr)} }
/* desktop: list | the line (proof | the boxes), each fits the screen; the proof never scrolls away */
@media (min-width:1200px){
  html,body{height:100%;overflow:hidden}
  .det.p-off-pane{display:flex;flex-direction:column;overflow:hidden;padding-bottom:12px}
  .det>*{flex:none}
  .dgrid{flex:1 1 auto;min-height:0;grid-template-columns:minmax(0,1fr) clamp(380px,28vw,500px);grid-template-rows:minmax(0,1fr)}
  .dmain{display:flex;flex-direction:column;min-height:0}
  .pbox{flex:1;min-height:0;display:flex;flex-direction:column}
  .pdrop{outline:3px dashed #141412;outline-offset:-3px;background:#FFF8C2 !important}   /* v27: a proof file is over this box */
  .pbox .proofs{flex:1;min-height:0;display:flex}
  .pbox .pf{flex:1;min-height:0;display:flex;flex-direction:column;width:auto}
  .pbox .imgw{flex:1;min-height:0;position:relative;background:#fff}
  .pbox .imgw img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain}
  .pbox .imgw .noproof{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .pbox .noproof{display:flex;align-items:center;justify-content:center;flex:1}
  .pbox .attach{flex:none}
  .drail{overflow:auto;min-height:0;padding-right:4px;scrollbar-width:thin}
  .drail .nt-grid{grid-template-columns:1fr}
  .drail .cm{max-height:min(46vh,420px)}
  .drail .p-off-imp{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"id main" "act act" "note note"}
  .drail .p-off-imp-act{justify-content:flex-start}
  .proofs.multi .pf{width:auto}
}
/* v25: Art brief (Art to do tab only) */
.abrief{padding:12px 16px}
.abrief h3{margin-bottom:10px}
.ab-g{font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.ab-g .sz2{color:var(--p-ink-2);font-size:14px}
/* v30: garment → vendor page */
.ab-gl{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.ab-gl a.gv{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}

/* full-screen mockup */
.rvv{position:fixed;inset:0;z-index:120;background:rgba(20,20,18,.94);display:flex;flex-direction:column}
.rvvbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--p-black);color:#fff;flex-wrap:wrap}
.rvvbar b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.rvvbar span{font-size:14px;color:rgba(255,255,255,.8)}
.rvvbar .sp{flex:1}
.rvvbar .p-btn{min-height:40px;font-size:15px;padding:0 14px;background:#fff;color:var(--p-black);border-color:#fff;text-decoration:none}
.rvvst{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:zoom-in;touch-action:none}
.rvvst.zoomed{cursor:grab}
.rvvst img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;user-select:none;background:#fff}
@media (min-width:1200px){
  .det.p-off-pane.rv{display:block;overflow-y:auto}
  .rvgrid{grid-template-columns:minmax(0,3fr) minmax(360px,2fr);min-height:420px}
  .rvL .rvbody{flex:1;flex-direction:row}
  .rvL .rvimg{flex:1;min-height:0;min-width:0}
  .rvL .pthumbs{flex-direction:column;margin-top:0;overflow-y:auto;overflow-x:hidden;width:84px}
  .rvL h3{margin-bottom:8px}
  .rvR{overflow:auto;padding-right:4px;scrollbar-width:thin}
  .rvR>*{flex:none}
  .rvR .panel.box:last-child{flex:1 0 auto}   /* v39: was flex:1 0 200px + min-height:240px, which squashed the list and pushed the composer out */
  .rvR .cm{flex:1 0 auto}
  .rvdb{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
  .rvdb .nt-grid{grid-template-columns:1fr}
}
@media (min-width:1200px) and (max-height:760px){ .det .p-off-oh{padding:8px 12px} .lnav{margin-top:6px} .sbar{margin-top:6px} .dgrid{margin-top:8px} }
/* v36: on a phone (700px and under) "Who are you?" moves into ⚙ (placeMe), so the bar is two rows with nothing cut off.
   Until someone is picked, ⚙ wears the same yellow ring the picker had. The desktop bar is unchanged. */
.lir-me-row{display:none}
@media (max-width:700px){
  .lir-me-row{display:grid}
  .p-menu .p-off-me{max-width:none;width:100%;background:var(--p-white);color:var(--p-black);border-color:var(--p-black)}
  .p-off-bar:has(#me.is-need) #gearBtn{border-color:var(--p-yellow);box-shadow:0 0 0 2px var(--p-yellow)}
  .p-off-bar #prac{order:10}                     /* practice pill rides on the steps row (row 1 has no room for it) */
  .p-off-bar .p-off-steps{flex:1 1 calc(100% - 120px);min-width:0}
}
/* v44: an imprint's buttons (Master design / No master folder yet · Last time · Edit) took the row's width and left its
   description one letter wide (Stephen: "some weird spacing on line item review details"). The buttons may take half the
   row at most; in a narrow panel they go under the description. */
.panel.box{container-type:inline-size}
.p-off-imp-act{max-width:50cqw}
@container (max-width:620px){ .p-off-imp{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"id main" ". act" ". note"} .p-off-imp-act{justify-content:flex-start;max-width:none} }
/* v46: What's changing? panel + the Changes requested bar */
.rvR .box h3{flex-wrap:wrap;row-gap:6px}   /* v45's tag + Mark resolved ran 110px off a 390px phone */
.rv-chgbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 10px;padding:10px 12px;border:2px solid var(--p-black);border-radius:8px;background:var(--p-cream-lt)}
.rv-chgbar .q{flex:1 1 100%;order:-1;min-width:0;font-size:14px;color:var(--p-ink-2)}
.rv-chgbar .rv-chg{order:-3}
.rv-chgbar #rvChgOk{order:-2;margin-left:auto;min-height:36px}
.box h3 .mmfix{text-transform:none;letter-spacing:0;word-spacing:0;font:700 14px var(--sans);flex:none}
.rvL h3,.pbox h3{flex-wrap:wrap;row-gap:6px}
.rv-chgbar .q b{color:var(--p-black)}
.rv-chgbar .p-btn{min-height:40px}
.chgm{width:min(820px,100%)}
.p-modal.chgm{max-height:90vh;display:flex;flex-direction:column;overflow:hidden}   /* v51: header + buttons stay, the middle scrolls */
.chgm .p-modal-h,.chgm .p-modal-f{flex:none}
.chgm .p-modal-b{flex:1 1 auto;min-height:0;overflow:auto}
@media (max-width:700px){ .h3b,.p-off-imp-act .lk,.box h3 .lk{min-height:40px;display:inline-flex;align-items:center} }   /* v51: tap size on a phone */
.chgm .chg-sec{margin-top:16px}
.chgm .chg-sec>.p-label{display:block;margin-bottom:8px}
.chg-req{font-size:14px;padding:10px 12px;border-left:4px solid var(--p-black);background:var(--p-cream-lt);border-radius:4px;margin-bottom:12px}
.chg-req .k{font-weight:700;margin-right:6px}
.chg-rule{font-size:14px;margin:0}
.chg-imps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.chg-kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chg-opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px solid var(--line2);border-radius:8px;background:#fff;padding:12px 14px;min-height:60px;cursor:pointer;font:inherit;font-size:15px;color:var(--p-black)}
.chg-opt:hover{border-color:var(--p-black)}
.chg-opt.is-on{border-color:var(--p-black);background:var(--p-cream);box-shadow:inset 0 0 0 1px var(--p-black)}
.chg-opt small{font-size:13px;color:var(--p-ink-2)}
.chg-opt .p-id{font-size:15px}
.chg-scope{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chgm .p-field{margin-top:12px;font-size:14px;font-weight:700}
.chgm .p-field textarea{min-height:64px;resize:vertical}
.chgm .p-note{margin-top:14px;font-size:14px}
.chgm .chg-copy{margin-top:10px;font-size:13px}
.chgm .p-modal-f{align-items:center}
.chgm .p-modal-f .chg-sum{flex:1 1 260px;font-size:13px;color:var(--p-ink-2)}
@media (max-width:700px){ .chg-kinds,.chg-scope{grid-template-columns:1fr} }
</style>

<body class="p-app p-off">
<header class="p-bar p-off-bar" data-pin>
  <span class="p-mark"><span class="p-logo" aria-hidden="true"></span></span>
  <span class="p-bar-app">Line Item Review</span><span class="p-bar-ver" id="ver">v51</span>
  <span class="p-tag p-tag-wait" id="prac" hidden>Practice</span>
  <nav class="p-bar-views p-off-steps" id="flowNav" aria-label="Order steps"></nav>
  <div class="p-bar-sp">
    <select class="p-off-me" id="me" onchange="setMe(this.value)" aria-label="Who are you?"></select>
    <button class="p-barbtn" id="refreshBtn" type="button" onclick="if(window.PineUpdate)PineUpdate.check();load(true)" title="Reload from Airtable and check for a new version">&#8635; <span class="p-barbtn-word">Refresh</span></button>
    <button class="p-barbtn p-barbtn-icon" id="gearBtn" type="button" aria-label="Settings" aria-expanded="false" title="Settings" onclick="gear()">&#9881;</button>
  </div>
  <div class="p-menu" id="gearMenu" role="dialog" aria-label="Settings" hidden>
    <div class="p-menu-row lir-me-row" id="meRow"><span class="p-menu-label">Who are you?</span></div>
    <div class="p-menu-row"><span class="p-menu-label">Airtable token</span><span class="p-hint">The same one the other Pine apps use. Saved on this device only.</span>
      <div class="p-btns"><input class="p-input" id="tok" type="password" placeholder="pat…" autocomplete="off"><button class="p-btn p-btn-dark" type="button" onclick="saveTok()">Save</button></div></div>
    <div class="p-menu-row"><div class="p-menu-line"><span><b>Practice</b><br><span class="p-hint" id="pracHint"></span></span><button class="p-btn" id="pracBtn" type="button" onclick="togglePractice()"></button></div></div>
    <div class="p-menu-row" id="drvRow"><div class="p-menu-line"><b>Google Drive</b><button class="p-btn" id="drvChk" type="button" onclick="driveStatusLoad()">Check</button></div><span class="p-hint" id="drvStat">Not checked yet</span></div>
  </div>
</header>
<div class="p-filters" id="filters">
  <input class="p-input p-search" id="q" type="search" placeholder="Order #, customer, garment" aria-label="Search" oninput="S.q=this.value;renderList()" autocomplete="off">
  <div class="p-chips" id="tabs" role="tablist" aria-label="Which line items"></div>
  <div class="p-chips" id="reps" aria-label="Salesperson"></div>
</div>
<div class="app p-off-split" id="app">
  <aside class="p-off-pane p-off-list list" id="lbody"><div class="spin">Loading…</div></aside>
  <main class="p-off-pane det" id="det"></main>
</div>
<input type="file" id="shotFile" accept="image/*" multiple style="display:none" onchange="addShots(this.files);this.value=''">
<input type="file" id="file" accept="image/*,application/pdf" multiple style="display:none" onchange="uploadProofs(this.files)">
<input type="file" id="dupFile" multiple style="display:none" onchange="dupPicked(this.files)">
<script src="pine-confirm.js"></script>
<script src="pine-pantone-v1.js"></script>
<script>
/* Line Item Review v48 (Oct 29): Stephen's answers on v46.
   - "Should be the order as well": a new design also takes the old imprint off the ORDER (this order comes out of the old
     imprint's Linked Orders), but only when no line on the order still uses it ("this line only" while another line keeps
     it → it stays). Nothing else on the old imprint is written. Undo puts the order link back.
   - "Bigger print doesn't change the cost. Adding colors would but that is it, a new design is just a new design so it would
     need a new screen or thread count": Price approved stays, unless the number of colours changes (screen print: Screen
     Count, editable on the new-design form, or the number of colours in the Pantone list; embroidery: the thread colours).
     Then Price approved comes off the affected lines and the comment says "2 → 3 colours, price needs another look".
   - ?line= (Mockup Maker's "Review in Line Item Review") opens the tab the line is in (Review / Ready to send), not All. */
/* Line Item Review v46 (Oct 29): "What's changing?" for change requests, and Fix in Mockup Maker ↗.
   Stephen: "Really only color and placement can change and keep the imprint id everything else really is a new design";
   "changing the size of the artwork is a new imprint id"; "We can save the old imprint we just need it off the line item.
   That way no one sees that reference and only sees the new imprint with the new artwork... We don't need replaced by just
   need what matches the proof".
   - Opened from the Changes requested bar (Review) or "Change an imprint…" (Review mockup row, Imprints panel). In-page panel:
     pick the imprint, then Ink / thread colour · Placement (same ID) or Size, artwork or text (new design, new ID).
   - Colour: edit the imprint's Pantone / thread colours (Imprints › Pantone) in place. Placement: a note for art.
   - New design: a new Imprint copying the old one's location, type, nickname, notes, Pantone, ink notes, screens, ink
     changes, custom ink charges, stitch count, Supacolor size, thread name and (if the colours are unchanged) its Inks,
     linked to the order. The Imprint ID comes from Airtable's "Copy Imprint ID" automation (order # + next letter), read
     back afterwards. The old imprint is not edited or deleted; it only comes off the line(s) (this line / every line using it).
   - Every affected line goes back to art (Awaiting Review and Quality approved unticked), gets a signed comment
     ("[Stephen] New design: 11101-B → 11101-D (size change) — needs new proof, seps and screens") and its change request
     is marked resolved. Undo (7 s) puts it all back and deletes a just-made imprint. A signed PandaDoc shows a warning.
   - Practice: no writes, the toast says what would happen. */
/* Line Item Review v42 (Oct 21): upload into Drive from the Art brief. Stephen: "can we also have an upload feature in
   the app....just trying to really streamline stuff".
   - Every open folder panel (and the order folder's top level, next to the Folders chips) has ⬆ Upload (picker, several
     files) and takes dropped files ("Drop to upload to Seps"). Worker v28 POST drive/upload, 3 at a time, ≤25 MB each,
     a row per file (uploading… → ✓ name, or the error + Retry), then that folder is re-read and a toast says how many.
   - A proof's Drive copy goes into the order folder's Proofs subfolder (Proofs, Proof, For Proof) when there is one.
   - A drop on a Drive folder only uploads to Drive; the rest of the brief and the Proof box still attach the proof.
   - Practice fakes every upload (no POST). window.pineBusy is true while uploads run. "From last time" has no upload. */
/* Line Item Review v41 (Oct 21): ⬇ Download on every Drive file card and in the preview pop-up, straight from the app
   (worker v28 drive/file). Google Docs/Sheets/Slides keep Open in Drive. Stephen: "are we able to download straight
   from the app or does it open that link then download" → "let's get this updated". */
/* Line Item Review v40 (Oct 21): "From last time" rows start folded to one line (▸ From last time · 9044 · folder ↗);
   a click opens the files, and nothing is read from Drive until then. Stephen: "can we not show the past stuff right
   away....maybe have it a drop down or an option to open....when you see it all right away it can be a bit much". */
/* Line Item Review v39 (Oct 20): Drive in the Art brief, opened in place. Stephen: "Oh that would be great".
   - Folder chips open in place (files + their own subfolders, nested); click again to close; small ↗ opens it in Drive.
   - A file opens a preview pop-up: images and PDFs (all pages, pdf.js) through worker v28 GET drive/file?id=; other types
     show the type badge (and the thumbnail when Drive has one) + "Open in Drive ↗". Worker v27 → that fallback for all.
   - Client Provided (or Customer…) files found up to 2 subfolders deep, each labelled "Logos / deppen.pdf".
   - "From last time" rows: an imprint that repeats an earlier order (Repeat of 9044-B) → that order's Drive folder
     (search by order #, newest, "(+N more)"), its Client Provided and Seps files, previewable. At most 3. None → no row.
   - Folder reads are cached for the session and run at most 4 at a time; thumbnails load only when on screen; a late
     reply only redraws if the open job still shows that folder (DWANT). */
/* Line Item Review v38 (Oct 20): the art folder shows its subfolders only (no loose files), and opens the Client
   Provided (or Customer…) subfolder right in the brief with its files and thumbnails when it has any.
   Stephen: "Can we just keep the folders and remove the other things in the folder....also is it possible to grab the
   content in the customer provided if it has stuff in the folder".
   Line Item Review v37 (Oct 20): Art to do finds the order's Drive folder by order # (worker v26 GET drive/search).
   Stephen: "can we search the google drive and assign the matching folder sales creates to line item".
   - Order with no saved folder: one search per order per session. Exactly one folder with the number standing alone in
     its name → saved to the order's Artwork Folder Link (the same write as Save folder; practice fakes it) and a quiet
     "Linked Drive folder "…" (found by order #)". Several → a list with "Use this folder" (plain buttons). None → the
     paste box with "No Drive folder with 11029 in its name yet". Search failed / Drive off / old worker → paste box as v36.
   - A saved folder that can't be read shows the worker's own message (v26 codes: drive_signin_failed, folder_not_found,
     no_access, not_in_shared_drive, drive_error), plus "Find the folder by order #" for the folder problems.
   - ⚙ › Google Drive: the worker's drive/status ("Connected · <drive>" or what's wrong) so Stephen can check the setup.
   - Worker v25 (no status/search: 403 "Drive path not allowed") → exactly v36. */
/* Line Item Review v36 (Oct 20): top-bar cleanup for phones. At 390 wide the "Who are you?" picker pushed the bar to
   three rows (160px) and its text was cut off. At 700px and under it now sits at the top of the ⚙ menu (same select, so
   picking, signing and the "choose who you are" prompt all work as before; that prompt opens ⚙ on a phone), and ⚙ gets
   the yellow ring until someone is picked. The bar is two rows: Pine · app · version · Refresh · ⚙, then the order steps
   (and the Practice pill, which has no room on row 1).
   Desktop bar unchanged. */
/* Line Item Review v35 (Oct 20): non-garments (patches, labels, stickers, pins, promo, flatstock…) skip the garment
   lookup: no vendor link, no "Missing: garment", and a Patch/Label ONLY imprint doesn't need a print location.
   Stephen: "we can really exclude all non-garments from this vendor look up".
   Line Item Review v34 (Oct 20): the invoice opens in a pop-up. Ready to send is back to v32's layout (proof + comments in
   view); one line under the order header sums the invoice ("Invoice · 5 lines · $3,882.50 · Outstanding …  ✎ Edit invoice").
   Edit invoice (and Garment ✎ Edit qty / Pricing ✎ Edit price) open the v33 invoice editor in a wide pop-up, unchanged.
   ===================================================================== */
/* Line Item Review v33 (Oct 20): edit the invoice in Ready to send, with safeguards. Stephen: "can it have a warning and how
   could we edit the invoice in the ready to send section?" ... "reps will edit the invoice....and it really doesn't happen
   much...but I think just having that ability with safe guards could be helpful. I think showing who edited would be
   perfect. 1. Yes unlink the line from the order.... 2. ...it can change the price after approved...but maybe a warning if
   it causes us to lose money....vs if we still have good margins then the sales manager really doesn't have any reason to
   double check".
   - Invoice panel (Ready to send only): the same rows the PDF invoice uses (invRows), qty/sizes + price/pc editable per
     row (same PATCHes as Review), order Discount % (Orders › Discount %, a plain number field), Remove from order (unlinks
     the line from the order's Line Items; re-reads the order first; Undo re-links).
   - Every edit posts a signed comment on the line ("[Patrick] Invoice edit: qty 24 → 36 …"); rows show "Edited by".
   - Thin margin (< 5%) or losing money: asks first, and the save also unticks Price approved (back to Review).
   - Send for signature preview: a red note when every proof page of a line is removed but the line is still invoiced;
     an open preview is rebuilt after any invoice edit.
   ===================================================================== */
/* Line Item Review v32 (Oct 20): Review tab shows approvals quietly and points at what's left. Stephen: "should it show
   what is approved...or does that not make sense on this page"; "sometimes other people approve....but those managers are
   the usual people" (so the manager names are hints only; anyone can click).
   - Review list tags: Needs quality / Needs price / Needs quality + price. Chips "Needs quality (n)" / "Needs price (n)".
   - Detail: no status line. Done approvals become "✓ Quality approved · undo" / "✓ Price approved · undo" in place.
     Changes requested sits next to the Comments title. Same PATCHes as v31.
   ===================================================================== */
/* Line Item Review v31 (Oct 20): the Review tab puts the mockup, the price and the comments first. Stephen: "I still feel
   like at this point the mockup and comments and pricing might be more important...let's walk through ways to get those
   bigger". Production manager approves quality, sales manager approves pricing; changes go through comments; qty and
   prices are edited on this page; Ready to send stays as it is. Review tab only:
   - One-line order header (# · customer · rep · ASAP/Hard · due · lines · subtotal · Art folder ↗ · Airtable ↗) with a
     small Send for signature at the right. No step bar, Next, line strip, Archive, proof timer or Pipedrive note.
   - Left: the mockup fills the column (click = full screen with zoom), file thumbnails, "✓ Quality OK — production
     manager" (the same PATCH as the Quality approved step). Right: "Quality ✓ · Price —", the Price card (qty + sizes
     and $/pc edited in place through the existing Save qty / Save price code, live line total, Autoprice, Quoted,
     margin red when thin), "✓ Price OK — sales manager" (same PATCH as the Pricing approved step), then comments.
   - "Details ▸ 2 imprints · garment · sizes · notes" opens the Imprints / Garment / Notes panels.
   - Review list: "Changes requested" when the newest comment is newer than Proof Images Timestamp (read-only).
   ===================================================================== */
/* Line Item Review v30 (Oct 20): the garment in the Art brief opens the vendor's page. Stephen: "what if the garment in Art
   To Do actually sent you to the vendor link....so S&S for most things...Sanmar for when it is only at Sanmar and ASColour as
   well". "on Gildan 2000 · Black" is a link (new tab) with a small "S&S ↗" / "SanMar ↗" / "AS Colour ↗" after it:
   AS Colour brand → AS Colour; else S&S when S&S carries the style; else SanMar when only SanMar has it; anything unknown or
   a failed lookup → S&S search. Read-only lookups via the worker, cached per style; the brief never waits on them.
   ===================================================================== */
/* Line Item Review v29 (Oct 20): add the art folder right in the brief. Stephen (screenshot of "No art folder yet — ask
   Patrick"): "it would be great to also be able to upload in this section as well". When an order has no folder link, the
   brief shows a box to paste the Drive folder link + Save, which writes the order's Artwork Folder Link (the same Airtable
   field Create order saves; practice fakes it). A folder that's already set has a small "Change link". Only Google Drive
   folder links are accepted.
   ===================================================================== */
/* Line Item Review v28 (Oct 20): art folder first + Drive. Stephen: "sales creates the folder > puts in the customer artwork >
   art dept goes to that folder grabs it > makes the mockup > attaches it to Airtable and uploads it to google" and "Remove
   the copy buttons". Art to do tab only:
   - Big black "Open art folder ↗" at the top of the brief (red "No art folder yet — ask <rep>" when there isn't one);
     the Art folder link is no longer repeated in the one-line header.
   - "In the folder (N)": the folder's files (thumbnail or type, name, date, newest first) and subfolders, via the worker.
   - Attaching a proof (button or drop) saves it to Airtable and copies it into the folder; Drive failure = Retry (Drive only).
   - The imprint-ID Copy buttons and Copy file name are gone.
   ===================================================================== */
/* Line Item Review v27 (Oct 20): drag & drop the proof. Stephen: "can we drag and drop the PDF as well". Drop a PDF or image
   on the Art brief or the Proof box and it uploads as the line's proof (same upload as Attach proof; practice fakes it).
   The box outlines while a file is over it. Dropping on the comment box still adds a comment screenshot. A file dropped
   anywhere else on the page no longer makes the browser open it (and leave the app).
   ===================================================================== */
/* Line Item Review v26 (Oct 20): Art to do, decluttered. Stephen: "still feels cluttered ... pricing doesn't really get
   checked until review" and "proof uploaded and awaiting review are the same thing ... once that is clicked it slacks sales
   and production manager to approve quality and price". Art to do tab only (every other tab is exactly v25):
   - Order header is one line: # · customer · rep · ASAP/Hard · due · Art folder ↗ · Customer art ↗ · Airtable ↗.
     No lines/pcs/subtotal, Send for signature, proof timer, "No art folder saved", Archive order.
   - No 4-step approval bar, no Next, no line chooser strip (the left list has every line).
   - One yellow button at the end of the brief: "Proof done → send to Review". Same write as the Awaiting review step
     (Awaiting Review checkbox = true; the Airtable automation Slacks sales + production). Disabled until a proof is
     attached. Then the line leaves Art to do and the next one opens; the toast has Undo.
   - Notes with the same text show once ("Proofing notes · Sales notes"); blank lines trimmed.
   - No "Missing: ink colours" tag (Stephen: "drop it"). Red stays for no imprint, no location, no garment.
   - Comments: the @notify chips show once you click into the comment box.
   ===================================================================== */
/* Line Item Review v25 (Oct 20): Art brief in the Art to do tab. Stephen: "they need imprint id and actually the garment
   which right now you have to go to the right and scroll down" ... "that would be only for Art To Do".
   - Art to do only: at the top of the line, one block per imprint (big imprint ID + Copy, location · print type · size from
     the print notes · ink colours, New art / Repeat of X with last proof, seps, master design, print + ink notes), the
     garment once (style · colour swatch · pcs and sizes), proofing + sales notes. Due date, Art folder and Customer art
     stay in the order header right above (said once).
     Red "Missing: …" only for real gaps (no imprint, no location, no ink colours, no garment).
   - Attach proof sits right under the brief, beside "Copy file name" (11040 | 2000-BK, V2/V3 … once a proof is attached).
     On a short screen with a long brief, that row stays pinned at the bottom of the column so it's always in reach.
   - Art to do list cards show the imprint ID(s) and the garment style + colour.
   - Other tabs, comments, the right column and sending are unchanged. Read-only: no new Airtable writes.
   ===================================================================== */
/* Line Item Review v24 (Oct 19): new jobs no longer vanish into Sent. Pipedrive's "Order Confirmed" (stage 23) is the stage
   that CREATES the Airtable order -- it comes before Awaiting Approval -- but v21-v23 counted it as "sent". Every new order
   showed for a second, then the Pipedrive check moved it to Sent (Stephen: "had for one sec ... and then they all went to 0").
   Now only Awaiting Approval (with the Send to client tick or the proof email), Awaiting Payment, Ready for Production,

async function at(path,opt){
  if(!TOKEN){ gearShow(true); throw new Error('no token'); }
  const r=await fetch(path.startsWith('http')?path:`https://api.airtable.com/v0/${BASE}/${path}`,Object.assign({},opt||{},{headers:Object.assign({Authorization:'Bearer '+TOKEN},(opt&&opt.body)?{'Content-Type':'application/json'}:{})}));
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error((j.error&&(j.error.message||j.error.type))||('Airtable '+r.status)); }
  return r.json();
}
async function atAll(table,params,max){ let out=[],off=''; do{ const d=await at(`${table}?returnFieldsByFieldId=true&${params}${off?'&offset='+off:''}`); out=out.concat(d.records||[]); off=d.offset||''; }while(off&&out.length<(max||1000)); return out; }
async function byIds(table,ids,fields){ const out=[]; ids=[...new Set(ids)].filter(Boolean);

    out.push(...await atAll(table,`pageSize=100&${flds(fields)}&filterByFormula=${encodeURIComponent(f)}`)); }

async function loadSent(){
  let cache={}; try{ cache=JSON.parse(localStorage.getItem(SENT_KEY)||'{}')||{}; }catch(e){}
  const now=Date.now(), apply=()=>S.orders.forEach(o=>{ const c=cache[o.num]; o.sent=c&&c.sent?c:null; o.pdWait=c&&c.noMail?c:null; });
  apply(); renderList();
  const todo=S.orders.filter(o=>o.num&&!(cache[o.num]&&now-cache[o.num].at<SENT_TTL)).map(o=>o.num);
  if(!todo.length) return; S.sentBusy=true;
  const one=async num=>{ try{ const r=await fetch(PROXY_BASE+'/pipedrive/deal?order='+encodeURIComponent(num),{headers:{Authorization:'Bearer '+TOKEN}});
      const j=await r.json(); if(!j||!j.ok) return; const d=j.deal;
      const name=d&&(PD_SENT[d.stage]||(d.status==='won'?'Won':''));
      // v22: Awaiting Approval alone isn't enough (mockups can go out first): the proof email has to be there too
      const mailed=(j.messages||[]).some(m=>PROOF_MAIL.test(m.subject||'')||PROOF_MAIL.test(m.snippet||''));
      // v23 (worker v24): the deal's "Send to client" task. undefined = older worker -> v22 rule; null = no such task.
      const stc=d?d.sendToClient:undefined, ticked=!!(stc&&stc.done);
      const sent=!!name&&(d.stage!==4||d.status==='won'||mailed||ticked);
      cache[num]={at:Date.now(),sent,mailed,ticked,tickedAt:ticked?(stc.doneAt||''):'',hasTask:stc!==undefined,stage:name||'',url:d&&d.url||'',noMail:!!name&&!sent}; }catch(e){} };
  for(let i=0;i<todo.length;i+=4){ await Promise.all(todo.slice(i,i+4).map(one)); }
  try{ localStorage.setItem(SENT_KEY,JSON.stringify(cache)); }catch(e){}

/* File preview pop-up: images and PDFs from worker v28 GET drive/file?id= (Esc, ✕ or a click outside closes it).
   Other types, a worker without drive/file (v27: 403 "Drive path not allowed") or any error → badge + "Open in Drive ↗". */
/* v41: download straight from the app (worker v28 GET drive/file?id=). Stephen: "are we able to download straight from
   the app". Google Docs/Sheets/Slides have no file to download, so they keep Open in Drive. Old worker → opens Drive. */
const DLBUSY=new Set();
const canDownload=f=>!/^application\/vnd\.google-apps\./.test(String(f&&f.mimeType||''));
async function fileBlob(id){ let b=FBLOB.get(id); if(b) return b;
  const r=await fetch(`${PROXY_BASE}/drive/file?id=${encodeURIComponent(id)}`,{headers:{Authorization:'Bearer '+TOKEN}});
  if(!r.ok){ const j=await r.json().catch(()=>null); if(j&&j.error==='Drive path not allowed'){ S.fileVer='old'; const e=new Error('old'); e.old=true; throw e; } throw new Error(j&&j.error?String(j.error):'Drive '+r.status); }

async function fileDownload(id){ const f=DRV_F[id]; if(!f||DLBUSY.has(id)) return;
  if(!canDownload(f)||S.fileVer==='old'){ window.open(fileDriveUrl(f),'_blank','noopener'); return; }
  DLBUSY.add(id); dlRedraw(id);
  try{ const b=await fileBlob(id), u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=f.name||'file'; a.style.display='none'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),30000);
    toast('Downloaded '+(f.name||'the file')); }
  catch(e){ if(e.old) window.open(fileDriveUrl(f),'_blank','noopener'); else toast('Download didn’t work: '+e.message+' · use Open in Drive',true); }
  finally{ DLBUSY.delete(id); dlRedraw(id); } }
let FPV=null, FPVN=0; const FBLOB=new Map();   // FBLOB: last 10 downloaded files (id → Blob), for reopening
const fileKind=f=>{ const t=String(f.mimeType||'').toLowerCase(), n=String(f.name||'').toLowerCase();
  if(t==='application/pdf'||/\.pdf$/.test(n)) return 'pdf';
  if(/^image\/(png|jpe?g|gif|webp|svg\+xml|bmp)$/.test(t)||/\.(png|jpe?g|gif|webp|svg|bmp)$/.test(n)) return 'img'; return 'other'; };
const fileDriveUrl=f=>f.webViewLink||'https://drive.google.com/file/d/'+f.id+'/view';
async function filePreview(id,path){ const f=DRV_F[id]; if(!f) return; const kind=fileKind(f), tok=++FPVN;
  FPV={id,f,path:path||'',kind,tok,st:kind==='other'||S.fileVer==='old'?'other':'loading',msg:'',from:document.activeElement}; renderFpv();
  if(FPV.st==='other'){ if(f.thumb) driveThumb(f); return; }
  try{ let b; try{ b=await fileBlob(id); }catch(e){ throw new Error(e.old?'':e.message||'The preview didn’t load'); }
    if(!FPV||FPV.tok!==tok) return;   // closed, or another file opened meanwhile
    if(kind==='img'){ FPV.url=URL.createObjectURL(b); FPV.st='img'; renderFpv(); return; }
    if(!window.pdfjsLib){ await loadScript(LIB.pdfjs); pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfjsWorker; }
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(await b.arrayBuffer()),isEvalSupported:false}).promise;
    if(!FPV||FPV.tok!==tok) return; FPV.st='pdf'; FPV.pages=doc.numPages; renderFpv();
    const box=$('fpvB'), w=Math.min(1040,(box?box.clientWidth:900)-24), MAXP=20;
    for(let i=1;i<=Math.min(doc.numPages,MAXP);i++){ const pg=await doc.getPage(i); if(!FPV||FPV.tok!==tok) return;
      const v1=pg.getViewport({scale:1}), sc=Math.max(.5,w/v1.width), vp=pg.getViewport({scale:sc*(window.devicePixelRatio>1?1.5:1)});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.style.width=Math.round(vp.width/(window.devicePixelRatio>1?1.5:1))+'px'; c.setAttribute('aria-label','Page '+i);
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; if(!FPV||FPV.tok!==tok) return; const bx=$('fpvB'); if(bx) bx.appendChild(c); }
    if(doc.numPages>MAXP){ const bx=$('fpvB'); if(bx) bx.insertAdjacentHTML('beforeend',`<div class="fpv-msg">First ${MAXP} of ${doc.numPages} pages · open it in Drive for the rest</div>`); }

  else b.innerHTML=`<div class="fpv-other">${DRV_TH[f.id]?`<img src="${esc(DRV_TH[f.id])}" alt="">`:`<div class="badge">${esc(fileBadge(f))}</div>`}<div>${FPV.kind==='other'?'No preview for '+esc(fileBadge(f))+' files here · open it in Drive':esc(FPV.msg||'No preview here yet · open it in Drive')}</div></div>`; }

/* ---------- v37: find the order's folder by order # (worker v26 GET /proxy/drive/search?order=), ⚙ › Google Drive ----------
   DSRCH[order id] = {st:'loading'|'done'|'off', folders, err, find}. find = started from "Find the folder by order #"
   (always lets you pick, never saves on its own). Worker v25 answers 403 "Drive path not allowed" → 'off' = v36. */
const DSRCH={}, FINDABLE=['not_in_shared_drive','folder_not_found','no_access'], V26_CODES=['drive_signin_failed','no_access','drive_error'];
const orderNo=o=>{ const v=String(o&&o.num!=null?o.num:'').trim(); return /^\d{3,7}$/.test(v)?v:''; };
const folderLink=f=>f.webViewLink&&isDriveFolder(f.webViewLink)?f.webViewLink:'https://drive.google.com/drive/folders/'+f.id;
function orderRedraw(o){ const Ln=S.lines[S.sel]; if(S.tab!=='art'||!Ln) return; const lo=lineOrder(Ln._id); if(lo&&lo.id===o.id) keepTyping(renderDet); }
async function writeFolder(o,v){   // the one Airtable write for the folder link (Save folder, auto-link, Use this folder)
  if(!PRACTICE) await at(`${T_ORD}/${o.id}`,{method:'PATCH',body:JSON.stringify({fields:{[O.artLink]:v}})});
  o.artLink=v; if(PRACTICE) S.foldLocal[o.id]=v; }
async function driveSearch(o,find){ const n=orderNo(o); if(!n){ DSRCH[o.id]={st:'off',find}; return; }
  DSRCH[o.id]={st:'loading',find}; if(find) orderRedraw(o);
  let d;
  try{ const r=await fetch(`${PROXY_BASE}/drive/search?order=${n}`,{headers:{Authorization:'Bearer '+TOKEN}}); const j=await r.json().catch(()=>null);
    if(r.ok&&j&&j.ok&&Array.isArray(j.folders)) d={st:'done',folders:j.folders.filter(f=>f&&f.id).slice(0,10)};
    else { if(j&&j.error==='Drive path not allowed') S.drvVer='old'; d={st:'off',err:j&&j.code&&j.error?String(j.error):''}; } }
  catch(e){ d={st:'off'}; }
  d.find=find; DSRCH[o.id]=d;
  if(d.st==='done'&&!find&&d.folders.length===1&&!o.artLink&&!S.busy.fold) return linkFolder(o,d.folders[0],true);
  orderRedraw(o); }
function findFolder(oid){ const o=S.orders.find(x=>x.id===oid); if(o&&!(DSRCH[oid]&&DSRCH[oid].st==='loading')) driveSearch(o,true); }
function pickFolder(oid,k){ const o=S.orders.find(x=>x.id===oid), d=DSRCH[oid], f=d&&d.folders&&d.folders[k]; if(o&&f) linkFolder(o,f,false); }
async function linkFolder(o,f,auto){ if(S.busy.fold) return; const v=folderLink(f);

  try{ await writeFolder(o,v); S.foundBy[o.id]={name:f.name,link:v}; S.foldEdit=null; S.foldErr=''; S.foldDraft=''; const d=DSRCH[o.id]; if(d){ d.find=false; d.err=''; }
    if(!auto) toast(PRACTICE?'Practice: folder linked (not really)':'Art folder linked on order '+(o.num||'')); }
  catch(e){ DSRCH[o.id]={st:'done',folders:[f],find:!!(DSRCH[o.id]&&DSRCH[o.id].find),err:'Didn’t save: '+e.message}; toast('Folder link didn’t save: '+e.message,true); }
  finally{ S.busy.fold=false; orderRedraw(o); } }
function pickHtml(o,d){ const n=orderNo(o), k=d.folders.length, b=S.busy.fold;
  return `<div class="ab-pick" id="abPick"><div class="ab-pickh">${k===1?'One Drive folder has':k+' Drive folders have'} ${esc(n)} in the name. Use the one for this order:</div>
    ${d.folders.map((f,i)=>`<div class="ab-pf"><a href="${esc(folderLink(f))}" target="_blank" rel="noopener" title="Open in Drive">${esc(f.name)}</a><span class="when">${esc(fileWhen(f.modifiedTime))}</span><button class="btn" type="button" onclick="pickFolder('${o.id}',${i})" ${b?'disabled':''}>Use this folder</button></div>`).join('')}
    ${d.err?`<div class="ab-bad">${esc(d.err)}</div>`:''}</div>`; }
function findHtml(o){ const d=DSRCH[o.id], n=orderNo(o);
  if(!d||!d.find) return `<button class="ab-chg" type="button" id="findBtn" onclick="findFolder('${o.id}')">Find the folder by order #</button>`;
  if(d.st==='loading') return `<div class="ab-dhint">Looking in Drive for a folder named ${esc(n)}…</div>`;
  if(d.st==='done'&&d.folders.length) return pickHtml(o,d);
  return `<div class="ab-dhint">${d.st==='done'?`No Drive folder with ${esc(n)} in its name yet`:esc(d.err||'Drive search didn’t work')}</div><button class="ab-chg" type="button" id="findBtn" onclick="findFolder('${o.id}')">Search again</button>`; }
// ⚙ › Google Drive: worker GET /proxy/drive/status. S.drvVer: 'new' (v26+), 'old' (v25: no status route), undefined (unknown)
async function driveStatusLoad(){ if(!TOKEN||S.dstBusy) return; S.dstBusy=true; S.dstAt=Date.now(); const was=S.drvVer; renderDst();
  let t='', acct='', bad=false;
  try{ const r=await fetch(`${PROXY_BASE}/drive/status`,{headers:{Authorization:'Bearer '+TOKEN}}); const j=await r.json().catch(()=>null);
    if(r.ok&&j&&j.ok){ S.drvVer='new'; t='Connected · '+((j.drive&&j.drive.name)||'shared drive'); acct=j.account||''; }
    else if(j&&j.code==='drive_not_connected'){ t='Not connected on the worker yet'; }
    else if(j&&j.code){ S.drvVer='new'; t=String(j.error||j.code); acct=j.account||''; bad=true; }
    else if(j&&j.error==='Drive path not allowed'){ S.drvVer='old'; t='The worker is older than v26, so it can’t check Drive'; }
    else if(r.status===401){ t='Save the Airtable token first'; bad=true; }
    else { t='Can’t check (the worker answered '+r.status+')'; bad=true; } }
  catch(e){ t='Can’t reach the worker'; bad=true; }
  S.dst={t,acct,bad}; S.dstBusy=false; renderDst();
  if(S.drvVer!==was){ const Ln=S.lines[S.sel]; if(S.tab==='art'&&Ln) keepTyping(renderDet); } }
function renderDst(){ const el=$('drvStat'), b=$('drvChk'); if(!el) return; const d=S.dst;
  el.textContent=S.dstBusy?'Checking…':d?d.t+(d.acct?' · as '+d.acct:''):'Not checked yet'; el.classList.toggle('drv-bad',!S.dstBusy&&!!(d&&d.bad));
  if(b){ b.disabled=!!S.dstBusy; b.textContent=d?'Check again':'Check'; } }
// proof → Drive copy. S.dsave[line id] = [{f (kept for Retry), name, st:'busy'|'ok'|'fail', err}]
// v42: into the order folder's Proofs subfolder when there is one (else the top level, as before)
function proofFolder(o){ const url=artOf(o), d=url&&DRV[url]; if(!d||!d.folder||!d.folder.id) return null;
  const rank=f=>{ const n=String(f.name||'').trim(); return n==='Proofs'?0:/^proofs$/i.test(n)?1:/^proof$/i.test(n)?2:/^for\s+proofs?$/i.test(n)?3:9; };
  const p=dSubs(d.files||[]).filter(f=>rank(f)<9).sort((a,b)=>rank(a)-rank(b))[0];
  return p?{id:p.id,url:folderLink(p),name:p.name,where:'Drive › '+p.name}:{id:d.folder.id,url,name:d.folder.name||'',where:'the Drive folder'}; }
function driveQueue(id,f,d){ const pf=proofFolder(lineOrder(id))||{id:d.folder.id,url:artOf(lineOrder(id)),where:'the Drive folder'};
  (S.dsave[id]=S.dsave[id]||[]).push({f,name:f.name,st:'busy',url:pf.url,folderId:pf.id,where:pf.where}); driveSend(id,S.dsave[id].length-1); }
async function driveSend(id,k){ const s=(S.dsave[id]||[])[k]; if(!s) return; s.st='busy'; s.err=''; S.busy.drv=(S.busy.drv||0)+1; if(S.sel===id) keepTyping(renderDet);
  try{ if(!PRACTICE){
      const r=await fetch(`${PROXY_BASE}/drive/upload?folder=${encodeURIComponent(s.folderId)}&name=${encodeURIComponent(s.name)}`,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':s.f.type||'application/octet-stream'},body:s.f});
      const j=await r.json().catch(()=>null); if(!r.ok||!j||!j.ok) throw new Error((j&&j.error)||('Drive '+r.status));
      s.link=j.file&&j.file.webViewLink; await tidyProofs(s,j.file&&j.file.id); }
    s.st='ok'; }
  catch(e){ s.st='fail'; s.err=e.message; }
  S.busy.drv--; if(s.st==='ok'&&!PRACTICE) driveLoad(s.url,true); if(S.sel===id) keepTyping(renderDet);   // v42: the Proofs folder may not be on screen, so redraw here
  if(s.st==='fail') toast('Saved to Airtable, but the Drive copy of '+s.name+' failed — Retry is under the brief',true); }
// v50: older copies of this proof in the folder → its unused subfolder (Drive trash when there's none)
async function tidyProofs(s,newId){ try{ const H={headers:{Authorization:'Bearer '+TOKEN}}, post=u=>fetch(PROXY_BASE+u,{method:'POST',headers:{Authorization:'Bearer '+TOKEN}}).then(r=>r.json()).catch(()=>({}));
    const c=await fetch(`${PROXY_BASE}/drive/list?folder=${encodeURIComponent(s.folderId)}`,Object.assign({cache:'no-store'},H)).then(r=>r.json()).catch(()=>null), files=(c&&c.files)||[];
    const un=files.find(f=>/folder$/.test(f.mimeType||'')&&/^unused\b/i.test(String(f.name||'').trim()));
    // v51: proof-named files only ("11106 | 3604-NT-BK.pdf", "V2 11106 | …"), an older version, in a Proofs folder, moved (never trashed)
    const PR=/^(?:V(\d+)\s+)?(\d{3,6}\s*\|.+)$/i, mine=PR.exec(String(s.name||'').trim()); if(!mine||!un||!s.where||s.where==='the Drive folder') return;
    const ver=m=>+(m[1]||1), key=m=>m[2].trim().toLowerCase(), nv=ver(mine);
    const olds=files.filter(f=>{ if(f.id===newId||/folder$/.test(f.mimeType||'')) return false; const m=PR.exec(String(f.name||'').trim()); return !!m&&key(m)===key(mine)&&ver(m)<nv; }); let n=0;
    for(const f of olds){ const j=await post(`/drive/move?id=${encodeURIComponent(f.id)}&to=${encodeURIComponent(un.id)}`); if(j&&j.ok) n++; }
    if(n) s.tidy=`${n} older cop${n===1?'y':'ies'} moved to ${(s.where||'Proofs').replace(/^Drive › /,'')+' › '+un.name}`; }catch(e){} }
const dWhere=s=>s.where&&s.where!=='the Drive folder'?s.where:'Drive';   // v42: "Drive › Proofs"
function driveSavesHtml(id){ const l=S.dsave[id]; if(!l||!l.length) return '';
  return `<div class="ab-saves" id="abSaves">${l.map((s,k)=>`<div><b>${esc(s.name)}</b> · Saved to Airtable ✓ · ${s.st==='ok'?(s.link?`<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(dWhere(s))} ✓</a>`:esc(dWhere(s))+' ✓')+(PRACTICE?' (practice)':'')+(s.tidy?' · '+esc(s.tidy):''):s.st==='busy'?'Copying to '+esc(dWhere(s))+'…':`<span class="bad">Drive copy failed</span> — <button class="lk" type="button" onclick="driveSend('${id}',${k})">Retry</button>`}</div>`).join('')}</div>`; }

/* ---------- v42: upload into any open Drive folder (worker v28 POST drive/upload?folder=&name=, body = the file) ----------
   Stephen: "can we also have an upload feature in the app....just trying to really streamline stuff".
   S.dup[folder id] = rows [{name, f (kept for Retry), st:'busy'|'ok'|'fail'|'big'|'practice', err, link, fid, b (its batch)}]
   A batch = the files of one pick or drop; when its last file is done the folder is re-read and one toast says how it went.
   3 uploads at a time, 25 MB each (the worker's DRIVE_MAX_BYTES). Practice: no POST, rows say "practice, not uploaded". */
const DUP_MAX=25*1024*1024, UQ=mkQueue(3), DUPT={};   // DUPT[folder id] = {id, url, name}: the folders on screen

  const r=await fetch(`${WORKER}/file?url=${encodeURIComponent(url)}`,{headers:{Authorization:'Bearer '+TOKEN}});

function tagFill(page,font,box,tagBase){ // box in PDF units {x0,y0,x1,y1} y-up; field ≈ tag width × 3.25·fs

  while(font.widthOfTextAtSize(tagBase+'_}',fs)>W&&fs>3) fs-=0.1;
  let u='_'; while(font.widthOfTextAtSize(tagBase+u+'_}',fs)<=W) u+='_';
  const tag=tagBase+u+'}', w=font.widthOfTextAtSize(tag,fs);
  page.drawText(tag,{x:box.x0+(W-w)/2,y:box.y0+(H-3.25*fs)/2+0.47*fs,size:fs,font,color:PDFLib.rgb(1,1,1)});

async function approvedSpots(bytes){ // art's APPROVED stamp → the white box to its right, per page

    for(const it of tc.items){ if(String(it.str).trim()!=='APPROVED') continue;
      const t=it.transform, fs=Math.hypot(t[2],t[3])||it.height, x1=t[4]+it.width, b=t[5];
      // measured on art's template (10955): box = x1+0.79fs … x1+3.0fs, baseline−0.61fs … baseline+1.39fs; 2.5pt margin
      spot={x0:x1+0.79*fs+2.5,x1:x1+3.0*fs-2.5,y0:b-0.61*fs+2.5,y1:b+1.39*fs-2.5}; }

}

  return `<div class="invsum" id="invSum"><b>Invoice</b><span class="sep">·</span><span id="invSumN">${rows.length} line${rows.length===1?'':'s'}</span><span class="sep">·</span><span class="num" id="invSumT">${fmtMoney(sum)}</span><span class="sep">·</span><span>Outstanding <span class="num" id="invSumO">${fmtMoney(out)}</span></span>${who?`<span class="who" id="invSumWho">${esc(who)}</span>`:''}<button class="btn" type="button" id="invOpenBtn" onclick="invOpenFor('${o.id}')">✎ Edit invoice</button></div>`; }
function invOpenFor(oid){ S.invOpen=oid; renderInv(); const b=$('invMB'); if(b) b.scrollTop=0; const x=$('invClose'); if(x) x.focus(); }
function renderInv(){ let sc=$('invScrim'); const o=S.invOpen&&S.tab==='ready'?S.orders.find(x=>x.id===S.invOpen):null;
  if(!o||!orderLines(o).length){ if(S.invOpen){ S.inv=null; S.invDisc=null; } S.invOpen=null; if(sc) sc.remove(); return; }
  if(!sc){ sc=document.createElement('div'); sc.className='p-scrim'; sc.id='invScrim'; sc.onclick=e=>{ if(e.target===sc) invClose(); };
    sc.innerHTML=`<div class="p-modal invm" role="dialog" aria-modal="true" aria-labelledby="invMT"><div class="p-modal-h"><h2 class="p-h2" id="invMT"></h2><button class="p-modal-x" type="button" id="invClose" aria-label="Close" onclick="invClose()">✕</button></div><div class="p-modal-b" id="invMB"></div></div>`;
    document.body.appendChild(sc); }
  $('invMT').textContent=`Invoice · #${o.num||''} ${o.name||''}`.trim();
  const mb=$('invMB'), top=mb.scrollTop; mb.innerHTML=invHtml(o); mb.scrollTop=top; }
async function invClose(){ if(!S.invOpen) return; if(S.busy.inv) return toast('Saving… one moment',true);
  if(invDirty()&&!await PineConfirm.ask({title:'Discard changes?',body:'Your invoice edit is not saved yet.',ok:'Discard',cancel:'Keep editing'})) return;
  S.inv=null; S.invDisc=null; S.invOpen=null; renderDet(); const b=$('invOpenBtn'); if(b) b.focus(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.invOpen&&!document.querySelector('.sheet')){ e.preventDefault(); invClose(); } });

/* Send for signature: a line whose proof pages are all removed but which is still invoiced gets a red note */
function sendWarn(){ const e=$('sdWarn'); if(!e||!SEND||!SEND.kinds) return; const o=S.orders.find(x=>x.id===SEND.oid); if(!o) return;
  const ids=[...new Set((SEND.owners||[]).filter(Boolean))].filter(id=>o.lines.includes(id)&&S.lines[id]);
  e.innerHTML=ids.filter(id=>{ const pg=SEND.owners.map((x,i)=>x===id?i:-1).filter(i=>i>=0); return pg.length&&pg.every(i=>SEND.off.has(i)); })
    .map(id=>{ const Ln=S.lines[id]; return `<div class="warn sdw" data-line="${id}"><span><b>${esc(invName(Ln))}</b> is still on the invoice (${fmtMoney(num(Ln[L.total])||0)}). Remove it from the order too?</span><button class="btn" type="button" onclick="invRemove('${id}')" ${S.busy.inv?'disabled':''}>Take it off the order</button></div>`; }).join(''); }
// a stable name for each page, so pages removed before a rebuild stay removed after it
function pageKeys(){ const seen={}; return (SEND.kinds||[]).map((k,i)=>{ const b=(SEND.owners&&SEND.owners[i]||'')+'|'+k; seen[b]=(seen[b]||0)+1; return b+'#'+seen[b]; }); }
function rebuildSend(){ if(!SEND||SEND.busy) return; const ks=pageKeys(), keep=SEND.off?[...SEND.off].map(i=>ks[i]):[];
  if(SEND.url) URL.revokeObjectURL(SEND.url); Object.assign(SEND,{blob:null,url:null,kinds:null,owners:[],thumbEls:[],off:new Set(),checks:[],status:'Rebuilding with the new invoice…'});
  renderSend(); buildPreview(keep); }


/* Quote › Order › Review: the same step nav in all three apps (POM, Create order, Line Item Review).
   Carries the order number and ?practice=1 so you can step forward and back on one order. v19: Order opens the real Create order. */
const FLOW={quote:'price-o-matic.html',order:'create-order.html',review:'pine-line-item-review.html'};
function flowNav(cur,num){ const pr=/[?&]practice=1/.test(location.search), q=o=>{ const a=[]; if(o) a.push('order='+encodeURIComponent(o)); if(pr) a.push('practice=1'); return a.length?'?'+a.join('&'):''; };
  const st=[['quote','Quote',FLOW.quote+(pr?'?practice=1':'')],['order','Order'+(num?' <span class="p-off-ono">#'+esc(num)+'</span>':''),FLOW.order+q(num)],['review','Review',FLOW.review+q(num)]];
  return st.map(([k,l,h],i)=>(i?'<span class="p-off-sep" aria-hidden="true">›</span>':'')+(k===cur?`<b aria-current="step">${l}</b>`:`<a href="${h}" onclick="try{saveCartLS()}catch(e){}">${l}</a>`)).join(''); }
function syncFlow(){ const Ln=S.lines[S.sel], o=Ln&&lineOrder(Ln._id); $('flowNav').innerHTML=flowNav('review',o?o.num:''); }

if(ME_MQ.addEventListener) ME_MQ.addEventListener('change',placeMe); placeMe();
document.addEventListener('pointerdown',e=>{ const m=$('gearMenu'); if(m&&!m.hidden&&TOKEN&&!e.target.closest('#gearMenu,#gearBtn')) gearShow(false); });
function syncPractice(){ $('prac').hidden=!PRACTICE; $('pracHint').textContent=PRACTICE?'On: approvals, notes and sends are not saved.':'Off: changes save to Airtable.'; $('pracBtn').textContent=PRACTICE?'Turn off':'Turn on'; }
async function togglePractice(){ if(window.pineBusy&&pineBusy()&&!await PineConfirm.ask({title:'Leave what you are editing?',body:'Unsaved changes are lost.',ok:'Leave',cancel:'Stay'})) return; const u=new URL(location.href); if(PRACTICE) u.searchParams.delete('practice'); else u.searchParams.set('practice','1'); location.href=u.toString(); }
/* below 1200px it's one pane: the list, or the open line (the filter row hides while a line is open) */
function syncOpen(){ document.body.classList.toggle('det-open',$('app').classList.contains('det-open')); measure(); }
/* heights: --toph (bar), --p-off-top (bar + filter row: where the two panes start) */
function measure(){ const t=document.querySelector('[data-pin]'), f=$('filters'); if(!t) return; const r=document.documentElement.style;
  r.setProperty('--toph',t.offsetHeight+'px'); r.setProperty('--p-off-top',(t.offsetHeight+(f&&f.offsetParent?f.offsetHeight:0))+'px'); }
(function(){ measure(); window.addEventListener('resize',measure); window.addEventListener('load',measure); try{ const ro=new ResizeObserver(measure); ro.observe(document.querySelector('[data-pin]')); ro.observe($('filters')); }catch(e){} })();
document.documentElement.style.scrollPaddingTop='calc(var(--toph,64px) + 20px)';
