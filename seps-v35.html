  if (el) el.style.display = 'none';
}
function paintSepUrl(id) {
  var b = document.getElementById('sepbtns-' + id);
  if (b) b.innerHTML = sepBtnsHtml(id, state[id] ? state[id].sepsUrl : '');
  refreshHead(id);
}
function saveSepLink(id) {
  var input = document.getElementById('linkurl-' + id);
  if (!input || input.disabled) return;
  var url = input.value.trim();
  if (!url || url.indexOf('http') !== 0) { showToast('Paste the Drive link first (starts with https)', true); return; }
  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No Airtable token — add it in the ⚙ menu', true); return; }

  // v15 preview gate — pretend the save succeeded locally, update UI, skip Airtable
  if (!WRITES_ENABLED) {
    if (state[id]) state[id].sepsUrl = url;
    paintSepUrl(id);
    hideLinkInput(id);
    input.value = '';
    showToast('Preview — writes off');
    return;
  }

  input.disabled = true;
  fetch('https://api.airtable.com/v0/' + BASE + '/' + TBL, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ records: [{ id: id, fields: { [F.sepUrl]: url } }] })
  }).then(function(res) {
    return res.json().then(function(result) {
      if (!res.ok) throw new Error((result.error && result.error.message) || 'Airtable error ' + res.status);
      if (state[id]) state[id].sepsUrl = url;
      var recS = recById(id); if (recS) recS.sepsUrl = url; // v32
      paintSepUrl(id);
      hideLinkInput(id);
      input.value = '';
      showToast(savedMsg('✓ Sep file linked'));
    });
  }).catch(function(err) {
    showToast('Not saved — ' + err.message, true);
  }).finally(function() { input.disabled = false; });
}

// v35: notes save on leaving the box (was a listener added on every render). A failed save shows red and is
// retried on the next blur (v34 showed "saved" either way).
function notesBlur(id) {
  var ta = document.getElementById('notes-' + id);
  if (!ta || !state[id]) return;
  var val = ta.value;
  if (val === (state[id].pn || '')) return;
  var old = state[id].pn || '';
  state[id].pn = val;
  saveNotes(id, val, old);
}
function saveNotes(id, val, old) {
  var ta = document.getElementById('notes-' + id);
  if (ta) { ta.classList.remove('is-bad', 'saved'); ta.classList.add('saving'); }
  savePatch(id, F.printNotes, val).then(function(ok) {
    var t = document.getElementById('notes-' + id) || ta;
    if (t) t.classList.remove('saving');
    if (!ok) { if (state[id] && state[id].pn === val) state[id].pn = old || ''; if (t) t.classList.add('is-bad'); return; }
    if (t) { t.classList.add('saved'); setTimeout(function(){ t.classList.remove('saved'); }, 1500); }
  });
}

// v35: resolves to true when saved, false when not (no token, Airtable error, network).
function savePatch(id, fld, val) {
  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No Airtable token — add it in the ⚙ menu', true); return Promise.resolve(false); }

  // v15 preview gate
  if (!WRITES_ENABLED) {
    showToast('Preview — writes off');
    return Promise.resolve(true);
  }

  return fetch('https://api.airtable.com/v0/' + BASE + '/' + TBL, {
    method: 'PATCH',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
    body: JSON.stringify({ records: [{ id:id, fields:{ [fld]:val } }] })
  }).then(function(res) {
    if (res.ok) {
      var lbl = fld===F.seped   ? (val?"✓ Marked sep’d":"Sep’d undone")
              : fld===F.burned  ? (val?'✓ Marked burned':'Unmarked burned')
              : fld===F.separator ? (val?'✓ Assigned to '+val:'Separator cleared')
              : fld===F.coverage ? (val?'✓ Ink coverage: '+val:'Ink coverage cleared')
              : fld===F.supaCost ? (val==null ? 'Cost cleared' : '✓ Cost saved')
              : fld===F.printNotes ? '✓ Notes saved'
              : '✓ Saved';
      showToast(savedMsg(lbl));
      return true;
    }
    return res.json().catch(function() { return {}; }).then(function(e) {
      showToast('Not saved — ' + ((e && e.error && e.error.message) || 'Airtable error ' + res.status), true);
      return false;
    });
  }).catch(function() { showToast('Not saved — check the connection and try again', true); return false; });
}

// PDF modal state
var pmPdfDoc = null, pmPage = 1, pmTotal = 1;

function pmInit() {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

function pmClose() {
  document.getElementById('pmModal').classList.remove('open');
  pmPdfDoc = null;
  var canvas = document.getElementById('pmCanvas');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function pmPrev() {
  if (!pmPdfDoc || pmPage <= 1) return;
  pmPage--;
  pmRenderPage();
}

function pmNext() {
  if (!pmPdfDoc || pmPage >= pmTotal) return;
  pmPage++;
  pmRenderPage();
}

function pmRenderPage() {
  var ctEl = document.getElementById('pmCt');
  if (ctEl) ctEl.textContent = pmPage + '/' + pmTotal;
  pmPdfDoc.getPage(pmPage).then(function(page) {
    var body = document.getElementById('pmBody');
    var width = (body.clientWidth || 800) - 32;
    var scale = width / page.getViewport({ scale: 1 }).width;
    var vp = page.getViewport({ scale: scale });
    var canvas = document.getElementById('pmCanvas');
    canvas.width = vp.width;
    canvas.height = vp.height;
    canvas.style.cssText = 'max-width:100%;display:block';
    var spinner = document.getElementById('pmSpinner');
    if (spinner) spinner.style.display = 'none';
    page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
  });
}

function openProofModal(recId, imprintId) {
  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No API token', true); return; }

  var modal = document.getElementById('pmModal');
  var spinner = document.getElementById('pmSpinner');
  var canvas = document.getElementById('pmCanvas');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('pmFn').textContent = imprintId || '';
  document.getElementById('pmCt').textContent = '';
  document.getElementById('pmOpenLink').style.display = 'none';
  spinner.style.display = 'flex';
  modal.classList.add('open');
  pmPdfDoc = null; pmPage = 1; pmTotal = 1;

  // Fetch fresh signed URL — Airtable CDN URLs expire
  var url = 'https://api.airtable.com/v0/' + BASE + '/' + TBL +
    '?fields%5B%5D=' + F.proof +
    '&filterByFormula=' + encodeURIComponent("RECORD_ID()='" + recId + "'") +
    '&returnFieldsByFieldId=true&pageSize=1';

  fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var rec = data.records && data.records[0];
      var raw = rec && rec.fields && rec.fields[F.proof];
      var freshUrl = null, isPDF = false;

      // Handle both flat array and nested multipleLookupValues
      if (raw && raw.valuesByLinkedRecordId) {
        Object.values(raw.valuesByLinkedRecordId).forEach(function(arr) {
          if (Array.isArray(arr)) arr.forEach(function(a) {
            if (a && a.url && !freshUrl) { freshUrl = a.url; isPDF = a.type === 'application/pdf'; }
          });
        });
      } else if (Array.isArray(raw)) {
        raw.forEach(function(a) {
          if (a && a.url && !freshUrl) { freshUrl = a.url; isPDF = a.type === 'application/pdf'; }
        });
      }

      if (!freshUrl) {
        spinner.style.display = 'none';
        canvas.width = 400; canvas.height = 80;
        var c = canvas.getContext('2d');
        c.fillStyle = '#141412'; c.fillRect(0, 0, 400, 80);
        c.fillStyle = '#FFFFFF'; c.font = '700 16px Helvetica, Arial, sans-serif'; c.textAlign = 'center';
        c.fillText('No proof on file', 200, 45);
        return;
      }

      var link = document.getElementById('pmOpenLink');
      link.href = freshUrl;
      link.style.display = 'inline-flex';

      if (isPDF) {
        pmInit();
        pdfjsLib.getDocument(freshUrl).promise.then(function(doc) {
          pmPdfDoc = doc; pmPage = 1; pmTotal = doc.numPages;
          pmRenderPage();
        }).catch(function(err) {
          spinner.style.display = 'none';
          canvas.width = 500; canvas.height = 100;
          var c = canvas.getContext('2d');
          c.fillStyle = '#141412'; c.fillRect(0, 0, 500, 100);
          c.fillStyle = '#FFFFFF'; c.font = '700 16px Helvetica, Arial, sans-serif'; c.textAlign = 'center';
          c.fillText('PDF load error: ' + err.message, 250, 40);
          c.fillStyle = '#EFE2CD'; c.font = '14px Helvetica, Arial, sans-serif';
          c.fillText('Use the Open button above to view in browser', 250, 65);
        });
      } else {
        // Image proof
        var img = new Image();
        img.onload = function() {
          spinner.style.display = 'none';
          canvas.width = img.width; canvas.height = img.height;
          canvas.getContext('2d').drawImage(img, 0, 0);
          document.getElementById('pmCt').textContent = 'img';
        };
        img.onerror = function() { spinner.style.display = 'none'; };
        img.crossOrigin = 'anonymous';
        img.src = freshUrl;
      }
    })
    .catch(function(err) {
      spinner.style.display = 'none';
      showToast('Proof load failed: ' + err.message, true);
    });
}

// v35 BUGFIX ("Seps shows grey '?' ink swatches"): only names shaped "Pantone 186 C - OW" found a color. Bases
// ("EZP WHT", "1/2 BB"), bare numbers ("186", "186 C"), named colors ("Reflex Blue - Discharge", "Black 6 C") and
// "PMS 186" all fell through to a grey "?". Now: the ink's own Display Hex (same field Ink Queue v77 uses) wins,
// then the Pantone Number, then the name, each tried as-is, case-blind, without "Pantone/PMS", without a trailing
// " - type" and without a trailing C/U/CP/UP. TBA slots and unknown inks get a plain empty swatch, no "?".
var INK_HEX_FLD = 'fld5CH7FV94UnOVVl';  // Inks › Display Hex (read only here)
var PANTONE_HEX_UP = null;
function hexLookup(code) {
  if (!code) return null;
  if (!PANTONE_HEX_UP) { PANTONE_HEX_UP = {}; Object.keys(PANTONE_HEX).forEach(function(k) { var u = k.toUpperCase(); if (!PANTONE_HEX_UP[u]) PANTONE_HEX_UP[u] = PANTONE_HEX[k]; }); }
  var c = String(code).trim().replace(/\s+/g, ' ');
  var tries = [c];
  var noType = c.replace(/\s+-\s+.*$/, '').trim(); tries.push(noType);
  var noPrefix = noType.replace(/^(pantone|pms)\s+/i, '').trim(); tries.push(noPrefix);
  tries.push(noPrefix.replace(/\s+(C|U|CP|UP|M)$/i, '').trim());
  tries.push(noPrefix.replace(/[\s\(].*$/, '').trim());
  for (var i = 0; i < tries.length; i++) {
    var t = tries[i]; if (!t) continue;
    if (PANTONE_HEX[t]) return PANTONE_HEX[t];
    if (PANTONE_HEX_UP[t.toUpperCase()]) return PANTONE_HEX_UP[t.toUpperCase()];
  }
  return null;
}
function getPantoneHex(inkName, fields, pantoneNo) {
  var o = fields && fields[INK_HEX_FLD];
  if (o && /^#?[0-9A-Fa-f]{6}$/.test(String(o).trim())) { o = String(o).trim(); return o.charAt(0) === '#' ? o : '#' + o; }
  if (!inkName && !pantoneNo) return null;
  var hexMatch = String(inkName || '').match(/#([0-9A-Fa-f]{6})/);
  if (hexMatch) return '#' + hexMatch[1];
  return hexLookup(pantoneNo) || hexLookup(inkName);
}
function isTbaInk(name) { return /^\s*TBA\b/i.test(name || ''); }

function inkTypeBadge(typeName) {
  if (!typeName) return '';
  return '<span class="p-tag p-tag-soft ink-type-tag">' + escHtml(typeName) + '</span>';  // v35: a fact, so cream (was five colors)
}

// Chip color editor
var activeChipPopover = null;
function editChipColor(iid, chipEl) {
  // Close any existing popover
  if (activeChipPopover) { activeChipPopover.remove(); activeChipPopover = null; }

  var popover = document.createElement('div');
  popover.className = 'chip-popover';
  var currentColor = chipEl.style.backgroundColor || '';
  var currentHex = currentColor ? rgbToHex(currentColor) : '';

  popover.innerHTML =
    '<input class="chip-hex-input" id="chex-' + iid + '" placeholder="#a3b4c5" maxlength="7" value="' + currentHex + '">' +
    '<button class="chip-set-btn" onclick="applyChipColor(\'' + iid + '\');event.stopPropagation()">Set</button>' +
    '<span class="chip-pop-hint">This screen only \u2014 not saved</span>';

  // Position below chip
  var rect = chipEl.getBoundingClientRect();
  popover._chipEl = chipEl;
  document.body.appendChild(popover);
  // Position below chip, clamped to viewport
  var pw = popover.offsetWidth || 160;
  var leftPos = Math.min(rect.left, window.innerWidth - pw - 8);
  popover.style.cssText = 'position:fixed;top:' + (rect.bottom + 4) + 'px;left:' + Math.max(8, leftPos) + 'px;z-index:9999';
  activeChipPopover = popover;

  var inp = document.getElementById('chex-' + iid);
  if (inp) {
    inp.focus();
    inp.select();
    inp.onkeydown = function(e) {
      if (e.key === 'Enter') applyChipColor(iid);
      if (e.key === 'Escape') { popover.remove(); activeChipPopover = null; }
      e.stopPropagation();
    };
  }

  // Close on outside click — use mousedown instead of click to avoid
  // catching the same event that opened the popover
  setTimeout(function() {
    document.addEventListener('mousedown', function handler(e) {
      if (!popover.contains(e.target) && e.target !== chipEl) {
        popover.remove();
        activeChipPopover = null;
        document.removeEventListener('mousedown', handler);
      }
    });
  }, 100);
}

function applyChipColor(iid) {
  var inp = document.getElementById('chex-' + iid);
  if (!inp) {
    // Fallback: find input in active popover
    if (activeChipPopover) inp = activeChipPopover.querySelector('.chip-hex-input');
  }
  if (!inp) return;
  var hex = inp.value.trim();
  if (!hex.startsWith('#')) hex = '#' + hex;
  if (!/^#[0-9a-fA-F]{6}$/.test(hex)) {
    inp.style.borderColor = 'var(--p-alert)';
    inp.focus();
    return;
  }
  // Find chip — try by iid first, then by data stored on popover
  var chip = document.getElementById('chip-' + iid);
  if (!chip && activeChipPopover && activeChipPopover._chipEl) chip = activeChipPopover._chipEl;
  if (chip) {
    chip.style.background = hex;
    chip.classList.remove('ink-chip-empty', 'ink-chip-tba');
    chip.textContent = '';
  }
  if (activeChipPopover) { activeChipPopover.remove(); activeChipPopover = null; }
}

function rgbToHex(rgb) {
  var m = rgb.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if (!m) return '';
  return '#' + [m[1],m[2],m[3]].map(function(n) { return ('0'+parseInt(n).toString(16)).slice(-2); }).join('');
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
var inkChipCache = {};
// v30: per-imprint fetch sequence counter. Seeding (applyCherryPickedSeed) and
// the Populate-from dropdown can both fire loadInkChips while an earlier fetch
// is still in flight; without this a stale response overwrites the cache with
// the OLD ink set and every row falls back to a raw record ID.
var inkFetchSeq = {};

function loadInkChips(id) {
  var rowsEl = document.getElementById('inks-rows-' + id);
  if (!rowsEl) return;

  var rec = ALL.find(function(r) { return r.id === id; });
  if (!rec) return;

  // preview-* ids are local-only synthesized chips — they don't exist in
  // Airtable, so exclude them from the RECORD_ID() filter and the coverage test.
  var wantIds = (rec.inkIds || []).filter(function(iid) { return iid.indexOf('preview-') !== 0; });

  // --- v30 BUGFIX: "ink names render as recXXXXXXXXXXXXXX" -------------------
  // Old code was:  if (inkChipCache[id]) { renderInkChips(id, inkChipCache[id]); return; }
  // An EMPTY OBJECT IS TRUTHY. The no-inks branch below stamps
  // inkChipCache[id] = {} whenever a card is opened while it has no inks yet --
  // which is exactly a NEW ORDER (sales hasn't linked inks at the moment the
  // sep first peeks at the card). loadData() rebuilds ALL on every Refresh but
  // never clears inkChipCache, so once the inks DID get linked this early
  // return kept firing, renderInkChips received {}, and printed record IDs.
  // Fix: only trust the cache when it actually covers every ink on the record.
  var cached = inkChipCache[id];
  var cacheCovers = !!cached && wantIds.every(function(iid) { return !!cached[iid]; });
  if (cached && cacheCovers) { renderInkChips(id, cached); return; }

  if (!wantIds.length) {
    // v16: if this is a repeat with linked prev imprints, the orchestrator
    // (loadPrevImprintsAndSeed) will handle seeding inks. We just show a
    // waiting state; it will replace this content.
    if (rec.rp && rec.prevImprintIds && rec.prevImprintIds.length) {
      rowsEl.innerHTML = '<div class="inks-loading-sm">Loading from previous run…</div>';
      return;
    }
    // v17: No inks but no prev to wait on either -- render through
    // renderInkChips so the slot placeholders + slot-meta line + base chip
    // state all paint correctly.
    inkChipCache[id] = cached || {};
    renderInkChips(id, inkChipCache[id]);
    return;
  }

  var token = localStorage.getItem('pine_at_key');
  if (!token) return;

  var seq = (inkFetchSeq[id] = (inkFetchSeq[id] || 0) + 1);

  var filter = 'OR(' + wantIds.map(function(iid) { return "RECORD_ID()='" + iid + "'"; }).join(',') + ')';
  var url = 'https://api.airtable.com/v0/appJkaLk8DykjsgHR/tblyPBucKoDwxDisT' +
    '?returnFieldsByFieldId=true' +
    '&fields%5B%5D=fldojKv3gqT312q2R' +
    '&fields%5B%5D=fld00EdkjL43ybgVV' +
    '&fields%5B%5D=fldXMM4WvS3SGsliC' +
    '&fields%5B%5D=' + INK_HEX_FLD +   // v35: Display Hex, for the swatch
    '&filterByFormula=' + encodeURIComponent(filter);

  fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(res) {
      // v30 BUGFIX: this was the ONLY fetch in the app not checking res.ok.
      // An expired PAT (401), a rate limit (429) or a bad formula (422) returns
      // JSON with no .records -- which got cached as {} and rendered as a full
      // column of record IDs, permanently, until a hard page reload.
      if (!res.ok) return res.json().then(function(e) {
        throw new Error((e.error && (e.error.type + ': ' + e.error.message)) || 'API ' + res.status);
      });
      return res.json();
    })
    .then(function(data) {
      if (seq !== inkFetchSeq[id]) return;            // a newer load won -- drop this
      var byId = inkChipCache[id] || {};              // merge: keep locally-synth fields
      (data.records || []).forEach(function(r) { byId[r.id] = r.fields; });
      inkChipCache[id] = byId;
      renderInkChips(id, byId);
    })
    .catch(function(err) {
      console.error('[seps-v30 loadInkChips] FAIL', id, err);
      inkChipCache[id] = null;                        // never cache a failure
      var el = document.getElementById('inks-rows-' + id);
      if (el) el.innerHTML = '<div class="inks-loading-sm">Could not load inks — tap ↻ Refresh</div>';
    });
}

// ============================================================================
// v16: MULTI-PREVIOUS-IMPRINT SEEDING ORCHESTRATOR
// ----------------------------------------------------------------------------
// When a card is expanded and it's a repeat (rec.rp) with linked prev imprints,
// we fetch ALL of them in parallel, filter by Location match against the
// current imprint, then cherry-pick per field (sep URL / inks / print notes)
// the first location-matched prev that has a value.
//
// Dropdown renders only when 2+ location-matched prevs exist. Changing the
// dropdown re-seeds fields that sep hasn't edited (compare current vs seeded).
//
// No writes. Everything runs client-side; existing save paths persist whatever
// ends up in the DOM when INK_WRITES_ENABLED and siblings eventually flip on.
// ============================================================================

// Fetch a single previous imprint's full record (cached). Returns a Promise
// that resolves to { name, loc, inkIds, sepUrl, printNotes, hasProof, supa,
// prevRecId }. Cache hits resolve synchronously-ish.
function fetchOnePrevImprint(prevRecId) {
  if (prevImprintCache[prevRecId] && prevImprintCache[prevRecId]._full) {
    return Promise.resolve(prevImprintCache[prevRecId]);
  }
  var token = localStorage.getItem('pine_at_key');
  if (!token) return Promise.reject(new Error('No token'));

  // Fetch whole record — request listing specific fields can 422 when a
  // field can't resolve on that record (per v13 bug fix). Pluck client-side.
  var url = 'https://api.airtable.com/v0/' + BASE + '/' + TBL + '/' + prevRecId +
    '?returnFieldsByFieldId=true';

  return fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      var pd = parsePrevImprint(prevRecId, data.fields || {});
      prevImprintCache[prevRecId] = pd;
      return pd;
    });
}

// v34: shared parser for a previous-imprint record (used by the direct fetch
// above and by the same-order sibling search below).
function parsePrevImprint(prevRecId, f) {
      var name = f['fldDFfwFQ9B20n2kT'];
      if (!name) {
        console.warn('[seps] fetchOnePrevImprint: Imprint ID empty for', prevRecId);
        name = 'Previous run';
      }
      var typeRaw = f['fldjNCuaGOkWgzH2K'];
      var typeName = typeRaw ? (typeof typeRaw === 'object' ? (typeRaw.name || '') : String(typeRaw)) : '';
      var locRaw = f[F.location];
      var locName = locRaw ? (typeof locRaw === 'object' ? (locRaw.name || '') : String(locRaw)) : '';
      var pd = {
        prevRecId: prevRecId,
        name: name,
        loc: locName,
        inkIds: flatLookup(f[F.inks]).map(function(v){ return typeof v === 'string' ? v : (v && v.id) || ''; }).filter(Boolean),
        sepUrl: f[F.sepUrl] || '',
        printNotes: f[F.printNotes] || '',
        hasProof: flatLookup(f[F.proof]).length > 0,
        supa: isSupaType(typeName),
        // v29: master folder/id resolved on this previous imprint via its own
        // canonical lookups. A reorder's previous is a stamped family member, so
        // these are already populated — no need for the new imprint to be stamped.
        masterFolder: flatLookup(f[F.masterFolder])[0] || '',
        masterId: flatLookup(f[F.masterId])[0] || '',
        _full: true
      };
      return pd;
}

// v34: Same-order fallback. When no linked previous imprint shares this job's
// print location (e.g. 10893-B Back was linked to 9317-A Left Chest), look at
// the OTHER imprints on the same previous order(s) (9317-*) and return the ones
// in the matching location. Read-only; results are cached like direct fetches.
function fetchSameOrderMatches(linkedPrevs, currentLoc) {
  var token = localStorage.getItem('pine_at_key');
  if (!token) return Promise.resolve([]);
  var linkedIds = {};
  linkedPrevs.forEach(function(p){ linkedIds[p.prevRecId] = true; });
  var prefixes = [];
  linkedPrevs.forEach(function(p) {
    var m = /^(\d+)-/.exec(p.name || '');
    if (m && prefixes.indexOf(m[1]) < 0) prefixes.push(m[1]);
  });
  if (!prefixes.length) return Promise.resolve([]);
  return Promise.all(prefixes.map(function(prefix) {
    var formula = 'FIND("' + prefix + '-",{fldDFfwFQ9B20n2kT})=1';
    var url = 'https://api.airtable.com/v0/' + BASE + '/' + TBL +
      '?returnFieldsByFieldId=true&pageSize=100&filterByFormula=' + encodeURIComponent(formula);
    return fetch(url, { headers: { Authorization: 'Bearer ' + token } })
      .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data) {
        return (data.records || []).map(function(r) {
          var pd = prevImprintCache[r.id] && prevImprintCache[r.id]._full ? prevImprintCache[r.id] : parsePrevImprint(r.id, r.fields || {});
          prevImprintCache[r.id] = pd;
          return pd;
        });
      })
      .catch(function(err) { console.warn('[seps] same-order lookup failed for', prefix, err); return []; });
  })).then(function(lists) {
    var all = [].concat.apply([], lists);
    return all.filter(function(p) { return !linkedIds[p.prevRecId] && (p.loc || '') === (currentLoc || ''); })
      .sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });
  });
}

// v34: Small note above the ink rows explaining where seeded values came from.
function showPrevNote(currentId, text) {
  var rowsEl = document.getElementById('inks-rows-' + currentId);
  if (!rowsEl || !rowsEl.parentNode) return;
  var el = document.getElementById('prev-note-' + currentId);
  if (!el) {
    el = document.createElement('div');
    el.id = 'prev-note-' + currentId;
    el.className = 'p-note p-note-wait prev-note';
    rowsEl.parentNode.insertBefore(el, rowsEl);
  }
  el.textContent = text;
}

// Main entry point called when a repeat card is expanded.
function loadPrevImprintsAndSeed(currentId) {
  var rec = ALL.find(function(r) { return r.id === currentId; });
  if (!rec || !rec.prevImprintIds || !rec.prevImprintIds.length) return;

  // Set interim label on the View Previous button while we load
  var labelEl = document.getElementById('prev-label-' + currentId);
  if (labelEl && !labelEl.textContent.trim().replace('...','')) {
    labelEl.textContent = 'loading\u2026';
  }

  var promises = rec.prevImprintIds.map(function(pid) {
    return fetchOnePrevImprint(pid).catch(function(err) {
      console.warn('[seps] fetchOnePrevImprint failed for', pid, err);
      return null;
    });
  });

  Promise.all(promises).then(function(results) {
    var allPrevs = results.filter(function(x){ return !!x; });
    if (!allPrevs.length) {
      var rowsEl = document.getElementById('inks-rows-' + currentId);
      if (rowsEl && !rec.inkIds.length) rowsEl.innerHTML = '<div class="inks-loading-sm">Could not load previous run</div>';
      if (labelEl) labelEl.textContent = 'Previous run';
      return;
    }

    // Filter to location matches only. Empty-location current imprint matches
    // empty-location prev (trivially). Otherwise strict equality.
    var currentLoc = rec.loc || '';
    var matched = allPrevs.filter(function(p){ return (p.loc || '') === currentLoc; });

    // User decision: no location match = leave fields empty, sep fills manually.
    // But we still need a target for the "View Previous" button, so default
    // state[currentId].chosenPrev to the first linked prev (unseeded).
    if (!matched.length) {
      state[currentId].chosenPrev = allPrevs[0].prevRecId;
      if (labelEl) labelEl.textContent = allPrevs[0].name;
      // v34: before giving up, look for a location match among the other
      // imprints on the same previous order(s).
      fetchSameOrderMatches(allPrevs, currentLoc).then(function(sibs) {
        if (sibs.length) {
          applyCherryPickedSeed(currentId, sibs);
          if (sibs.length > 1) renderPopulateFromDropdown(currentId, sibs);
          var linkedDesc = allPrevs.map(function(p){ return p.name + (p.loc ? ' (' + p.loc + ')' : ''); }).join(', ');
          showPrevNote(currentId, 'Linked run ' + linkedDesc + ' is a different location \u2014 matched ' +
            sibs[0].name + (currentLoc ? ' (' + currentLoc + ')' : '') + ' on the same order. Check before saving.');
          return;
        }
        var rowsEl2 = document.getElementById('inks-rows-' + currentId);
        if (rowsEl2 && !rec.inkIds.length) {
          rowsEl2.innerHTML = '<div class="p-note p-note-wait prev-note">No previous run in the same print location \u2014 add the inks by hand.</div>';
        }
      });
      return;
    }

    // Location-matched set. Apply seed and render dropdown if 2+.
    applyCherryPickedSeed(currentId, matched);
    if (matched.length > 1) {
      renderPopulateFromDropdown(currentId, matched);
    }
  });
}

// Cherry-pick seed: walk location-matched prevs in order, take first non-empty
// value per field. Stamp state[id].seeded so dropdown changes can edit-detect.
// Sets state[id].chosenPrev to the first matched prev (drives View Previous btn).
function applyCherryPickedSeed(currentId, matchedPrevs) {
  var rec = ALL.find(function(r) { return r.id === currentId; });
  if (!rec) return;

  var pick = { sepUrl:'', inkIds:[], printNotes:'', masterFolder:'', masterId:'' };
  var sources = { sepUrl:null, inkIds:null, printNotes:null };

  matchedPrevs.forEach(function(p) {
    if (!pick.sepUrl && p.sepUrl) { pick.sepUrl = p.sepUrl; sources.sepUrl = p.prevRecId; }
    if (!pick.inkIds.length && p.inkIds.length) { pick.inkIds = p.inkIds.slice(); sources.inkIds = p.prevRecId; }
    if (!pick.printNotes && p.printNotes) { pick.printNotes = p.printNotes; sources.printNotes = p.prevRecId; }
    // v29: master folder is design-level (same for the whole family), so first
    // matched prev that carries it wins.
    if (!pick.masterFolder && p.masterFolder) { pick.masterFolder = p.masterFolder; pick.masterId = p.masterId || ''; }
  });

  // Default chosenPrev: first matched (drives View Previous button target)
  state[currentId].chosenPrev = matchedPrevs[0].prevRecId;

  var labelEl = document.getElementById('prev-label-' + currentId);
  if (labelEl) labelEl.textContent = matchedPrevs[0].name;

  // Seed Sep File URL — ONLY if sep hasn't already set one
  if (pick.sepUrl && !state[currentId].sepsUrl) {
    state[currentId].sepsUrl = pick.sepUrl;
    refreshSepUrlUI(currentId, pick.sepUrl);
  }

  // Seed Inks — ONLY if current has none. Mutates rec.inkIds so the existing
  // loadInkChips render path picks them up on next call.
  if (pick.inkIds.length && !rec.inkIds.length) {
    rec.inkIds = pick.inkIds.slice();
    // Clear any in-flight "Loading from previous run..." placeholder so
    // loadInkChips' early-return doesn't paint empty state.
    inkChipCache[currentId] = null;
    loadInkChips(currentId);
  } else if (!pick.inkIds.length && !rec.inkIds.length) {
    // No inks available anywhere and current has none either — clear the
    // placeholder so it doesn't say "Loading..." forever.
    var rowsEl = document.getElementById('inks-rows-' + currentId);
    if (rowsEl) rowsEl.innerHTML = '<div class="inks-loading-sm">No inks on previous run</div>';
  }

  // Seed Print Notes — ONLY if current notes are empty
  if (pick.printNotes && !(state[currentId].pn || '').trim()) {
    state[currentId].pn = pick.printNotes;
    var ta = document.getElementById('notes-' + currentId);
    if (ta && !ta.value.trim()) ta.value = pick.printNotes;
  }

  // Stash seeded values so dropdown changes can detect unedited fields
  state[currentId].seeded = {
    sepsUrl: pick.sepUrl || '',
    pn: pick.printNotes || '',
    inkIdsSig: (pick.inkIds || []).slice().sort().join(',')
  };

  // v29: stash the master folder/id sourced from the previous imprint, then
  // repaint the banner (the current imprint's own lookup was empty for a fresh
  // reorder — this fills it from the promoted family).
  if (pick.masterFolder) {
    state[currentId].masterFolder = pick.masterFolder;
    state[currentId].masterId = pick.masterId || '';
    renderMasterFolderBanner(currentId);
  }
}

// v29: Paint the Master Design Folder banner in the Sep File section.
// Source priority: the imprint's OWN master folder (a stamped family member or
// the promoted root) first, then the value sourced from a previous imprint (the
// fresh-reorder case). Folder != file: we surface the DESIGN folder so the
// separator opens it and pulls the clean sep from the Seps subfolder by hand.
// We never auto-overwrite the Sep File URL with a folder link.
function renderMasterFolderBanner(currentId) {
  var el = document.getElementById('master-folder-' + currentId);
  if (!el) return;
  var rec = ALL.find(function(r){ return r.id === currentId; });
  var url = (rec && rec.masterFolder) || (state[currentId] && state[currentId].masterFolder) || '';
  var mid = (rec && rec.masterId) || (state[currentId] && state[currentId].masterId) || '';
  if (!url || url.indexOf('http') !== 0) { el.style.display = 'none'; return; }
  el.innerHTML =
    '<div class="mfb-l">' +
      '<span class="mfb-chip">MASTER' + (mid ? ' \u00b7 ' + esc(mid) : '') + '</span>' +
      '<span class="mfb-sub">Clean canonical files \u2014 open the Seps folder inside for the truth sep</span>' +
    '</div>' +
    h('a', {'class':'p-btn mfb-btn','href':url,'target':'_blank','rel':'noopener'}, 'Open master folder &#8599;');
  el.style.display = 'flex';
}

// Render the "Populate from" dropdown (2+ matched prevs).
function renderPopulateFromDropdown(currentId, matchedPrevs) {
  var host = document.getElementById('populate-from-' + currentId);
  if (!host) return;
  var chosen = state[currentId].chosenPrev || matchedPrevs[0].prevRecId;
  var opts = matchedPrevs.map(function(p) {
    var label = escHtml(p.name) + (p.loc ? ' \u00b7 ' + escHtml(p.loc) : '');
    var sel = (p.prevRecId === chosen) ? ' selected' : '';
    return '<option value="' + esc(p.prevRecId) + '"' + sel + '>' + label + '</option>';
  }).join('');
  host.innerHTML =
    '<label class="sp-lbl" for="popfrom-' + esc(currentId) + '">Fill from</label>' +
    '<select class="p-select" id="popfrom-' + esc(currentId) + '" onchange="onPopulateFromChange(\'' + esc(currentId) + '\', this.value)">' +
    opts + '</select>';
}

// Dropdown change handler — re-seed ONLY fields sep hasn't edited.
// "Unedited" = current value equals what we last seeded in state[id].seeded.
// Any divergence (including sep wiping a field to empty) counts as edited.
function onPopulateFromChange(currentId, newPrevRecId) {
  var pd = prevImprintCache[newPrevRecId];
  if (!pd) return;
  state[currentId].chosenPrev = newPrevRecId;

  var labelEl = document.getElementById('prev-label-' + currentId);
  if (labelEl) labelEl.textContent = pd.name;

  var seeded = state[currentId].seeded || { sepsUrl:'', pn:'', inkIdsSig:'' };
  var rec = ALL.find(function(r){ return r.id === currentId; });
  if (!rec) return;

  // Sep URL — compare current vs seeded; re-seed if match
  var curSepUrl = state[currentId].sepsUrl || '';
  if (curSepUrl === (seeded.sepsUrl || '') && pd.sepUrl) {
    state[currentId].sepsUrl = pd.sepUrl;
    seeded.sepsUrl = pd.sepUrl;
    refreshSepUrlUI(currentId, pd.sepUrl);
  }

  // Print Notes — compare current textarea value vs seeded
  var ta = document.getElementById('notes-' + currentId);
  var curPn = ta ? ta.value : (state[currentId].pn || '');
  if (curPn === (seeded.pn || '') && pd.printNotes) {
    state[currentId].pn = pd.printNotes;
    seeded.pn = pd.printNotes;
    if (ta) ta.value = pd.printNotes;
  }

  // Inks — compare current signature vs seeded signature
  var curSig = (rec.inkIds || []).slice().sort().join(',');
  if (curSig === (seeded.inkIdsSig || '') && pd.inkIds.length) {
    rec.inkIds = pd.inkIds.slice();
    seeded.inkIdsSig = pd.inkIds.slice().sort().join(',');
    inkChipCache[currentId] = null;
    loadInkChips(currentId);
  }

  state[currentId].seeded = seeded;
}

// Update the Sep File UI strip to reflect a newly-seeded URL (preview-only,
// no PATCH). Mirrors the preview branch of saveSepLink without triggering a
// toast. Handles both initial seed (lbtn-{id} element present) and dropdown
// re-seed (View sep anchor already present — needs href update).
function refreshSepUrlUI(currentId, url) {
  paintSepUrl(currentId);  // v35: one painter for the Sep file buttons + the card tag
}

// View Previous button click -> opens proof of whichever prev is currently
// chosen (default: first location-matched, or dropdown selection).
function openChosenPrevProof(currentId) {
  var target = (state[currentId] && state[currentId].chosenPrev) || null;
  if (!target) {
    // Fallback: use the first linked prev
    var rec = ALL.find(function(r){ return r.id === currentId; });
    if (rec && rec.prevImprintIds && rec.prevImprintIds.length) {
      target = rec.prevImprintIds[0];
    }
  }
  if (!target) { showToast('No previous imprint linked', true); return; }
  openPrevProof(currentId, target);
}

// Open previous imprint proof in the existing pmModal viewer
function openPrevProof(currentId, prevRecId) {
  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No API token', true); return; }

  // Check cache for the name
  var prevName = prevImprintCache[prevRecId] ? prevImprintCache[prevRecId].name : prevRecId;

  var modal = document.getElementById('pmModal');
  var spinner = document.getElementById('pmSpinner');
  var canvas = document.getElementById('pmCanvas');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('pmFn').textContent = 'Previous: ' + prevName;
  document.getElementById('pmCt').textContent = '';
  document.getElementById('pmOpenLink').style.display = 'none';
  spinner.style.display = 'flex';
  modal.classList.add('open');
  pmPdfDoc = null; pmPage = 1; pmTotal = 1;

  // Fetch fresh proof images from previous imprint record
  // v13: no fields[]= filter — was causing 422s when any listed field couldn't
  // resolve on the target record. Fetch whole record, pluck client-side.
  var url = 'https://api.airtable.com/v0/' + BASE + '/' + TBL + '/' + prevRecId +
    '?returnFieldsByFieldId=true';

  fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      var f = data.fields || {};
      var raw = f[F.proof];
      var freshUrl = null, isPDF = false;

      // Handle both flat array and nested multipleLookupValues
      if (raw && raw.valuesByLinkedRecordId) {
        Object.values(raw.valuesByLinkedRecordId).forEach(function(arr) {
          if (Array.isArray(arr)) arr.forEach(function(a) {
            if (a && a.url && !freshUrl) { freshUrl = a.url; isPDF = a.type === 'application/pdf'; }
          });
        });
      } else if (Array.isArray(raw)) {
        raw.forEach(function(a) {
          if (a && a.url && !freshUrl) { freshUrl = a.url; isPDF = a.type === 'application/pdf'; }
        });
      }

      if (!freshUrl) {
        spinner.style.display = 'none';
        canvas.width = 400; canvas.height = 80;
        var c = canvas.getContext('2d');
        c.fillStyle = '#141412'; c.fillRect(0, 0, 400, 80);
        c.fillStyle = '#FFFFFF'; c.font = '700 16px Helvetica, Arial, sans-serif'; c.textAlign = 'center';
        c.fillText('No proof on previous imprint', 200, 45);
        return;
      }

      var link = document.getElementById('pmOpenLink');
      link.href = freshUrl;
      link.style.display = 'inline-flex';

      if (isPDF) {
        pmInit();
        pdfjsLib.getDocument(freshUrl).promise.then(function(doc) {
          pmPdfDoc = doc; pmPage = 1; pmTotal = doc.numPages;
          pmRenderPage();
        }).catch(function(err) {
          spinner.style.display = 'none';
          canvas.width = 500; canvas.height = 100;
          var c = canvas.getContext('2d');
          c.fillStyle = '#141412'; c.fillRect(0, 0, 500, 100);
          c.fillStyle = '#FFFFFF'; c.font = '700 16px Helvetica, Arial, sans-serif'; c.textAlign = 'center';
          c.fillText('PDF load error: ' + err.message, 250, 40);
          c.fillStyle = '#EFE2CD'; c.font = '14px Helvetica, Arial, sans-serif';
          c.fillText('Use the Open button above to view in browser', 250, 65);
        });
      } else {
        var img = new Image();
        img.onload = function() {
          spinner.style.display = 'none';
          canvas.width = img.width; canvas.height = img.height;
          canvas.getContext('2d').drawImage(img, 0, 0);
          document.getElementById('pmCt').textContent = 'img';
        };
        img.onerror = function() { spinner.style.display = 'none'; };
        img.crossOrigin = 'anonymous';
        img.src = freshUrl;
      }
    })
    .catch(function(err) {
      spinner.style.display = 'none';
      showToast('Previous proof load failed: ' + err.message, true);
    });
}

function renderInkChips(id, byId) {
  var rec = ALL.find(function(r) { return r.id === id; });
  if (!rec) return;
  var el = document.getElementById('inks-rows-' + id);
  if (!el) return;

  var realInkCount = (rec.inkIds || []).length;

  var html = '';
  (rec.inkIds || []).forEach(function(iid, idx) {
    var d = byId[iid] || {};
    // v30 BUGFIX: NEVER render a raw Airtable record ID as an ink name. The old
    // `d['fldojKv3gqT312q2R'] || iid` was the single line that surfaced
    // "RECODN5TMXWWZR4OV" to the sep whenever the Inks fetch hadn't resolved.
    // Fall back the same way the rest of the app does: Name -> Pantone Number,
    // then a neutral placeholder. Every other read site in this file already
    // used `fld00EdkjL43ybgVV || fldojKv3gqT312q2R`; this one didn't.
    var pantoneNo = d['fld00EdkjL43ybgVV'] || '';
    var name = d['fldojKv3gqT312q2R'] || (pantoneNo ? 'Pantone ' + pantoneNo : '') ||
               (iid.indexOf('preview-') === 0 ? 'New ink' : 'Resolving\u2026');
    var typeRaw = d['fldXMM4WvS3SGsliC'];
    var typeName = typeRaw ? (typeof typeRaw === 'object' ? (typeRaw.name || '') : String(typeRaw)) : '';
    var hexColor = getPantoneHex(name, d, pantoneNo);
    var tba = !hexColor && (isTbaInk(pantoneNo) || isTbaInk(name));
    var chipStyle = hexColor ? 'background:' + hexColor : '';
    var isPreview = iid.indexOf('preview-') === 0;
    var rowCls = 'ink-row' + (isPreview ? ' preview-chip' : '');

    html += '<div class="' + rowCls + '" draggable="true" data-iid="' + escHtml(iid) + '" data-recid="' + escHtml(id) + '" data-idx="' + idx + '"' +
      ' ondragstart="inkDragStart(event)"' +
      ' ondragover="inkDragOver(event)"' +
      ' ondragleave="inkDragLeave(event)"' +
      ' ondrop="inkDrop(event)"' +
      ' ondragend="inkDragEnd(event)">';
    // Drag handle
    html += '<div class="drag-handle" title="Drag to reorder">' +
      '<div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div><div class="drag-dot"></div>' +
      '</div>';
    html += hexColor
      ? '<div class="ink-chip" id="chip-' + escHtml(iid) + '" style="' + chipStyle + '" title="Click to adjust" onclick="editChipColor(\'' + escHtml(iid) + '\',this);event.stopPropagation()"></div>'
      : '<div class="ink-chip ' + (tba ? 'ink-chip-tba' : 'ink-chip-empty') + '" id="chip-' + escHtml(iid) + '" title="' + (tba ? 'TBA \u2014 the ink room picks the color' : 'No color on file \u2014 click to preview one') + '" onclick="editChipColor(\'' + escHtml(iid) + '\',this);event.stopPropagation()"></div>';
    html += '<div class="ink-body">';
    // v35: "Pantone 186 C - OW" + an OW tag said the type twice; the tag says it once.
    var shownName = typeName ? name.replace(new RegExp('\\s+-\\s+' + typeName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i'), '') : name;
    html += '<div class="ink-name" title="' + escHtml(name) + '">' + escHtml(shownName) + '</div>';
    if (typeName) html += inkTypeBadge(typeName);
    html += '</div>';
    html += '<button class="ink-remove" title="Remove from this imprint" onclick="removeInkFromImprint(\'' + escHtml(id) + '\',\'' + escHtml(iid) + '\');event.stopPropagation()">\u2715</button>';
    html += '</div>';
  });

  // v20: Placeholder slot nudges — these are visual-only "tap me to add a
  // TBA blank canvas" rows shown up to the imprint's screen count. They
  // don't represent real records; they're an onboarding hint that says
  // "you have N paid screens, here's the empty slots if you want to commit
  // them as TBA records ready for Ink Queue to fill in later."
  //
  // Tap → addTbaSlot mints a real Inks record (the blank canvas) and links
  // it to the imprint. The placeholder count drops by one on the next
  // re-render because realInkCount went up.
  //
  // Capped at MAX_INKS — once realInkCount would exceed 12, we stop
  // rendering placeholders. Whitney can still grow beyond screen count
  // via "+ Add slot" up to 12 total.
  var screenCount = rec.s || 0;
  var maxPlaceholders = Math.max(0, MAX_INKS - realInkCount);
  var desiredPlaceholders = Math.max(0, screenCount - realInkCount);
  var placeholderCount = Math.min(desiredPlaceholders, maxPlaceholders);
  for (var p = 0; p < placeholderCount; p++) {
    var slotNum = realInkCount + p + 1;
    html += '<div class="slot-placeholder" onclick="event.stopPropagation();addTbaSlot(\'' + id + '\')">' +
      '<div class="slot-placeholder-chip">' + slotNum + '</div>' +
      '<div class="slot-placeholder-lbl">Empty slot</div>' +
      '<div class="slot-placeholder-hint">Tap to add a TBA ink</div>' +
    '</div>';
  }

  if (!html) {
    html = '<div class="inks-loading-sm">No inks yet \u2014 tap a base or add an ink below.</div>';
  }
  el.innerHTML = html;

  // v17: Update slot-meta line — shows real ink count, paid screens, and cap warning when at max
  var meta = document.getElementById('slot-meta-' + id);
  if (meta) {
    var atMax = realInkCount >= MAX_INKS;
    var maxBadge = atMax ? ' <span class="slot-max">Max ' + MAX_INKS + '</span>' : '';
    if (screenCount > 0) {
      meta.innerHTML = 'Inks <span class="slot-meta-count">(' + realInkCount + ' of ' + screenCount + ')</span> ' +
        '<span class="slot-meta-paid">paid screens</span>' + maxBadge;
    } else {
      meta.innerHTML = 'Inks <span class="slot-meta-count">(' + realInkCount + ')</span>' + maxBadge;
    }
  }

  // v17: Disable add-slot button when at MAX_INKS
  var addSlotBtn = document.getElementById('add-slot-btn-' + id);
  if (addSlotBtn) {
    var atMax2 = realInkCount >= MAX_INKS;
    addSlotBtn.disabled = atMax2;

  }

  // v17: Sync .added state on the four base chips so Whitney sees which bases are committed
  refreshBaseChipStates(id, byId);

  // Sync the PDF scan chip states in case some were already added
  refreshScanChipStates(id);
}

// v17: focus the typeahead input. Currently unused (placeholder slots now add

// v17: Mark base-chip .added when its record ID is already on the imprint's inks.
// Also disable un-added chips when the imprint is at MAX_INKS (added chips stay
// tappable so user can toggle off to free up a slot).
function refreshBaseChipStates(id, byId) {
  var rec = ALL.find(function(r) { return r.id === id; });
  if (!rec) return;
  var basesRow = document.getElementById('bases-row-' + id);
  if (!basesRow) return;
  var inkIds = rec.inkIds || [];
  var atMax = inkIds.length >= MAX_INKS;

  // Build a set of the currently-committed Pantone Number values on this imprint —
  // this is more robust than matching by record ID, because Whitney could have
  // legitimately added a base via the typeahead at some point in the past
  // (or via a previous-imprint inheritance seed) and we still want the chip to
  // reflect that the base IS on the imprint.
  var committedNames = {};
  inkIds.forEach(function(iid) {
    var fields = (byId && byId[iid]) || {};
    var pn = fields['fld00EdkjL43ybgVV'] || fields['fldojKv3gqT312q2R'];
    if (pn) committedNames[String(pn).toUpperCase()] = true;
  });

  basesRow.querySelectorAll('.base-chip').forEach(function(chip) {
    var name = (chip.dataset.base || '').toUpperCase();
    var inkRecId = chip.dataset.inkId;
    var isAdded = committedNames[name] || (inkIds.indexOf(inkRecId) >= 0);
    chip.classList.toggle('added', !!isAdded);
    // v17: Disable un-added chips when imprint is full. Added chips remain tappable
    // so user can toggle off to free up a slot.
    chip.classList.toggle('disabled', atMax && !isAdded);
  });
}

// DRAG TO REORDER INK CHIPS
var dragSrcIid = null, dragSrcRecId = null;

function inkDragStart(e) {
  var row = e.currentTarget;
  dragSrcIid   = row.dataset.iid;
  dragSrcRecId = row.dataset.recid;
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcIid);
  e.stopPropagation();
}

function inkDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var row = e.currentTarget;
  if (row.dataset.iid !== dragSrcIid) row.classList.add('drag-over');
  e.stopPropagation();
}

function inkDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
  e.stopPropagation();
}

function inkDragEnd(e) {
  document.querySelectorAll('.ink-row').forEach(function(r) {
    r.classList.remove('dragging');
    r.classList.remove('drag-over');
  });
  e.stopPropagation();
}

function inkDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  var targetRow = e.currentTarget;
  targetRow.classList.remove('drag-over');

  var targetIid = targetRow.dataset.iid;
  var recId     = targetRow.dataset.recid;
  if (!dragSrcIid || dragSrcIid === targetIid) return;

  // Reorder inkIds on the record
  var rec = ALL.find(function(r) { return r.id === recId; });
  if (!rec) return;

  var ids = rec.inkIds.slice();
  var fromIdx = ids.indexOf(dragSrcIid);
  var toIdx   = ids.indexOf(targetIid);
  if (fromIdx < 0 || toIdx < 0) return;

  ids.splice(fromIdx, 1);
  ids.splice(toIdx, 0, dragSrcIid);
  rec.inkIds = ids;

  // Re-render with new order
  var byId = inkChipCache[recId] || {};
  renderInkChips(recId, byId);

  // PATCH to Airtable — save new order
  patchInkOrder(recId, ids);
}

function showToast(msg, err) {  // v35: kit toast (black, bottom centre), newest wins; problems stay a little longer
