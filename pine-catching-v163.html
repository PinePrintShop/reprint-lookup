<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pine Catching v163</title>
<!-- v163 (2026-10-19): Embroidery and Heat Press jobs stay until they're caught (Stephen: "since Embroidery and Heat Press
     sometimes ebbs and flows with when it gets on the machines....can those jobs always be there until they are marked
     complete").
     - Embroidery + Heat Press (Tajima, D3, Hat Press, Tag Press): every imprint not caught yet shows — from any earlier
       day, and up to 3 days early (a job can get on the machine before its day). Orders that are Completed,
       Cancelled / Voided, Shipped or Caught - Awaiting Ship are left out (332 old uncaught imprints belong to Completed
       orders). Today's caught ones still show in Completed.
     - The line item says when it was scheduled when that isn't today: "from Tue 10/14" / "sched. Thu 10/22".
     - Screen print presses are unchanged (today only).
     - If Airtable ever rejects the wider query, Catching loads today's jobs as before (nothing breaks).
-->
<!-- v162 (2026-10-17): weekend cleanup. The browser pop-ups (alert) are now a Pine message at the top of the screen:
     "Some writes failed", "Pick a team and reason for each one", the order-number lookup, "Allow pop-ups…".
     A problem stays up (red edge) until someone taps OK (big enough for a finger), so it isn't missed at the dryer.
     Nothing else changed.
-->
<!-- v161 (2026-10-15): Pine PAGE KIT on the screens around the work screen (the tally screen itself is unchanged).
     Bar: views (.p-bar-views: presses with color dots + counts, Completed) · ↻ Refresh · ⚙ menu (Airtable token,
     practice on/off/reset). Completed: .p-head summary + one .p-lc card per order (opens in place, one at a time;
     Packing slip per card). Order complete / hand off / pack pop-ups use .p-modal (title + order #, body, actions
     bottom right with the main one last). Airtable reads and writes unchanged. -->
<!-- v160 (2026-10-15): bandana headline says "50 to catch" until the line item is Done (it said "0 · order complete"
     before anything was caught). Damage tallied still shows "N more to print to complete". Nothing else changed. -->
<!-- v159 (2026-10-15): Pine style v2 (black top bar with logo, app name, version and practice pill; black, white,
     cream and Pantone 107 yellow only, red only for real problems; Poppins Black for titles and the one big number;
     nothing under 12px; 44-56px tap targets; one yellow main button per screen; IDs as black-and-yellow badges).
     Self-update: version shows in the top bar; "busy" is now "mid-task" (recent taps, an open pop-up, a save in
     flight), not "a job is open", so idle iPads move to new versions on their own again. Short press names on the
     iPad, colored press dots, Completed tab tidied. Airtable reads/writes unchanged. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap">
<link rel="stylesheet" href="pine-style-v2.css">
<style>
:root{
  --bg:#F2F2EE;--surface:#fff;--border:#E5E5E0;--border-dk:#D0D0CA;
  --green:#1e6b45;--green-lt:#e8f5ee;--green-md:#2d8a5a;--green-dk:#144d31;
  --text:#0D0D0B;--muted:#888880;--muted-lt:#BBBBB5;
  --yellow:#E8E832;--yellow-dim:#E8E83230;--yellow-border:#E8E83250;
  --red:#c0392b;--red-bg:#fdf2f2;--red-bd:#f5c6c6;
  --amb:#b7791f;--amb-bg:#fffbeb;--amb-bd:#fde68a;
  --sb-bg:#0A0A08;--sb-border:#1A1A16;--sb-active:#141410;
  --sans:Helvetica,Arial,sans-serif;
  --cond:Helvetica,Arial,sans-serif;
  --mono:Helvetica,Arial,sans-serif;
  --radius:4px;--radius-lg:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
/* v121: cockpit mode locks the QC view to the viewport so nothing scrolls
   except designated regions (tally area, proof area). Queue view keeps the
   normal scroll model. Body class toggled by renderQC vs renderQueue. */
body{padding-bottom:28px} /* default: reserve 28px for preview badge */
body.writes-on{padding-bottom:0}
body.qc-mode{display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
body.qc-mode.writes-on .preview-badge{display:none}
body.qc-mode #root{flex:1;min-height:0;display:flex;flex-direction:column}

/* Press tabs */
.press-bar{display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:50;flex-shrink:0}
.press-tabs{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none;flex:1;min-width:0}
.view-tabs{display:flex;gap:6px;flex-shrink:0;margin-right:8px}
.done-summary{display:flex;align-items:center;gap:9px;background:var(--green-lt);border:1px solid #bfe0cd;border-radius:var(--radius-lg);padding:11px 15px;margin-bottom:12px;font-family:var(--cond);font-weight:700;font-size:15px;color:var(--green-dk);letter-spacing:.02em}
.done-summary .ds-check{font-size:17px;color:var(--green)}
.press-tabs::-webkit-scrollbar{display:none}
.pt{font-size:12px;font-weight:700;padding:5px 12px;border:1px solid var(--border-dk);border-radius:20px;background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;transition:all .1s;font-family:var(--cond);display:flex;align-items:center}
.pt:hover{border-color:var(--text);color:var(--text)}
.pt.on{background:var(--sb-bg);border-color:var(--sb-bg);color:var(--yellow)}
.pt-ct{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:8px;background:rgba(255,255,255,.08);font-size:12px;padding:0 4px;margin-left:5px;color:var(--muted-lt);font-family:var(--mono)}
.pt.on .pt-ct{background:rgba(232,232,50,.15);color:var(--yellow)}
.btn-refresh{font-size:12px;font-weight:700;padding:5px 12px;border:1px solid var(--border-dk);border-radius:20px;background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;font-family:var(--cond);display:flex;align-items:center;gap:5px;flex-shrink:0;transition:all .1s}
.btn-refresh:hover{border-color:var(--text);color:var(--text)}
.btn-refresh:disabled{opacity:.5;cursor:wait}
.btn-refresh .rf-icon{display:inline-block;transition:transform .6s}
.btn-refresh.spinning .rf-icon{animation:sp .7s linear infinite}

/* Token button (standalone-mode utility) — same shape as btn-refresh */
.btn-token{font-size:12px;font-weight:700;padding:5px 12px;border:1px solid var(--border-dk);border-radius:20px;background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;font-family:var(--cond);display:flex;align-items:center;gap:5px;flex-shrink:0;transition:all .1s}
.btn-token:hover{border-color:var(--text);color:var(--text)}
.btn-token.set{border-color:var(--green);color:var(--green)}
.btn-token.set:hover{background:var(--green-lt)}

/* Content */
.content{padding:20px;max-width:none}

/* Cards — exact v9 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:10px}
.card-h{padding:9px 14px;border-bottom:1px solid var(--bg);display:flex;align-items:center;justify-content:space-between}
.card-t{font-size:12px;color:var(--muted-lt);text-transform:uppercase;letter-spacing:.14em;font-weight:700;font-family:var(--cond)}
.card-a{font-size:12px;color:var(--muted-lt);cursor:pointer;font-family:var(--cond);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.card-a:hover{color:var(--green)}
.card-b{padding:12px 14px}

/* Rows — exact v9 */
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg)}
.row:last-child{border-bottom:none}
.row-n{font-size:12px;color:var(--muted-lt);width:40px;flex-shrink:0;font-weight:600;font-family:var(--mono)}
.row-m{flex:1;min-width:0}
.row-name{font-size:12px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em}
.row-sub{font-size:12px;color:var(--muted-lt);margin-top:1px;font-family:var(--mono)}

/* Tags — exact v9 */
.tag{font-size:12px;padding:2px 7px;border-radius:2px;white-space:nowrap;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid;font-family:var(--cond)}
.tag.g{background:var(--sb-bg);color:var(--yellow);border-color:var(--yellow-border)}
.tag.y{background:var(--sb-bg);color:var(--yellow);border-color:var(--yellow-border)}
.tag.r{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.tag.n{background:var(--surface);color:var(--muted);border-color:var(--border)}
.tag.amb{background:var(--amb-bg);color:var(--amb);border-color:var(--amb-bd)}
.tag.split{background:var(--surface);color:var(--text);border-style:dashed;border-color:var(--border-dk)}

/* v114: location chips — one per imprint location on this pile, rendered inside
   the tally bar parallel to the Size row. Catcher taps each after the final
   dryer pass to mark "quality-checked." Multi-location piles must have ALL
   chips ✓ before Submit unlocks. */
.tb-loc-row{}
.tb-loc-chip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:var(--radius);border:2px solid var(--border-dk);background:var(--surface);font-size:12px;font-weight:700;color:var(--muted);font-family:var(--cond);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .12s;user-select:none;line-height:1}
.tb-loc-chip:hover{border-color:var(--text);color:var(--text)}
.tb-loc-chip.on{background:var(--green-lt);border-color:var(--green);color:var(--green-dk)}
.tb-loc-chip.on:hover{border-color:var(--green-dk);color:var(--green-dk)}
.tb-loc-mark{font-size:12px;font-family:var(--mono);font-weight:700;width:10px;text-align:center;flex-shrink:0}
.tb-loc-impid{font-size:12px;color:var(--muted-lt);letter-spacing:.06em;margin-left:2px}
.tb-loc-chip.on .tb-loc-impid{color:var(--green)}
.tb-loc-prog{font-size:12px;font-weight:700;font-family:var(--mono);padding:6px 10px;border-radius:var(--radius);flex-shrink:0;letter-spacing:.04em}
.tb-loc-prog.ok{color:var(--green-dk);background:var(--green-lt)}
.tb-loc-prog.amb{color:var(--amb);background:var(--amb-bg)}

/* Buttons — exact v9 */
.btn{background:var(--bg);border:1px solid var(--border-dk);border-radius:var(--radius);color:var(--muted);font-size:12px;padding:5px 10px;cursor:pointer;font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:all .1s}
.btn:hover{border-color:var(--text);color:var(--text)}
.btn.p{background:var(--sb-bg);border-color:var(--sb-bg);color:var(--yellow)}
.btn.p:hover{background:#1A1A16}
.btn.grn{background:var(--green-lt);border-color:#b8dfcc;color:var(--green-dk)}
.btn.grn:hover{background:#d4eddf}

/* Queue header */
.q-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.q-title{font-size:12px;font-weight:700;color:var(--muted-lt);text-transform:uppercase;letter-spacing:.1em;font-family:var(--cond)}
.q-date{font-size:12px;color:var(--muted-lt);font-family:var(--mono)}

/* Order group — bundles all cards from same order under a collapsible header */
.og{margin-bottom:18px}
.og-hdr{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;margin-bottom:6px}
.og-hdr:hover{background:var(--surface);border-color:var(--border-dk)}
.og-caret{font-size:12px;color:var(--muted);font-family:var(--mono);width:12px;flex-shrink:0;transition:transform .12s}
.og-hdr.collapsed .og-caret{transform:rotate(-90deg)}
.og-num{font-size:14px;font-weight:700;color:var(--text);font-family:var(--cond);font-variant-numeric:tabular-nums;letter-spacing:-0.01em;flex-shrink:0}
.og-cust{font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.04em;font-family:var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.og-meta{display:flex;gap:5px;align-items:center;flex-shrink:0}
.og-meta .tag{font-size:12px;padding:2px 7px}
.og-cards{display:flex;flex-direction:column;gap:0}
.og-cards.collapsed{display:none}

/* Job card — bigger, order# on the right is the visual anchor */
.job-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;align-items:center;gap:16px;padding:16px 18px;cursor:pointer;transition:border-color .12s,box-shadow .12s;margin-bottom:8px}
.job-card:hover{border-color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.job-card.flagged{border-color:var(--red-bd);background:var(--red-bg)}
.jc-thumb{width:80px;height:80px;border-radius:var(--radius);background:var(--bg);border:1px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.jc-thumb img{width:100%;height:100%;object-fit:cover}
.jc-thumb-ph{width:24px;height:24px;opacity:.2}
.jc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.jc-name{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--cond);color:var(--text)}
.jc-name.muted{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em}
.jc-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.jc-meta .tag{font-size:12px;padding:3px 9px}
.jc-imp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 1px}
.jc-imp-chip{font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:.03em;color:var(--text);background:var(--bg);border:1px solid var(--border-dk);border-radius:4px;padding:1px 9px;line-height:1.25}
.jc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;min-width:90px}
.jc-order{font-size:36px;font-weight:700;letter-spacing:-0.02em;color:var(--text);font-family:var(--cond);line-height:1}
.jc-status{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-family:var(--cond);color:var(--muted-lt)}
.jc-status.qcd{color:var(--green)}
.jc-status.complete{color:var(--green-dk)}

/* Status (kept for in-queue inline complete button) */
.status{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-family:var(--cond)}
.status.pending{color:var(--muted-lt)}
.status.qcd{color:var(--green);background:var(--green-lt);padding:2px 6px;border-radius:2px}
.status.complete{color:#fff;background:var(--green);padding:2px 6px;border-radius:2px}

/* Progress */
.prog-wrap{margin-bottom:10px}
.prog-txt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-family:var(--cond)}
.prog-bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}

/* QC detail */
.qc-wrap{padding:20px;max-width:none}
.qc-back{margin-bottom:14px}

/* ─── v121 COCKPIT ─────────────────────────────────────────────────
   Fit-to-viewport QC view. The page splits into stacked horizontal
   regions: order-strip (slim header with back + customer + order#),
   colorway-tabs (one tab per LI), cockpit body (proof left + tally
   right), cockpit footer (spoilage strip + submit bar). Only the
   tally area and proof area scroll internally; everything else is
   fixed-height to keep submit always visible. */
.qc-cockpit{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg);overflow:hidden}
.cp-order-strip{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0;min-height:50px}
.cp-back{padding:5px 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--border-dk);border-radius:20px;background:var(--surface);color:var(--muted);cursor:pointer;font-family:var(--cond);flex-shrink:0}
.cp-back:hover{border-color:var(--text);color:var(--text)}
.cp-order-info{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;overflow:hidden}
.cp-order-num{font-size:12px;color:var(--muted-lt);text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-family:var(--cond);flex-shrink:0}
.cp-order-name{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-family:var(--cond);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-order-chips{display:flex;gap:4px;flex-shrink:0;flex-wrap:nowrap}

/* Colorway tabs (visible when >1 colorway) */
.cp-cw-tabs{background:var(--bg-soft,#F8F8F5);border-bottom:1px solid var(--border);display:flex;padding:0 14px;gap:0;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.cp-cw-tabs::-webkit-scrollbar{display:none}
.cp-cw-tab{padding:8px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:none;border-bottom:2px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--cond);white-space:nowrap;flex-shrink:0}
.cp-cw-tab:hover{color:var(--text)}
.cp-cw-tab.on{background:var(--surface);color:var(--text);border-bottom-color:var(--text)}
.cp-cw-tab-ct{font-size:12px;padding:1px 6px;border-radius:8px;background:var(--border);color:var(--muted);font-family:var(--mono);font-weight:600}
.cp-cw-tab.on .cp-cw-tab-ct{background:var(--sb-bg);color:var(--yellow)}
.cp-cw-tab-dot{width:6px;height:6px;border-radius:3px;background:var(--red);flex-shrink:0}
.cp-cw-tab.counted .cp-cw-tab-dot{background:var(--green)}

/* Cockpit body — proof left, tally right */
.cp-body{flex:1;display:flex;min-height:0;background:var(--surface)}
.cp-left{width:38%;flex-shrink:0;background:var(--bg-soft,#F8F8F5);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px;gap:8px;min-height:0;overflow:hidden}
.cp-left-meta{flex-shrink:0;min-height:0}
.cp-meta-name{font-size:16px;font-weight:700;color:var(--text);font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-meta-sub{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* v136: extras chip — reuses the canonical yellow-on-dark .tag g, bumped a touch
   for across-the-table readability of the catcher's damage buffer. */
.cp-meta-extras{margin-top:6px}
.cp-meta-extras .tag{font-size:12px;padding:3px 9px}
.cp-proof{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;min-height:0;padding:8px}
.cp-proof img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain}
.cp-proof-ph{opacity:.15;width:48px;height:48px}

.cp-right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.cp-tally{flex:1;padding:10px 14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0}

/* Cockpit footer — spoilage strip + submit bar */
.cp-foot{flex-shrink:0;background:var(--bg-soft,#F8F8F5);border-top:1px solid var(--border);padding:6px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:38px}
.cp-foot-spoil{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.cp-foot-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-family:var(--cond)}
.cp-foot-pct{font-size:14px;font-weight:700;font-family:var(--mono)}
.cp-foot-pct.ok{color:var(--green)}.cp-foot-pct.warn{color:var(--amb)}.cp-foot-pct.bad{color:var(--red)}
.cp-foot-res{font-size:12px;padding:3px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-family:var(--cond)}
.cp-foot-res.ok{background:var(--green-lt);color:var(--green-dk)}
.cp-foot-res.warn{background:var(--amb-bg);color:var(--amb);border:1px solid var(--amb-bd)}
.cp-foot-res.bad{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.cp-foot-ctx{font-size:12px;color:var(--muted-lt);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
.cp-foot-run{font-size:12px;color:var(--muted);font-family:var(--mono);padding-left:8px;border-left:1px dashed var(--border-dk)}
.cp-submit{flex-shrink:0;background:var(--sb-bg);color:var(--yellow);border:none;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:14px 24px;cursor:pointer;font-family:var(--cond);min-width:160px;border-radius:0}
.cp-submit:hover:not(:disabled){background:#1A1A16}
.cp-submit:disabled{opacity:.4;cursor:not-allowed}
.cp-submit.complete{background:var(--green);color:#fff}
.cp-submit.complete:hover{background:var(--green-dk)}

/* iPad / narrow viewport: stack the cockpit body */
@media (max-width: 900px){
  .cp-body{flex-direction:column}
  .cp-left{width:100%;flex-direction:row;align-items:center;gap:10px;padding:8px 10px;border-right:none;border-bottom:1px solid var(--border);min-height:90px;max-height:120px;flex-shrink:0}
  .cp-left-meta{flex:1;min-width:0}
  .cp-proof{flex:0 0 100px;width:100px;min-height:0;padding:4px}
}
/* ─── END v121 COCKPIT ─────────────────────────────────────────── */

/* Colorway card — v110: horizontal split (mockup left, tally right) */
.cw-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:14px;display:flex;flex-direction:row}
.cw-card.counted{border-color:var(--green)}
.cw-card.active{border-color:var(--text);box-shadow:0 0 0 3px var(--yellow-dim)}

/* Left side: large mockup + meta */
.cw-left{width:42%;flex-shrink:0;background:var(--bg-soft,#F8F8F5);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:10px}
.cw-left-meta{flex-shrink:0}
.cw-meta-name{font-size:18px;font-weight:700;color:var(--text);font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-meta-sub{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:4px}
.cw-img{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;min-height:180px;padding:12px}
.cw-img img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain}
.cw-img-ph{opacity:.15;width:48px;height:48px}
.cw-img-hint{font-size:12px;color:var(--muted-lt);text-align:center;font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;flex-shrink:0}

/* Right side: tally controls */
.cw-right{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tally-bar{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1;overflow-y:auto}
.tb-banner{padding:18px;background:var(--yellow-dim);border:2px dashed var(--yellow-border);border-radius:var(--radius);text-align:center;font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.08em;font-family:var(--cond)}

/* Size picker row */
.tb-sz-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb-sz-lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--cond);flex-shrink:0}
.tb-sz-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tb-sz-chip{position:relative;min-width:54px;padding:8px 10px;border-radius:var(--radius);border:2px solid var(--border-dk);background:var(--surface);font-size:14px;font-weight:700;color:var(--text);font-family:var(--cond);cursor:pointer;text-align:center;line-height:1;transition:all .1s;user-select:none}
.tb-sz-chip:hover{border-color:var(--text)}
.tb-sz-chip.active{background:var(--sb-bg);border-color:var(--sb-bg);color:var(--yellow)}
.tb-sz-ord{display:block;font-size:12px;font-weight:600;color:var(--muted-lt);font-family:var(--mono);margin-top:2px}
.tb-sz-chip.active .tb-sz-ord{color:var(--yellow);opacity:.7}
/* v138: per-size extras marker inside the size box — green "+N" = spare pieces
   of that size (apparel only). Brightened on active (dark) chips for contrast. */
.tb-sz-ex{color:var(--green-md);font-weight:700}
.tb-sz-chip.active .tb-sz-ex{color:#8fe0ad;opacity:1}
.tb-spoil{font-size:14px;font-weight:700;font-family:var(--mono);padding:4px 10px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);flex-shrink:0}
.tb-spoil.ok{color:var(--green)}.tb-spoil.warn{color:var(--amb)}.tb-spoil.bad{color:var(--red)}

/* v118: Bandana need-to-print headline. Sits inside the tally bar, just above
   the size picker. Big dark-on-yellow when there's still work to do; flips to
   green "Order complete" when fully caught. */
.tb-bnd-head{background:var(--sb-bg);color:var(--yellow);border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tb-bnd-head.done{background:var(--green);color:#fff}
.tb-bnd-num{font-size:44px;font-weight:700;line-height:1;font-family:var(--mono)}
.tb-bnd-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;text-align:right;line-height:1.3;font-family:var(--cond);opacity:.75}
.tb-bnd-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:var(--radius)}
.tb-bnd-stat{display:flex;flex-direction:column;gap:2px}
.tb-bnd-stat-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-family:var(--cond)}
.tb-bnd-stat-val{font-size:18px;font-weight:700;color:var(--text);font-family:var(--mono);line-height:1}
.tb-bnd-stat-val.dmg{color:var(--red)}
.tb-bnd-stat-val.caught{color:var(--green)}

/* Caught row */
.tb-caught-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.tb-caught-lbl{font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.08em;font-family:var(--cond);min-width:60px;flex-shrink:0}
.tb-caught-btn{flex:0 0 auto;padding:10px 16px;border-radius:var(--radius);border:2px solid var(--green-dk);background:var(--green);color:#fff;font-size:13px;font-weight:700;font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;transition:transform .08s;user-select:none}
.tb-caught-btn:hover{background:var(--green-dk)}
.tb-caught-btn:active{transform:scale(.95)}
.tb-caught-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.tb-caught-input{flex:0 0 80px;padding:8px;font-size:18px;font-weight:700;text-align:center;border:1px solid var(--border-dk);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--mono);outline:none}
.tb-caught-input:focus{border-color:var(--green);background:#fff}
.tb-caught-input:disabled{opacity:.5;background:var(--bg)}
.tb-caught-mode{font-size:12px;color:var(--muted);font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.tb-caught-mode.manual{color:var(--amb)}

/* Bucket reason rows — buttons grow to fill row width via auto-fit grid */
.tb-bucket{display:flex;flex-direction:column;gap:6px}
.tb-bucket-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-family:var(--cond)}
.tb-bucket.print .tb-bucket-lbl{color:var(--red)}
.tb-bucket.other .tb-bucket-lbl{color:var(--amb)}
.tb-bucket.tbd .tb-bucket-lbl{color:var(--muted)}
.tb-rchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.tb-rbtn{position:relative;padding:12px;border-radius:var(--radius);border:2px solid;background:var(--surface);cursor:pointer;text-align:left;font-family:var(--cond);user-select:none;transition:transform .08s;display:flex;flex-direction:column;gap:4px;line-height:1.1;min-height:62px;outline:none;-webkit-tap-highlight-color:transparent}
.tb-rbtn:active{transform:scale(.96)}
.tb-rbtn:focus{outline:none}
.tb-rbtn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.tb-rbtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.tb-rbtn-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tb-rbtn-ct{font-size:22px;font-weight:700;font-family:var(--mono);line-height:1}
.tb-rbtn-ct.zero{opacity:.25}

/* v119: Minus pill for removing one of a tallied reason. Replaces the
   long-press gesture which was hard to land on iPad. Pill is positioned
   top-right of the chip, only rendered when count > 0. The pill's onclick
   stops propagation so a tap on the pill is unambiguously "remove one"
   rather than also firing the chip's "add one" handler. Sized 32×32 for
   reliable iPad touch (Apple HIG minimum is 44px but 32px works inside a
   colored chip where surrounding area gives the pill visual breathing room
   and the chip's own action is the fallback if a tap misses by a few px). */
.tb-rbtn-minus{position:absolute;top:5px;right:5px;width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.95);border:1.5px solid currentColor;color:inherit;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;line-height:1;cursor:pointer;padding:0;font-family:var(--cond);-webkit-tap-highlight-color:transparent;transition:transform .08s}
.tb-rbtn-minus:active{transform:scale(.9)}
.tb-rbtn-minus:focus{outline:none}
/* When chip is in has-count state (colored bg), pill becomes white with
   colored text via currentColor inherit. */
.tb-bucket.print .tb-rbtn.has-count .tb-rbtn-minus{background:#fff;color:var(--red);border-color:#fff}
.tb-bucket.other .tb-rbtn.has-count .tb-rbtn-minus{background:#fff;color:var(--amb);border-color:#fff}
.tb-bucket.tbd .tb-rbtn.has-count .tb-rbtn-minus{background:var(--yellow);color:var(--sb-bg);border-color:var(--yellow)}
.tb-bucket.print .tb-rbtn{border-color:var(--red-bd);color:var(--red);background:var(--surface)}
.tb-bucket.print .tb-rbtn:hover:not(:disabled){border-color:var(--red);background:var(--red-bg)}
.tb-bucket.print .tb-rbtn.has-count{background:var(--red);color:#fff;border-color:var(--red)}
.tb-bucket.print .tb-rbtn.has-count:hover{background:var(--red);color:#fff}
.tb-bucket.print .tb-rbtn.has-count:active{background:var(--red);color:#fff}
.tb-bucket.other .tb-rbtn{border-color:var(--amb-bd);color:var(--amb);background:var(--surface)}
.tb-bucket.other .tb-rbtn:hover:not(:disabled){border-color:var(--amb);background:var(--amb-bg)}
.tb-bucket.other .tb-rbtn.has-count{background:var(--amb);color:#fff;border-color:var(--amb)}
.tb-bucket.other .tb-rbtn.has-count:hover{background:var(--amb);color:#fff}
.tb-bucket.other .tb-rbtn.has-count:active{background:var(--amb);color:#fff}
.tb-bucket.tbd .tb-rbtn{border-color:var(--border-dk);color:var(--muted);flex-direction:row;align-items:center;justify-content:space-between;background:var(--surface)}
.tb-bucket.tbd .tb-rbtn:hover:not(:disabled){border-color:var(--text);background:var(--bg)}
.tb-bucket.tbd .tb-rbtn.has-count{background:var(--sb-bg);color:var(--yellow);border-color:var(--sb-bg)}
.tb-bucket.tbd .tb-rbtn.has-count:hover{background:var(--sb-bg);color:var(--yellow)}
.tb-bucket.tbd .tb-rbtn.has-count:active{background:var(--sb-bg);color:var(--yellow)}
.tb-bucket.tbd .tb-rbtn-ct{margin-left:auto;font-size:18px}

/* Toolbar (undo + tbd warning) */
.tb-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px;border-top:1px solid var(--border);flex-shrink:0}
.tb-undo{padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border-dk);background:var(--surface);color:var(--text);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-family:var(--cond);cursor:pointer}
.tb-undo:hover:not(:disabled){border-color:var(--text);background:var(--bg)}
.tb-undo:disabled{opacity:.35;cursor:not-allowed}
.tb-tbd-warn{font-size:12px;font-weight:700;color:var(--amb);font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em}

/* Summary table — read-only derived view */
.cw-summary{padding:10px 14px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.cw-sum-tbl{width:100%;border-collapse:collapse;font-family:var(--cond)}
.cw-sum-tbl thead th{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:right;padding:4px 6px;border-bottom:1px solid var(--border)}
.cw-sum-tbl thead th:first-child{text-align:left}
.cw-sum-tbl thead th.print{color:var(--red)}
.cw-sum-tbl thead th.other{color:var(--amb)}
.cw-sum-tbl thead th.tbd{color:var(--muted)}
.cw-sum-tbl tbody td{font-size:13px;font-weight:700;color:var(--text);text-align:right;padding:4px 6px;border-bottom:1px solid var(--bg);font-family:var(--mono)}
.cw-sum-tbl tbody td:first-child{text-align:left;font-family:var(--cond);font-size:14px}
.cw-sum-tbl tbody td.muted{color:var(--muted-lt)}
.cw-sum-tbl tbody td.print{color:var(--red)}
.cw-sum-tbl tbody td.other{color:var(--amb)}
.cw-sum-tbl tbody td.tbd{color:var(--muted)}
.cw-sum-tbl tbody tr.active-row td{background:var(--yellow-dim)}
.cw-sum-tbl tbody tr:last-child td{border-bottom:none}
.cw-sum-tbl tfoot td{font-size:13px;font-weight:700;font-family:var(--mono);text-align:right;padding:6px;border-top:2px solid var(--border)}
.cw-sum-tbl tfoot td:first-child{text-align:left;font-family:var(--cond);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* Notes — moved into cw-right */
.cw-right .notes-wrap{padding:10px 14px;background:var(--bg);border-top:1px solid var(--border);flex-shrink:0}

/* Responsive: iPad portrait + narrow viewports — stack vertically */
@media (max-width: 760px){
  .cw-card{flex-direction:column;min-height:auto}
  .cw-left{width:100%;border-right:none;border-bottom:1px solid var(--border);flex-direction:row;align-items:center;gap:14px;padding:12px}
  .cw-left-meta{flex:1;min-width:0}
  .cw-img{flex:0 0 140px;min-height:140px;max-height:140px;width:140px}
  .cw-img-hint{display:none}
}

/* TBD note modal — pops at TBD tap time */
.tn{display:none;position:fixed;inset:0;z-index:230;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px}
.tn.open{display:flex}
.tn-card{background:var(--surface);border-radius:var(--radius-lg);max-width:460px;width:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.tn-hdr{padding:14px 18px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-family:var(--cond)}
.tn-body{padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.tn-lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--cond)}
.tn-input{width:100%;padding:10px;font-size:14px;border:1px solid var(--border-dk);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--sans);outline:none}
.tn-input:focus{border-color:var(--green)}
.tn-ftr{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.tn-ftr button{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-family:var(--cond);padding:8px 16px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border-dk);background:var(--surface);color:var(--text)}
.tn-ftr button.primary{background:var(--sb-bg);border-color:var(--sb-bg);color:var(--yellow)}
.tn-ftr button.primary:hover{background:#1A1A16}

/* TBD resolution modal — pops at submit time, before sm preview */
.tr-section{background:var(--bg-soft,#F8F8F5);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.tr-section-hdr{font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.08em;font-family:var(--cond);margin-bottom:6px}
.tr-events{font-size:12px;color:var(--muted);font-family:var(--mono);margin-bottom:8px;line-height:1.5}
.tr-event{padding:2px 0}
.tr-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tr-row label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--cond)}
.tr-sel{padding:6px 8px;font-size:12px;border:1px solid var(--border-dk);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--cond);font-weight:700;cursor:pointer}

/* Spoilage */
.spoil-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.spoil-lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--cond)}
.spoil-pct{font-size:26px;font-weight:700;line-height:1;font-family:var(--mono)}
.spoil-pct.ok{color:var(--green)}.spoil-pct.warn{color:var(--amb)}.spoil-pct.bad{color:var(--red)}
.spoil-bar-wrap{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-bottom:8px}
.spoil-bar{height:100%;border-radius:2px;transition:width .3s}
.spoil-bar.ok{background:var(--green)}.spoil-bar.warn{background:var(--amb)}.spoil-bar.bad{background:var(--red)}
.res-badge{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-family:var(--cond)}
.res-ok{color:var(--green)}
.res-warn{color:var(--amb)}
.res-bad{color:var(--red)}

/* Actions row */
/* v120: sticky to viewport bottom so catchers don't have to scroll to find
   Submit. Pinned above the preview-mode statusbar (which is 28px at body
   bottom when WRITES_ENABLED=false; the .preview-badge gets display:none
   when writes are on, so the sticky bar sits flush with the bottom edge in
   production). The matching body padding-bottom below reserves space so the
   sticky bar never overlaps card content. */
.act-row{position:fixed;left:0;right:0;bottom:28px;z-index:80;margin:0;background:var(--bg);border-top:1px solid var(--border-dk);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
body.writes-on .act-row{bottom:0}
.boxing-wrap{padding:14px 16px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.box-header{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.box-order{font-size:12px;color:var(--muted);font-family:var(--cond);margin-bottom:3px;letter-spacing:.08em;text-transform:uppercase;}
.box-name{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--text);font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em;}
.box-chips{display:flex;gap:6px;flex-wrap:wrap;}
.box-edit-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.box-edit-head{padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.box-edit-title{font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.08em;font-family:var(--cond);}
.box-size-sel{font-size:12px;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--cond);}
.box-del-btn{font-size:12px;padding:3px 8px;border-radius:3px;border:1px solid var(--red-bd);background:transparent;color:var(--red);cursor:pointer;font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.box-add-btn{font-size:12px;padding:10px;border-radius:0;border:none;border-top:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;width:100%;text-align:center;font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.box-add-btn:hover{color:var(--text);}
.box-tot{padding:8px 14px;background:var(--bg);border-top:1px solid var(--border);font-size:12px;font-family:var(--cond);color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.bsi{width:44px;font-size:12px;padding:3px 4px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--mono);text-align:center;}
.bsi:focus{outline:none;border-color:var(--green);background:var(--surface);}
.mv{font-size:12px;padding:1px 5px;border-radius:3px;border:1px solid var(--border);background:var(--bg);cursor:pointer;color:var(--muted);font-weight:700;}
.mv:hover{color:var(--text);}
.btn-print{padding:14px;border-radius:0;border:none;background:var(--sb-bg);color:var(--yellow);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;width:100%;font-family:var(--cond);}
.btn-print:hover{background:var(--sb-active);}
.btn-skip{padding:12px;border-radius:0;border:none;border-top:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;width:100%;font-family:var(--cond);}
.btn-skip:hover{color:var(--text);}
.imp-header{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);border-top:2px solid var(--border);margin-top:4px;}
.imp-header:first-of-type{border-top:none;margin-top:0;}
.imp-id{font-family:var(--mono);color:var(--text);font-size:12px;font-weight:700;}
.imp-loc{background:var(--surface2);border-radius:4px;padding:2px 7px;font-size:12px;font-weight:600;}
.submit-bar{width:100%;background:var(--sb-bg);color:var(--yellow);border:none;border-radius:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:14px;cursor:pointer;font-family:var(--cond);display:block;text-align:center}

<script>
// ═══ v146 — PRACTICE MODE (?practice=1) ═══════════════════════════════════
// Reads LIVE Airtable data; every POST/PATCH/DELETE is answered here with a fake
// success and never leaves the iPad. Practice "writes" go into a local overlay so the
// app behaves like it really saved (Caught hides cards, issues get ids, reloads work).
// Practice keeps its own tallies / written-issue keys, so it can't disturb real catching.
var PRACTICE=/[?&]practice=1\b/.test(location.search);
(function(){
  if(!PRACTICE)return;
  var sp=Storage.prototype, gI=sp.getItem, sI=sp.setItem, rI=sp.removeItem;
  function k(key){ return (typeof key==='string' && key.indexOf('pine_catch_')===0) ? 'pine_practice_catch_'+key.slice(11) : key; }
  sp.getItem=function(key){ return gI.call(this,k(key)); };
  sp.setItem=function(key,v){ return sI.call(this,k(key),v); };
  sp.removeItem=function(key){ return rI.call(this,k(key)); };
  var OV_KEY='pine_practice_catch_overlay';
  function loadOv(){ try{ var o=JSON.parse(gI.call(localStorage,OV_KEY)||'null'); if(o&&o.p&&o.c)return o; }catch(e){} return {p:{},c:{},d:{},n:0}; }
  function saveOv(o){ try{ sI.call(localStorage,OV_KEY,JSON.stringify(o)); }catch(e){} }
  window.practiceReset=function(){
    if(!confirm('Reset practice? This clears practice tallies and everything practice "saved". Real Airtable data is never touched.'))return;
    try{ Object.keys(localStorage).forEach(function(x){ if(x.indexOf('pine_practice_catch_')===0)rI.call(localStorage,x); }); }catch(e){}
    location.reload();
  };
  function merge(rec,o){ if(rec&&rec.id&&o.p[rec.id]){ rec.fields=rec.fields||{}; for(var f in o.p[rec.id])rec.fields[f]=o.p[rec.id][f]; } return rec; }
  function J(obj,status){ return new Response(JSON.stringify(obj),{status:status||200,headers:{'Content-Type':'application/json'}}); }
  var realFetch=window.fetch.bind(window);
  window.fetch=async function(input,init){
    var url=typeof input==='string'?input:(input&&input.url)||'';
    var method=((init&&init.method)||(input&&input.method)||'GET').toUpperCase();
    if(url.indexOf('https://api.airtable.com/')!==0)return realFetch(input,init);
    var parts=(url.split('?')[0].split('/v0/')[1]||'').split('/'), recId=parts[2]||null;
    var o=loadOv(), body=null; try{ body=init&&init.body?JSON.parse(init.body):null; }catch(e){}
    if(method!=='GET'){
      console.log('[PRACTICE] blocked '+method+' '+parts.slice(1).join('/'), body);
      if(method==='DELETE'){ if(recId){o.d[recId]=1;delete o.c[recId];saveOv(o);} return J({id:recId,deleted:true}); }
      function mk(fields){ var id='recPRACTICE'+(++o.n)+'x'; o.c[id]={id:id,createdTime:new Date().toISOString(),fields:fields||{},table:parts[1]}; return o.c[id]; }
      if(body&&Array.isArray(body.records)){
        var out=body.records.map(function(r){ if(r.id){ o.p[r.id]=Object.assign(o.p[r.id]||{},r.fields||{}); return merge({id:r.id,fields:{}},o);} return mk(r.fields); });
        saveOv(o); return J({records:out});
      }
      if(method==='PATCH'&&recId){ o.p[recId]=Object.assign(o.p[recId]||{},(body&&body.fields)||{}); if(o.c[recId])Object.assign(o.c[recId].fields,(body&&body.fields)||{}); saveOv(o); return J(merge({id:recId,fields:{}},o)); }
      var c=mk(body&&body.fields); saveOv(o); return J(c);
    }
    if(recId&&o.c[recId])return J(o.c[recId]);
    var res=await realFetch(input,init); if(!res.ok)return res;
    var data; try{ data=await res.clone().json(); }catch(e){ return res; }
    if(data&&Array.isArray(data.records)){
      data.records=data.records.filter(function(r){return !o.d[r.id];}).map(function(r){return merge(r,o);});
      if(!data.offset)Object.keys(o.c).forEach(function(id){ var c=o.c[id]; if(c.table===parts[1]&&url.indexOf(id)!==-1&&!data.records.some(function(r){return r.id===id;}))data.records.push(c); });
    }else if(data&&data.id){ merge(data,o); }
    return J(data,res.status);
  };
})();
</script>

#practiceBar{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:9800;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;border-radius:24px;background:var(--yellow,#E8E832);color:#0A0A08;font:700 12px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap;}
#practiceBar.inbar{position:static;transform:none;box-shadow:none;margin-left:auto;padding:5px 6px 5px 12px;font-size:12px}
#practiceBar button{font:700 12px/1 var(--cond);letter-spacing:.07em;text-transform:uppercase;background:#0A0A08;color:#E8E832;border:none;border-radius:16px;padding:7px 11px;cursor:pointer;}
body.practice .press-bar{box-shadow:inset 0 -3px 0 #E8E832;}
/* v146 — bigger tap targets for the floor (press tabs + small buttons were 9–10px) */
.pt{font-size:12px!important;padding:9px 14px!important;}
/* v150 — six press tabs (Heat Press added in v149) fit on a landscape iPad */
@media(max-width:1300px){.pt{font-size:12px!important;padding:8px 9px!important;letter-spacing:.03em!important}.press-tabs{gap:4px}}
.btn{font-size:12px!important;padding:9px 12px!important;}
.cp-back{font-size:12px!important;padding:9px 14px!important;}
@media(max-width:640px){
  .press-bar{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tb-caught-row{flex-wrap:wrap;}
  .tb-caught-input{min-width:0;flex:1 1 120px;width:auto;max-width:100%;}
}
.resume-note{display:inline-block;margin-left:8px;font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:#1e6b45;}

/* ═══ v147 — WORK SCREEN: big proof · one tap lane (size → reason → checked → Done) · piles on the right ═══ */
.cw{display:flex;flex-direction:row-reverse;gap:10px;padding:10px;height:calc(100vh - var(--cw-top,64px));height:calc(100dvh - var(--cw-top,64px));box-sizing:border-box}
body.cw-flip .cw{flex-direction:row}
.cw-rail{width:215px;flex-shrink:0;background:#fff;border:1px solid var(--border-dk);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.cw-rh{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border);font:700 12px var(--cond);letter-spacing:.1em;text-transform:uppercase}
.cw-rh button{font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:14px;border:1px solid var(--border-dk);background:#fff;cursor:pointer}
.cw-rl{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.cw-og{margin-bottom:10px}
.cw-ogh{display:flex;align-items:center;gap:6px;margin:2px 4px 6px;font:700 12px var(--cond)}
.cw-ogh .n{font-size:14px}.cw-ogh .c{color:var(--muted);text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-ogh .p{font-size:12px;padding:2px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--border)}
.cw-ogh .p.ok{background:#e8f5ee;color:#1e6b45;border-color:#b8dfcc}
.cw-pc{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px;border:1px solid var(--border);border-radius:8px;background:#fff;margin-bottom:6px;cursor:pointer;font-family:var(--cond)}
.cw-pc.on{background:#0A0A08;color:#fff;border-color:#0A0A08;box-shadow:inset 4px 0 0 #E8E832}
.cw-pc.dn{opacity:.5;background:var(--bg)}
.cw-pc .t{width:40px;height:40px;border-radius:5px;background:var(--bg);flex-shrink:0;overflow:hidden}.cw-pc .t img{width:100%;height:100%;object-fit:cover}
.cw-pc .nm{font:700 13px/1.15 var(--cond);text-transform:uppercase}
.cw-pc .mt{font:400 12px/1.2 var(--cond);color:var(--muted);margin-top:2px}.cw-pc.on .mt{color:#bbb}
.cw-pc .tg{margin-left:auto;font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:3px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.cw-pc .tg.d{background:#fdf2f2;color:#c0392b}.cw-pc .tg.k{background:#e8f5ee;color:#1e6b45}
.cw-pile{flex:1;min-width:0;background:#fff;border:1px solid var(--border-dk);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cw-ph{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.cw-ph .i{flex:1;min-width:0}
.cw-ph .o{font:700 12px var(--cond);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.cw-ph .tt{font:700 18px/1.1 var(--cond);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-chip{font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:3px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.cw-chip.ship{background:#fff3e0;color:#9a5a00;border-color:#f3d19c}.cw-chip.pick{background:#e8f5ee;color:#1e6b45;border-color:#b8dfcc}
.cw-chip.warn{background:#fdf2f2;color:#c0392b;border-color:#f5c6c6}.cw-chip.rp{background:#fffbeb;color:#b7791f;border-color:#fde68a}
.cw-tabs{display:flex;gap:6px;padding:6px 12px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.cw-tabs button{font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:16px;border:1px solid var(--border-dk);background:#fff;cursor:pointer;white-space:nowrap}
.cw-tabs button.on{background:#0A0A08;color:#E8E832;border-color:#0A0A08}
.cw-wk{flex:1;min-height:0;display:flex}
.cw-proof{width:50%;max-width:none;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:#fff}
.cw-proof .im{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;cursor:zoom-in}
.cw-proof .im img{max-width:100%;max-height:100%;object-fit:contain}
.cw-proof .im .ph{color:var(--muted);font:700 12px var(--cond);text-transform:uppercase;letter-spacing:.08em}
.cw-proof .cap{padding:6px;border-top:1px solid var(--border);text-align:center;font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cw-lane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.cw-pb{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cw-lbl{display:flex;justify-content:space-between;align-items:center;font:700 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.cw-lbl button{font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:14px;border:1px solid #1e6b45;color:#1e6b45;background:#fff;cursor:pointer}
.cw-sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:8px}
.cw-sz{min-height:64px;padding:6px;border-radius:9px;border:2px solid var(--border-dk);background:#fff;text-align:center;cursor:pointer;font-family:var(--cond)}
.cw-sz b{display:block;font:700 20px var(--cond)}.cw-sz span{font:400 12px var(--cond);color:var(--muted)}.cw-sz i{font-style:normal;color:#1e6b45;font-weight:700}
.cw-sz em{display:block;font:700 12px var(--cond);font-style:normal;color:#c0392b}
.cw-sz.on{background:#0A0A08;border-color:#0A0A08;color:#E8E832}.cw-sz.on span{color:#ccc}.cw-sz.on em{color:#ff8c7a}
.cw-rz{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.cw-rz>div{flex:1;min-height:0;display:flex;flex-direction:column}
.cw-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(58px,1fr);gap:8px}
/* v149 — embroidery has 8 team reasons: 4 across so they fit in two rows */
.cw-grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* v148 — reasons always on screen: faded until a size is picked (shows the pile total per reason) */
.cw-rb.off{opacity:.45}
.cw-rb.off .c{font-size:18px}
@keyframes cwPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px #E8E832}}
.cw-sizes.need .cw-sz{animation:cwPulse .5s ease 2}
.cw-need{color:#b7791f}
.cw-rb{position:relative;text-align:left;padding:9px 10px;border-radius:9px;border:2px solid #f5c6c6;background:#fff;cursor:pointer;font-family:var(--cond);-webkit-user-select:none;user-select:none}
.cw-rb .n{font:700 13px/1.1 var(--cond);letter-spacing:.03em;text-transform:uppercase;color:#c0392b}
.cw-rb .c{font:700 26px var(--cond);color:#efc2bd;margin-top:2px}
.cw-rb.o{border-color:#fde68a}.cw-rb.o .n{color:#b7791f}.cw-rb.o .c{color:#f1dca5}
.cw-rb.u{border-color:var(--border-dk)}.cw-rb.u .n{color:#555}.cw-rb.u .c{color:#ccc}
.cw-rb.has{background:#c0392b;border-color:#c0392b}.cw-rb.o.has{background:#b7791f;border-color:#b7791f}.cw-rb.u.has{background:#555;border-color:#555}
.cw-rb.has .n,.cw-rb.has .c{color:#fff!important}
.cw-rb.ud{border:2px dashed var(--border-dk);background:var(--bg)}.cw-rb.ud .n{color:var(--muted)}
.cw-rb:disabled{opacity:.4}
.cw-mn{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:#fff;color:#c0392b;font:700 20px/30px var(--cond);text-align:center}
.cw-rb.o .cw-mn{color:#b7791f}.cw-rb.u .cw-mn{color:#555}
.cw-hint{padding:10px;text-align:center;color:var(--muted);font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;border:2px dashed var(--border-dk);border-radius:9px}
.cw-bnd{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;background:#0A0A08;color:#E8E832;font:700 13px var(--cond);text-transform:uppercase;letter-spacing:.04em}
.cw-bnd b{font-size:26px}
.cw-end{border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:#fafaf7;flex-shrink:0}
.cw-locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.cw-loc{font:700 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:13px 8px;border-radius:9px;border:2px solid var(--border-dk);background:#fff;color:var(--muted);cursor:pointer}
.cw-loc.on{background:#e8f5ee;color:#1e6b45;border-color:#7cc3a0}
.cw-loc small{display:block;font:400 12px var(--cond);letter-spacing:0;margin-top:2px}
.cw-er{display:flex;gap:8px;align-items:stretch}
.cw-rev{font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:0 14px;border-radius:9px;border:1px solid var(--border-dk);background:#fff;cursor:pointer}
.cw-done{flex:1;font:700 16px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:14px 16px;border-radius:10px;border:none;background:#0A0A08;color:#E8E832;cursor:pointer;touch-action:manipulation}
.cw-done small{display:block;font:700 12px var(--cond);letter-spacing:.04em;text-transform:none;color:#cfcfc8;margin-top:3px}
.cw-done small .b{color:#ff8c7a}
.cw-done.working{opacity:.6;pointer-events:none}
.cw-empty{margin:auto;text-align:center;color:var(--muted);font:700 13px var(--cond);text-transform:uppercase;letter-spacing:.08em}
.cw-oc{position:fixed;inset:0;background:rgba(10,10,8,.72);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px}
.cw-occ{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:24px;text-align:center;font-family:var(--cond)}
.cw-occ .big{font:700 40px var(--cond);margin:4px 0}
.cw-occ .st{display:inline-block;font:700 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:20px;margin:8px 0;background:#fff3e0;color:#9a5a00}
.cw-occ .st.pk{background:#e8f5ee;color:#1e6b45}.cw-occ .st.w{background:#fdf2f2;color:#c0392b}
.cw-occ p{font:400 14px/1.45 var(--cond);color:var(--muted);margin:6px 0 14px}
.cw-occ .r{display:flex;gap:10px}.cw-occ .r button{flex:1;padding:14px;border-radius:10px;font:700 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.cw-occ .r .a{border:1px solid var(--border-dk);background:#fff}.cw-occ .r .b{border:none;background:#0A0A08;color:#E8E832}
.cw-occ .u{margin-top:10px;width:100%;padding:11px;border-radius:9px;border:1px dashed var(--border-dk);background:transparent;color:var(--muted);font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.cw-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0A0A08;color:#fff;font:700 13px var(--cond);padding:12px 16px;border-radius:10px;z-index:9100;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.cw-toast button{background:none;border:1px solid #E8E832;color:#E8E832;border-radius:16px;padding:7px 12px;font:700 12px var(--cond);text-transform:uppercase;cursor:pointer}
@media(max-width:1000px) and (orientation:portrait){
  .cw,body.cw-flip .cw{flex-direction:column}
  .cw-rail{width:auto;max-height:150px;flex:none}
  .cw-rl{display:flex;gap:8px;overflow-x:auto;overflow-y:auto;align-items:flex-start}.cw-og{min-width:250px}
  .cw-rail{max-height:190px}
  .cw-wk{flex-direction:column}.cw-proof{width:auto;max-width:none;flex:1;min-height:220px;border-right:none;border-bottom:1px solid var(--border)}
  .cw-lane{flex:none}.cw-pb{flex:none;overflow:visible}.cw-rz,.cw-rz>div{flex:none}.cw-grid,.cw-grid.c4{max-height:none;grid-template-columns:repeat(6,1fr);grid-auto-rows:84px}
}
@media(max-width:640px){
  .cw,body.cw-flip .cw{flex-direction:column;height:auto;padding:8px}
  .cw-rail{max-height:none}.cw-rl{display:block}
  .cw-wk{flex-direction:column}.cw-proof{width:auto;max-width:none;height:280px;flex:none;border-right:none;border-bottom:1px solid var(--border)}
  .cw-grid,.cw-grid.c4{grid-template-columns:repeat(3,1fr);max-height:none;grid-auto-rows:76px}.cw-rz,.cw-rz>div{flex:none}
  .cw-end{position:sticky;bottom:0;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
}
.cw-pc .tg.w{background:var(--p-cream,#EFE2CD);color:var(--p-black,#141412);font-weight:700;white-space:nowrap}   /* v163 */
</style>
</head>

// Global long-press handler for tally reason buttons (touch + mouse).
// Fires the button's oncontextmenu attribute as a function-string, which is
// where we wired longPressReason()/longPressTBD(). 700ms hold = long press.
// Standard right-click oncontextmenu still works for desktop fallback.
function installLongPressHandler(){
  if(window.__pineLPInstalled)return;
  window.__pineLPInstalled=true;
  var pressTimer=null;
  var pressTarget=null;
  function start(e){
    var btn=e.target.closest('.tb-rbtn');
    if(!btn)return;
    // v119: if the touch landed on the minus pill, skip the long-press timer.
    // The pill has its own onclick that calls the same remove handler — letting
    // both fire would double-decrement.
    if(e.target.closest('.tb-rbtn-minus'))return;
    var ctxAttr=btn.getAttribute('oncontextmenu');
    if(!ctxAttr)return;
    pressTarget=btn;
    pressTimer=setTimeout(function(){
      // Trigger the long-press handler. The attribute is a JS expression
      // including event.preventDefault() — we eval it in a safe-ish way.
      // Use Function constructor to evaluate in global scope.
      try{
        // Strip the leading "event.preventDefault();" if present, since we don't
        // have a real event here. Then run the rest.
        var src=ctxAttr.replace(/^event\.preventDefault\(\);?/,'');
        new Function(src)();
        // Visual feedback
        if(navigator.vibrate)navigator.vibrate(40);
      }catch(err){console.error('long-press error',err);}
      pressTimer=null;
      pressTarget=null;
    },700);
  }
  function cancel(){
    if(pressTimer){clearTimeout(pressTimer);pressTimer=null;pressTarget=null;}
  }
  document.addEventListener('touchstart',start,{passive:true});
  document.addEventListener('touchend',cancel);
  document.addEventListener('touchcancel',cancel);
  document.addEventListener('touchmove',cancel);
  document.addEventListener('mousedown',start);
  document.addEventListener('mouseup',cancel);
  document.addEventListener('mouseleave',cancel);
}

// Reload today's jobs from Airtable WITHOUT wiping in-progress qcState.
// qcState keys by job.id (v112: composite "orderNum:lineItemId"), so counts
// stay intact when the same line items come back. If a job disappeared
// (e.g. rescheduled), its state is orphaned but harmless.
// v154: iPads keep a home-screen app open for days, so they can miss new versions. Check what
// pine-catching.html points to (on Refresh, when the app comes back to the front, and every 15 min).
// Newer -> reload into it when nothing is mid-catch; otherwise show an "Update" button.
var APP_VER=163;
// v159: "busy" = someone is mid-task. Tallies already survive a reload (v146), so an open job alone is NOT busy
// (v154-158 treated it as busy, and the work screen always has a job open, so iPads never moved up by themselves).
var _lastTap=0;

  try{
    if(_pendingDone||(typeof smBusy!=='undefined'&&smBusy)) return true;                       // Undo window open / save in flight
    if(document.getElementById('slipOverlay')||document.getElementById('cwOc')) return true;  // packing slip / order card up

    var a=document.activeElement; if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&String(a.value||'').trim()) return true;  // typing
    return Date.now()-_lastTap<3*60*1000;                                                     // tapped in the last 3 minutes
