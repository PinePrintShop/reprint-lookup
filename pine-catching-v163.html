// ─── API ──────────────────────────────────────────────────────────────
function api(path,_acc,_n){
  return fetch('https://api.airtable.com/v0/'+BASE+'/'+path,{
    headers:{Authorization:'Bearer '+pat}
  }).then(function(r){
    if(!r.ok)return r.json().then(function(j){throw new Error(j.error?j.error.message:'HTTP '+r.status);});
    return r.json();
  }).then(function(j){
    // v146 — list reads follow Airtable's offset (it pages at 100). Today's imprints, line
    // items and orders past the first page used to vanish without a word on busy days.
    if(j&&Array.isArray(j.records)&&(_acc||j.offset)){
      var all=(_acc||[]).concat(j.records), n=(_n||0)+1;
      if(j.offset&&n<20){
        var base=path.replace(/([?&])offset=[^&]*&?/,'$1').replace(/[?&]$/,'');
        return api(base+(base.indexOf('?')>=0?'&':'?')+'offset='+encodeURIComponent(j.offset),all,n);
      }
      return {records:all};
    }
    return j;
  });
}

// ─── HELPERS ──────────────────────────────────────────────────────────
function getOrderNum(f){
  var v=f[F.orderNum];
  if(v&&v.valuesByLinkedRecordId){var vals=Object.values(v.valuesByLinkedRecordId);if(vals.length&&vals[0]&&vals[0].length)return String(vals[0][0]);}
  var m=(f[F.imprintId]||'').match(/^(\d+)/);return m?m[1]:'--';
}
function getDue(f){
  var v=f[F.due];
  if(v&&v.valuesByLinkedRecordId){var vals=Object.values(v.valuesByLinkedRecordId);if(vals.length&&vals[0]&&vals[0].length)return String(vals[0][0]);}
  return '';
}
function getProofs(f){
  var raw=f[F.proofs],out=[];
  function ex(a){if(a&&a.url)out.push({url:a.url,thumb:(a.thumbnails&&a.thumbnails.large&&a.thumbnails.large.url)||null,filename:a.filename||''});}
  if(!raw)return out;
  if(raw.valuesByLinkedRecordId)Object.values(raw.valuesByLinkedRecordId).forEach(function(arr){if(Array.isArray(arr))arr.forEach(ex);});
  else if(Array.isArray(raw))raw.forEach(ex);
  return out;
}
function parseSizes(str){
  if(!str)return[];
  return str.split(',').map(function(p){var m=p.trim().match(/^(\d+)\s+(.+)$/);return m?{size:m[2].trim(),qty:parseInt(m[1])}:null;}).filter(Boolean);
}
function fmtDate(d){
  if(!d)return'';
  try{return new Date(String(d).includes('T')?d:d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}catch(e){return String(d);}
}
// v163: "from Tue 10/14" (carried over) / "sched. Thu 10/22" (early) for jobs not scheduled today
function whenTag(iso){
  if(!iso)return'';
  var d=new Date(iso); if(isNaN(d))return'';
  var t=new Date(); t.setHours(0,0,0,0); var dd=new Date(d); dd.setHours(0,0,0,0);
  if(dd.getTime()===t.getTime())return'';
  var lbl=d.toLocaleDateString('en-US',{weekday:'short'})+' '+(d.getMonth()+1)+'/'+d.getDate();
  return (dd<t?'from ':'sched. ')+lbl;
}
function jobsFor(m){
  if(m.id==='all')return jobs.filter(function(j){return j.status!=='complete';});
  return jobs.filter(function(j){return (m.match?String(j.press||'').toLowerCase().indexOf(m.match)>=0:j.press===m.key)&&j.status!=='complete';});
}

// ─── LOAD ─────────────────────────────────────────────────────────────
function load(){
  render('<div class="loading"><div class="spin"></div>Loading jobs…</div>');
  var flds=Object.values(F).map(function(id){return'fields%5B%5D='+id;}).join('&');
  // v163: Embroidery + Heat Press carry over until caught (any earlier day, up to 3 days early), minus finished orders
  var isEH='OR(FIND("embroid",LOWER({'+F.press+'}&"")),FIND("heat",LOWER({'+F.press+'}&"")))';
  var ost='ARRAYJOIN({'+ORDER_STATUS_LOOKUP+'})';
  var carry='AND('+isEH+',NOT({'+F.caught+'}),{'+F.startTime+'}!="",IS_BEFORE({'+F.startTime+"},DATEADD(NOW(),3,'days')),"
    +'NOT(OR('+ost+'="Completed",'+ost+'="Cancelled / Voided",FIND("Shipped",'+ost+')>0,FIND("Awaiting Ship",'+ost+')>0)))';
  var caughtToday='AND('+isEH+',{'+F.caught+'},DATETIME_FORMAT(SET_TIMEZONE({'+F.caughtAt+"},'America/Denver'),'YYYYMMDD')=DATETIME_FORMAT(SET_TIMEZONE(NOW(),'America/Denver'),'YYYYMMDD'))";
  var today='{'+F.isToday+'}=1', deep=DEEP.job?",RECORD_ID()='"+DEEP.job+"'":'';
  var qFor=function(fml){ return 'filterByFormula='+encodeURIComponent(fml)+'&'+flds
    +'&sort%5B0%5D%5Bfield%5D='+F.startTime+'&sort%5B0%5D%5Bdirection%5D=asc&pageSize=100&returnFieldsByFieldId=true'; };
  var imprintsLoad=api(TI+'?'+qFor('OR('+today+','+carry+','+caughtToday+deep+')')).catch(function(e){
    console.warn('[v163] carry-over query failed, loading today only:', e&&e.message);
    return api(TI+'?'+qFor(deep?'OR('+today+deep+')':today));
  });
  Promise.all([imprintsLoad,fetchReprintIssues()]).then(function(__res){
    var data=__res[0];REPRINT_BY_LI=__res[1]||{};
    // Group imprints by order number
    var om={},cm={};
    (data.records||[]).forEach(function(r){
      var f=r.fields;
      var pv=f[F.press],press=typeof pv==='string'?pv:(pv&&pv.name)||'';
      // Skip presses not in catching queue
      var pl=press.toLowerCase();if(SKIP_PRESS.some(function(s){return pl.includes(s);}))return;
      var lv=f[F.loc],loc=typeof lv==='string'?lv:(lv&&lv.name)||'';
      var on=getOrderNum(f);
      var sizes=parseSizes(f[F.sizeList]||'');
      var qty=sizes.reduce(function(s,x){return s+x.qty;},0);
      if(!qty)qty=Math.round(f[F.qty]||f[F.totalSch]||f[F.totalAllTime]||0);
      // Get the order record ID from the linked field
      var orderLink=f[F.orderNum];
      var orderRecId=orderLink&&orderLink.linkedRecordIds?orderLink.linkedRecordIds[0]:null;
      // Collect Line Item record IDs from this imprint.
      // v0 REST API returns multipleRecordLinks as bare string arrays: ["recXXX", "recYYY"].
      // MCP returns objects: [{id:"recXXX", name:"..."}]. Handle both shapes.
      var liLinks=f[F.lineItems]||[];
      var liIdsForImprint=Array.isArray(liLinks)?liLinks.map(function(x){
        return (typeof x==='string')?x:(x&&x.id)||'';
      }).filter(Boolean):[];
      // Catching unit = one Line Item = one physical pile of garments.
      // An imprint can link to multiple line items (e.g. 9817-B prints Back
      // on TWO different garments → contributes to TWO cards). An imprint
      // can also be linked from multiple imprints (e.g. line item printed
      // Front + Back → one card, two imprints listed).
      //
      // Grouping: one card per (order + line item). Each imprint contributes
      // to one card per LI it links to. Multi-LI imprints split, multi-imprint
      // LIs merge. Location is metadata only — a damage is a damage regardless
      // of which print location was being checked when it was found.
      //
      // Orphan imprints (empty Line Items array) skip the catching queue —
      // there's no physical pile to catch.
      if(!liIdsForImprint.length)return;
      // v135: split detection. An imprint on Equipment "Press 1 & 2 - SPLIT"
      // ran a big-qty job across BOTH ROQ presses. There is no per-press child
      // imprint in the data — this single record IS the split — so catching
      // synthesizes two half-cards from it (one per press) so each catcher QCs
      // and tracks damages for their own press independently. Each half carries
      // half the pieces (ceil for P1, floor for P2 — which sums back to the
      // whole exactly, per size), routes to its press tab via its real press
      // string, and — critically — both halves keep the SAME imprint record id
      // in .imprints so markComplete's sibling-guard only flips Caught once
      // BOTH halves are submitted (can't call the pile caught with a half open).
      var isSplit=pl.indexOf('split')>=0;
      liIdsForImprint.forEach(function(liId){
        // v127: surfacing rule —
        //  • owed reprint                         -> show (reprint mode)
        //  • not owed + Caught                    -> done, skip (pre-v127 behavior)
        //  • not owed + imprint is a reprint run  -> skip. If a sibling colorway
        //    on THIS imprint owes a reprint, the imprint was rescheduled to do
        //    that reprint — don't re-catch the undamaged colorways riding along.
        //  • not owed + uncaught + not a reprint run -> normal work, show.
        var owesReprint=!!REPRINT_BY_LI[liId];
        var imprintIsReprintRun=liIdsForImprint.some(function(x){return REPRINT_BY_LI[x];});
        var isCaught=!owesReprint && !!f[F.caught];
        // v134: caught (not owed) -> route to the Completed view map (cm), kept out of
        // the active queue. reprint-run siblings (uncaught, not owed) stay suppressed —
        // they're handled on the reprint run itself.
        if(!owesReprint && !f[F.caught] && imprintIsReprintRun)return;
        var tgt=isCaught?cm:om;
        // Non-split -> one card (suffix ''); split -> a P1 and a P2 half-card.
        var halves=isSplit
          ? [{sfx:':p1',half:'p1',label:'P1',press:'Press 1 - ROQ NEXT'},
             {sfx:':p2',half:'p2',label:'P2',press:'Press 2 - ROQ YOU'}]
          : [{sfx:'',half:null,label:null,press:press}];
        halves.forEach(function(hv){
          var gk=on+':'+liId+hv.sfx;
          // Per-half sizes/qty. ceil(q/2)+floor(q/2)===q for every size, so the
          // two halves partition the run exactly — no double-count, no loss.
          var hvSizes,hvQty;
          if(isSplit){
            hvSizes=sizes.map(function(s){return {size:s.size,qty:(hv.half==='p1'?Math.ceil(s.qty/2):Math.floor(s.qty/2))};}).filter(function(s){return s.qty>0;});
            hvQty=hvSizes.reduce(function(a,s){return a+s.qty;},0);
            if(!hvQty){var aq=Math.round(f[F.qty]||f[F.totalSch]||f[F.totalAllTime]||0);hvQty=hv.half==='p1'?Math.ceil(aq/2):Math.floor(aq/2);}
          }else{hvSizes=sizes;hvQty=qty;}
          if(!tgt[gk])tgt[gk]={
            id:gk,orderNum:on,orderRecId:orderRecId,press:hv.press,qty:hvQty,sizes:hvSizes,
            proofs:getProofs(f),due:getDue(f),loc:loc,
            imprintIds:[f[F.imprintId]||r.id],lineItemIds:[liId],machines:[hv.press],
            imprints:[{imprintId:f[F.imprintId]||r.id,recordId:r.id,loc:loc}],
            locations:loc?[loc]:[],designNick:(f[F.designNick]||'').trim(),
            startTime:f[F.startTime]||'',customer:'',orderRecordId:'',when:(f[F.isToday]?'':whenTag(f[F.startTime])),
            colorways:null,status:'pending',reprintMode:owesReprint,
            caught:isCaught,caughtAt:(isCaught?(f[F.caughtAt]||''):''),
            isSplit:isSplit,splitHalf:hv.half,splitLabel:hv.label
          };
          else{
            var g=tgt[gk];
            if(f[F.imprintId]&&g.imprintIds.indexOf(f[F.imprintId])<0)g.imprintIds.push(f[F.imprintId]);
            if(!g.imprints.find(function(x){return x.recordId===r.id;}))g.imprints.push({imprintId:f[F.imprintId]||r.id,recordId:r.id,loc:loc});
            if(hv.press&&g.machines.indexOf(hv.press)<0)g.machines.push(hv.press);
            if(loc&&g.locations.indexOf(loc)<0)g.locations.push(loc);
            if(loc==='Bandana')g.isBandana=true;
            getProofs(f).forEach(function(p){if(!g.proofs.find(function(x){return x.url===p.url;}))g.proofs.push(p);});
            // qty is the imprint-level scheduled count. For Front+Back on the
            // same shirts, the underlying LI count is the truth — keep header
            // qty as the max contributing imprint qty (gets replaced with real
            // LI total once enterQC fetches the line item).
            if(hvQty>g.qty)g.qty=hvQty;
            if(f[F.startTime]>g.startTime){g.startTime=f[F.startTime];}
            if(!g.due&&getDue(f))g.due=getDue(f);
            if(!g.designNick&&f[F.designNick])g.designNick=(f[F.designNick]||'').trim();
          }
        });
      });
   });
    jobs=Object.values(om).sort(function(a,b){return a.startTime<b.startTime?-1:a.startTime>b.startTime?1:0;});
    // v134: completed (caught today) jobs for the Completed view — most recently caught first.
    completedJobs=Object.values(cm).sort(function(a,b){var x=a.caughtAt||'',y=b.caughtAt||'';return x>y?-1:x<y?1:0;});
    // v127: an order with ANY owed reprint is in reprint mode — keep ONLY its
    // owed colorways. A colorway that printed fine on the original run (e.g. the
    // KG bandana on 9992) must NOT resurface asking to be re-caught. Keyed off
    // the open issue, so it works even when the original Caught flag was never set.
    var __reprintOrders={};
    jobs.forEach(function(j){if(j.reprintMode)__reprintOrders[j.orderNum]=true;});
    jobs=jobs.filter(function(j){return !__reprintOrders[j.orderNum]||j.reprintMode;});
    // Restore saved state
    jobs.forEach(function(j){
      // v146 — saved tallies belong to the same kind of pile: a reprint card shares its id with
      // the original run, so never pour yesterday's original counts into today's reprint.
      var sv=qcState[j.id];
      if(sv&&sv._rp!==undefined&&sv._rp!==!!j.reprintMode){delete qcState[j.id];sv=null;}
      // still in the queue = not caught in Airtable, so a saved "complete" means that write didn't land
      if(sv&&sv.status==='complete')sv.status='qc-done';
      if(!qcState[j.id])qcState[j.id]={status:'pending',cwData:{},spoilage:0,activeSize:null,tapHistory:[],_rp:!!j.reprintMode};
      else j.status=qcState[j.id].status||'pending';
    });
    // ─── Phase 2 (v113): batch-fetch line items to enrich cards ──────────
    // The card displays LI-level facts (garment+color, true qty, per-LI
    // proof PDF). Imprint-level qty is wrong when an imprint prints across
    // multiple LIs (Active Impressions sums them). LI Total Quantity is
    // the catcher's truth.
    //
    // Each job already has lineItemIds[0] from grouping (one LI per card).
    // Batch fetch with filterByFormula=OR(RECORD_ID()=...) — recordIds[]
    // doesn't work on v0 list endpoint.
    var __all=jobs.concat(completedJobs);
    var liIds=__all.map(function(j){return j.lineItemIds&&j.lineItemIds[0];}).filter(Boolean);
    liIds=liIds.filter(function(id,i,a){return a.indexOf(id)===i;});
    var liFetch=Promise.resolve({records:[]});
    if(liIds.length){
      // Fields we need: garment text, colorway, total qty, per-LI proof.
      var liFlds=[LI.liGarmentText,LI.liColorway,LI.liTotal,LI.liProofs]
        .map(function(id){return'fields%5B%5D='+id;}).join('&');
      var liFormula='OR('+liIds.map(function(id){return"RECORD_ID()='"+id+"'";}).join(',')+')';
      liFetch=api(TLI+'?filterByFormula='+encodeURIComponent(liFormula)+'&'+liFlds+'&returnFieldsByFieldId=true&pageSize=100');
    }
    liFetch.then(function(liData){
      var liMap={};
      (liData.records||[]).forEach(function(r){liMap[r.id]=r.fields||{};});
      __all.forEach(function(j){
        var liId=j.lineItemIds&&j.lineItemIds[0];
        var lf=liId?liMap[liId]:null;
        if(lf){
          // Garment text — formula returns string (not array).
          j.liGarment=(lf[LI.liGarmentText]||'').trim();
          // Colorway lookup — array; first entry.
          var cw=lf[LI.liColorway];
          j.liColorway=Array.isArray(cw)?(cw[0]||''):(cw||'');
          // Total Qty — number. v135: split half-cards take half the LI total
          // (ceil P1 / floor P2) so the two halves still sum to the whole run.
          var total=lf[LI.liTotal];
          if(typeof total==='number'&&total>0)j.qty=j.isSplit?(j.splitHalf==='p1'?Math.ceil(total/2):Math.floor(total/2)):total;
          // Per-LI proof PDF (replaces imprint-lookup proofs[]).
          // liProofs is an attachment array; build same shape as getProofs.
          var atts=lf[LI.liProofs];
          if(Array.isArray(atts)&&atts.length){
            var liProofs=atts.map(function(a){
              var th=a.thumbnails||{};
              return{
                url:a.url||'',
                thumb:(th.large&&th.large.url)||(th.small&&th.small.url)||a.url||'',
                filename:a.filename||'',
                type:a.type||''
              };
            }).filter(function(p){return p.url;});
            if(liProofs.length)j.proofs=liProofs;
          }
        }
      });
      // ─── Phase 3: fetch customer names + v122 ship/pickup fields ──────
      // v122 added shippingMethod + totalLinkedImprints to the Order fetch so
      // markComplete() can route ship vs pickup and detect partial-day completion
      // without an extra API call.
      var nums=__all.map(function(j){return j.orderNum;}).filter(function(n,i,a){return n&&n!=='--'&&a.indexOf(n)===i;});
      if(!nums.length){updateTabs();renderQueue();return;}
      var altF='OR('+nums.map(function(n){return'{Invoice / Order Number}='+n;}).join(',')+')';
      api(TOR+'?filterByFormula='+encodeURIComponent(altF)+'&fields%5B%5D=fld4S3B5yJANKlE7l&fields%5B%5D=fldoRraeYHsgfeWhj&fields%5B%5D='+O.shippingMethod+'&fields%5B%5D='+O.totalLinkedImprints+'&returnFieldsByFieldId=true&pageSize=100')
        .then(function(od){
          (od.records||[]).forEach(function(r){
            var on=r.fields['fld4S3B5yJANKlE7l'],cu=r.fields['fldoRraeYHsgfeWhj']||'';
            var sm=r.fields[O.shippingMethod];          // multipleSelects → array of strings or array of {name}
            var tli=r.fields[O.totalLinkedImprints];    // rollup → number (or array containing number)
            // Normalize shippingMethod to array of strings
            var smArr=[];
            if(Array.isArray(sm))sm.forEach(function(x){if(typeof x==='string')smArr.push(x);else if(x&&x.name)smArr.push(x.name);});
            // Normalize totalLinkedImprints to a number
            var tliNum=0;
            if(typeof tli==='number')tliNum=tli;
            else if(Array.isArray(tli)&&tli.length&&typeof tli[0]==='number')tliNum=tli[0];
            if(on)__all.forEach(function(j){if(j.orderNum===String(on)){
              j.customer=cu;j.orderRecordId=r.id;
              j.shippingMethod=smArr;
              j.orderTotalImprints=tliNum;
            }});
          });
          updateTabs();renderQueue();
        }).catch(function(){updateTabs();renderQueue();});
    }).catch(function(){
      // LI fetch failed — soft-fail to existing behavior (imprint qty + first proof).
      // v122: still fetch shipping method + total imprints on the Order fetch.
      var nums=__all.map(function(j){return j.orderNum;}).filter(function(n,i,a){return n&&n!=='--'&&a.indexOf(n)===i;});
      if(!nums.length){updateTabs();renderQueue();return;}
      var altF='OR('+nums.map(function(n){return'{Invoice / Order Number}='+n;}).join(',')+')';
      api(TOR+'?filterByFormula='+encodeURIComponent(altF)+'&fields%5B%5D=fld4S3B5yJANKlE7l&fields%5B%5D=fldoRraeYHsgfeWhj&fields%5B%5D='+O.shippingMethod+'&fields%5B%5D='+O.totalLinkedImprints+'&returnFieldsByFieldId=true&pageSize=100')
        .then(function(od){
          (od.records||[]).forEach(function(r){
            var on=r.fields['fld4S3B5yJANKlE7l'],cu=r.fields['fldoRraeYHsgfeWhj']||'';
            var sm=r.fields[O.shippingMethod];
            var tli=r.fields[O.totalLinkedImprints];
            var smArr=[];
            if(Array.isArray(sm))sm.forEach(function(x){if(typeof x==='string')smArr.push(x);else if(x&&x.name)smArr.push(x.name);});
            var tliNum=0;
            if(typeof tli==='number')tliNum=tli;
            else if(Array.isArray(tli)&&tli.length&&typeof tli[0]==='number')tliNum=tli[0];
            if(on)__all.forEach(function(j){if(j.orderNum===String(on)){
              j.customer=cu;j.orderRecordId=r.id;
              j.shippingMethod=smArr;
              j.orderTotalImprints=tliNum;
            }});
          });
          updateTabs();renderQueue();
        }).catch(function(){updateTabs();renderQueue();});
    });
  }).catch(function(e){
    render('<div class="err">Load failed: '+e.message+'</div>');
  });
}

function render(html){document.getElementById('root').innerHTML=html;saveQCSoon();}
// v146 — tallies survive a reload: saved per card on this iPad, kept 2 days.
var QC_KEY='pine_catch_qc_v1',QC_TTL=48*3600*1000,_qcSaveT=null;
function saveQCSoon(){ if(_qcSaveT)clearTimeout(_qcSaveT); _qcSaveT=setTimeout(saveQCNow,250); }
function saveQCNow(){
  _qcSaveT=null;
  try{
    var old={}; try{old=JSON.parse(localStorage.getItem(QC_KEY)||'{}')||{};}catch(e){}
    var now=Date.now(), out={};
    Object.keys(old).forEach(function(k){ if(old[k]&&now-(old[k].ts||0)<QC_TTL)out[k]=old[k]; });
    Object.keys(qcState).forEach(function(k){
      var st=qcState[k]; if(!st)return;
      var has=(st.tapHistory&&st.tapHistory.length)||st.status!=='pending'||(out[k]&&out[k].st);
      if(has)out[k]={ts:now,st:st};
    });
    localStorage.setItem(QC_KEY,JSON.stringify(out));
  }catch(e){ console.warn('[v146] tally save failed',e); }
}
function loadQC(){
  try{
    var o=JSON.parse(localStorage.getItem(QC_KEY)||'{}')||{}, now=Date.now(), n=0;
    Object.keys(o).forEach(function(k){ if(o[k]&&o[k].st&&now-(o[k].ts||0)<QC_TTL){ qcState[k]=o[k].st; n++; } });
    if(n)console.log('[v146] restored tallies for',n,'card(s)');
  }catch(e){}
}
function hasTallyData(st){
  if(!st)return false;
  if(st.tapHistory&&st.tapHistory.length)return true;
  return Object.keys(st.cwData||{}).some(function(li){ var cw=st.cwData[li]||{}; return Object.keys(cw).some(function(sz){
    if(sz.charAt(0)==='_')return false; var t=sizeTotals(cw[sz]||{}); return t.print+t.other+t.tbd>0||(parseInt((cw[sz]||{}).caughtOffset)||0)!==0; }); });
}

function renderQueue(){
  updateViewTabs();

  activeJobId=null;
  resetActRowPadding();
  var m=MACHINES.find(function(x){return x.id===activePress;})||MACHINES[0];
  var mj=jobsFor(m);
  updateTabs();
  var h='<div class="content">';
  h+='<div class="q-hdr">';
  h+='<span class="q-title">'+m.label+' — '+mj.length+' job'+(mj.length!==1?'s':'')+' today</span>';
  h+='<span class="q-date">'+new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/Denver'})+'</span>';
  h+='</div>';
  if(!mj.length){
    h+='<div class="empty">No jobs today for this press</div>';
    h+='</div>';
    render(h);return;
  }
  // ─── Group cards by orderNum, preserving sort order (earliest startTime first) ───
  // Object.values sort above already ordered jobs by startTime; group by first-seen
  // order, so the first order shown is the one whose earliest job runs first.
  var orderKeys=[],byOrder={};
  mj.forEach(function(j){
    var k=j.orderNum||'--';
    if(!byOrder[k]){byOrder[k]=[];orderKeys.push(k);}
    byOrder[k].push(j);
  });
  orderKeys.forEach(function(on){
    var group=byOrder[on];
    var first=group[0];
    var customer=first.customer||first.designNick||'';
    var totalPcs=group.reduce(function(s,j){
      var rp=j.reprintMode&&j.lineItemIds&&REPRINT_BY_LI[j.lineItemIds[0]];
      return s+(rp?rp.total:(j.qty||0));
    },0);
    // v116: stash run-total on each job in the group so spoilage % and threshold
    // can be computed against the run, not the per-LI qty. "Run" = the order
    // (per the v116 design call). All cards under this order header share the
    // same runTotalPcs.
    group.forEach(function(j){j.runTotalPcs=totalPcs;});
    var collapsed=!!collapsedOrders[on];
    var qcdCt=group.reduce(function(s,j){var st=qcState[j.id]||{};return s+(st.status==='qc-done'||st.status==='complete'?1:0);},0);
    // v141: every card QC'd -> the header earns its ready state.
    var orderReady=(viewMode==='active')&&group.length>0&&(qcdCt===group.length);
    h+='<div class="og">';
    // Header — tap to toggle collapse. Escape orderNum just in case.
    var onEsc=String(on).replace(/'/g,"\\'");
    if(orderReady){
      var rc=readyCopy(first.shippingMethod,group.length);
      // Fire the one-shot pulse only on the transition into ready, never on
      // subsequent re-renders (scroll, collapse, another order's submit).
      var firstTime=!readyPulsed[on];
      if(firstTime)readyPulsed[on]=true;
      h+='<div class="og-hdr ready'+(rc.act?'':' blocked')+(collapsed?' collapsed':'')+'" onclick="toggleOrderGroup(\''+onEsc+'\')">';
      h+='<span class="og-caret">▼</span>';
      h+='<span class="og-num">'+on+'</span>';
      h+='<span class="og-cust">'+(customer||'—')+'</span>';
      h+='<span class="rd-msg"><span class="rd-ico">'+rc.ico+'</span>';
      h+='<span class="rd-txt">'+rc.txt+' <em>'+rc.sub+'</em></span></span>';
      h+='<button class="rd-btn rd-slip" onclick="event.stopPropagation();openPackingSlip(\''+onEsc+'\')">\ud83d\udda8 Packing slip</button>';  // v144
      if(rc.act){
        h+='<button class="rd-btn'+(firstTime?' pulse':'')+'" id="rdbtn_'+onEsc+'"'
          +' onclick="event.stopPropagation();completeOrder(\''+onEsc+'\')">✓ Complete Order</button>';
      }
      h+='</div>';
    }else{
    h+='<div class="og-hdr'+(collapsed?' collapsed':'')+'" onclick="toggleOrderGroup(\''+onEsc+'\')">';
    h+='<span class="og-caret">▼</span>';
    h+='<span class="og-num">'+on+'</span>';
    h+='<span class="og-cust">'+(customer||'—')+'</span>';
    h+='<span class="og-meta">';
    h+='<span class="tag n">'+group.length+' job'+(group.length!==1?'s':'')+'</span>';
    h+='<span class="tag g">'+totalPcs+' pcs</span>';
    if(qcdCt>0)h+='<span class="tag '+(qcdCt===group.length?'g':'n')+'">'+qcdCt+'/'+group.length+' done</span>';
    // v122: shipping method chip — tells the catcher what will happen when the order is fully caught
    var shipMethod=first.shippingMethod;
    var pickupKind=isPickupOrder(shipMethod);
    // v140: Address TBD wins the chip. It's checked first because it's the one
    // state that changes what happens AFTER catching — the catcher still catches
    // and boxes normally, but must not treat the order as shippable.
    if(isAddressTBDOrder(shipMethod))
                                h+='<span class="og-ship tbd" title="Ship-to address pending — catch and box normally. Production Mgr / Logistics / Receiving will ship once the address lands.">📍 Address TBD</span>';
    else if(pickupKind===true)  h+='<span class="og-ship pickup" title="Pickup order">🤝 Pickup</span>';
    else if(pickupKind===false) h+='<span class="og-ship ship" title="Ship order — will go to Caught - Awaiting Ship when fully caught">📦 Ship</span>';
    else                        h+='<span class="og-ship unknown" title="Shipping Method not set — fix in Airtable before final completion">⚠ Set shipping</span>';
    h+='</span>';
    h+='</div>';
    } // v141: end standard-header branch
    h+='<div class="og-cards'+(collapsed?' collapsed':'')+'">';
    group.forEach(function(job){
      var st=qcState[job.id]||{status:'pending'};
      var flagged=st.spoilage>5;
      h+='<div class="job-card'+(flagged?' flagged':'')+'" onclick="enterQC(\''+job.id+'\')">';
      // Thumb (per-LI proof when available, falls back to first imprint proof)
      h+='<div class="jc-thumb">';
      var fp=job.proofs&&job.proofs[0];
      if(fp&&fp.thumb)h+='<img src="'+fp.thumb+'" onerror="this.style.display=\'none\'">';
      else h+='<svg class="jc-thumb-ph" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
      h+='</div>';
      // Info — garment+color leads (customer is in the order header above), then meta tags
      h+='<div class="jc-info">';
      var primary=job.liGarment||job.designNick||('Order '+job.orderNum);
      h+='<div class="jc-name">'+primary+'</div>';
      // v133: imprint ID(s) shown big for staging — catchers stack by shared imprint,
      // so each imprint gets its own chip (front+back garment shows 9697-A and 9697-B).
      if(job.imprintIds&&job.imprintIds.length){
        h+='<div class="jc-imp">';
        job.imprintIds.forEach(function(ii){h+='<span class="jc-imp-chip p-id">'+ii+'</span>';});
        h+='</div>';
      }
      h+='<div class="jc-meta">';
      // v127: reprint cards announce themselves and show the OWED count, not the full order.
      var rpj=job.reprintMode&&job.lineItemIds&&REPRINT_BY_LI[job.lineItemIds[0]];
      if(rpj)h+='<span class="tag amb">↻ Reprint</span>';
      if(job.isSplit)h+='<span class="tag split">⇄ Split · '+job.splitLabel+'</span>';
      h+='<span class="tag g">'+(rpj?rpj.total:job.qty)+' pcs</span>';
      if(job.locations.length)h+='<span class="tag n">'+job.locations.join(' · ')+'</span>';
      if(job.due)h+='<span class="tag amb">Due '+fmtDate(job.due)+'</span>';
      if(st.spoilage>0)h+='<span class="tag '+(st.spoilage>5?'r':'amb')+'">'+st.spoilage.toFixed(1)+'% spoil</span>';
      h+='</div>';
      h+='</div>';
      // Right — big order number + status (kept on each card so cards still
      // make sense in isolation when QC view returns to queue mid-task)
      h+='<div class="jc-right">';
      h+='<div class="jc-order">'+job.orderNum+'</div>';
      if(st.status==='complete')h+='<div class="jc-status complete">Done</div>';
      else if(st.status==='qc-done'){
        h+='<div class="jc-status qcd">QC\'d</div>';
        // v141: when the order-ready header is showing, its single "Complete
        // Order" button replaces these. Suppressing them is what makes v141 a
        // simplification rather than another thing stacked on the pile.
        if(!orderReady)h+='<button class="btn" onclick="event.stopPropagation();markComplete(\''+job.id+'\')">✓ Complete</button>';
      }else h+='<div class="jc-status">Pending</div>';
      h+='</div>';
      h+='</div>';
    });
    h+='</div>'; // .og-cards
    h+='</div>'; // .og
  });
  h+='</div>';
  render(h);
}

  // v161: Pine page kit — .p-head summary, the any-order slip box (the one yellow), one .p-lc card per order
  activeJobId=null;
  var cj=completedJobs;

  h+='<div class="find-ord"><label for="findOrd">Packing slip for any order</label><div class="fo-row"><input id="findOrd" class="p-input" inputmode="numeric" placeholder="Order #, e.g. 10901" onkeydown="if(event.key===\'Enter\')findOrderSlip()"><button class="p-btn p-btn-main" onclick="findOrderSlip()">🖨 Packing slip</button></div><small>Any day, any status.</small></div>';
  if(!cj.length){
    h+='<div class="empty">Nothing caught yet today</div>';
    h+='</div>';render(h);return;
  }
  var orderKeys=[],byOrder={};
  cj.forEach(function(j){var k=j.orderNum||'--';if(!byOrder[k]){byOrder[k]=[];orderKeys.push(k);}byOrder[k].push(j);});
  h+='<div class="done-list">';
  orderKeys.forEach(function(on){
