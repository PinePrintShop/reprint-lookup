    var first=group[0];
    var customer=first.customer||first.designNick||'';
    var totalPcsG=group.reduce(function(s,j){return s+(j.qty||0);},0);
    var isOpen=DONE_OPEN===String(on);
    var onEsc=String(on).replace(/'/g,"\\'");
    var garments=[]; group.forEach(function(j){var g=j.liGarment||j.designNick||''; if(g&&garments.indexOf(g)<0)garments.push(g);});
    var last=group.reduce(function(m,j){return (j.caughtAt||'')>m?(j.caughtAt||''):m;},'');
    h+='<section class="p-lc'+(isOpen?' is-open':'')+'">';
    h+='<div class="p-lc-head is-tap" role="button" tabindex="0" aria-expanded="'+isOpen+'" onclick="toggleDoneGroup(\''+onEsc+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleDoneGroup(\''+onEsc+'\');}">';
    h+='<span class="p-lc-id"><span class="p-lc-chev" aria-hidden="true">'+(isOpen?'&#9662;':'&#9656;')+'</span><span class="p-id">'+cwEsc(on)+'</span></span>';
    h+='<span class="p-lc-main"><span class="p-lc-title">'+cwEsc(customer||'—')+'</span><span class="p-lc-sub">'+cwEsc(garments.join(' · '))+'</span></span>';
    h+='<span class="p-lc-nums"><span class="p-num"><small>Jobs</small><b>'+group.length+'</b></span><span class="p-num"><small>Pcs</small><b>'+totalPcsG.toLocaleString()+'</b></span></span>';
    h+='<span class="p-lc-act">'+(on&&on!=='--'?'<button class="p-btn" onclick="event.stopPropagation();openPackingSlip(\''+onEsc+'\')">🖨 Packing slip</button>':'')+'</span>';
    h+='<span class="p-lc-tags"><span class="p-tag p-tag-done">✓ Caught '+fmtTime(last)+'</span></span>';
    h+='</div>';
    if(isOpen){
      h+='<div class="p-lc-body">';
      group.forEach(function(job){
        var fp=job.proofs&&job.proofs[0];
        h+='<button class="done-job" onclick="openCompletedProofs(\''+job.id+'\')" title="See the proof">';
        h+='<span class="dj-thumb">'+(fp&&fp.thumb?'<img src="'+fp.thumb+'" alt="" onerror="this.style.display=\'none\'">':'')+'</span>';
        h+='<span class="dj-main"><span class="dj-title">'+cwEsc(job.liGarment||job.designNick||('Order '+job.orderNum))+'</span><span class="p-tags">';
        (job.imprintIds||[]).forEach(function(ii){h+='<span class="p-id">'+cwEsc(ii)+'</span>';});
        if(job.locations&&job.locations.length)h+='<span class="p-tag p-tag-soft">'+cwEsc(job.locations.join(' · '))+'</span>';
        h+='</span></span>';
        h+='<span class="p-num"><small>Pcs</small><b>'+(job.qty||0)+'</b></span>';
        h+='<span class="p-tag p-tag-done">✓ '+fmtTime(job.caughtAt)+'</span>';
        h+='</button>';
      });
      h+='</div>';
    }
    h+='</section>';
  });
  h+='</div></div>';
  render(h);
}

// ─── QC ENTER ────────────────────────────────────────────────────────
function enterQC(jobId){
  activeJobId=jobId;
  if(!qcState[jobId])qcState[jobId]={status:'pending',cwData:{},spoilage:0,activeSize:null,tapHistory:[]};
  var _jrp=jobs.find(function(j){return j.id===jobId;}); if(_jrp)qcState[jobId]._rp=!!_jrp.reprintMode;  // v146
  // Defensive: ensure tapHistory array exists for old states pre-v109
  if(!qcState[jobId].tapHistory)qcState[jobId].tapHistory=[];
  if(qcState[jobId].activeSize===undefined)qcState[jobId].activeSize=null;
  // v114: locsChecked tracks which imprint locations the catcher has visually
  // inspected on this pile. Keyed by imprint record ID (not imprint ID lookup
  // string, since e.g. "9824-A" can repeat across orders). Value=true=checked.
  // Auto-check piles with only one location — no friction in the simple case.
  // Multi-location piles start unchecked; submit is gated until all are ✓.
  if(!qcState[jobId].locsChecked)qcState[jobId].locsChecked={};
  var jobForSeed=jobs.find(function(j){return j.id===jobId;});
  if(jobForSeed&&jobForSeed.imprints&&jobForSeed.imprints.length===1){
    qcState[jobId].locsChecked[jobForSeed.imprints[0].recordId]=true;
  }
  var job=jobForSeed;
  if(!job)return;
  if(job.colorways){renderQC();return;}
  render('<div class="loading"><div class="spin"></div>Loading colorways…</div>');
  // Fetch line items for this order
  // v54 proven approach: filterByFormula on Invoice/Order Number Lookup works in REST API
  // Then filter client-side by imprint ID to get only this order's colorways
  // Size fields only in the loop — extra fields added explicitly after
  var liF=Object.keys(LI).filter(function(k){return['liProofs','liImprints','liDamages','liOrders','liColorway','liGarmentType','liGarmentStyle','liGarmentDirect','liGarmentText'].indexOf(k)<0;})
    .map(function(k){return'fields%5B%5D='+LI[k];}).join('&');
  liF+='&fields%5B%5D='+LI.liProofs+'&fields%5B%5D='+LI.liImprints;
  liF+='&fields%5B%5D='+LI.liColorway+'&fields%5B%5D='+LI.liGarmentType+'&fields%5B%5D='+LI.liGarmentStyle+'&fields%5B%5D='+LI.liGarmentDirect+'&fields%5B%5D='+LI.liGarmentText;
  liF+='&'+Object.keys(LI_EXTRA_BY_SIZE).map(function(k){return'fields%5B%5D='+LI_EXTRA_BY_SIZE[k];}).join('&');
  liF+='&returnFieldsByFieldId=true&pageSize=100';
  var liFormula='{Invoice / Order Number Lookup}='+job.orderNum;
  var liUrl=TLI+'?filterByFormula='+encodeURIComponent(liFormula)+'&'+liF;
  api(liUrl).then(function(ld){
    // v112: each card is one specific line item (or one specific set, if multi-LI).
    // Filter to ONLY the line items registered to this card via job.lineItemIds.
    // Falls back to "any LI in the order" if lineItemIds is somehow empty.
    var thisCardLis=Array.isArray(job.lineItemIds)?job.lineItemIds:[];
    var cws=(ld.records||[]).filter(function(r){
      if(thisCardLis.length===0)return true;
      return thisCardLis.indexOf(r.id)>=0;
    }).map(function(r){
      var f=r.fields,szs={};
      ['XS','S','M','L','XL','2XL','3XL','4XL','5XL','6XL','OSFA'].forEach(function(sz){var q=f[LI[sz]];if(q>0)szs[sz]=q;});  // v146 +4XL–6XL
      var tot=Object.values(szs).reduce(function(a,b){return a+b;},0);
      var pa=f[LI.liProofs];
      var thumb=pa&&pa[0]?(pa[0].thumbnails&&pa[0].thumbnails.large?pa[0].thumbnails.large.url:pa[0].url):null;
      var fullUrl=pa&&pa[0]?pa[0].url:null;
      // Store which imprint record IDs this LI is linked to (for grouping)
      var linkedImps=(f[LI.liImprints]||[]).map(function(x){return x.id||x;});
      // Extract colorway name — REST API with returnFieldsByFieldId returns flat array
      var cwRaw=f[LI.liColorway];
      var colorwayName='—';
      if(Array.isArray(cwRaw)&&cwRaw.length){
        colorwayName=cwRaw.map(function(x){return(x&&x.name)?x.name:typeof x==='string'?x:String(x);}).filter(Boolean)[0]||'—';
      }else if(cwRaw&&cwRaw.valuesByLinkedRecordId){
        var cwVals=Object.values(cwRaw.valuesByLinkedRecordId).flat();
        colorwayName=cwVals.map(function(x){return(x&&x.name)?x.name:typeof x==='string'?x:String(x);}).filter(Boolean)[0]||'—';
      }else if(typeof cwRaw==='string'&&cwRaw){
        colorwayName=cwRaw;
      }
      // Extract garment name — use direct link field first (most reliable)
      // Garment name: use formula field fldKhz9uZgXwfeIto which returns plain string via REST
      // e.g. "Carolina Creative 4800 - Maroon" -> strip color -> "Carolina Creative 4800"
      var gtText=f[LI.liGarmentText]; // formula field — always returns plain string
      var garmentName='—';
      if(typeof gtText==='string'&&gtText){
        var gdi=gtText.lastIndexOf(' - ');
        garmentName=gdi>0?gtText.substring(0,gdi).trim():gtText.trim()||'—';
      }
      var exBySize={},exTot=0;
      Object.keys(LI_EXTRA_BY_SIZE).forEach(function(k){var v=f[LI_EXTRA_BY_SIZE[k]];if(typeof v==='number'&&v>0){exBySize[k]=v;exTot+=v;}});
      return{liId:r.id,sizes:szs,total:tot,extras:exTot,extrasBySize:exBySize,thumb:thumb,fullUrl:fullUrl,created:r.createdTime||'',linkedImps:linkedImps,colorwayName:colorwayName,garmentName:garmentName};
    }).filter(function(cw){return cw.total>0;})
      .sort(function(a,b){
        // Sort by earliest imprint position in the scheduled order, then by createdTime
        var impOrder=job.imprints?job.imprints.map(function(i){return i.recordId;}):[];
        function firstImpIdx(cw){
          var min=impOrder.length;
          (cw.linkedImps||[]).forEach(function(id){
            var idx=impOrder.indexOf(id);
            if(idx>=0&&idx<min)min=idx;
          });
          return min;
        }
        var ai=firstImpIdx(a),bi=firstImpIdx(b);
        if(ai!==bi)return ai-bi;
        return a.created.localeCompare(b.created);
      });
    // Fallback: use imprint-level size data
    if(!cws.length){
      var szs={};
      job.sizes.forEach(function(s){szs[s.size]=s.qty;});
      if(!Object.keys(szs).length)szs['OSFA']=job.qty;
      cws=[{liId:job.id,sizes:szs,total:job.qty,thumb:job.proofs[0]?job.proofs[0].thumb:null,fullUrl:job.proofs[0]?job.proofs[0].url:null}];
    }
    // v127: reprint mode — keep ONLY colorways that owe a reprint and swap their
    // expected sizes/total from the full order to the [RP] owed-by-size counts.
    // After this, the size tally (cw.sizes) and per-LI spoilage (cw.total) both
    // run off the reprint quantity, not the original run. Originals stashed for
    // display. Non-owed colorways drop out of a reprint card entirely.
    if(job.reprintMode){
      cws=cws.filter(function(cw){return REPRINT_BY_LI[cw.liId];}).map(function(cw){
        var rp=REPRINT_BY_LI[cw.liId];
        cw.origSizes=cw.sizes;cw.origTotal=cw.total;
        cw.sizes=Object.assign({},rp.sizes);
        cw.total=rp.total;
        cw.reprint=true;
        cw.oiRecIds=(rp.oiRecIds||[]).slice();
        return cw;
      });
    }
    // v135: split half — swap each colorway's expected sizes/total to this
    // press's half (ceil for P1, floor for P2). Runs off the authoritative LI
    // per-size counts just fetched, so the QC grid and per-LI spoilage judge
    // the catcher against their own 1,250, not the full 2,500. ceil+floor per
    // size sums back to the whole run across the two halves. (Skip when reprint
    // mode already narrowed the counts — a split reprint is out of scope.)
    if(job.isSplit&&!job.reprintMode){
      cws=cws.map(function(cw){
        cw.origSizes=cw.sizes;cw.origTotal=cw.total;
        var half={},sum=0;
        Object.keys(cw.sizes).forEach(function(sz){
          var q=cw.sizes[sz]||0;
          var h=job.splitHalf==='p1'?Math.ceil(q/2):Math.floor(q/2);
          if(h>0){half[sz]=h;sum+=h;}
        });
        cw.sizes=half;cw.total=sum;cw.split=true;
        return cw;
      }).filter(function(cw){return cw.total>0;});
    }
    job.colorways=cws;
    // Init QC state per colorway/size
    var st=qcState[jobId];
    cws.forEach(function(cw){
      if(!st.cwData[cw.liId])st.cwData[cw.liId]={};
      Object.keys(cw.sizes).forEach(function(sz){
        if(!st.cwData[cw.liId][sz])st.cwData[cw.liId][sz]={caughtOffset:0,printReasonCounts:{},otherReasonCounts:{},tbdEvents:[]};
      });
    });
    renderQC();
  }).catch(function(e){
    // Fallback on error
    var szs={};
    job.sizes.forEach(function(s){szs[s.size]=s.qty;});
    if(!Object.keys(szs).length)szs['OSFA']=job.qty;
    job.colorways=[{liId:job.id,sizes:szs,total:job.qty,thumb:job.proofs[0]?job.proofs[0].thumb:null,fullUrl:job.proofs[0]?job.proofs[0].url:null}];
    var st=qcState[jobId];
    if(!st.cwData[job.id])st.cwData[job.id]={};
    Object.keys(szs).forEach(function(sz){if(!st.cwData[job.id][sz])st.cwData[job.id][sz]={caughtOffset:0,printReasonCounts:{},otherReasonCounts:{},tbdEvents:[]};});
    renderQC();
  });
}

// ─── RENDER QC ────────────────────────────────────────────────────────
// v121: Cockpit layout. Single colorway shown at a time; tabs switch between
// colorways on multi-LI orders. Order info compressed into a slim top strip.
// Spoilage compressed into the footer alongside the Submit button. Notes
// textarea + summary table moved out of the cockpit (notes lives in the
// submit-preview modal; summary still rendered there too).
function renderQC(){
  var jobId=activeJobId;
  var job=jobs.find(function(j){return j.id===jobId;});
  if(!job||!job.colorways)return;
  var st=qcState[jobId];
  var cws=job.colorways;
  // v121: pick the active colorway. Default to first if not set or stale.
  var activeCwId=st.activeCwId;
  var activeCw=cws.find(function(c){return c.liId===activeCwId;});
  if(!activeCw){
    activeCw=cws[0];
    st.activeCwId=activeCw.liId;
  }
  // Flip body into cockpit mode (locks layout to viewport, hides preview-bar
  // padding). Reversed by renderQueue.
  document.body.classList.add('qc-mode');
  document.body.style.paddingBottom='';
  var h='<div class="qc-cockpit">';
  // ─ Order strip ─
  h+='<div class="cp-order-strip">';
  h+='<button class="cp-back" onclick="renderQueue()">← Queue</button>';
  h+='<div class="cp-order-info">';
  h+='<span class="cp-order-num">Order '+job.orderNum+(job.due?' · Due '+fmtDate(job.due):'')+'</span>';
  h+='<span class="cp-order-name">'+(job.customer||job.designNick||'Order '+job.orderNum)+'</span>';
  h+='</div>';
  h+='<div class="cp-order-chips">';
  if(job.isSplit)h+='<span class="tag split">⇄ Split · '+job.splitLabel+'</span>';
  h+='<span class="tag g">'+job.qty+' pcs</span>';
  h+='<span class="tag n">'+job.machines.join(' · ')+'</span>';
  if(job.locations.length)h+='<span class="tag n">'+job.locations.join(' · ')+'</span>';
  h+='</div>';
  h+='</div>';
  // v139: shipping handling strip (Concept E) — per-order flag under the order
  // strip. Weight-scaled: routine methods render quiet, special/hot render loud
  // with a do-this note. Reads job.shippingMethod (the same field completion
  // routing uses); display-only, no writes.
  h+=shipStripHTML(job.shippingMethod);
  // ─ Colorway tabs (only if >1) ─
  if(cws.length>1){
    h+='<div class="cp-cw-tabs">';
    cws.forEach(function(cw){
      var cwSt=st.cwData[cw.liId]||{};
      var totals=colorwayDamageTotal(cwSt);
      var hasDmg=totals.print+totals.other+totals.tbd>0;
      // "Counted" = any tap history OR caught offset edit on this cw
      var counted=false;
      (st.tapHistory||[]).forEach(function(e){if(e.liId===cw.liId)counted=true;});
      if(!counted){
        Object.keys(cwSt).forEach(function(k){
          if(k.charAt(0)==='_')return;
          if((parseInt(cwSt[k].caughtOffset)||0)!==0)counted=true;
        });
      }
      var on=(cw.liId===activeCw.liId);
      var cls='cp-cw-tab'+(on?' on':'')+(counted?' counted':'');
      var tabLabel=cw.colorwayName||cw.garmentName||'Colorway';
      h+='<button class="'+cls+'" onclick="switchCockpitCw(\''+cw.liId+'\')">'
        +tabLabel
        +'<span class="cp-cw-tab-ct">'+cw.total+'</span>';
      if(hasDmg)h+='<span class="cp-cw-tab-dot"></span>';
      h+='</button>';
    });
    h+='</div>';
  }
  // ─ Cockpit body (single colorway) ─
  h+=renderCockpitBody(activeCw,job,st,cws);
  // ─ Cockpit footer (spoilage strip + submit) ─
  h+=renderCockpitFooter(activeCw,job,st,jobId);
  h+='</div>'; // qc-cockpit
  render(h);
}

// v121: cockpit body — proof left, tally right. Single colorway in focus.
function renderCockpitBody(cw,job,st,cws){
  var ci=cws.indexOf(cw);
  var h='<div class="cp-body">';
  // ── LEFT: meta + proof ──
  h+='<div class="cp-left">';
  h+='<div class="cp-left-meta">';
  h+='<div class="cp-meta-name">'+(cw.garmentName||cw.colorwayName||'Colorway')+'</div>';
  var subParts=[];
  if(cw.colorwayName&&cw.garmentName&&cw.colorwayName!==cw.garmentName)subParts.push(cw.colorwayName);
  subParts.push((cw.reprint&&cw.origTotal)?(cw.total+' to reprint · '+cw.origTotal+' on order'):(cw.total+' pcs'));
  var cwTotals=colorwayDamageTotal(st.cwData[cw.liId]||{});
  if(cwTotals.print>0)subParts.push(cwTotals.print+' print');
  if(cwTotals.other>0)subParts.push(cwTotals.other+' other');
  if(cwTotals.tbd>0)subParts.push(cwTotals.tbd+' TBD');
  h+='<div class="cp-meta-sub">'+subParts.join(' · ')+'</div>';
  // v136: extras on hand — spare pieces printed above the customer order, so the
  // catcher can read their damage buffer for this pile at a glance. Hidden on
  // reprint cards (extras belong to the original run) and on bandanas (v138 —
  // bandanas ship at the ordered qty, so there's no extras concept).
  var cbBandana=job.isBandana||(job.locations||[]).indexOf('Bandana')>=0;
  if((cw.extras||0)>0&&!cw.reprint&&!cbBandana){
    h+='<div class="cp-meta-extras"><span class="tag g">+'+cw.extras+' EXTRA'+(cw.extras===1?'':'S')+' ON HAND</span></div>';
  }
  h+='</div>';
  h+='<div class="cp-proof" onclick="openProofs(\''+cw.liId+'\')">';
  if(cw.thumb)h+='<img src="'+cw.thumb+'" alt="Proof">';
  else if(job.proofs[ci]&&job.proofs[ci].thumb)h+='<img src="'+job.proofs[ci].thumb+'" alt="Proof">';
  else h+='<svg class="cp-proof-ph" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  h+='</div>';
  h+='</div>'; // cp-left
  // ── RIGHT: tally bar (reused unchanged) ──
  h+='<div class="cp-right">';
  h+=renderTallyBar(cw,job,st);
  h+='</div>'; // cp-right
  h+='</div>'; // cp-body
  return h;
}

// v121: cockpit footer — single-line spoilage strip + submit button.
// Spoilage logic mirrors buildSpoilage but renders in compact form. Resolution
// still per-LI; run-context shown for multi-LI orders.
function renderCockpitFooter(cw,job,st,jobId){
  var cwSt=st.cwData[cw.liId]||{};
  var totals=colorwayDamageTotal(cwSt);
  var liDmg=totals.print+totals.other+totals.tbd;
  var liQty=cw.total||0;
  var liPct=liQty>0?(liDmg/liQty)*100:0;
  st.spoilage=liPct;
  var isBandana=job.isBandana||(job.locations||[]).indexOf('Bandana')>=0;
  var res='NO ACTION',resClass='ok';
  if(liDmg>0){
    if(isBandana){res='LOGGED';resClass='ok';}
    else if(liPct<1){res='NO ACTION';resClass='ok';}
    else if(liPct<5){res='REVIEW';resClass='warn';}
    else{res='RE-PRINT';resClass='bad';}
  }
  var pctCls=liPct>5?'bad':liPct>1?'warn':'ok';
  // Multi-LI run context
  var runCtx='';
  if(job.colorways&&job.colorways.length>1&&typeof job.runTotalPcs==='number'&&job.runTotalPcs>0){
    var runDmg=0;
    jobs.forEach(function(otherJob){
      if(otherJob.orderNum!==job.orderNum)return;
      var otherSt=qcState[otherJob.id];
      if(!otherSt||!otherSt.cwData)return;
      Object.values(otherSt.cwData).forEach(function(cwData){
        Object.keys(cwData).forEach(function(k){
          if(k.charAt(0)==='_')return;
          var t=sizeTotals(cwData[k]);
          runDmg+=t.print+t.other+t.tbd;
        });
      });
    });
    var runPct=job.runTotalPcs>0?(runDmg/job.runTotalPcs)*100:0;
    runCtx='Run: '+runDmg+'/'+job.runTotalPcs+' · '+runPct.toFixed(1)+'%';
  }
  // Submit button gating (multi-location pile must be all-locs-checked)
  var sbDisabled=false;
  if(st.status!=='qc-done'){
    var impsForGate=job.imprints||[];
    if(impsForGate.length>1){
      var allCk=impsForGate.every(function(i){return (st.locsChecked||{})[i.recordId];});
      sbDisabled=!allCk;
    }
  }
  var sbLabel=st.status==='qc-done'?'Update QC':'Submit QC';
  var h='<div class="cp-foot" id="cpFoot">';
  h+='<div class="cp-foot-spoil">';
  h+='<span class="cp-foot-lbl">Spoilage</span>';
  h+='<span class="cp-foot-pct '+pctCls+'">'+liPct.toFixed(1)+'%</span>';
  h+='<span class="cp-foot-res '+resClass+'">'+res+'</span>';
  if(liDmg>0)h+='<span class="cp-foot-ctx">'+liDmg+' of '+liQty+'</span>';
  if(runCtx)h+='<span class="cp-foot-run">'+runCtx+'</span>';
  h+='</div>';
  // qc-done: extra buttons stack ABOVE submit when status===qc-done. Cockpit
  // footer flex-wraps so this works naturally.
  if(st.status==='qc-done'){
    h+='<button class="cp-submit complete" onclick="markComplete(\''+jobId+'\')">✓ Mark Complete</button>';
    h+='<button class="cp-submit" onclick="openPackingSlip(\''+String(job.orderNum).replace(/'/g,"\\'")+'\')">\ud83d\udda8 Packing slip</button>';  // v145 (was Box This Order)
  }
  h+='<button class="cp-submit" id="sbBtn"'+(sbDisabled?' disabled':'')+' onclick="submitQC(\''+jobId+'\')">'+sbLabel+'</button>';
  h+='</div>';
  return h;
}

// v121: switch which colorway the cockpit is showing. Re-renders entire QC view.
function switchCockpitCw(liId){
  var st=qcState[activeJobId];
  if(!st)return;
  if(st.activeCwId===liId)return;
  st.activeCwId=liId;
  // Reset activeSize since the new colorway may not have the same size keys.
  // If new cw is single-size, renderTallyBar will auto-pick it.
  var job=jobs.find(function(j){return j.id===activeJobId;});
  if(job){
    var newCw=(job.colorways||[]).find(function(c){return c.liId===liId;});
    if(newCw){
      var newSizes=Object.keys(newCw.sizes);
      if(newSizes.indexOf(st.activeSize)<0){
        st.activeSize=newSizes.length===1?newSizes[0]:null;
      }
    }
  }
  renderQC();
}

// v120/v121: when leaving the QC view (back to queue, boxing, etc), exit
// cockpit mode and reset body padding to its default scroll-with-badge model.
function resetActRowPadding(){
  document.body.classList.remove('qc-mode');
  document.body.style.paddingBottom='';
}

// v114: toggle a location chip's checked state; re-render so submit gating updates.
function toggleLocCheck(jobId,impRecId){
  var st=qcState[jobId];
  if(!st)return;
  if(!st.locsChecked)st.locsChecked={};
  if(st.locsChecked[impRecId])delete st.locsChecked[impRecId];
  else st.locsChecked[impRecId]=true;
  renderQC();
}

// ─── V110 RENDER HELPERS ─────────────────────────────────────────────
// Per-size damage totals from reason counts. TBD events count too (until resolved at submit).
// "caught" in the returned object is the DERIVED caught value (Ord - dmg + offset),
// not the raw `sd.caught` field. Pass ord to compute it; if ord is omitted, caught=0.
function sizeTotals(sd,ord){
  if(!sd)return {caught:0,print:0,other:0,tbd:0,total:0,offset:0};
  var pSum=0,oSum=0;
  var pc=sd.printReasonCounts||{};
  var oc=sd.otherReasonCounts||{};
  Object.keys(pc).forEach(function(k){pSum+=pc[k]||0;});
  Object.keys(oc).forEach(function(k){oSum+=oc[k]||0;});
  var tbdCt=(sd.tbdEvents||[]).length;
  var dmg=pSum+oSum+tbdCt;
  var offset=parseInt(sd.caughtOffset)||0;
  var caught=Math.max(0,(parseInt(ord)||0)-dmg+offset);
  return {
    caught:caught,
    print:pSum,
    other:oSum,
    tbd:tbdCt,
    total:dmg,
    offset:offset
  };
}

// Caught for a size — convenience wrapper for renderTallyBar/onCaughtType.
function caughtForSize(sd,ord){
  return sizeTotals(sd,ord).caught;
}

// Sum all damage counts across a colorway state.
function colorwayDamageTotal(cwSt){
  var s={print:0,other:0,tbd:0};
  if(!cwSt)return s;
  Object.keys(cwSt).forEach(function(sz){
    if(sz.charAt(0)==='_')return;
    var t=sizeTotals(cwSt[sz]);
    s.print+=t.print;s.other+=t.other;s.tbd+=t.tbd;
  });
  return s;
}

// Top-level render for one colorway card. Builds:
//   - thumbnail + meta header
//   - tally bar (size picker + caught + reason buttons + toolbar)
//   - read-only summary table
//   - notes textarea
function renderColorwayCard(cw,ci,job,st){
  var cwSt=st.cwData[cw.liId]||{};
  var totals=colorwayDamageTotal(cwSt);
  // v110: "counted" = catcher has interacted with this colorway (taps or offset edits)
  var counted=false;
  (st.tapHistory||[]).forEach(function(e){if(e.liId===cw.liId)counted=true;});
  if(!counted){
    Object.keys(cwSt).forEach(function(k){
      if(k.charAt(0)==='_')return;
      if((parseInt(cwSt[k].caughtOffset)||0)!==0)counted=true;
    });
  }
  var isActive=st.activeCwId===cw.liId;
  var cls='cw-card'+(counted?' counted':'')+(isActive?' active':'');
  var h='<div class="'+cls+'" id="cwcard_'+cw.liId+'" onclick="setActiveCw(\''+cw.liId+'\')">';
  // ── LEFT SIDE: large mockup + meta ──
  h+='<div class="cw-left">';
  h+='<div class="cw-left-meta">';
  h+='<div class="cw-meta-name">'+(cw.garmentName||cw.colorwayName||'Colorway')+'</div>';
  var subParts=[];
  if(cw.colorwayName&&cw.garmentName&&cw.colorwayName!==cw.garmentName)subParts.push(cw.colorwayName);
  subParts.push((cw.reprint&&cw.origTotal)?(cw.total+' to reprint · '+cw.origTotal+' on order'):(cw.total+' pcs ordered'));
  if(totals.print>0)subParts.push(totals.print+' print dmg');
  if(totals.other>0)subParts.push(totals.other+' other dmg');
  if(totals.tbd>0)subParts.push(totals.tbd+' TBD');
  h+='<div class="cw-meta-sub">'+subParts.join(' · ')+'</div>';
  h+='</div>';
  h+='<div class="cw-img" onclick="event.stopPropagation();openProofs(\''+cw.liId+'\')">';
  if(cw.thumb)h+='<img src="'+cw.thumb+'" alt="Proof">';
  else if(job.proofs[ci]&&job.proofs[ci].thumb)h+='<img src="'+job.proofs[ci].thumb+'" alt="Proof">';
  else h+='<svg class="cw-img-ph" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  h+='</div>';
  h+='<div class="cw-img-hint">Tap proof to enlarge</div>';
  h+='</div>'; // cw-left
  // ── RIGHT SIDE: tally + summary + notes ──
  h+='<div class="cw-right">';
  h+=renderTallyBar(cw,job,st);
  h+=renderSummaryTable(cw,st);
  // v118: per-LI spoilage card sits inside the colorway card, replacing the
  // old single run-level spoilage card at the bottom of renderQC. Each card
  // shows its own resolution; run context is appended as a footer line on
  // multi-LI orders only.
  h+='<div class="card" id="spoilCard_'+cw.liId+'" style="margin-bottom:0">'+buildSpoilage(job,cw,st)+'</div>';
  // Notes
  var notesVal=(cwSt._notes||'').replace(/"/g,'&quot;');
  h+='<div class="notes-wrap">';
  h+='<div class="notes-lbl">Additional notes (optional)</div>';
  h+='<textarea class="notes-in" placeholder="e.g. including extras, will absorb 2 of 3" '
    +'oninput="event.stopPropagation();onNotes(\''+cw.liId+'\',this.value)" onclick="event.stopPropagation()">'+notesVal+'</textarea>';
  h+='</div>';
  h+='</div>'; // cw-right
  h+='</div>'; // cw-card
  return h;
}

// The work surface — size picker, caught, reason buttons, toolbar.
function renderTallyBar(cw,job,st){
  var cwSt=st.cwData[cw.liId]||{};
  var sizes=Object.keys(cw.sizes).sort(function(a,b){return SZ_ORDER.indexOf(a)-SZ_ORDER.indexOf(b);});
  var activeSize=st.activeSize;
  // If only one size and nothing picked, auto-select it
  if(sizes.length===1&&!activeSize){
    activeSize=sizes[0];
    st.activeSize=activeSize;
  }
  // Validate active size against this colorway's sizes (might be set from a different cw)
  var activeForThisCw=activeSize&&sizes.indexOf(activeSize)>=0?activeSize:null;
  var h='<div class="tally-bar" onclick="event.stopPropagation()">';
  // v118: Bandana need-to-print headline. Sits at the top of the tally bar so
  // catchers can read "how many more do we need to print" from across the
  // table. Math: Need = max(0, Ordered − Caught) where Caught is the live
  // displayed Caught (auto value + manual offset).
  var isBandana=job.isBandana||(job.locations||[]).indexOf('Bandana')>=0;
  if(isBandana){
    var ord=cw.total||0;
    var caughtSum=0,dmgSum=0;
    sizes.forEach(function(sz){
      var sd=cwSt[sz];
      var szOrd=cw.sizes[sz]||0;
      if(!sd){
        // No taps yet on this size — treat as all caught (autopopulate model
        // assumes everything caught, deduct damages as they're tapped).
        caughtSum+=szOrd;
      }else{
        var t=sizeTotals(sd,szOrd);
        caughtSum+=t.caught;
        dmgSum+=t.print+t.other+t.tbd;
      }
    });
    var need=Math.max(0,ord-caughtSum);
    var doneCls=need===0?' done':'';
    h+='<div class="tb-bnd-head'+doneCls+'">';
    h+='<span class="tb-bnd-num">'+need+'</span>';
    h+='<span class="tb-bnd-lbl">'+(need===0?'Order<br>complete':'More to print<br>to complete order')+'</span>';
    h+='</div>';
    h+='<div class="tb-bnd-stats">';
    h+='<div class="tb-bnd-stat"><span class="tb-bnd-stat-lbl">'+(cw.reprint?'To reprint':'Ordered')+'</span><span class="tb-bnd-stat-val">'+ord+'</span></div>';
    h+='<div class="tb-bnd-stat"><span class="tb-bnd-stat-lbl">Caught</span><span class="tb-bnd-stat-val caught">'+caughtSum+'</span></div>';
    h+='<div class="tb-bnd-stat"><span class="tb-bnd-stat-lbl">Damaged</span><span class="tb-bnd-stat-val dmg">'+dmgSum+'</span></div>';
    h+='</div>';
  }
  // No size active → banner
  if(!activeForThisCw){
    h+='<div class="tb-banner">▼ Pick a size below to start tallying ▼</div>';
  }
  // Size picker
  h+='<div class="tb-sz-row">';
  h+='<div class="tb-sz-lbl">Size</div>';
  h+='<div class="tb-sz-chips">';
  sizes.forEach(function(sz){
    var on=(activeForThisCw===sz);
    var szEx=(!isBandana&&cw.extrasBySize&&cw.extrasBySize[sz])?cw.extrasBySize[sz]:0;
    h+='<button class="tb-sz-chip'+(on?' active':'')+'" onclick="pickSize(\''+cw.liId+'\',\''+sz+'\')">'
      +sz+'<span class="tb-sz-ord">'+cw.sizes[sz]+(szEx>0?' <span class="tb-sz-ex">+'+szEx+'</span>':'')+'</span></button>';
  });
  h+='</div>';
  // Spoilage indicator (live)
  // v118: denominator is per-LI (this card's qty), reverted from v116's run-total.
  // Owner directive: per-LI is the conservative threshold — catches lopsided
  // damage (e.g. 8/100 on purple inside a 500-pc run). Run-total context lives
  // in the spoilage card at the bottom as informational only.
  var totals=colorwayDamageTotal(cwSt);
  var totalDmg=totals.print+totals.other+totals.tbd;
  var pct=cw.total>0?(totalDmg/cw.total)*100:0;
  var pctCls=pct>5?'bad':pct>1?'warn':'ok';
  h+='<div class="tb-spoil '+pctCls+'" id="spoil_'+cw.liId+'">'+pct.toFixed(1)+'%</div>';
  h+='</div>'; // tb-sz-row
  // v114: Location chip row — mirrors the Size row above. One chip per imprint
  // location on this pile. Catcher taps each after the final dryer pass to
  // mark "quality-checked." Single-location piles auto-check on enter QC;
  // multi-location piles must have all chips ✓ before submit unlocks.
  // Lives inside the tally bar so it visually sits with the size workflow.
  var imps=job.imprints||[];
  if(imps.length>0){
    if(!st.locsChecked)st.locsChecked={};
    var checkedCt=imps.filter(function(i){return st.locsChecked[i.recordId];}).length;
    var allLocCk=checkedCt===imps.length;
    h+='<div class="tb-sz-row tb-loc-row">';
    h+='<div class="tb-sz-lbl">Loc</div>';
    h+='<div class="tb-sz-chips">';
    imps.forEach(function(im){
      var on=!!st.locsChecked[im.recordId];
      var loc=(im.loc||'—').toUpperCase();
      var impId=im.imprintId||'';
      var ridEsc=String(im.recordId).replace(/'/g,"\\'");
      h+='<button class="tb-loc-chip'+(on?' on':'')+'" onclick="toggleLocCheck(\''+activeJobId+'\',\''+ridEsc+'\')">'
        +'<span class="tb-loc-mark">'+(on?'✓':'⏳')+'</span>'
        +'<span>'+loc+'</span>';
      if(impId)h+='<span class="tb-loc-impid">'+impId+'</span>';
      h+='</button>';
    });
    h+='</div>';
    // Right-side counter, parallel to the spoilage % chip
    var locProgCls='tb-loc-prog'+(allLocCk?' ok':' amb');
    h+='<div class="'+locProgCls+'">'+checkedCt+'/'+imps.length+'</div>';
    h+='</div>'; // tb-loc-row
  }
  // Caught row — derived from Ord - dmg + manual offset (v110 autopopulate model)
  var sd=activeForThisCw?(cwSt[activeForThisCw]||{}):{};
  var ord=activeForThisCw?(cw.sizes[activeForThisCw]||0):0;
  var caughtVal=activeForThisCw?caughtForSize(sd,ord):0;
  var dis=!activeForThisCw;
  var hasOffset=activeForThisCw&&typeof sd.caughtOffset==='number'&&sd.caughtOffset!==0;
  h+='<div class="tb-caught-row">';
  h+='<div class="tb-caught-lbl">Caught</div>';
  h+='<button class="tb-caught-btn" '+(dis?'disabled':'')+' onclick="tapCaught(\''+cw.liId+'\')" title="Bumps caught +1 for absorbed pieces from another order">+ Caught</button>';
  h+='<input class="tb-caught-input" type="number" min="0" value="'+(activeForThisCw?caughtVal:'')+'" placeholder="0" '
    +(dis?'disabled':'')
    +' oninput="onCaughtType(\''+cw.liId+'\',this.value)" onclick="event.stopPropagation()">';
  h+='<div class="tb-caught-mode'+(hasOffset?' manual':'')+'">'
    +(activeForThisCw?(hasOffset?('on '+activeForThisCw+' · adj '+(sd.caughtOffset>0?'+':'')+sd.caughtOffset):('on '+activeForThisCw+' · auto')):'')
    +'</div>';
  h+='</div>';
  // Print bucket
  var _ds=dmgSetForJob(activeJobId);
  h+=renderBucketRow(cw,'print',activeForThisCw,sd,_ds.team,_ds.print);
  // Other bucket
  h+=renderBucketRow(cw,'other',activeForThisCw,sd,'Other',_ds.other);
  // TBD bucket — single button
  h+='<div class="tb-bucket tbd"><div class="tb-bucket-lbl">Unsure / TBD</div><div class="tb-rchips">';
  var tbdCt=(sd.tbdEvents||[]).length;
  var tbdCls='tb-rbtn'+(tbdCt>0?' has-count':'');
  h+='<button class="'+tbdCls+'" '+(dis?'disabled':'')+' onclick="tapTBD(\''+cw.liId+'\')" '
    +'oncontextmenu="event.preventDefault();longPressTBD(\''+cw.liId+'\')">'
    +'<span class="tb-rbtn-name">'+TBD_LABEL+'</span>'
    +'<span class="tb-rbtn-ct'+(tbdCt===0?' zero':'')+'">'+tbdCt+'</span>';
  // v119: minus pill on TBD too
  if(tbdCt>0&&!dis){
    h+='<span class="tb-rbtn-minus" onclick="event.stopPropagation();longPressTBD(\''+cw.liId+'\')" aria-label="Remove last TBD">−</span>';
  }
  h+='</button>';
  h+='</div></div>';
  // Toolbar
  var canUndo=(st.tapHistory||[]).length>0;
  h+='<div class="tb-toolbar">';
  h+='<button class="tb-undo" '+(canUndo?'':'disabled')+' onclick="undoLast()">↩ Undo last</button>';
  if(totals.tbd>0){
    h+='<div class="tb-tbd-warn">⚠ '+totals.tbd+' TBD damage'+(totals.tbd!==1?'s':'')+' — assign at submit</div>';
  }else{
    h+='<div></div>';
  }
  h+='</div>';
  h+='</div>'; // tally-bar
  return h;
}

// One bucket row of reason buttons (Print or Other).
function renderBucketRow(cw,bucket,activeSize,sd,label,reasonList){
  var dis=!activeSize;
  var counts=(bucket==='print')?(sd.printReasonCounts||{}):(sd.otherReasonCounts||{});
  var h='<div class="tb-bucket '+bucket+'"><div class="tb-bucket-lbl">'+label+'</div><div class="tb-rchips">';
  reasonList.forEach(function(r){
    var ct=counts[r]||0;
    var cls='tb-rbtn'+(ct>0?' has-count':'');
    var rEsc=r.replace(/'/g,"\\'");
    h+='<button class="'+cls+'" '+(dis?'disabled':'')
      +' onclick="tapReason(\''+cw.liId+'\',\''+bucket+'\',\''+rEsc+'\')"'
      +' oncontextmenu="event.preventDefault();longPressReason(\''+cw.liId+'\',\''+bucket+'\',\''+rEsc+'\')">'
      +'<span class="tb-rbtn-name">'+r+'</span>'
      +'<span class="tb-rbtn-ct'+(ct===0?' zero':'')+'">'+ct+'</span>';
    // v119: minus pill — only render when count > 0. event.stopPropagation
    // prevents the chip's "add" handler from firing on the same tap.
    if(ct>0&&!dis){
      h+='<span class="tb-rbtn-minus" onclick="event.stopPropagation();longPressReason(\''+cw.liId+'\',\''+bucket+'\',\''+rEsc+'\')" aria-label="Remove one">−</span>';
    }
    h+='</button>';
  });
  h+='</div></div>';
  return h;
}

// Read-only per-size summary (Sz | Ord | Caught | Print | Other | TBD).
function renderSummaryTable(cw,st){
  var cwSt=st.cwData[cw.liId]||{};
  var sizes=Object.keys(cw.sizes).sort(function(a,b){return SZ_ORDER.indexOf(a)-SZ_ORDER.indexOf(b);});
  var totalCaught=0,totalPrint=0,totalOther=0,totalTBD=0,totalOrd=0;
  var h='<div class="cw-summary"><table class="cw-sum-tbl">';
  h+='<thead><tr><th>Size</th><th>Ord</th><th>Caught</th><th class="print">Print</th><th class="other">Other</th><th class="tbd">Unsure</th></tr></thead>';
  h+='<tbody>';
  sizes.forEach(function(sz){
    var ord=cw.sizes[sz]||0;
    var t=sizeTotals(cwSt[sz],ord);
    totalCaught+=t.caught;totalPrint+=t.print;totalOther+=t.other;totalTBD+=t.tbd;totalOrd+=ord;
    var rowCls=(st.activeSize===sz)?' class="active-row"':'';
    h+='<tr'+rowCls+'>';
    h+='<td>'+sz+'</td>';
    h+='<td class="muted">'+cw.sizes[sz]+'</td>';
    h+='<td>'+(t.caught||'—')+'</td>';
    h+='<td class="print">'+(t.print||'—')+'</td>';
    h+='<td class="other">'+(t.other||'—')+'</td>';
    h+='<td class="tbd">'+(t.tbd||'—')+'</td>';
    h+='</tr>';
  });
  h+='</tbody>';
  h+='<tfoot><tr><td>Total</td><td>'+totalOrd+'</td><td>'+totalCaught+'</td>'
    +'<td class="print">'+totalPrint+'</td>'
    +'<td class="other">'+totalOther+'</td>'
    +'<td class="tbd">'+totalTBD+'</td></tr></tfoot>';
  h+='</table></div>';
  return h;
}

function buildSpoilage(job,cw,st){
  // v118: Per-LI is the authoritative driver again (reverted from v116's run-total).
  // Owner directive: catches lopsided damage scenarios (e.g. 8/100 on purple
  // inside a 500-pc run that's only 1.8% overall). Per-LI flags it RE-PRINT;
  // run-level math would have hidden it.
  //
  // Run-total is still computed and displayed as a "Run context" line at the
  // bottom — informational only, hidden on single-LI orders. It does NOT drive
  // the Resolution badge or any Airtable write.
  var cwSt=st.cwData[cw.liId]||{};
  var totals=colorwayDamageTotal(cwSt);
  var liDmg=totals.print+totals.other+totals.tbd;
  var liQty=cw.total||0;
  var liPct=liQty>0?(liDmg/liQty)*100:0;
  // Stash per-LI spoilage on the cw state slot for renderQueue's "X% spoil" tag.
  // st.spoilage is shared across cards in the same job — last-card-rendered wins.
  // That's fine for the queue tag, which is informational.
  st.spoilage=liPct;
  // Run-context (informational only, no longer drives resolution)
  var runTotalPcs=(typeof job.runTotalPcs==='number'&&job.runTotalPcs>0)?job.runTotalPcs:job.qty;
  var runDmg=0;
  var showRunContext=false;
  if(typeof job.runTotalPcs==='number'&&job.runTotalPcs>0&&job.colorways&&job.colorways.length>1){
    // Multi-LI order — walk all cards in the same orderNum to sum damages
    jobs.forEach(function(otherJob){
      if(otherJob.orderNum!==job.orderNum)return;
      var otherSt=qcState[otherJob.id];
      if(!otherSt||!otherSt.cwData)return;
      Object.values(otherSt.cwData).forEach(function(cwData){
        Object.keys(cwData).forEach(function(k){
          if(k.charAt(0)==='_')return;
          var t=sizeTotals(cwData[k]);
          runDmg+=t.print+t.other+t.tbd;
        });
      });
    });
    showRunContext=true;
  }else{
    runDmg=liDmg;
    runTotalPcs=liQty;
  }
  var runPct=runTotalPcs>0?(runDmg/runTotalPcs)*100:0;
  // Per-LI threshold ladder. Bandanas always show LOGGED — they're cataloged
  // for customer record but resolution is handled outside this app's math.
  var isBandana=job.isBandana||(job.locations||[]).indexOf('Bandana')>=0;
  var res='NO ACTION',resClass='res-ok';
  if(liDmg>0){
    if(isBandana){res='LOGGED';resClass='res-ok';}
    else if(liPct<1){res='NO ACTION';resClass='res-ok';}
    else if(liPct<5){res='REVIEW';resClass='res-warn';}
    else{res='RE-PRINT';resClass='res-bad';}
  }
  var pctCls=liPct>5?'bad':liPct>1?'warn':'ok';
  // Subtitle identifies which LI this card is judging
  var subParts=[];
  if(cw.colorwayName)subParts.push(cw.colorwayName);
  var liLabel=subParts.length?subParts.join(' · '):'';
  var h='<div class="card-h"><span class="card-t">Spoilage</span>';
  if(liLabel)h+='<span style="font-size:12px;color:var(--muted-lt);font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:8px">'+liLabel+'</span>';
  h+='</div><div class="card-b">';
  h+='<div class="spoil-row"><span class="spoil-lbl">Spoilage</span><span class="spoil-pct '+pctCls+'">'+liPct.toFixed(1)+'%</span></div>';
  h+='<div class="spoil-bar-wrap"><div class="spoil-bar '+pctCls+'" style="width:'+Math.min(100,liPct)+'%"></div></div>';
  h+='<div class="spoil-row"><span class="spoil-lbl">Resolution</span><span class="res-badge '+resClass+'">'+res+'</span></div>';
  if(liDmg>0)h+='<div class="spoil-row" style="margin-top:4px"><span class="spoil-lbl">This LI</span><span style="font-size:12px;color:var(--muted);font-family:var(--mono)">'+liDmg+' of '+liQty+' pcs</span></div>';
  // Run-context footer — multi-LI orders only
  if(showRunContext){
    h+='<div class="spoil-row" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)">'
      +'<span class="spoil-lbl" style="color:var(--muted-lt)">Run context</span>'
      +'<span style="font-size:12px;color:var(--muted);font-family:var(--mono)">'+runDmg+' of '+runTotalPcs+' · '+runPct.toFixed(1)+'%</span>'
      +'</div>';
  }
  h+='</div>';
  return h;
}

// ─── INPUT HANDLERS (v110 tally + autopopulate caught) ────────────────
// State shape per (cw, sz):
//   {
//     caughtOffset: 0,           // manual adjustment from auto value (Ord - dmg)
//     printReasonCounts: {},
//     otherReasonCounts: {},
//     tbdEvents: []
//   }
// Displayed Caught = max(0, Ord - totalDmg + caughtOffset)
function ensureSdShape(jobId,liId,sz){
  var st=qcState[jobId];
  if(!st.cwData[liId])st.cwData[liId]={};
  var sd=st.cwData[liId][sz];
  if(!sd){
    sd={caughtOffset:0,printReasonCounts:{},otherReasonCounts:{},tbdEvents:[]};
    st.cwData[liId][sz]=sd;
  }
  // Defensive — older state migrating in
  if(!sd.printReasonCounts)sd.printReasonCounts={};
  if(!sd.otherReasonCounts)sd.otherReasonCounts={};
  if(!sd.tbdEvents)sd.tbdEvents=[];
  if(typeof sd.caughtOffset!=='number')sd.caughtOffset=0;
  return sd;
}

// Pick active size for a colorway. Active size is shared across all colorways
// in the job (lives at qcState[jobId].activeSize per design).
function pickSize(liId,sz){
  var st=qcState[activeJobId];
  if(!st)return;
  st.activeSize=sz;
  st.activeCwId=liId;
  ensureSdShape(activeJobId,liId,sz);
  renderQC();
}

// Mark this colorway as the active card (used when catcher clicks anywhere
// on the card not consumed by another handler).
function setActiveCw(liId){
  var st=qcState[activeJobId];
  if(!st)return;
  if(st.activeCwId===liId)return;
  st.activeCwId=liId;
  // Don't re-render unless we want the visual highlight; cheaper to just toggle classes
  document.querySelectorAll('.cw-card').forEach(function(el){el.classList.remove('active');});
  var c=document.getElementById('cwcard_'+liId);
  if(c)c.classList.add('active');
}

// Tap a Print or Other reason — increments count for active size.
function tapReason(liId,bucket,reason){
  var st=qcState[activeJobId];
  if(!st)return;
  var sz=st.activeSize;
  if(!sz)return; // size required
  var sd=ensureSdShape(activeJobId,liId,sz);
  var counts=(bucket==='print')?sd.printReasonCounts:sd.otherReasonCounts;
  counts[reason]=(counts[reason]||0)+1;
  st.tapHistory=st.tapHistory||[];
  st.tapHistory.push({kind:bucket,liId:liId,sz:sz,reason:reason,delta:1});
  renderQC();
}

// Long-press a Print or Other reason — decrements count for active size, floors at 0.
function longPressReason(liId,bucket,reason){
  var st=qcState[activeJobId];
  if(!st)return;
  var sz=st.activeSize;
  if(!sz)return;
  var sd=ensureSdShape(activeJobId,liId,sz);
  var counts=(bucket==='print')?sd.printReasonCounts:sd.otherReasonCounts;
  if(!counts[reason]||counts[reason]<=0)return;
  counts[reason]--;
  if(counts[reason]===0)delete counts[reason];
  st.tapHistory=st.tapHistory||[];
  st.tapHistory.push({kind:bucket,liId:liId,sz:sz,reason:reason,delta:-1});
  renderQC();
}

// Tap [+ Caught] — bumps the offset +1 (catcher absorbed an extra piece).
// Subsequent damage taps still decrement the displayed value, preserving the
// adjustment as a sticky offset.
function tapCaught(liId){
  var st=qcState[activeJobId];
  if(!st)return;
  var sz=st.activeSize;
  if(!sz)return;
  var sd=ensureSdShape(activeJobId,liId,sz);
  sd.caughtOffset=(parseInt(sd.caughtOffset)||0)+1;
  st.tapHistory=st.tapHistory||[];
  st.tapHistory.push({kind:'caught',liId:liId,sz:sz,delta:1});
  renderQC();
}

// Type into the Caught input — recompute caughtOffset so displayed value matches.
// e.g. Ord=20, dmg=3, current offset=0, displayed Caught=17. Catcher types 18.
//      → new offset = 18 - (20 - 3) = +1.
function onCaughtType(liId,val){
  saveQCSoon();  // v146
  var st=qcState[activeJobId];
  if(!st)return;
  var sz=st.activeSize;
  if(!sz)return;
  var job=jobs.find(function(j){return j.id===activeJobId;});
  if(!job)return;
  var cw=(job.colorways||[]).find(function(c){return c.liId===liId;});
  if(!cw)return;
  var ord=parseInt(cw.sizes[sz])||0;
  var sd=ensureSdShape(activeJobId,liId,sz);
  // Compute current dmg
  var t=sizeTotals(sd,ord);
  var dmg=t.print+t.other+t.tbd;
  var typed=parseInt(val);
  if(isNaN(typed))typed=0;
  // offset = typed - (ord - dmg)
  sd.caughtOffset=typed-(ord-dmg);
  // Don't push to tapHistory — typing is direct, not undoable as a single event
  // Update card border + spoilage etc.
  var card=document.getElementById('cwcard_'+liId);
  if(card){
    if(typed>0)card.classList.add('counted');
    else card.classList.remove('counted');
  }
  refreshLiveStats();
  // Update the mode label inline (without full re-render — preserves input focus)
  // The label is the next sibling of the input's parent .tb-caught-row's mode div
  var modeDiv=card?card.querySelector('.tb-caught-mode'):null;
  if(modeDiv){
    var newOffset=sd.caughtOffset;
    var hasOffset=newOffset!==0;
    modeDiv.className='tb-caught-mode'+(hasOffset?' manual':'');
    modeDiv.textContent='on '+sz+(hasOffset?(' · adj '+(newOffset>0?'+':'')+newOffset):' · auto');
  }
}

// TBD tap — opens modal asking for a quick free-text note.
var pendingTBD=null; // {liId, sz}
function tapTBD(liId){
  var st=qcState[activeJobId];
  if(!st)return;
  var sz=st.activeSize;
  if(!sz)return;
  pendingTBD={liId:liId,sz:sz};
  var inp=document.getElementById('tnInput');
  if(inp){inp.value='';setTimeout(function(){inp.focus();},50);}
  document.getElementById('tnModal').classList.add('open');
}
function tnClose(){
  pendingTBD=null;
  document.getElementById('tnModal').classList.remove('open');
}
function tnConfirm(){
  if(!pendingTBD){tnClose();return;}
  var note=(document.getElementById('tnInput').value||'').trim();
  // Allow empty note — they can fix later
  var liId=pendingTBD.liId,sz=pendingTBD.sz;
  var st=qcState[activeJobId];
  var sd=ensureSdShape(activeJobId,liId,sz);
  var eventId='tbd-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  sd.tbdEvents.push({id:eventId,note:note});
  st.tapHistory=st.tapHistory||[];
  st.tapHistory.push({kind:'tbd',liId:liId,sz:sz,eventId:eventId});
  tnClose();
  renderQC();
}

// Long-press TBD — removes the LAST TBD event from active size.
function longPressTBD(liId){
  var st=qcState[activeJobId];
  if(!st)return;
  var sz=st.activeSize;
  if(!sz)return;
  var sd=ensureSdShape(activeJobId,liId,sz);
  if(!sd.tbdEvents||sd.tbdEvents.length===0)return;
  var removed=sd.tbdEvents.pop();
  st.tapHistory=st.tapHistory||[];
  // Remove the matching entry from history if present
  for(var i=st.tapHistory.length-1;i>=0;i--){
    var e=st.tapHistory[i];
    if(e.kind==='tbd'&&e.liId===liId&&e.sz===sz&&e.eventId===removed.id){
      st.tapHistory.splice(i,1);
      break;
    }
  }
  renderQC();
}

// Undo last action across all colorways and sizes.
function undoLast(){
  var st=qcState[activeJobId];
  if(!st||!st.tapHistory||!st.tapHistory.length)return;
  var last=st.tapHistory.pop();
  var sd=ensureSdShape(activeJobId,last.liId,last.sz);
  if(last.kind==='caught'){
    // v110: caught taps adjust caughtOffset, so undo reverses the offset
    sd.caughtOffset=(parseInt(sd.caughtOffset)||0)-(last.delta||1);
  }else if(last.kind==='print'||last.kind==='other'){
    var counts=(last.kind==='print')?sd.printReasonCounts:sd.otherReasonCounts;
    var newVal=(counts[last.reason]||0)-(last.delta||1);
    if(newVal<=0)delete counts[last.reason];
    else counts[last.reason]=newVal;
  }else if(last.kind==='tbd'){
    // Remove the TBD event with matching id
    sd.tbdEvents=(sd.tbdEvents||[]).filter(function(e){return e.id!==last.eventId;});
  }
  renderQC();
}

// Update spoilage % readouts in place — for use by onCaughtType which doesn't
// re-render the whole card (preserves input focus). v121: now updates the
// cockpit footer for the active colorway instead of per-LI inline cards.
function refreshLiveStats(){
  saveQCSoon();  // v146 — every tap path ends here or in render()
  var st=qcState[activeJobId];
  var job=jobs.find(function(j){return j.id===activeJobId;});
  if(!job||!st)return;
  // Per-card spoilage chip in the tally bar (still keyed by liId — used to be
  // shown for every cw in v120, now only renders for the active one)
  (job.colorways||[]).forEach(function(cw){
    var cwSt=st.cwData[cw.liId]||{};
    var totals=colorwayDamageTotal(cwSt);
    var totalDmg=totals.print+totals.other+totals.tbd;
    var pct=cw.total>0?(totalDmg/cw.total)*100:0;
    var pctCls=pct>5?'bad':pct>1?'warn':'ok';
    var sp=document.getElementById('spoil_'+cw.liId);
    if(sp){sp.textContent=pct.toFixed(1)+'%';sp.className='tb-spoil '+pctCls;}
  });
  // v121: re-render the cockpit footer for the active colorway. Use a stable
  // ID lookup so we can swap the markup without touching the tally area.
  var foot=document.getElementById('cpFoot');
  if(foot){
    var activeCw=(job.colorways||[]).find(function(c){return c.liId===st.activeCwId;});
    if(activeCw){
      var newFoot=document.createElement('div');
      newFoot.innerHTML=renderCockpitFooter(activeCw,job,st,activeJobId);
      foot.replaceWith(newFoot.firstChild);
    }
  }
  // v110: submit always enabled — catcher can submit a clean run with zero damage
  var sb=document.getElementById('sbBtn');
  if(sb&&st.status!=='qc-done'){sb.disabled=false;}
}

function onNotes(liId,val){
  var st=qcState[activeJobId];
  if(!st)return;
  if(!st.cwData[liId])st.cwData[liId]={};
  st.cwData[liId]._notes=val; // underscore prefix so it won't collide with size keys
  saveQCSoon();  // v146
}

/* ============================================================
   v129 — REPRINT MODE (data layer)   [READ-derived; close rides existing writes]
   ------------------------------------------------------------
   SIGNAL (source of truth = the open issue, not the Caught flag):
     Order Issue where Resolution=="RE-PRINT" AND Status=="In progress"
     => that LI owes a reprint that has been approved but not yet completed.
   MAP: REPRINT_BY_LI[liId] = { sizes:{S:1,L:2,...}, total, oiRecIds:[...] }
     summed across ALL open RE-PRINT issues on that LI (print + other buckets).
     Join key = Affected Line Item rec id — no imprint-ID matching, no rollups.
   SURFACE (load): query drops NOT(Caught); a Caught imprint is re-included only
     when its LI owes a reprint. Reprint cards are flagged job.reprintMode.
   COUNT (step 2): reprint colorway expected sizes = REPRINT_BY_LI[liId].sizes.
     [RP] covers OSFA..5XL; 6XL-only reprint is a known gap (flag, not block).
   CLOSE (step 3): the catcher's Mark Complete flips each oiRecId Status ->
     "Completed" (selttaARsEXnxbd0G) so it never re-surfaces; markComplete's
     normal Order Status write still re-fires the sales notification.
   ============================================================ */
var REPRINT_BY_LI={};
// Fetch approved-but-incomplete reprints, grouped by affected Line Item.
// filterByFormula uses field IDs (this base accepts IDs in braces — same as
// the live today's-imprints query). Soft-fails to {} so the normal queue
// always loads even if this call errors.
function fetchReprintIssues(){
  var fml="AND({"+OI_FIELDS.status+"}='In progress',{"+OI_FIELDS.resolution+"}='RE-PRINT')";
  var fids=['fields%5B%5D='+OI_FIELDS.affectedLineItem,'fields%5B%5D='+OI_FIELDS.affectedOrder];
  Object.keys(SZ_TO_RP).forEach(function(sz){fids.push('fields%5B%5D='+SZ_TO_RP[sz]);});
  var url=OI_TBL+'?filterByFormula='+encodeURIComponent(fml)+'&'+fids.join('&')
    +'&returnFieldsByFieldId=true&pageSize=100';
  return api(url).then(function(data){
    var map={};
    (data.records||[]).forEach(function(r){
      var fl=r.fields||{};
      // multipleRecordLinks: v0 REST = ["recXXX"], MCP = [{id,name}] — handle both.
      var links=fl[OI_FIELDS.affectedLineItem]||[];
      var liId=(Array.isArray(links)&&links.length)
        ? ((typeof links[0]==='string')?links[0]:(links[0]&&links[0].id)||'') : '';
      if(!liId)return;
      if(!map[liId])map[liId]={sizes:{},total:0,oiRecIds:[]};
      if(map[liId].oiRecIds.indexOf(r.id)<0)map[liId].oiRecIds.push(r.id);
      Object.keys(SZ_TO_RP).forEach(function(sz){
        var v=parseInt(fl[SZ_TO_RP[sz]],10)||0;
        if(v>0){map[liId].sizes[sz]=(map[liId].sizes[sz]||0)+v;map[liId].total+=v;}
      });
    });
    return map;
  }).catch(function(e){console.warn('[v129] reprint issues fetch failed — normal queue only',e);return {};});
}

// POST to Airtable. When WRITES_ENABLED=false, logs to console and returns a
// preview object that mimics the real response shape ({id, fields}) so dependent
// code (DD link) can use a fake rec ID.
function atCreate(tableId,fields){
  if(!WRITES_ENABLED){
    var fakeId='recPREVIEW'+Math.random().toString(36).slice(2,9);
    console.log('[PREVIEW atCreate] '+tableId,fields);
    return Promise.resolve({preview:true,id:fakeId,fields:fields});
  }
  return fetch('https://api.airtable.com/v0/'+BASE+'/'+tableId,{
    method:'POST',
    headers:{'Authorization':'Bearer '+pat,'Content-Type':'application/json'},
    body:JSON.stringify({fields:fields})
  }).then(function(r){
    if(!r.ok)return r.json().then(function(j){throw new Error(j.error?j.error.message:'HTTP '+r.status);});
    return r.json();
  });
}

// v122: PATCH an Order record. Used by markComplete() to flip Order Status when
// all imprints on the order are caught. Returns Promise<boolean> — true on
// success, false on any failure (so caller can show a banner without crashing
// the catcher's flow). When WRITES_ENABLED=false, logs the payload and returns
// true so preview-mode behavior is identical to a successful write.
function atPatchOrder(recId,fields){
  if(!WRITES_ENABLED){
    console.log('[PREVIEW atPatchOrder] '+recId,fields);
    return Promise.resolve(true);
  }
  return fetch('https://api.airtable.com/v0/'+BASE+'/'+TOR+'/'+recId,{
    method:'PATCH',
    headers:{'Authorization':'Bearer '+pat,'Content-Type':'application/json'},
    body:JSON.stringify({fields:fields})
  }).then(function(r){
    if(!r.ok){
      return r.json().then(function(j){
        console.warn('[atPatchOrder failed]',recId,j&&j.error?j.error.message:'HTTP '+r.status);
        return false;
      }).catch(function(){return false;});
    }
    return true;
  }).catch(function(e){
    console.warn('[atPatchOrder error]',recId,e);
    return false;
  });
}

// v126: PATCH one or more Imprint records (used by markComplete to set Caught +
// Caught At). Takes [{id, fields}, ...], up to 10 per Airtable call. Returns
// Promise<boolean>. In preview mode logs and returns true.
function atPatchImprints(records){
  if(!records||!records.length)return Promise.resolve(true);
  if(!WRITES_ENABLED){
    console.log('[PREVIEW atPatchImprints]',records);
    return Promise.resolve(true);
  }
  // Chunk into batches of 10 (Airtable limit) and PATCH sequentially.
  var batches=[];for(var i=0;i<records.length;i+=10)batches.push(records.slice(i,i+10));
  return batches.reduce(function(chain,batch){
    return chain.then(function(prevOk){
      return fetch('https://api.airtable.com/v0/'+BASE+'/'+TI,{
        method:'PATCH',
        headers:{'Authorization':'Bearer '+pat,'Content-Type':'application/json'},
        body:JSON.stringify({records:batch})
      }).then(function(r){
        if(!r.ok){
          return r.json().then(function(j){
            console.warn('[atPatchImprints failed]',j&&j.error?j.error.message:'HTTP '+r.status);
            return false;
          }).catch(function(){return false;});
        }
        return prevOk;
      }).catch(function(e){console.warn('[atPatchImprints error]',e);return false;});
    });
  },Promise.resolve(true));
}

// v129: PATCH one or more Order Issue records. Used by markComplete to flip a
// completed reprint's issues to "Completed". Same shape as atPatchImprints:
// batches of 10, Promise<boolean> (false if any batch failed), preview no-op.
function atPatchIssues(recIds,fields){
  if(!recIds||!recIds.length)return Promise.resolve(true);
  if(!WRITES_ENABLED){
    console.log('[PREVIEW atPatchIssues]',recIds,fields);
    return Promise.resolve(true);
  }
  var records=recIds.map(function(id){return {id:id,fields:fields};});
  var batches=[];for(var i=0;i<records.length;i+=10)batches.push(records.slice(i,i+10));
  return batches.reduce(function(chain,batch){
    return chain.then(function(prevOk){
      return fetch('https://api.airtable.com/v0/'+BASE+'/'+OI_TBL,{
        method:'PATCH',
        headers:{'Authorization':'Bearer '+pat,'Content-Type':'application/json'},
        body:JSON.stringify({records:batch})
      }).then(function(r){
        if(!r.ok){
          return r.json().then(function(j){
            console.warn('[atPatchIssues failed]',j&&j.error?j.error.message:'HTTP '+r.status);
            return false;
          }).catch(function(){return false;});
        }
        return prevOk;
      }).catch(function(e){console.warn('[atPatchIssues error]',e);return false;});
    });
  },Promise.resolve(true));
}

// v126: read an order's AUTHORITATIVE caught state straight from Airtable so the
// complete/partial decision is device-independent — it reflects every iPad's
// catches and already-caught (now-filtered-out) imprints, not this device's
// local qcState. Returns {caught, total} or null on failure.
//   1. fetch the order's Prints link → all imprint record ids + Total Linked Imprints
//   2. fetch those imprints' Caught flags and count the checked ones
// Reads are read-after-write consistent on the records we just PATCHed, so no
// rollup-lag race.
function getOrderCaughtState(orderRecId){
  // v145 fix: fields[] made Airtable reject this read, so markComplete never set a status (since v126).
  return api(TOR+'/'+orderRecId+'?returnFieldsByFieldId=true')
    .then(function(od){
      if(!od||!od.fields)return null;
      var cur=od.fields[O.status];cur=(cur&&cur.name)||cur||'';
      var prints=od.fields[O.prints]||[];
      var impIds=prints.map(function(x){return (typeof x==='string')?x:(x&&x.id)||'';}).filter(Boolean);
      var total=od.fields[O.totalLinkedImprints]||impIds.length;
      if(!impIds.length)return {caught:0,total:total,status:cur};
      var orF=impIds.map(function(id){return "RECORD_ID()='"+id+"'";}).join(',');
      var url=TI+'?filterByFormula='+encodeURIComponent('OR('+orF+')')
        +'&fields%5B%5D='+F.caught+'&fields%5B%5D='+F.press+'&fields%5B%5D='+F.lineItems+'&returnFieldsByFieldId=true&pageSize=100';
      return api(url).then(function(impData){
        var caught=0;
        (impData&&impData.records||[]).forEach(function(r){
          var f=r.fields||{};
          if(f[F.caught]){caught++;return;}
          // v146 — heat press / sewing / tags etc. never come through catching, nor do imprints with
          // no line items; counting them as "not caught" left orders stuck at Partially Completed.
          var pv=f[F.press],pl=(typeof pv==='string'?pv:(pv&&pv.name)||'').toLowerCase();
          if((pl&&SKIP_PRESS.some(function(x){return pl.includes(x);}))||!(f[F.lineItems]||[]).length)caught++;
        });
        return {caught:caught,total:total,status:cur};
      });
    }).catch(function(e){console.warn('[getOrderCaughtState error]',orderRecId,e);return null;});
}

// Format a human-readable damage description for one bucket.
// bucket: 'print' | 'other'
// Returns "" if no damage in this bucket.
// Format: "3 damaged Print Team (2L, 1XL): Print Error, Smudge"
function formatBucketDescription(cw,cwSt,bucket,press){
  var rcField=bucket==='print'?'printReasonCounts':'otherReasonCounts';
  var label=bucket==='print'?dmgSet(press).desc:'Other';   // v149 — "Embroidery Team" / "Heat press Team" on those machines
  var sizeBreakdown=[],totalDmg=0,allReasons={};
  Object.keys(cwSt||{}).forEach(function(sz){
    if(sz.charAt(0)==='_')return; // skip _notes
    var sd=cwSt[sz]||{};
    var counts=sd[rcField]||{};
    var d=0;
    Object.keys(counts).forEach(function(r){d+=counts[r]||0;allReasons[r]=true;});
    if(d<=0)return;
    totalDmg+=d;
    sizeBreakdown.push(d+sz);
  });
  if(totalDmg===0)return '';
  sizeBreakdown.sort(function(a,b){
    var szA=a.replace(/^\d+/,''),szB=b.replace(/^\d+/,'');
    return SZ_ORDER.indexOf(szA)-SZ_ORDER.indexOf(szB);
  });
  var reasonList=Object.keys(allReasons);
  var desc=totalDmg+' damaged ('+label+')';
  if(sizeBreakdown.length>0)desc+=' ['+sizeBreakdown.join(', ')+']';
  if(reasonList.length>0)desc+=': '+reasonList.join(', ');
  var notes=(cwSt._notes||'').trim();
  if(notes)desc+='\n\nNotes: '+notes;
  return desc;
}

// Compute the union of all reasons across both buckets for legacy field.
function collectAllReasons(cwSt){
  var set={};
  Object.keys(cwSt||{}).forEach(function(sz){
    if(sz.charAt(0)==='_')return;
    var sd=cwSt[sz]||{};
    Object.keys(sd.printReasonCounts||{}).forEach(function(r){set[r]=true;});
    Object.keys(sd.otherReasonCounts||{}).forEach(function(r){set[r]=true;});
  });
  return Object.keys(set);
}

// Build pairs of {oi, dd} payloads for a job.
// Each pair represents one accountability bucket on one colorway.
// Pure function — no network, no side effects.
//
// IMPORTANT v109: TBD events must be resolved into real bucket counts BEFORE
// calling this function (via the TBD resolution modal at submit time). This
// function ignores tbdEvents entirely — they don't appear in OI or DD writes.
function buildIssuePayloads(jobId){
  var job=jobs.find(function(j){return j.id===jobId;});
  var st=qcState[jobId];
  if(!job||!st||!job.colorways)return [];
  // v118: Reverted from v116's run-total override. Per-LI is the driver again;
  // we let Airtable's native Resolution formula compute resolution per-LI.
  // No Change Resolution write, no audit note. Bandanas (no special-casing
  // needed anymore) also flow through native formula behavior.
  var pairs=[];
  job.colorways.forEach(function(cw){
    var cwSt=st.cwData[cw.liId]||{};
    // Build one pair per non-zero bucket
    ['print','other'].forEach(function(bucket){
      var rcField=bucket==='print'?'printReasonCounts':'otherReasonCounts';
      var totalDmg=0,rpFields={},ddFields={};
      var bucketReasonSet={};
      Object.keys(cw.sizes||{}).forEach(function(sz){
        var sd=cwSt[sz]||{};
        var counts=sd[rcField]||{};
        var d=0;
        Object.keys(counts).forEach(function(r){
          var c=counts[r]||0;
          if(c>0){d+=c;bucketReasonSet[r]=true;}
        });
        if(d>0){
          totalDmg+=d;
          var rpKey=SZ_TO_RP[sz];
          if(rpKey)rpFields[rpKey]=d;
          var ddKey=SZ_TO_DD[sz];
          if(ddKey)ddFields[ddKey]=d;
        }
      });
      if(totalDmg<=0)return; // no damage in this bucket → skip
      var bucketReasons=Object.keys(bucketReasonSet);
      var allReasons=collectAllReasons(cwSt); // union across both buckets — for legacy field
      var desc=formatBucketDescription(cw,cwSt,bucket,job.press);
      var accountValue=bucket==='print'?'Print Team':'Other';
      // ── Order Issue payload ──────────────────────────────────────────
      var oiFields={};
      oiFields[OI_FIELDS.affectedLineItem]=[cw.liId];
      if(job.orderRecordId)oiFields[OI_FIELDS.affectedOrder]=[job.orderRecordId];
      oiFields[OI_FIELDS.originator]='Quality Control';
      oiFields[OI_FIELDS.status]='Awaiting Review';
      oiFields[OI_FIELDS.accountability]=accountValue;
      // Legacy field — write union of all reasons (matches v107 behavior)
      oiFields[OI_FIELDS.qcReasonsLegacy]=allReasons;
      // New bucketed field — only this bucket's reasons
      var bucketFieldId=bucket==='print'?OI_FIELDS.qcReasonsPrint:OI_FIELDS.qcReasonsOther;
      oiFields[bucketFieldId]=bucketReasons;
      // Per-size [RP] counts (bucket-scoped)
      Object.keys(rpFields).forEach(function(fldId){oiFields[fldId]=rpFields[fldId];});
      oiFields[OI_FIELDS.description]=desc;
      // v118: no Change Resolution / Additional Notes override writes.
      // Airtable's native Resolution formula handles per-LI thresholds.
      // v135: split half-cards stamp which press this damage was caught on into
      // Additional Notes (no schema change) so P1 vs P2 accountability survives
      // in the record. Only written for split runs; normal cards leave it blank.
      if(job.isSplit){
        oiFields[OI_FIELDS.additionalNotes]='[SPLIT · '+job.splitLabel+' · '+job.press+'] Damage caught on the '+job.splitLabel+' half of a Press 1 & 2 split run ('+totalDmg+' pc'+(totalDmg!==1?'s':'')+', '+accountValue+').';
      }
      // ── Damage Detail payload (link to OI added at write-time) ───────
      var ddPayload={};
      ddPayload[DD_FIELDS.lineItem]=[cw.liId];
      ddPayload[DD_FIELDS.accountability]=accountValue;
      ddPayload[DD_FIELDS.reasons]=bucketReasons;
      Object.keys(ddFields).forEach(function(fldId){ddPayload[fldId]=ddFields[fldId];});
      var notes=(cwSt._notes||'').trim();
      if(notes)ddPayload[DD_FIELDS.notes]=notes;
      pairs.push({
        liId:cw.liId,
        garmentName:cw.garmentName||'',
        colorwayName:cw.colorwayName||'',
        bucket:bucket,
        accountability:accountValue,
        totalDmg:totalDmg,
        description:desc,
        reasons:bucketReasons,
        oiFields:oiFields,
        ddFields:ddPayload
      });
    });
  });
  return pairs;
}

// ─── SUBMIT QC — PREVIEW MODAL ────────────────────────────────────────
var pendingSubmitJobId=null;

// Returns all unresolved TBD groups across the job, indexed by (liId, sz).
// Each entry: {liId, sz, garmentName, colorwayName, events:[{id,note}]}
function collectUnresolvedTBDs(jobId){
  var job=jobs.find(function(j){return j.id===jobId;});
  var st=qcState[jobId];
  if(!job||!st)return [];
  var groups=[];
  (job.colorways||[]).forEach(function(cw){
    var cwSt=st.cwData[cw.liId]||{};
    Object.keys(cwSt).forEach(function(sz){
      if(sz.charAt(0)==='_')return;
      var sd=cwSt[sz]||{};
      if(sd.tbdEvents&&sd.tbdEvents.length>0){
        groups.push({
          liId:cw.liId,
          sz:sz,
          garmentName:cw.garmentName||'',
          colorwayName:cw.colorwayName||'',
          events:sd.tbdEvents.slice() // copy
        });
      }
    });
  });
  return groups;
}

// Apply the catcher's bucket+reason resolution for a TBD group.
// Mutates state: clears tbdEvents for this (liId, sz), adds count to chosen
// bucket+reason, appends each TBD note to the colorway's _notes field.
function resolveTBDGroup(jobId,liId,sz,bucket,reason){
  var st=qcState[jobId];
  if(!st)return;
  var sd=ensureSdShape(jobId,liId,sz);
  if(!sd.tbdEvents||sd.tbdEvents.length===0)return;
  var n=sd.tbdEvents.length;
  var counts=(bucket==='print')?sd.printReasonCounts:sd.otherReasonCounts;
  counts[reason]=(counts[reason]||0)+n;
  // Append TBD notes to colorway _notes
  var notesArr=sd.tbdEvents.map(function(e){
    var noteText=e.note?(' — '+e.note):'';
    return 'TBD on '+sz+noteText;
  });
  if(notesArr.length>0){
    var existing=(st.cwData[liId]._notes||'').trim();
    var newLines=notesArr.join('\n');
    st.cwData[liId]._notes=existing?(existing+'\n'+newLines):newLines;
  }
  // Clear TBD events
  sd.tbdEvents=[];
  // Strip from tap history so undo doesn't try to revive them
  if(st.tapHistory){
    st.tapHistory=st.tapHistory.filter(function(e){return !(e.kind==='tbd'&&e.liId===liId&&e.sz===sz);});
  }
}

function submitQC(jobId){
  pendingSubmitJobId=jobId;
  var unresolved=collectUnresolvedTBDs(jobId);
  if(unresolved.length>0){
    openTBDResolveModal(jobId,unresolved);
    return;
  }
  proceedToSubmitPreview(jobId);
}

function proceedToSubmitPreview(jobId){

}

function onTBDResolveConfirm(){
  if(!pendingTBDGroups){return;}
  // Validate: every group has bucket + reason
  var resolutions=[];
  for(var i=0;i<pendingTBDGroups.length;i++){

    var r=document.getElementById('tr_reason_'+i).value;

  var jobId=pendingSubmitJobId;

  proceedToSubmitPreview(jobId);
}

// v143: extras sent to the customer. Leftover extras per size = extras printed
// minus damage logged in that size (those extras replaced damaged pieces).
// Chips start UNticked; the catcher taps the ones going in the box. Saved to the
// line item (Extras Sent / Extras Sent Total / Extras Recorded) on submit.
var LI_EXTRAS_SENT='fldCP4NyoHxawZwOt',LI_EXTRAS_SENT_TOTAL='fldVcKknIW4cYNkEd',LI_EXTRAS_RECORDED='fld35LhFoIzYyfDUv';
var XS_ORDER=['OSFA','XS','S','M','L','XL','2XL','3XL','4XL','5XL','6XL'];
function extrasTracked(job,cw){
  var band=job.isBandana||(job.locations||[]).indexOf('Bandana')>=0;
  if(band||cw.reprint||!(cw.extras>0))return false;
  if(job.isSplit&&job.splitHalf==='p2')return false; // one card owns the line's extras
  return true;
}
function extrasLeft(cw,cwSt){
  var out={};
  XS_ORDER.forEach(function(sz){
    var ex=(cw.extrasBySize&&cw.extrasBySize[sz])||0;if(!ex)return;
    var d=sizeTotals((cwSt||{})[sz]).total;
    var left=Math.max(0,ex-d);
    if(left)out[sz]=left;
  });
  return out;
}
// v147 — default: every extra that didn't replace a damaged piece goes in the box as a bonus
function sentN(sent,left,sz){ return (sent&&sent[sz]!=null)?Math.min(sent[sz],left[sz]||0):(left[sz]||0); }
function extrasSectionHtml(job,cw,cwSt){
  var left=extrasLeft(cw,cwSt),sent=(cwSt&&cwSt._extrasSent)||{},sizes=Object.keys(left);
  var used=Math.max(0,(cw.extras||0)-sizes.reduce(function(a,sz){return a+left[sz];},0));
  var h='<div class="sm-x-h">Extras in the box · tap to keep out</div>';
  if(!sizes.length){return h+'<div class="sm-x-note">All '+cw.extras+' replaced damage.</div>';}
  h+='<div class="sm-x-chips">';
  sizes.forEach(function(sz){
    for(var i=0;i<left[sz];i++){
      var on=i<sentN(sent,left,sz);
      h+='<button type="button" class="sm-x-chip'+(on?' on':'')+'" onclick="tapExtraSent(\''+cw.liId+'\',\''+sz+'\','+i+')">'+(on?'✓ ':'')+sz+'</button>';
    }
  });
  h+='</div>';
  var nSent=sizes.reduce(function(a,sz){return a+sentN(sent,left,sz);},0),nLeft=sizes.reduce(function(a,sz){return a+left[sz];},0);
  h+='<div class="sm-x-note">'+nSent+' in the box'+(nLeft-nSent?' · '+(nLeft-nSent)+' kept out':'')+(used?' · '+used+' replaced damage':'')+'</div>';
  return h;
}
function tapExtraSent(liId,sz,i){
  var jobId=pendingSubmitJobId||activeJobId,st=qcState[jobId];if(!st)return;
  if(!st.cwData[liId])st.cwData[liId]={};
  var cwSt=st.cwData[liId],sent=cwSt._extrasSent=cwSt._extrasSent||{};
  var _job=jobs.find(function(j){return j.id===jobId;}),_cw=_job&&(_job.colorways||[]).find(function(c){return c.liId===liId;});
  if(sent[sz]==null&&_cw)sent[sz]=(extrasLeft(_cw,cwSt)[sz]||0);  // v147 — start from "all in the box"
  sent[sz]=(i<(sent[sz]||0))?i:i+1;
  saveQCSoon();
  var job=jobs.find(function(j){return j.id===jobId;});
  var cw=job&&(job.colorways||[]).find(function(c){return c.liId===liId;});
  var el=document.getElementById('smx_'+liId);
  if(el&&cw)el.innerHTML=extrasSectionHtml(job,cw,cwSt);
}
function extrasSentFields(job,cw,cwSt){
  var left=extrasLeft(cw,cwSt),sent=(cwSt&&cwSt._extrasSent)||{},parts=[],tot=0;
  XS_ORDER.forEach(function(sz){var n=sentN(sent,left,sz);if(n>0){parts.push(sz+':'+n);tot+=n;}});
  var f={};f[LI_EXTRAS_SENT]=parts.join(', ');f[LI_EXTRAS_SENT_TOTAL]=tot;f[LI_EXTRAS_RECORDED]=true;
  return f;
}
function writeExtrasSent(jobId){
  var job=jobs.find(function(j){return j.id===jobId;}),st=qcState[jobId];
  if(!job||!st)return [];
  return (job.colorways||[]).filter(function(cw){return extrasTracked(job,cw);}).map(function(cw){
    return atPatchOne(TLI,cw.liId,extrasSentFields(job,cw,st.cwData[cw.liId]||{}))
      .catch(function(e){return {error:'Extras for '+(cw.colorwayName||cw.garmentName||'line')+': '+e.message};});
  });
}

  var body=document.getElementById('smBody');

  if(!WRITES_ENABLED){

  }
  // v121: per-colorway summary table + notes textarea — moved out of the

  // size breakdown here, adds notes per LI if needed, then confirms.

    var cwSt=st.cwData[cw.liId]||{};

    h+='<div class="sm-item" style="background:var(--surface);border:1px solid var(--border)">';
