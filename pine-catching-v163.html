    h+=renderSummaryTable(cw,st);
    if(extrasTracked(job,cw))h+='<div class="sm-x" id="smx_'+cw.liId+'">'+extrasSectionHtml(job,cw,cwSt)+'</div>';  // v143
    h+='<div style="margin-top:8px"><label class="notes-lbl" style="display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-family:var(--cond);margin-bottom:4px">Notes</label>';
    h+='<textarea class="notes-in" placeholder="e.g. including extras, will absorb 2 of 3" '
      +'style="width:100%;min-height:40px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:16px;resize:vertical" '
      +'oninput="onNotes(\''+cw.liId+'\',this.value)">'+notesVal+'</textarea>';
    h+='</div>';
    h+='</div>';
  });
  if(pairs.length===0){
    h+='<div class="sm-empty" style="margin-top:10px">No damage.</div>';
  }else{
    h+='<div style="font-size:12px;color:var(--muted);font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 10px;padding-top:10px;border-top:1px solid var(--border)">'
      +'Damage to report</div>';
    pairs.forEach(function(p){
      var bucketCls=p.bucket==='print'?'r':'amb';
      // v151 — one line per issue: team · count · reasons (the garment is already in the header above)
      var teamLbl=p.bucket==='print'?dmgSet(job.press).desc:'Other';
      h+='<div class="sm-item"><div class="sm-item-hdr" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">';
      h+='<span class="tag '+bucketCls+'">'+teamLbl+'</span><b>'+p.totalDmg+'</b><span>'+p.reasons.map(function(r){return r.replace(/</g,'&lt;');}).join(', ')+'</span>';
      if((job.colorways||[]).length>1)h+='<span style="color:var(--muted)">· '+((p.colorwayName||p.garmentName||'').replace(/</g,'&lt;'))+'</span>';
      h+='</div></div>';
    });
  }
  body.innerHTML=h;
  var btn=document.getElementById('smConfirm');
  btn.onclick=smConfirm; // restore default handler in case TBD modal swapped it
  // v124: clear any leftover 'working' state from a previous submit. Without this,
  // the class added in smConfirm persists across modal closes and disables the
  // Submit button on subsequent imprints (looks greyed out, won't tap).
  btn.classList.remove('working');
  btn.disabled=false;
  if(pairs.length===0){
    btn.textContent='Mark QC Done';
  }else{
    btn.textContent=WRITES_ENABLED?('Create '+pairs.length+' Issue'+(pairs.length!==1?'s':'')):'Confirm (Preview)';
  }
}

function smClose(){
  document.getElementById('smModal').classList.remove('open');
  pendingSubmitJobId=null;
  pendingTBDGroups=null;
  // Restore default handler so next Submit click works correctly
  var btn=document.getElementById('smConfirm');
  if(btn){
    btn.onclick=smConfirm;
    // v124: defensive — ensure 'working' class doesn't survive a modal close.
    // smRender clears it too, but this covers TBD-modal paths and edge cases.
    btn.classList.remove('working');
    btn.disabled=false;
  }
}

// v108 write flow: for each pair, sequentially create OI → then DD with link.
// Pairs are processed in parallel (different OIs don't depend on each other),
// but within a pair the DD must wait for the OI's rec ID to populate the link.
// In preview mode, atCreate returns a fake rec ID so the DD payload still
// shows a link in the console log.
// v145: QC screen's '\ud83d\udce6 Box This Order' (box labels -- those now come from Receiving) is replaced by
//        '\ud83d\udda8 Packing slip' for the order. Boxing code is left in place, just not linked.
// v144: '\ud83d\udda8 Packing slip' on the order-ready header (ordered vs shipped, extras sent, no prices).
// v143: at submit, leftover extras show per size (unticked); the catcher taps the ones going in
// the box. Saved to Line Items > Extras Sent / Extras Sent Total / Extras Recorded.
// v142: no double-logging. Each submit remembers the Order Issue + Damage Detail it
// created per (card, line item, bucket) in localStorage. "Update QC", a Retry, or a
// re-submit after a page reload PATCHes those records with the new running totals
// instead of creating a second set (10671 on 9/10 was counted twice this way).
// A bucket cleared to zero since the last submit has its own records removed.
// Entries expire after 36h so a later reprint run of the same card logs fresh issues.
var WRITTEN_KEY='pine_catch_written_v1',WRITTEN_TTL=36*3600*1000;
function writtenAll(){
  var all={};try{all=JSON.parse(localStorage.getItem(WRITTEN_KEY)||'{}')||{};}catch(e){all={};}
  var now=Date.now();Object.keys(all).forEach(function(k){if(!all[k]||now-(all[k].ts||0)>WRITTEN_TTL)delete all[k];});
  return all;
}
function writtenGet(key){return writtenAll()[key]||null;}
function writtenSet(key,val){
  var all=writtenAll();
  if(val)all[key]={oi:val.oi,dd:val.dd,ts:Date.now()};else delete all[key];
  try{localStorage.setItem(WRITTEN_KEY,JSON.stringify(all));}catch(e){}
}
function writtenJobKeys(jobPrefix){return Object.keys(writtenAll()).filter(function(k){return k.indexOf(jobPrefix)===0;});}
function pairKey(jobId,pair){
  var job=jobs.find(function(j){return j.id===jobId;});
  return jobId+(job&&job.reprintMode?':rp':'')+'|'+pair.liId+'|'+pair.bucket;
}
function atPatchOne(tableId,recId,fields){
  if(!WRITES_ENABLED){console.log('[PREVIEW atPatchOne] '+tableId+' '+recId,fields);return Promise.resolve({id:recId,preview:true});}
  return fetch('https://api.airtable.com/v0/'+BASE+'/'+tableId+'/'+recId,{
    method:'PATCH',headers:{'Authorization':'Bearer '+pat,'Content-Type':'application/json'},body:JSON.stringify({fields:fields})
  }).then(function(r){
    if(!r.ok)return r.json().then(function(j){var e=new Error(j.error?j.error.message:'HTTP '+r.status);e.status=r.status;throw e;});
    return r.json();
  });
}
// Every size slot set explicitly, so a size cleared since the last submit goes to 0.
function withAllSizes(fields,map){
  var out=Object.assign({},fields);
  Object.keys(map).forEach(function(sz){var id=map[sz];if(id&&out[id]===undefined)out[id]=0;});
  return out;
}
function updatePair(pair,w){
  var oiF=withAllSizes(pair.oiFields,SZ_TO_RP);
  delete oiF[OI_FIELDS.status];      // keep whatever review status it has now
  delete oiF[OI_FIELDS.originator];
  var ddF=withAllSizes(pair.ddFields,SZ_TO_DD);
  return atPatchOne(OI_TBL,w.oi,oiF).then(function(oiRes){
    // v146 — the Damage Detail never got created last time: create + link it now
    var ddP=w.dd?atPatchOne(DD_TBL,w.dd,ddF):atCreate(DD_TBL,Object.assign({},ddF,{[DD_FIELDS.orderIssue]:[w.oi]})).then(function(d){ if(d&&d.id&&pair._key)writtenSet(pair._key,{oi:w.oi,dd:d.id}); return d; });
    return ddP.then(function(ddRes){return {oi:oiRes,dd:ddRes,updated:true};});
  });
}
// A bucket that had damage last submit but has none now: remove the records THIS app
// created for it (never anything else). A 0-piece issue left behind could still be
// approved as a $0 refund and email the bookkeeper.
function atDeleteOne(tableId,recId){
  if(!WRITES_ENABLED){console.log('[PREVIEW atDeleteOne] '+tableId+' '+recId);return Promise.resolve(true);}
  return fetch('https://api.airtable.com/v0/'+BASE+'/'+tableId+'/'+recId,{method:'DELETE',headers:{'Authorization':'Bearer '+pat}})
    .then(function(r){if(!r.ok&&r.status!==404)return r.json().then(function(j){throw new Error(j.error?j.error.message:'HTTP '+r.status);});return true;});
}
function removePair(key,w){
  // v146 — never delete an issue someone already reviewed (approved / in progress / done)
  return api(OI_TBL+'/'+w.oi+'?returnFieldsByFieldId=true').then(function(rec){
    var s=rec&&rec.fields&&rec.fields[OI_FIELDS.status]; s=(s&&s.name)||s||'';
    if(s&&s!=='Awaiting Review'){ showToast('An issue already marked "'+s+'" was kept — tell the production manager if it’s wrong','warn'); return {kept:true}; }
    var dd=w.dd?atDeleteOne(DD_TBL,w.dd):Promise.resolve(true);
    return dd.then(function(){return atDeleteOne(OI_TBL,w.oi);}).then(function(){writtenSet(key,null);return true;});
  },function(e){ if(e&&/NOT_FOUND|not found|404/i.test(e.message||'')){writtenSet(key,null);return true;} throw e; });
}
function writeOrUpdatePair(jobId,pair){
  var key=pairKey(jobId,pair),w=writtenGet(key);
  pair._key=key;  // v146
  if(w&&w.oi&&String(w.oi).indexOf('recPREVIEW')!==0){
    return updatePair(pair,w).catch(function(e){
      if(e&&e.status===404){writtenSet(key,null);return writeOrUpdatePair(jobId,pair);} // record was deleted in Airtable -> create fresh
      throw e;
    });
  }
  return writePair(pair,key).then(function(res){
    if(res&&res.oi&&res.oi.id&&!res.oi.preview)writtenSet(key,{oi:res.oi.id,dd:res.dd&&res.dd.id});
    return res;
  });
}

function writePair(pair,key){
  return atCreate(OI_TBL,pair.oiFields).then(function(oiResult){
    if(!oiResult||(!oiResult.id&&!oiResult.preview))throw new Error('OI create returned no id');
    var oiRecId=oiResult.id;
    // v146 — remember the issue the moment it exists, so a failed Damage Detail + Retry
    // finishes THIS issue instead of creating a second one
    if(key&&!oiResult.preview)writtenSet(key,{oi:oiRecId,dd:null});
    // Add the OI link to the DD payload now that we have the parent rec ID
    var ddWithLink=Object.assign({},pair.ddFields);
    ddWithLink[DD_FIELDS.orderIssue]=[oiRecId];
    return atCreate(DD_TBL,ddWithLink).then(function(ddResult){
      return {oi:oiResult,dd:ddResult};
    });
  });
}

var smBusy=false,_submitCb=null,_doneFlow=null;
function smConfirm(){
  var jobId=pendingSubmitJobId;
  if(!jobId){smClose();return;}
  if(smBusy)return;                 // v142: a second tap while writing does nothing
  smBusy=true;
  var pairs=buildIssuePayloads(jobId);
  var btn=document.getElementById('smConfirm');
  // v123: iOS Safari fix. Disabling the button inside its own tap handler can
  // cause the tap event to be silently swallowed on iPad — the writes never
  // fire and the user sees nothing happen. Two-part fix:
  //   1. Use a CSS class with pointer-events:none instead of the disabled
  //      attribute (Safari treats them differently for in-flight tap events)
  //   2. Defer the visual state change to the next animation frame so the
  //      tap fully resolves before we mutate the button
  if(btn){
    requestAnimationFrame(function(){
      btn.classList.add('working');
      btn.textContent='Working…';
    });
  }
  // Process pairs in parallel — each pair internally chains OI then DD.
  var promises=pairs.map(function(p){
    return writeOrUpdatePair(jobId,p).catch(function(e){return{error:e.message};});
  });
  promises=promises.concat(writeExtrasSent(jobId));  // v143: which extras went in the box
  // v142: buckets written earlier that have no damage now are removed, not left stale.
  var job0=jobs.find(function(j){return j.id===jobId;});
  var prefix=jobId+(job0&&job0.reprintMode?':rp':'')+'|';
  var liveKeys=pairs.map(function(p){return pairKey(jobId,p);});
  // v146 — only remove a bucket's records when the catcher actually counted this card
  // (a reload used to reopen the card at zero and "Mark QC Done" deleted logged damage).
  var stNow=qcState[jobId];
  var mayRemove=hasTallyData(stNow);
  writtenJobKeys(prefix).forEach(function(k){
    if(liveKeys.indexOf(k)>-1)return;
    var w=writtenGet(k);
    if(!mayRemove){ console.warn('[v146] kept earlier issue',k,'— no counts on this card now'); return; }
    promises.push(removePair(k,w).then(function(r){return r&&r.kept?{kept:true}:{removed:true};}).catch(function(e){return{error:e.message};}));
  });
  var cb=_submitCb; _submitCb=null;   // v147 — Done with pile submits without the modal
  Promise.all(promises).then(function(results){
    smBusy=false;
    var errors=results.filter(function(r){return r&&r.error;});
    if(errors.length>0){
      oops('Some writes failed:\n'+errors.map(function(e){return e.error;}).join('\n'));
      if(btn){btn.classList.remove('working');btn.textContent='Retry';}
      if(cb)cb(false);
      return;
    }
    // Mark QC done in local state regardless of preview/live
    qcState[jobId].status='qc-done';
    var job=jobs.find(function(j){return j.id===jobId;});if(job)job.status='qc-done';
    smClose();
    if(cb){cb(true);return;}
    renderQC();
  });
}

// Determine whether an order is a pickup, ship, or ambiguous based on the
// Shipping Method multipleSelects field. Returns true / false / null.
//   true  → contains "Pick-Up" (becomes Completed immediately)
//   false → ship-ish value(s) only (becomes Caught - Awaiting Ship)
//   null  → empty / missing (catcher needs to set it before we can route)
function isPickupOrder(shippingMethodArr){
  if(!Array.isArray(shippingMethodArr)||!shippingMethodArr.length)return null;
  for(var i=0;i<shippingMethodArr.length;i++){
    if(String(shippingMethodArr[i]||'').trim()==='Pick-Up')return true;
  }
  return false;
}

  if(isPickupOrder(arr)===true)          return {ico:'\uD83E\uDD1D',txt:all,sub:'Stage it up front \u2014 customer\u2019s collecting.',act:true};
  if(has('FREIGHT'))                     return {ico:'\uD83D\uDE9B',txt:all,sub:'Palletize and stage for LTL pickup.',act:true};
  if(has('Multiple Shipping Locations')) return {ico:'\uD83D\uDDC2\uFE0F',txt:all,sub:'Box per destination \u2014 this one splits.',act:true};

  if(has('Blind Shipping'))              return {ico:'\uD83D\uDD76\uFE0F',txt:all,sub:'Box it \u2014 no Pine branding on this one.',act:true};

    return;
  }
  var st=qcState[jobId];
  if(st)st.status='complete';

  // Use orderRecordId (set during Phase 3 Order fetch) which is the canonical
  // Order record. Fall back to orderRecId (set at imprint-grouping time from
  // the linked-record array) if Phase 3 didn't run.
  var orderRec=job.orderRecordId||job.orderRecId;

  // v126: persist Caught on this card's imprint(s) so the job clears from the
  // queue on EVERY device (the load filter excludes Caught imprints) — this is
  // the cross-device fix; qcState alone was device-local. Shared-imprint guard:
  // one imprint can link to several line items and so appear in several cards.
  // Only mark it Caught once no OTHER still-open card shares it, so we never
  // drop a sibling card that hasn't been caught yet. (Completed cards are
  // already spliced out of `jobs`, so a sibling left in `jobs` and not marked
  // complete in qcState is genuinely still open.)
  var nowIso=new Date().toISOString();
  var toMark=[];
  (job.imprints||[]).forEach(function(im){
    if(!im.recordId)return;
    var siblingOpen=jobs.some(function(j){
      if(j.id===jobId)return false;
      if(qcState[j.id]&&qcState[j.id].status==='complete')return false;
      return (j.imprints||[]).some(function(x){return x.recordId===im.recordId;});
    });
    if(!siblingOpen)toMark.push(im.recordId);
  });

  // Optimistic UI: remove this job from the queue immediately.
  if(orderRec)_slipRec[String(job.orderNum)]=orderRec;   // v152: the packing slip still needs it after the job leaves `jobs`
  jobs=jobs.filter(function(j){return j.id!==jobId;});
  job.caughtAt=nowIso; if(completedJobs.indexOf(job)<0)completedJobs.unshift(job);   // v159: shows under Completed and counts for the order right away
  renderQueue();

  if(toMark.length){
    var caughtOk=await atPatchImprints(toMark.map(function(id){
      return {id:id,fields:{[F.caught]:true,[F.caughtAt]:nowIso}};
    }));
    if(!caughtOk){
      // v146 — put the card back so it can be completed again (it used to vanish until a full reload)
      showToast('Order '+job.orderNum+': didn\u2019t save as caught \u2014 card is back in the queue, try Complete again','err');
      if(st)st.status='qc-done';
      completedJobs=completedJobs.filter(function(j){return j!==job;});   // v159
      if(!jobs.some(function(j){return j.id===jobId;}))jobs.push(job);
      renderQueue();
      return null;
    }
  }

  // v129: reprint close — flip this card's open RE-PRINT issue(s) to "Completed"
  // so they stop surfacing as owed and the sales notification fires. Issue ids
  // were stashed on each owed colorway during the count swap; fall back to the
  // load-time map if colorways weren't loaded. Proceed-and-warn on failure
  // (matches the order-status write) — a failed close just reappears next load.
  if(job.reprintMode){
    var oiIds=[];
    (job.colorways||[]).forEach(function(cw){
      (cw.oiRecIds||[]).forEach(function(id){if(oiIds.indexOf(id)<0)oiIds.push(id);});
    });
    if(!oiIds.length){
      (job.lineItemIds||[]).forEach(function(li){
        var rp=REPRINT_BY_LI[li];
        if(rp&&rp.oiRecIds)rp.oiRecIds.forEach(function(id){if(oiIds.indexOf(id)<0)oiIds.push(id);});
      });
    }
    if(oiIds.length){
      var oiOk=await atPatchIssues(oiIds,{[OI_FIELDS.status]:'Completed'});
      if(oiOk)showToast('Order '+job.orderNum+': reprint closed ('+oiIds.length+' issue'+(oiIds.length!==1?'s':'')+')','ok');
      else    showToast('Order '+job.orderNum+': reprint issue close failed — check Airtable','err');
    }
  }

  // v130: JIT order-record resolve. In the browser the imprint's order field is
  // a lookup (flat array), so job.orderRecId is always null — orderRec relies
  // entirely on Phase 3 having populated job.orderRecordId. If that async Order
  // fetch hiccuped or hadn't landed for this job, the status write used to be
  // silently skipped (console.warn only), leaving the order stuck at its
  // pre-catch status (e.g. a finished reprint sitting at "Delayed - Mis-Print -
  // Needs Order"). Resolve the order by its number here so the status write no
  // longer depends on Phase 3 having succeeded. Also backfills the ship/pickup
  // routing inputs if Phase 3 didn't set them.
  if(!orderRec && job.orderNum && job.orderNum!=='--'){
    try{
      var ores=await api(TOR+'?filterByFormula='+encodeURIComponent('{Invoice / Order Number}='+job.orderNum)
        +'&fields%5B%5D=fld4S3B5yJANKlE7l&fields%5B%5D='+O.shippingMethod+'&fields%5B%5D='+O.totalLinkedImprints
        +'&returnFieldsByFieldId=true&maxRecords=1');
      var orec=ores&&ores.records&&ores.records[0];
      if(orec){
        orderRec=orec.id; job.orderRecordId=orec.id;
        if(!Array.isArray(job.shippingMethod)||!job.shippingMethod.length){
          var sm=orec.fields[O.shippingMethod],smArr=[];
          if(Array.isArray(sm))sm.forEach(function(x){if(typeof x==='string')smArr.push(x);else if(x&&x.name)smArr.push(x.name);});
          job.shippingMethod=smArr;
        }
        if(!job.orderTotalImprints){
          var tli=orec.fields[O.totalLinkedImprints],tliNum=0;
          if(typeof tli==='number')tliNum=tli;else if(Array.isArray(tli)&&tli.length&&typeof tli[0]==='number')tliNum=tli[0];
          job.orderTotalImprints=tliNum;
        }
      }
    }catch(e){console.warn('[markComplete] JIT order resolve failed',job.orderNum,e);}
  }
  if(!orderRec){
    console.warn('[markComplete] No order record ID for job',jobId,'— skipping status write');
    showToast('Order '+job.orderNum+': could not resolve order record — status not updated','warn');
    return;
  }

  // v126: decide Completed vs Partially Completed from the AUTHORITATIVE caught
  // count in Airtable, not local qcState. With the queue now filtering out
  // caught imprints, no single device sees the whole order's progress in memory
  // (other iPads' catches, and earlier catches that have since dropped out of
  // this device's queue). Reading the real count makes the decision correct
  // regardless of how the work was split across devices or sessions.
  var cs=await getOrderCaughtState(orderRec);
  if(!cs){
    console.warn('[markComplete] could not read caught state for order',job.orderNum,'— skipping status write');
    showToast('Order '+job.orderNum+': couldn\u2019t check the order \u2014 status not changed','warn');  // v145: no longer silent
    return;
  }

  var newStatus=null;
  if(cs.total>0 && cs.caught>=cs.total){
    // Every imprint on the entire order is caught.
    var pickup=isPickupOrder(job.shippingMethod);
    if(pickup===true)       newStatus='Completed';
    else if(pickup===false) newStatus='Caught - Awaiting Ship';
    else {
      // Ambiguous (empty Shipping Method). Surface a banner — don't guess.
      showToast('Order '+job.orderNum+': set Shipping Method on the order before completing','warn');
      return;
    }
  } else if(cs.caught>0){
    // Some imprints caught, order not fully done yet.
    newStatus='Partially Completed';
  }
  // else: nothing caught (shouldn't happen right after a catch) — no write.

  if(!newStatus)return;
  // v145: only ever move the status FORWARD. People also set it by hand (and Completed emails the
  // customer), so never pull Completed/Shipped back to Caught, or Caught back to Partially Completed.
  var RANK={'Partially Completed':1,'Caught - Awaiting Ship':2,'Shipped':3,'Completed':4,'Cancelled / Voided':5};
  if((RANK[cs.status]||0)>=(RANK[newStatus]||0)){
    console.log('[markComplete] order',job.orderNum,'already',cs.status,'— leaving it (would have set',newStatus+')');
    return cs.status;
  }

  var ok=await atPatchOrder(orderRec,{[O.status]:newStatus});
  // v141: completeOrder() suppresses these per-card toasts and shows one line
  // for the whole order instead. Error toasts are never suppressed.
  if(ok){ if(!quiet)showToast('Order '+job.orderNum+' → '+newStatus,'ok'); }
  else        showToast('Order '+job.orderNum+': status write failed — check Airtable','err');
  return ok?newStatus:null;
}

// ─── v141: ORDER-LEVEL COMPLETE ───────────────────────────────────────
// One tap closes every QC'd card in an order group instead of N taps.
// Runs markComplete SEQUENTIALLY (not Promise.all) because each call re-reads
// the order's caught state from Airtable to decide the status — parallel calls
// would race and could resolve the final status off a stale read. This is the
// same sequence of writes the per-card buttons already produce; the only
// change is that the human taps once.
var completingOrders={};
async function completeOrder(orderNum){
  if(completingOrders[orderNum])return;      // double-tap guard
  completingOrders[orderNum]=true;
  var btn=document.getElementById('rdbtn_'+orderNum);
  if(btn)btn.className='rd-btn working'; // never .disabled — iOS swallows it
  var group=jobs.filter(function(j){return String(j.orderNum||'--')===String(orderNum);});
  var shipMethod=(group[0]||{}).shippingMethod;
  var n=group.length;
  var last=null;
  try{
    // markComplete() splices from `jobs` as it goes, so snapshot the ids first.
    var ids=group.map(function(j){return j.id;});
    for(var i=0;i<ids.length;i++){
      var st=qcState[ids[i]]||{};
      if(st.status==='complete')continue;
      last=await markComplete(ids[i],true)||last;
    }
  }catch(e){
    console.warn('[completeOrder] failed on order',orderNum,e);
    showToast('Order '+orderNum+': completion failed — check Airtable','err');
    delete completingOrders[orderNum];
    renderQueue();
    return;
  }
  delete completingOrders[orderNum];
  if(last){
    var rc=readyCopy(shipMethod,n);
    // Strip the HTML entity out of the sub-line — showToast sets textContent.
    var sub=String(rc.sub).replace(/&amp;/g,'&');
    showToast(rc.ico+' Order '+orderNum+' complete — '+sub,'ok');
  }
  renderQueue();
}

// ─── BOXING ───────────────────────────────────────────────────────────
var boxingJobId=null;

// Boxing helpers
function mk(parent,tag,cls){var el=document.createElement(tag);if(cls)el.className=cls;if(parent)parent.appendChild(el);return el;}
function addCh(p,t,c){var e=mk(p,'span','tag'+(c?' '+c:''));e.textContent=t;return e;}
var SIZE_ORDER_BOX=['6XL','5XL','4XL','3XL','2XL','XL','L','M','S','XS','OSFA'];
var BOX_SIZES_DEF={L:{name:'L',dims:'24x16x14in'},M:{name:'M',dims:'24x16x6in'},S:{name:'S',dims:'12x12x6in'}};
function getGarmentCategory(loc){if(!loc)return'tee';var s=loc.toLowerCase();if(s.includes('bandana'))return'bandana';if(s.includes('hoodie')||s.includes('sweatshirt'))return'hoodie';if(s.includes('cap')||s.includes('hat')||s.includes('beanie'))return'hat';return'tee';}
function getBoxSizeAndCap(loc,qty){var cat=getGarmentCategory(loc);switch(cat){
  case'bandana':
    if(qty<=100)return{boxSize:BOX_SIZES_DEF.S,capacity:100};
    if(qty<=300)return{boxSize:BOX_SIZES_DEF.M,capacity:300};
    return{boxSize:BOX_SIZES_DEF.L,capacity:500};
  case'hoodie':return{boxSize:BOX_SIZES_DEF.L,capacity:10}; // 2 stacks of 5
  case'hat':return{boxSize:BOX_SIZES_DEF.S,capacity:50};
  case'tee':default:return{boxSize:BOX_SIZES_DEF.L,capacity:100}; // always Large
}}
function formatBoxSizes(sizeObj){var active=SIZE_ORDER_BOX.filter(function(s){return sizeObj[s]>0;});if(active.length===1&&active[0]==='OSFA')return'OSFA';return active.map(function(s){return sizeObj[s]+' - '+s;}).join(', ')||'—';}

function buildBoxesFromQC(job,st){
  var cwData=st.cwData||{};
  var rows=[];
  (job.colorways||[]).forEach(function(cw){
    var cwSt=cwData[cw.liId]||{};
    var sizes={};var tot=0;
    Object.keys(cw.sizes||{}).forEach(function(sz){
      // v110: caught is derived (Ord - dmg + offset). Use sizeTotals for derived value.
      var ord=parseInt(cw.sizes[sz])||0;
      var caught=sizeTotals(cwSt[sz],ord).caught;
      if(caught>0){sizes[sz]=caught;tot+=caught;}
    });
    if(!tot){Object.keys(cw.sizes||{}).forEach(function(sz){sizes[sz]=cw.sizes[sz];tot+=cw.sizes[sz];});}
    if(tot>0)rows.push({garment:cw.garmentName||((job.locations&&job.locations[0])||'Garment'),color:cw.colorwayName||'—',design:(job.imprintIds&&job.imprintIds.length?job.imprintIds.join(' | '):job.orderNum),sizes:sizes,total:tot});
  });
  if(!rows.length){
    // Fallback: build rows from ordered sizes, but use real garment/color from colorways if available
    var design2=job.imprintIds&&job.imprintIds.length?job.imprintIds.join(' | '):job.orderNum;
    if(job.colorways&&job.colorways.length){
      // Build one row per colorway using ordered sizes
      job.colorways.forEach(function(cw){
        var sm2={};var t3=0;
        Object.keys(cw.sizes||{}).forEach(function(sz){if(cw.sizes[sz]>0){sm2[sz]=cw.sizes[sz];t3+=cw.sizes[sz];}});
        if(!t3){(job.sizes||[]).forEach(function(s){sm2[s.size]=s.qty;t3+=s.qty;});}
        rows.push({garment:cw.garmentName||((job.locations&&job.locations[0])||'Garment'),color:cw.colorwayName||'—',design:design2,sizes:sm2,total:t3||job.qty});
      });
    }else{
      var sm={};var t2=0;(job.sizes||[]).forEach(function(s){sm[s.size]=s.qty;t2+=s.qty;});
      rows=[{garment:(job.locations&&job.locations[0])||'Garment',color:'—',design:design2,sizes:sm,total:t2||job.qty}];
    }
  }
  var grandTotal=rows.reduce(function(a,r){return a+r.total;},0);
  var loc=(job.locations&&job.locations[0])||'';
  var cat=getGarmentCategory(loc);
  // ── Box assignment logic per spec ──────────────────────────────────
  // Tees: always Large box, split at 75 (76-100 = 2 boxes), max 100/box
  // Hoodies: always Large, max 10 (2 stacks of 5)
  // Bandanas: S≤100, M≤300, L≤500, split at 500 for 500+
  // Hats: S box, max 50
  var CAPACITY=cat==='hoodie'?10:cat==='bandana'?500:cat==='hat'?50:72;
  var SPLIT_AT=cat==='tee'?75:CAPACITY; // tees split at 75
  var numBoxes;
  if(cat==='bandana'){
    numBoxes=grandTotal<=100?1:grandTotal<=300?1:grandTotal<=500?1:Math.ceil(grandTotal/500);
  } else if(cat==='tee'){
    numBoxes=grandTotal<=72?1:Math.ceil(grandTotal/CAPACITY);
  } else {
    numBoxes=grandTotal<=CAPACITY?1:Math.ceil(grandTotal/CAPACITY);
  }
  var perBox=Math.ceil(grandTotal/numBoxes);
  var bc=getBoxSizeAndCap(loc,grandTotal);
  var allBoxes=[],rem=rows.map(function(r){return{garment:r.garment,color:r.color,design:r.design,sizes:Object.assign({},r.sizes),total:r.total};});
  var left=grandTotal;
  for(var bi=0;bi<numBoxes;bi++){
    var isLast=(bi===numBoxes-1),boxTarget=isLast?left:Math.min(perBox,left);
    var bci=getBoxSizeAndCap(loc,boxTarget);
    var box={rows:[],count:0,boxSize:bci.boxSize,capacity:bci.capacity};
    var space=boxTarget;
    rem=rem.filter(function(row){
      if(row.total<=0||space<=0)return row.total>0;
      if(row.total<=space){box.rows.push({garment:row.garment,color:row.color,design:row.design,sizes:Object.assign({},row.sizes),total:row.total});box.count+=row.total;space-=row.total;left-=row.total;return false;}
      var take=space,ss={},tk=0;
      SIZE_ORDER_BOX.forEach(function(sz){if(tk>=take||!row.sizes[sz])return;var g=Math.min(row.sizes[sz],take-tk);if(g>0){ss[sz]=g;row.sizes[sz]-=g;if(!row.sizes[sz])delete row.sizes[sz];tk+=g;}});
      if(tk>0){box.rows.push({garment:row.garment,color:row.color,design:row.design,sizes:ss,total:tk});box.count+=tk;row.total-=tk;left-=tk;}
      space=0;return row.total>0;
    });
    allBoxes.push(box);
  }
  var MIN={tee:25,hoodie:5,bandana:50,hat:25}; // min qty before merging into prev box
  for(var ci=allBoxes.length-1;ci>0;ci--){
    var cbox=allBoxes[ci],pbox=allBoxes[ci-1];
    if(cbox.count<(MIN[cat]||25)){
      cbox.rows.forEach(function(row){var ex=pbox.rows.find(function(r){return r.color===row.color&&r.design===row.design;});if(ex){SIZE_ORDER_BOX.forEach(function(sz){if(row.sizes[sz])ex.sizes[sz]=(ex.sizes[sz]||0)+row.sizes[sz];});ex.total+=row.total;}else{pbox.rows.push({garment:row.garment,color:row.color,design:row.design,sizes:Object.assign({},row.sizes),total:row.total});}});
      pbox.count+=cbox.count;allBoxes.splice(ci,1);
    }
  }
  return allBoxes;
}

// ─── PROOF MODAL ──────────────────────────────────────────────────────
function openProofs(liId){
  var jobId=activeJobId;
  var job=jobs.find(function(j){return j.id===jobId;});
  if(!job)return;
  var cw=job.colorways&&job.colorways.find(function(c){return c.liId===liId;});
  var proofs=[];
  if(cw&&cw.fullUrl)proofs.push({url:cw.fullUrl,thumb:cw.thumb,filename:'Proof'});
  if(!proofs.length&&job.proofs.length)proofs=job.proofs;
  if(!proofs.length)return;
  pmProofs=proofs;pmIdx=0;pmZoom=1;pmPage=1;pmDoc=null;pmDocUrl='';
  document.getElementById('pmModal').classList.add('open');
  pmShow();
}
function pmClose(){pmTok++;document.getElementById('pmModal').classList.remove('open');}
function pmStage(){return document.getElementById('pmStage');}
function pmWirePdf(){
  if(window.pdfjsLib&&pdfjsLib.GlobalWorkerOptions&&!pdfjsLib.GlobalWorkerOptions.workerSrc){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
}
function pmSetMsg(t){var st=pmStage();if(st)st.innerHTML='<div style="color:#ccc;font-size:14px;font-family:var(--sans);padding:24px">'+t+'</div>';}
function pmUpdateCt(){
  var c=document.getElementById('pmCt');if(!c)return;
  var s='';
  if(pmPageCount>1)s='p'+pmPage+'/'+pmPageCount;
  if(pmProofs.length>1)s=(s?s+' · ':'')+'['+(pmIdx+1)+'/'+pmProofs.length+']';
  c.textContent=s||'1/1';
}
function pmApplyZoom(){
  var cv=document.getElementById('pmCanvas');if(!cv)return;
  if(pmZoom<1)pmZoom=1;if(pmZoom>PM_ZOOM_MAX)pmZoom=PM_ZOOM_MAX;
  cv.style.width=(pmFitW*pmZoom)+'px';
  cv.style.height=(pmFitH*pmZoom)+'px';
  var lbl=document.getElementById('pmZoomLbl');
  if(lbl)lbl.textContent=(pmZoom<=1.001)?'Fit':(Math.round(pmZoom*100)+'%');
}
function pmZoomBy(dir){
  if(!document.getElementById('pmCanvas'))return;
  pmZoom=dir>0?pmZoom*PM_ZOOM_STEP:pmZoom/PM_ZOOM_STEP;
  pmApplyZoom();
}
function pmZoomFit(){pmZoom=1;pmApplyZoom();var b=document.getElementById('pmBody');if(b){b.scrollLeft=0;b.scrollTop=0;}}
function pmOpenPdf(){var p=pmProofs[pmIdx];if(p&&p.url)window.open(p.url,'_blank');}
function pmFallbackImg(p,e){
  if(e)try{console.warn('[pmFallback]',e&&e.message||e);}catch(_){}
  var st=pmStage();if(!st)return;
  st.innerHTML='';
  var img=new Image();
  img.style.cssText='max-width:100%;max-height:78vh;object-fit:contain;border-radius:4px;background:#fff';
  img.onerror=function(){st.innerHTML='<div style="color:#ccc;font-family:var(--sans);font-size:14px;padding:24px">Proof preview unavailable — tap “Open PDF ↗”.</div>';};
  img.src=p.thumb||p.url;
  st.appendChild(img);
  pmUpdateCt();
}
function pmWireGestures(){
  if(pmDblWired)return;pmDblWired=true;
  var body=document.getElementById('pmBody');if(!body)return;
  var sx=0,sy=0,stime=0,swiped=false,lastTap=0;
  body.addEventListener('touchstart',function(e){
    if(!e.touches||e.touches.length!==1)return;
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;stime=Date.now();swiped=false;
  },{passive:true});
  body.addEventListener('touchend',function(e){
    var t=e.changedTouches&&e.changedTouches[0];if(!t)return;
    var dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-stime;
    // Horizontal swipe pages — only at Fit, so it never fights one-finger pan when zoomed.
    if(pmZoom<=1.05&&Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4&&dt<700){
      swiped=true;pmNav(dx<0?1:-1);
    }
  },{passive:true});
  body.addEventListener('click',function(ev){
    if(swiped){swiped=false;return;}              // a swipe isn't a tap — don't close
    var cv=document.getElementById('pmCanvas');
    if(cv&&ev.target===cv){                        // taps ON the proof = inspect / double-tap zoom
      var now=Date.now();
      if(now-lastTap<300){
        lastTap=0;
        if(pmZoom>1.05){pmZoomFit();return;}
        var rect=cv.getBoundingClientRect();
        var fx=(ev.clientX-rect.left)/rect.width,fy=(ev.clientY-rect.top)/rect.height;
        pmZoom=2.6;pmApplyZoom();
        body.scrollLeft=pmFitW*pmZoom*fx-body.clientWidth/2;
        body.scrollTop=pmFitH*pmZoom*fy-body.clientHeight/2;
      }else lastTap=now;
      return;
    }
    pmClose();                                     // tap anywhere off the proof closes
  });
}
function pmShow(){
  if(!pmProofs.length)return;
  var p=pmProofs[pmIdx];
  document.getElementById('pmFn').textContent=p.filename||('Proof '+(pmIdx+1));
  pmWireGestures();
  pmLoadAndRender();
}
function pmLoadAndRender(){
  var p=pmProofs[pmIdx];if(!p)return;
  pmTok++;var tok=pmTok;
  pmWirePdf();
  if(!window.pdfjsLib){pmFallbackImg(p);return;}
  pmSetMsg('Loading…');
  function afterDoc(){
    if(tok!==pmTok)return;
    pmPageCount=pmDoc.numPages||1;
    if(pmPage==='last')pmPage=pmPageCount;
    if(pmPage<1)pmPage=1;if(pmPage>pmPageCount)pmPage=pmPageCount;
    pmRenderPage(tok);
  }
  if(!pmDoc||pmDocUrl!==p.url){
    try{
      pdfjsLib.getDocument({url:p.url}).promise.then(function(doc){
        if(tok!==pmTok)return;pmDoc=doc;pmDocUrl=p.url;afterDoc();
      }).catch(function(e){if(tok!==pmTok)return;pmFallbackImg(p,e);});
    }catch(e){pmFallbackImg(p,e);}
  }else afterDoc();
}
function pmRenderPage(tok){
  if(tok!==pmTok||!pmDoc)return;
  pmDoc.getPage(pmPage).then(function(page){
    if(tok!==pmTok)return;
    var body=document.getElementById('pmBody');
    var vp1=page.getViewport({scale:1});
    var availW=Math.max(80,(body.clientWidth||800)-32),availH=Math.max(80,(body.clientHeight||600)-32);
    var fit=Math.min(availW/vp1.width,availH/vp1.height);
    if(!isFinite(fit)||fit<=0)fit=1;
    pmFitW=vp1.width*fit;pmFitH=vp1.height*fit;
    var rs=fit*PM_RENDER_MULT,longest=Math.max(vp1.width*rs,vp1.height*rs);
    if(longest>PM_MAX_PX)rs*=PM_MAX_PX/longest;
    var vp=page.getViewport({scale:rs});
    var st=pmStage();if(!st)return;
    st.innerHTML='<canvas id="pmCanvas"></canvas>';
    var cv=document.getElementById('pmCanvas');
    cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){
      if(tok!==pmTok)return;
      pmApplyZoom();pmUpdateCt();
    }).catch(function(e){pmFallbackImg(pmProofs[pmIdx],e);});
  }).catch(function(e){pmFallbackImg(pmProofs[pmIdx],e);});
}
function pmNav(dir){
  if(!pmProofs.length)return;
  var np=pmPage+dir;
  if(np<1){if(pmIdx>0){pmIdx--;pmPage='last';pmShow();}return;}
  if(np>pmPageCount){if(pmIdx<pmProofs.length-1){pmIdx++;pmPage=1;pmShow();}return;}
  pmPage=np;pmTok++;pmRenderPage(pmTok);
}
</script>

<script>
// ═══ v147 — WORK SCREEN (replaces the queue list + QC cockpit) ═══════════════
// One screen per press: big proof · tap lane (size → reason → checked → Done) · line items on the right.
// v150 — "pile" → "Line Item" everywhere on screen (matches Airtable; "pile" sounded odd said out loud).
// "Done with pile" = save the damage (same v146 write path, no modal) + mark caught + move the
// order on, with a short Undo window. Extras that didn't replace damage go in the box by default.
function cwEsc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var _pendingDone=null;           // {jobId, timer, orderNum, last}
function cwTopSync(){ var pb=document.querySelector('.press-bar'); if(pb)document.documentElement.style.setProperty('--cw-top',(pb.offsetHeight+(document.getElementById('practiceBar')&&PRACTICE?0:0))+'px'); }
window.addEventListener('resize',cwTopSync);
function cwFlip(){ var on=!document.body.classList.contains('cw-flip'); document.body.classList.toggle('cw-flip',on); try{localStorage.setItem('pine_catch_side',on?'left':'right');}catch(e){} }
function cwGroups(m){
  var mj=jobsFor(m),keys=[],by={};
  mj.forEach(function(j){var k=j.orderNum||'--';if(!by[k]){by[k]=[];keys.push(k);}by[k].push(j);});
  keys.forEach(function(k){var g=by[k];var tot=g.reduce(function(s,j){var rp=j.reprintMode&&j.lineItemIds&&REPRINT_BY_LI[j.lineItemIds[0]];return s+(rp?rp.total:(j.qty||0));},0);g.forEach(function(j){j.runTotalPcs=tot;});});
  return {keys:keys,by:by};
}
function cwIsDone(j){ var st=qcState[j.id]||{}; return st.status==='complete'||(_pendingDone&&_pendingDone.jobId===j.id); }
function renderQueue(){
  updateViewTabs();
  document.body.classList.remove('qc-mode');
  if(viewMode==='completed'){activeJobId=null;renderCompleted();return;}
  var m=MACHINES.find(function(x){return x.id===activePress;})||MACHINES[0];
  updateTabs();
  var mj=jobsFor(m);
  var pick=mj.find(function(j){return j.id===activeJobId&&!cwIsDone(j);})||mj.find(function(j){return !cwIsDone(j);});
  if(!pick){ activeJobId=null; renderQC(); return; }
  if(pick.colorways){ activeJobId=pick.id; enterQC(pick.id); } else enterQC(pick.id);
}
function cwRail(m){

  .press-bar .btn-refresh{order:1;margin-left:auto}
  .press-tabs{order:2;flex:1 1 calc(100% - 200px);min-width:0;padding:8px 0 0 12px}
  .press-bar .view-tabs{order:3;margin:0;padding-top:8px}
  .press-bar .btn-backop{order:3;margin-top:8px}
  .press-bar .btn-token{order:4;margin-top:8px}
  .press-bar .pt{padding:0 9px!important}
}

/* ---------- work screen ---------- */
.cw{gap:10px;padding:10px}
.cw-rail,.cw-pile{background:#fff;border:1px solid var(--p-line);border-radius:var(--p-r-lg)}
.cw-rh{min-height:52px;padding:4px 6px 4px 14px;border-bottom:1px solid var(--p-line);font:700 12px var(--p-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--p-ink-2)}
.cw-rh button{width:44px;height:44px;padding:0;border-radius:var(--p-r);border:2px solid var(--p-black);background:#fff;font:700 18px/1 var(--p-sans);color:var(--p-black)}
.cw-ogh{gap:8px;margin:4px 2px 8px;font:700 12px var(--p-sans)}
.cw-ogh .n.p-id{font-size:14px}
.cw-ogh .c{color:var(--p-ink-2);font-size:12px;letter-spacing:.04em}
.cw-ogh .p{font:700 12px/1 var(--p-sans);padding:5px 8px;border-radius:4px;background:var(--p-cream);border:1.5px solid var(--p-cream-dk);color:var(--p-ink-2)}
.cw-ogh .p.ok{background:var(--p-black);color:#fff;border-color:var(--p-black)}
.cw-pc{min-height:60px;padding:8px;gap:10px;border:1px solid var(--p-line);border-radius:var(--p-r);background:#fff;font-family:var(--p-sans);color:var(--p-black)}
.cw-pc.on{background:var(--p-black);color:#fff;border-color:var(--p-black);box-shadow:inset 6px 0 0 var(--p-yellow)}
.cw-pc.dn{opacity:.55;background:var(--p-cream-lt)}
.cw-pc .t{width:44px;height:44px;border-radius:4px;background:var(--p-cream)}
.cw-pc .nm{font:700 14px/1.15 var(--p-sans);text-transform:uppercase}
.cw-pc>span:nth-child(2){flex:1;min-width:0}
.cw-pc .nm,.cw-pc .mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-pc .mt{font:400 12px/1.25 var(--p-sans);color:var(--p-ink-2)}.cw-pc.on .mt{color:rgba(255,255,255,.7)}
.cw-pc .tg{flex:none;font:700 12px/1 var(--p-sans);letter-spacing:.03em;padding:5px 7px;border-radius:4px;border:1.5px solid var(--p-cream-dk);background:var(--p-cream);color:var(--p-ink-2)}
.cw-pc .tg.d{background:#fff;color:var(--p-alert);border-color:var(--p-alert)}
.cw-pc .tg.k{background:var(--p-black);color:#fff;border-color:var(--p-black)}
.cw-pc.on .tg.k{background:#fff;color:var(--p-black)}
.cw-ph{gap:6px 12px;padding:8px 12px;border-bottom:1px solid var(--p-line)}
.cw-ph>.p-id{flex:none;align-self:center}
.cw-ph .o{font:700 13px/1.2 var(--p-sans);letter-spacing:0;color:var(--p-ink-2);text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-ph .tt{font:900 20px/1.1 var(--p-display);letter-spacing:.005em;word-spacing:.08em;text-transform:uppercase;margin-top:1px}
.cw-chip{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:4px;border:1.5px solid var(--p-black);background:#fff;color:var(--p-black);font:700 12px/1 var(--p-sans);letter-spacing:.04em;text-transform:uppercase}
.cw-chip.ship,.cw-chip.pick{background:#fff;color:var(--p-black);border-color:var(--p-black)}
.cw-chip.rp{background:var(--p-yellow);color:var(--p-black);border-color:var(--p-black)}
.cw-chip.warn{background:#fff;color:var(--p-alert);border-color:var(--p-alert)}
.cw-dept{gap:6px}
.cw-dept .dc{font:700 12px/1 var(--p-sans);letter-spacing:.03em;padding:5px 8px;border-radius:4px;background:var(--p-yellow-lt);border:1.5px solid var(--p-black);color:var(--p-black);outline:0}
.cw-dept .dc.ok{background:var(--p-black);border-color:var(--p-black);color:#fff}
.cw-dept .dc.me{box-shadow:0 0 0 2px var(--p-yellow)}
.cw-dept .dc i{background:var(--p-black);color:var(--p-yellow);border-radius:3px;padding:1px 5px;margin-left:6px;font-size:12px;text-transform:uppercase}
.cw-dept .dc.ok i{background:var(--p-yellow);color:var(--p-black)}
.cw-dept .dh{font-size:12px;color:var(--p-ink-3)}
.cw-tabs{gap:6px;padding:8px 12px;border-bottom:1px solid var(--p-line)}
.cw-tabs button{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--p-black);background:#fff;color:var(--p-black);font:700 14px/1 var(--p-sans);letter-spacing:.02em;text-transform:none}
.cw-tabs button.on{background:var(--p-black);color:var(--p-yellow);border-color:var(--p-black)}
.cw-proof{border-right:1px solid var(--p-line)}
.cw-proof .im .ph{font:700 14px var(--p-sans);color:var(--p-ink-3)}
.cw-proof .cap{padding:8px;border-top:1px solid var(--p-line);font:700 12px var(--p-sans);letter-spacing:.04em;color:var(--p-ink-2)}
.cw-pb{gap:8px;padding:8px 12px}
.cw-lbl.szl{min-height:36px;margin-bottom:4px}
.cw-lbl{font:700 12px var(--p-sans);letter-spacing:.08em;color:var(--p-ink-2);margin-bottom:4px}
.cw-lbl button{min-height:36px;padding:0 12px;border-radius:999px;border:2px solid var(--p-black);color:var(--p-black);background:#fff;font:700 12px var(--p-sans);letter-spacing:.02em;text-transform:none}
.cw-need{color:var(--p-black);background:var(--p-yellow);padding:2px 6px;border-radius:3px;letter-spacing:.02em}
.cw-sizes{gap:8px}
.cw-sz{min-height:62px;padding:4px;line-height:1.15;border-radius:var(--p-r);border:2px solid var(--p-black);background:#fff;color:var(--p-black);font-family:var(--p-sans)}
.cw-sz b{font:800 20px/1.05 var(--p-sans)}
.cw-sz span{font:400 13px var(--p-sans);color:var(--p-ink-2)}
.cw-sz i{color:var(--p-black);font-weight:800}
.cw-sz em{font:700 12px var(--p-sans);color:var(--p-alert)}
.cw-sz em.ok{color:var(--p-black)}
.cw-sz.on{background:var(--p-yellow);border-color:var(--p-black);color:var(--p-black);box-shadow:inset 0 0 0 2px var(--p-black)}
.cw-sz.on span{color:var(--p-black)}.cw-sz.on em{color:var(--p-alert)}.cw-sz.on em.ok{color:var(--p-black)}
@keyframes cwPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 5px var(--p-yellow)}}
.cw-rb{border-radius:var(--p-r);border:2px solid var(--p-black);background:#fff;font-family:var(--p-sans);padding:7px 10px}
.cw-grid{grid-auto-rows:minmax(56px,1fr)}
.cw-rb .n{font:700 13px/1.15 var(--p-sans);letter-spacing:.03em;color:var(--p-black)}
.cw-rb .c{font:900 24px/1 var(--p-display);color:var(--p-ink-3);margin-top:3px;letter-spacing:0}
.cw-rb.o{border-color:var(--p-black);background:var(--p-cream)}   /* Other = cream, team = white: the two buckets stay apart without extra colors */.cw-rb.o .n{color:var(--p-black)}.cw-rb.o .c{color:var(--p-ink-3)}
.cw-rb.u{border:2px dashed var(--p-black);background:#fff}.cw-rb.u .n{color:var(--p-black)}.cw-rb.u .c{color:var(--p-ink-3)}
.cw-rb.has,.cw-rb.o.has,.cw-rb.u.has{background:var(--p-black);border-color:var(--p-black)}
.cw-rb.has .n{color:#fff!important}.cw-rb.has .c{color:var(--p-yellow)!important}
.cw-rb.ud{border:2px solid transparent;background:var(--p-cream-lt)}.cw-rb.ud .n{color:var(--p-ink-2)}
.cw-rb.off .c{font-size:20px}
.cw-rz>div{min-height:auto}   /* a section never shrinks under its buttons (embroidery names overlapped the Other row); the lane scrolls instead */
.cw-grid.c4{gap:6px}
.cw-grid.c4 .cw-rb{padding:6px 8px}
.cw-grid.c4 .cw-rb .n{font-size:12px;letter-spacing:0;text-transform:none;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.cw-grid.c4 .cw-rb .c{font-size:20px}
.cw-mn{top:auto;bottom:5px;right:5px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--p-black)!important;font:700 26px/40px var(--p-sans)}
.cw-rb.o .cw-mn,.cw-rb.u .cw-mn{color:var(--p-black)}
.cw-hint{font:700 14px var(--p-sans);color:var(--p-ink-2);border:2px dashed var(--p-line-strong);border-radius:var(--p-r);text-transform:none;letter-spacing:0}
.cw-bnd{border-radius:var(--p-r);background:var(--p-black);color:#fff;font:700 14px var(--p-sans);letter-spacing:.04em;padding:10px 14px}
.cw-bnd b{font:900 34px/1 var(--p-display);color:var(--p-yellow)}
.cw-end{background:var(--p-cream-lt);border-top:1px solid var(--p-line);gap:8px;padding:8px 12px}
.cw-loc{min-height:56px;font:700 14px var(--p-sans);letter-spacing:.03em;border-radius:var(--p-r);border:2px solid var(--p-black);background:#fff;color:var(--p-black);padding:8px}
.cw-loc.on{background:var(--p-black);color:#fff;border-color:var(--p-black)}
.cw-loc small{font:400 12px var(--p-sans);color:inherit;opacity:.75}
.cw-er{gap:10px}
.cw-rev{min-height:56px;font:700 16px var(--p-sans);letter-spacing:0;text-transform:none;padding:0 22px;border-radius:var(--p-r);border:2px solid var(--p-black);background:#fff;color:var(--p-black)}
.cw-done{min-height:56px;font:800 20px/1.1 var(--p-sans);letter-spacing:.01em;text-transform:none;padding:6px 16px;border-radius:var(--p-r);border:2px solid var(--p-black);background:var(--p-yellow);color:var(--p-black)}
.cw-done:hover{background:#F2D600}
.cw-done small{font:700 14px var(--p-sans);letter-spacing:0;color:var(--p-ink-2);margin-top:3px}
.cw-done small .b{color:var(--p-black)}
.cw-empty{font:900 28px/1.15 var(--p-display);letter-spacing:.005em;word-spacing:.08em;color:var(--p-black);text-transform:uppercase;padding:24px}

/* ---------- order complete / hand off / pack ---------- */
.cw-oc{background:rgba(20,20,18,.6)}
.cw-occ{border-radius:var(--p-r-lg);padding:24px;font-family:var(--p-sans);box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:calc(100dvh - 32px);overflow:auto}
.cw-occ .ico{font-size:30px;line-height:1}
.cw-occ .ho-k{display:inline-block;margin-top:8px;background:var(--p-black);color:#fff;font:900 14px/1 var(--p-display);text-transform:uppercase;letter-spacing:.03em;word-spacing:.14em;padding:8px 12px;border-radius:2px}
.cw-occ .big{font:900 48px/1 var(--p-display);font-variant-numeric:tabular-nums;margin:10px 0 4px}
.cw-occ .cu{font:700 16px var(--p-sans);text-transform:uppercase;letter-spacing:.03em}
.cw-occ .st{font:700 14px/1 var(--p-sans);letter-spacing:.03em;padding:9px 12px;border-radius:4px;margin:12px 0 4px;background:var(--p-cream);color:var(--p-black);border:1.5px solid var(--p-cream-dk);text-transform:none}
.cw-occ .st.pk{background:var(--p-black);color:#fff;border-color:var(--p-black)}
.cw-occ .st.w{background:#fff;color:var(--p-alert);border-color:var(--p-alert)}
.cw-occ p{font:400 15px/1.45 var(--p-sans);color:var(--p-ink-2);margin:8px 0 16px}
.cw-occ .r{gap:10px;margin-top:16px}
.cw-occ .r button{min-height:56px;padding:0 14px;border-radius:var(--p-r);font:800 17px var(--p-sans);letter-spacing:0;text-transform:none;border:2px solid var(--p-black)}
.cw-occ .r .a,.cw-occ .r .c{background:#fff;color:var(--p-black);border:2px solid var(--p-black)}
.cw-occ .r .b{background:var(--p-yellow);color:var(--p-black);border:2px solid var(--p-black)}
.cw-occ .u{min-height:44px;margin-top:8px;border:0;background:transparent;color:var(--p-ink-2);font:700 14px var(--p-sans);letter-spacing:0;text-transform:none;text-decoration:underline;text-underline-offset:3px}
.cw-hochk{font-size:14px;color:var(--p-ink-2)}
.cw-occ .ho-wait{margin:14px 0 4px;padding:10px 14px;font-size:15px;line-height:1.45;text-align:left;background:var(--p-yellow-lt);border-left:4px solid var(--p-yellow);border-radius:var(--p-r)}
.cw-occ .ho-q{margin-top:16px;font:700 12px var(--p-sans);letter-spacing:.08em;color:var(--p-ink-2)}
.cw-occ .ho-n button{width:56px;height:56px;border-radius:var(--p-r);border:2px solid var(--p-black);background:#fff;font:800 26px var(--p-sans);color:var(--p-black)}
.cw-occ .ho-n b{font:800 36px var(--p-sans);font-variant-numeric:tabular-nums}
.cw-occ .ho-w button{height:56px;border-radius:999px;border:2px solid var(--p-black);background:#fff;color:var(--p-black);font:700 16px var(--p-sans)}
.cw-occ .ho-w button.on{background:var(--p-black);color:var(--p-yellow);border-color:var(--p-black)}
.cw-occ .lk{min-height:44px;margin:6px auto 0;color:var(--p-ink-2);font:700 14px var(--p-sans);text-underline-offset:3px}
.cw-occ .ho-it{min-height:56px;border:2px solid var(--p-black);border-radius:var(--p-r);background:var(--p-yellow-lt);font:700 15px var(--p-sans);color:var(--p-black)}
.cw-occ .ho-it i{border:2px solid var(--p-black);border-radius:4px;background:#fff}
.cw-occ .ho-it.on{border-color:var(--p-black);background:var(--p-black);color:#fff}.cw-occ .ho-it.on i{background:var(--p-yellow);color:var(--p-black);border-color:var(--p-yellow)}
.cw-occ .ho-hint{font-size:14px;color:var(--p-ink-2)}
.cw-occ button.a:disabled{opacity:.38;cursor:not-allowed}
#hoGo,#hoSlip:not(:disabled){background:var(--p-yellow)!important;color:var(--p-black)!important;border:2px solid var(--p-black)!important}

/* ---------- toasts / update bar ---------- */
.cw-toast{left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--p-black);color:#fff;font:700 16px/1.3 var(--p-sans);padding:12px 12px 12px 18px;border-radius:var(--p-r-lg);gap:12px;max-width:calc(100vw - 32px);box-shadow:0 8px 28px rgba(0,0,0,.3)}
.cw-toast button{min-height:40px;border:2px solid var(--p-yellow);color:var(--p-yellow);background:transparent;border-radius:var(--p-r);padding:0 14px;font:700 14px var(--p-sans);text-transform:none}
.v122-toast{background:var(--p-black);color:#fff;border:0;border-radius:var(--p-r-lg);font:700 16px/1.3 var(--p-sans);box-shadow:0 8px 28px rgba(0,0,0,.3);padding:12px 18px}
.v122-toast-ok{box-shadow:inset 6px 0 0 var(--p-yellow),0 8px 28px rgba(0,0,0,.3)}
.v122-toast-warn{background:var(--p-black);box-shadow:inset 6px 0 0 var(--p-yellow),0 8px 28px rgba(0,0,0,.3)}
.v122-toast-err{background:var(--p-black);box-shadow:inset 6px 0 0 var(--p-alert),0 8px 28px rgba(0,0,0,.3)}
#updBar{background:var(--p-black);color:#fff;border-radius:var(--p-r-lg);font:700 16px var(--p-sans);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:9050}
#updBar button{background:var(--p-yellow);color:var(--p-black);border:2px solid var(--p-yellow);border-radius:var(--p-r);font:800 16px var(--p-sans);min-height:44px;padding:0 16px}

/* ---------- pop-ups (review, unsure, sort the unsure pieces) ---------- */
.sm,.tn{background:rgba(20,20,18,.55)}
.sm-card,.tn-card{border-radius:var(--p-r-lg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sm-hdr,.tn-hdr{padding:12px 12px 12px 24px;border-bottom:1px solid var(--p-line);min-height:64px}
.sm-title,.tn-hdr{font:700 20px/1.2 var(--p-sans);letter-spacing:0;text-transform:none;color:var(--p-black)}
.sm-close{width:44px;height:44px;font-size:24px;color:var(--p-black);border-radius:var(--p-r)}
.sm-close:hover{background:var(--p-cream)}
.sm-body,.tn-body{padding:16px 24px}
.sm-banner{background:var(--p-yellow-lt);border:0;border-left:4px solid var(--p-yellow);color:var(--p-black);font:700 14px var(--p-sans);letter-spacing:0;text-transform:none;text-align:left}
.sm-item,.tr-section{background:var(--p-cream-lt);border:1px solid var(--p-line);border-radius:var(--p-r)}
.sm-item-hdr,.tr-section-hdr{font:700 13px var(--p-sans);letter-spacing:.04em;color:var(--p-black)}
.sm-item-desc{font:400 15px/1.45 var(--p-sans);color:var(--p-black)}
.sm-item-meta{font-size:12px;color:var(--p-ink-2)}
.sm-item-meta .chip{font-size:12px;border-color:var(--p-cream-dk);background:var(--p-cream);border-radius:4px}
.sm-x{border:1px dashed var(--p-line-strong);background:#fff}
.sm-x-h{font:700 12px var(--p-sans);color:var(--p-ink-2)}
.sm-x-chip{min-height:44px;border:2px solid var(--p-black);border-radius:var(--p-r);font:700 16px var(--p-sans);color:var(--p-black)}
.sm-x-chip.on{background:var(--p-black);border-color:var(--p-black);color:var(--p-yellow)}
.sm-x-note,.sm-empty,.tr-events{font-size:13px;color:var(--p-ink-2);font-family:var(--p-sans)}
.sm-ftr,.tn-ftr{padding:12px 24px;border-top:1px solid var(--p-line);background:var(--p-cream-lt);gap:10px}
.sm-ftr button,.tn-ftr button{min-height:52px;padding:0 20px;border-radius:var(--p-r);border:2px solid var(--p-black);background:#fff;color:var(--p-black);font:700 16px var(--p-sans);letter-spacing:0;text-transform:none}
.sm-ftr button.primary,.tn-ftr button.primary{background:var(--p-yellow);border-color:var(--p-black);color:var(--p-black)}
.sm-ftr button.primary:hover,.tn-ftr button.primary:hover{background:#F2D600}
.tn-lbl,.tr-row label,.notes-lbl{font:700 12px var(--p-sans);letter-spacing:.06em;color:var(--p-ink-2)}
.tn-input,.notes-in{min-height:44px;border:2px solid var(--p-line-strong);border-radius:var(--p-r);font:400 16px var(--p-sans)}
.tn-input:focus,.notes-in:focus{border-color:var(--p-black);box-shadow:0 0 0 3px var(--p-yellow)}
.tr-sel{min-height:44px;font:700 15px var(--p-sans);border:2px solid var(--p-line-strong);border-radius:var(--p-r)}

/* ---------- proof viewer ---------- */
.pm{background:rgba(20,20,18,.94)}
.pm-bar{background:var(--p-black);gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.pm-close{min-height:44px;padding:0 16px;font:800 16px var(--p-sans);border-radius:var(--p-r);border:2px solid var(--p-yellow);background:var(--p-yellow);color:var(--p-black)}
.pm-fn{font:400 13px var(--p-sans);color:rgba(255,255,255,.6)}
.pm-nav button,.pm-zoom button,.pm-open{min-height:44px;min-width:44px;font:700 16px var(--p-sans);border-radius:var(--p-r);border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff}
.pm-zoom button#pmZoomLbl{min-width:56px;font-size:14px}
.pm-open{font-size:14px;padding:0 14px}
.pm-ct{font:700 14px var(--p-sans);color:rgba(255,255,255,.75)}

/* ---------- Completed tab ---------- */
.content{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
.q-hdr{margin-bottom:14px;align-items:baseline;gap:12px;flex-wrap:wrap}
.q-title{font:900 28px/1.1 var(--p-display);letter-spacing:.005em;word-spacing:.08em;text-transform:uppercase;color:var(--p-black)}
.q-date{font:700 14px var(--p-sans);color:var(--p-ink-2)}
.find-ord{display:flex;flex-direction:column;align-items:stretch;gap:8px;background:#fff;border:1px solid var(--p-line);border-radius:var(--p-r-lg);padding:14px 16px;margin-bottom:12px}
.find-ord label{font:700 12px/1.2 var(--p-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--p-ink-2)}
