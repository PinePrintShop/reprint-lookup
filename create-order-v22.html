<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Create Order v22 — Pine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap">
<link rel="stylesheet" href="pine-style-v2.css">
<link rel="stylesheet" href="pine-office-v1.css">
<style>
/* Create order v18: Pine style v2 + pine-office-v1.css. Old tokens kept as names, mapped to the four brand colors. */
:root{--bg:var(--p-cream-lt);--surface:#fff;--line:var(--p-line);--line2:var(--p-line-strong);--text:var(--p-black);--muted:var(--p-ink-3);--soft:var(--p-cream-lt);
  --yellow:var(--p-yellow);--ytint:var(--p-yellow-lt);--red:var(--p-alert);--rtint:var(--p-alert-lt);--sans:var(--p-sans);--r:12px}
*{margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-size:15px}
button{cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
h2{font-size:18px}
.hint{font-size:var(--p-fs-xs);color:var(--muted)}
.err{background:var(--rtint);border-left:4px solid var(--red);color:#7A1414;border-radius:6px;padding:8px 12px;font-size:14px;margin-top:8px}
/* buttons: plain (white), dark (black, the step's own action), the one yellow is in the order header */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:2px solid var(--p-black);background:#fff;border-radius:6px;font-weight:700;font-size:15px;color:var(--p-black);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--p-cream)}
.btn.k,.btn.y{background:var(--p-black);color:#fff}
.btn.k:hover,.btn.y:hover{background:#2B2A26}
.btn:disabled{opacity:.38;cursor:not-allowed}
.b{min-height:40px;padding:0 12px;border:1.5px solid var(--line2);background:#fff;border-radius:6px;font-size:14px;font-weight:700;color:var(--p-black)}
.b:hover{border-color:var(--p-black)}
.b.on{background:var(--p-black);border-color:var(--p-black);color:var(--p-yellow)}
.b.sm{min-height:34px;padding:0 10px;font-size:13px}
.b.num{min-width:44px}
.link{background:none;border:0;color:var(--p-ink-2);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:4px 2px}
.link:hover{color:var(--p-black)}
.bts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--p-cream);border:1.5px solid var(--p-cream-dk);color:var(--p-ink-2);white-space:nowrap}
.tag.ok{background:var(--p-black);border-color:var(--p-black);color:#fff}
.tag.need{background:var(--p-yellow);border-color:var(--p-black);color:var(--p-black)}
.idtag{display:inline-block;font:800 13px/1 var(--sans);background:var(--p-black);color:var(--p-yellow);padding:4px 7px;border-radius:4px;white-space:nowrap;letter-spacing:.02em}
.idtag.sm{font-size:12px;padding:3px 5px}
input.t,select.t{min-height:44px;border:2px solid var(--line2);border-radius:6px;padding:0 10px;background:#fff;font-size:15px;color:var(--p-black)}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--p-black);outline:none;box-shadow:0 0 0 3px var(--p-yellow)}
input.t.sm,select.t.sm{min-height:36px;font-size:14px}
input.t.under{border-color:var(--red);background:var(--rtint);color:var(--red)}
textarea.t{border:2px solid var(--line2);border-radius:6px;padding:8px 10px;background:#fff;resize:vertical;min-height:44px;line-height:1.35;font-size:15px;color:var(--p-black)}
textarea.tg{resize:none;overflow:hidden}
.warn{color:var(--p-black)!important;font-weight:800}
.okc{font-weight:700}
/* order list (left pane) */
.olh{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin-bottom:10px}
.olh .hint{font-size:13px}
.olempty{color:var(--p-ink-2);padding:16px 4px}
/* reorder or new */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.door{border:2px solid var(--line2);border-radius:12px;padding:14px 16px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--p-black)}
.door:hover{border-color:var(--p-black)}
.door b{font-size:17px}.door span{font-size:14px;color:var(--p-ink-2)}
.door.main{border-color:var(--p-cream-dk);background:var(--p-cream);cursor:default}
.past{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.po{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;text-align:left;color:var(--p-black)}
.po:hover{border-color:var(--p-black)}
.po .th{display:flex;gap:4px}
.po img,.po .noimg{width:64px;height:48px;border-radius:5px;border:1px solid var(--line);object-fit:contain;background:var(--soft)}
.po .noimg{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.po .d b{font-weight:800}.po .d div{font-size:14px;color:var(--p-ink-2);margin-top:2px}
.alnote{margin-bottom:10px}
.art-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.art-in label{font-size:13px;font-weight:700;color:var(--p-ink-2)}.art-in input{flex:1;min-width:220px}.art-in a{font-size:14px;font-weight:700;color:var(--p-black)}
.donebar{margin-top:10px}
/* steps: section headers */
.sec{padding-top:14px}
.locked .p-off-li,.locked .p-off-imp,.locked .more{pointer-events:none}
.cards{display:flex;flex-direction:column;gap:0;margin-bottom:12px}
.quick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 4px}
.gquick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.form{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--p-cream-lt)}
.form.editing{border:2px solid var(--p-black);background:var(--ytint)}
.fh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.fh b{font-size:16px}
.ff{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 14px;align-items:start}
.ff>.k{font-size:13px;font-weight:700;color:var(--p-ink-2);padding-top:12px}
.ff>.k i{color:var(--p-black);font-style:normal}
.ff input.t,.ff textarea.t{width:100%}
.fixed{padding-top:11px;font-weight:700}
.bts.sub{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2)}
.fb{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.fb .btn{min-width:160px}
.rep{margin-top:8px}
.artg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:340px;overflow:auto;padding:2px}
.art{border:1px solid var(--line2);border-radius:8px;background:#fff;padding:6px;text-align:left;font-size:13px;color:var(--p-black)}
.art:hover{border-color:var(--p-black)}
.art img,.art .noimg{width:100%;height:70px;display:flex;align-items:center;justify-content:center;border-radius:4px;margin-bottom:4px;object-fit:contain;background:var(--soft);color:var(--muted);font-size:12px}
.art b{font-weight:800}
.gres{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.gres button{border:1px solid var(--line2);border-radius:8px;background:#fff;padding:9px 10px;text-align:left;font-size:15px;color:var(--p-black)}
.gres button:hover{border-color:var(--p-black)}
.gres span{font-size:13px;color:var(--p-ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1.5px solid var(--line2);background:#fff;border-radius:999px;font-size:14px;font-weight:700;color:var(--p-black)}
.chip:hover{border-color:var(--p-black)}
.pttog{font-weight:700}
.ticks{display:flex;flex-direction:column;gap:6px}
.tick{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line2);border-radius:10px;padding:8px 10px;background:#fff;min-height:52px;color:var(--p-black)}
.tick i{font-style:normal;width:24px;height:24px;border:2px solid var(--line2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.tick.on{border:2px solid var(--p-black);background:var(--p-cream-lt)}.tick.on i{background:var(--p-black);border-color:var(--p-black);color:#fff}
.tick b{display:block;font-size:15px}.tick small{display:block;font-size:13px;color:var(--p-ink-2)}
@media (min-width:1200px){.ticks{display:grid;grid-template-columns:1fr 1fr;gap:6px}}
.ovr{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}.ovr label{font-size:13px;color:var(--p-ink-2)}.ovr input{flex:1;min-width:160px}
pre.auto{white-space:pre-wrap;font:14px/1.45 var(--sans);background:#fff;border:1px dashed var(--line2);border-radius:6px;padding:8px 10px;min-height:44px}
.szrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.szs{display:flex;gap:4px;flex-wrap:wrap}
.szs label{display:flex;flex-direction:column;align-items:center;font:700 12px var(--sans);color:var(--p-ink-2);gap:2px}
.szs input{width:50px;height:44px;border:2px solid var(--line2);border-radius:6px;text-align:center;font:700 15px var(--sans);font-variant-numeric:tabular-nums}
.szs .qt{font:800 16px var(--sans);background:var(--p-black);color:#fff;border-radius:6px;padding:12px 12px;align-self:flex-end}
.paste{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.paste input{min-height:44px;border:2px dashed var(--line2);background:#fff;border-radius:6px;padding:0 10px;font-size:15px}
.paste small,.mixb small{font-size:12px;color:var(--p-ink-2)}
.mixb{display:flex;flex-direction:column;gap:2px}
/* vendor check */
.vend{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.vend .vrow{line-height:1.5}.vend .vrow b{display:inline-block;min-width:70px}
.vend select.t.sm{min-height:34px;font-size:13px;max-width:240px}
/* side: checklist + deal emails */
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
.side{position:sticky;top:calc(var(--ohh,96px) + 14px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - var(--p-off-top,128px) - var(--ohh,96px) - 48px)}
.side .rail{margin:0;flex:none}
.rail .p-section{margin-bottom:12px}
.rail .vwarn{margin-top:12px}
.out{margin-top:12px;background:var(--soft);border-radius:8px;padding:10px;font-size:13px;white-space:pre-wrap;max-height:45vh;overflow:auto}
.app.picking .side{display:none}
.mailbox{flex:1;min-height:180px;overflow:auto;margin:0;padding:12px 14px}
.mailbox .mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.mailbox .mclose{display:none;margin-left:auto}
.deal{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:4px}.deal a{color:var(--p-black)}
.finders{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.mtools{position:sticky;top:-12px;background:#fff;z-index:3;padding:8px 0 6px;margin-top:-4px;border-bottom:1px solid var(--line)}
.mtarget{font-size:13px;background:var(--p-cream);border-left:4px solid var(--p-black);border-radius:6px;padding:6px 10px;margin-top:8px}
#mbody .msg{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:14px;line-height:1.45}
#mbody .msg.cust{border-left:3px solid var(--p-black);padding-left:8px}
#mbody .mhd{margin-bottom:2px}
#mbody .s{display:block;padding:4px 6px;margin:2px 0;border-radius:6px;cursor:pointer}
#mbody .s:hover{background:var(--p-cream)}
#mbody .s.used{background:var(--p-cream-dk)}
#mbody .s.q{color:var(--p-ink-2);font-size:13px}
#mbody .msg.shut .s{color:var(--p-ink-2)}
#mbody .more{font-weight:700;color:var(--p-black)}
#mbody .qbtn{border:0;background:none;color:var(--p-ink-2);font-size:13px;text-decoration:underline;padding:4px 6px}
#mbody .quoted{border-left:2px solid var(--line2);margin-left:4px;padding-left:4px}
#mbody mark{background:var(--p-yellow);color:var(--p-black);border-radius:2px;padding:0 1px}
#mbody mark.cur{outline:2px solid var(--p-black)}
#mbody .ql{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--p-ink-2);border:1px solid var(--line2);border-radius:4px;padding:0 3px}
.onlybar{font-size:13px;margin-top:8px;color:var(--p-ink-2)}.onlybar input{vertical-align:middle;margin-right:4px}
.mailfab{position:fixed;right:16px;bottom:16px;z-index:55;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none!important}
input,textarea,select,button,.form,.sec{scroll-margin-top:var(--smt,110px);scroll-margin-bottom:84px}
/* layout: two panes from 1200px (orders | the order). The order's own two columns (forms | checklist + emails) need room:
   with the list showing from 1400px, with the list hidden from 1100px. Otherwise the emails open from a button. */
@media (min-width:1400px){ .app:not(.picking){grid-template-columns:minmax(0,1fr) clamp(360px,26vw,500px)} }
@media (min-width:1100px){ body.nolist .app:not(.picking){grid-template-columns:minmax(0,1fr) clamp(360px,28vw,500px)} }
@media (max-width:1099px){
  .app:not(.picking){grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .mailbox{display:none}.mailbox.open{display:block;position:fixed;inset:0;z-index:60;border-radius:0;max-height:none;padding:16px}
  .mailbox.open .mclose{display:inline}body.noscroll{overflow:hidden}
  .mailfab.show{display:inline-flex!important}
}
@media (min-width:1100px) and (max-width:1399px){
  body:not(.nolist) .app:not(.picking){grid-template-columns:minmax(0,1fr)}
  body:not(.nolist) .side{position:static;max-height:none}
  body:not(.nolist) .mailbox{display:none}body:not(.nolist) .mailbox.open{display:block;position:fixed;inset:0;z-index:60;border-radius:0;max-height:none;padding:16px}
  body:not(.nolist) .mailbox.open .mclose{display:inline}body.noscroll{overflow:hidden}
  body:not(.nolist) .mailfab.show{display:inline-flex!important}
}
/* wide: bar + filter row on top, the two panes scroll on their own */
@media (min-width:1200px){
  html,body{height:100%;overflow:hidden}
  #ohead{position:sticky;top:0;z-index:6}
  #ohead .p-off-oh{box-shadow:0 -16px 0 0 var(--p-cream-lt),var(--p-shadow)}
}
@media (max-width:1199px){
  #split.is-picking #work,#split:not(.is-picking) #olist{display:none}
  body.is-open #filters{display:none}
  #ohead{position:sticky;top:var(--toph,64px);z-index:6}
  #ohead .p-off-oh{box-shadow:0 -16px 0 0 var(--p-cream-lt)}
  #listBtn{display:none}
}

/* v22: the right column on a laptop — boxes keep their size, emails get the rest; too short -> scrolls with the page */
.side>.qbox,.side>.rail{flex:none!important}
.side .qbox{max-height:35vh;overflow:auto}
.side .mailbox{min-height:240px}
.side.side-tall{position:static!important;max-height:none!important}
.side.side-tall .mailbox{flex:none;height:75vh}
.side .p-section{background:none!important;color:var(--p-ink-2)!important;padding:0!important;font:800 12px/1.2 var(--p-sans)!important;letter-spacing:.08em;margin-bottom:8px!important}
.side .qbox,.side .rail{padding:12px 14px!important}
.side .qhd{margin-bottom:6px}
.side .rail .p-off-chk{flex-direction:row;flex-wrap:wrap;gap:6px 16px}
.side .rail .p-off-chk li{align-items:center}
.side .rail .p-off-chk li>i{width:18px;height:18px;margin-top:0}
.side .mailbox .mh{margin-bottom:2px}
.side .mailbox .finders{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.side .mailbox .finders .b{flex:none;min-height:36px;padding:0 10px}
.side .mailbox #mtarget{font-size:13px;padding:6px 10px;margin-top:6px}
#main .qbox-main{margin:0 0 16px}
/* v21: ↩ Undo reorder */
.reobar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
/* v19: the quote (Price-O-Matic v107 -> Quotes) */
.side .qbox{margin:0;flex:0 1 auto;min-height:0;overflow:auto}
#qboxTop .qbox{margin:14px 0 0}
.qbox{padding:14px 16px}
.qhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.qt1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.qt1 b{font-size:16px}
.qt2{font-size:14px;color:var(--p-ink-2);margin-top:4px}
.qlines{list-style:none;margin:8px 0 0;padding:0;max-height:168px;overflow:auto;border-top:1px solid var(--line)}
.qlines li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.qlines li span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.qact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.qrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:8px 10px;margin-top:6px;color:var(--p-black)}
.qrow:hover{border-color:var(--p-black)}.qrow b{display:block;font-size:15px}.qrow small{display:block;font-size:13px;color:var(--p-ink-2)}
.qnotes{margin-top:12px;font-size:14px}.qnotes ul{margin:6px 0 0 18px;padding:0}.qnotes li{margin:2px 0}
#qsearch{width:100%}
@media (max-width:700px){
  #ohead{position:static}
  .ff{grid-template-columns:1fr;gap:4px}.ff>.k{padding-top:8px}.fb .btn{min-width:0;flex:1}
  .doors{grid-template-columns:1fr}.po{grid-template-columns:minmax(0,1fr)}.po .th{display:none}
}
</style>
</head>
<body class="p-app p-off">
<header class="p-bar p-off-bar" data-pin>
  <span class="p-mark"><span class="p-logo" aria-hidden="true"></span></span>
  <span class="p-bar-app">Create order</span><span class="p-bar-ver" id="ver">v22</span>
  <span class="p-tag p-tag-wait" id="pracTag" hidden>Practice</span>
  <nav class="p-bar-views p-off-steps" id="flowNav" aria-label="Order steps"></nav>
  <div class="p-bar-sp">
    <button class="p-barbtn" id="refreshBtn" type="button" onclick="refresh()" title="Reload the orders and check for a new version">&#8635; <span class="p-barbtn-word">Refresh</span></button>
    <button class="p-barbtn p-barbtn-icon" id="gearBtn" type="button" aria-label="Settings" aria-expanded="false" title="Settings" onclick="gear()">&#9881;</button>
  </div>
  <div class="p-menu" id="gearMenu" role="dialog" aria-label="Settings" hidden>
    <div class="p-menu-row"><span class="p-menu-label">Airtable token</span><span class="p-hint">The same one the other Pine apps use. Kept on this device only.</span>
      <div class="p-btns"><input class="p-input" id="tok" type="password" placeholder="pat…" autocomplete="off"><button class="p-btn p-btn-dark" type="button" onclick="saveTok()">Save</button></div></div>
    <div class="p-menu-row"><div class="p-menu-line"><span><b>Practice</b><br><span class="p-hint" id="pracHint"></span></span><button class="p-btn" id="pracBtn" type="button" onclick="togglePractice()"></button></div></div>
  </div>
</header>
<div class="p-filters" id="filters">
  <input class="p-input p-search" id="oq" type="search" placeholder="Customer or order #" aria-label="Search orders" oninput="S.q=this.value;render()" autocomplete="off">
  <div class="p-chips" id="chips" role="tablist" aria-label="Which orders"></div>
  <div class="p-filters-end"><button class="p-btn" id="listBtn" type="button" onclick="toggleList()">Hide list</button></div>
</div>
<div class="p-off-split" id="split">
  <aside class="p-off-pane p-off-list" id="olist" aria-label="Orders waiting for proof"></aside>
  <main class="p-off-pane p-off-work" id="work">
    <div id="ohead"></div>
    <div id="qboxTop"></div>
    <div class="app"><div id="main"></div><div class="side" id="side"><div class="panel qbox" id="qbox"></div><div class="panel rail" id="rail"></div><div class="panel mailbox" id="mailbox"></div></div></div>
    <button class="mailfab btn k" id="mailfab" type="button" onclick="openMail()">✉ Deal emails</button>
  </main>
</div>
<iframe id="pomEngine" src="price-o-matic-v107.html" style="display:none" aria-hidden="true" tabindex="-1" onload="engReady()"></iframe>
<script>
/* =====================================================================
   Create order v22 (Oct 17): the right side on a laptop (Stephen: "this on create order is hard to work through on the
   right side box" — screenshot: the Quote box squeezed to just its title, the deal emails in a small scrolling strip).

/* ---------- POM price: the Price-O-Matic itself, loaded hidden (same as quotes) ---------- */
let ENG=null;
function engReady(){ try{ const w=$('pomEngine').contentWindow; if(w&&typeof w.computeApparelAt==='function'){ ENG=w; render(); } }catch(e){} }
const fleeceOf=l=>!!(l.g&&(l.g.fleece||/hood|crew|fleece|sweat|zip/i.test(l.g.name)));
const stitchBand=n=>n<=5000?'Up to 5,000':n<=7500?'5,000 - 7,500':n<=10000?'7,500 - 10,000':n<=15000?'10,000 - 15,000':'15,000 - 20,000';
function pomImp(p,fleece,l){
  const b={loc:p.loc||'Front',printType:fleece?'Fleece':'Tees / Totes',inkChanges:0,fleeceImpressions:0,supSize:p.supSize&&SUP_SIZES.includes(p.supSize)?p.supSize.trim():'4 X 4',supRecipe:'Wearable',supImprintsPerGang:1,decoSize:'2.5 X 2.5',decoMaterial:'Sim Woven / Twill',decoApplication:'Heat Press',embStitchBand:'Up to 5,000'};
  if(isSP(p)) return Object.assign(b,{type:'Screenprint',screens:p.colors||1,underbase:!!p.ub,inkChanges:inkChanges(p)});
  if(/^Supacolor - /.test(p.type)) return Object.assign(b,{type:'Supacolor',supRecipe:p.type.replace('Supacolor - ','')});
  if(p.type==='Embroidery') return Object.assign(b,{type:'Embroidery',embStitchBand:p.stitch>20000?null:stitchBand(p.stitch||0)});
  if(/Application$/.test(p.type)) return Object.assign(b,{type:'Embroidery',embStitchBand:p.type});
  return null; }
function pom(l){
  if(!isApparel(l)) return {why:'type the price'}; if(!ENG) return {why:'loading POM rates…'};
  const q=qty(l); if(!q) return {why:'add sizes for the POM price'}; if(!l.g) return {why:'pick the garment'}; if(!l.g.cost) return {why:'garment has no cost in Airtable'};
  if(!l.prints.length) return {why:'tick an imprint for the POM price'};
  const fl=fleeceOf(l), list=l.prints.map(id=>pomImp(P(id),fl,l));
  if(list.some(x=>!x||x.embStitchBand===null)) return {why:'an imprint here isn\'t priced by the POM — type the price'};
  // Same math as the POM's computeApparelAt, except each print is priced at the pieces it prints across the
  // whole order (a front shared by a 100 and a 20 prints 120), like Airtable's autoprice.
  const st={shipping:false,asColourLow:false,garmentCost:l.g.cost,fleece:fl,impressions:list};
  try{ if(typeof ENG.impressionPrice==='function'&&typeof ENG.garmentPricing==='function'){
      const imps=list.map((x,k)=>ENG.impressionPrice(x,(printQty(P(l.prints[k]))+(S.lines.includes(l)?0:q))||q)); if(imps.some(v=>v==null||!isFinite(v))) return {why:'no POM price at this qty'};
      const pp=Math.round(((ENG.garmentPricing(st)+imps.reduce((a,b)=>a+b,0))/0.97)/0.05)*0.05; return {pp:Math.round(pp*100)/100}; }
    const c=ENG.computeApparelAt(q,st); return c&&c.pricePerPiece?{pp:Math.round(c.pricePerPiece*100)/100}:{why:'no POM price at this qty'}; }catch(e){ return {why:'POM error: '+e.message}; } }
const printQty=p=>linesWith(p).reduce((a,l)=>a+qty(l),0);
const price=l=>l.price!=null?l.price:(pom(l).pp??null);

/* ---------- checks ---------- */
function lineNeed(l){ if(isApparel(l)&&!l.g) return 'pick the garment'; if(offSizes(l).length) return 'remove '+offSizes(l).join(', ')+' (not made in that size)'; if(!qty(l)) return isApparel(l)?'add sizes':'add the qty'; if(!l.prints.length&&isApparel(l)) return 'tick an imprint'; if(price(l)==null) return 'add a price'; return ''; }
function printNeed(p){ return !p.type?'needs an imprint type':!p.loc?'needs a location':!p.nick.trim()?'needs a nickname':isSP(p)&&!screens(p)?'needs a screen count':p.type==='Embroidery'&&!(p.stitch>0)?'needs a stitch count (an estimate is fine)':/^Supacolor/.test(p.type)&&!p.supSize?'needs a transfer size':''; }
function checks(){ const c=[], bad=S.lines.filter(lineNeed), pb=S.prints.filter(printNeed);
  c.push([!pb.length&&(S.prints.length>0||(S.lines.length>0&&S.lines.every(l=>!isApparel(l)))),pb.length?`${pid(pb[0])}: ${printNeed(pb[0])}`:S.prints.length?`${S.prints.length} imprint${S.prints.length>1?'s':''} ready`:'Add the imprints']);
  c.push([S.lines.length>0&&!bad.length,!S.lines.length?'Add a line item':bad.length?`Line ${S.lines.indexOf(bad[0])+1}: ${lineNeed(bad[0])}`:`${S.lines.length} line item${S.lines.length>1?'s':''} ready`]);
  const unused=S.prints.filter(p=>!linesWith(p).length); if(unused.length&&S.lines.length) c.push([false,`${unused.map(pid).join(', ')} ${unused.length>1?'aren\'t':'isn\'t'} ticked on any line item yet`]);
  if(!S.niEdit&&impDirty(S.ni)) c.push([false,'Imprint Creator has one not added yet']);
  if(!S.nlEdit&&lineDirty(S.nl)) c.push([false,'Line Item Creator has one not added yet']);
  if(S.existing.length+S.prints.length>26) c.push([false,'More than 26 imprints on one order']);
  return c; }
// What art reads: one row per ticked imprint, with the colors sales typed (per garment if changed)
function proofNotes(l){ if(l.notes!=null) return l.notes;
  return l.prints.map(id=>P(id)).filter(Boolean).map(p=>{ const ink=(l.inks[p.id]??p.inks)||'';
    return `${pid(p)} ${p.loc} · ${p.nick}${isSP(p)?` · ${screens(p)} screen${screens(p)===1?'':'s'}`:` · ${p.type}`}${p.type==='Embroidery'&&p.stitch?' · ~'+Number(p.stitch).toLocaleString()+' stitches':''}${/^Supacolor/.test(p.type)&&p.supSize?' · '+p.supSize.trim():''}${ink?' · Colors: '+ink:''}${p.prev?' · repeat of '+p.prev.id:''}`; })
    .join('\n').replace(/UPDATE:/gi,'Update -'); }

/* ---------- create ---------- */
async function create(){
  if(S.busy||S.done) return; const c=checks(); if(!c.every(x=>x[0])) return toast('Finish the checklist first');
  S.busy=true; S.err=''; render();
  // A retry after a failure keeps what was already created (S.made) and only adds the rest, so nothing doubles.
  const made=S.made=S.made||{imps:[],lines:[],newId:{}}, newId=made.newId, clean=s=>String(s||'').trim().replace(/UPDATE:/gi,'Update -');
  try{
    // 1. Imprints one at a time, in order, so the ID automation hands out A, B, C… in the order shown here.
    for(const p of S.prints){ if(newId[p.id]) continue;
      const f={[IP.order]:[S.o.id],[IP.type]:p.type,[IP.loc]:p.loc,[IP.nick]:p.nick.trim()}; if(p.pnotes.trim()) f[IP.pnotes]=clean(p.pnotes);
      if(isSP(p)){ f[IP.screens]=screens(p); f[IP.inkChanges]=inkChanges(p); }
      if(p.type==='Embroidery') f[IP.stitch]=Math.round(p.stitch);
      if(/^Supacolor/.test(p.type)&&p.supSize) f[IP.supSize]=p.supSize;
      if(p.prev){ f[IP.repeat]=true; f[IP.prev]=[p.prev.rid]; if(p.prev.inkIds&&p.prev.inkIds.length) f[IP.inks]=p.prev.inkIds; }
      const r=await atWrite('POST',T_IMP,[{fields:f}]); newId[p.id]=r.records[0].id; made.imps.push({p,rid:r.records[0].id});
    }
    // 2. Line items, 10 per call. Both order links: automations read Order Reference.
    const todo=S.lines.filter(l=>!made.lines.some(x=>x.l===l));
    const recs=todo.map(l=>{ const f={[LF.ref]:[S.o.id],[LF.orders]:[S.o.id],[LF.ptype]:l.ptype,[LF.price]:price(l),[LF.imprints]:l.prints.map(x=>newId[x])};
      if(l.g) f[LF.garment]=[l.g.id]; const n=proofNotes(l); if(n) f[LF.proof]=n; if(l.womens) f[LF.womens]=true; if(l.youth) f[LF.youth]=true;
      [['sales','sales'],['prod','prod'],['ship','ship'],['fin','fin'],['desc','desc'],['promo','promo']].forEach(([k,fk])=>{ if(String(l[k]||'').trim()) f[LF[fk]]=clean(l[k]); });
      if(l.patch&&isPatchPT(l)) f[LF.patch]=l.patch; if(l.sticker&&l.ptype==='Stickers') f[LF.sticker]=l.sticker;
      Object.entries(l.sizes).forEach(([z,v])=>{ if(SZF[z]&&v) f[SZF[z]]=v; }); return {fields:f}; });
    for(let i=0;i<recs.length;i+=10){ const r=await atWrite('POST',T_LI,recs.slice(i,i+10)); r.records.forEach((x,k)=>made.lines.push({l:todo[i+k],rid:x.id})); }
    // 3. v6: the artwork folder link on the order (only that field)
    if(S.o.art&&/^https?:\/\//i.test(S.o.art)&&!made.art){ await atWrite('PATCH',T_ORD,[{id:S.o.id,fields:{[O.art]:S.o.art}}]); made.art=true; }
    // 4. v19: the quote this order came from -> Quotes › Order (keeps any links it has) + Status Won
    const qs=S.qt&&S.qt.sel; if(qs&&!made.quote){ await atWrite('PATCH',T_Q,[{id:qs.id,fields:{[QF.order]:[...new Set((qs.order||[]).concat([S.o.id]))],[QF.status]:'Won'}}]); made.quote=qs.num||true; qs.status='Won'; qs.order=[...new Set((qs.order||[]).concat([S.o.id]))]; }
    S.done=made; S.tEnd=Date.now(); S.busy=false; render(); toast(PRACTICE?'Practice: nothing was saved':'Order '+S.o.num+' created');
    if(!PRACTICE) setTimeout(readBackIds,4000);
  }catch(e){ S.busy=false; S.err=`Stopped: ${e.message}. Already in Airtable: ${made.imps.length} imprint${made.imps.length===1?'':'s'}, ${made.lines.length} line item${made.lines.length===1?'':'s'}. Fix the problem and press Finish creating — it only adds what's missing.`; render(); }
}
async function readBackIds(){ try{ const ids=S.done.imps.map(x=>x.rid); if(!ids.length) return; const d=await at(T_IMP,`${flds([IP.id])}&filterByFormula=${byIds(ids)}`); S.done.ids={}; (d.records||[]).forEach(r=>S.done.ids[r.id]=r.fields[IP.id]||''); render(); }catch(e){} }

/* ---------- render ---------- */
let pendingFocus=null; function focusSoon(id){ pendingFocus=id; setTimeout(()=>{ const e=$(id); if(e) e.focus(); pendingFocus=null; },0); }
let rendering=false;
// A field's "change" fires as you leave it, before the tap on the next field lands. Redrawing right then swaps out the field you
// tapped, so the tap is lost (and typing goes nowhere). Wait a tick: focus has moved by then, and draw() puts it back.
let deferred=false;
// v22: pin the right column only while Quote + Checklist + 240px of emails fit in the window
function fitSide(){ const sd=$('side'); if(!sd) return; sd.classList.remove('side-tall');
  if(getComputedStyle(sd).position!=='sticky') return;
  const cs=getComputedStyle(sd), room=parseFloat(cs.maxHeight)||(window.innerHeight-(parseFloat(cs.top)||0)-24);
  const need=[...sd.children].reduce((h,c)=>h+(c.offsetParent?(c.classList.contains('mailbox')?240:c.offsetHeight)+12:0),0)-12;
  if(need>room) sd.classList.add('side-tall'); }
window.addEventListener('resize',()=>requestAnimationFrame(fitSide));
function render(){ if(window.event&&window.event.type==='change'){ if(!deferred){ deferred=true; setTimeout(()=>{ deferred=false; render(); },0); } return; }
  if(rendering){ setTimeout(render,0); return; } rendering=true; try{ draw(); document.querySelectorAll('textarea.tg').forEach(grow); } finally{ rendering=false; } }
function draw(){
  const ae=document.activeElement, keep=ae&&ae.id&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)?{id:ae.id,s:ae.selectionStart}:null;
  if(S.view==='edit'){ if(!S.ni) S.ni=blankImp(); if(!S.nl) S.nl=blankLine(); }
  $('main').innerHTML=S.view==='pick'?vEmpty():S.view==='loading'?'<div class="panel hint">Loading…</div>':S.view==='door'?vDoor():vEdit();
  $('ohead').innerHTML=vOH(); $('olist').innerHTML=vList(); $('chips').innerHTML=vChips();
  $('rail').innerHTML=vRail(); document.querySelector('.app').classList.toggle('picking',S.view==='pick');
  { const qh=vQuote();   /* v22: the quote sits at the top of the form column, so the right side is for the emails */ $('qbox').innerHTML=''; $('qbox').style.display='none'; $('qboxTop').innerHTML=''; if(qh) $('main').insertAdjacentHTML('afterbegin',`<div class="panel qbox qbox-main">${qh}</div>`); }
  $('split').classList.toggle('is-picking',S.view==='pick'); document.body.classList.toggle('is-open',S.view!=='pick'); syncList();
  $('flowNav').innerHTML=flowNav('order',S.o&&S.view!=='pick'?S.o.num:'');
  if(S.view==='edit'&&S.mailDrawn!==S.mail) renderMail(); else if(S.view!=='edit'&&S.mailDrawn){ S.mailDrawn=null; renderMail(); }
  $('mailfab').classList.toggle('show',!!(S.o&&S.view==='edit'));
  requestAnimationFrame(fitSide);   // v22
  if(keep&&!pendingFocus){ const e=$(keep.id); if(e){ e.focus(); try{ e.setSelectionRange(keep.s,keep.s); }catch(_){} } }
  measure();
}
const errHtml=()=>S.err?`<div class="err">${esc(S.err)}</div>`:'';
/* ---------- v18: the order list (left pane from 1200px; the first screen below that) ---------- */
function listParts(){ const q=S.q.toLowerCase().trim(), hit=o=>!q||o.name.toLowerCase().includes(q)||String(o.num).startsWith(q), recent=o=>!o.created||(Date.now()-new Date(o.created))/864e5<=RECENT_DAYS;
  const base=(S.awaiting||[]).filter(hit).filter(o=>q||recent(o)), need=base.filter(o=>!o.lines), has=base.filter(o=>o.lines);
  return {q,base,need,has,list:S.listF==='need'?need:S.listF==='has'?has:base}; }
function vChips(){ if(!TOKEN||S.awaiting==null) return ''; const {base,need,has}=listParts();
  const chip=(k,t,n)=>`<button class="p-tab${S.listF===k?' is-on':''}" role="tab" aria-selected="${S.listF===k}" onclick="S.listF='${k}';render()">${t} <span class="p-count">${n}</span></button>`;
  return chip('need','Needs lines',need.length)+chip('has','Has lines',has.length)+chip('all','All',base.length); }
function vList(){ if(!TOKEN) return `<div class="olempty">Add your Airtable token in ⚙ (top right) to start.</div>${errHtml()}`;
  if(S.awaiting==null) return '<div class="olempty">Loading orders waiting for proof…</div>';
  const {q,list}=listParts(), cur=S.o&&S.view!=='pick'?S.o.id:'';
  const row=o=>`<div class="p-off-orow${o.lines?' is-has':''}${o.id===cur?' is-on':''}" tabindex="0" role="button" data-num="${o.num}" onclick="choose('${o.id}')" onkeydown="if(event.key==='Enter')choose('${o.id}')"><span class="p-id">${o.num}</span><span class="p-off-orow-cust" title="${esc(o.name)}">${esc(o.name)}</span><span class="p-off-orow-sub">${[ago(o.created)+(o.blank?' · no status':''),esc(o.rep)].filter(Boolean).join(' · ')}</span><span class="p-off-orow-end">${o.lines?`<span class="p-tag p-tag-soft">${o.lines} line${o.lines>1?'s':''}</span><a href="pine-line-item-review.html?order=${o.num}${PRACTICE?'&practice=1':''}" onclick="event.stopPropagation()">Review →</a>`:'<span class="p-tag p-tag-wait">Needs lines</span>'}</span></div>`;
  return `<div class="olh"><span class="p-section">Waiting for proof <span class="p-count">${list.length}</span></span><span class="hint">${q?'any date':'last '+RECENT_DAYS+' days'} · made by Pipedrive</span></div>
    ${list.length?list.slice(0,60).map(row).join(''):`<div class="olempty">${S.listF==='need'?'Every order waiting for proof has lines already.':S.listF==='has'?'No orders with lines yet.':'No order waiting for proof matches.'}</div>`}${S.view==='pick'?errHtml():''}`; }
function vEmpty(){ return `<div class="p-off-empty"><div>${TOKEN?'Pick an order on the left.':'Add your Airtable token in ⚙ to start.'}<div class="p-hint" style="margin-top:6px;font-weight:400">Its imprints, then its line items. The deal's emails show beside the forms. Nothing is saved until Create order.</div></div></div>`; }
const fmtDay=d=>{ const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('en-US',{month:'short',day:'numeric'}):esc(d); };
const alNote=()=>{ const o=S.o; return o&&(o.lineCount||S.existing.length)?`<div class="p-note p-note-wait alnote">Already has ${o.lineCount} line${o.lineCount===1?'':'s'}${S.existing.length?' and imprints '+esc(S.existing.join(', ')):''}. New ones are added alongside.</div>`:''; };
/* the shared order header: # · CUSTOMER · rep · due · links | lines · pcs · total | THE yellow button */
function vOH(){ const o=S.o; if(!o||S.view==='pick') return '';
  const pcs=S.lines.reduce((a,l)=>a+qty(l),0), tot=S.lines.reduce((a,l)=>a+(price(l)||0)*qty(l),0);
  const due=o.due?`<span class="p-tag${o.hard==='ASAP'?' p-tag-wait':''}">${o.hard==='ASAP'?'ASAP · ':o.hard?'Hard · ':'Due '}${fmtDay(o.due)}</span>`:o.hard?`<span class="p-tag">${esc(o.hard)}</span>`:'';
  const deal=S.mail&&S.mail.deal&&S.mail.deal.url, art=o.art&&/^https?:\/\//i.test(o.art)?o.art:'';
  const links=(deal?`<a class="p-off-link" href="${esc(deal)}" target="_blank" rel="noopener">Deal ↗</a>`:'')
    +(art?`<a class="p-off-link" href="${esc(art)}" target="_blank" rel="noopener">Art folder ↗</a>`:'<span class="p-off-link is-off">No art folder yet</span>')
    +`<a class="p-off-link" href="https://airtable.com/${BASE}/${T_ORD}/${o.id}" target="_blank" rel="noopener">Airtable ↗</a><button class="p-off-link" type="button" onclick="leaveOrder()">Change order</button>`;
  const nums=S.view==='edit'?`<div class="p-num"><small>Lines</small><b>${S.lines.length}</b></div><div class="p-num"><small>Pcs</small><b>${pcs}</b></div><div class="p-num"><small>Total · before 2XL+</small><b>${money(tot)}</b></div>`:'';
  let act='';
  if(S.view==='edit'){
    if(S.done) act=`<a class="p-btn p-btn-main" href="pine-line-item-review.html?order=${o.num}${PRACTICE?'&practice=1':''}">Review ${o.num} →</a><span class="p-hint">${PRACTICE?'Practice: nothing was saved':'Created in Airtable'}</span>`;
    else { const ok=checks().every(x=>x[0]); act=`<button class="p-btn p-btn-main" id="createBtn" type="button" onclick="create()" ${ok&&!S.busy?'':'disabled'}>${S.busy?'Creating…':S.made?'Finish creating':PRACTICE?'Create order (practice)':'Create order'}</button><span class="p-hint">${ok?'Nothing goes to Airtable until this.':'Finish the checklist first.'}</span>`; } }
  return `<div class="p-off-oh"><div class="p-off-oh-main"><div class="p-off-oh-l1"><span class="p-id p-off-oh-id">#${o.num}</span><span class="p-off-oh-cust">${esc(o.name)}</span>${o.ship?`<span class="p-tag p-tag-soft">${esc(o.ship)}</span>`:''}</div>
    <div class="p-off-oh-l2">${o.rep?`<b>${esc(o.rep)}</b>`:''}${due}<span class="p-off-links">${links}</span></div></div><div class="p-off-oh-nums">${nums}</div><div class="p-off-oh-act">${act}</div></div>`; }
function leaveOrder(){ if(!S.done&&(S.lines.length||S.prints.length)&&!confirm(S.made?'Leave this order? Part of it is already in Airtable — finish it or fix it in Line Item Review.':'Leave this order? What you entered here is not saved.')) return false;
  S.reo=null; S.made=null; S.done=null; S.view='pick'; S.o=null; S.t0=null; S.err=''; S.mail=null; S.qt=null; S.qfill=null; renderMail(); render(); return true; }

function nextOrder(){ S.reo=null; S.view='pick'; S.o=null; S.t0=null; S.done=null; S.made=null; S.mail=null; S.qt=null; S.qfill=null; renderMail(); render(); }
function vDoor(){ const imgs=o=>o.thumbs.slice(0,3).map(u=>`<img src="${esc(u)}" loading="lazy" alt="">`).join('')||'<span class="noimg">no proof</span>';

  if(S.done) return h+vLists();
  return h+`<div class="panel sec" id="impform"><div class="p-off-sec"><span class="p-section">1 · Imprints</span><span class="p-hint">Imprint Creator · one per location</span></div>${vImpList()}${vImpForm()}</div>
    <div class="panel sec" id="lineform"><div class="p-off-sec"><span class="p-section">2 · Line items</span><span class="p-hint">Line Item Creator · one per garment color</span></div>${vLineList()}${vLineForm()}</div>${errHtml()}`; }

function vImpList(){ if(!S.prints.length) return '';
  return `<div class="cards">${S.prints.map(p=>{ const n=linesWith(p).length, need=printNeed(p), ed=S.ni===p;

const FAM_QUICK=['Screen print','Embroidery','Supacolor','Patch & label'];
function vImpForm(){ const p=S.ni, fam=p.fam||famOf(p.type), sp=fam==='Screen print', edit=S.niEdit, a=P(S.after);

  const btn=(on,label,js,cls='')=>`<button class="b${on?' on':''}${cls}" onclick="${js}">${label}</button>`;
  let h=`${quick}<div class="form${edit?' editing':''}"><div class="fh"><b>${edit?'Editing '+pid(p):'Imprint Creator'}</b>${edit?'':`<span class="hint">this one becomes <span class="idtag">${nextId()}</span></span>`}${p.with&&P(p.with)?`<span class="tag">goes with ${pid(P(p.with))}</span>`:''}</div><div class="ff">

    <span class="k">Repeat?</span><div><div class="bts">${btn(!p.rep&&!p.prev,'New art',`impRepeat(false)`)}${btn(p.rep||!!p.prev,'Repeat of past art',`impRepeat(true)`)}${p.prev?`<span class="tag">repeat of ${esc(p.prev.id)}</span> <button class="link" onclick="S.ni.prev=null;render()">undo</button>`:''}</div>${p.rep?vRepeat():''}</div>
    <span class="k">Imprint Type <i>*</i></span><div><div class="bts">${Object.keys(FAM).filter(f=>FAM_QUICK.includes(f)||p.famMore||fam===f).map(f=>btn(fam===f,f,`impFam('${f}')`)).join('')}${p.famMore||!fam||FAM_QUICK.includes(fam)?(p.famMore?'':`<button class="link" onclick="S.ni.famMore=true;render()">more…</button>`):''}</div>

    <span class="k">Location <i>*</i></span><div class="bts">${LOC_QUICK.map(x=>btn(p.loc===x,x,`S.ni.loc='${x}';render()`)).join('')}${p.locMore||LOC_MORE.includes(p.loc)?LOC_MORE.map(x=>btn(p.loc===x,x,`S.ni.loc='${x}';render()`)).join(''):`<button class="link" onclick="S.ni.locMore=true;render()">more…</button>`}</div>`;
  if(sp) h+=`<span class="k">Screen Count <i>*</i></span><div><div class="bts">${[1,2,3,4,5,6,7,8].map(n=>btn(p.scr===n,n,`impScr(${n})`,' num')).join('')}${p.scrMore||p.scr>8?`<input class="t sm" id="imp_scr" inputmode="numeric" pattern="[0-9]*" value="${p.scr>8?p.scr:''}" placeholder="9+" onchange="impScr(Math.max(1,parseInt(this.value)||0))">`:`<button class="b num" onclick="S.ni.scrMore=true;render();focusSoon('imp_scr')">＋</button>`}</div>${hasBase(p.type)?'<div class="hint">Includes the underbase screen.</div>':''}</div>
    <span class="k">Ink Changes <i>*</i></span><div class="bts">${[0,1,2,3,4].map(n=>btn(p.ic===n,n,`S.ni.ic=${n};render()`,' num')).join('')}${p.icMore||p.ic>4?`<input class="t sm" id="imp_ic" inputmode="numeric" pattern="[0-9]*" value="${p.ic>4?p.ic:''}" placeholder="5+" onchange="S.ni.ic=Math.max(0,parseInt(this.value)||0);render()">`:`<button class="b num" onclick="S.ni.icMore=true;render();focusSoon('imp_ic')">＋</button>`}</div>`;

  if(/^Supacolor/.test(p.type)) h+=`<span class="k">Transfer Size <i>*</i></span><div class="bts">${SUP_QUICK.map(z=>btn(p.supSize===z,esc(z.replace('A3 - ','').replace(' GANG',' gang')),`S.ni.supSize='${z}';render()`)).join('')}<select class="t sm" onchange="S.ni.supSize=this.value;render()"><option value="">all sizes…</option>${SUP_SIZES.map(z=>`<option${p.supSize===z?' selected':''} value="${esc(z)}">${esc(z)}</option>`).join('')}</select></div>`;

    <span class="k">Colors</span><div><input class="t" id="imp_colors" data-label="Colors" value="${esc(p.inks)}" placeholder="what the customer asked for: Cream, #F3EBD7, PMS 7527…" oninput="S.ni.inks=this.value"><div class="hint">Goes into the Proofing Notes of each line item it's on (what art reads). Can be changed per garment.</div></div>

    </div><div class="fb"><button class="link" onclick="clearImp()">${edit?'stop editing':'Clear form'}</button>${edit?`<button class="btn k" onclick="addImp()">Done</button>`:`<button class="btn k" onclick="addImp()">Add imprint</button>`}</div></div>`;
  return h; }
function vRepeat(){ const q=(S.repQ||'').trim().toLowerCase(), list=S.pastImps.filter(a=>!q||[a.id,a.nick,a.loc,a.type].join(' ').toLowerCase().includes(q)).slice(0,60);

const offWarn=l=>offSizes(l).length?`<div class="p-note p-note-alert" style="margin-top:6px">${esc(gLabel(l.g))} isn't made in ${offSizes(l).join(', ')}. Clear ${offSizes(l).length>1?'those':'that'} before adding the line.</div>`:'';
function vLineList(){ if(!S.lines.length) return '';
  return `<div class="cards">${S.lines.map((l,i)=>{ const need=lineNeed(l), p=price(l), ed=S.nl===l, q=qty(l), vf=vendorFlag(l);
    const imps=l.prints.map(id=>P(id)).filter(Boolean).map(x=>`<span class="p-id" title="${esc((x.nick||'')+' · '+x.loc)}">${pid(x)}</span>`).join('')||'<span class="warn">no imprints ticked</span>';
    return `<div class="p-off-li${ed?' is-edit':''}"><div class="p-off-li-main"><div class="p-off-li-t"><span class="p-off-li-n">${i+1}</span><span class="p-off-li-g">${l.g?esc(gLabel(l.g))+' · '+esc(l.g.color):esc(l.ptype)}</span>${need?`<span class="p-tag p-tag-wait">${esc(need)}</span>`:'<span class="p-tag p-tag-done">✓ Ready</span>'}</div>

function vLineForm(){ const l=S.nl, edit=S.nlEdit, ap=isApparel(l), q=qty(l), r=pom(l), pp=r.pp??null, pr=price(l), under=pr!=null&&pp!=null&&pr<pp-0.001, a=Ln(S.lastLine);

  let h=`${quick}<div class="form${edit?' editing':''}"><div class="fh"><b>${edit?'Editing line '+(S.lines.indexOf(l)+1):'Line Item Creator'}</b></div><div class="ff">

const QUOTE_RE=/(?:^|\s)(?:On\s[^\n]{4,200}?wrote:|\d{1,2}\s+[A-Z][a-z]+(?:\s+\d{4})?\s+at\s+\d{1,2}:\d{2},[^\n]{2,200}?wrote:|[A-Z][a-z]{2,8},?\s+[A-Z][a-z]+\s+\d{1,2},?\s+\d{4}[^\n]{0,40}?wrote:|-{2,}\s*Original Message|From:\s[^\n]{2,200}?(?:Sent|Date):)/;

const qStyle=x=>{ const vg=x.data&&x.data.vg; return String((vg&&vg.style)||(x.style||'').split(/\s+/).pop()||'').trim(); };

async function fillFromQuote(){ const q=S.qt&&S.qt.sel; if(!q||!q.lines||!q.lines.length||S.done) return;

  S.view='edit'; S.prints=[]; S.lines=[]; S.ni=blankImp(); S.nl=blankLine(); S.niEdit=S.nlEdit=false; S.after=S.lastLine=null; S.impOpen=false;
  S.qfill={qid:q.id,num:q.num,busy:true,notes:[]}; render();
  const notes=[], keyed={}, gby={};
  // one Airtable Garments lookup per style (exact Product Number), plus the Bandana 4800 colors if a bandana was quoted
  const styles=[...new Set(q.lines.filter(x=>((x.data&&x.data.product)||'apparel')==='apparel').map(qStyle).filter(Boolean))];
  await Promise.all(styles.map(async st=>{ try{ gby[st]=(await atAll(T_GAR,`pageSize=100&${flds(Object.values(G))}&filterByFormula=${encodeURIComponent(`TRIM({Product Number})="${fq(st)}"`)}`,200)).map(mapG); }catch(e){ gby[st]=[]; } }));
  let band=null; if(q.lines.some(x=>x.data&&x.data.product==='bandana')){ const x=STOCK[0]; try{ band=stockCache[0]||(stockCache[0]=(await atAll(T_GAR,`pageSize=100&${flds(Object.values(G))}&filterByFormula=${encodeURIComponent(`AND(TRIM({Product Number})="${x.num}",FIND("${x.mfr}",LOWER({Manufacturer}&"")))`)}`,200)).map(mapG).sort((a,b)=>a.color.localeCompare(b.color))); }catch(e){ band=[]; } }
  if(!S.qfill||S.qfill.qid!==q.id||S.o==null) return;   // the rep moved on while loading
  const tick=(l,r)=>{ const k=JSON.stringify([r.type,r.loc,r.scr||0,r.ic||0,r.stitch||0,r.supSize||'']); let p=keyed[k];
    if(!p){ p=Object.assign(blankImp(),{type:r.type,fam:famOf(r.type),loc:r.loc,scr:r.scr||0,ic:r.ic||0,stitch:r.stitch||0,supSize:r.supSize||'',fromQ:r}); syncScr(p); S.prints.push(p); keyed[k]=p; }
    if(!l.prints.includes(p.id)) l.prints.push(p.id); };
  q.lines.forEach((x,i)=>{ const d=x.data||{}, prod=d.product||'apparel', s=d.snap||{}, l=blankLine(), lab='Line '+(i+1), qq=x.qty||d.qty||0;
    const pp=x.pp!=null?x.pp:(d.quotedUnit!=null?Math.round(d.quotedUnit*100)/100:null);
    l.price=pp; l.fromQ={num:q.num,pp,qty:qq,label:x.label};
    if(prod==='apparel'){ l.ptype='Printed Apparel'; const vg=d.vg||null, st=qStyle(x), brand=(vg&&vg.brand)||'', color=(vg&&vg.color)||x.color||'';
      const all=gby[st]||[], mine=all.filter(g=>!brand||!brandOf(g)||brandMatch(brandOf(g),brand)), pool=mine.length?mine:all;
      if(!st) notes.push(`${lab}: pick the garment (the quote line is "${x.label.replace(/^\d+\s*·\s*/,'')}")`);
      else if(!pool.length){ notes.push(`${lab}: ${[brand,st].filter(Boolean).join(' ')} isn't in Airtable Garments. Add it in Garment Creator, then pick it.`); l.gq=st; }
      else { const m=color?colorRows(pool.map(g=>({color:g.color,g})).concat(pool.filter(g=>g.ssColor).map(g=>({color:g.ssColor,g}))),color):[];
        if(m.length){ l.g=m[0].g; l.colors=pool.length>1?pool:null; if(colorKey(l.g.color)!==colorKey(color)&&colorKey(l.g.ssColor)!==colorKey(color)) notes.push(`${lab}: quoted ${color}, Airtable calls it ${l.g.color}. Check it's the same.`); }
        else { l.colors=pool; notes.push(`${lab}: pick the color${color?' (quoted '+color+')':''}`); } }

      if(b.hangers){ l.fin='Bandana hangers (quoted)'; l.more=true; }

    } else if(prod==='flatstock'){ const f=s.flatstock||{}; l.ptype='Flatstock Printing'; l.sizes={OSFA:qq};
      tick(l,{type:'Flatstock',loc:'Flatstock',from:'Flatstock'}); if(f.paper||f.printsPerSheet>1) l.prod=`${f.paper||'French'} paper${f.printsPerSheet>1?' · '+f.printsPerSheet+' up':''} · ${f.colors||1} color${(f.colors||1)>1?'s':''} (quoted)`;
    } else if(prod==='patches'){ const pt=s.patches||{}; l.ptype=PATCH_PT[pt.type]||'Embroidered Patches (100%)'; l.sizes={OSFA:qq};
      const m=String(pt.size||'').match(/^(\d+(?:\.\d+)?)x(\d+(?:\.\d+)?)$/i), z=m&&m[1]===m[2]?m[1]+' inch':'';
      if(z&&PATCH_SIZES.includes(z)) l.patch=z; else if(pt.size) notes.push(`${lab}: patch size ${pt.size} isn't one of Airtable's; pick the closest`);
      if(!PATCH_PT[pt.type]) notes.push(`${lab}: check the product type (quoted ${pt.type||'patches'})`);
    } else { l.ptype='Misc.'; l.sizes={OSFA:qq}; notes.push(`${lab}: check the product type (quoted "${x.label}")`); }
    autoPT(l); S.lines.push(l); });
  // what the rep finishes on the imprints: nicknames always, plus what the quote couldn't say
  if(S.prints.length) notes.unshift(`${S.prints.map(pid).join(', ')}: add ${S.prints.length>1?'nicknames':'a nickname'}`);
  S.prints.forEach(p=>{ const r=p.fromQ||{};
    if(!p.loc) notes.push(`${pid(p)}: pick the location (quoted ${r.from})`);
    if(r.ink) notes.push(`${pid(p)}: ${p.type} is from the quote (${p.ub?'underbase':'no underbase'}). Check the ink.`);
    if(r.band) notes.push(`${pid(p)}: ~${Number(p.stitch).toLocaleString()} stitches is the quote's band (${r.band}). Put the real count in when it's digitized.`); });

  render(); S.lines.forEach(l=>l.g&&vendorCheck(l.g));
  toast(`Filled from Q-${q.num}: ${S.lines.length} line${S.lines.length===1?'':'s'}, ${S.prints.length} imprint${S.prints.length===1?'':'s'}. Finish what's listed above the imprints.`); }

  if(!TOKEN) return '';
