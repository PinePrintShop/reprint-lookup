       again, so a folder made by hand shows up too.

       open job, filters, search and scroll. It still checks for a new app version (pine-update.js), which may reload.
     - Drive reads skip the browser cache (cache: no-store). Airtable writes: same as v49. New reads: the open job's
       record (one GET every 25 s while it's open and the tab is in front). ?poll=<seconds> changes the beat (tests).

     - ⬇ Download in the full-screen viewer (the mockup, a previous run's proof, the sep file) and next to Full screen

     Seps v47 (2026-10-26): drag and drop to the order's Drive (Stephen: "can we do a drag and drop for the Seps app to

<head>

<style>
/* v35: the Pine page kit (pine-style-v2.css) does the bar, filter row, page heads and list cards. App-only bits below.
   Old variable names are kept and pointed at the v2 tokens, so nothing outside the four colors is left. */
:root{--bg:var(--p-cream-lt);--surface:var(--p-white);--border:var(--p-line);--border-dk:var(--p-line-strong);
  --text:var(--p-black);--muted:var(--p-ink-2);--muted-lt:var(--p-ink-3);--red:var(--p-alert);--amb:var(--p-ink-2);
  --sans:var(--p-sans);--cond:var(--p-sans);--mono:var(--p-sans);--radius:var(--p-r);--radius-lg:var(--p-r-lg)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%;background:var(--p-cream-lt)}
button,input,select,textarea{font-family:inherit}
.add-slot-btn,.base-chip,.scan-chip,.p-lc-head{-webkit-user-select:none;user-select:none}
.p-bar{z-index:30}
.sp-menu-tok{display:flex;gap:var(--p-s2)}
.sp-menu-tok .p-input{flex:1;min-width:0}
.p-menu .p-hint{font-size:var(--p-fs-xs)}
.p-menu .p-hint.is-bad{color:var(--p-alert)}
/* filter row */
@media (min-width:701px){ .p-filters{padding-left:24px;padding-right:24px} }
.p-filters .p-select{width:auto;min-width:150px}
.p-tab.zero{border-color:var(--p-line-strong);color:var(--p-ink-3)}
/* page */
.wrap{padding:0 24px 120px}
.wrap.is-split{padding:0 24px}
.wrap>.p-head:first-child,.p-split-list>.p-head:first-child{margin-top:var(--p-s4)}
.msg{padding:48px 16px;text-align:center;color:var(--p-ink-2);font-size:var(--p-fs-m)}
.msg b{display:block;color:var(--p-black);font-size:18px;margin-bottom:6px}
.msg.err b{color:var(--p-alert)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--p-line);border-top-color:var(--p-black);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
/* job card head */
.p-lc-head.is-tap:hover{background:var(--p-cream-lt)}
.p-lc.is-done .p-lc-head{background:var(--p-cream-lt)}
.cl-wrap{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cl-hide{display:none!important}
.cl-picker{display:inline-flex;gap:6px;flex-wrap:wrap}
.sp-sm{min-height:var(--p-tap);padding:0 12px;font-size:var(--p-fs-s)}
.sp-claimed{display:inline-flex;align-items:center;gap:2px}
.sp-claimed .p-tag{height:32px;font-size:var(--p-fs-s);letter-spacing:.02em}
.sp-x{width:var(--p-tap);height:var(--p-tap);border:0;border-radius:var(--p-r);background:transparent;color:var(--p-ink-2);font-size:16px;cursor:pointer}
.sp-x:hover{background:var(--p-alert-lt);color:var(--p-alert)}
/* open job: proof beside the controls when there's room */
.p-lc.is-open{overflow:clip}  /* kit .p-lc is overflow:hidden, which stops the proof and the Mark sep'd bar from sticking */
.p-lc-body.sp-body{container-type:inline-size;padding:var(--p-s4)}
.sp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--p-s4);align-items:start}
@container (min-width:620px){
  .sp-grid{grid-template-columns:minmax(220px,40%) minmax(0,1fr)}
  .sp-proof{position:sticky;top:72px}
}
.sp-ctl{display:flex;flex-direction:column;gap:var(--p-s3);min-width:0}
.sp-sec{background:var(--p-white);border:1px solid var(--p-line);border-radius:var(--p-r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sp-sec-h{font:800 var(--p-fs-xs)/1.2 var(--p-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp-row{display:flex;align-items:center;gap:var(--p-s2);flex-wrap:wrap}
.sp-lbl{font:800 var(--p-fs-xs)/1.2 var(--p-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-2)}
.sp-seg{display:flex;gap:6px;flex-wrap:wrap}
.sp-seg .p-tab{min-width:96px;justify-content:center}
.sp-btns{display:flex;gap:var(--p-s2);flex-wrap:wrap;align-items:center}
.type-select{width:auto;min-width:220px;max-width:100%;flex:0 1 auto}
.type-select.empty{border-color:var(--p-black);background:var(--p-yellow-lt)}
.type-select.saving,.sp-saving{opacity:.5;pointer-events:none}
.prev-btn-wrap{display:flex;align-items:center;gap:var(--p-s2);flex-wrap:wrap}
.prev-btn-wrap select{width:auto;max-width:100%}
.link-row{display:flex;gap:var(--p-s2);align-items:center}
.link-input{flex:1;min-width:0}
.master-folder-banner{border-radius:var(--p-r);padding:10px 12px;background:var(--p-cream);border-left:4px solid var(--p-black);align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mfb-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.mfb-chip{font:800 var(--p-fs-s)/1.2 var(--p-sans);letter-spacing:.04em}
.mfb-sub{font-size:var(--p-fs-s);color:var(--p-ink-2);line-height:1.3}
.inotes{width:100%;min-height:88px;resize:vertical}
.inotes.saving{border-color:var(--p-ink-3)}
.inotes.saved{border-color:var(--p-black);box-shadow:0 0 0 3px var(--p-cream)}
.inotes.is-bad{border-color:var(--p-alert)}
/* the one yellow button, kept in view at the bottom of the open job */
.sp-done{position:sticky;bottom:12px;z-index:3;display:flex;gap:var(--p-s3);align-items:center;flex-wrap:wrap;background:var(--p-white);
  border:2px solid var(--p-black);border-radius:var(--p-r-lg);padding:12px 14px;box-shadow:0 6px 22px rgba(20,20,18,.16)}
.p-split-detail{padding-bottom:0}
.p-split-detail>.p-lc{margin-bottom:var(--p-s4)}
.p-split-detail .sp-done{bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.sp-done .p-btn-lg{flex:0 0 auto}
.sp-done-txt{flex:1;min-width:160px;font-size:var(--p-fs-s);color:var(--p-ink-2)}
.sp-done-txt b{color:var(--p-black)}
.sp-cost{display:flex;align-items:center;gap:6px}
.sp-cost .p-input{width:120px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sp-cost.saving .p-input{border-color:var(--p-ink-3)}
.sp-cost.saved .p-input{border-color:var(--p-black);box-shadow:0 0 0 3px var(--p-cream)}
.supa-cost-input::-webkit-outer-spin-button,.supa-cost-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.supa-cost-input{-moz-appearance:textfield}
/* inks */
.bases-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bases-row-lbl{font-size:var(--p-fs-s);color:var(--p-ink-2);margin-right:4px}
.base-chip{display:inline-flex;align-items:center;gap:8px;min-height:var(--p-tap);padding:0 14px;border-radius:var(--p-pill);border:2px solid var(--p-black);background:var(--p-white);
  color:var(--p-black);font:700 var(--p-fs-s)/1 var(--p-sans);cursor:pointer;white-space:nowrap}
.base-chip:hover{background:var(--p-cream)}
.base-chip.added{background:var(--p-black);color:var(--p-yellow)}
.base-chip.added::before{content:"\2713"}
.base-chip.added:hover{background:var(--p-alert-lt);border-color:var(--p-alert);color:var(--p-alert)}
.base-chip.added:hover::before{content:"\2715"}
.base-chip:disabled,.base-chip.disabled{opacity:.38;cursor:not-allowed;pointer-events:none}
.base-chip-swatch{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:1px solid var(--p-line-strong)}
.slot-meta{font:800 var(--p-fs-xs)/1.2 var(--p-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-2);display:flex;align-items:center;gap:8px;padding-top:4px}
.slot-meta-count{color:var(--p-black)}
.slot-meta-paid{color:var(--p-ink-2)}
.slot-max{color:var(--p-black);background:var(--p-yellow);padding:2px 6px;border-radius:3px}
.ink-chip-empty{background:repeating-linear-gradient(135deg,var(--p-white) 0 5px,var(--p-cream-lt) 5px 10px);border:1.5px dashed var(--p-line-strong)}
.ink-chip-tba{background:var(--p-white);border:2px dashed var(--p-black)}
.ink-row.preview-chip{background:var(--p-yellow-lt)}
.ink-row.preview-chip .ink-name::after{content:" \2014  not saved";color:var(--p-ink-2);font-weight:700;text-transform:none}
.preview-tag{margin-left:4px}
.slot-placeholder{display:flex;align-items:center;gap:10px;min-height:38px;padding:2px 0 2px 30px;border-top:1px solid var(--p-line);color:var(--p-ink-2);cursor:pointer}
.p-job-inklist>:first-child{border-top:0}
.p-job-inklist>.inks-loading-sm{padding:8px 12px}
.slot-placeholder:hover{background:var(--p-cream-lt);color:var(--p-black)}
.slot-placeholder-chip{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--p-line-strong);flex-shrink:0;display:grid;place-items:center;font:800 var(--p-fs-xs)/1 var(--p-sans);color:var(--p-ink-2)}
.slot-placeholder-lbl{font:700 var(--p-fs-s)/1.2 var(--p-sans);text-transform:uppercase;letter-spacing:.02em}

<script>
// ─── INK MANAGEMENT WRITES ───────────────────────────────────────────────
// v21 (5/4/26): FLIPPED TO TRUE — first app going live as part of
// one-app-at-a-time production rollout before re-wiring shell.
// When false:  UI works, but addInkById / removeInkFromImprint / createNewInk
//              all no-op at the network layer and surface an inline notice.
// When true:   all three PATCH/POST directly to Airtable, same as the existing
//              sep'd / burned / drag-reorder writes that have been live all along.
// Unrelated writes (sep link save, sep'd/burned checkboxes, drag-to-reorder)
// are NOT gated by this flag — those shipped in v9 and have been working fine.
var INK_WRITES_ENABLED = true;

/* v21 (5/4/26): FLIPPED TO TRUE — first app going live for staged rollout.
   WRITES_ENABLED gates ALL Airtable writes (sep link, sep'd toggle, separator
   assign, notes, ink reorder). INK_WRITES_ENABLED above is independent and
   was also flipped on. To revert: set BOTH to false and bump to v22. */
var WRITES_ENABLED = true;

// v35: PRACTICE MODE (?practice=1). Every Airtable write (PATCH / POST / DELETE, from any code path) is answered
// right here with a fake success and never leaves the browser. Reads still come from Airtable, so the queue is
// real. Fake new records get a preview-* id, which every PATCH body already strips (see addInkById).
// SAVING counts writes in flight (live and practice) for the Refresh / practice switch / self-update guards.
var PRACTICE = /[?&]practice=1(&|$)/.test(location.search);
var SAVING = 0;
(function() {
  var realFetch = window.fetch.bind(window);
  window.fetch = function(url, opts) {
    var m = String((opts && opts.method) || 'GET').toUpperCase();
    if (m === 'GET' || String(url).indexOf('api.airtable.com') < 0) return realFetch(url, opts);
    SAVING++;
    var p = PRACTICE ? fakeWrite(url, m, opts) : realFetch(url, opts);
    return p.finally(function() { SAVING = Math.max(0, SAVING - 1); });
  };
  function fakeWrite(url, m, opts) {
    var body = {};
    try { body = JSON.parse((opts && opts.body) || '{}'); } catch (e) {}
    var out = body.records
      ? { records: body.records.map(function(r) { return { id: r.id || ('preview-practice-' + Date.now()), fields: r.fields || {} }; }) }
      : { id: 'preview-practice-' + Date.now() + '-' + Math.floor(Math.random() * 1e6), createdTime: new Date().toISOString(), fields: body.fields || {} };
    console.log('[seps practice] NOT sent:', m, url, opts && opts.body);
    return new Promise(function(res) {
      setTimeout(function() { res(new Response(JSON.stringify(out), { status: 200, headers: { 'Content-Type': 'application/json' } })); }, 150);
    });
  }
})();
// v35: success toasts say plainly when nothing was saved.
function savedMsg(m) { return PRACTICE ? m + ' · practice, not saved' : m; }

var BASE = 'appJkaLk8DykjsgHR';

};

// Pulled via Airtable:get_table_schema 5/4/26. If options change, update this
// list. The dropdown in the detail banner uses these to let the sep CORRECT

// Grouped by color in the schema (greenBright = screen-print bases,
// blueBright = Supacolor, yellowLight1 = embroidery/patch/label,

var IMPRINT_TYPE_CHOICES = [
  'Discharge', 'No Base W/B', 'Bleed Blocker + W/B', 'EZP Base + W/B', 'Flatstock',
  'Supacolor - Wearable', 'Supacolor - 1C Wearable', 'Supacolor - Blocker',

];

// most often. Record IDs are hardcoded (verified 4/30/26 via MCP search on
// Inks table tblyPBucKoDwxDisT). If any of these change, update here.
// Pantone Number value → Inks record ID.
var BASE_INK_IDS = {

// creates it. It's linked to the imprint just like any other ink. Its
// Pantone Number starts as "TBA M/D" (e.g. "TBA 4/30"). Ink Queue (v67+)
// edits this same record in place — operator updates Pantone Number to the
// real value (e.g. "301") and PATCHes; record identity is preserved.
//
// This means: no add/delete churn between sep stage and ink-queue stage.
// One Inks record per slot, born blank, fills in over time, lives for the
// life of the imprint.
//
// sessionTbaLabel caches the date string ("TBA 4/30") for visual consistency
// across all TBA slots created in the same session — every slot still gets
// its OWN unique Inks record (Airtable link fields dedupe on record ID, so
// reusing one record across multiple slots silently fails).
var sessionTbaLabel = null;

var SKIP_TYPES = new Set([
  'Embroidery','Patch Application','Hem Label Application','Woven Label Application',
  'Patch/Label ONLY','Finishing - Fold & Bag','Finishing - UPC sticker',
  'Finishing - Bandana Hanger','Hem Label','Woven Label'
]);

function isSupaType(t) { return t && (t.indexOf('Supacolor') === 0 || t.indexOf('Decopress') === 0); }

var ACTIVE_STATUSES = new Set([
  'Pre-press','Ordered - In Production','Received & Staged',
  'Scheduled, Screened, & Inbound','On-Press',
  'Delayed - Mis-Print','Delayed - Mis-Shipment - Needs Order',
  'Delayed - Mis-Print - Needs Order'
]);

var ALL = [], state = {}, role = 'art', activeFilter = 'all'; /* LOCKED: Art Dept */
var PROOF_URLS = {};
var prevImprintCache = {};



// v35: start-up moved to boot() at the end of the script (after every var is set).
// v17: token entry. v35: lives in the ⚙ menu (was a full-page box). The key is shared with every Pine app.
function saveTokenAndLoad() {
  var input = document.getElementById('tokenInput');
  var err = document.getElementById('tokenError');
  var val = (input && input.value || '').trim();
  if (!val) {
    if (err) { err.textContent = 'Paste your token first.'; err.classList.add('is-bad'); err.hidden = false; }
    return;
  }
  // Soft format check — Airtable PATs start with "pat". Don't block, just warn.
  if (val.indexOf('pat') !== 0 && err) {
    err.textContent = "Doesn't look like an Airtable token (they start with \"pat\") \u2014 saved anyway.";
    err.classList.add('is-bad'); err.hidden = false;
  } else if (err) {
    err.hidden = true;
  }
  try { localStorage.setItem('pine_at_key', val); } catch (e) {}
  showMenu(false, true);
  loadData();
}
function token() { try { return localStorage.getItem('pine_at_key') || ''; } catch (e) { return ''; } }

// v12: keep the open autocomplete dropdown glued to its input on scroll/resize.
(function() {
  function reposition() {
    document.querySelectorAll('.add-ink-results.open').forEach(function(el) {
      var id = el.id.replace(/^ai-ac-/, '');
      if (id) positionAcResults(id);
    });
  }
  window.addEventListener('resize', reposition);
  window.addEventListener('scroll', reposition, true);
})();

function loadData() {
  var token = localStorage.getItem('pine_at_key');
  if (!token) { noTokenMsg(); return; }
  document.getElementById('root').classList.remove('is-split');
  document.getElementById('root').innerHTML = '<div class="msg"><b><span class="spin"></span>Loading queue\u2026</b></div>';

  // v30 BUGFIX: Refresh rebuilt ALL but left inkChipCache/prevImprintCache
  // holding pre-refresh data keyed by imprint id. A card cached as {} before
  // its inks were linked stayed cached as {} across every Refresh, which is
  // what made ink rows print record IDs on new orders. Clear them here.
  inkChipCache = {};
  inkFetchSeq = {};
  prevImprintCache = {};

  fetchAll(token).then(function(recs) {
    ALL = parseRecords(recs);
    state = {};
    ALL.forEach(function(r) {
      state[r.id] = { sp:r.sp, b:r.b, sepsUrl:r.sepsUrl, sep:r.sep, cov:r.cov, pn:r.pn, supaCost:r.supaCost, seeded:null, chosenPrev:null, sepdAt:r.sepdAt };
      if (r.largeUrl) PROOF_URLS[r.id] = r.largeUrl;
    });
    document.getElementById('filters').hidden = false;

    updateStats();
    render();
    LIVE.loaded = Date.now(); liveSchedule();   // v50: keep the Drive folders on screen current
  }).catch(function(err) {
    document.getElementById('root').innerHTML = '<div class="msg err"><b>Couldn\u2019t load from Airtable</b>' + esc(err.message) +
      (/auth|permission|invalid|token|401|403/i.test(err.message) ? ' \u2014 check the token in the \u2699 menu.' : '') + '</div>';
    console.error(err);
  });
}

// v50: the query params for the queue (and, with a RECORD_ID() formula, for one job)
function imprintParams(formula) {
  var params = new URLSearchParams();
  params.set('filterByFormula', formula);
  params.set('pageSize', '100');
  params.set('returnFieldsByFieldId', 'true');
  Object.values(F).forEach(function(fid) { params.append('fields[]', fid); });
  params.append('fields[]', 'fldNROVFSsBwLUOYW');
  return params;
}
function fetchAll(token) {
  // Tight date window: scheduled start in past 14 days OR next 60 days
  // Status + type filtering done client-side in parseRecords
  // Note: filterByFormula on lookup fields is unreliable per reference doc
  var past = new Date(); past.setDate(past.getDate() - 14);
  var fut  = new Date(); fut.setDate(fut.getDate() + 60);
  var pastStr = past.toISOString().slice(0,10);
  var futStr  = fut.toISOString().slice(0,10);
  var fid = 'fldfqtIgcEfIlIeQk';
  var formula = 'OR(' +
    'AND(IS_AFTER({' + fid + '},"' + pastStr + '"),IS_BEFORE({' + fid + '},"' + futStr + '")),' +
    'IS_AFTER(CREATED_TIME(),"' + pastStr + '")' +
  ')';
  var params = new URLSearchParams();
  params.set('filterByFormula', formula);
  params.set('pageSize', '100');
  params.set('returnFieldsByFieldId', 'true');
  // Request only the fields we use — reduces payload size significantly
  Object.values(F).forEach(function(fid) { params.append('fields[]', fid); });
  // Also need Order Status Lookup for status filtering (scanned by parseRecords)
  params.append('fields[]', 'fldNROVFSsBwLUOYW');

  var all = [];
  function page(offset) {
    var url = 'https://api.airtable.com/v0/' + BASE + '/' + TBL + '?' + params + (offset ? '&offset=' + encodeURIComponent(offset) : '');
    return fetch(url, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' })   // v50
      .then(function(res) {
        if (!res.ok) return res.json().then(function(e) { throw new Error((e.error && e.error.message) || 'API error ' + res.status); });
        return res.json();
      })
      .then(function(d) {
        all = all.concat(d.records || []);
        if (d.offset) return page(d.offset);
        return all;
      });
  }
  return page(null);
}

function flatLookup(val) {
  if (!val) return [];
  if (Array.isArray(val)) return val;
  if (val.valuesByLinkedRecordId) {
    return Object.values(val.valuesByLinkedRecordId).reduce(function(a,b){ return a.concat(b); }, []);
  }
  return [val];
}

function parseRecords(records) {
  var out = [];
  records.forEach(function(r) {
    var f = r.fields || {};
    var iid = f[F.imprintId] || '';
    if (!iid || iid.indexOf('-') < 0) return;
    var orderNum = parseInt(iid.split('-')[0], 10);
    if (!isNaN(orderNum) && orderNum < 9400) return;
    var typeRaw = f[F.impType]; var typeName = typeRaw ? (typeof typeRaw === 'object' ? (typeRaw.name || '') : String(typeRaw)) : '';
    if (SKIP_TYPES.has(typeName)) return;

    var statusOk = false;
    Object.values(f).forEach(function(v) {
      flatLookup(v).forEach(function(s) { if (ACTIVE_STATUSES.has(s)) statusOk = true; });
    });
    if (!statusOk) return;

    var proofs = flatLookup(f[F.proof]);
    if (!proofs.length) return;
    var fp = proofs[0];
    var thumbUrl = '', largeUrl = '';
    if (fp && typeof fp === 'object' && fp.thumbnails) {
      thumbUrl = (fp.thumbnails.large && fp.thumbnails.large.url) || (fp.thumbnails.small && fp.thumbnails.small.url) || '';
      largeUrl = (fp.thumbnails.full && fp.thumbnails.full.url) || thumbUrl;  // v36: full size for the big proof
    } else if (typeof fp === 'string' && fp.indexOf('http') === 0) {
      thumbUrl = fp; largeUrl = fp;
    }
    if (!thumbUrl) return;

    var cust = f[F.customer];
    if (Array.isArray(cust)) cust = cust[0] || '';
    cust = cust || '';

    out.push({
      id: r.id,
      i: iid,
      o: iid.split('-')[0],
      n: f[F.printDesc] || '',
      t: typeName,
      s: f[F.screens] || null,
      sp: f[F.seped] === true,
      sepdAt: doneYmd(f[F.sepdAt]), // v33
      b:  f[F.burned] === true,
      rp: f[F.repeat] === true,
      // v16: capture ALL linked previous imprints (sales can link multiple).
      // prevImprintIds[] drives multi-prev seeding + dropdown.
      // prevImprintId kept as [0] alias for legacy call sites (View Previous btn).
      prevImprintIds: flatLookup(f[F.prevImprint]).map(function(v){ return typeof v === 'string' ? v : (v && v.id) || ''; }).filter(Boolean),
      prevImprintId: (f[F.prevImprint]||[])[0] ? ((f[F.prevImprint][0].id)||f[F.prevImprint][0]) : null,
      loc: (function(v){ if (!v) return ''; return typeof v === 'object' ? (v.name || '') : String(v); })(f[F.location]),
      press: (function(v){ v = Array.isArray(v) ? v[0] : v; if (!v) return ''; return typeof v === 'object' ? (v.name || '') : String(v); })(f[F.press]), // v41
      c: cust,
      pn: f[F.printNotes] || '',
      sepsUrl: f[F.sepUrl] || '',
      sep: f[F.separator] || '',
      cov: (function(v){ if (!v) return ''; return typeof v === 'object' ? (v.name || '') : String(v); })(f[F.coverage]), // v34
      bandana: !!f[F.bandana], // v34: coverage picker shows on bandanas only
      due: (f[F.schedStart] || '').slice(0,10),
      qty: f[F.impressions] || null,
      thumbUrl: thumbUrl, largeUrl: largeUrl,
      proofName: (fp && typeof fp === 'object' && fp.filename) || '',   // v42: the mockup footer shows it
      supa: isSupaType(typeName),
      // v24: Existing supa cost from Airtable, if any. Used to seed the inline
      // cost input. parseFloat-friendly (Airtable returns currency as a plain
      // number via v0 REST). null when never set.
      supaCost: (typeof f[F.supaCost] === 'number') ? f[F.supaCost] : null,
      inks: f[F.inkNames] || '',
      inkIds: flatLookup(f[F.inks]).map(function(v){ return typeof v === 'string' ? v : (v && v.id) || ''; }).filter(Boolean),
      // v32: snapshot of the inks Airtable actually holds. inkIds above gets
      // mutated by previous-imprint seeding; this does not, so the Sep'd check
      // can tell "seeded on screen only" from "saved".
      origInkIds: flatLookup(f[F.inks]).map(function(v){ return typeof v === 'string' ? v : (v && v.id) || ''; }).filter(Boolean),
      // v29: this imprint's OWN master folder/id (set if it's a stamped family
      // member or the promoted root). Empty on a fresh, not-yet-stamped reorder —
      // that case sources the folder from the previous imprint instead.
      masterFolder: flatLookup(f[F.masterFolder])[0] || '',
      masterId: flatLookup(f[F.masterId])[0] || '',
    });
  });

  var dated   = out.filter(function(x){return x.due;}).sort(function(a,b){return a.due.localeCompare(b.due)||a.i.localeCompare(b.i);});
  var undated = out.filter(function(x){return !x.due;}).sort(function(a,b){return b.o.localeCompare(a.o)||a.i.localeCompare(b.i);});
  return dated.concat(undated);
}

var DONE_TAB = 'sepd'; // v33
// ---- RECENTLY-DONE TAB (shared rule) ----
// A job stays on the done tab the day it's checked plus the next workday,
// then drops off. Implemented as: done date >= previous workday (local time).
//   checked Mon -> shows Mon + Tue.  checked Fri -> shows Fri + Mon.
// The date comes from Airtable's lastModifiedTime field on the checkbox, so
// the app writes nothing new; on check/uncheck we mirror it locally so the
// tab is right without a reload.
function ymdLocal(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayYmd() { return ymdLocal(new Date()); }
function prevWorkdayYmd() {
  var d = new Date();
  do { d.setDate(d.getDate() - 1); } while (d.getDay() === 0 || d.getDay() === 6);
  return ymdLocal(d);
}
// Accepts a date-only 'YYYY-MM-DD' or a full ISO timestamp (converted to local date).
function doneYmd(v) {
  if (!v || typeof v !== 'string') return '';
  if (v.length <= 10) return v;
  var d = new Date(v);
  return isNaN(d.getTime()) ? '' : ymdLocal(d);
}
function isRecentDone(ymd) { return !!ymd && ymd >= prevWorkdayYmd(); }
// After an uncheck on the done tab, let the checkbox flip visibly, then

function applyFilters(records, ignoreBandana) {
  var q = (document.getElementById('search').value || '').trim();

function groupByDate(records) {
  var map = {}, order = [];
  records.forEach(function(r) {
    var key = r.due || 'undated';
    if (!map[key]) { map[key] = []; order.push(key); }
    map[key].push(r);
  });
  return order.map(function(d) { return { date: d, records: map[d] }; });
}

function groupByOrder(records) {
  var map = {}, order = [];
  records.forEach(function(r) {
    if (!map[r.o]) { map[r.o] = []; order.push(r.o); }
    map[r.o].push(r);
  });
  return order.map(function(o) { return { orderNum: o, imprints: map[o] }; });

function calYMD(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function renderCalendar(records) {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var todayKey = calYMD(today);
  var dow = today.getDay();
  var monday = new Date(today);
  monday.setDate(today.getDate() + (dow === 0 ? -6 : 1 - dow));
  var weeks = Math.max(1, Math.round(calSpan / 7));
  var dowLbl = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
  var cols = [];
  var visible = {};
  for (var w = 0; w < weeks; w++) {
    for (var i = 0; i < 5; i++) {
      var d = new Date(monday);
      d.setDate(monday.getDate() + w * 7 + i);
      var key = calYMD(d);
      visible[key] = true;
      cols.push({ wk: w, key: key, dow: dowLbl[i], dnum: d.getDate(), today: key === todayKey });
    }
  }
  var byDay = {}; var outside = [];
  records.forEach(function(r) {
    if (r.due && visible[r.due]) { (byDay[r.due] = byDay[r.due] || []).push(r); }
    else { outside.push(r); }
  });
  var maxCt = 1;
  cols.forEach(function(c) { var n = (byDay[c.key] || []).length; if (n > maxCt) maxCt = n; });

  var html = '<div class="cal-wrap">';
  for (var ww = 0; ww < weeks; ww++) {
    html += '<div class="cal-week">';
    cols.filter(function(c) { return c.wk === ww; }).forEach(function(c) {
      var recs = byDay[c.key] || [];
      var pct = recs.length ? Math.max(10, Math.round(recs.length / maxCt * 100)) : 0;
      html += '<div class="cal-col' + (c.today ? ' today' : '') + '">' +
        '<div class="cal-dh"><span class="cal-dow">' + (c.today ? 'Today \u00b7 ' : '') + c.dow + '</span><span class="cal-dnum">' + c.dnum + '</span></div>' +
        '<div class="cal-load"><i style="width:' + pct + '%"></i></div>' +
        '<div class="cal-cnt">' + recs.length + ' imprint' + (recs.length !== 1 ? 's' : '') + '</div>' +
        (recs.length ? recs.map(buildCalCard).join('') : '<div class="cal-empty">&mdash;</div>') +
        '</div>';
    });

  html += '</div>';
  if (outside.length) {

function jumpToJob(id) {

function fmtDate(d) {
  try { return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); } catch(e){ return d; }
}
// v35 BUGFIX: compared noon on the print date with midnight today, so today came out as 0.5 days and
// Math.round made it 1 -> "Tomorrow" (the audit's "today is called Tomorrow"). Compare midnight with midnight.
function daysDiff(d) {
  if (!d) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  var x = new Date(d + 'T00:00:00'); if (isNaN(x.getTime())) return null;
  return Math.round((x - t) / 864e5);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

// v41: the shared day head (pine-job-v1.css): ▾ fold · date box · ONE timing tag · round count. Days start open; a fold
// is remembered for the session. The open job's day is always open, and a search opens every day.
var DAY_FOLD = {};
try { DAY_FOLD = JSON.parse(sessionStorage.getItem('pine_seps_folds') || '{}') || {}; } catch (e) {}
function workDaysUntil(d) {
  var t = new Date(); t.setHours(0,0,0,0);
  var x = new Date(d + 'T00:00:00'); if (isNaN(x.getTime()) || x <= t) return 0;
  var n = 0; while (t < x) { t.setDate(t.getDate() + 1); if (t.getDay() !== 0 && t.getDay() !== 6) n++; }
  return n;
}
// One timing tag: red "2 days late" (soft "2 days ago" on the done tab), "Today", "Tomorrow", "in 3 work days".
function whenTag(date, doneTab) {
  if (!date || date === 'undated') return '';
  var days = daysDiff(date); if (days === null) return '';
  if (days < 0) return '<span class="p-tag ' + (doneTab ? 'p-tag-soft' : 'p-tag-alert') + ' p-job-when">' + plural(-days, 'day') + (doneTab ? ' ago' : ' late') + '</span>';
  var soft = doneTab ? 'p-tag-soft' : 'p-tag-wait';
  if (days === 0) return '<span class="p-tag ' + soft + ' p-job-when">Today</span>';
  if (days === 1) return '<span class="p-tag ' + soft + ' p-job-when">Tomorrow</span>';
  var wd = workDaysUntil(date);
  return '<span class="p-tag ' + (wd <= 3 && !doneTab ? 'p-tag-wait' : 'p-tag-soft') + ' p-job-when" title="Prints in ' + plural(wd, 'work day') + '">in ' + wd + '<span class="p-job-wd"> work</span> day' + (wd === 1 ? '' : 's') + '</span>';
}
function buildDateGroup(dg, mode) {
  var key = dg.date, n = dg.records.length;
  var holds = !!openId && dg.records.some(function(r) { return r.id === openId; });
  var closed = !!DAY_FOLD[key] && !holds && !(document.getElementById('search').value || '').trim();
  var lbl = key === 'undated' ? 'No print date' : fmtDate(key);
  var html = '<section class="p-job-dayg' + (closed ? ' is-closed' : '') + '" id="dg-' + key + '">' +
    '<div class="p-job-day" onclick="toggleDay(\'' + key + '\')"><button type="button" class="p-job-fold" aria-expanded="' + !closed + '" aria-label="Show or hide ' + esc(lbl) + '" onclick="event.stopPropagation();toggleDay(\'' + key + '\')">&#9662;</button>' +
    '<span class="p-job-date">' + esc(lbl) + '</span>' + whenTag(key, activeFilter === 'sepd') +
    '<span class="p-job-n" title="' + plural(n, 'imprint') + '">' + n + '</span></div><div class="p-job-dayb">';
  groupByOrder(dg.records).forEach(function(og) { html += buildOrderGroup(og, mode); });
  return html + '</div></section>';
}
function toggleDay(key) {
  var el = document.getElementById('dg-' + key); if (!el) return;
  var closed = !el.classList.contains('is-closed');
  el.classList.toggle('is-closed', closed);
  var b = el.querySelector('.p-job-fold'); if (b) b.setAttribute('aria-expanded', String(!closed));
  if (closed) DAY_FOLD[key] = 1; else delete DAY_FOLD[key];
  try { sessionStorage.setItem('pine_seps_folds', JSON.stringify(DAY_FOLD)); } catch (e) {}
}

// v41: the order line is CUSTOMER · #order (the cards say how many imprints).
function buildOrderGroup(og, mode) {
  var cust = og.imprints[0].c || 'No customer';
  return '<div class="p-job-order"><b class="p-job-cust" title="' + esc(cust) + '">' + esc(cust) + '</b><span class="p-job-ordno">#' + esc(og.orderNum) + '</span></div>' +
    og.imprints.map(function(r) { return cardHtml(r, mode); }).join('');
}

function h(tag, attrs, inner) {
  var a = '';
  for (var k in attrs) {
    if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) {
      a += ' ' + k + '="' + String(attrs[k]).replace(/"/g, '&quot;') + '"';
    }
  }
  return '<' + tag + a + '>' + (inner || '') + '</' + tag + '>';
}
function hv(tag, attrs) {
  var a = '';
  for (var k in attrs) a += ' ' + k + '="' + String(attrs[k] || '').replace(/"/g, '&quot;') + '"';
  return '<' + tag + a + '>';
}

// Fetch just the name for the View Previous button label (lightweight — skips inks)
function loadPrevLabel(currentId, prevRecId) {
  var labelEl = document.getElementById('prev-label-' + currentId);
  if (!labelEl) return;
  // Already have it cached?
  if (prevImprintCache[prevRecId] && prevImprintCache[prevRecId].name) {
    labelEl.textContent = prevImprintCache[prevRecId].name;
    return;
  }
  var token = localStorage.getItem('pine_at_key');
  if (!token) return;
  // v13: no fields[]= filter — was causing 422s when any listed field couldn't
  // resolve on the target record. Fetch whole record, pluck client-side.
  var url = 'https://api.airtable.com/v0/' + BASE + '/' + TBL + '/' + prevRecId +
    '?returnFieldsByFieldId=true';
  fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      var fields = data.fields || {};
      var name = fields['fldDFfwFQ9B20n2kT'];
      if (!name) {
        console.warn('[seps] loadPrevLabel: Imprint ID empty for', prevRecId, '\u2014 response:', data);
        name = 'Previous run';
      }
      if (!prevImprintCache[prevRecId]) prevImprintCache[prevRecId] = {};
      prevImprintCache[prevRecId].name = name;
      labelEl.textContent = name;
    })
    .catch(function(err) {
      console.warn('[seps] loadPrevLabel fetch failed for', prevRecId, err);
      labelEl.textContent = 'Previous run';
    });
}

// v24: Sep'd / Burned checkbox toggle handler.
//
// SUPA BRANCH (added v24)
// ----------------------------------------------------------------------------
// When r.supa is true (Supacolor or Decopress imprint), clicking the
// "Order placed" checkbox does THREE things in a single PATCH:
//   1. Sep'd       = true   (fldlMcHtldbifKzDN)
//   2. Screens Burned = true (fldEL51Nwrxuyn9Zo) — no screens to burn on
//      outsourced transfers, so this bypasses the entire screen-room stage.
//   3. Supacolor / Decopress Cost = <from inline input> (fldKlwI0dAOkm8NqN)
//
// Three things cascade off this write FOR FREE:
//   - Screens Burned Timestamp (fldGE6YUG5NWIqq1g, lastModifiedTime) auto-fills
//     because the Burned checkbox changed.
//   - Supacolor / Decopress Ordered Date (fldCqoVV6CaX1GzzT, lastModifiedTime)
//     auto-fills because the cost field changed.
//   - Supacolor / Decopress Cost w/ Shipping (fldTC20GU7fRBQWuB, formula)
//     recomputes downstream.
// We don't write any of those manually.
//
// GATING: cost input must be > 0 before Order placed will accept the click.
// Empty / 0 cost → toast "Enter a cost first" and bail out.
//
// UN-CHECK PATH: if a sep un-clicks Order placed (mistake), all three fields
// are reverted: {seped:false, burned:false, supaCost:null}. Matches the
// "Resolution override clears cleanly" pattern from catching v116.
//
// COST EDITS: handled separately by onSupaCostBlur — a single-field PATCH
// that runs on blur or Enter, debounced via DOM state (no rapid keystroke spam).
// Cost stays editable even after Order placed is checked.
// v35: the button now waits for Airtable. While a save runs the job shows "Saving…" and further taps are ignored
// (no double-tap flip-back). Only when the save succeeds does the job leave the queue; a failed save puts the job
// back the way it was (v34 removed the card even when Airtable said no). Payloads are unchanged from v34.
function toggleCheck(id, which, e) {
  if (e) e.preventDefault();
  if (DONE_BUSY[id]) return;  // v35: double-tap guard
  if (!state[id]) state[id] = { sp:false, b:false, sepsUrl:'', sep:'', cov:'', supaCost:null };
  var s = state[id];
  var rec = recById(id);
  var isSupa = !!(rec && rec.supa);
  var prev = { sp: s.sp, b: s.b, supaCost: s.supaCost, sepdAt: s.sepdAt };
  var recPrev = rec ? { sepsUrl: rec.sepsUrl, origInkIds: (rec.origInkIds || []).slice(), pn: rec.pn, statePn: s.pn } : null;

  // v24: SUPA BRANCH — only fires when sep'd is being CHECKED (not un-checked).
  if (which === 'sep' && isSupa && !s.sp) {
    var inp = document.getElementById('sci-' + id);
    var costRaw = inp ? inp.value : '';
    var costNum = parseFloat(costRaw);
    if (!(costNum > 0)) {
      showToast('Enter the cost first', true);
      if (inp) inp.focus();
      return;
    }
    // Single PATCH — all three fields in one request.
    var fields = {};
    fields[F.seped] = true;
    fields[F.burned] = true;
    fields[F.supaCost] = costNum;
    addUnsavedSeeds(id, fields); // v32: also persists seeded URL/inks + notes
    s.sp = true; s.b = true; s.supaCost = costNum; s.sepdAt = todayYmd(); // v33
    commitDone(id, savePatchMulti(id, fields, 'supa-order-placed'), prev, recPrev, true);
    return;
  }

  // v24: SUPA UN-CHECK BRANCH — revert all three fields in one PATCH.
  if (which === 'sep' && isSupa && s.sp) {
    var ufields = {};
    ufields[F.seped] = false;
    ufields[F.burned] = false;
    ufields[F.supaCost] = null;
    s.sp = false; s.b = false; s.supaCost = null; s.sepdAt = ''; // v33
    commitDone(id, savePatchMulti(id, ufields, 'supa-un-check'), prev, recPrev, false);
    return;
  }

  // ── NORMAL (non-supa) PATH ─────────────────────────
  var field = which === 'sep' ? 'sp' : 'b';
  s[field] = !s[field];
  if (field === 'sp') s.sepdAt = s.sp ? todayYmd() : ''; // v33
  var leaving = s[field] && ((role === 'art' && which === 'sep') || (role === 'screen' && which === 'burn'));
  // v32: checking Sep'd also saves any seeded Sep URL / Inks / Print Notes in the same PATCH (see addUnsavedSeeds).
  var p = null;
  if (which === 'sep' && s.sp) {
    var sepFields = {};
    sepFields[F.seped] = true;
    if (addUnsavedSeeds(id, sepFields)) p = savePatchMulti(id, sepFields, 'sep-check');
  }
  if (!p) p = savePatch(id, which === 'sep' ? F.seped : F.burned, s[field]);
  commitDone(id, p, prev, recPrev, leaving);
}

function commitDone(id, p, prev, recPrev, leaving) {
  DONE_BUSY[id] = true;
  paintDone(id); refreshHead(id);
  Promise.resolve(p).then(function(ok) {
    DONE_BUSY[id] = false;
    var s = state[id], rec = recById(id);
    if (!ok) {  // put it back: the job stays in the queue so it can be tried again
      s.sp = prev.sp; s.b = prev.b; s.supaCost = prev.supaCost; s.sepdAt = prev.sepdAt;
      if (rec && recPrev) { rec.sepsUrl = recPrev.sepsUrl; rec.origInkIds = recPrev.origInkIds; rec.pn = recPrev.pn; s.pn = recPrev.statePn; }
      paintDone(id); refreshHead(id); updateStats();
      return;
    }
    paintDone(id); refreshHead(id); updateStats();
    if (leaving || activeFilter === DONE_TAB) setTimeout(function() { leaveQueue(id); }, 700);  // v33: undo on the Sep'd tab sends it back to the queue
  });
}

// v24: Blur / Enter handler — fires the cost-only PATCH. Skipped if the value
// hasn't changed from what's in state[id].supaCost. Always editable, including
// after Order placed has been clicked (per the v24 spec).
function onSupaCostBlur(id) {
  var inp = document.getElementById('sci-' + id);
  var scf = document.getElementById('scf-' + id);
  if (!inp) return;
  var s = state[id]; if (!s) return;
  var raw = inp.value.trim();
  // Treat empty as null (clearing the cost).
  var newVal = raw === '' ? null : parseFloat(raw);
  if (newVal !== null && (isNaN(newVal) || newVal < 0)) {
    showToast('Invalid cost', true);
    inp.value = (typeof s.supaCost === 'number') ? String(s.supaCost) : '';
    if (scf) scf.classList.toggle('has-value', (typeof s.supaCost === 'number' && s.supaCost > 0));
    onSupaCostInput(id);   // v41: the "Enter the cost first" look follows the box
    return;
  }
  // No-op if unchanged
  var cur = (typeof s.supaCost === 'number') ? s.supaCost : null;
  if (newVal === cur) return;
  s.supaCost = newVal;
  if (scf) { scf.classList.remove('saved'); scf.classList.add('saving'); }
  savePatch(id, F.supaCost, newVal).then(function(ok) {
    if (!scf) return;
    scf.classList.remove('saving');
    if (!ok) { if (s.supaCost === newVal) s.supaCost = cur; return; }  // v35: a failed save no longer looks saved
    scf.classList.add('saved');
    setTimeout(function() { scf.classList.remove('saved'); }, 1200);
  });
}

// v24: Multi-field PATCH helper. savePatch only takes one field; this is the
// version for atomic multi-field writes (used by the supa branch above).
// Preserves the same WRITES_ENABLED gate + token check + toast pattern.
// `tag` is a short label for the toast and console — describes the operation.
/* v32 BUGFIX — seeded values never reached Airtable.
   Previous-imprint inheritance (v16+) fills Sep File URL, Inks and Print Notes
   ON SCREEN ONLY. The Sep'd check used to PATCH just the checkbox, so on repeat
   jobs the separator saw a linked file + inks, checked Sep'd, and the card left
   the queue with the URL/inks/notes still empty in Airtable (10827-A/B, 10884-A).
   This folds anything that differs from what was loaded into the same PATCH as
   the checkbox. Values the sep already saved explicitly just get re-sent
   unchanged, which is harmless. */
function addUnsavedSeeds(id, fields) {
  var rec = ALL.find(function(r) { return r.id === id; });
  var s = state[id];
  if (!rec || !s) return 0;
  var n = 0;
  if (s.sepsUrl && s.sepsUrl !== (rec.sepsUrl || '')) {
    fields[F.sepUrl] = s.sepsUrl; rec.sepsUrl = s.sepsUrl; n++;
  }
  if (INK_WRITES_ENABLED) {
    var cur = (rec.inkIds || []).filter(function(iid) { return iid.indexOf('preview-') !== 0; });
    var sig = function(a) { return a.slice().sort().join(','); };
    if (cur.length && sig(cur) !== sig(rec.origInkIds || [])) {
      fields[F.inks] = cur.slice(); rec.origInkIds = cur.slice(); n++;
    }
  }
  var ta = document.getElementById('notes-' + id);
  if (ta && ta.value !== (rec.pn || '')) {
    fields[F.printNotes] = ta.value; rec.pn = ta.value; s.pn = ta.value; n++;
  }
  if (n) console.log('[seps-v32 addUnsavedSeeds]', id, 'persisting', Object.keys(fields));
  return n;
}

// v35: resolves to true when Airtable saved it, false otherwise (callers put things back on false).
function savePatchMulti(id, fields, tag) {
  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No Airtable token — add it in the ⚙ menu', true); return Promise.resolve(false); }
  if (!WRITES_ENABLED) {
    showToast('Preview — writes off');
    return Promise.resolve(true);
  }
  var body = { records: [{ id: id, fields: fields }] };
  console.log('[seps-v24 savePatchMulti ' + tag + '] PATCH', JSON.stringify(body));
  return fetch('https://api.airtable.com/v0/' + BASE + '/' + TBL, {
    method: 'PATCH',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
    body: JSON.stringify(body)
  }).then(function(res) {
    return res.json().then(function(result) {
      if (res.ok) {
        var msg = tag === 'supa-order-placed' ? '✓ Order placed'
                : tag === 'supa-un-check'     ? 'Order placed undone'
                : tag === 'sep-check'         ? '✓ Sep’d — linked file, inks and notes saved too'
                : '✓ Saved';
        showToast(savedMsg(msg));
        return true;
      }
      console.error('[seps-v24 savePatchMulti ' + tag + '] FAIL', res.status, result);
      showToast('Not saved — ' + ((result && result.error && result.error.message) || 'Airtable error ' + res.status), true);
      return false;
    });
  }).catch(function(err) {
    console.error('[seps-v24 savePatchMulti ' + tag + '] EXCEPTION', err);
    showToast('Not saved — check the connection and try again', true);
    return false;
  });
}

// v22: Change Imprint Type from the detail-banner dropdown. PATCHes
// fldjNCuaGOkWgzH2K (singleSelect) on the imprint. Updates ALL.r.t in-place
// and toggles the .empty styling on the select. SKIP_TYPES handling: if the
// sep accidentally selects something in SKIP_TYPES (Embroidery, Patch
// Application, etc.), the next refresh will filter the imprint out of the
// queue entirely — that's intentional, those types don't need separation.
function changeImprintType(id, sel) {
  var val = sel.value || '';
  var rec = ALL.find(function(r) { return r.id === id; });
  if (!rec) { showToast('Record not found', true); return; }
  var prev = rec.t || '';
  if (val === prev) return;

  sel.classList.add('saving');
  sel.classList.toggle('empty', !val);

  if (!WRITES_ENABLED) {
    rec.t = val;
    rec.supa = isSupaType(val);
    sel.classList.remove('saving');
    showToast('Preview \u2014 writes off');
    return;
  }

  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No token', true); sel.classList.remove('saving'); return; }

  // singleSelect PATCH — Airtable accepts plain string for singleSelect by name
  var fields = {};
  fields[F.impType] = val || null;
  var __body = { records: [{ id: id, fields: fields }] };
  console.log('[seps-v22 changeImprintType] PATCH', JSON.stringify(__body));

  fetch('https://api.airtable.com/v0/' + BASE + '/' + TBL, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(__body)
  }).then(function(res) {
    return res.json().then(function(result) {
      if (!res.ok) {
        console.error('[seps-v22 changeImprintType] FAIL', res.status, result);
        // Roll back select to previous value
        sel.value = prev;
        sel.classList.toggle('empty', !prev);
        throw new Error((result.error && (result.error.type + ': ' + result.error.message)) || 'API ' + res.status);
      }
      rec.t = val;
      rec.supa = isSupaType(val);
      showToast(savedMsg('\u2713 Type: ' + (val || 'cleared')));
      refreshHead(id); paintDone(id); updateStats();  // v35: switching to/from Supacolor shows/hides the cost now
    });
  }).catch(function(err) {
    showToast('Type not saved \u2014 ' + err.message, true);
  }).finally(function() {
    sel.classList.remove('saving');
  });
}

// ---- v46: GOOGLE DRIVE (the sep file) ----------------------------------------------------------------------------
// Everything goes through the Pine worker with the Airtable token (same as Mockup / Line Item Review):
//   drive/search?order=11075 -> the order's folder · drive/list?folder=<id> -> its files · drive/thumb · drive/file.
// Lookups are only for the job that's open (and the picker / master banner), cached per order and per folder, at most
// three calls at a time. A 503 means Drive isn't connected: the app says so calmly and the paste box still works.
var PROXY = 'https://pine-workers.stephen-dab.workers.dev/proxy';

var THUMBS = {};         // file id -> Promise<object URL | null>

var MASTER_VAL = {};     // v50: master folder id -> the resolved { root, seps }

function isFolder(f) { return /folder$/.test((f && f.mimeType) || ''); }

}

}

    return r.json().catch(function() { return {}; }).then(function(j) {

function driveList(fid) {

// The Seps subfolder: Seps, Separations, Sep (any case), then a folder whose name starts with one of those.
function sepsSub(files) {

}

// ("EZP WHT", "1/2 BB"), bare numbers ("186", "186 C"), named colors ("Reflex Blue - Discharge", "Black 6 C") and
// "PMS 186" all fell through to a grey "?". Now: the ink's own Display Hex (same field Ink Queue v77 uses) wins,
// then the Pantone Number, then the name, each tried as-is, case-blind, without "Pantone/PMS", without a trailing
// " - type" and without a trailing C/U/CP/UP. TBA slots and unknown inks get a plain empty swatch, no "?".

// Chip color editor
var activeChipPopover = null;
function editChipColor(iid, chipEl) {
  // Close any existing popover
  if (activeChipPopover) { activeChipPopover.remove(); activeChipPopover = null; }

  var popover = document.createElement('div');
  popover.className = 'chip-popover';
  var currentColor = chipEl.style.backgroundColor || '';
  var currentHex = currentColor ? rgbToHex(currentColor) : '';

  popover.innerHTML =
    '<input class="chip-hex-input" id="chex-' + iid + '" placeholder="#a3b4c5" maxlength="7" value="' + currentHex + '">' +
    '<button class="chip-set-btn" onclick="applyChipColor(\'' + iid + '\');event.stopPropagation()">Set</button>' +
    '<span class="chip-pop-hint">This screen only \u2014 not saved</span>';

  // Position below chip
  var rect = chipEl.getBoundingClientRect();
  popover._chipEl = chipEl;
  document.body.appendChild(popover);
  // Position below chip, clamped to viewport
  var pw = popover.offsetWidth || 160;
  var leftPos = Math.min(rect.left, window.innerWidth - pw - 8);
  popover.style.cssText = 'position:fixed;top:' + (rect.bottom + 4) + 'px;left:' + Math.max(8, leftPos) + 'px;z-index:9999';
  activeChipPopover = popover;

  var inp = document.getElementById('chex-' + iid);
  if (inp) {
    inp.focus();
    inp.select();
    inp.onkeydown = function(e) {
      if (e.key === 'Enter') applyChipColor(iid);
      if (e.key === 'Escape') { popover.remove(); activeChipPopover = null; }
      e.stopPropagation();
    };
  }

  // Close on outside click — use mousedown instead of click to avoid
  // catching the same event that opened the popover
  setTimeout(function() {
    document.addEventListener('mousedown', function handler(e) {
      if (!popover.contains(e.target) && e.target !== chipEl) {
        popover.remove();
        activeChipPopover = null;
        document.removeEventListener('mousedown', handler);
      }
    });
  }, 100);
}

function applyChipColor(iid) {
  var inp = document.getElementById('chex-' + iid);
  if (!inp) {
    // Fallback: find input in active popover
    if (activeChipPopover) inp = activeChipPopover.querySelector('.chip-hex-input');
  }
  if (!inp) return;
  var hex = inp.value.trim();
  if (!hex.startsWith('#')) hex = '#' + hex;
  if (!/^#[0-9a-fA-F]{6}$/.test(hex)) {
    inp.style.borderColor = 'var(--p-alert)';
    inp.focus();
    return;
  }
  // Find chip — try by iid first, then by data stored on popover
  var chip = document.getElementById('chip-' + iid);
  if (!chip && activeChipPopover && activeChipPopover._chipEl) chip = activeChipPopover._chipEl;
  if (chip) {
    chip.style.background = hex;
    chip.classList.remove('ink-chip-empty', 'ink-chip-tba');
    chip.textContent = '';
  }
  if (activeChipPopover) { activeChipPopover.remove(); activeChipPopover = null; }
}

function rgbToHex(rgb) {
  var m = rgb.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if (!m) return '';
  return '#' + [m[1],m[2],m[3]].map(function(n) { return ('0'+parseInt(n).toString(16)).slice(-2); }).join('');
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
var inkChipCache = {};
// v30: per-imprint fetch sequence counter. Seeding (applyCherryPickedSeed) and
// the Populate-from dropdown can both fire loadInkChips while an earlier fetch
// is still in flight; without this a stale response overwrites the cache with
// the OLD ink set and every row falls back to a raw record ID.
var inkFetchSeq = {};

function loadInkChips(id) {
  var rowsEl = document.getElementById('inks-rows-' + id);
  if (!rowsEl) return;

  var rec = ALL.find(function(r) { return r.id === id; });
  if (!rec) return;

  // preview-* ids are local-only synthesized chips — they don't exist in
  // Airtable, so exclude them from the RECORD_ID() filter and the coverage test.
  var wantIds = (rec.inkIds || []).filter(function(iid) { return iid.indexOf('preview-') !== 0; });

  // --- v30 BUGFIX: "ink names render as recXXXXXXXXXXXXXX" -------------------
  // Old code was:  if (inkChipCache[id]) { renderInkChips(id, inkChipCache[id]); return; }
  // An EMPTY OBJECT IS TRUTHY. The no-inks branch below stamps
  // inkChipCache[id] = {} whenever a card is opened while it has no inks yet --
  // which is exactly a NEW ORDER (sales hasn't linked inks at the moment the
  // sep first peeks at the card). loadData() rebuilds ALL on every Refresh but
  // never clears inkChipCache, so once the inks DID get linked this early
  // return kept firing, renderInkChips received {}, and printed record IDs.
  // Fix: only trust the cache when it actually covers every ink on the record.
  var cached = inkChipCache[id];
  var cacheCovers = !!cached && wantIds.every(function(iid) { return !!cached[iid]; });
  if (cached && cacheCovers) { renderInkChips(id, cached); return; }

  if (!wantIds.length) {
    // v16: if this is a repeat with linked prev imprints, the orchestrator
    // (loadPrevImprintsAndSeed) will handle seeding inks. We just show a
    // waiting state; it will replace this content.
    if (rec.rp && rec.prevImprintIds && rec.prevImprintIds.length) {
      rowsEl.innerHTML = '<div class="inks-loading-sm">Loading from previous run…</div>';
      return;
    }
    // v17: No inks but no prev to wait on either -- render through
    // renderInkChips so the slot placeholders + slot-meta line + base chip
    // state all paint correctly.
    inkChipCache[id] = cached || {};
    renderInkChips(id, inkChipCache[id]);
    return;
  }

  var token = localStorage.getItem('pine_at_key');
  if (!token) return;

  var seq = (inkFetchSeq[id] = (inkFetchSeq[id] || 0) + 1);

  var filter = 'OR(' + wantIds.map(function(iid) { return "RECORD_ID()='" + iid + "'"; }).join(',') + ')';
  var url = 'https://api.airtable.com/v0/appJkaLk8DykjsgHR/tblyPBucKoDwxDisT' +
    '?returnFieldsByFieldId=true' +
    '&fields%5B%5D=fldojKv3gqT312q2R' +
    '&fields%5B%5D=fld00EdkjL43ybgVV' +
    '&fields%5B%5D=fldXMM4WvS3SGsliC' +
    '&fields%5B%5D=' + INK_HEX_FLD +   // v35: Display Hex, for the swatch
    '&filterByFormula=' + encodeURIComponent(filter);

  fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(res) {
      // v30 BUGFIX: this was the ONLY fetch in the app not checking res.ok.
      // An expired PAT (401), a rate limit (429) or a bad formula (422) returns
      // JSON with no .records -- which got cached as {} and rendered as a full
      // column of record IDs, permanently, until a hard page reload.
      if (!res.ok) return res.json().then(function(e) {
        throw new Error((e.error && (e.error.type + ': ' + e.error.message)) || 'API ' + res.status);
      });
      return res.json();
    })
    .then(function(data) {
      if (seq !== inkFetchSeq[id]) return;            // a newer load won -- drop this
      var byId = inkChipCache[id] || {};              // merge: keep locally-synth fields
      (data.records || []).forEach(function(r) { byId[r.id] = r.fields; });
      inkChipCache[id] = byId;
      renderInkChips(id, byId);
    })
    .catch(function(err) {
      console.error('[seps-v30 loadInkChips] FAIL', id, err);
      inkChipCache[id] = null;                        // never cache a failure
      var el = document.getElementById('inks-rows-' + id);
      if (el) el.innerHTML = '<div class="inks-loading-sm">Could not load inks — tap ↻ Refresh</div>';
    });
}

// ============================================================================
// v16: MULTI-PREVIOUS-IMPRINT SEEDING ORCHESTRATOR
// ----------------------------------------------------------------------------
// When a card is expanded and it's a repeat (rec.rp) with linked prev imprints,
// we fetch ALL of them in parallel, filter by Location match against the
// current imprint, then cherry-pick per field (sep URL / inks / print notes)
// the first location-matched prev that has a value.
//
// Dropdown renders only when 2+ location-matched prevs exist. Changing the
// dropdown re-seeds fields that sep hasn't edited (compare current vs seeded).
//
// No writes. Everything runs client-side; existing save paths persist whatever
// ends up in the DOM when INK_WRITES_ENABLED and siblings eventually flip on.
// ============================================================================

// Fetch a single previous imprint's full record (cached). Returns a Promise
// that resolves to { name, loc, inkIds, sepUrl, printNotes, hasProof, supa,
// prevRecId }. Cache hits resolve synchronously-ish.
function fetchOnePrevImprint(prevRecId) {
  if (prevImprintCache[prevRecId] && prevImprintCache[prevRecId]._full) {
    return Promise.resolve(prevImprintCache[prevRecId]);
  }
  var token = localStorage.getItem('pine_at_key');
  if (!token) return Promise.reject(new Error('No token'));

  // Fetch whole record — request listing specific fields can 422 when a
  // field can't resolve on that record (per v13 bug fix). Pluck client-side.
  var url = 'https://api.airtable.com/v0/' + BASE + '/' + TBL + '/' + prevRecId +
    '?returnFieldsByFieldId=true';

  return fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      var pd = parsePrevImprint(prevRecId, data.fields || {});
      prevImprintCache[prevRecId] = pd;
      return pd;
    });
}

// v34: shared parser for a previous-imprint record (used by the direct fetch
// above and by the same-order sibling search below).
function parsePrevImprint(prevRecId, f) {
      var name = f['fldDFfwFQ9B20n2kT'];
      if (!name) {
        console.warn('[seps] fetchOnePrevImprint: Imprint ID empty for', prevRecId);
        name = 'Previous run';
      }
      var typeRaw = f['fldjNCuaGOkWgzH2K'];
      var typeName = typeRaw ? (typeof typeRaw === 'object' ? (typeRaw.name || '') : String(typeRaw)) : '';
      var locRaw = f[F.location];
      var locName = locRaw ? (typeof locRaw === 'object' ? (locRaw.name || '') : String(locRaw)) : '';
      var pd = {
        prevRecId: prevRecId,
        name: name,
        loc: locName,
        inkIds: flatLookup(f[F.inks]).map(function(v){ return typeof v === 'string' ? v : (v && v.id) || ''; }).filter(Boolean),
        sepUrl: f[F.sepUrl] || '',
        printNotes: f[F.printNotes] || '',
        hasProof: flatLookup(f[F.proof]).length > 0,
        supa: isSupaType(typeName),
        // v29: master folder/id resolved on this previous imprint via its own
        // canonical lookups. A reorder's previous is a stamped family member, so
        // these are already populated — no need for the new imprint to be stamped.
        masterFolder: flatLookup(f[F.masterFolder])[0] || '',
        masterId: flatLookup(f[F.masterId])[0] || '',
        _full: true
      };
      return pd;
}

// v34: Same-order fallback. When no linked previous imprint shares this job's
// print location (e.g. 10893-B Back was linked to 9317-A Left Chest), look at
// the OTHER imprints on the same previous order(s) (9317-*) and return the ones
// in the matching location. Read-only; results are cached like direct fetches.
function fetchSameOrderMatches(linkedPrevs, currentLoc) {
  var token = localStorage.getItem('pine_at_key');
  if (!token) return Promise.resolve([]);
  var linkedIds = {};
  linkedPrevs.forEach(function(p){ linkedIds[p.prevRecId] = true; });
  var prefixes = [];
  linkedPrevs.forEach(function(p) {
    var m = /^(\d+)-/.exec(p.name || '');
    if (m && prefixes.indexOf(m[1]) < 0) prefixes.push(m[1]);
  });
  if (!prefixes.length) return Promise.resolve([]);
  return Promise.all(prefixes.map(function(prefix) {
    var formula = 'FIND("' + prefix + '-",{fldDFfwFQ9B20n2kT})=1';
    var url = 'https://api.airtable.com/v0/' + BASE + '/' + TBL +
      '?returnFieldsByFieldId=true&pageSize=100&filterByFormula=' + encodeURIComponent(formula);
    return fetch(url, { headers: { Authorization: 'Bearer ' + token } })
      .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data) {
        return (data.records || []).map(function(r) {
          var pd = prevImprintCache[r.id] && prevImprintCache[r.id]._full ? prevImprintCache[r.id] : parsePrevImprint(r.id, r.fields || {});
          prevImprintCache[r.id] = pd;
          return pd;
        });
      })
      .catch(function(err) { console.warn('[seps] same-order lookup failed for', prefix, err); return []; });
  })).then(function(lists) {
    var all = [].concat.apply([], lists);
    return all.filter(function(p) { return !linkedIds[p.prevRecId] && (p.loc || '') === (currentLoc || ''); })
      .sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });
  });
}

// v34: Small note above the ink rows explaining where seeded values came from.
function showPrevNote(currentId, text) {
  var rowsEl = document.getElementById('inks-rows-' + currentId);
  if (!rowsEl || !rowsEl.parentNode) return;
  var el = document.getElementById('prev-note-' + currentId);
  if (!el) {
    el = document.createElement('div');
    el.id = 'prev-note-' + currentId;
    el.className = 'p-note p-note-wait prev-note';
    rowsEl.parentNode.insertBefore(el, rowsEl);
  }
  el.textContent = text;
}

// Main entry point called when a repeat card is expanded.
function loadPrevImprintsAndSeed(currentId) {
  var rec = ALL.find(function(r) { return r.id === currentId; });
  if (!rec || !rec.prevImprintIds || !rec.prevImprintIds.length) return;

  // Set interim label on the View Previous button while we load
  var labelEl = document.getElementById('prev-label-' + currentId);
  if (labelEl && !labelEl.textContent.trim().replace('...','')) {
    labelEl.textContent = 'loading\u2026';
  }

  var promises = rec.prevImprintIds.map(function(pid) {
    return fetchOnePrevImprint(pid).catch(function(err) {
      console.warn('[seps] fetchOnePrevImprint failed for', pid, err);
      return null;
    });
  });

  Promise.all(promises).then(function(results) {
    var allPrevs = results.filter(function(x){ return !!x; });
    if (!allPrevs.length) {
      var rowsEl = document.getElementById('inks-rows-' + currentId);
      if (rowsEl && !rec.inkIds.length) rowsEl.innerHTML = '<div class="inks-loading-sm">Could not load previous run</div>';
      if (labelEl) labelEl.textContent = 'Previous run';
      return;
    }

    // Filter to location matches only. Empty-location current imprint matches
    // empty-location prev (trivially). Otherwise strict equality.
    var currentLoc = rec.loc || '';
    var matched = allPrevs.filter(function(p){ return (p.loc || '') === currentLoc; });

    // User decision: no location match = leave fields empty, sep fills manually.
    // But we still need a target for the "View Previous" button, so default
    // state[currentId].chosenPrev to the first linked prev (unseeded).
    if (!matched.length) {
      state[currentId].chosenPrev = allPrevs[0].prevRecId;
      if (labelEl) labelEl.textContent = allPrevs[0].name;
      // v34: before giving up, look for a location match among the other
      // imprints on the same previous order(s).
      fetchSameOrderMatches(allPrevs, currentLoc).then(function(sibs) {
        if (sibs.length) {
          applyCherryPickedSeed(currentId, sibs);
          if (sibs.length > 1) renderPopulateFromDropdown(currentId, sibs);
          var linkedDesc = allPrevs.map(function(p){ return p.name + (p.loc ? ' (' + p.loc + ')' : ''); }).join(', ');
          showPrevNote(currentId, 'Linked run ' + linkedDesc + ' is a different location \u2014 matched ' +
            sibs[0].name + (currentLoc ? ' (' + currentLoc + ')' : '') + ' on the same order. Check before saving.');
          return;
        }
        var rowsEl2 = document.getElementById('inks-rows-' + currentId);
        if (rowsEl2 && !rec.inkIds.length) {
          rowsEl2.innerHTML = '<div class="p-note p-note-wait prev-note">No previous run in the same print location \u2014 add the inks by hand.</div>';
        }
      });
      return;
    }

    // Location-matched set. Apply seed and render dropdown if 2+.
    applyCherryPickedSeed(currentId, matched);
    if (matched.length > 1) {
      renderPopulateFromDropdown(currentId, matched);
    }
  });
}

// Cherry-pick seed: walk location-matched prevs in order, take first non-empty
// value per field. Stamp state[id].seeded so dropdown changes can edit-detect.
// Sets state[id].chosenPrev to the first matched prev (drives View Previous btn).
function applyCherryPickedSeed(currentId, matchedPrevs) {
  var rec = ALL.find(function(r) { return r.id === currentId; });
  if (!rec) return;

  var pick = { sepUrl:'', inkIds:[], printNotes:'', masterFolder:'', masterId:'' };
  var sources = { sepUrl:null, inkIds:null, printNotes:null };

  matchedPrevs.forEach(function(p) {
    if (!pick.sepUrl && p.sepUrl) { pick.sepUrl = p.sepUrl; sources.sepUrl = p.prevRecId; }
    if (!pick.inkIds.length && p.inkIds.length) { pick.inkIds = p.inkIds.slice(); sources.inkIds = p.prevRecId; }
    if (!pick.printNotes && p.printNotes) { pick.printNotes = p.printNotes; sources.printNotes = p.prevRecId; }
    // v29: master folder is design-level (same for the whole family), so first
    // matched prev that carries it wins.
    if (!pick.masterFolder && p.masterFolder) { pick.masterFolder = p.masterFolder; pick.masterId = p.masterId || ''; }
  });

  // Default chosenPrev: first matched (drives View Previous button target)
  state[currentId].chosenPrev = matchedPrevs[0].prevRecId;

  var labelEl = document.getElementById('prev-label-' + currentId);
  if (labelEl) labelEl.textContent = matchedPrevs[0].name;

  // Seed Sep File URL — ONLY if sep hasn't already set one
  if (pick.sepUrl && !state[currentId].sepsUrl) {
    state[currentId].sepsUrl = pick.sepUrl;
    refreshSepUrlUI(currentId, pick.sepUrl);
  }

  // Seed Inks — ONLY if current has none. Mutates rec.inkIds so the existing
  // loadInkChips render path picks them up on next call.
  if (pick.inkIds.length && !rec.inkIds.length) {
    rec.inkIds = pick.inkIds.slice();
    // Clear any in-flight "Loading from previous run..." placeholder so
    // loadInkChips' early-return doesn't paint empty state.
    inkChipCache[currentId] = null;
    loadInkChips(currentId);
  } else if (!pick.inkIds.length && !rec.inkIds.length) {
    // No inks available anywhere and current has none either — clear the
    // placeholder so it doesn't say "Loading..." forever.
    var rowsEl = document.getElementById('inks-rows-' + currentId);
    if (rowsEl) rowsEl.innerHTML = '<div class="inks-loading-sm">No inks on previous run</div>';
  }

  // Seed Print Notes — ONLY if current notes are empty
  if (pick.printNotes && !(state[currentId].pn || '').trim()) {
    state[currentId].pn = pick.printNotes;
    var ta = document.getElementById('notes-' + currentId);
    if (ta && !ta.value.trim()) ta.value = pick.printNotes;
  }

  // Stash seeded values so dropdown changes can detect unedited fields
  state[currentId].seeded = {
    sepsUrl: pick.sepUrl || '',
    pn: pick.printNotes || '',
    inkIdsSig: (pick.inkIds || []).slice().sort().join(',')
  };

  // v29: stash the master folder/id sourced from the previous imprint, then
  // repaint the banner (the current imprint's own lookup was empty for a fresh
  // reorder — this fills it from the promoted family).
  if (pick.masterFolder) {
    state[currentId].masterFolder = pick.masterFolder;
    state[currentId].masterId = pick.masterId || '';
    renderMasterFolderBanner(currentId);
  }
}

// v29: Paint the Master Design Folder banner in the Sep File section.
// Source priority: the imprint's OWN master folder (a stamped family member or
// the promoted root) first, then the value sourced from a previous imprint (the
// fresh-reorder case). Folder != file: we surface the DESIGN folder so the
// separator opens it and pulls the clean sep from the Seps subfolder by hand.
// We never auto-overwrite the Sep File URL with a folder link.
// v46: the banner also lists the master folder's Seps files, each with "Use this sep" (the separator picks; nothing is
// linked on its own).
function renderMasterFolderBanner(currentId) {
  var el = document.getElementById('master-folder-' + currentId);
  if (!el) return;
  var rec = ALL.find(function(r){ return r.id === currentId; });
  var url = (rec && rec.masterFolder) || (state[currentId] && state[currentId].masterFolder) || '';
  var mid = (rec && rec.masterId) || (state[currentId] && state[currentId].masterId) || '';
  if (!url || url.indexOf('http') !== 0) { el.style.display = 'none'; return; }
  el.innerHTML =
    '<div class="mfb-l">' +
      '<span class="mfb-chip">MASTER' + (mid ? ' · ' + esc(mid) : '') + '</span>' +
      '<span class="mfb-sub">The clean seps for this design</span>' +
    '</div>' +
    h('a', {'class':'p-btn mfb-btn','href':url,'target':'_blank','rel':'noopener'}, 'Open master folder &#8599;') +
    '<div class="mfb-files" id="mfb-files-' + currentId + '"></div>';
  el.style.display = 'flex';
  fitInks();   // v39: the banner makes the controls taller
  loadMasterSeps(currentId, url);
}

// Render the "Populate from" dropdown (2+ matched prevs).
function renderPopulateFromDropdown(currentId, matchedPrevs) {
  var host = document.getElementById('populate-from-' + currentId);
  if (!host) return;
  var chosen = state[currentId].chosenPrev || matchedPrevs[0].prevRecId;
  var opts = matchedPrevs.map(function(p) {
    var label = escHtml(p.name) + (p.loc ? ' \u00b7 ' + escHtml(p.loc) : '');
    var sel = (p.prevRecId === chosen) ? ' selected' : '';
    return '<option value="' + esc(p.prevRecId) + '"' + sel + '>' + label + '</option>';
  }).join('');
  host.innerHTML =
    '<label class="sp-lbl" for="popfrom-' + esc(currentId) + '">Fill from</label>' +
    '<select class="p-select" id="popfrom-' + esc(currentId) + '" onchange="onPopulateFromChange(\'' + esc(currentId) + '\', this.value)">' +
    opts + '</select>';
}

// Dropdown change handler — re-seed ONLY fields sep hasn't edited.
// "Unedited" = current value equals what we last seeded in state[id].seeded.
// Any divergence (including sep wiping a field to empty) counts as edited.
function onPopulateFromChange(currentId, newPrevRecId) {
  var pd = prevImprintCache[newPrevRecId];
  if (!pd) return;
  state[currentId].chosenPrev = newPrevRecId;

  var labelEl = document.getElementById('prev-label-' + currentId);
  if (labelEl) labelEl.textContent = pd.name;

  var seeded = state[currentId].seeded || { sepsUrl:'', pn:'', inkIdsSig:'' };
  var rec = ALL.find(function(r){ return r.id === currentId; });
  if (!rec) return;

  // Sep URL — compare current vs seeded; re-seed if match
  var curSepUrl = state[currentId].sepsUrl || '';
  if (curSepUrl === (seeded.sepsUrl || '') && pd.sepUrl) {
    state[currentId].sepsUrl = pd.sepUrl;
    seeded.sepsUrl = pd.sepUrl;
    refreshSepUrlUI(currentId, pd.sepUrl);
  }

  // Print Notes — compare current textarea value vs seeded
  var ta = document.getElementById('notes-' + currentId);
  var curPn = ta ? ta.value : (state[currentId].pn || '');
  if (curPn === (seeded.pn || '') && pd.printNotes) {
    state[currentId].pn = pd.printNotes;
    seeded.pn = pd.printNotes;
    if (ta) ta.value = pd.printNotes;
  }

  // Inks — compare current signature vs seeded signature
  var curSig = (rec.inkIds || []).slice().sort().join(',');
  if (curSig === (seeded.inkIdsSig || '') && pd.inkIds.length) {
    rec.inkIds = pd.inkIds.slice();
    seeded.inkIdsSig = pd.inkIds.slice().sort().join(',');
    inkChipCache[currentId] = null;
    loadInkChips(currentId);
  }

  state[currentId].seeded = seeded;
}

// Update the Sep File UI strip to reflect a newly-seeded URL (preview-only,
// no PATCH). Mirrors the preview branch of saveSepLink without triggering a
// toast. Handles both initial seed (lbtn-{id} element present) and dropdown
// re-seed (View sep anchor already present — needs href update).
function refreshSepUrlUI(currentId, url) {
  paintSepUrl(currentId);  // v35: one painter for the Sep file buttons + the card tag
}

// View Previous button click -> opens proof of whichever prev is currently
// chosen (default: first location-matched, or dropdown selection).
function openChosenPrevProof(currentId) {
  var target = (state[currentId] && state[currentId].chosenPrev) || null;
  if (!target) {
    // Fallback: use the first linked prev
    var rec = ALL.find(function(r){ return r.id === currentId; });
    if (rec && rec.prevImprintIds && rec.prevImprintIds.length) {
      target = rec.prevImprintIds[0];
    }
  }
  if (!target) { showToast('No previous imprint linked', true); return; }
  openPrevProof(currentId, target);
}
