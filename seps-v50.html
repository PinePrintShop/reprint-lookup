// Open previous imprint proof in the existing pmModal viewer
function openPrevProof(currentId, prevRecId) {
  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No API token', true); return; }

  // Check cache for the name
  var prevName = prevImprintCache[prevRecId] ? prevImprintCache[prevRecId].name : prevRecId;

  var modal = document.getElementById('pmModal');
  var spinner = document.getElementById('pmSpinner');
  var canvas = document.getElementById('pmCanvas');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('pmFn').textContent = 'Previous: ' + prevName;
  document.getElementById('pmCt').textContent = ''; pmSetDl(null); PM_DL_LINK = true;   // v48: the previous run's proof downloads from its Open link
  document.getElementById('pmOpenLink').style.display = 'none';
  document.getElementById('pmOpenLink').innerHTML = 'Open &#8599;'; document.getElementById('pmMsg').hidden = true; document.querySelector('.pm-nav').style.visibility = '';   // v46
  spinner.style.display = 'flex';
  modal.classList.add('open');
  pmPdfDoc = null; pmPage = 1; pmTotal = 1;

  // Fetch fresh proof images from previous imprint record
  // v13: no fields[]= filter — was causing 422s when any listed field couldn't
  // resolve on the target record. Fetch whole record, pluck client-side.
  var url = 'https://api.airtable.com/v0/' + BASE + '/' + TBL + '/' + prevRecId +
    '?returnFieldsByFieldId=true';

  fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      var f = data.fields || {};
      var raw = f[F.proof];
      var freshUrl = null, isPDF = false;

      // Handle both flat array and nested multipleLookupValues
      if (raw && raw.valuesByLinkedRecordId) {
        Object.values(raw.valuesByLinkedRecordId).forEach(function(arr) {
          if (Array.isArray(arr)) arr.forEach(function(a) {
            if (a && a.url && !freshUrl) { freshUrl = a.url; isPDF = a.type === 'application/pdf'; }
          });
        });
      } else if (Array.isArray(raw)) {
        raw.forEach(function(a) {
          if (a && a.url && !freshUrl) { freshUrl = a.url; isPDF = a.type === 'application/pdf'; }
        });
      }

      if (!freshUrl) {
        spinner.style.display = 'none';
        canvas.width = 400; canvas.height = 80;
        var c = canvas.getContext('2d');
        c.fillStyle = '#141412'; c.fillRect(0, 0, 400, 80);
        c.fillStyle = '#FFFFFF'; c.font = '700 16px Helvetica, Arial, sans-serif'; c.textAlign = 'center';
        c.fillText('No proof on previous imprint', 200, 45);
        return;
      }

      var link = document.getElementById('pmOpenLink');
      link.href = freshUrl;
      link.style.display = 'inline-flex';

      if (isPDF) {
        pmInit();
        pdfjsLib.getDocument(freshUrl).promise.then(function(doc) {
          pmPdfDoc = doc; pmPage = 1; pmTotal = doc.numPages;
          pmRenderPage();
        }).catch(function(err) {
          spinner.style.display = 'none';
          canvas.width = 500; canvas.height = 100;
          var c = canvas.getContext('2d');
          c.fillStyle = '#141412'; c.fillRect(0, 0, 500, 100);
          c.fillStyle = '#FFFFFF'; c.font = '700 16px Helvetica, Arial, sans-serif'; c.textAlign = 'center';
          c.fillText('PDF load error: ' + err.message, 250, 40);
          c.fillStyle = '#EFE2CD'; c.font = '14px Helvetica, Arial, sans-serif';
          c.fillText('Use the Open button above to view in browser', 250, 65);
        });
      } else {
        var img = new Image();
        img.onload = function() {
          spinner.style.display = 'none';
          canvas.width = img.width; canvas.height = img.height;
          canvas.getContext('2d').drawImage(img, 0, 0);
          document.getElementById('pmCt').textContent = 'img';
        };
        img.onerror = function() { spinner.style.display = 'none'; };
        img.crossOrigin = 'anonymous';
        img.src = freshUrl;
      }
    })
    .catch(function(err) {
      spinner.style.display = 'none';
      showToast('Previous proof load failed: ' + err.message, true);
    });
}

function renderInkChips(id, byId) {
  var rec = ALL.find(function(r) { return r.id === id; });
  if (!rec) return;
  var el = document.getElementById('inks-rows-' + id);
  if (!el) return;

  var realInkCount = (rec.inkIds || []).length;

  var html = '';
  (rec.inkIds || []).forEach(function(iid, idx) {
    var d = byId[iid] || {};
    // v30 BUGFIX: NEVER render a raw Airtable record ID as an ink name. The old
    // `d['fldojKv3gqT312q2R'] || iid` was the single line that surfaced
    // "RECODN5TMXWWZR4OV" to the sep whenever the Inks fetch hadn't resolved.
    // Fall back the same way the rest of the app does: Name -> Pantone Number,
    // then a neutral placeholder. Every other read site in this file already
    // used `fld00EdkjL43ybgVV || fldojKv3gqT312q2R`; this one didn't.
    var pantoneNo = d['fld00EdkjL43ybgVV'] || '';
    var name = d['fldojKv3gqT312q2R'] || (pantoneNo ? 'Pantone ' + pantoneNo : '') ||
               (iid.indexOf('preview-') === 0 ? 'New ink' : 'Resolving\u2026');
    var typeRaw = d['fldXMM4WvS3SGsliC'];
    var typeName = typeRaw ? (typeof typeRaw === 'object' ? (typeRaw.name || '') : String(typeRaw)) : '';
    var hexColor = getPantoneHex(name, d, pantoneNo);
    var tba = !hexColor && (isTbaInk(pantoneNo) || isTbaInk(name));
    var chipStyle = hexColor ? 'background:' + hexColor : '';
    var isPreview = iid.indexOf('preview-') === 0;
    var rowCls = 'ink-row p-job-ink' + (isPreview ? ' preview-chip' : '');   // v41: the shared 38px ink row

    html += '<div class="' + rowCls + '" draggable="true" data-iid="' + escHtml(iid) + '" data-recid="' + escHtml(id) + '" data-idx="' + idx + '"' +
      ' ondragstart="inkDragStart(event)"' +
      ' ondragover="inkDragOver(event)"' +
      ' ondragleave="inkDragLeave(event)"' +
      ' ondrop="inkDrop(event)"' +
      ' ondragend="inkDragEnd(event)">';
    // Drag handle
    html += '<div class="drag-handle p-job-ink-drag" title="Drag to reorder"><i></i><i></i><i></i><i></i><i></i><i></i></div>';
    html += '<span class="ink-n p-job-ink-n">' + (idx + 1) + '</span>';   // v39: burn order number (v41: everywhere)
    html += hexColor
      ? '<div class="ink-chip p-job-ink-sw" id="chip-' + escHtml(iid) + '" style="' + chipStyle + '" title="Click to adjust" onclick="editChipColor(\'' + escHtml(iid) + '\',this);event.stopPropagation()"></div>'
      : '<div class="ink-chip p-job-ink-sw ' + (tba ? 'ink-chip-tba' : 'ink-chip-empty') + '" id="chip-' + escHtml(iid) + '" title="' + (tba ? 'TBA \u2014 the ink room picks the color' : 'No color on file \u2014 click to preview one') + '" onclick="editChipColor(\'' + escHtml(iid) + '\',this);event.stopPropagation()"></div>';
    html += '<div class="ink-body p-job-ink-main">';
    // v35: "Pantone 186 C - OW" + an OW tag said the type twice; the tag says it once.
    var shownName = typeName ? name.replace(new RegExp('\\s+-\\s+' + typeName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i'), '') : name;
    html += '<div class="ink-name p-job-ink-name" title="' + escHtml(name) + '">' + escHtml(shownName) + '</div>';
    if (typeName) html += inkTypeBadge(typeName);
    html += '</div>';
    html += '<div class="p-job-ink-x"><button class="ink-remove" title="Remove from this imprint" onclick="removeInkFromImprint(\'' + escHtml(id) + '\',\'' + escHtml(iid) + '\');event.stopPropagation()">\u2715</button></div>';
    html += '</div>';
  });

  // v20: Placeholder slot nudges — these are visual-only "tap me to add a
  // TBA blank canvas" rows shown up to the imprint's screen count. They
  // don't represent real records; they're an onboarding hint that says
  // "you have N paid screens, here's the empty slots if you want to commit
  // them as TBA records ready for Ink Queue to fill in later."
  //
  // Tap → addTbaSlot mints a real Inks record (the blank canvas) and links
  // it to the imprint. The placeholder count drops by one on the next
  // re-render because realInkCount went up.
  //
  // Capped at MAX_INKS — once realInkCount would exceed 12, we stop
  // rendering placeholders. Whitney can still grow beyond screen count
  // via "+ Add slot" up to 12 total.
  var screenCount = rec.s || 0;
  var maxPlaceholders = Math.max(0, MAX_INKS - realInkCount);
  var desiredPlaceholders = Math.max(0, screenCount - realInkCount);
  var placeholderCount = Math.min(desiredPlaceholders, maxPlaceholders);
  for (var p = 0; p < placeholderCount; p++) {
    var slotNum = realInkCount + p + 1;
    html += '<div class="slot-placeholder" onclick="event.stopPropagation();addTbaSlot(\'' + id + '\')">' +
      '<div class="slot-placeholder-chip">' + slotNum + '</div>' +
      '<div class="slot-placeholder-lbl">Empty slot</div>' +
      '<div class="slot-placeholder-hint">Tap to add a TBA ink</div>' +
    '</div>';
  }

  if (!html) {
    html = '<div class="inks-loading-sm">No inks yet \u2014 tap a base or add an ink below.</div>';
  }
  el.innerHTML = html;

  // v17: Update slot-meta line — shows real ink count, paid screens, and cap warning when at max
  var meta = document.getElementById('slot-meta-' + id);
  if (meta) {
    var atMax = realInkCount >= MAX_INKS;
    var maxBadge = atMax ? ' <span class="slot-max">Max ' + MAX_INKS + '</span>' : '';
    if (screenCount > 0) {
      meta.title = realInkCount + ' of ' + screenCount + ' paid screens';   // v39
      meta.innerHTML = 'Inks <span class="slot-meta-count">(' + realInkCount + ' of ' + screenCount + ')</span> ' +
        '<span class="slot-meta-paid">paid screens</span>' + maxBadge;
    } else {
      meta.innerHTML = 'Inks <span class="slot-meta-count">(' + realInkCount + ')</span>' + maxBadge;
    }
  }

  // v17: Disable add-slot button when at MAX_INKS
  var addSlotBtn = document.getElementById('add-slot-btn-' + id);
  if (addSlotBtn) {
    var atMax2 = realInkCount >= MAX_INKS;
    addSlotBtn.disabled = atMax2;

  }

  // v17: Sync .added state on the four base chips so Whitney sees which bases are committed
  refreshBaseChipStates(id, byId);

  // Sync the PDF scan chip states in case some were already added
  refreshScanChipStates(id);
  fitInks();
}

// v39: two panes only. If the controls column doesn't fit and there are more than 5 inks / slots, they go into two
// columns (numbered down the left column, then the right) and the column widens a little for this job. Only if it
// still doesn't fit does the column scroll.
function fitInks() {
  if (!isWide()) { document.querySelectorAll('.sp-grid.ink-2col').forEach(function(g) { g.classList.remove('ink-2col'); }); return; }
  var D = document.getElementById('splitDetail'); if (!D) return;
  var grid = D.querySelector('.sp-grid'), C = D.querySelector('.sp-ctl'), rowsEl = D.querySelector('.inks-rows');
  if (!grid || !C || !rowsEl) return;
  var n = rowsEl.querySelectorAll('.ink-row,.slot-placeholder').length;
  rowsEl.style.setProperty('--ink-rows', Math.ceil(n / 2));
  var keep = C.scrollTop;
  grid.classList.remove('ink-2col');
  if (n > 5 && C.scrollHeight > C.clientHeight) grid.classList.add('ink-2col');
  C.scrollTop = keep;
}
var fitTimer = 0;
window.addEventListener('resize', function() { clearTimeout(fitTimer); fitTimer = setTimeout(fitInks, 120); });

// v17: focus the typeahead input. Currently unused (placeholder slots now add
// TBA directly per Whitney's "I should be able to add" feedback) but kept as a

function focusInkSearch(id) {

// v17: Mark base-chip .added when its record ID is already on the imprint's inks.
// Also disable un-added chips when the imprint is at MAX_INKS (added chips stay
// tappable so user can toggle off to free up a slot).
function refreshBaseChipStates(id, byId) {
  var rec = ALL.find(function(r) { return r.id === id; });
  if (!rec) return;
  var basesRow = document.getElementById('bases-row-' + id);
  if (!basesRow) return;
  var inkIds = rec.inkIds || [];
  var atMax = inkIds.length >= MAX_INKS;

  // Build a set of the currently-committed Pantone Number values on this imprint —
  // this is more robust than matching by record ID, because Whitney could have
  // legitimately added a base via the typeahead at some point in the past
  // (or via a previous-imprint inheritance seed) and we still want the chip to
  // reflect that the base IS on the imprint.
  var committedNames = {};
  inkIds.forEach(function(iid) {
    var fields = (byId && byId[iid]) || {};
    var pn = fields['fld00EdkjL43ybgVV'] || fields['fldojKv3gqT312q2R'];
    if (pn) committedNames[String(pn).toUpperCase()] = true;
  });

  basesRow.querySelectorAll('.base-chip').forEach(function(chip) {
    var name = (chip.dataset.base || '').toUpperCase();
    var inkRecId = chip.dataset.inkId;
    var isAdded = committedNames[name] || (inkIds.indexOf(inkRecId) >= 0);
    chip.classList.toggle('added', !!isAdded);
    // v17: Disable un-added chips when imprint is full. Added chips remain tappable
    // so user can toggle off to free up a slot.
    chip.classList.toggle('disabled', atMax && !isAdded);
  });
}

// DRAG TO REORDER INK CHIPS
var dragSrcIid = null, dragSrcRecId = null;

function inkDragStart(e) {
  var row = e.currentTarget;
  dragSrcIid   = row.dataset.iid;
  dragSrcRecId = row.dataset.recid;
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcIid);
  e.stopPropagation();
}

function inkDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var row = e.currentTarget;
  if (row.dataset.iid !== dragSrcIid) row.classList.add('drag-over');
  e.stopPropagation();
}

function inkDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
  e.stopPropagation();
}

// v37: while an ink is dragged, holding it near the top or bottom edge scrolls the job (the right pane on wide
// screens, the page otherwise), so the lowest ink can go straight to the top. Browsers don't scroll an inner pane
// during a drag on their own, and the sticky Mark sep'd bar covers the bottom edge.
var dragAuto = { y: null, raf: 0 };
// v38: the nearest scrolling box around the dragged ink (the controls column on wide screens), else the page
function dragScroller() {
  var el = dragSrcIid != null ? document.querySelector('.ink-row.dragging') : null;
  for (el = el && el.parentElement; el && el !== document.body; el = el.parentElement) {
    var oy = getComputedStyle(el).overflowY;
    if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 1) return el;
  }
  return null;
}
function dragAutoTick() {
  dragAuto.raf = 0;
  if (dragSrcIid == null || dragAuto.y == null) return;
  var box = dragScroller(), top, bottom;
  if (box) { var r = box.getBoundingClientRect(); top = r.top; bottom = r.bottom; }
  else { var bar = document.querySelector('.p-bar'), f = document.getElementById('filters'); top = Math.max(bar ? bar.getBoundingClientRect().bottom : 0, f && !f.hidden ? f.getBoundingClientRect().bottom : 0); bottom = window.innerHeight; }
  var done = document.querySelector('.sp-done'); if (done) { var dt = done.getBoundingClientRect().top; if (dt > top && dt < bottom) bottom = dt; }
  var zone = 90, step = 0;
  if (dragAuto.y < top + zone) step = -Math.ceil((top + zone - dragAuto.y) / 6);
  else if (dragAuto.y > bottom - zone) step = Math.ceil((dragAuto.y - (bottom - zone)) / 6);
  if (step) { if (box) box.scrollTop += step; else window.scrollBy(0, step); }
  dragAuto.raf = requestAnimationFrame(dragAutoTick);
}
document.addEventListener('dragover', function(e) {
  if (dragSrcIid == null) return;
  dragAuto.y = e.clientY;
  if (!dragAuto.raf) dragAuto.raf = requestAnimationFrame(dragAutoTick);
}, true);
function dragAutoStop() { dragAuto.y = null; if (dragAuto.raf) cancelAnimationFrame(dragAuto.raf); dragAuto.raf = 0; }
document.addEventListener('dragend', dragAutoStop, true);
document.addEventListener('drop', dragAutoStop, true);

function inkDragEnd(e) {
  dragSrcIid = null; dragSrcRecId = null;
  document.querySelectorAll('.ink-row').forEach(function(r) {
    r.classList.remove('dragging');
    r.classList.remove('drag-over');
  });
  e.stopPropagation();
}

function inkDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  var targetRow = e.currentTarget;
  targetRow.classList.remove('drag-over');

  var targetIid = targetRow.dataset.iid;
  var recId     = targetRow.dataset.recid;
  if (!dragSrcIid || dragSrcIid === targetIid) return;

  // Reorder inkIds on the record
  var rec = ALL.find(function(r) { return r.id === recId; });
  if (!rec) return;

  var ids = rec.inkIds.slice();
  var fromIdx = ids.indexOf(dragSrcIid);
  var toIdx   = ids.indexOf(targetIid);
  if (fromIdx < 0 || toIdx < 0) return;

  ids.splice(fromIdx, 1);
  ids.splice(toIdx, 0, dragSrcIid);
  rec.inkIds = ids;

  // Re-render with new order
  var byId = inkChipCache[recId] || {};
  renderInkChips(recId, byId);

  // PATCH to Airtable — save new order
  patchInkOrder(recId, ids);
}

function patchInkOrder(recId, orderedIds) {

  var realIds = orderedIds.filter(function(iid) { return iid.indexOf('preview-') !== 0; });
  if (realIds.length !== orderedIds.length) {
    showToast('Order saved \u2014 preview chips excluded');
  }
  // v23 BUGFIX: plain string IDs (see addInkById comment)
  var linked = realIds.slice();
  // v22: log payload
  var __body = { records: [{ id: recId, fields: { 'fldpNCCXTgHyDhvak': linked } }] };
  console.log('[seps-v23 patchInkOrder] PATCH', JSON.stringify(__body, null, 2));
  inkSerial(recId, function() { return fetch('https://api.airtable.com/v0/appJkaLk8DykjsgHR/tbln9oAGvz2PNBZLV', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(__body)
  }).then(function(res) {

}

function showToast(msg, err) {  // v35: kit toast (black, bottom centre), newest wins; problems stay a little longer
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'p-toast' + (err ? ' is-alert' : ''); t.hidden = false;
  clearTimeout(t._t); t._t = setTimeout(function(){ t.hidden = true; }, err ? 5000 : 2600);

/* =========================================================================
   INK MANAGEMENT (v13) — add / remove / PDF scan / collapsible scan strip
   v12 changes: scrollable ink list, preview chips, fixed-position dropdown.
   v13 changes: drop fields[]= filter from previous-imprint GETs. The filter
   was triggering 422s when any listed field couldn't resolve (e.g. formula
   with an inaccessible upstream dependency). Fetch full record, pluck
   client-side — record-by-ID is cheap.
   ========================================================================= */

// ---- SHARED WRITE HELPERS --------------------------------------------------

// ============================================================================
// v20: BASES PICKER + TBA SLOT HELPERS
// ----------------------------------------------------------------------------
// Three add-ink entry points layered on top of addInkById. All inherit the
// same preview-mode gating, dedupe, cache update, and re-render behavior.
//
//   addBaseInk(recId, baseName)
//     Tap-handler for the four base chips (EZP WHT / 1/4 BB / 1/2 BB /
//     FULL BB). True toggle: tap when not added → adds, tap when already
//     added → removes. Match by Pantone Number (not record ID) so prev-
//     imprint-inherited bases also toggle correctly.
//
//   addTbaSlot(recId)
//     Tap-handler for "+ Add slot (TBA)" button and for placeholder slot
//     taps. Each call creates a fresh Inks record — see "blank canvas"
//     model in the sessionTbaLabel comment above. Multiple TBA slots on
//     one imprint = multiple distinct Inks records, each with the same
//     Pantone Number value ("TBA M/D"). They get their real values later
//     when Ink Queue (v67+) PATCHes the record's Pantone Number / Type /
//     Recipe in place. Record identity persists for the life of the imprint.
//
//   mintTbaSlot()
//     Promise resolving to { id, label }. Live: POSTs a fresh Inks record
//     with the session label. Preview: synthesizes a unique
//     preview-tba-{ts}-{rand} ID (the preview-* prefix is filtered out of
//     all Airtable PATCH payloads so it can never leak).
// ============================================================================

function addBaseInk(recId, baseName) {
  var inkRecId = BASE_INK_IDS[baseName];
  if (!inkRecId) {
    showToast('Unknown base: ' + baseName, true);
    return;
  }

  // v17: Toggle behavior. Find any committed ink on this imprint whose
  // Pantone Number matches the base name (covers both our hardcoded record
  // ID and any record that was seeded from a previous imprint with the same
  // base name but a different record ID). If found, remove it. If not, add.
  var rec = ALL.find(function(r) { return r.id === recId; });
  if (!rec) return;
  var byId = inkChipCache[recId] || {};
  var nameUpper = String(baseName).toUpperCase();
  var existingIid = null;
  (rec.inkIds || []).some(function(iid) {
    var fields = byId[iid] || {};
    var pn = fields['fld00EdkjL43ybgVV'] || fields['fldojKv3gqT312q2R'];
    if (pn && String(pn).toUpperCase() === nameUpper) {
      existingIid = iid;
      return true;
    }
    // Fallback: match by record ID if we don't have field data cached yet
    if (iid === inkRecId) { existingIid = iid; return true; }
    return false;
  });

  if (existingIid) {
    // Toggle off — remove the base
    removeInkFromImprint(recId, existingIid);
    return;
  }

  // Toggle on — enforce MAX_INKS cap
  if ((rec.inkIds || []).length >= MAX_INKS) {
    showToast('Max ' + MAX_INKS + ' inks per imprint', true);
    return;
  }

  // Synth fields so the row renders with the right Pantone label and (via
  // getPantoneHex) the right swatch color, without needing to wait for the
  // typeahead/loadInkChips fetch path.
  var synth = {};
  synth['fld00EdkjL43ybgVV'] = baseName;
  synth['fldojKv3gqT312q2R'] = baseName;
  addInkById(recId, inkRecId, synth);
}

var TBA_BUSY = {};
function addTbaSlot(recId) {
  // v35: one slot at a time per job — a double tap used to mint two Inks records and link one (an orphan).
  if (TBA_BUSY[recId]) return;
  // v18: enforce MAX_INKS cap before any network work
  var rec = ALL.find(function(r) { return r.id === recId; });
  if (rec && (rec.inkIds || []).length >= MAX_INKS) {
    showToast('Max ' + MAX_INKS + ' inks per imprint', true);
    return;
  }
  TBA_BUSY[recId] = true;
  var btn = document.getElementById('add-slot-btn-' + recId); if (btn) btn.classList.add('sp-saving');
  // v20: The values below ARE the actual values on the new Inks record —
  // not "synth" placeholder data. Pantone Number = "TBA M/D" is the real
  // initial state. Ink Queue (v67+) PATCHes this record's Pantone Number
  // when the operator assigns the real ink. We pass them to addInkById's
  // inkFields arg so the chip can render immediately without a refetch.
  mintTbaSlot().then(function(tba) {
    var initialFields = {};
    initialFields['fld00EdkjL43ybgVV'] = tba.label;  // Pantone Number (writable)
    initialFields['fldojKv3gqT312q2R'] = tba.label;  // Name (formula, but kept here for chip render)
    return addInkById(recId, tba.id, initialFields);
  }).catch(function(err) {
    showToast('TBA slot not added: ' + (err && err.message || err), true);
  }).then(function() {
    TBA_BUSY[recId] = false;
    var b = document.getElementById('add-slot-btn-' + recId); if (b) b.classList.remove('sp-saving');
  });
}

// mintTbaSlot — creates one new "blank canvas" Inks record (live) or one
// unique preview-tba-* ID (preview). Each call → one new record. Multiple
// TBA slots on the same imprint = multiple distinct records, all sharing
// the same Pantone Number value ("TBA M/D") set on creation.
//
// Lifecycle of a TBA Inks record:
//   1. Sep taps "+ Add slot (TBA)" → this function POSTs to Inks
//      with Pantone Number = "TBA 4/30". Record born blank.
//   2. Imprint links to it. From the imprint's perspective, it's a
//      regular ink in the stack.
//   3. Operator opens Ink Queue (v67+), sees "TBA 4/30" in the list.
//   4. Operator edits → PATCHes Pantone Number to "301" (or whatever).
//      Same record, identity preserved, Type/Recipe/Manufacturer get
//      filled in over the same lifecycle.
//   5. The record is now a permanent piece of this imprint's history.
//      Never deleted.
//

// all slots minted in the same session — does NOT cache record IDs.
function mintTbaSlot() {
  if (!sessionTbaLabel) {
    var now = new Date();
    sessionTbaLabel = 'TBA ' + (now.getMonth() + 1) + '/' + now.getDate();
  }
  var label = sessionTbaLabel;

  if (!INK_WRITES_ENABLED) {
    // Preview mode: synthesize a UNIQUE preview-tba-* ID per slot.
    // The preview-* prefix is filtered out of PATCH payloads (see addInkById /
    // patchInkOrder / removeInkFromImprint) so it never leaks to Airtable.
    var previewId = 'preview-tba-' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
    return Promise.resolve({ id: previewId, label: label });
  }

  var token = localStorage.getItem('pine_at_key');
  if (!token) return Promise.reject(new Error('no token'));

  // Live mode: POST a new Inks record with Pantone Number = session label.
  // Type / Recipe / Manufacturer left empty — Ink Queue fills those in
  // when the operator assigns the real ink.
  // v22: log full POST so "INVALID_RECORD_ID" / 422 errors are debuggable.
  var __body = { fields: { 'fld00EdkjL43ybgVV': label } };
  console.log('[seps-v22 mintTbaSlot] POST /v0/' + BASE + '/tblyPBucKoDwxDisT', JSON.stringify(__body));
  return fetch('https://api.airtable.com/v0/' + BASE + '/tblyPBucKoDwxDisT', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(__body)
  }).then(function(res) {
    if (!res.ok) return res.json().then(function(e) {
      console.error('[seps-v22 mintTbaSlot] FAIL', res.status, e);
      throw new Error((e.error && (e.error.type + ': ' + e.error.message)) || 'API ' + res.status);
    });
    return res.json();
  }).then(function(newRec) {
    console.log('[seps-v22 mintTbaSlot] OK new id:', newRec.id);
    return { id: newRec.id, label: label };
  });
}

// Append an ink record ID to the Imprint's ordered Inks array, dedupe, PATCH.
// After success, updates inkChipCache and re-renders chips.
// v35 BUGFIX: ink writes for one job run one after another. Two quick adds each built their list from the same
// starting inks, so the second PATCH dropped the first ink. Now each add/remove starts from the result of the last.
var inkChain = {};
function inkSerial(recId, fn) {
  var p = (inkChain[recId] || Promise.resolve()).then(fn, fn);
  inkChain[recId] = p.catch(function() {});

}
function addInkById(recId, inkRecId, inkFields) {
  return inkSerial(recId, function() { return addInkByIdNow(recId, inkRecId, inkFields); });
}
function addInkByIdNow(recId, inkRecId, inkFields) {
  var rec = ALL.find(function(r) { return r.id === recId; });
  if (!rec) return Promise.reject(new Error('record not found'));
  if (!rec.inkIds) rec.inkIds = [];
  if (rec.inkIds.indexOf(inkRecId) >= 0) {
    showToast('Already on this imprint');
    return Promise.resolve();
  }
  // v17: Hard cap. Typeahead, createNewInk, addBaseInk, and addTbaSlot all
  // funnel through here, so this single check covers every add path.
  if (rec.inkIds.length >= MAX_INKS) {
    showToast('Max ' + MAX_INKS + ' inks per imprint', true);
    return Promise.resolve();
  }

  var newIds = rec.inkIds.concat([inkRecId]);

  // Helper: apply the state/UI updates that happen on success
  function applyLocal() {
    rec.inkIds = newIds;
    if (!inkChipCache[recId]) inkChipCache[recId] = {};
    if (inkFields) inkChipCache[recId][inkRecId] = inkFields;
    renderInkChips(recId, inkChipCache[recId]);
  }

  if (!INK_WRITES_ENABLED) {
    // Preview mode: show the add in the UI so the sep can see the flow,
    // but don't persist. Refreshing wipes it.
    applyLocal();
    showToast('Preview only \u2014 writes are off');
    return Promise.resolve();
  }

  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No token', true); return Promise.reject(new Error('no token')); }

  // v12: strip preview-* IDs — they're local-only synthesized chips
  var realIds = newIds.filter(function(iid) { return iid.indexOf('preview-') !== 0; });
  // v23 BUGFIX: Airtable v0 REST multipleRecordLinks expects plain string IDs
  // on WRITE, NOT {id, name} objects. The {id, name} form is what comes back
  // on READ. Sending objects causes 422 INVALID_RECORD_ID with "[object Object]"
  // in the message. This was masking writes since v9 (silently failing).
  var linked = realIds.slice();
  // v22: log full PATCH payload to console so "INVALID_RECORD_ID" is debuggable.
  var __body = { records: [{ id: recId, fields: { 'fldpNCCXTgHyDhvak': linked } }] };
  console.log('[seps-v23 addInkById] PATCH /v0/' + BASE + '/' + TBL, JSON.stringify(__body, null, 2));
  return fetch('https://api.airtable.com/v0/' + BASE + '/' + TBL, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(__body)
  }).then(function(res) {
    if (!res.ok) return res.json().then(function(e){
      console.error('[seps-v23 addInkById] FAIL', res.status, e);
      throw new Error((e.error && (e.error.type + ': ' + e.error.message)) || 'API ' + res.status);
    });
    return res.json();
  }).then(function() {
    applyLocal();
    showToast(savedMsg('\u2713 Ink added'));
  }).catch(function(err) {
    showToast('Ink not added: ' + err.message, true);
    throw err;
  });
}

// Remove an ink from the Imprint's Inks array and PATCH.
function removeInkFromImprint(recId, inkRecId) {
  return inkSerial(recId, function() { return removeInkNow(recId, inkRecId); });
}
function removeInkNow(recId, inkRecId) {
  var rec = ALL.find(function(r) { return r.id === recId; });
  if (!rec || !rec.inkIds) return;
  var newIds = rec.inkIds.filter(function(x) { return x !== inkRecId; });
  if (newIds.length === rec.inkIds.length) return;

  function applyLocal() {
    rec.inkIds = newIds;
    renderInkChips(recId, inkChipCache[recId] || {});
  }

  // v12: preview chips are local-only — never PATCH for them, even in live mode
  var isPreview = inkRecId.indexOf('preview-') === 0;
  if (!INK_WRITES_ENABLED || isPreview) {
    applyLocal();
    if (!INK_WRITES_ENABLED) showToast('Preview only \u2014 writes are off');
    return;
  }

  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No token', true); return; }
  // Strip any remaining preview-* IDs from the PATCH body
  var realIds = newIds.filter(function(iid) { return iid.indexOf('preview-') !== 0; });
  // v23 BUGFIX: send plain string IDs (see addInkById comment above)
  var linked = realIds.slice();

  // v22: full payload logging
  var __body = { records: [{ id: recId, fields: { 'fldpNCCXTgHyDhvak': linked } }] };
  console.log('[seps-v23 removeInkFromImprint] PATCH', JSON.stringify(__body, null, 2));
  return fetch('https://api.airtable.com/v0/' + BASE + '/' + TBL, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(__body)
  }).then(function(res) {
    if (!res.ok) return res.json().then(function(e) {
      console.error('[seps-v23 removeInkFromImprint] FAIL', res.status, e);
      throw new Error((e.error && (e.error.type + ': ' + e.error.message)) || 'API ' + res.status);
    });
    applyLocal();
    showToast(savedMsg('\u2713 Ink removed'));
  }).catch(function(err) { showToast('Ink not removed: ' + (err && err.message || err), true); });
}

// ---- AUTOCOMPLETE SEARCH (single unified search field) --------------------

var inkAcTimers = {};
var inkAcLast = {}; // remembers last { query, results } per imprint for the create-new fallback

// v43: the ink picker searches the whole Inks library on this computer with pine-search.js (any word order, parts of
// words, initials, "pms 185", one typo), best match first. The library (~1,700 inks, 4 fields) loads once in the
// background on the first focus, is cached on this computer for the next page load, and Refresh loads it again.
// Until it has loaded, typing falls back to v42's Airtable search. Writes are unchanged: picking calls addInkById.
var INK_F = { name: 'fldojKv3gqT312q2R', pantone: 'fld00EdkjL43ybgVV', type: 'fldXMM4WvS3SGsliC' };
var INK_LIB = null, INK_LIB_BY = {}, INK_LIB_P = null, INK_LIB_FRESH = false;
var INK_LIB_KEY = 'pine_seps_inklib_v1', INK_RECENT_KEY = 'pine_seps_recent_inks';
var INK_AC_HI = {}, INK_AC_TYPE = {}, INK_AC_ROWS = 120;

function inkTypeOf(f) { var t = f && f[INK_F.type]; return t ? (typeof t === 'object' ? (t.name || '') : String(t)) : ''; }
function inkEntry(id, f) {
  f = f || {};
  var name = f[INK_F.name] || '', pan = String(f[INK_F.pantone] || ''), type = inkTypeOf(f);
  return { id: id, fields: f, name: name, pan: pan, type: type, text: [name, pan, type].join(' ') };
}
function inkLibIndex(recs) {
  INK_LIB_BY = {};
  INK_LIB = recs.map(function(r) { var e = inkEntry(r.id, r.fields); INK_LIB_BY[r.id] = e; return e; })
    .sort(function(a, b) { return inkLabel(a).localeCompare(inkLabel(b), undefined, { numeric: true }) || a.type.localeCompare(b.type); });
}
function inkLibLoad() {
  if (!INK_LIB) {
    try { var c = JSON.parse(localStorage.getItem(INK_LIB_KEY) || 'null'); if (c && c.recs && c.recs.length) inkLibIndex(c.recs); } catch (e) {}
  }
  if (INK_LIB_P) return INK_LIB_P;
  if (INK_LIB_FRESH) return Promise.resolve(INK_LIB);
  var token = localStorage.getItem('pine_at_key');
  if (!token) return Promise.resolve(INK_LIB);
  var all = [];
  function page(offset) {
    var url = 'https://api.airtable.com/v0/' + BASE + '/tblyPBucKoDwxDisT?returnFieldsByFieldId=true&pageSize=100' +
      '&fields%5B%5D=' + INK_F.name + '&fields%5B%5D=' + INK_F.pantone + '&fields%5B%5D=' + INK_F.type + '&fields%5B%5D=' + INK_HEX_FLD +
      (offset ? '&offset=' + encodeURIComponent(offset) : '');
    return fetch(url, { headers: { Authorization: 'Bearer ' + token } }).then(function(res) {
      if (!res.ok) throw new Error('API ' + res.status);
      return res.json();
    }).then(function(d) {
      (d.records || []).forEach(function(r) { all.push({ id: r.id, fields: r.fields || {} }); });
      return d.offset ? page(d.offset) : all;
    });
  }
  INK_LIB_P = page(null).then(function(recs) {
    inkLibIndex(recs); INK_LIB_FRESH = true; INK_LIB_P = null;
    try { localStorage.setItem(INK_LIB_KEY, JSON.stringify({ at: Date.now(), recs: recs })); } catch (e) {}
    // redraw an open picker with the fresh library
    document.querySelectorAll('.add-ink-results.open').forEach(function(el) {
      var id = el.id.replace(/^ai-ac-/, ''), inp = document.getElementById('ai-search-' + id);
      if (inp && document.activeElement === inp) renderInkPicker(id, inp.value);
    });
    return INK_LIB;
  }).catch(function(err) { console.warn('[seps-v43 ink library] not loaded', err); INK_LIB_P = null; return INK_LIB; });
  return INK_LIB_P;
}
function inkRecentIds() { try { return JSON.parse(localStorage.getItem(INK_RECENT_KEY) || '[]') || []; } catch (e) { return []; } }
function inkRemember(inkRecId) {
  if (!inkRecId || inkRecId.indexOf('preview-') === 0) return;
  var ids = inkRecentIds().filter(function(x) { return x !== inkRecId; }); ids.unshift(inkRecId);
  try { localStorage.setItem(INK_RECENT_KEY, JSON.stringify(ids.slice(0, 8))); } catch (e) {}
}
// "Black BB", "Pantone 185": the name without its " - Type" ending (the type has its own tag)
function inkLabel(e) {
  var n = e.name || (e.pan ? 'Pantone ' + e.pan : '');
  if (e.type) n = n.replace(new RegExp('\\s+-\\s+' + e.type.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$'), '');
  if (e.pan && !/^\d/.test(e.pan)) n = n.replace(/^pantone\s+/i, '');
  return n;
}
function inkPrevRunIds(recId) {
  var rec = ALL.find(function(r) { return r.id === recId; }); var out = [];
  if (!rec || !rec.prevImprintIds) return out;
  rec.prevImprintIds.forEach(function(pid) { var pd = prevImprintCache[pid]; ((pd && pd.inkIds) || []).forEach(function(i) { if (out.indexOf(i) < 0) out.push(i); }); });
  return out;
}

// Called on every keystroke and on focus (from the input and from scan chips).
function inkAcSearch(recId, query) {
  var acEl = document.getElementById('ai-ac-' + recId);
  if (!acEl) return;
  var q = (query || '').trim();
  clearTimeout(inkAcTimers[recId]);
  var loading = inkLibLoad();
  if (INK_LIB) { renderInkPicker(recId, q); return; }
  // Library not here yet: v42's Airtable search (2+ letters); the library redraws the list when it arrives.
  if (q.length < 2) {
    acEl.innerHTML = '<div class="ai-row-none">Loading the ink list…</div>'; acEl.classList.add('open'); positionAcResults(recId);
    return;
  }
  inkAcTimers[recId] = setTimeout(function() {
    var token = localStorage.getItem('pine_at_key');
    if (!token) return;
    var safeQ = q.replace(/"/g, '').replace(/\\/g, '');
    var formula = 'OR(' +
      'FIND(LOWER("' + safeQ + '"),LOWER({fldojKv3gqT312q2R})),' +
      'FIND(LOWER("' + safeQ + '"),LOWER({fld00EdkjL43ybgVV}))' +
    ')';
    var url = 'https://api.airtable.com/v0/' + BASE + '/tblyPBucKoDwxDisT' +
      '?returnFieldsByFieldId=true' +
      '&fields%5B%5D=fldojKv3gqT312q2R' +   // Name (formula)
      '&fields%5B%5D=fld00EdkjL43ybgVV' +   // Pantone Number (text)
      '&fields%5B%5D=fldXMM4WvS3SGsliC' +   // Ink Type (singleSelect)
      '&pageSize=10' +
      '&filterByFormula=' + encodeURIComponent(formula);
    fetch(url, { headers: { Authorization: 'Bearer ' + token } })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (INK_LIB) return;   // the library won the race and has redrawn
        var recs = (data && data.records) || [];
        renderInkPicker(recId, q, recs.map(function(r) { return inkEntry(r.id, r.fields); }));
      })
      .catch(function() {
        acEl.innerHTML = '<div class="ai-row-none">Search failed — check token</div>';
        acEl.classList.add('open');
      });
  }, 280);
}

function inkRowHtml(recId, e, existingIds) {
  var hex = getPantoneHex(e.name, e.fields, e.pan);
  var already = existingIds.indexOf(e.id) >= 0;
  return '<div class="ai-row' + (already ? ' is-on-job' : '') + '" role="option" data-ink="' + escHtml(e.id) + '"' +
    (already ? ' aria-disabled="true" title="Already on this job"' : ' onmousedown="event.preventDefault()" onclick="inkAcSelect(\'' + escHtml(recId) + '\',\'' + escHtml(e.id) + '\');event.stopPropagation()"') + '>' +
    '<span class="ai-row-swatch' + (hex ? '' : ' ink-chip-empty') + '"' + (hex ? ' style="background:' + hex + '"' : '') + '></span>' +
    '<span class="ai-row-name">' + escHtml(inkLabel(e)) + (already ? ' ✓' : '') + '</span>' +
    (e.type ? '<span class="ai-row-type">' + escHtml(e.type) + '</span>' : '') +
  '</div>';
}

// The dropdown: type chips · (empty box) Recent + Previous run + all inks · (typed) best matches · + Create new.
function renderInkPicker(recId, query, serverRecs) {
  var acEl = document.getElementById('ai-ac-' + recId);
  if (!acEl) return;
  var q = (query || '').trim();
  var rec = ALL.find(function(r) { return r.id === recId; });
  var existingIds = (rec && rec.inkIds) || [];
  var lib = serverRecs || INK_LIB || [];
  var type = serverRecs ? '' : (INK_AC_TYPE[recId] || '');
  var html = '', results;

  // Type chips from the library, most used first
  if (!serverRecs && INK_LIB) {
    var counts = {};
    INK_LIB.forEach(function(e) { if (e.type) counts[e.type] = (counts[e.type] || 0) + 1; });
    var types = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; });
    if (types.length > 1) {
      html += '<div class="ai-types" role="group" aria-label="Ink type">' + [''].concat(types).map(function(t) {
        return '<button type="button" class="ai-type' + (t === type ? ' is-on' : '') + '" tabindex="-1" onmousedown="event.preventDefault()" onclick="setInkAcType(\'' + escHtml(recId) + '\',\'' + escHtml(t) + '\');event.stopPropagation()">' + (t ? escHtml(t) : 'All') + '</button>';
      }).join('') + '</div>';
    }
  }
  var pool = type ? lib.filter(function(e) { return e.type === type; }) : lib;

  if (!q) {
    var shown = {};
    var section = function(title, ids) {
      var es = ids.map(function(i) { return INK_LIB_BY[i]; }).filter(function(e) { return e && !shown[e.id] && (!type || e.type === type); });
      if (!es.length) return;
      html += '<div class="ai-sec">' + title + '</div>';
      es.forEach(function(e) { shown[e.id] = 1; html += inkRowHtml(recId, e, existingIds); });
    };
    section('Recent', inkRecentIds());
    section('Previous run', inkPrevRunIds(recId));
    var rest = pool.filter(function(e) { return !shown[e.id]; });
    html += '<div class="ai-sec">' + (type ? escHtml(type) : 'All inks') + ' <span class="ai-sec-n">' + rest.length + '</span></div>';
    rest.slice(0, INK_AC_ROWS).forEach(function(e) { html += inkRowHtml(recId, e, existingIds); });
    if (rest.length > INK_AC_ROWS) html += '<div class="ai-row-none">Type to find the other ' + (rest.length - INK_AC_ROWS) + '</div>';
    results = [];
  } else {
    results = serverRecs ? pool : (window.PineSearch ? PineSearch.filter(q, pool, function(e) { return e.text; }) : pool);
    if (!results.length) html += '<div class="ai-row-none">No match in Inks library</div>';
    results.slice(0, INK_AC_ROWS).forEach(function(e) { html += inkRowHtml(recId, e, existingIds); });
    if (results.length > INK_AC_ROWS) html += '<div class="ai-row-none">' + (results.length - INK_AC_ROWS) + ' more — keep typing</div>';
  }
  inkAcLast[recId] = { query: q, results: results.map(function(e) { return { id: e.id, fields: e.fields }; }) };

  // Create-new fallback, as in v42: unless an ink's Pantone Number is exactly what was typed
  var exactMatch = results.some(function(e) { return e.pan && e.pan.toLowerCase() === q.toLowerCase(); });
  if (!exactMatch && q.length >= 2) {
    html += '<div class="ai-row-create" role="option" data-create="1" onmousedown="event.preventDefault()" onclick="createNewInk(\'' + escHtml(recId) + '\',\'' + escHtml(q) + '\');event.stopPropagation()">+ Create new ink: "' + escHtml(q) + '"</div>';
  }

  acEl.innerHTML = html;
  acEl.classList.add('open');
  acEl.scrollTop = 0;
  INK_AC_HI[recId] = q ? 0 : -1;   // the best match is highlighted, so Enter picks it
  inkAcPaint(recId);
  positionAcResults(recId);
}
function setInkAcType(recId, t) {
  INK_AC_TYPE[recId] = (INK_AC_TYPE[recId] === t) ? '' : t;
  var inp = document.getElementById('ai-search-' + recId);
  renderInkPicker(recId, inp ? inp.value : '');
}
function inkAcItems(recId) {
  var acEl = document.getElementById('ai-ac-' + recId);

}
function inkAcPaint(recId, scroll) {
  var items = inkAcItems(recId), hi = INK_AC_HI[recId];

}
// ↑/↓ move the highlight, Enter picks it, Esc closes the list.
function inkAcKey(recId, e) {
  var acEl = document.getElementById('ai-ac-' + recId);
  var open = acEl && acEl.classList.contains('open');
  if (e.key === 'Escape') {
    if (open) { e.preventDefault(); e.stopPropagation(); acEl.classList.remove('open'); }
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); e.stopPropagation();
    if (!open) { inkAcSearch(recId, e.target.value); return; }
    var items = inkAcItems(recId); if (!items.length) return;
    var hi = INK_AC_HI[recId] == null ? -1 : INK_AC_HI[recId];
    hi = e.key === 'ArrowDown' ? Math.min(items.length - 1, hi + 1) : Math.max(0, hi - 1);
    INK_AC_HI[recId] = hi; inkAcPaint(recId, true);
    return;
  }

    e.preventDefault();

// v12: position the fixed-position autocomplete dropdown relative to its input.
// Auto-flips above the input if there's no room below. v43: up to 60% of the screen tall, at least 320px wide.
function positionAcResults(recId) {
  var acEl = document.getElementById('ai-ac-' + recId);
  var inputEl = document.getElementById('ai-search-' + recId);
  if (!acEl || !inputEl) return;
  var r = inputEl.getBoundingClientRect();
  var spaceBelow = window.innerHeight - r.bottom;
  var spaceAbove = r.top;
  var cap = Math.round(window.innerHeight * 0.6);
  var want = Math.min(cap, acEl.scrollHeight || cap);
  var w = Math.min(Math.max(r.width, 320), window.innerWidth - 16);
  acEl.style.width = w + 'px';
  acEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 8 - w)) + 'px';
  if (spaceBelow >= want + 8 || spaceBelow >= spaceAbove) {
    acEl.style.top = (r.bottom + 2) + 'px';
    acEl.style.maxHeight = Math.min(cap, Math.max(120, spaceBelow - 12)) + 'px';
  } else {
    var hA = Math.min(cap, Math.max(120, spaceAbove - 12));
    acEl.style.top = Math.max(8, r.top - Math.min(want, hA) - 2) + 'px';
    acEl.style.maxHeight = hA + 'px';
  }
}

function inkAcSelect(recId, inkRecId) {
  // Pull the fields we just fetched so we can cache them for immediate render
  var last = inkAcLast[recId];
  var fields = null;
  if (last && last.results) {
    var hit = last.results.find(function(r) { return r.id === inkRecId; });
    if (hit) fields = hit.fields || null;
  }
  if (!fields && INK_LIB_BY[inkRecId]) fields = INK_LIB_BY[inkRecId].fields;   // v43: a Recent / Previous run row
  inkRemember(inkRecId);
  // Clear the search UI
  var sEl = document.getElementById('ai-search-' + recId);
  var acEl = document.getElementById('ai-ac-' + recId);
  if (sEl) sEl.value = '';
  if (acEl) { acEl.classList.remove('open'); acEl.innerHTML = ''; }

  addInkById(recId, inkRecId, fields);
}

// ---- CREATE NEW INK (POST to Inks table) ----------------------------------

// Creates a new Inks record with only the Pantone Number set. Type, Mfr, and
// Recipe are deliberately left blank — per architecture, Ink Dept fills those
// in the Ink Queue app later. Name is a formula field in the Inks table and
// is populated automatically.
function createNewInk(recId, pantoneValue) {
  var v = (pantoneValue || '').trim();
  if (!v) return;

  // Close the autocomplete immediately
  var acEl = document.getElementById('ai-ac-' + recId);
  if (acEl) acEl.classList.remove('open');
  var sEl = document.getElementById('ai-search-' + recId);
  if (sEl) sEl.value = '';

  if (!INK_WRITES_ENABLED) {
    // v12: Preview mode — synthesize a preview-{ts}-{rnd} ID and route through
    // addInkById so the chip renders like any other ink. The preview-* prefix
    // is filtered out of any PATCH body (see patchInkOrder / addInkById /
    // removeInkFromImprint), so it can never leak to Airtable.
    var previewId = 'preview-' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
    var synth = {};
    synth['fld00EdkjL43ybgVV'] = v;
    synth['fldojKv3gqT312q2R'] = v;
    addInkById(recId, previewId, synth);
    return;
  }

  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No token', true); return; }

  // v22: log POST body
  var __body = { fields: { 'fld00EdkjL43ybgVV': v } };
  console.log('[seps-v22 createNewInk] POST /v0/' + BASE + '/tblyPBucKoDwxDisT', JSON.stringify(__body));
  fetch('https://api.airtable.com/v0/' + BASE + '/tblyPBucKoDwxDisT', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(__body)
  }).then(function(res) {
    if (!res.ok) return res.json().then(function(e){
      console.error('[seps-v22 createNewInk] FAIL', res.status, e);
      throw new Error((e.error && (e.error.type + ': ' + e.error.message)) || 'API ' + res.status);
    });
    return res.json();
  }).then(function(newRec) {
    console.log('[seps-v22 createNewInk] OK new id:', newRec.id);
    // Synthesize fields for the cache — Name is a formula we don't have yet,
    // so use the pantone value as a placeholder until next refresh.
    var synth = {};
    synth['fld00EdkjL43ybgVV'] = v;
    synth['fldojKv3gqT312q2R'] = 'Pantone ' + v;
    addInkById(recId, newRec.id, synth);
    INK_LIB_FRESH = false;   // v43: the next focus reloads the ink list, with the new ink
  }).catch(function(err) {
    showToast('Create failed: ' + err.message, true);
  });
}

// ---- PDF PANTONE SCAN ------------------------------------------------------

// Common base names we expect to see written on sep PDFs. Matched case-insensitive.
// Pantone numeric matches run first; these run after and dedupe.
var SCAN_BASE_NAMES = [
  'EZP WHT', 'EZP WHITE',
  '1/2 BB', '1/4 BB', 'FULL BB',
  'REFLEX BLUE',
  'WARM RED', 'WARM GRAY',
  'BLACK', 'WHITE',
  'PROCESS BLUE', 'PROCESS YELLOW', 'PROCESS MAGENTA', 'PROCESS CYAN',
  'RUBINE RED', 'RHODAMINE RED', 'PURPLE', 'VIOLET', 'ORANGE',
  'GREEN', 'RED', 'BLUE', 'YELLOW'
];

// scanPdfForPantones — tap the Scan Proof PDF button. Fetches the same
// signed URL we use for the proof viewer, loads it with PDF.js, extracts
// text from every page, regex-matches Pantone numbers and base names,
// and renders them as tappable chips.
function scanPdfForPantones(recId) {
  var btn = document.getElementById('scan-btn-' + recId);
  var chipsEl = document.getElementById('scan-chips-' + recId);
  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No token', true); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Scanning\u2026'; }
  var stripEl = document.getElementById('scan-strip-' + recId); if (stripEl) stripEl.classList.remove('collapsed');  // v35: show what the scan finds
  if (chipsEl) chipsEl.innerHTML = '';

  // Fetch the signed proof URL fresh (Airtable CDN URLs expire)
  var url = 'https://api.airtable.com/v0/' + BASE + '/' + TBL +
    '?fields%5B%5D=' + F.proof +
    '&filterByFormula=' + encodeURIComponent("RECORD_ID()='" + recId + "'") +
    '&returnFieldsByFieldId=true&pageSize=1';

  fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var rec = data.records && data.records[0];
      var raw = rec && rec.fields && rec.fields[F.proof];
      var freshUrl = null, isPDF = false;

      if (raw && raw.valuesByLinkedRecordId) {
        Object.values(raw.valuesByLinkedRecordId).forEach(function(arr) {
          if (Array.isArray(arr)) arr.forEach(function(a) {
            if (a && a.url && !freshUrl) { freshUrl = a.url; isPDF = a.type === 'application/pdf'; }
          });
        });
      } else if (Array.isArray(raw)) {
        raw.forEach(function(a) {
          if (a && a.url && !freshUrl) { freshUrl = a.url; isPDF = a.type === 'application/pdf'; }
        });
      }

      if (!freshUrl) throw new Error('No proof on file');
      if (!isPDF) throw new Error('Proof is not a PDF');

      pmInit(); // ensures PDF.js worker is configured
      return pdfjsLib.getDocument(freshUrl).promise;
    })
    .then(function(doc) {
      var pagePromises = [];
      for (var i = 1; i <= doc.numPages; i++) {
        pagePromises.push(doc.getPage(i).then(function(page) {
          return page.getTextContent().then(function(tc) {
            return tc.items.map(function(it) { return it.str; }).join(' ');
          });
        }));
      }
      return Promise.all(pagePromises);
    })
    .then(function(pageTexts) {
      var fullText = pageTexts.join(' ');
      var matches = extractPantonesFromText(fullText);
      if (btn) { btn.disabled = false; btn.textContent = 'Rescan'; }
      if (!matches.length) {
        if (chipsEl) chipsEl.innerHTML = '<div class="scan-empty">No Pantones or bases found in the PDF.</div>';
        return;
      }
      renderScanChips(recId, matches);
    })
    .catch(function(err) {
      if (btn) { btn.disabled = false; btn.textContent = 'Scan proof PDF'; }
      if (chipsEl) chipsEl.innerHTML = '<div class="scan-empty">Scan failed: ' + escHtml(err.message) + '</div>';
    });
}

// Regex-pull Pantone numbers (3-4 digits, optional letter suffix) and base
// names. Dedupes on a normalized key. Returns [{ display, query }] array where
// `display` is what shows on the chip and `query` is what we search Airtable
// for when the chip is tapped.
function extractPantonesFromText(text) {
  if (!text) return [];
  var found = {};
  var order = [];

  function add(display, query) {
    var key = query.toLowerCase();
    if (found[key]) return;
    found[key] = true;
    order.push({ display: display, query: query });
  }

  // Numeric Pantones — 3 or 4 digits, optional trailing C/U/M letter, with or
  // without the word "Pantone" or "PMS" in front. The \b at the start avoids
  // catching things like "95%" -> "95", and the trailing lookaround avoids
  // pulling years like 2024 from dates.
  var numRe = /(?:\b(?:pantone|pms)\s+)?\b(\d{3,4})\s*([CUM])?\b/gi;
  var m;
  while ((m = numRe.exec(text)) !== null) {
    var num = m[1];
    var letter = m[2] ? m[2].toUpperCase() : '';
    // Filter: 3-4 digit number, plausible Pantone range. Real Pantones run
    // roughly 100-9999. Skip bare numbers outside that range without a letter
    // suffix or "Pantone/PMS" prefix.
    var hadPrefix = /pantone|pms/i.test(m[0]);
    var n = parseInt(num, 10);
    if (!hadPrefix && !letter) {
      // Bare number — tighten the filter to reduce false positives
      if (n < 100 || n > 999 && num.length !== 4) continue;
      if (n === 0) continue;
    }
    add('Pantone ' + num + (letter ? ' ' + letter : ''), num);
  }

  // Named bases / common colors
  var upper = text.toUpperCase();
  SCAN_BASE_NAMES.forEach(function(name) {
    // Word-boundary match. Special-case names with slashes.
    var esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(^|[^A-Z0-9])' + esc + '([^A-Z0-9]|$)');
    if (re.test(upper)) add(name, name);
  });

  return order;
}

function renderScanChips(recId, matches) {
  var el = document.getElementById('scan-chips-' + recId);
  if (!el) return;
  var html = '';
  matches.forEach(function(m, idx) {
    var hex = getPantoneHex(m.display, null, m.query);
    html += '<button type="button" class="scan-chip" data-query="' + escHtml(m.query) + '" onclick="scanChipTap(\'' + escHtml(recId) + '\',this)">' +
      '<span class="scan-chip-swatch' + (hex ? '' : ' ink-chip-empty') + '" style="' + (hex ? 'background:' + hex : '') + '"></span>' +
      escHtml(m.display) +
    '</button>';
  });
  el.innerHTML = html;
  refreshScanChipStates(recId);
}

// When a scan chip is tapped, look up the Inks table for a matching record.
// If exactly one match, add it immediately. If multiple, stuff the query into
// the Add Ink search field and open the autocomplete so the separator picks.
function scanChipTap(recId, chipEl) {
  var query = chipEl.getAttribute('data-query');
  if (!query) return;
  var token = localStorage.getItem('pine_at_key');
  if (!token) { showToast('No token', true); return; }

  chipEl.style.opacity = '.6';

  var safeQ = query.replace(/"/g, '').replace(/\\/g, '');
  // Exact-match attempt first: Pantone Number equals the query, OR Name equals
  // "Pantone <query>".
  var formula = 'OR(' +
    'LOWER({fld00EdkjL43ybgVV})=LOWER("' + safeQ + '"),' +
    'LOWER({fldojKv3gqT312q2R})=LOWER("pantone ' + safeQ + '"),' +
    'LOWER({fldojKv3gqT312q2R})=LOWER("' + safeQ + '")' +
  ')';
  var url = 'https://api.airtable.com/v0/' + BASE + '/tblyPBucKoDwxDisT' +
    '?returnFieldsByFieldId=true' +
    '&fields%5B%5D=fldojKv3gqT312q2R' +
    '&fields%5B%5D=fld00EdkjL43ybgVV' +
    '&fields%5B%5D=fldXMM4WvS3SGsliC' +
    '&pageSize=10' +
    '&filterByFormula=' + encodeURIComponent(formula);

  fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var recs = (data && data.records) || [];
      chipEl.style.opacity = '';
      if (recs.length === 1) {
        addInkById(recId, recs[0].id, recs[0].fields).then(function() {
          refreshScanChipStates(recId);
        });
      } else if (recs.length > 1) {
        // Drop into the search field so the separator can pick
        var sEl = document.getElementById('ai-search-' + recId);
        if (sEl) {
          sEl.value = query;
          sEl.focus();
          inkAcSearch(recId, query);
        }
      } else {
        // No match — open the create-new flow via the search field
        var sEl2 = document.getElementById('ai-search-' + recId);
        if (sEl2) {
          sEl2.value = query;
          sEl2.focus();
          inkAcSearch(recId, query);
        }
      }
    })
    .catch(function() {
      chipEl.style.opacity = '';
      showToast('Lookup failed', true);
    });
}

// Cross-check scan chips against the imprint's current inkIds and dim any
// whose Pantone Number/name matches a currently-linked ink. Also updates the
// scan strip's summary text and auto-collapses when all chips are added.
function refreshScanChipStates(recId) {
  var chipsEl = document.getElementById('scan-chips-' + recId);
  if (!chipsEl) return;
  var rec = ALL.find(function(r) { return r.id === recId; });
  if (!rec) return;
  var cache = inkChipCache[recId] || {};
  var addedKeys = {};
  (rec.inkIds || []).forEach(function(iid) {
    var f = cache[iid] || {};
    var pantone = f['fld00EdkjL43ybgVV'] || '';
    var name = f['fldojKv3gqT312q2R'] || '';
    if (pantone) addedKeys[pantone.toLowerCase()] = true;
    if (name) {
      addedKeys[name.toLowerCase()] = true;
      // "Pantone 186" -> also register "186"
      var stripped = name.replace(/^pantone\s+/i, '').trim();
      if (stripped) addedKeys[stripped.toLowerCase()] = true;
    }
  });

  var chipNodes = chipsEl.querySelectorAll('.scan-chip');
  var total = chipNodes.length;
  var addedCount = 0;
  chipNodes.forEach(function(c) {
    var q = (c.getAttribute('data-query') || '').toLowerCase();
    if (addedKeys[q] || addedKeys['pantone ' + q]) {
      c.classList.add('added');
      addedCount++;
    } else {
      c.classList.remove('added');
    }
  });

  // Update summary text
  var sumEl = document.getElementById('scan-summary-' + recId);
  var strip = document.getElementById('scan-strip-' + recId);
  if (sumEl) {
    if (total === 0) {
      sumEl.textContent = '';
      sumEl.classList.remove('all-added');
    } else if (addedCount === total) {
      sumEl.textContent = '\u00b7 ' + total + ' found, all added \u2713';
      sumEl.classList.add('all-added');
    } else {
      sumEl.textContent = '\u00b7 ' + addedCount + ' / ' + total + ' added';
      sumEl.classList.remove('all-added');
    }
  }

  // Auto-collapse when we have chips AND all of them are added — but only
  // auto-collapse once per scan, so the sep can re-expand manually and have
  // it stay open. The flag lives on the strip element itself.
  if (strip && total > 0 && addedCount === total && !strip.dataset.autoCollapsed) {
    strip.dataset.autoCollapsed = '1';
    strip.classList.add('collapsed');
  }
  // If any chip becomes un-added again (e.g. removed via \u2715), clear the
  // auto-collapse flag so the next "all added" event can re-trigger it.
  if (strip && addedCount < total) {
    delete strip.dataset.autoCollapsed;
  }
}

// Manual toggle — chevron / header click. Clears the auto-collapse flag so
// manual expansion is sticky until a future all-added event.
function toggleScanStrip(recId) {
  var strip = document.getElementById('scan-strip-' + recId);
  if (!strip) return;
  strip.classList.toggle('collapsed');
  // Any manual toggle takes precedence over auto-collapse until inks change
  delete strip.dataset.autoCollapsed;
}

// ---- v35: bar, ⚙ menu, practice, keyboard, self-update, start-up ------------------------------------------------
function noTokenMsg() {
  document.getElementById('root').innerHTML = '<div class="msg err"><b>Airtable token needed</b>Paste your token in the ⚙ menu at the top right.</div>';
  showMenu(true);
}
// The ⚙ menu holds the token and the practice switch.
function showMenu(on, force) {
  var m = document.getElementById('menu');
  if (!on && !force && !token()) return;  // stays open until there's a token
  m.hidden = !on;
  if (!on) setTimeout(function() { livePoll(); }, 0);   // v50: checks wait while the menu is open
  document.getElementById('gearBtn').setAttribute('aria-expanded', on);
  if (on) { var i = document.getElementById('tokenInput'); i.value = token(); if (!token()) setTimeout(function() { i.focus(); }, 0); }
}
document.addEventListener('pointerdown', function(e) {
  if (!document.getElementById('menu').hidden && !e.target.closest('#menu,#gearBtn')) showMenu(false);
});
function syncPractice() {
  document.getElementById('practicePill').hidden = !PRACTICE;
  document.getElementById('practiceHint').textContent = PRACTICE ? 'On — nothing is saved' : 'Off — changes save to Airtable';
  var b = document.getElementById('practiceBtn');
  b.textContent = PRACTICE ? 'Leave practice' : 'Turn on';
  b.setAttribute('aria-pressed', PRACTICE);
}
// Switching reloads, so nothing faked in practice is left on screen (and practice stays in the URL for updates).
function setPractice(on) {
  if (SAVING > 0) { showToast('Still saving — one moment'); return; }
  var u = new URL(location.href);
  if (on) u.searchParams.set('practice', '1'); else u.searchParams.delete('practice');
  location.href = u.toString();
}
// Refresh: read the queue from Airtable again (in place since v50) and look for a new app version.
function refreshAll() {
  if (SAVING > 0 || Object.keys(DONE_BUSY).some(function(k) { return DONE_BUSY[k]; })) { showToast('Still saving — one moment'); return; }
  var a = document.activeElement;
  if (a && a.blur && a.id && a.id.indexOf('notes-') === 0) a.blur();  // save notes first
  if (window.PineUpdate && PineUpdate.check) PineUpdate.check();
  INK_LIB_FRESH = false;   // v43: the ink list reloads on the next pick
  if (!ALL.length) { loadData(); return; }   // nothing loaded yet (first load failed): load it
  refreshInPlace();   // v50: in place — the open job, filters, search and scroll stay
}

// Click a card head to open it; Enter/Space from the keyboard; ↑/↓ between jobs in the two-pane view.
document.addEventListener('click', function(e) {
  var hd = e.target.closest && e.target.closest('[data-open]');
  if (!hd || e.target.closest('button,a,input,select,textarea,img,label')) return;
  openCard(hd.getAttribute('data-open'));
});
document.addEventListener('keydown', function(e) {
  var t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('data-open') && t === document.activeElement) {
    e.preventDefault(); openCard(t.getAttribute('data-open')); return;
  }
  if (e.key === 'Escape') {
    if (document.getElementById('pmModal').classList.contains('open')) { pmClose(); return; }
    if (!document.getElementById('dp').hidden) { closeDrivePicker(); return; }   // v46
    if (!document.getElementById('menu').hidden) { showMenu(false); return; }
  }
  if ((e.key !== 'ArrowDown' && e.key !== 'ArrowUp') || !isWide() || viewMode !== 'queue' || !shownIds.length) return;
  var a = document.activeElement;
  if (!document.getElementById('dp').hidden) return;   // v46: the picker is open
  if (a && (/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) || a.closest('#splitDetail,#menu,.pm'))) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  var i = shownIds.indexOf(openId), n = i + (e.key === 'ArrowDown' ? 1 : -1);
  if (n < 0 || n >= shownIds.length) return;
  e.preventDefault(); openCard(shownIds[n], true);
  var hd = document.querySelector('#ic-' + shownIds[n] + ' [data-open]'); if (hd) hd.focus({ preventScroll: true });
});

// Self-update: busy (show "Update now" instead of reloading) while a save runs, someone is typing or picking in the
// open job, the link box / ⚙ menu / proof viewer is open, a job is open in place, or the search has text.
window.pineBusy = function() {
  try {
    var a = document.activeElement;
    var linkOpen = !document.getElementById('dp').hidden;   // v46: the Drive picker
    return SAVING > 0 || UP_BUSY > 0 || Object.keys(DONE_BUSY).some(function(k) { return DONE_BUSY[k]; }) || Object.keys(TBA_BUSY).some(function(k) { return TBA_BUSY[k]; })
      || !!(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.id !== 'search')
      || linkOpen || !document.getElementById('menu').hidden || document.getElementById('pmModal').classList.contains('open')
      || (!isWide() && !!openId) || !!document.getElementById('search').value.trim();
  } catch (e) { return true; }
};

function boot() {
  syncPractice();
  if (!token()) { noTokenMsg(); return; }
  loadData();
}
boot();
</script>

<script>
// v40: print notes fit their text (Stephen: the 2-line box cut the note off). The box sizes to the note, up to about
// 8 lines, then scrolls; empty it's one line. Runs on every redraw and while typing.
(function(){
  function fit(t){ if(!t||!t.classList||!t.classList.contains('inotes')) return; t.style.height='40px';   /* v42: was 'auto', which is 2 rows, so a one-line note was 59px (Ink: 40) */ var h=Math.min(t.scrollHeight+2, 190); t.style.height=h+'px'; t.style.overflowY = t.scrollHeight+2>190 ? 'auto' : 'hidden'; }
  function all(){ document.querySelectorAll('textarea.inotes').forEach(fit); }
  document.addEventListener('input', function(e){ fit(e.target); }, true);
  document.addEventListener('focusin', function(e){ fit(e.target); }, true);
  document.addEventListener('focusout', function(e){ setTimeout(function(){ fit(e.target); }, 0); }, true);
  new MutationObserver(function(){ all(); }).observe(document.body, { childList:true, subtree:true });
  window.addEventListener('resize', all);
  all();
})();
</script>
