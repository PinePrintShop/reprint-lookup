<!-- v114 (2026-10-28): no browser pop-ups left (Stephen: "Do the 5 bugs first").
     1. Reprints › "+ New vendor / warehouse…" opens a name field right where the warehouse list was (Add / Cancel; Enter adds,
        Esc cancels). It was a browser prompt(). A name that's already a supplier is just picked. Practice mode still saves nothing.
     2. The Airtable token is a field in the ⚙ menu (paste, Save), as in Operator. It was a browser prompt() too.
-->
<!-- v113 (2026-10-27): Adjust sizes (Stephen: "allow purchasing to adjust sizes they are ordering... every now and again
     something is out of size and they need to adjust it and it should then write back to airtable").
     Each open or in-cart line has "✎ Adjust sizes": Was / Now / Change per size, the total before and after, and a plain
     warning when the customer's invoice changes (a different total, or a different number of 2XL-and-up pieces).
     Save re-reads the line from Airtable first (stops if someone else changed the sizes), then PATCHes only the sizes that
     changed, plus one line in Order Notes ("Sizes changed 10/27 (purchasing): L 10→7, XL 5→8 · why"). Extras on a size that
     goes to 0 are cleared. "Undo" puts the old sizes and notes back. Practice mode sends nothing.
-->
<!-- v112 (2026-10-20): top-bar cleanup to match the Pine standard bar. <body class="p-app"> (the kit's page base), the
     leftover .top .p-mark size rule and the old --yellow:#E8E832 token are gone (the one fallback use is now var(--p-yellow)),
     and the narrow-width views row comes from pine-style-v2.css instead of a copy here. No behaviour changes.
-->
<!-- v111 (2026-10-19): three fixes.
     1. Half-saved orders: "✓ Ordered" used to say "That cart was not marked ordered" whenever any write failed, even when
        some lines had already been saved and handed to Receiving. Now the message lists which lines saved and which did
        not; the saved ones leave the cart, the failed ones stay, and "Retry" redoes only those.
     2. Quoted vs buying: each line shows what Price-O-Matic quoted for the blank (Orders > Quotes > Quote Lines, Quote
        Data) next to what we're paying ("Quoted $6.20 SanMar · buying $6.49 S&S (−$29.00 on this order)"). The quoted
        vendor's warehouses go first when they have the whole line in stock, marked "Quoted".
     3. "Are you sure?" questions use the Pine box (pine-confirm.js) instead of the browser's confirm().
-->
<!-- v110 (2026-10-17): weekend cleanup. The browser pop-ups (alert) for problems — "Could not save freight", "Enter the
     PO # first", "Each row needs a warehouse and a PO #", failed saves — are now the black Pine message bar at the bottom.
     A problem stays up (red edge) until you tap OK, so it can't be missed; a normal note fades after 3 seconds. The old
     green note is now the same black bar (Pine colours). The "are you sure" questions are unchanged.
-->
<!-- v109 (2026-10-15): Mike's two asks.
     1. Group by: Order / Garment (toggle above the left list, remembered on this computer). Garment = the same style across
        every order, split by color: a "To buy" grid per color (each order's sizes + the combined total), one cart pick for all
        the color's open lines, and every line card (with its order) underneath, so mark ordered / extras / split / notes all
        work as in order view. A line card says when the same garment is on another order. Carts merge the same garment from
        different orders into one combined size grid (what gets typed into the vendor site).
     2. Color bug: "Dark Grey Heather" matched SanMar's "Dark Grey" (a prefix match), so price + stock came from the wrong
        colorway and the line said to change Airtable. Exact name now always wins; "Heather" (and triblend, marble…) has to
        agree on both sides; SanMar's catalog colors are turned into its full names (productinfo); a cut-short name only
        counts when it's cut mid-word. "Fix in Airtable" isn't offered when another vendor has the exact name. -->
<!-- v108 (2026-10-15): desktop first (Stephen: Purchasing is a desktop app). At 1400px and wider, Past orders, Invoice check
     and Reprints are two panes (kit .p-split): the list on the left, the picked PO / cart / reprint on the right, each with
     its own scroll; ↑/↓ move between them. Below 1400px cards still open in place, full width with 24px gutters.
     Ordering's three columns get wider on big screens. Carts and "Ordered today" lose their black header bands.
     ⚙ uses the kit's .p-menu; the Past orders chips share the line with the search (.p-chips-inline). -->
<!-- v107 (2026-10-15): Pine page kit. Bar = logo · name · version · practice · views (Ordering / Invoice check / Past orders /
     Reprints) · ↻ Refresh · ⚙ (token + practice live in ⚙). Past orders, Invoice check and Reprints use the kit list card (.p-lc,
     opens in place, one at a time); Past orders gets one filter row (search + To review / All chips instead of the checkbox).
     One yellow button per screen: Order all (Ordering, Invoice check), the open reprint's Mark replacement ordered (Reprints).
     Fix: practice mode keeps its own cart, so a practice "order" can't leave a live line looking placed. -->
<style>
/* ============================================================
   PINE PURCHASING v91 — live (styles from the flow mockup)
   Left → right: Orders (by due date) → This order (sizes, extras,
   warehouse + arrival, split, cost) → Carts per warehouse → PO + Ordered.
   Plan: notes/purchasing-flow.md
   ============================================================ */
:root{
  --bg:#F2F2EE; --surface:#fff; --soft:#F8F8F5;
  --border:#E5E5E0; --border-dk:#D0D0CA;
  --green:#1e6b45; --green-lt:#e8f5ee; --green-dk:#144d31;
  --text:#0D0D0B; --muted:#888880; --muted-lt:#BBBBB5;
  --red:#c0392b; --red-bg:#fdf2f2; --red-bd:#f5c6c6;
  --amb:#b7791f; --amb-bg:#fffbeb; --amb-bd:#fde68a;
  --ink:#0A0A08;
  --sans:Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.brand small{font-size:12px;color:var(--muted-lt);margin-left:6px;vertical-align:top}
.mock{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amb);background:var(--amb-bg);border:1px solid var(--amb-bd);padding:4px 9px;border-radius:20px}

.cols{flex:1;display:grid;grid-template-columns:270px minmax(0,1fr) 340px;min-height:0}
.col{overflow:auto;min-height:0}
.col h2{position:sticky;top:0;z-index:2;background:var(--bg);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 16px 8px;display:flex;align-items:center;gap:8px}
.col h2 .n{margin-left:auto;color:var(--text)}
.c-orders{border-right:1px solid var(--border)}
.c-carts{border-left:1px solid var(--border);background:#EDEDE8}
.c-carts h2{background:#EDEDE8}

/* ---- orders list ---- */
.duehdr{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 16px 4px}
.ord{display:block;width:100%;text-align:left;border:none;background:var(--surface);border-left:4px solid transparent;padding:10px 14px 10px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.ord:hover{background:var(--soft)}
.ord.on{border-left-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--border-dk)}
.ord.done{opacity:.55}
.ord .r1{display:flex;gap:6px;align-items:baseline}
.ord .num{font-weight:800}
.ord .cust{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .r2{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.ord .prog{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px;text-transform:uppercase;white-space:nowrap;border:1px solid var(--border)}
.tag.asap{background:var(--amb-bg);border-color:var(--amb-bd);color:var(--amb)}
.tag.hard{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.tag.ok{background:var(--green-lt);border-color:#bfe0cd;color:var(--green)}
.tag.cart{background:#fffbd6;border-color:#ecec7a;color:#6b6b00}
.tag.grey{color:var(--muted)}

/* ---- this order ---- */
.c-order{padding:0 20px 40px}
.c-order h2{padding-left:0;padding-right:0}
.ohead{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.ohead .cust{font-size:22px;font-weight:800;text-transform:uppercase}
.ohead .num{font-size:30px;font-weight:800;grid-row:span 2;align-self:center}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.facts b{color:var(--text)}
.facts .printd{color:var(--text);background:var(--yellow);padding:1px 6px;border-radius:3px;font-weight:800}
.notes{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.xplan{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-top:10px}
.xph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.xph .btn{margin-left:auto}
.xph .amb{color:var(--amb)}
.xrow{border-top:1px solid var(--border);padding:7px 0}
.xrow .xd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.xrow .xd span{font-size:12px;color:var(--muted)}
.xrow .xr{font-size:13px;margin-top:3px}
.xflag{font-size:12px;background:var(--amb-bg);border:1px solid var(--amb-bd);color:#7a4f0d;border-radius:4px;padding:5px 8px;margin-top:5px}
.btn.sm{padding:4px 10px;font-size:12px}
.note{font-size:12px;background:var(--amb-bg);border:1px solid var(--amb-bd);border-radius:4px;padding:6px 8px}
.note b{color:var(--amb);text-transform:uppercase;font-size:12px;letter-spacing:.06em;margin-right:6px}

.line{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-top:12px}
.line.incart{border-color:#d9d96a}
.line.ordered{opacity:.7}
.lhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.lhead .g{font-weight:800;text-transform:uppercase}
.lhead .imp{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:2px 6px}
.lhead .st{margin-left:auto}
.flow{display:grid;grid-template-columns:minmax(0,max-content) minmax(200px,1fr) 180px;gap:0;align-items:stretch}
.flow .stage:first-child{overflow-x:auto}
.stage{padding:12px 12px;border-right:1px solid var(--border)}
.stage:last-child{border-right:none}
.stage h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.stage h4 .k{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
table.sz{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sz th{font-size:12px;color:var(--muted);font-weight:700;padding:0 4px 4px;text-align:center}
table.sz td{padding:2px;text-align:center}
table.sz td.lbl{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding-right:6px;text-transform:uppercase}
table.sz .q{font-weight:800;font-size:15px;min-width:28px;display:inline-block}
table.sz input{width:32px;text-align:center;border:1px solid var(--border);border-radius:4px;padding:3px 0;font-size:12px}
table.sz input:not(:placeholder-shown){border-color:var(--green);color:var(--green);font-weight:700}
table.sz .xb{width:32px;height:28px;border:1px dashed var(--border-dk);border-radius:6px;background:#fff;color:var(--muted);font-weight:800;cursor:pointer}
table.sz .xb:hover{border-color:var(--green);color:var(--green)}
table.sz .xb.on{border:1px solid var(--green);background:var(--green-lt);color:var(--green)}
table.sz .xb:disabled{cursor:default}
table.sz .tot{font-weight:800;padding-left:8px}
.wh{display:flex;flex-direction:column;gap:6px}
.whopt{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:6px;padding:6px 9px;cursor:pointer;background:#fff;text-align:left;width:100%}
.whopt:hover{border-color:var(--border-dk)}
.whopt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.whopt>span:first-child{min-width:0}.whopt .nm{font-weight:700;font-size:13px;white-space:nowrap}
.whopt .tr{font-size:12px;color:var(--muted)}
.whopt .arr{margin-left:auto;font-size:12px;font-weight:800;white-space:nowrap}
.arr.ok{color:var(--green)}.arr.tight{color:var(--amb)}.arr.late{color:var(--red)}.arr.unk{color:var(--muted)}
.find{display:flex;gap:6px;margin-top:6px}.find input{flex:1;min-width:0;font-size:14px;border:1px solid var(--border);border-radius:6px;padding:8px}
.addwh{flex:none;border:1px solid var(--border);background:var(--p-yellow);border-radius:6px;padding:0 12px;font-weight:700;font-size:13px;cursor:pointer}
.spell{margin-top:8px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spell b{color:var(--text)}.spell a{color:var(--green);font-weight:700}.spell select{font-size:12px;padding:4px;border:1px solid var(--border);border-radius:6px;max-width:100%}.spell button{border:1px solid var(--border);background:var(--yellow);border-radius:6px;padding:4px 10px;font-weight:700;font-size:12px;cursor:pointer}
.more{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:5px;background:#fff;width:100%}
.split{margin-top:10px;border-top:1px dashed var(--border-dk);padding-top:10px}
.split .sh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin-bottom:6px}
.linkbtn{background:none;border:none;color:var(--green);font-weight:700;font-size:12px;cursor:pointer;padding:0}
.linkbtn.red{color:var(--red)}
.cost label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:0 0 3px}
.cost input{width:100%;min-width:0;border:1px solid var(--border-dk);border-radius:4px;padding:6px 8px;font-size:14px;font-weight:700;text-align:right}
.cost .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cost .onfile{font-size:12px;color:var(--green);font-weight:700}
.go{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.btn{border:none;border-radius:6px;font-weight:800;padding:10px 14px;cursor:pointer;background:var(--ink);color:#fff;white-space:nowrap}
.btn.y{background:var(--yellow);color:var(--ink)}
.btn.g{background:var(--green);color:#fff}
.btn:disabled{background:var(--border);color:var(--muted-lt);cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border-dk)}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:40px 16px;color:var(--muted);text-align:center}

/* ---- carts ---- */
.carts{padding:0 12px 30px;display:flex;flex-direction:column;gap:12px}
.cartc{background:#fff;border-radius:6px;border:1px solid var(--border);overflow:hidden}
.cartc .ch{background:var(--ink);color:#fff;padding:10px 12px;display:flex;align-items:baseline;gap:8px}
.cartc .ch .nm{font-weight:800;text-transform:uppercase;font-size:13px}
.cartc .ch .tr{font-size:12px;color:#bbb}
.cartc .ch .pcs{margin-left:auto;font-weight:800;color:var(--yellow)}
.citem{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px}
.citem .t{display:flex;gap:6px;align-items:baseline}
.citem .t b{font-size:12px}
.citem .t .x{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
.citem .s{color:var(--muted);margin-top:2px}
.citem .grid{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.citem .grid span{border:1px solid var(--border-dk);border-radius:4px;min-width:38px;text-align:center;padding:2px 4px;font-variant-numeric:tabular-nums}
.citem .grid span i{display:block;font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.citem .grid span b{font-size:13px}
.citem .open{display:inline-block;margin-top:6px;font-weight:800;color:var(--green);text-decoration:none;font-size:12px}
.cfoot{padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.cfoot .r{display:flex;gap:6px}
.cfoot input{flex:1;border:1px solid var(--border-dk);border-radius:6px;padding:8px;font-weight:700;min-width:0}
.done-list .cartc .ch{background:var(--green)}
.done-list .cartc .ch .pcs{color:#fff}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:20px;padding:3px;margin-left:12px}
.tab{border:none;background:none;padding:6px 14px;border-radius:16px;font-weight:800;font-size:12px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--ink);color:#fff}
.tab span:not(:empty){background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:12px;margin-left:4px}
.hidden{display:none!important}
.steps{margin-left:auto;display:flex;gap:6px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.steps span{padding:4px 8px}.steps b{color:var(--text)}
.invwrap{flex:1;overflow:auto;padding:16px 20px 40px}
.invtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.invtop h1{font-size:18px;text-transform:uppercase}
.invtop .sum{color:var(--muted);font-size:13px}
.invtop .sum b{color:var(--text)}
.seg{display:flex;gap:4px;margin-left:auto}
.seg button{border:1px solid var(--border-dk);background:#fff;border-radius:16px;padding:5px 12px;font-weight:700;font-size:12px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.po{background:#fff;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden}
.po.ok{border-color:#bfe0cd}.po.bad{border-color:var(--red-bd)}
.poh{display:grid;grid-template-columns:150px minmax(0,1fr) 120px 150px 170px 24px;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.poh .pon{font-weight:800;font-size:15px}
.poh .pon small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.poh .whn{font-weight:700}.poh .whn small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.poh .amt{text-align:right}.poh .amt small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700}
.poh .amt b{font-size:16px;font-variant-numeric:tabular-nums}
.poh input{width:100%;border:1px solid var(--border-dk);border-radius:6px;padding:7px 8px;font-weight:800;text-align:right;font-size:15px}
.poh .chev{color:var(--muted)}
.stt{font-size:12px;font-weight:800;padding:4px 8px;border-radius:4px;text-align:center}
.stt.ok{background:var(--green-lt);color:var(--green)}.stt.bad{background:var(--red-bg);color:var(--red)}.stt.wait{background:var(--soft);color:var(--muted)}
.pol{border-top:1px solid var(--border);background:var(--soft)}
.pol table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.pol th{font-size:12px;color:var(--muted);text-transform:uppercase;text-align:left;padding:8px 14px 4px}
.pol td{padding:6px 14px;border-top:1px solid var(--border)}
.pol td.r,.pol th.r{text-align:right}
.pol tr.tot td{font-weight:800;background:#fff}
.pol .why{padding:10px 14px;font-size:12px;color:var(--red);border-top:1px solid var(--border);background:var(--red-bg)}
.thumb{width:44px;height:44px;border:1px solid var(--border-dk);border-radius:6px;overflow:hidden;background:#fff;padding:0;cursor:zoom-in;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lnotes{border-top:1px solid var(--border);padding:10px 16px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 14px;align-items:start;background:var(--soft)}
.nf label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amb);margin-bottom:3px}
.nf .sv{color:var(--green);text-transform:none;letter-spacing:0;font-weight:700;margin-left:4px}
.nf textarea{width:100%;border:1px solid var(--amb-bd);background:var(--amb-bg);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;resize:vertical}
.nf textarea:focus{outline:none;border-color:var(--amb);background:#fff}
.addnote{align-self:end;justify-self:start;font-size:12px;border:1px dashed var(--border-dk);border-radius:6px;padding:5px 8px;background:#fff;color:var(--muted)}
.issuebtn{border:1px solid var(--border-dk);background:var(--soft);color:var(--muted);font-weight:800;font-size:12px;border-radius:4px;padding:3px 8px;cursor:pointer}
.issuebtn:hover{border-color:var(--muted);color:var(--text)}
.iss-wrap{display:block!important;height:auto!important}
.pv-card:has(.iss-wrap){height:auto;width:min(680px,100%)}
.iss{padding:34px 28px 24px;max-width:640px}
.iss-r{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.iss-b{border:1px solid var(--border-dk);background:#fff;border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer}

/* ===== v106: Pine style v2 (black, white, cream, Pantone 107; red only for problems) ===== */
:root{--bg:#F7F0E4;--soft:#FBF7EF;--border:#E2D2B6;--border-dk:#CDBB9B;--green:#141412;--green-lt:#EFE2CD;--green-dk:#141412;

.top{background:#141412;color:#fff;border-bottom:none;padding:0 16px 0 0;min-height:56px;flex-wrap:wrap}
.brand{font:900 18px/1 var(--p-display);text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}

.top .tabs{background:rgba(255,255,255,.12)}.top .tab{color:#fff;font-size:13px}.top .tab.on{background:var(--yellow);color:#141412}
.top .steps{color:rgba(255,255,255,.6)}.top .steps b{color:#141412;background:var(--yellow)}
.top .pill{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.top .mode.practice{background:var(--yellow);color:#141412;border-color:var(--yellow)}
.top .mode.live{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
h1,h2,.invtop h1{font-family:var(--p-display)!important;font-weight:900!important;letter-spacing:.005em;word-spacing:.08em;text-transform:uppercase}
/* reprints (v106) */
.rpbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border)}
.rprow{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:10px;align-items:end;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:10px}

function normBrand(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim(); }
/* parse "{Brand} {Style} - {Color}" -> {brand, style} */
function parseGarment(name){
  var s = String(name||'').split(' - ')[0].trim();   // drop color
  var toks = s.split(/\s+/);
  if(toks.length<2) return {brand:'', style:toks[0]||''};
  var style = toks[toks.length-1];
  var brand = toks.slice(0,-1).join(' ');
  return {brand:brand, style:style};
}

/* ---- other vendors carry many of the same brands; gate jump pills by brand ----
   S&S = exact product page (best). AS Colour / SLC / Sanmar = style search
   ("land on results"). Search URLs flagged for a quick browser check — a wrong
   search path is a harmless miss, not a 404, and a one-line fix here. */
function setOf(list){ var m={}; list.forEach(function(k){ m[k]=true; }); return m; }
var SLC_BRANDS = setOf(['atlantis headwear','bella canvas','burnside','cap america','classic caps',
  'code v','comfort colors','decky','doggie skins','dri duck','dyenomite','flexfit','yupoong','gildan',
  'imperial','independent trading','infinity her','kati','lat','legacy','mega cap','next level',
  'outdoor cap','peter grimm','qtees','q tees','rabbit skins','richardson','shaka','shaka wear',
  'sierra pacific','sportsman','sublivie','the game','valucap']);
var SANMAR_BRANDS = setOf(['port company','port authority','sport tek','district','new era','nike','ogio',
  'eddie bauer','carhartt','the north face','gildan','hanes','jerzees','bella canvas','next level',
  'comfort colors','allmade','champion','fruit of the loom','anvil','alternative',
  'cornerstone','red house','rabbit skins','volunteer knitwear','tultex','russell athletic','red kap','bulwark']);

/* v98 — Airtable often shortens the brand ("Independent IND4000"): use the one S&S brand it starts, so those lines get S&S at all */
function ssSlug(bn){ if(SS_BRAND_SLUG[bn]) return SS_BRAND_SLUG[bn]; if(!bn) return '';
  var ks=Object.keys(SS_BRAND_SLUG).filter(function(k){ return k.indexOf(bn+' ')===0; }), sl=ks.map(function(k){ return SS_BRAND_SLUG[k]; });
  return sl.length && sl.every(function(x){ return x===sl[0]; })?sl[0]:''; }
function inSet(set,bn){ return !!bn && (!!set[bn] || Object.keys(set).some(function(k){ return k.indexOf(bn+' ')===0; })); }
/* returns [{label, url, primary}] for every top-4 vendor that carries this brand */
function vendorJumps(garment){
  var p = parseGarment(garment);
  if(!p.style) return [];
  var bn = normBrand(p.brand), style = p.style, out = [];
  var slug=ssSlug(bn);
  if(slug) out.push({ label:'S&S', primary:true,
    url:'https://www.ssactivewear.com/p/'+slug+'/'+encodeURIComponent(style.toLowerCase()) });
  if(bn==='as colour' || bn==='ascolour') out.push({ label:'AS Colour', primary:false,
    url:'https://ascolour.com/search.php?search_query='+encodeURIComponent(style) });
  if(inSet(SLC_BRANDS,bn)) out.push({ label:'SLC', primary:false,
    url:'https://slcactivewear.com/search.html?query='+encodeURIComponent(p.brand+' '+style) });
  if(inSet(SANMAR_BRANDS,bn)) out.push({ label:'Sanmar', primary:false,
    url:'https://www.sanmar.com/search/?text='+encodeURIComponent(p.brand+' '+style) });
  return out;
}

/* ============ HELPERS ============ */
function $(id){ return document.getElementById(id); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsJSON(k,d){ try{ var v=JSON.parse(lsGet(k)||'null'); return v==null?d:v; }catch(e){ return d; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function flat(v){
  if(v==null) return null;
  if(Array.isArray(v)) return v.length?flat(v[0]):null;
  if(typeof v==='object'){
    if(v.valuesByLinkedRecordId){ var ks=Object.keys(v.valuesByLinkedRecordId); return ks.length?flat(v.valuesByLinkedRecordId[ks[0]]):null; }
    if('name' in v) return v.name;
    if('id' in v) return v.id;
  }

function renderAll(){ renderOrders(); renderOrder(); renderCarts(); renderInv(); }
function setToken(){ var i=$('gearTok'); var t=i?i.value.trim():''; if(!t){ if(i){ i.classList.add('is-bad'); i.focus(); } return; }   // v114 — a field in ⚙ (was prompt())
  TOKEN=t; lsSet('pine_at_key',TOKEN); INV.rows=null; closeGear(); loadAll(); }
/* v107: token + practice live in the ⚙ menu */
function paintTok(){ var g=$('gearBtn'); g.innerHTML=TOKEN?'⚙':'⚙ <span class="dot" aria-hidden="true"></span>'; g.title=TOKEN?'Settings':'Settings: no Airtable token yet'; if(!$('gear').hidden) paintGear(); }
function paintMode(){ var b=$('modeBadge'); b.hidden=WRITES_ENABLED; b.title='Practice mode: nothing is saved'; }
function paintGear(){ $('gear').innerHTML='<div class="p-menu-row"><div class="p-menu-label">Airtable token</div>'
    +'<div class="p-menu-line"><span>'+(TOKEN?'<b>✓ Saved</b> on this computer':'<b>Not set.</b> Needed to load orders.')+'</span></div>'
    +'<div class="gear-tok"><input class="p-input" id="gearTok" type="password" placeholder="'+(TOKEN?'New token (pat…)':'Paste token (pat…)')+'" autocomplete="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')setToken()"><button class="p-btn p-btn-dark" onclick="setToken()">Save</button></div></div>'
    +'<div class="p-menu-row"><div class="p-menu-label">Practice mode</div>'
    +'<div class="p-menu-line"><span>'+(WRITES_ENABLED?'<b>Off.</b> Changes save to Airtable.':'<b>On.</b> Nothing is saved.')+'</span><button class="p-btn" onclick="setPractice('+WRITES_ENABLED+')">'+(WRITES_ENABLED?'Turn on':'Turn off')+'</button></div></div>'; }
function toggleGear(){ if($('gear').hidden){ paintGear(); $('gear').hidden=false; $('gearBtn').setAttribute('aria-expanded','true'); } else closeGear(); }
function closeGear(){ $('gear').hidden=true; $('gearBtn').setAttribute('aria-expanded','false'); }
async function setPractice(on){ if(Object.keys(RPS).some(function(k){ return RPS[k].edited; }) && !await PineConfirm.ask({title:'Switch practice mode?', body:'Unsaved reprint edits will be lost. Carts are kept.', ok:'Switch'})) return; var u=new URL(location.href); if(on) u.searchParams.set('practice','1'); else u.searchParams.delete('practice'); location.href=u.toString(); }
document.addEventListener('click',function(e){ if(!$('gear').hidden && !e.target.closest('#gear') && !e.target.closest('#gearBtn')) closeGear(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !$('gear').hidden) closeGear(); });
function refreshAll(){ if(window.PineUpdate&&PineUpdate.check) PineUpdate.check(); LIVE={}; LIVE_REQ={}; INV.rows=null; loadAll(); if(TAB==='past') loadInvoices(); if(TAB==='rp') loadReprints(); }
loadAll();
/* v113: also busy while a size edit is open. v106: self-update (pine-update.js). Busy while a cart has lines, a reprint is edited, a pop-up is open or a save is in flight (v107) */
window.pineBusy=function(){ try{ return SAVING>0 || Object.keys(SZ_EDIT).length>0 || Object.keys(cartItems()).length>0 || Object.keys(RPS).some(function(k){ return RPS[k].edited; }) || !$('pv').classList.contains('hidden'); }catch(e){ return true; } };
</script>
<script src="pine-update.js" data-link="pine-purchasing.html"></script>
<script>if(window.PineUpdate&&PineUpdate.ver) document.getElementById('verTag').textContent='v'+PineUpdate.ver;</script>
</body>
