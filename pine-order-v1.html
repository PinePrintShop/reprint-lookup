<!DOCTYPE html>
<!-- Order v1 (2026-11-23): one internal page per order, so every department sees the same picture.
     Stephen: better communication between departments ("has come up in a few reviews"). First piece: an order status page
     that every app can open (links into the other apps come after the review; notes/order-page.md lists where they go).
     - Open with order.html?order=11164 (order #) or ?id=rec… (Orders record id). Search by order # or customer; with nothing
       open, the active orders (due soonest first) and the orders you opened lately are there to pick from.
     - Header: order #, customer, status, rep, due date + Hard deadline / ASAP, ship method / pick-up, pcs, paid, turnaround.
     - Where it is now: Proof → Garments → Pre-press → Scheduled → Printed → Caught → Shipped / Picked up, each done / now /
       waiting with the date and who when Airtable has it, and what is holding the order up, in plain words.
     - Imprints, line items, issues (Order Issues + Backorders) and every department's notes in one place.
     - Read-only: GET requests only, nothing is ever written. ?practice=1 works (there is nothing to fake).
     Field IDs come from the apps that write them (Schedule v37, Catching v181, Receiving v91, Purchasing v124, Seps v55,
     Screens v37, Damage Log v25, Line Item Review v64, worker v55 /proxy/mockups); see notes/order-page.md. -->

.st-dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;border:2px solid var(--p-line-strong);background:var(--p-white);display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--p-sans);margin-top:-2px}
.st.is-done .st-dot{background:var(--p-black);border-color:var(--p-black);color:var(--p-white)}
.st.is-now{background:var(--p-yellow-lt);box-shadow:inset 4px 0 0 var(--p-yellow)}

function txt(v){ if(v==null) return ''; if(Array.isArray(v)) return v.map(txt).filter(Boolean).join(', '); if(typeof v==='object') return v.name||v.filename||v.text||''; return String(v).trim(); }
function arr(v){ return v==null||v===''?[]:Array.isArray(v)?v:[v]; }
function ids(v){ return arr(v).map(function(x){return typeof x==='string'?x:x&&x.id;}).filter(function(x){return /^rec[A-Za-z0-9]{14}$/.test(x||'');}); }
function num(v){ if(Array.isArray(v)) return v.reduce(function(a,x){return a+num(x);},0); var n=parseFloat(v); return isNaN(n)?0:n; }
function yes(v){ return Array.isArray(v)?v.some(yes):v===true||v===1||v==='1'||v==='true'; }
function plural(n,w){ return n+' '+w+(n===1?'':'s'); }

/* dates. Date fields ("2026-11-25") are calendar days; Scheduled Start Time is shop clock time marked Z (08:30Z = 8:30 am,
   Schedule / Operator); every other date-time is a real moment, shown in this computer's time. */
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(v){ v=arr(v)[0]; if(!v) return null; var s=String(v); var m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(m) return new Date(+m[1],m[2]-1,+m[3]); var d=new Date(s); return isNaN(d)?null:d; }
function shop(v){ v=arr(v)[0]; if(!v) return null; var d=new Date(String(v)); return isNaN(d)?null:new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes()); }
function day0(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function today(){ return day0(new Date()); }
function dd(a,b){ return Math.round((day0(b)-day0(a))/864e5); }
function fDay(d){ return d?DOW[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate():''; }
function fShort(d){ if(!d) return ''; var s=MON[d.getMonth()]+' '+d.getDate(); return d.getFullYear()!==today().getFullYear()?s+', '+d.getFullYear():s; }
function fTime(d){ var h=d.getHours(), m=d.getMinutes(); return (h%12||12)+(m?':'+String(m).padStart(2,'0'):'')+(h<12?'a':'p'); }
function rel(d){ if(!d) return ''; var n=dd(today(),d); return n===0?'today':n===1?'tomorrow':n===-1?'yesterday':(Math.abs(n)<7?fDay(d):fShort(d)); }
function relT(d){ return d?rel(d)+' '+fTime(d):''; }
function workdays(a,b){ var n=0, d=day0(a), e=day0(b); while(d<e){ d.setDate(d.getDate()+1); if(d.getDay()%6) n++; } return n; }
function latest(list){ var m=null; list.forEach(function(d){ if(d&&(!m||d>m)) m=d; }); return m; }

/* ---------- Airtable (GET only) ---------- */
function AtErr(msg,status){ this.message=msg; this.status=status; }
async function at(path,tries){
  tries=tries||0;
  var r=await fetch('https://api.airtable.com/v0/'+BASE+'/'+path,{headers:{Authorization:'Bearer '+token()}});
  if(r.status===429&&tries<3){ await new Promise(function(res){setTimeout(res,1100*(tries+1));}); return at(path,tries+1); }
  var j=await r.json().catch(function(){return {};});
  if(!r.ok) throw new AtErr((j.error&&(j.error.message||j.error.type))||('Airtable '+r.status),r.status);
  return j;
}
function fq(fields){ return fields.map(function(f){return '&fields%5B%5D='+f;}).join(''); }
async function list(tbl,o){
  var out=[], off='';
  do{ var j=await at(tbl+'?returnFieldsByFieldId=true&pageSize=100'+(o.formula?'&filterByFormula='+encodeURIComponent(o.formula):'')+(o.max?'&maxRecords='+o.max:'')+
      (o.sort?'&sort%5B0%5D%5Bfield%5D='+encodeURIComponent(o.sort)+'&sort%5B0%5D%5Bdirection%5D='+(o.dir||'asc'):'')+fq(o.fields)+(off?'&offset='+encodeURIComponent(off):''));
    out=out.concat(j.records||[]); off=j.offset||''; }while(off&&(!o.max||out.length<o.max));
  return out;
}
async function byIds(tbl,list_,fields){
  var u=list_.filter(function(x,i){return list_.indexOf(x)===i;}), parts=[];
  for(var i=0;i<u.length;i+=40) parts.push(list(tbl,{formula:'OR('+u.slice(i,i+40).map(function(id){return "RECORD_ID()='"+id+"'";}).join(',')+')',fields:fields}));
  var got=[].concat.apply([],await Promise.all(parts)), map={}; got.forEach(function(r){map[r.id]=r;});
  return u.map(function(id){return map[id];}).filter(Boolean);   // keep the order's own order
}
function vals(o){ return Object.keys(o).map(function(k){return o[k];}); }
var LINE_FIELDS=vals(L).concat([].concat.apply([],SIZES.map(function(s){return s.slice(1).filter(Boolean);})));

/* ---------- routing ---------- */
function params(){ return new URLSearchParams(location.search); }
function go(q,push){ var p=params(), keep=PRACTICE?'practice=1':''; var s=[q,keep].filter(Boolean).join('&'); var url=location.pathname+(s?'?'+s:'');
  if(push) history.pushState(null,'',url); else history.replaceState(null,'',url); route(); }
function route(){
  var p=params(), on=(p.get('order')||'').replace(/\D/g,''), id=p.get('id')||'';
  if(!token()){ showMenu(true); $('main').innerHTML='<div class="msg"><b>Paste the Airtable token</b>Open ⚙ (top right) and paste it once. It stays on this computer.</div>'; return; }
  if(/^rec[A-Za-z0-9]{14}$/.test(id)) return openOrder({id:id});
  if(on) return openOrder({num:on});
  if(p.get('q')){ $('q').value=p.get('q'); return search(p.get('q'),true); }
  home();
}
window.addEventListener('popstate',route);

/* ---------- home: active orders + recent ---------- */
var HOME_FIELDS=[O.num,O.cust,O.status,O.due,O.hard,O.rep,O.pcs];
function orow(r){ var f=r.fields, st=txt(f[O.status]), due=pd(f[O.due]), late=due&&dd(today(),due)<0&&DONE_ST.indexOf(st)<0;
  return '<button class="p-off-orow" type="button" data-num="'+esc(txt(f[O.num]))+'"><span class="p-id">#'+esc(txt(f[O.num]))+'</span>'+
    '<span class="p-off-orow-cust">'+esc(txt(f[O.cust])||'No customer')+'</span>'+
    '<span class="p-off-orow-sub">'+esc([st,due?'Due '+fDay(due):'',txt(f[O.rep])].filter(Boolean).join(' · '))+'</span>'+
    '<span class="p-off-orow-end">'+(late?'<span class="p-tag p-tag-alert">Late</span>':txt(f[O.hard])==='Hard Deadline'?'<span class="p-tag">Hard</span>':'')+'</span></button>'; }
function bindRows(root){ root.querySelectorAll('[data-num]').forEach(function(b){ b.onclick=function(){ go('order='+b.dataset.num,true); }; }); }
async function home(){
  S.o=null; $('homeBtn').hidden=true; document.title='Order v1 — Pine'; renderRecent();
  var seq=++S.seq, m=$('main');
  if(!S.home) m.innerHTML='<div class="loading">Loading active orders…</div>';
  try{
    if(!S.home) S.home=await list(T.ord,{formula:'AND({Invoice / Order Number},'+DONE_ST.map(function(s){return "{Order Status}!='"+s+"'";}).join(',')+')',fields:HOME_FIELDS,max:300});
    if(seq!==S.seq) return;
    var rows=S.home.slice().sort(function(a,b){ var x=pd(a.fields[O.due]), y=pd(b.fields[O.due]); return (x?x.getTime():9e15)-(y?y.getTime():9e15); });
    m.innerHTML='<div class="sec"><span class="p-section">Active orders <span class="p-count">'+rows.length+'</span></span><span class="hint">Due soonest first. Search by order # or customer above.</span></div>'+
      (rows.length?'<div class="olist">'+rows.map(orow).join('')+'</div>':'<div class="empty">No active orders.</div>');
    bindRows(m);
  }catch(e){ if(seq===S.seq) fail(e); }
}
function recentList(){ try{ return JSON.parse(store('pine_order_recent')||'[]')||[]; }catch(e){ return []; } }
function addRecent(n,c){ var l=recentList().filter(function(x){return x.n!==n;}); l.unshift({n:n,c:c}); store('pine_order_recent',JSON.stringify(l.slice(0,6))); }
function renderRecent(){ var l=recentList(), cur=S.o&&txt(S.o.fields[O.num]); l=l.filter(function(x){return x.n!==cur;});
  $('recent').hidden=!l.length;
  $('recent').innerHTML=l.map(function(x){return '<button class="p-tab" type="button" data-num="'+esc(x.n)+'" title="'+esc(x.c)+'">#'+esc(x.n)+'</button>';}).join('');
  bindRows($('recent')); }

/* ---------- search ---------- */
async function search(q,fromUrl){
  q=String(q||'').trim(); if(!q) return home();
  var seq=++S.seq, m=$('main'); S.o=null; $('homeBtn').hidden=false; renderRecent();
  m.innerHTML='<div class="loading">Finding “'+esc(q)+'”…</div>';
  var digits=/^#?\d{3,7}$/.test(q), s=q.replace(/^#/,'').replace(/["\\]/g,'');
  var f=digits?'{Invoice / Order Number}='+s:"FIND(LOWER(\""+s+"\"),LOWER({[TEXT] Customer Name}&''))";
  try{
    var rows=await list(T.ord,{formula:f,fields:HOME_FIELDS,max:40,sort:'Creation Date',dir:'desc'});
    if(seq!==S.seq) return;
    if(digits&&rows.length===1&&!fromUrl) return go('order='+txt(rows[0].fields[O.num]),true);
    m.innerHTML='<div class="sec"><span class="p-section">Found <span class="p-count">'+rows.length+'</span></span><span class="hint">“'+esc(q)+'”, newest first</span></div>'+
      (rows.length?'<div class="olist">'+rows.map(orow).join('')+'</div>':'<div class="empty">No order matches. Try the order number or part of the customer name.</div>');
    bindRows(m);
  }catch(e){ if(seq===S.seq) fail(e); }
}
function fail(e){ var auth=e&&(e.status===401||e.status===403);
  $('main').innerHTML='<div class="msg is-alert"><b>'+(auth?'Airtable refused the token':'Could not load from Airtable')+'</b>'+esc(e&&e.message||e)+(auth?' · Check the token in ⚙.':' · Tap Refresh to try again.')+'</div>';
  if(auth) showMenu(true); }

/* ---------- one order ---------- */
async function openOrder(k){
  var seq=++S.seq, m=$('main'); $('homeBtn').hidden=false;
  S.o=null; S.lines=[]; S.imps=[]; S.issues=[]; S.bos=[]; S.comments=null; S.commentsErr=false; S.part={};
  m.innerHTML='<div class="loading">Loading order '+esc(k.num||'')+'…</div>';
  try{
    var rows=await list(T.ord,{formula:k.id?"RECORD_ID()='"+k.id+"'":'{Invoice / Order Number}='+k.num,fields:vals(O),max:1});
    if(seq!==S.seq) return;
    if(!rows.length){ m.innerHTML='<div class="msg"><b>No order '+esc(k.num||k.id)+'</b>Check the number, or search by customer above.</div>'; return; }
    var o=S.o=rows[0], f=o.fields;
    addRecent(txt(f[O.num]),txt(f[O.cust])); renderRecent();
    document.title='#'+txt(f[O.num])+' '+txt(f[O.cust])+' — Order';
    render();                                                             // header first
    var pL=byIds(T.li,ids(f[O.lines]),LINE_FIELDS), pI=byIds(T.imp,ids(f[O.prints]),vals(I)),
        pX=byIds(T.iss,ids(f[O.issues]),vals(X)), pB=byIds(T.bo,ids(f[O.bos]),vals(B));
    var lines=await pL; if(seq!==S.seq) return; S.lines=lines; S.part.lines=true;
    var moreI=[], moreX=[], moreB=[];
    lines.forEach(function(l){ ids(l.fields[L.imps]).forEach(function(x){moreI.push(x);}); ids(l.fields[L.issues]).forEach(function(x){moreX.push(x);}); ids(l.fields[L.bos]).forEach(function(x){moreB.push(x);}); });
    var r=await Promise.all([pI,pX,pB]); if(seq!==S.seq) return;
    var have=function(a,list_){ return list_.filter(function(x){ return !a.some(function(r){return r.id===x;}); }); };
    var extra=await Promise.all([byIds(T.imp,have(r[0],moreI),vals(I)),byIds(T.iss,have(r[1],moreX),vals(X)),byIds(T.bo,have(r[2],moreB),vals(B))]);
    if(seq!==S.seq) return;
    S.imps=sortImps(r[0].concat(extra[0])); S.issues=r[1].concat(extra[1]); S.bos=r[2].concat(extra[2]); S.part.all=true;
    render();
    loadComments(seq);
  }catch(e){ if(seq===S.seq) fail(e); }
}
function sortImps(list_){ return list_.sort(function(a,b){ return txt(a.fields[I.id]).localeCompare(txt(b.fields[I.id]),undefined,{numeric:true}); }); }
/* Line Item comments (the record comments API, as Line Item Review); needs the token's comments read scope */
async function loadComments(seq){
  var out=[];
  try{
    await Promise.all(S.lines.map(async function(l){ var j=await at(T.li+'/'+l.id+'/comments?pageSize=100');
      (j.comments||[]).forEach(function(c){ out.push({line:l,c:c}); }); }));
  }catch(e){ S.commentsErr=true; }
  if(seq!==S.seq) return; S.comments=out; renderNotes();
}

/* ---------- model ---------- */
function impKind(f){ var t=txt(f[I.type]); if(SCREEN_TYPES.indexOf(t)>=0) return 'screen'; if(/^Finishing/.test(t)) return 'finish'; if(t==='Embroidery') return 'emb';
  if(t) return 'trim'; return num(f[I.screens])>0?'screen':'other'; }
function impLabel(f){ return txt(f[I.id])||'Imprint'; }
function lineName(l){ var f=l.fields; return txt(f[L.garment])||txt(f[L.nick])||'Line item'; }
function lineQty(f){ var o=0,e=0,a=0; SIZES.forEach(function(s){ o+=num(f[s[1]]); if(s[2]) e+=num(f[s[2]]); if(s[3]) a+=num(f[s[3]]); }); return {ord:o,ext:e,want:o+e,act:a}; }
function isGarment(l){ var t=txt(l.fields[L.ptype]); return !/^(Artwork|Pre-Order Setup Fees|Misc\.)$/.test(t)&&(lineQty(l.fields).ord>0||num(l.fields[L.total])>0); }
function boOpen(b){ return BO_OPEN.indexOf(txt(b.fields[B.status]))>=0; }
function boText(b){ var f=b.fields; return [txt(f[B.style]),txt(f[B.colour])].filter(Boolean).join(' ')+(txt(f[B.sizes])?' · '+txt(f[B.sizes]):'')+(num(f[B.qty])?' ×'+num(f[B.qty]):''); }
function issueOpen(x){ var s=txt(x.fields[X.status]); return s==='Awaiting Review'||s==='In progress'; }
function pickup(){ return /pick-?up/i.test(txt(S.o.fields[O.ship])); }
function linesOfImp(im){ var li=ids(im.fields[I.lines]); return S.lines.filter(function(l){ return li.indexOf(l.id)>=0||ids(l.fields[L.imps]).indexOf(im.id)>=0; }); }

/* The seven stages. state: done | now | wait | na. d = detail lines (html), b = what holds it up ({t, alert}) */
function stages(){
  var f=S.o.fields, st=txt(f[O.status]), rank=RANK[st]==null?0:RANK[st], lines=S.lines, imps=S.imps, all=!!S.part.all;
  var out=[];
  /* 1 Proof */
  (function(){ var s={k:'proof',name:'Proof',d:[],b:[]};
    var signedAt=pd(f[O.signedAt]), packet=arr(f[O.packet]).length>0, sent=!!txt(f[O.panda])||rank>=1;
    var withProof=lines.filter(function(l){return arr(l.fields[L.proofs]).length;}), ok=lines.filter(function(l){return yes(l.fields[L.proofOk]);});
    var sLines=lines.filter(function(l){return arr(l.fields[L.signed]).length;});
    var signed=!!(signedAt||packet)||(lines.length&&sLines.length===lines.length);
    if(signed){ s.state='done'; s.when=signedAt?'Signed '+rel(signedAt):'Signed'; }
    else if(rank>=2){ s.state='done'; s.when='Approved'; s.d.push('No signed packet saved in Airtable'); }
    else if(sent){ s.state='now'; s.when='Sent'; s.b.push({t:'Waiting on the customer to sign the proof'}); }
    else if(withProof.length){ s.state='now'; s.when='In review'; s.b.push({t:'Proofs in review: '+ok.length+' of '+lines.length+' lines approved'}); }
    else { s.state=lines.length||!all?'wait':'wait'; s.b.push({t:'Waiting on proofs from Art'}); }
    if(lines.length) s.d.push('<b>'+sLines.length+' of '+lines.length+'</b> lines have their signed page'+(withProof.length<lines.length?' · '+(lines.length-withProof.length)+' without a proof':''));
    lines.forEach(function(l){ var c=txt(l.fields[L.check]); if(!c) return; var first=c.split('\n')[0], ii=txt(l.fields[L.impIds])||lineName(l);
      if(/^\s*CHECK/i.test(first)) s.b.push({t:ii+': signed page doesn\'t match ('+first.replace(/^\s*CHECK\s*·?\s*/i,'')+')',alert:true});
      else if(/^\s*NOT INITIALED/i.test(first)) s.b.push({t:ii+': customer didn\'t initial the proof'+(first.match(/page \d+/i)?' ('+first.match(/page \d+/i)[0]+')':'')}); });
    var paid=pd(f[O.paid]);
    s.d.push(paid?'Paid '+rel(paid):'<span>Not paid yet</span>');
    if(!paid&&signed&&rank<3) s.b.push({t:'Waiting on payment'});
    out.push(s); })();
  /* 2 Garments */
  (function(){ var s={k:'garments',name:'Garments',d:[],b:[]};
    var g=lines.filter(isGarment), ord=g.filter(function(l){return yes(l.fields[L.ordered])||yes(l.fields[L.stock]);}), rec=g.filter(function(l){return yes(l.fields[L.received]);});
    var pos=[]; g.forEach(function(l){ var p=txt(l.fields[L.po]), v=txt(l.fields[L.supplier]); if(p) pos.push(p+(v?' ('+v+')':'')); });
    pos=pos.filter(function(x,i){return pos.indexOf(x)===i;});
    if(!g.length){ s.state=all?'na':'wait'; s.when=all?'No garments to order':''; }
    else if(rec.length===g.length){ s.state='done'; var t=latest(rec.map(function(l){return pd(l.fields[L.receivedAt]);})); s.when='All in'+(t?' '+rel(t):''); }
    else if(ord.length){ s.state='now'; s.when=rec.length?rec.length+' of '+g.length+' lines in':'Ordered'; }
    else s.state='wait';
    if(g.length) s.d.push('Ordered <b>'+ord.length+' of '+g.length+'</b>'+(pos.length?' · PO '+esc(pos.join(', ')):''));
    if(g.length&&rec.length) s.d.push('In <b>'+rec.length+' of '+g.length+'</b>');
    g.forEach(function(l){ var lf=l.fields, q=lineQty(lf), nm=lineName(l);
      if(yes(lf[L.misship])&&!yes(lf[L.misshipRes])) s.b.push({t:'Mis-ship on '+nm+(txt(lf[L.misshipDet])?': '+txt(lf[L.misshipDet]).split('\n')[0]:''),alert:true});
      if(yes(lf[L.received])&&q.act>0&&q.act<q.want) s.d.push('<span class="bad">'+esc(nm)+': '+q.act+' of '+q.want+' in</span>');
      if(!yes(lf[L.received])&&(yes(lf[L.ordered])||yes(lf[L.stock]))){ var eta=pd(lf[L.arrival]); s.b.push({t:'Not in yet: '+nm+(txt(lf[L.po])?' (PO '+txt(lf[L.po])+')':'')+(eta?' · expected '+rel(eta):'')}); }
      if(!yes(lf[L.ordered])&&!yes(lf[L.stock])&&rank>=2) s.b.push({t:'Not ordered yet: '+nm}); });
    S.bos.filter(boOpen).forEach(function(b){ var bf=b.fields, eta=pd(bf[B.eta]), stt=txt(bf[B.status]);
      s.b.push({t:'Backorder: '+boText(b)+' · '+stt+(eta?' · restock '+rel(eta):'')+(stt==='Back in stock'&&txt(bf[B.stock])?' · '+txt(bf[B.stock]).split('\n')[0]:'')}); });
    out.push(s); })();
  /* 3 Pre-press */
  (function(){ var s={k:'prepress',name:'Pre-press',d:[],b:[]};
    var need=imps.filter(function(im){ var k=impKind(im.fields); return k==='screen'||k==='trim'; }), done=0, any=0, when=[], who=[];
    need.forEach(function(im){ var x=im.fields, k=impKind(x), id=impLabel(x), miss=[];
      if(k==='screen'){ if(!yes(x[I.sepd])) miss.push('not sep\'d'); if(!yes(x[I.burned])) miss.push('screens not burned'); if(!yes(x[I.inksReady])) miss.push('inks not mixed');
        if(yes(x[I.sepd])||yes(x[I.burned])||yes(x[I.inksReady])) any++;
        when.push(pd(x[I.sepdAt]),pd(x[I.burnedAt]),pd(x[I.inksAt])); if(txt(x[I.separator])) who.push(txt(x[I.separator])); }
      else { if(!yes(x[I.trims])) miss.push(yes(x[I.sepd])?'transfers ordered, not in yet':'transfers / trims not in'); else any++; }
      var d=shop(x[I.start]), soon=!!d&&dd(today(),d)>=0&&dd(today(),d)<=1&&!yes(x[I.finished]);   // prints today / tomorrow: say so first
      if(!miss.length) done++; else s.b.push({t:id+(soon?' prints '+rel(d)+': ':': ')+miss.join(', '),soon:soon}); });
    s.b.sort(function(a,b){return (b.soon?1:0)-(a.soon?1:0);});
    if(!need.length){ s.state=all?'na':'wait'; s.when=all&&imps.length?'Nothing to prep':''; }
    else if(done===need.length){ s.state='done'; var t=latest(when); s.when='Ready'+(t?' '+rel(t):''); }
    else { s.state=any||done?'now':'wait'; s.when=done+' of '+need.length+' ready'; }
    if(need.length) s.d.push(need.map(function(im){ var x=im.fields, k=impKind(x), ok=k==='screen'?yes(x[I.sepd])&&yes(x[I.burned])&&yes(x[I.inksReady]):yes(x[I.trims]);
      return '<b>'+esc(impLabel(x))+'</b> '+(ok?'✓':'…'); }).join(' · '));
    who=who.filter(function(x,i){return who.indexOf(x)===i;}); if(who.length) s.d.push('Sep\'d by '+esc(who.join(', ')));
    out.push(s); })();
  /* 4 Scheduled */
  (function(){ var s={k:'scheduled',name:'Scheduled',d:[],b:[]};
    var pr=imps.filter(function(im){return impKind(im.fields)!=='finish';}), sch=pr.filter(function(im){return shop(im.fields[I.start]);});
    if(!pr.length){ s.state=all?'na':'wait'; }
    else if(sch.length===pr.length){ s.state='done'; var first=sch.map(function(im){return shop(im.fields[I.start]);}).sort(function(a,b){return a-b;})[0]; s.when=rel(first)+' '+fTime(first); }
    else { s.state=sch.length?'now':'wait'; s.when=sch.length?sch.length+' of '+pr.length+' on the schedule':''; }
    sch.forEach(function(im){ var x=im.fields, d=shop(x[I.start]);
      s.d.push('<b>'+esc(impLabel(x))+'</b> '+esc(pressName(txt(x[I.equip])))+' · '+esc(relT(d))+(yes(x[I.rpLock])?' · re-print locked':yes(x[I.locked])?' · locked':'')); });

    run.forEach(function(im){ var x=im.fields; s.d.push('<b>'+esc(impLabel(x))+'</b> '+(yes(x[I.running])?'printing now':'setting up')+(txt(x[I.operator])?' · '+esc(txt(x[I.operator])):'')); });

  S.imps.forEach(function(im){ var x=im.fields, id=impLabel(x);
    add('Pre-press','Print notes · '+id,x[I.printNotes]); add('Ink','Ink notes · '+id,x[I.inkNotes]); add('Schedule','Scheduling notes · '+id,x[I.schedNotes]); add('Press','Job comments · '+id,x[I.jobComments]); });
  (S.comments||[]).forEach(function(c){ var t=String(c.c.text||''), m=t.match(/^\[([^\]]+)\]\s*/), who=m?m[1]:(c.c.author&&(c.c.author.name||c.c.author.email))||'';
    add('Comment','Line comment · '+lineName(c.line),m?t.slice(m[0].length):t,pd(c.c.createdTime),who); });
  out.sort(function(a,b){ if(a.when&&b.when) return b.when-a.when; if(a.when) return -1; if(b.when) return 1; return DEPTS.indexOf(a.dept)-DEPTS.indexOf(b.dept); });
  return out;
}
function renderNotes(){
  var el=$('notes'); if(!el||!S.o) return;
  var items=noteItems();
  el.innerHTML=(items.length?items.map(function(n,i){ var long=n.t.split('\n').length>6||n.t.length>420;
    return '<div class="note"><div class="note-h"><span class="p-tag p-tag-soft">'+esc(n.dept)+'</span><span>'+esc(n.src)+'</span>'+
      (n.when||n.who?'<span class="when">'+esc([n.who,n.when?relT(n.when):''].filter(Boolean).join(' · '))+'</span>':'')+'</div>'+
      '<div class="note-t'+(long?' is-long':'')+'" id="nt'+i+'">'+esc(n.t)+'</div>'+(long?'<button class="p-btn p-btn-quiet more" type="button" data-n="'+i+'">Show all</button>':'')+'</div>'; }).join('')
    :'<div class="empty">No notes on this order.</div>')+
    (S.comments==null?'<div class="loading">Loading line comments…</div>':S.commentsErr?'<div class="empty">Line comments didn\'t load (the token may not have the comments read scope).</div>':'');
  el.querySelectorAll('.more').forEach(function(b){ b.onclick=function(){ var t=$('nt'+b.dataset.n); var open=t.classList.toggle('is-long'); b.textContent=open?'Show all':'Show less'; }; });
}

/* ---------- bar, menu, search box ---------- */
function showMenu(on){ $('gear').hidden=!on; $('gearBtn').setAttribute('aria-expanded',on);
  if(on){ $('tokHint').textContent=token()?'A token is saved on this computer.':'No token yet: paste it to load orders.'; setTimeout(function(){$('tokIn').focus();},0); } }
$('gearBtn').onclick=function(){ showMenu($('gear').hidden); };
document.addEventListener('pointerdown',function(e){ if(!$('gear').hidden&&!e.target.closest('#gear,#gearBtn')&&token()) showMenu(false); });
$('tokSave').onclick=function(){ var v=$('tokIn').value.trim(); if(!v) return; store('pine_at_key',v); $('tokIn').value=''; showMenu(false); S.home=null; route(); };
$('tokIn').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); $('tokSave').click(); } });
$('findForm').onsubmit=function(e){ e.preventDefault(); var q=$('q').value.trim(); if(!q) return go('',true); $('q').blur();
  if(/^#?\d{3,7}$/.test(q)) return go('order='+q.replace(/\D/g,''),true); go('q='+encodeURIComponent(q),true); };
$('homeBtn').onclick=function(){ $('q').value=''; go('',true); };
$('refreshBtn').onclick=async function(){ try{ if(window.PineUpdate&&PineUpdate.check&&await PineUpdate.check()) return; }catch(e){} S.home=null; route(); };
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('gear').hidden) showMenu(false);
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){ e.preventDefault(); $('q').focus(); } });
window.pineBusy=function(){ return false; };   // read-only: nothing is ever mid-task, so a new version can load straight away
if(PRACTICE) $('practicePill').hidden=false;
route();
</script>
<script>if(window.PineUpdate&&PineUpdate.ver)document.getElementById('ver').textContent='v'+PineUpdate.ver;</script>
